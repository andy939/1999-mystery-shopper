月仍僅需繳付基本頻道收視費（最多）490元。\nC.如王先生5月間決定將家中套房出租，並且已經出租，因屬營業之租賃行為，王先生應另外與有線電視系統業者依民事規定議定出租套房部分的收視費用。","u":"臺北市政府觀光傳播局","h":13054,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=02728BA34E0E7E83","d":"2021-03-02","sid":"02728BA3"},{"q":"請問觀光傳播局目前提供旅客索取觀光文宣品種類及索取地點？","a":"臺北市政府觀光傳播局目前出版臺北市觀光文宣有臺北市觀光地圖摺頁等 ，上列文宣均置放於臺北市各旅遊服務中心，及不定期提供各縣市旅服中心、機場，提供旅客免費索取。或亦可至「台北旅遊網」線上瀏覽（影音刊物→出版品）(https://www.travel.taipei/zh-tw)。如有其他問題，可電洽本局傳播服務科詢問（電話：臺北市民當家熱線1999（外縣市請撥 02-27208889）轉7564）。\n此外，新浪微博上建立之「趣台北」微博(http://weibo.com/taipeitravelnet)，也隨時分享臺北市好吃、好玩、好看、圖文並茂的訊息內容。","u":"臺北市政府觀光傳播局","h":10253,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=39F1C01B26D8795F","d":"2020-05-19","sid":"39F1C01B"},{"q":"請問如何索取當期的《台北畫刊》、《TAIPEI》、《台北事》及過期的《台北畫刊》、《TAIPEI》、《台北事》？","a":"一、當期的《台北畫刊》，您可至臺北市市府大樓1樓市民服務組、臺北捷運中正紀念堂站、臺北捷運西門站、臺北捷運忠孝復興站、臺北捷運台北車站、臺北捷運民權西路站、臺北捷運市政府站、捷運環狀線、臺北市各旅遊服務中心、臺北市各區公所、稅捐處、臺北市立圖書館總館及各分館等處索取，外縣市可至交通部觀光署輔導各地旅遊服務中心及各國家風景區遊客中心免費索取，索完為止。\n二、當期的《TAIPEI》英文季刊您可至臺北市市府大樓1樓市民服務組、臺北捷運中正紀念堂站、臺北捷運西門站、臺北捷運忠孝復興站、臺北捷運台北車站、臺北捷運民權西路站、臺北捷運市政府站、捷運環狀線、臺北市各旅遊服務中心、臺北市立圖書館總館及各分館等地免費索取，索完為止。外縣市由交通部觀光署管理之旅遊服務中心亦提供少量索取。\n三、當期的《台北事》您可至臺北市市府大樓1樓市民服務組、臺北市各區公所、戶政事務所、稅捐處、臺北市各里辦公處、臺北市立圖書館總館及各分館等地免費索取，索完為止。\n四、過期的《台北畫刊》、《TAIPEI》英文季刊及《台北事》，您可先電洽本局傳播服務科（電話：臺北市民當家熱線1999/02-27208889轉7563、7566 、 2029）詢問所需期數之庫存情形，如尚有庫存，您可親至觀傳局4樓傳播服務科索取，或採附回郵方式索取；或至《台北旅遊網》官方網站，即可看到過往刊物，相關網址如下：\n《台北畫刊》https://www.travel.taipei/zh-tw/pictorial\n《TAIPEI》英文季刊 https://www.travel.taipei/en/pictorial\n《台北事》https://www.travel.taipei/zh-tw/media/publication/taipei-news\n另本局於國家圖書館、立法院國會圖書館、國立臺灣圖書館、國立臺灣大學圖書館、國立公共資訊圖書館、臺南市立圖書館、高雄市立圖書館總館、屏東縣立圖書館總館、 國立東華大學圖書館、臺北市立圖書館等處均寄存有《台北畫刊》、《TAIPEI》英文季刊年度合訂本，您亦可至上述圖書館查閱。\n四、對於不便至各放置點","u":"臺北市政府觀光傳播局","h":8648,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DBC3E0B855DA8F05","d":"2025-02-26","sid":"DBC3E0B8"},{"q":"要經營旅館業該如何申請?流程為何?","a":"本市經營旅館業，除依法公司或商業登記外，並應向臺北市政府觀光傳播局申請登記，申請表單請至台北服務通 (https://service.taipei) ／ 機關 ／ 觀傳局／臺北市旅館業設立登記下載(https://service.taipei/case-detail/AS023)。經審查及會同本府各機關檢查通過者，核發旅館業登記證及旅館業專用標識後，始得營業。","u":"臺北市政府觀光傳播局","h":7970,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F587AF582D3C091C","d":"2020-05-19","sid":"F587AF58"},{"q":"臺北市哪些地方可以經營民宿？該如何申請？","a":"臺北市因都會特性及法規限制，目前「陽明山國家公園」、「合法立案之休閒農場或休閒農業區內農舍」、「依文化資產保存法指定或登錄之古蹟、歷史建築、紀念建築、聚落建築群、史蹟及文化景觀，已擬具相關管理維護或保存計畫之區域」及「具人文或歷史風貌之相關區域」可設置民宿。申請人應先檢附申請書及相關資料，向觀光傳播局申請登記，並於領取民宿登記證及專用標識後，始得開始經營。詳細規定請參閱「民宿管理辦法」，或至交通部觀光局行政資訊系統（https://admin.taiwan.net.tw/） /業務資訊/觀光產業/旅館及民宿/民宿/民宿登記說明查詢，或至本府台北服務通網站之「臺北市民宿設立登記」（https://service.taipei/case-detail/AS011）線上申辦及下載相關表單。","u":"臺北市政府觀光傳播局","h":7823,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=966101352750859C","d":"2020-05-19","sid":"96610135"},{"q":"如何檢舉日租套房?","a":"1.民眾若發現業者疑似經營日租套房，可提供相關事證，有助觀光傳播局更快查明，若僅有地址或部分資訊亦請提供觀光傳播局參考及查證，如觀光傳播局查獲具體違規事證，將依法核處。\n2.如民眾想申請檢舉獎金，需有明確樓層門牌地址、聯絡電話、訂房往來或匯款紀錄、經營業者姓名，現場照片與網站等資料提供觀光傳播局，如觀光傳播局查獲具體違規事證，將依法核處，檢舉者可依規定申請檢舉獎金。","u":"臺北市政府觀光傳播局","h":7365,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FEED9C6EA0E92A98","d":"2020-05-19","sid":"FEED9C6E"},{"q":"泡溫泉時應注意事項有哪些?","a":"為確保民眾能夠安全的享受泡湯之樂，溫泉標章申請使用辦法第9條規定領有溫泉標章之溫泉場所必須在明顯處張貼下列禁忌及注意事項，提醒泡湯民眾多加留意： （1）入浴前應先徹底洗淨身體。 （2）患有心臟病、肺病、高血壓、糖尿病及其他循環系統障礙等慢性疾病者，應依照醫師指示入浴。 （3）入浴前後應適量補充水分。 （4）入浴應依序足浴、半身浴、全身浴，浸泡高度不宜超過心臟。 （5）入浴後有任何不適，請即出浴並通知服務人員。 （6）長途跋涉、疲勞過度或劇烈運動後，宜稍作休息再入浴。 （7）患有傳染性疾病者禁止入浴。 （8）女性生理期間禁止入浴。 （9）禁止攜帶寵物入浴。 （10）孕婦、行動不便者、老人及兒童，應避免單獨一人入浴。 （11）酒醉、空腹及飽食後，不宜入浴。 （12）入浴時間1次不宜超過15分鐘，總時間不宜超過1小時。 （13）出浴後不宜直接進入烤箱。 註：依個人泡湯當時的身體狀況、泡湯方式及溫泉溫度、特性及場所而自行斟酌調整浸泡時間。","u":"臺北市政府觀光傳播局","h":6538,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=98D5298DA99649FA","d":"2020-05-19","sid":"98D5298D"},{"q":"如遇旅遊消費爭議如何申訴?","a":"請上行政院消費者保護會申訴(https://appeal.cpc.ey.gov.tw/WWW/Default.aspx)、或撥打1950，或直接到市政大樓1樓消費者服務中心申訴。","u":"臺北市政府觀光傳播局","h":6071,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=172B96302BB96065","d":"2020-05-19","sid":"172B9630"},{"q":"請問如何分辨旅館是否合法？","a":"合法旅館核發旅館業登記證及旅館業專用標識；合法觀光旅館領有觀光旅館業營業執照及觀光旅館業專用標識，供其懸掛於明顯處以資區別，詳細合法旅館名單請至臺灣旅宿網（https://taiwanstay.net.tw/）查詢。","u":"臺北市政府觀光傳播局","h":5871,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2A2BE7756FEBCC5E","d":"2020-05-19","sid":"2A2BE775"},{"q":"有線電視可否暫停及終止收視？如何辦理？","a":"（1）收視戶如暫時無收視需求，可於契約有效期間內向有線電視業者申請暫停收視及復機者，免收基本頻道收視費，及復機費。如申請暫停後已超過契約有效期間，契約終止3個月內 (含3個月) 申請復機者，免收復機費；契約終止3個月後申請復機者，視為新裝機戶，比照一般裝機費收費。 （2）為保障收視戶權益，避免他人冒用身分，有線電視業者多建議收視戶備妥個人基本資料（如身分證、駕照或健保卡），逕至服務櫃台辦理，若是辦理終止收視，需繳回機上盒等相關設備。如不便親自辦理，可先洽有線電視業者是否有其他處理方式。 （3）詳細辦理流程請洽各有線電視客服或上網站查詢。","u":"臺北市政府觀光傳播局","h":5857,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=44B5BC1417A7E265","d":"2020-05-19","sid":"44B5BC14"},{"q":"臺北市溫泉標章核發現況?","a":"一、截至114年10月31日止，本市共有46家業者取得溫泉標章，其中新北投溫泉區34家、行義路溫泉區8家、中山樓溫泉區1家、馬槽溫泉區1家、大安區1家、中山區1家。\n二、業者取得標章情形可上交通部觀光局行政資訊系統網查詢 連結","u":"臺北市政府觀光傳播局","h":5642,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B0967DA70E3C8A27","d":"2024-05-15","sid":"B0967DA7"},{"q":"臺北市各有線電視業者服務範圍？服務電話？","a":"（1）北投、士林\n陽明山有線電視公司：02-6606-0058、0809-001015\n（2）中山、大同、松山\n長德有線電視公司：02-2165-3153、0800-088909\n金頻道有線電視公司：02-66066855、0809-001016\n（3）內湖、南港、信義\n麗冠有線電視公司：02-2165-3157、0800-222868\n新台北有線電視公司：02-6601-5008、0809-001017\n（4）大安、文山\n萬象有線電視公司：02-2165-3156、0800-600608\n大安文山有線電視公司：02-6602-5898、0809-001018\n（5）中正、萬華\n聯維有線電視公司：02-2311-8899、0800-231021\n寶福有線電視公司：02-2311-6378、0800-363999\n（6）全市(服務範圍以業者公布為準)\n北都數位有線電視公司：02-7734-0088、0809-096-111\n數位天空有線電視公司：02-2165-3123、0800-878-688","u":"臺北市政府觀光傳播局","h":5502,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A3D59C41911EF2E4","d":"2020-05-19","sid":"A3D59C41"},{"q":"請問《台北畫刊》、《TAIPEI》英文季刊及《台北事》何時出刊？","a":"《台北畫刊》每逢1、3、5、7、9、11月5日出刊；《TAIPEI》每逢3、6、9、12月10日出刊；《台北事》每月25日出刊。","u":"臺北市政府觀光傳播局","h":5409,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C24C8C6F49C341C1","d":"2020-05-19","sid":"C24C8C6F"},{"q":"申請溫泉標章需準備哪些書件?","a":"依據溫泉標章申請使用辦法第7條之規定，申請溫泉標章需檢具下列書件： （1）申請人經營相關事業之設立或登記證明文件。 （2）以獨資或合夥方式經營者，其負責人之身分證明文件；為法人、非法人團體者，其代表人之身分證明文件。 （3）溫泉水權狀或溫泉取供事業之供水證明。 （4）申請前3個月內經交通部認可之機關（構）、團體檢驗符合溫泉標準之溫泉檢驗證明書。 （5）申請前2個月內衛生單位出具之溫泉浴池水質微生物檢驗合格報告。 （6）委託申請時，應提出委託書及代理人之身分證明文件。 第（1）項之證明文件包括觀光旅館業營業執照、旅館業登記證、民宿登記證、觀光遊樂 業執照、休閒農場登記證、餐廳、浴室等相關事業之公司登記或商業登記證明文件（申請人為政府機關者免附）。","u":"臺北市政府觀光傳播局","h":5259,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6A7FB35DC92ABB91","d":"2020-05-19","sid":"6A7FB35D"},{"q":"請問如何購買觀光傳播局所出版的「臺北觀光行銷叢書」？","a":"您可至政府出版品展售門市洽購：五南文化廣場及其網路書店、國家書店松江門市及其網路書店；另亦可至三民書局、誠品、紅螞蟻、博客來網路等書店洽詢購買。","u":"臺北市政府觀光傳播局","h":5107,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0BA9CA44EE278E0A","d":"2015-10-14","sid":"0BA9CA44"},{"q":"刊登酒類廣告有何規定？","a":"「菸酒管理法」第 37 條規定酒的廣告或促銷，應明顯標示「禁止酒駕」，並應標示「飲酒過量，有害健康」或其他警語，且不得有下列情形：\n（1）違背公共秩序或善良風俗。\n（2）鼓勵或提倡飲酒。\n（3）以兒童、少年為對象，或妨害兒童、少年、孕婦身心健康。\n（4）虛偽、誇張、捏造事實或易生誤解之內容。\n（5）暗示或明示具醫療保健效果之標示、廣告或促銷。\n（6）其他經中央主管機關公告禁止之情事。","u":"臺北市政府觀光傳播局","h":5045,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2783CE4B22DB5653","d":"2020-05-19","sid":"2783CE4B"},{"q":"檢舉日租套房是否只要提供地址就可以了?","a":"1.民眾若發現業者疑似經營日租套房，可提供相關事證，有助觀光傳播局更快查明，若僅有地址或部分資訊亦請提供觀光傳播局參考及查證，如觀光傳播局查獲具體違規事證，將依法核處。\n2.如民眾有明確樓層門牌地址、聯絡電話、訂房往來或匯款紀錄、經營業者姓名，現場照片與網站等資料提供觀光傳播局，如觀光傳播局查獲具體違規事證，將依法核處，檢舉者可依規定申請檢舉獎金。","u":"臺北市政府觀光傳播局","h":4999,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3A6EE4D94CB194A1","d":"2020-05-19","sid":"3A6EE4D9"},{"q":"個別旅客訂房定型化契約範本為何?","a":"交通部觀光局已於106年7月21日以觀宿字第1060600630號函頒修觀光旅館業、旅館業或民宿「個別旅客訂房定型化契約」範本，民眾可至交通部觀光署行政資訊網(https://admin.taiwan.net.tw)/業務資訊/觀光法規/個別旅客訂房定型化契約範本（原名稱：觀光旅館業與旅館業及民宿個別旅客直接訂房定型化契約範本）查詢及下載。","u":"臺北市政府觀光傳播局","h":4934,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=03E3ED360279384C","d":"2020-05-19","sid":"03E3ED36"},{"q":"「Taipei FunPASS北北基好玩卡」相關FAQ","a":"Q:什麼是「Taipei FunPASS北北基好玩卡」?\nA: 臺北市政府為配合交通部觀光署「台灣好玩卡」計畫並推動城市觀光，整合北北基三市觀光資源，並結合旅遊票證及使用指南，委託悠遊卡股份有限公司發行「Taipei FunPASS北北基好玩卡」，共推出「北北基好玩卡|交通暢遊卡」、「北北基好玩卡|無限暢遊卡成人版」、「北北基好玩卡|無限暢遊卡兒童版」、「北北基好玩卡|經典景點卡」、「北北基好玩卡|北北基桃景點暢遊卡」共計五系列票卡。\nQ:請問「北北基好玩卡|交通暢遊卡」的售價？\nA: 票卡種類/價格：一日券210元、二日券340元、三日券470元、五日券730元。\nQ:請問「北北基好玩卡|交通暢遊卡」的使用方式？\nA:可持票卡在期限內無限次數搭乘臺北捷運及臺北市、新北市、基隆市公車，另包括6條「台灣好行」九份金瓜石線、北投竹子湖線、木柵平溪線、皇冠北海岸線、黃金福隆線及濱海奇基線皆可無限次搭乘。(不包含編碼4碼之公路客運及專車)\nQ:請問在哪裡可以買到「北北基好玩卡|交通暢遊卡」？\nA:可上北北基好玩卡官網(https://funpass.travel.taipei)購買，或於臺北捷運各站及悠遊卡市府轉運站客服中心皆可購買。相關訊息可上北北基好玩卡官網(https://funpass.travel.taipei)查詢，或電洽悠遊卡股份有限公司客服專線02-412-8880或臺北捷運公司24小時客服中心02-218-12345查詢。\nQ:什麼是「北北基好玩卡|無限暢遊卡」？\nA: 此卡是針對海外來台觀光客設計，提供成人版與兒童版觀光客選購。「北北基好玩卡|無限暢遊卡」的產品內容包含交通暢遊Day Pass、台鐵平溪深澳一日週遊券及30處以上景點門票+文化體驗(包含大稻埕FunLAB「我的茄芷袋」(加贈大稻埕禮品兌換券)、平溪四色天燈體驗、貓空小封茶體驗、九份紅燈籠祈福體驗、九份賴阿婆芋圓兌換券、北投少帥禪園美人足浴體驗(含戶外園區參觀)及阿聰師鳳梨酥/芋頭酥2選1)，2026年度無限暢遊卡再度推出獨家限量紀念品！讓旅客可帶回充滿台灣特色的「台灣龍虎夜市杯」，可至西門町遊","u":"臺北市政府觀光傳播局","h":4780,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5FBAC4D99BB609C6","d":"2025-10-29","sid":"5FBAC4D9"},{"q":"臺北旅遊網的網址及內容為何?","a":"臺北旅遊網網址:https://www.travel.taipei/。提供臺北市旅遊景點簡介、交通及住宿資訊、最新旅遊活動、建議行程等。","u":"臺北市政府觀光傳播局","h":4599,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=76A025CB82E0C679","d":"2020-05-19","sid":"76A025CB"},{"q":"溫泉標章標識牌有效期間為幾年?","a":"依據溫泉標章申請使用辦法第10條規定，溫泉使用事業使用溫泉標章標識牌的有效期間為3年，應於有效期間屆滿2個月前申請換發。","u":"臺北市政府觀光傳播局","h":4564,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=808231D337846A4C","d":"2020-05-19","sid":"808231D3"},{"q":"請問「臺北市觀光活動補助」申請規定及收件時間？","a":"一、申請期間：每年11月1日至11月30日止，受理申請補助次年度1月至6月辦理之觀光活動（第1期）；每年4月1日至4月30日止，受理申請當年度7月至12月辦理之觀光活動（第2期）。\n二、申請資格：依法設立之法人或團體，得依本辦法申請補助辦理觀光活動。但前述法人，不包括政黨及學校財團法人，或以其為主要股東或捐助人之法人。\n三、補助案類型及內容：於臺北市辦理且對促進本市觀光發展有助益或配合臺北市政府政策辦理之觀光相關活動、訓練、推廣會或研討會。\n備註：申請程序及書表請至於本府台北服務通（網址: https://service.taipei/）「依機關分類／觀傳局／臺北市觀光活動補助」查詢，其餘相關規定請參考「臺北市觀光活動補助辦法」及「臺北市觀光活動補助申請須知」。","u":"臺北市政府觀光傳播局","h":4431,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B6F29789F2525DC2","d":"2021-02-25","sid":"B6F29789"}]},{"org":"就業服務處","total":64,"items":[{"q":"提早就業獎助津貼的申請方式?","a":"申請人只要在就業服務站完成求職登記及失業認定，於就業後滿3個月後，檢附提早就業獎助津貼申請書暨給付收據（請向勞工保險局各地辦事處索取或逕向勞工保險局網站下載）、身分證、或其他身分證明文件正背面影本及存摺封面影本親送或郵寄至\"勞保局\"申請即可。\n***\n有關提早就業獎助津貼申請，係向勞動部勞工保險局申請，如倘仍有該津貼相關問題，請洽詢勞動部勞工保險局〈電話：02-23961266 轉就業保險給付科〉。","u":"臺北市就業服務處","h":29783,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C685777049118AD5","d":"2010-03-29","sid":"C6857770"},{"q":"如何向公立就業服務機構申請職業訓練諮詢","a":"若您有工作意願但缺乏想從事之工作技能，可親至本處各就業服務站（ 各站聯絡地址 ）申請職業訓練諮詢，個案管理員將提供您簡易就業諮詢與職業訓練諮詢，建議您參加適合的職業訓練課程（職訓課程線上查詢請詳： 臺北市職能發展學院 或 台灣就業通 ）。","u":"臺北市就業服務處","h":19639,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=292FDA5CF891F5B2","d":"2010-04-06","sid":"292FDA5C"},{"q":"臺北市就業服務處各就業服務站(臺)受理失業認定、各項就業服務一覽表","a":"本處單位\n業務職掌\n處長\n綜理全處業務。\n副處長\n襄助綜理全處業務。\n秘書\n襄助綜理全處業務。\n求職服務課\n求職登記與職業介紹、就業諮詢與輔導、就業服務站(台)及就業流程規劃、被資遣員工再就業之協助、應屆畢業生專案就業服務及特定對象就業服務等事項。\n雇主服務課\n現場徵才活動、製造業及重大工程與雙語人員、機構看護工、家庭幫傭等聘僱移工前國人招募、教育訓練、僱用獎助及就業甄選等事項。\n就業情報課\n就業宣導、就業資訊蒐集、調查與統計、電訊客服及台北就業大補帖網站（https://okwork.gov.taipei）營運管理等事項。\n就業促進課\n非自願失業認定再認定、就業促進相關措施、創業輔導、多元就業開發方案及志工服務等事項。\n秘書室\n文書、檔案、出納、總務、財產管理與資訊、資訊服務與資訊安全、研考業務及不屬 其他各單位之事項。\n人事室\n辦理人事管理事項。\n會計室\n掌理經費核支作業、年度概(預)算編列作業等事項。\n政風室\n掌理政風法令宣導、各類政風防弊、公務機密維護及機關設施維護措施、政風貪瀆案件查處等事項 。\n艋舺站\n提供各項就業服務。(移工業務受理櫃檯、銀髮就業服務)。\n失業給付及職訓推介業務採預約制 。","u":"臺北市就業服務處","h":19617,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F290D2D725CE4D96","d":"2011-11-28","sid":"F290D2D7"},{"q":"身心障礙者如何找工作？","a":"請攜帶身心障礙手冊到臺北市萬華區艋舺大道101號4、5樓，電話：23381600，本市勞動力重建運用處有就業服務員為您服務；或您也可以至本處各就業服務站找工作；如果您可以上網，可至本處【 台北人力銀行(okwork網站) 】找合適的工作機會，網址： https://okwork.gov.taipei 。","u":"臺北市就業服務處","h":18987,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=20493972FA0DFF85","d":"2010-08-04","sid":"20493972"},{"q":"如果要資遣員工，要如何辦理通報資遣名冊？","a":"可採「線上通報」或「書面通報」擇一方式辦理。\n＊事業單位通報請以被資遣員工「實際勞務提供地」之直轄市、縣（市）主管機關及公立就業服務機構為受理通報機關（勞動部94年9月19日勞職業字第0940506091號函釋）。\n＊雇主透過主管機關資遣通報系統辦理通報事務，可視為同步向地方主管機關及公立就業服務機構完成通報義務，符合就業服務法第33條列冊通報規定（勞動部102年6月5日勞職業字第1020501285號函釋）。\n一、線上申報： 倘被資遣員工之實際勞務提供地為臺北市、新北市及臺中市，請分別至臺北市政府勞動局-勞動即時通、新北市政府勞工局-新北勞動雲及臺中市政府勞工局官網辦理，其餘直轄市、縣（市）則以勞動部勞動力發展署資遣通報系統進行申辦，相關網址如下：\n1、被資遣人員實際勞務提供地為臺北市： ( 勞動即時通-資遣通報 )。\n2、被資遣人員實際勞務提供地為新北市： ( 新北勞動雲-資遣通報 )。\n3、被資遣人員實際勞務提供地為臺中市： ( 臺中市政府勞工局官網-資遣通報 )。\n4、被資遣人員實際勞務提供地為非上述3類之其他直轄市、縣（市）： ( 勞動部勞動力發展署-資遣通報系統 )。\n二、書面申報： 自直轄市、縣（市）主管機關或公立就業服務機構網站下載「資遣員工通報名冊」，填妥各項資料後加蓋公司大小章，並以掛號信件郵寄至被資遣員工實際勞務提供地之主管機關及公立就業服務機構辦理。\n1、被資遣人員實際勞務提供地為臺北市：請郵寄至本府勞動局及本處進行通報。下載路徑如下：\n（1）本府勞動局網站 ( 網站連結 )首頁，由「機關資訊」項下點選「業務服務 /勞動服務/就業安全」後，進入「資遣通報」專區，即可查詢業務資訊及台北市政府「台北服務通」下載【資遣員工通報名冊】連結路徑。\n（2）本處網站 ( 網站連結 )首頁，進入「線上服務」，點選「下載專區」、「求職/求才服務表單下載」，即可下載【資遣員工通報名冊】。\n2、被資遣人員實際勞務提供地為非臺北市：請至所屬直轄市、縣（市）主管機關或公立就業服務機構網站下載「資遣員工通報名冊」，郵寄權管主管機關及公立就業服務機構進行通報。","u":"臺北市就業服務處","h":18917,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=47F34C935DA08597","d":"2019-05-22","sid":"47F34C93"},{"q":"如何向公立就業服務機構申請開立職業訓練推介單","a":"依據您的不同身分別，其辦理方式如下： （一）就業保險法非自願離職失業者 １．定義： 依就業保險法第11條第2項與第3項規定，非自願離職，係指下列各款情事之一： （１）被保險人因投保單位關廠、遷廠、休業、解散、破產宣告離職。 （２）依勞基法第11條、13條但書、14條、20條規定離職者。 （３）被保險人因定期契約屆滿離職，逾1個月未能就業，且離職前1年內，契約期間合計滿6個月以上者，視為非自願離職。 ２．辦理方式：請持非自願離職證明書（須註明離職原因、離職日期、該公司保險證號、公司章戳）或定期契約證明文件（需載明定期契約起訖日）、身分證、申請人金融機構存摺封面影本、戶籍謄本或戶口名簿（欲申報撫養眷屬加給津貼者始須檢附）等相關文件，並須由就業服務機構開立職訓推介單後至訓練單位辦理報名。 （二）一般對象失業者或就業服務法第24條第1項各款所列特定對象失業者及失業者職業訓練實施基準之「免費參訓對象及資格證明文件一覽表」所列之各項失業者 １．定義：請詳下方相關檔案。 ２．辦理方式：您可至本處各就業服務站，由櫃檯服務同仁提供職訓諮詢、課程及適訓課程之諮詢及建議後，您即可逕至訓練單位辦理報名參訓。","u":"臺北市就業服務處","h":17652,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=327EB80D40CECD48","d":"2010-02-08","sid":"327EB80D"},{"q":"如何申請失業給付？申請失業給付之應備文件？","a":"1.申請人請親自持相關證明文件向各公立就業服務站申請辦理。\n2.應備文件：\n(1).離職證明書或定期契約證明文件正本(正本驗畢歸還)及影本各一份（須註明離職原 因、申請人姓名、投保單位名稱、公司章）。\n(2).國民身分證或其他身分證明文件正、影本(正本驗畢歸還)。\n(3).被保險人本人名義之國內金融機構存款簿封面影本。\n(4).身心障礙者，另檢附社政主管機關核發之身心障礙證明。\n(5).有扶養眷屬者，另檢附受扶養眷屬之戶口名簿正、影本（正本驗畢歸還）。","u":"臺北市就業服務處","h":16577,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2E689646772D93CC","d":"2019-05-22","sid":"2E689646"},{"q":"找工作要如何辦理？帶什麼證件？","a":"(1)找工作有幾個管道，首先您可以攜帶身分證到就近服務站辦理求職登記，由櫃台人員為您推介工作。\n(2)可以在我們網站內瀏覽訊息，找到就業機會後自行與廠商連絡，台北人力銀行(okwork網站)網址： https://okwork.gov.taipei 。\n(3)在就業上有任何問題都可與本處電話服務中心聯絡，就業服務專線：(02)2308-5231。","u":"臺北市就業服務處","h":16446,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E5D8107A725FFF00","d":"2010-08-04","sid":"E5D8107A"},{"q":"提早就業獎助津貼的申請資格與給付標準?","a":"1.符合失業給付請領條件(必須完成失業認定後)，於失業給付請領期限屆滿前就業，並再度參加就業保險3個月以上即可申請。<請留意:參加就業保險3個月以上，不計入領取失業給付期間參加就業保險之年資。>\n2.按照申請人尚未請領之失業給付金額之50%，一次發給。(依就業保險法第11條第2項規定，準用就業保險法第11條第1項第2款得請領提早就業獎助津貼者，不包括於失業給付請領期間屆滿前，再受僱於原投保單位）\n***\n有關該津貼係屬勞動部勞工保險局業務，故倘仍有該津貼相關問題，請洽詢勞動部勞工保險局〈電話：02-23961266 轉就業保險給付科〉。","u":"臺北市就業服務處","h":15606,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B04B7862A58BA45D","d":"2010-07-27","sid":"B04B7862"},{"q":"本府各機關學校如何請本處代為甄選約聘僱人員、專案技工、工友等職缺？","a":"１、目前本處每月辦理1 場甄選，甄選方式以口試為原則。\n２、請各用人單位於指定日前將「用人需求表」等相關文件(含電子檔)送達本處彙辦，未於指定日前將需求表等相關文件送達本處者，將列入下梯次進行甄選。\n３、用人需求表格式範例及相關表格文件請於本處網站（ http://eso.gov.taipei /） 「業務服務/求才服務」項下「就業甄選」專區下載，有關甄選作業流程等相關資訊亦請參考上述網站。","u":"臺北市就業服務處","h":15304,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C291E40E1B10919A","d":"2010-08-04","sid":"C291E40E"},{"q":"辦理資遣員工通報時，有關「員工離職日期」欄位 如何填寫？","a":"該欄位所填之「員工離職日期」應與「勞動契約終止日」相同，亦即「在職最後一 日」。","u":"臺北市就業服務處","h":14009,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AFDA57A9C67873CC","d":"2019-05-22","sid":"AFDA57A9"},{"q":"重大工程(營造業) 辦理聘僱移工前國內招募求才登記所需文件為何？","a":"(1) 求才登記表。\n(2) 申請人（雇主）負責人之身分證明文件影本。\n(3) 申請人（雇主）之公司登記或商業登記證明。\n(4) 申請人（雇主）委託私立就業服務機構辦理國內求才業務之委託書。\n(5) 私立就業服務機構代辦之經辦人須出示有效之身分證明文件。\n(6) 工程合約書影本或公共工程之議價紀錄、決標公告、機關決標函等證明文件(公共工程或民間重大經建工程須檢附)。\n(7) 需甄選測驗者，須加附相關文件。\n(8) 工程主辦機關（構）或其所委託監造單位確認求才需求工程、工作類別及人數證明文件（公共工程或民間重大經建工程須檢附）。\n(9) 辦理國內求才登記日前90日內經內政部國土管理署認定符合雇主資格之證明文件及中央目的事業主管機關核發之營造業登記證書影本(符合一般營造業資格之雇主須檢附)。","u":"臺北市就業服務處","h":13926,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EBD7DA68A0F6A019","d":"2010-05-09","sid":"EBD7DA68"},{"q":"雇主資遣員工應列冊通報期間日數之計算規定？","a":"1.核釋就業服務法第三十三條第一項規定，雇主資遣員工應列冊通報期間日數之計算，以員工離職生效日為始日，並包含星期例假日，末日為星期日、國定假日或其他休 息日者，以該日之次日為期間之末日，並自即日生效。另勞動部九十一年四月十日勞 職業字第○九一○○○七○五一號令，同時廢止。（勞動部95年10月30日勞職業字 第0950506599號令）。\n2.有關資遣通報期間日數之計算，係以『員工離職生效日』為始日。舉例說明：雇主預定讓某員工任職至101年2月20日，則該員工之離職生效日為101年2月21日，依前揭函釋，雇主資遣員工應列冊通報期間以離職生效日101年2月21日為始日，末日原為101年2月12日（星期日）因適逢假日，以該日之次日101年2月13日 （星期一）為期間之末日，故雇主應於101年2月13日前為該員工辦理資遣通報（勞動部101年2月21日勞職業字第1010503133號函釋）。","u":"臺北市就業服務處","h":13303,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=39126F32E0199FC8","d":"2019-05-22","sid":"39126F32"},{"q":"如何申請家庭幫傭？有無限制規定？","a":"１、申請聘僱家庭外籍幫傭須符合條件有\n（１）有3名以上之年齡6歲以下子女。\n（２）有4名以上之年齡12歲以下子女，且其中2名為年齡6歲以下。\n（３）有未滿六歲之直系血親一親等卑親屬或有年滿七十五歲以上之直系血親尊親屬或姻親一親等尊親屬。\n２、相關限制如下：\n（１）計點成員與雇主須同一戶籍內，並以一戶聘僱家庭外籍幫傭一人為限。（２）受照顧人如已為他案之受監護人或受照顧人，或受照顧人與雇主不同戶籍，其點數不予累計。\n３、外國人得受聘僱於下列來我國投資或工作之雇主，從事第三條第二款之家庭幫傭工作：\n（１）外資金額在新臺幣一億元以上之公司所聘僱總經理級以上之外籍人員；或外資金額在新臺幣二億元以上之公司所聘僱各部門主管級以上之外籍人員。\n（２）上年度營業額在新臺幣五億元以上之公司所聘僱總經理級以上之外籍人員；或上年度營業額在新臺幣十億元以上之公司所聘僱各部門主管級以上之外籍人員。\n（３）上年度在我國繳納綜合所得稅之薪資所得達新臺幣三百萬元以上；或當年度月薪達新臺幣二十五萬元之公司、財團法人、社團法人或國際非政府組織主管級以上之外籍人員。\n外國分公司之經理人或代表人辦事處之代表人，準用前項外籍總經理之申請條件。","u":"臺北市就業服務處","h":12955,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EB15DE513D9E9C57","d":"2010-05-09","sid":"EB15DE51"},{"q":"申請承接家庭看護工及家庭幫傭所需文件為何？","a":"１、申請書。\n２、申請人之身分證或公司登記證明文件、商業登記證明文件、工廠登記證及特許事業許可證影本。但依規定免辦工廠登記證及特許事業許可證者免附。\n３、申請月前2個月往前推算1年之僱用勞工（含外國人）保險投保人數明細表正本。但申請接續聘僱海洋漁撈工、家庭幫傭、機構看護工及家庭看護工者免附。\n４、符合接續聘僱外國人資格之證明文件正本。（如背頁說明，正本驗畢退還）\n５、求才證明書正本。但申請接續聘僱家庭看護工者免附。（申請日前最近90日內有效）\n６、外國人預定工作內容說明書。\n７、直轄市或縣（市）政府開具無違反勞工法令證明書。但接續聘僱家庭幫傭及家庭看護工者免附。（申請日前最近60日內有效）另漁船（自然人）與船員雙方如無聘僱關係者（例如採合夥制），應檢附相關證明文件或切結書正本後免附。 ※以第1順位申請者，免附前開2.3.5.7.等文件。 ※送件時間：星期一及星期二。 ※如非本人辦理需檢附委託書。","u":"臺北市就業服務處","h":12475,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E08919403E8B6DD1","d":"2010-05-09","sid":"E0891940"},{"q":"失業給付適用條件及對象？","a":"1. 年滿15歲以上、65歲以下之就業保險被保險人(受僱勞工)（含本國籍勞工及與在中華民國境內設有戶籍之國民結婚，且獲准居留依法在臺灣地區工作之外國人、大陸地區人民、香港居民或澳門居民）。 2. 被保險人非自願離職。【非自願離職係指被保險人因投保單位關廠、遷廠、休業、 解散、破產宣告離職；或因勞動基準法第11條、第13條但書、第14條及第20條規定各 款情事之一離職；被保險人因定期契約屆滿離職，逾1個月未能就業，且離職前1年內，契約期間合計滿6個月以上者】。 3. 於離職辦理退保當日前3年內，就業保險年資合計滿1年以上。（雇主、職業工會加保及參加職訓者無投保就業保險）。 4 .需具有工作能力及繼續工作意願。 5. 向公立就業服務機構辦理求職登記，14天內未能推介就業或安排職業訓練者。","u":"臺北市就業服務處","h":12427,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CDE5D0AFE68F030C","d":"2019-05-22","sid":"CDE5D0AF"},{"q":"失業給付有申請期限嗎？","a":"1. 初次申請失業給付者，應於非自願離職退保後2年內提出申請。\n2. 繼續請領失業給付者，應於前次領取失業給付期間末日之翌日起2年內提出申請。","u":"臺北市就業服務處","h":11961,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=595B8EDEF571AB84","d":"2019-05-22","sid":"595B8EDE"},{"q":"申請求職交通補助金的資格條件？","a":"1.非自願性離職勞工或特定對象（獨力負擔家計者、中高齡者、身心障礙者、原住民、低收入戶或中低收入戶中有工作能力者、長期失業者、二度就業婦女、家庭暴力被害人、更生受保護人、其他經中央主管機關認為有必要者）或失業之就業保險被保險人。\n2. 向公立就業服務機構登記求職並經由公立就業服務機構就業諮詢並推介前往應徵之求職人。（應徵地點須與日常居住處所距離30公里以上，低收入戶、中低收入戶或家庭暴力被害人中有工作能力者則不受此限）。\n3. 應於7日內將應徵結果回覆公立就業服務機構，逾期不回覆者，當年度不再發給。\n4. 每人每年度以4次為限。\n5.申領求職交通補助金應有應徵事實，倘有不實領取經撒銷者，二年內不得申領本津貼。原發給津貼單位書面通知限期繳回，屆期仍未繳回者，依法移送強制執行。","u":"臺北市就業服務處","h":11727,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7D874D5D2A8C11F6","d":"2010-07-27","sid":"7D874D5D"},{"q":"申請求職交通補助金應準備文件為何？","a":"1.求職交通補助金申請書。\n2.補助金領取收據。\n3.切結書。\n4.國民身分證正反面影本。\n5.原雇主開具之離職證明書影本(應載明申請人姓名、投保單位名稱及離職原因)或特定對象身分證明文件（ex. 低收入戶證明文件）。\n6.介紹結果回覆卡。","u":"臺北市就業服務處","h":11558,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8C4FE9D5098E597B","d":"2010-07-27","sid":"8C4FE9D5"},{"q":"申請轉換家庭看護工及家庭幫傭所需文件為何？","a":"自113年11月20日起，外國人經勞動部同意轉換雇主或工作者，其轉換所需登載之資訊，勞動部將主動傳輸至外國人勞動權益網之移工轉換雇主專區。","u":"臺北市就業服務處","h":10998,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B438A54003207DC6","d":"2010-05-09","sid":"B438A540"},{"q":"廠商想聘僱外籍工作者該怎麼做？","a":"外國人受聘僱在我國境內從事工作，按就業服務法規定，雇主應向中央主管機關申請許可。 詳情請至外國人勞動權益網-勞動部勞動力發展署(https://fw.wda.gov.tw/wda-employer/home)","u":"臺北市就業服務處","h":10661,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F799134BCDF75284","d":"2010-05-09","sid":"F799134B"},{"q":"就業甄選相關資訊如何得知?","a":"如有就業甄選相關資訊會即時公布於本處網站首頁「最新消息」區及本處公布欄以及 台北就業大補帖(OKWORK網站) 首頁「最新消息區」。","u":"臺北市就業服務處","h":10579,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F216A169E60DA7C0","d":"2010-08-04","sid":"F216A169"},{"q":"製造業辦理聘僱移工前國內招募求才登記所需文件為何？","a":"(1) 求才登記表。\n(2) 申請人（雇主）負責人之身分證明文件影本。\n(3) 申請人（雇主）之公司登記、商業登記證明或依農會法或漁會法設立之農會或漁會之證明文件、工廠登記證明、特定工廠登記證明或已依特定工廠登記辦法規定由地方政府開立之受理申請特定工廠登記證明文件等影本。\n(4) 申請人（雇主）委託私立就業服務機構辦理國內求才業務之委託書。\n(5) 私立就業服務機構代辦之經辦人須出示有效之身分證明文件。\n(6) 特定製程案求才者，應檢附辦理國內求才登記日前最近6年經濟部產業發展署或自由貿易港區管理機關認定製造業特定製程行業之證明文件。\n(7) 符合經濟部產業發展署審查特定工廠登記業者申請引進移工作業要點之業者，國內求才登記時，應依前款規定辦理。","u":"臺北市就業服務處","h":10431,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3F6C72E13524A2FD","d":"2009-07-25","sid":"3F6C72E1"},{"q":"求職交通補助金發放標準？","a":"求職交通補助金發放標準如下:\n求職交通補助金，每人每次得發給新臺幣500元。但情形特殊者，得核實發給，每次不得超過新臺幣1250元。\n前項補助金每人每年度以發給4次為限。","u":"臺北市就業服務處","h":9759,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DE7CA6E35F7A7CF4","d":"2010-02-08","sid":"DE7CA6E3"},{"q":"有關雇主辦理資遣員工通報的法源依據、何時辦理通報、罰則為何？以及受理通報機關為何？","a":"1.法源依據、通報期間日數規定及罰則：\n（1）雇主資遣員工時，應於員工離職之10日前，將被資遣員工之姓名、性別、年齡、住址、電話、擔任工作、資遣事由及需否就業輔導等事項，列冊通報當地主管機關及公立就業服務機構。但其資遣係因天災、事變或其他不可抗力之情事所致者，應自被資遣員工離職之日起3日內為之（就業服務法第33條規定）。如雇主未依規定通報，處新臺幣3萬元以上15萬元以下罰鍰（就業服務法第68條規定）。\n（2）衡酌就業服務法第33條資遣通報之立法意旨及實務作業時有勞雇雙方因對離職事由認知不同而衍生勞資爭議情事，有關勞雇雙方因離職事發生勞資爭議，經調解結果為依勞動基準法第11條、第13條但書及第20條規定終止勞動契約者，雇主仍應依就業服務法第33條第1項但書規定，於協調或調解成立當日起3日內辦理資遣通報（勞動部114年1月13日勞動發就字第1140500163號函釋）。\n2.受理機關：\n事業單位通報請以被資遣員工「實際勞務提供地」之直轄市、縣（市）主管機關及公立就業服務機構為受理通報機關（勞動部94年9月19日勞職業字第0940506091號函釋）。","u":"臺北市就業服務處","h":9611,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3A058EBF2607FF9C","d":"2019-05-22","sid":"3A058EBF"}]},{"org":"文化局","total":62,"items":[{"q":"請問如何搭乘大眾交通工具去臺北當代藝術館？","a":"1.捷運:搭乘2號線(紅線)或3號線(綠線)至中山站下車，由中山站6號出口沿南京西路64巷步行約5分鐘抵達，或沿捷運中山地下街往台北車站方向步行5分鐘至R4出口後，沿長安西路步行1分鐘抵達。\n2.公車:216、217、218、224、247、260、287、310 、中山幹線(原 220)， 至「中山市場」站下車，沿中山北路往長安西路方向，步行約７分鐘抵達。\n搭低底盤公車282、南京幹線（原棕9）、承德幹線（原266），至「捷運中山站」下車，步行約6分鐘抵達。\n3.建成國中地下停車場（電話:02-2559-6615，地址：臺北市長安西路37號之一地下）:\n汽車：8時至22時每小時40元、22時至翌日8時計時10元。\n機車：計時10元(當日當次最高收費上限30元，隔日另計)。","u":"臺北市政府文化局","h":23882,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4EA76F4C847158AB","d":"2010-12-28","sid":"4EA76F4C"},{"q":"具備何種身分才能登記街頭藝人？","a":"凡具有藝術才華、具備專長技藝及表演熱忱並有意從事街頭展演之民眾，年齡需屆滿16歲，外國人需持有藝術及演藝工作許可或於我國從事就業服務法第四十六條第一項第一款至第六款工作，並已持有非藝術及演藝工作許可。如有更多疑問請逕洽臺北市政府文化局，電話：1999(臺北市民當家熱線；外縣市請撥 02-27208889)轉3531、3556。","u":"臺北市政府文化局","h":19969,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B03A3F605DAEADF","d":"2018-04-23","sid":"5B03A3F6"},{"q":"文化局設置的文化海報框如何申請?海報要送到哪張貼?審查機制為何?海報貼在哪?","a":"一、 申請資格：\n(申請須知及表格請上臺北市政府文化局網站\nhttps://culture.gov.taipei/\n「補助/申請案件」→「各項申辦」→「捷運文化海報框」參閱及下載)\n1. 經政府立案之國內藝文團體(係指藝文團體、藝文相關法人組織及文博館所)。\n2. 主辦或與民間合作辦理藝文活動之政府機關。\n3. 發行國產電影片之電影發行公司。\n二、 海報送達地點及審查機制：\n1.申請張貼之海報請送至以下單位\n好視音活動整合有限公司 王恆傑先生\n地址：新北市新莊區中正路649-9號7樓 AA111\n電話：02-2689-0101（王先生）。\n2.審查機制:審查機制除依照上開之申請資格規範外，該表演地應於本市進行演出，並應符合相關尺寸等規定，詳細請參考「申請須知」。\n三、 張貼地點數量：\n文化海報張貼目前提供捷運板南線上龍山寺站（33個）、西門站（115個）、忠孝復興站（48個）、忠孝敦化站（51個）、市政府站（40個）共5站287個海報框提供申請使用。","u":"臺北市政府文化局","h":14595,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7B072200E68A8286","d":"2025-02-18","sid":"7B072200"},{"q":"臺北當代藝術館開放時間 ?是否免收門票？","a":"開放時間： 週二至週日，每日上午10:00開館，下午6:00閉館，下午5:30停止售票‧每週一休館，國定假日照常開館\n門票規定\n一般票：一般民眾，每張100元\n優待票：持下列有效證件者，每張50元\n臺北市民(臺北通 Taipei Pass)\n軍警、榮民、公教退休人員證\n國中以上在校學生證\n魔卡加購門票\n持愛臺灣博物館卡，每張90元\n團體票：單筆購票滿20張以上，每張80元\n免票對象：\n1. 未滿六歲並由成人陪同之兒童。\n2. 身心障礙者及其監護人或必要之陪伴者一人\n3. 持下列有效證件之本人：\n(1)魔卡會員\n(2)本國籍國小學生\n(3)觀光局核發之導遊證（旅遊團體適用）\n(4)低收入戶證明\n(5)敬老證（限本國籍65歲以上之長者）\n(6)國際博物館組織之會員證（ICOM、AAA、AICA Press Card）\n(7)中華民國博物館學會會員\n(8)臺北市立建成國中師生\n(9)持有志願服務榮譽卡\n(10)設籍臺北市55歲以上原住民\n特別方案：免票\n親子日\n週六日及國定假日10:00 - 12:00，凡親子同行即可免票參觀。\n社區日\n開館期間，每週二至週日10:00 - 12:00，凡臺北市大同區居民及中山區民安里里民憑證件 ，本人即可免票參觀。\n學校團體日\n開館期間，週二至週五10:00-17:00，凡由教師帶隊之本國公私立學校學生團體，且於參觀日兩週前向本館申請預約並經核准者即可免票參觀。\n詳情請參考台北當代藝術館官網","u":"臺北市政府文化局","h":11566,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=070AD69AB47948C8","d":"2010-12-28","sid":"070AD69A"},{"q":"如何去「北投溫泉博物館」及其開放時間?","a":"北投溫泉博物館地址：臺北市北投區中山路二號 電話：02-28939981 開放時間：每週二至週日上午10點至下午6點(最後入館時間為下午5點45分) 每週一及 國定例假日休館 (遇週六、日照常開放)\n交通資訊： 【大眾運輸-捷運、公車】 1.捷運： 捷運淡水線於北投站下車換乘新北投支線，於新北投站下車，往中山路步行約5分鐘即可到達。 2.公車： 搭乘216區、218、218區、承德幹線、小6、小7、小9於新北投站或北投公園站下車，往中山路步行約5分鐘即可到達。 【自行開車】 沿國道一號前往洲美快速道路，往北投方向自大業路出口下交流道至大業路底，可於新北投捷運站停車場停車，步行約5分鐘即可到達本館。","u":"臺北市政府文化局","h":9024,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5990AA2BA88BBF44","d":"2008-06-23","sid":"5990AA2B"},{"q":"臺北市電影主題公園營業時間？是否須收取門票？聯絡電話？交通資訊？","a":"營業時間：全日開放。 門票：自由入場免費參觀。 地址：臺北市萬華區康定路19號，電話：02-2311-9380 分機 68。 交通資訊： 捷運-搭乘板南線捷運至西門捷運站出6號出口，沿著武昌街步行到底，即可到達臺北市電影主題公園。 公車-搭乘242、702、705、624、701、231、234、658到康定路站、峨嵋街口站下車，即可到達臺北市電影主題公園。","u":"臺北市政府文化局","h":8518,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D12F31603EF904C2","d":"2008-06-23","sid":"D12F3160"},{"q":"市長官邸之地址及開館時間等資訊情形？","a":"※下述開館時間將視防疫規定隨時調整※\n一、開館時間：\n一般參觀　每日09:00 – 22:00（除春節外，全年無休）\n＊園區參觀免票入場。\n展覽開放　每日09:00 – 17:00\n官邸用餐　每日09:00 – 22:00（21:00後恕不供餐）\n場地洽詢　每日09:00 – 18:00\n二、地址：臺北市中正區徐州路44、46號\n三、交通資訊：\n(1)公車：忠孝幹線：205, 212, 232, 257, 262, 276, 299,605,1815「審計部站」下車；仁愛幹線：37, 261, 263, 270, 621, 630, 651,665 「仁愛杭州路口站」（或仁愛紹興南街口）下車；林森南路：15,22,208,295, 297,665,671「開南高工站」下車；杭州南路：222, 253, 297「仁愛路二段站」下車。\n(2)捷運：◎ 搭乘板南線至「善導寺站」，5號出口出來，延紹興南街前往，步行約十分鐘或可搭新店線至「台大醫院站」，2號出口，過中山南路，沿徐州路（台大急診處旁馬路）至本館。\n四、連絡電話： 02-2396-8198","u":"臺北市政府文化局","h":7778,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=32A72ECDB2D233AB","d":"2008-06-23","sid":"32A72ECD"},{"q":"請問演藝團體與劇團有何不一樣？申請方式有何差別？","a":"演藝團體是指從事文化藝術表演的團體，劇團亦是演藝團體之一。\n根據「臺北市演藝團體輔導及管理自治條例」第三條說明，所稱之演藝團體依「臺北市演藝團體輔導及管理自治條例」之規定，於臺北市立案並從事音樂、戲劇、舞蹈、雜藝等表演及各項演藝活動並以非營利為目的之團體。非營利組織是指不作盈餘分配或將剩餘財產歸於個人所有。\n臺北市政府於民國100年頒佈「臺北市演藝團體輔導及管理自治條例」，此規則的訂定提供演藝團體明確的法規與定位，演藝團體依據此規則申請立案，可以有別於基金會設立的高門檻條件的限制，並能依法開立有效贊助收據以接受民間或企業的捐助，並且在稅務方面可享有優惠或獎勵，例如:演出活動可申請營業稅及娛樂稅減免；團隊依據免稅標準，非銷售貨物或勞務部分之所得免納所得稅；演藝團隊若是當年度的總支出大於總收入的60%，即可依法免徵營業稅及營利事業所得稅，如當年度的總支出小於總收入的60%，可辦理結餘款保留。\n申請臺北市立案之演藝團體方式：\n請至文化局網站 演藝團體資訊平台 或 市民服務大平台 線上提出申請，將所需之紙本文件郵寄至臺北市政府文化局即可，相關操作及資訊可先電洽承辦人：02-2720-8889轉3552。\n上述的「臺北市演藝團體輔導及管理自治條例」，是臺北市政府提供藝文團隊在經營管理團務工作的一種選擇，另外，藝文團隊仍然可以依據自已未來發展的需求，可選擇登記成公司營利單位、基金會、協會或學會等方式立案。\n※演藝團體常見問答 請點","u":"臺北市政府文化局","h":7359,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=46E238A146FF0756","d":"2009-10-07","sid":"46E238A1"},{"q":"剝皮寮歷史街區位於何處？開放時間?","a":"臺北市萬華區康定路173巷\n街區：週二～週日 09:00~21:00\n室內：週二～週日 09:00~18:00\n休館：週一固定休館","u":"臺北市政府文化局","h":7244,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E2AB53BBFB12F421","d":"2013-05-28","sid":"E2AB53BB"},{"q":"芝山文化生態綠園之地址及開館時間等資訊情形？","a":"一、開館時間：週二至週日：9:00~17:00\n二、地址：臺北市雨聲街120號\n三、交通資訊：\n(1)搭乘捷運淡水線至士林站，轉乘公車685、紅15至陽明醫院站，下車前方可見雨聲街指示牌，右轉即可看到陽明醫院再往前走即抵達；或搭乘捷運淡水線至芝山站，轉乘陽明醫院接駁車至陽明醫院後，即可於急診室對面看到本園區。\n(2)開車：行經中山北路6段右轉至忠誠路，直駛至忠義街右轉，前方可見雨聲街指示牌，右轉即可看到陽明醫院，再往前走即抵達，設有停車場。\n四、連絡電話：88666258\n五、票價\n1.全票NT＄50元/一般民眾\n2.優待票NT＄30元/各級在學學生（憑學生證入園）\n3.團體票NT＄20元/為20人以上團體\n※週六.週日及國定假日:<開放免費導覽解說>\n※免門票：\n◇65歲以上老人\n◇6歲(含)以下兒童(需持有健保卡等證明文件)\n◇領有身心障礙手冊者及1名必要之陪同人員\n◇士林區全區居民，須持有效證明文件(不含學校團體)\n◇凡設籍臺北市55歲以上之原住民長者憑敬老悠遊卡或戶口名簿等相關證明\n◇持志願服務榮譽卡者\n六、疫情相關防護措施：體溫超過37.5度者或有感冒徵狀者，得請勿入園。\n七、團體預約導覽請恰園區官網預約。\n【定時導覽時間】\n○芝山綠園園區導覽\n1. 時　　間：每週六、日及國定例假日\n上午場 09:00／下午場 13:30　共兩場次\n2. 集合地點：入口大鐵門\n3. 路　　線：園區戶外\n4. 報名方式：現場自由參加\n○賞鳥駐站解說\n1. 時　　間：每週日　14:00～16:00\n2. 集合地點：入口大鐵門\n3. 對　　象：一般民眾\n4. 報名方式：現場自由參加\n【考古探坑－開放及導覽時間】\n1.開放時間：\n週六、週日及國定假日10:00～12:00／14:30～16:30　共兩時段以上開放時間，同時提供定時導覽解說。\n2.休　　館：每週一及春節假期\n► 如有變動將另行公告。\n► 官網： https://www.zcegarden.org.tw/\n► FB： https://www.facebook.com/zcegarden8866\n► 未盡事宜請洽本園區客服","u":"臺北市政府文化局","h":7204,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B4338AFB23BDDF5F","d":"2008-06-23","sid":"B4338AFB"},{"q":"藝響空間專案單位聯絡人及電話","a":"有關藝響空間相關業務，請洽臺北市政府文化局：\n桂小姐 02-27208889分機3540，李小姐 02-27208889分機3548","u":"臺北市政府文化局","h":6808,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4BC0505FB4D7DF99","d":"2010-12-28","sid":"4BC0505F"},{"q":"臺北市文化藝術基金會的設立基金門檻為？有無相關法規或申請表格可參考？","a":"Q1：臺北市文化藝術基金會的設立基金門檻為？\nA1： 臺北市 政府文化局所主管財團法人之設立捐助財產最低總額為新臺幣1,000萬元，現金總額比率為百分之百。\nQ2：有無相關法規或申請表格可參考？\nA2：請至 下方連結，載下 0–3 附件 填畢用印後，送局申請。\n※ 申請設立應檢附文件（相關表件範本請參考下方檔案載下附件）\n0.臺北市文化藝術財團法人申請設立申請書（捐助財產總額新臺幣1000萬元且現金比率為百分之百，申請書1份，其他文件1式3份，相關表件範例請參考下方檔案載下附件）。\n1.捐助人會議紀錄及簽到表（捐助人2人以上者），或捐助人遴聘董事、訂定捐助章程之相關證明文件（捐助人為1人者，逕由捐助人訂立捐助程，依捐助章程所訂遴聘第一屆董事與董事長，並提出證明文件，毋庸召開會議）。\n1-(1)財產移轉承諾書：捐助人、繼承人或遺囑執行人同意於文化法人獲准登記時，將捐助財產移轉\n為文化法人所有之承諾書。\n1-(2)捐助人名冊。\n1-(3)捐助財產清冊及其證明文件。\n1-(4)捐助章程或遺囑影本（以遺囑捐助設立者）。\n1-(5)董事名冊暨印鑑清冊、監察人名冊暨印鑑清冊（無設置監察者免附）。\n1-(5)-A.身分證明文件影本。\n1-(5)-B.願任董事同意書、願任監察人同意書（無設置監察者免附）。\n1-(5)-C.董事具文化藝術經驗之證明文件（須達全體董事五分之一）。\n1-(5)-D.所有董事切結書（切結董事相互間有配偶或三等親內親屬關係者未超過董事總人數三分之一）、所有監察人切結書（切結監察人相互間、監察人與董事間不得有配偶或三親等內親屬關係，無設置監察者免附）。\n1-(5)-E.董事與監察人（無設置監察人者免附）為現職公務人員或教育人員者之服務機關或上級主管機關同意書。\n1-(6)基金會會址所在證明文件（所有權狀、土地使用分區證明文件、租約或借用人同意書等）。\n2.董事籌備會會議紀錄及簽到表。\n2-(1)年度業務計畫及預算書。\n3.申請代理人委任書（無委託他人代為申請者免附）。","u":"臺北市政府文化局","h":6559,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1587BEB1701A476F","d":"2022-04-28","sid":"1587BEB1"},{"q":"未來無街頭表演水準之事前審議制度，如表演有涉及公共安全，政府如何把關？","a":"街頭藝人所申請之展演內容，如非屬一般常見之表演型態，或所使用之工具、表演方式有造成公共意外、妨礙公眾安寧及衛生等疑慮時，場地管理機關得要求街頭藝人進行事前預演後，再行決定是否予以許可。","u":"臺北市政府文化局","h":6384,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B6E8E1E09AB4A23C","d":"2008-06-23","sid":"B6E8E1E0"},{"q":"街頭展演場地要怎麼申請？有哪些限制？","a":"街頭藝人得否於各場地進行展演，由各場地管理機關自行根據場地具體情形決定。場地管理機關得視場地具體情形及業務需要，就街頭藝人開放展演之項目、方式、時段、地點、展演優先順序以及展演時所應遵守之相關使用規定等事項，訂定相關申請須知，並於對外公告後，據以受理街頭藝人之展演申請。 場地管理機關得於場地使用規定中自行決定是否要向街頭藝人收取場地使用費、清潔費或保證金等費用，以及街頭藝人得向觀眾收取費用之方式（打賞或其他收費方式）。\n臺北市開放之展演空間，皆公告於臺北市街頭藝人登記及展演平台( 臺北市街頭藝人登記及展演申請平台 )，街頭藝人透過網站登記申請場地，經抽選獲得場地該時段使用權，展演須符合場地機關制定之規則，由各主管機關進行管理稽查。\n若未載於平台之場地，則代表非開放展演空間，無論是否具有街頭藝人登記者，皆無法進行展演，如有違規展演情事，則須通報該地權管派出所進行取締，以維護當地秩序。","u":"臺北市政府文化局","h":6032,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7083072C623447D9","d":"2008-06-23","sid":"7083072C"},{"q":"文化局經管特定路段使用範圍？","a":"文化局經管路段係信義計畫區及西門町行人徒步區經本府公告之路段，範圍如下：\n一、信義計畫區部分包括新光三越香堤大道北段（A8與A10間徒步區）、香堤大道南段（A9與A11間徒步區）、香堤大道廣場（A8、A9、A11三館間）及信義威秀徒步區（紅色陸橋之後）。\n二、西門町部分則包括昆明街至康定路段之武昌街（電影街）、峨眉街與漢中街口廣場、漢中街與武昌街口廣場（屈臣氏前）、西寧南路至昆明街間之武昌街段（武昌誠品店前）。","u":"臺北市政府文化局","h":6014,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D96B53FF8FB7A417","d":"2020-09-18","sid":"D96B53FF"},{"q":"街頭藝人證到期該如何辦理？","a":"於持有證到期前一個月始可提出續辦申請，\n請至本市街頭藝人登記及展演申請平台( 臺北市街頭藝人登記及展演申請平台 )\n點選1.臺北市登記證到期，重新申請、\n2.會員登入後檢視原申請相關資訊、\n3.身分證正反面及相關資料圖檔上傳後送出即可，本局將於六個工作天內審核並通知辦理結果。","u":"臺北市政府文化局","h":5980,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3C2976CCF0962ADC","d":"2008-06-23","sid":"3C2976CC"},{"q":"請問如何搭乘大眾交通工具去西門紅樓？","a":"捷運交通：1.板南線（藍）2.松山新店線(綠)，捷運西門站1號出口，步行約1分鐘\n西門市場(漢中)—18、1503、235、257、621、640、783\n西門市場(成都)—18、1503、221、232、235、257、513、621、635、637、640、663、783、797、799、835、藍2\n停車地點：中山堂地下停車場（台北市延平南路98號之1）\n峨嵋立體停車場（台北市峨嵋街83號）\n洛陽綜合立體停車場（臺北市環南路一段1號）","u":"臺北市政府文化局","h":5711,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E191DFF87B05D215","d":"2008-06-30","sid":"E191DFF8"},{"q":"請問參觀西門紅樓是否免費？","a":"免費入場參觀，二樓劇場需購節目票券入場。","u":"臺北市政府文化局","h":5630,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4F1976921C99B078","d":"2010-12-28","sid":"4F197692"},{"q":"永安藝文館之地址及開館時間等資訊情形？","a":"1. 開館時間：週二至週日 09:00～18:00，週一及國定假日休館。 2. 票價規範：入館參觀無須購票，免費入館。 3. 電話：02-2939-3088。\n4. 地址：臺北市文山區木新路二段156之1號（家樂福超市後方）。 5. 交通資訊： ＜公車＞ 搭乘251、252、295、611、棕7、綠1、793、819，至「景文中學」站下車；搭乘236至「永安街」站下車，走路三分鐘可達。 ＜捷運＞ 捷運木柵線「木柵站」，轉乘公車251、252、棕7到「景文中學」站下車；或捷運新店線「七張站」，轉乘綠1或至對面轉252、793、819，到「景文中學」站下車。 ＜自行開車＞ 參考地標：景文中學、伯大尼育幼院、政大後門恆光橋；走北二高可由「新店」交流道下，左轉經平面道路至寶橋路右轉直走；或由「木柵」交流道下，右轉後直走。交流道下後約10分鐘即可到達。","u":"臺北市政府文化局","h":5596,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0970A002B321C8C3","d":"2008-06-23","sid":"0970A002"},{"q":"請問臺北當代藝術館的地址及連絡電話？","a":"地址：臺北市大同區長安西路39號\n電話：(02)2552-3721","u":"臺北市政府文化局","h":5424,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3B2A2C4842D952A4","d":"2010-12-28","sid":"3B2A2C48"},{"q":"被指定登錄為古蹟、歷史建築、紀念建築之建築物要符合何種條件，才能辦理容積移轉？","a":"實施容積率管制地區內，經指定登錄為古蹟、歷史建築、紀念建築所定著之土地、保存用地或保存區、其他使用用地或分區內土地，除以政府機關為管理機關者外，因古蹟、歷史建築、紀念建築之指定或登錄、保存用地、保存區、其他使用用地或分區之編定、劃定或變更，致其原依法可建築之基準容積受到限制部分，土地所有權人得依「古蹟歷史建築紀念建築土地容積移轉辦法」申請移轉至其他地區建築使用。前揭辦法所稱基準容積，指以都市計畫、國土計畫、區域計畫或其相關法規規定之容積率上限乘土地面積所得之積數。","u":"臺北市政府文化局","h":5280,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=086DD35888B45FC5","d":"2013-05-28","sid":"086DD358"},{"q":"文化局經管特定路段舉辦臨時活動的保證金及使用費金額為何？","a":"一、保證金：每路段每次申請(不論天數、時段)，須先繳納10萬元保證金。同一申請案，涉及兩個路段以上，保證金依路段數量累計。活動結束後3日起，填寫相關文件至本局申請辦理保證金退還，本局於各相關局處確認申請人無違反相關規定後，退還保證金。 二、使用費：一般路段使用上午時段需繳交使用費1萬元，下午或晚上需繳交1.5萬元，全天為4萬元；特殊路段（熱門的路段）的使用費為8萬元。信義區活動如設置舞台或攤棚，其使用費以全天計收。","u":"臺北市政府文化局","h":5249,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1A770EECF44CA256","d":"2020-06-11","sid":"1A770EEC"},{"q":"文化局經管特定路段的檔期使用情形？","a":"請至本府文化局網站（https://culture.gov.taipei/）／文創徒步區申請／徒步區檔期查詢。","u":"臺北市政府文化局","h":5177,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=550E3129B1210C85","d":"2020-06-11","sid":"550E3129"},{"q":"臺灣新文化運動紀念館的開放時間、票價、位置與聯絡方式","a":"※本館於107年10月14日起開放參觀 ※開館時間：每週二至週日之9時30分至17時30分，每週一休館。 ※票價：全館免費參觀。 ※地址：臺北市大同區寧夏路87號（原大同分局） ※交通： 捷運\n● 大橋頭站2號出口\n● 民權西路站3號、4號出口\n● 雙連站2號出口\n公車\n● 大同分局：民權幹線、紅29、紅31、內科通勤18\n● 靜修女中：民生幹線、42、539、811、紅33\n● 成淵高中：292、292副、539、756、820、226、63、承德幹線、304承德線\n● 民生重慶路口：重慶幹線、2、215、223、288區、63、255、300、302、304重慶線、306、306區間車、639\nYouBike\n● 蔣渭水紀念公園\n● 捷運大橋頭站2號出口\n● 捷運民權西路站3號出口\n停車場\n● 成淵高中停車場\n● 朝陽公園停車場\n※聯絡方式：\nTEL：02-2557-0087 官網連結 臉書","u":"臺北市政府文化局","h":5097,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9C1F11C0C8EEE168","d":"2018-05-28","sid":"9C1F11C0"},{"q":"如何設立登記演藝團體？","a":"連結： https://service.gov.taipei/Case/ApplyWay/201907160009\n1. 設立登記申請書。(含注意事項及法規)\n2. 代表人六個月內2吋照片1張。(需郵寄)。\n3. 團址建物所有權人同意書。(建物如為代表人所有者免附)\n4. 團址建物所有權狀影本。\n5. 代表人身分證明文件。\n6. 代表人六個月內信用證明文件。\n(票據交換信用證明文件或金融聯合徵信中心開立之信用證明文件。地址：臺北市中正區重慶南路1段2號10樓，電話：02-2381-3939)\n7. 業務計畫及財務計畫。\n8. 團員名冊。\n收到核准通知後，請依繳費方式繳納。\n（申請前請先至文化局網站演藝團體專區閱讀流程及詳細說明： 請見 ）","u":"臺北市政府文化局","h":4993,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=45A86C28E3038315","d":"2008-06-23","sid":"45A86C28"}]},{"org":"交通管制工程處","total":56,"items":[{"q":"假日黃線路段開放停車，是否有相關網頁可供查詢？","a":"本市禁停黃線假日開放停車路段資料，可至臺北市交通管制工程處網站(www.bote.gov.taipei)首頁> 行車管制>禁停紅黃線>「 假日黃線開放停車路段表」查詢。","u":"臺北市交通管制工程處設施科","h":121506,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FB421A105F862372","d":"2015-10-05","sid":"FB421A10"},{"q":"請問住家出入口可以劃設紅線嗎？","a":"如果住戶有因路邊停車，以致進出困難的情形，請該棟住戶達成共識後並出具證明文件（建築物所有權狀影本或居住證明等），填妥交通設施建議表(可至臺北市交通管制工程處網站下載)後寄送至臺北市停車管理工程處評估繪設。","u":"臺北市交通管制工程處設施科","h":76566,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0E22A40F8BB13E04","d":"2015-10-05","sid":"0E22A40F"},{"q":"家長接送區標誌牌面上規定「上課期間」禁止停車，「上課期間」指的是什麼？","a":"「上課期間」係指本府教育局於各學年度公告所屬各級學校學期假期行事簡曆，或各級學校於該校網站公告之學期假期行事簡曆，另「寒暑假期間是否屬於上課期間」之定義，依本府教育局解釋為主；各校管制時段（間）及方式略有不同，詳細時間以現場家長接送區標誌牌面為準。","u":"臺北市交通管制工程處設施科","h":30194,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=57927F63020CAAAA","d":"2015-10-05","sid":"57927F63"},{"q":"資訊可變標誌(CMS)是什麼？其顯示的路況資訊是如何產生的？","a":"資訊可變標誌（Changeable Message Sign, 簡稱CMS）為設置於道路兩旁或上方，由相關管理單位透過通訊傳輸網路發佈訊息，提供給用路人路況資訊、交通宣導或相關訊息等。本市於道路上設置多處資訊可變標誌，所提供的路況資訊例如某道路順暢、車多或壅塞等訊息等，都是透過設置於道路上的車輛偵測器所蒐集之車流資料計算而得。","u":"臺北市交通管制工程處交控中心","h":28845,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EA7F8203DCC8251B","d":"2015-10-05","sid":"EA7F8203"},{"q":"請問該如何查詢臺北市禁停標線劃設之地點?","a":"請在臺北市交通管制工程處網站查詢：www.bote.gov.taipei，點選「禁停紅黃線查詢」（圖檔更新會有2~3天落差），或者在上班時間電話撥臺北市交通管制工程處27599741轉7910（北區：士林區、 北投區、內湖區、南港區、大同區、中山區）或7914（南區：松山區、信義區、大安區、文山區、萬華區、中正區）。","u":"臺北市交通管制工程處工程隊","h":23485,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3B4BFFB8A27F18A6","d":"2015-10-05","sid":"3B4BFFB8"},{"q":"交通號誌黃燈秒數如何設定?","a":"黃燈秒數係依該路段之速限設置秒數，依「道路交通標誌標線號誌設置規則」第231條規定，行車速限50公里/小時以下得設置3秒黃燈，51-60公里/小時得設置4秒黃燈，61公里/小時以上得設置5秒黃燈。","u":"臺北市交通管制工程處交控中心","h":23058,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C796F047EFED8F61","d":"2015-10-05","sid":"C796F047"},{"q":"家門口前的巷子可不可以整段都劃紅線？","a":"由於目前法規上並無巷道內整段劃設紅線之規定，考量涉及當地停車需求，建議能先向里長建議並取得當地住戶的共識，再由里長代表向臺北市交通管制工程處（30公尺以上）或臺北市停車管理工程處（不足30公尺）反應，以避免住戶之間的爭議。","u":"臺北市交通管制工程處設施科","h":19547,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2E443B636A35938B","d":"2015-10-05","sid":"2E443B63"},{"q":"黃線禁止停車時間為何？","a":"黃線禁止停車時間為每日上午7時至夜間8時，如有延長或縮短，會以標誌及附牌標示禁停時間。","u":"臺北市交通管制工程處設施科","h":16450,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B43DFC87A4E2233","d":"2015-10-05","sid":"0B43DFC8"},{"q":"請問如何建議設置臺北市標誌、標線與號誌呢？","a":"可至「臺北市交通管制工程處全球資訊網」http://www.bote.gov.taipei，下載交通設施建議表填寫後，將本表傳真至2759-9724或郵寄臺北市信義區松德路300號7樓，該處將儘速指定專人為您處理。","u":"臺北市交通管制工程處設施科","h":16252,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=05DCD5FE8775FEA7","d":"2015-10-05","sid":"05DCD5FE"},{"q":"為什麼有的巷口有劃紅線有的沒劃？","a":"依規定路口10公尺不論有沒有紅線都不可以停車，劃紅線的路口是加強警示的作用。","u":"臺北市交通管制工程處設施科","h":15260,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9BC8CEE7D3831C40","d":"2015-10-05","sid":"9BC8CEE7"},{"q":"交叉路口10公尺未劃設紅線可否停車？","a":"交叉路口10公尺內是法律明文規定禁止停車，即使無劃設紅線者仍不得停車。","u":"臺北市交通管制工程處工程隊","h":14330,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E2D98410BE309C5D","d":"2015-10-05","sid":"E2D98410"},{"q":"臺北市的道路是否有依幾米寬度來規劃紅黃線？","a":"除消防通道外，沒有規定什麼樣的道路寬度須劃紅黃線，均依該路段的道路幾何條件、使用需求與交通量進行評估。","u":"臺北市交通管制工程處設施科","h":13893,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D9DF9C65753E3712","d":"2015-10-05","sid":"D9DF9C65"},{"q":"交通局在路口設有閉路電視攝影機，可否提供錄影影像？","a":"交工處所建置的閉路電視攝影機，目的在即時監看交通狀況，錄影存檔時間約30天(攝影機可能因為維修而無錄影)，因為可能涉及個人資料問題，所以錄影影像僅提供警方或法院公務使用，若民眾因交通事故需要調閱影像，可向車禍地點管轄的警察單位提出申請，由警方向交工處申請調閱。","u":"臺北市交通管制工程處交控中心","h":12578,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=20461E7AABE69B6F","d":"2015-10-05","sid":"20461E7A"},{"q":"為促進交通流暢，交通號誌秒數及連鎖如何設定？","a":"本市交通號誌時制設計係依人車流量之變化切分號誌時段，計有平、假日、尖峰、離峰及夜間等10至12個時段，並配置合適時制，以減少停等及延滯，並考量車流量、幹道續進綠燈帶、疏解車流、行人安全通行時間及號誌連鎖等需求，檢討配置適當號誌週期秒數，於尖峰時段採較長週期秒數連鎖設計，而離峰時段則採相對較短週期秒數運作。","u":"臺北市交通管制工程處交控中心","h":12288,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6011548EB76C0FD3","d":"2015-10-05","sid":"6011548E"},{"q":"如何判斷禁停紅黃線是否為私人劃設？","a":"請在臺北市交通管制工程處網站查詢：www.bote.gov.taipei，點選「禁停紅黃線查詢」（圖檔更新會有2~3天落差），或者在上班時間電話撥該處27599741轉7910（北區：士林區、 北投區、內湖區、南港區、大同區、中山區）或7914（南區：松山區、信義區、大安區、文山區、萬華區、中正區）。","u":"臺北市交通管制工程處工程隊","h":11227,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=240DA8AE1A383316","d":"2015-10-05","sid":"240DA8AE"},{"q":"民眾陳情號誌秒數過短或不連鎖","a":"請協助詢問並加註「陳情路口及方向」、「遭遇不連鎖或秒數過短之時間」及「是否以往就有這種情形？抑或最近才發生？」，並請協助留下陳情人聯絡電話，以利無法判定時可以電話方式詢問。","u":"臺北市交通管制工程處交控中心","h":10888,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6F2747FA52EFA2E4","d":"2015-10-05","sid":"6F2747FA"},{"q":"臺北市之行車速限如何規定，請問那邊可知道這些資料？","a":"您可以連結臺北市交通管制工程處的網站，網址是 www.bote.gov.taipei 進入主畫面後選擇「行車管制」之「市區道路速限表」即可查詢。","u":"臺北市交通管制工程處規劃科","h":10802,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9027F264CCE2F246","d":"2015-10-05","sid":"9027F264"},{"q":"自行車騎乘於人行道之「人車共道」規定為何？","a":"「人車共道」規劃係依道路交通管理處罰條例第90條之3規定，在人行道適度寬度等條件允許下，設置人車共道標誌，開放自行車與行人共用人行道，但自行車騎乘時仍應禮讓行人優先通行，並禁止騎乘騎樓。","u":"臺北市交通管制工程處設施科","h":9906,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1A81772F082E96D7","d":"2015-10-05","sid":"1A81772F"},{"q":"想了解臺北市交通流量調查資料，請問到那邊查詢？","a":"您可以連結臺北市交通管制工程處的網站，網址是 https://www.bote.gov.taipei/ ，進入後選擇「業務資訊」＞「業務服務」＞「交通資料」之「交通流量調查資料」選項即可查詢。","u":"臺北市交通管制工程處規劃科","h":9624,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=40253FE5EC252066","d":"2015-10-04","sid":"40253FE5"},{"q":"臺北市之大貨車管制路段，請問那邊可知道這些資料？","a":"一、您可以連結臺北市交通管制工程處的網站，網址是www.bote.gov.taipei進入主畫面後選擇「行車管制」之「大貨車行車管制」即可查詢。\n二、向交通警察大隊查詢申請通行證。","u":"臺北市交通管制工程處工務科","h":9165,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=947C9DDAD5D91037","d":"2017-11-06","sid":"947C9DDA"},{"q":"我想在我的網站中引用交工處的即時交通路況影像，可以嗎？","a":"可依本市交工處「即時交通影像資訊加值利用申請須知」規定申請介接，申請方式詳情請參閱本市交工處網站，或可電(02)2556-7161洽詢。本市交工處「申請介接臺北市閉路電視攝影機(CCTV)作業說明」網址如下：\nhttps://www.bote.gov.taipei/cp.aspx?n=8B8FFEA8353857B5&s=586FD7BBE4631986","u":"臺北市交通管制工程處交控中心","h":9030,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4854A41A30FB9D3B","d":"2015-10-05","sid":"4854A41A"},{"q":"資訊可變標誌(CMS)故障如何通報相關單位處理？","a":"通報方式建議可描述該設備的位置，例如忠孝東路八德路往東方向或是直接通報附掛於設備之牌面編號如「CMS001」即可。","u":"臺北市交通管制工程處交控中心","h":8682,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4FEF8A5123B83B4E","d":"2015-10-05","sid":"4FEF8A51"},{"q":"發現安全設施、標誌等有毀損的狀況，要向誰通報？","a":"向1999話務中心通報，話務中心將儘速轉請臺北市交通管制工程處處理。但不包含： (1)人行道及騎樓禁停機車、卸貨停車管制牌面(臺北市停車管理工程處處理)、(2)計程車招呼站、大客車臨停牌面(臺北市公共運輸處處理)。\n註記:105年1月1日起原新工處無號誌街路、巷弄路名牌，移由交工處維護。","u":"臺北市交通管制工程處工程隊","h":8397,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=881AB0204456B932","d":"2015-10-05","sid":"881AB020"},{"q":"民眾反映附掛本處號誌桿件之警用監視器產生鳴響，如何處理？","a":"撥打110通報，由警察局處理。","u":"臺北市交通管制工程處工程隊","h":8272,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A649DA1734AB62DF","d":"2015-10-05","sid":"A649DA17"},{"q":"請問過馬路的行人按壓鈕，是否需要按壓才能使用?且其功能與使用時機為何?","a":"「行人按壓鈕」會設置在「閃燈」運作的路口，當你按下按壓鈕後，紅綠燈會從「閃燈」狀態轉變成紅黃綠三色運作，以保障行人可以安全通過路口。","u":"臺北市交通管制工程處規劃科","h":8150,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3DF07E2005394D0","d":"2015-10-05","sid":"D3DF07E2"}]},{"org":"第一區工程處","total":53,"items":[{"q":"環狀線北環段簡介","a":"捷運北環段路線起點接續環狀線第一階段新北產業園區高架車站，沿五股五工路前行由高架轉入地下，轉五權路穿越二重疏洪道，再沿國道1號南側前進，轉四維路接蘆洲中山一路到徐匯中學，再沿集賢路前進至重陽橋北側穿越淡水河進入社子地區，沿百齡橋北側穿越基隆河銜接士林中正路，至捷運士林站交會，再由中正路直行轉至善路，沿至善路二段至故宮，再轉向南穿越文間山至北安路南側，止於文湖線劍南路站交會；共設置車站12座(臺北市6座、新北市6座)及機廠1座，採中運量系統地下化方式興建，全長14.93公里。\n環狀線北環段橫跨臺北市與新北市之行政轄區，包括新莊、五股、蘆洲、三重、士林及中山等6個行政區，並可串聯已通車營運之桃園國際機場捷運線及捷運蘆洲線、淡水線、文湖線等路線，構建整體捷運路網，透過交會轉乘達到便捷運輸的目的，有效縮短捷運旅次時間，將提高捷運系統之可及性與機動性並大幅縮短各區域旅次時間，與帶動區域均衡發展，讓臺北都會區邁向宜居且永續發展的城市。\n捷運北環段工程目前已於109年完成細設作業後辦理發包，惟受大環境缺工、物價上漲、疫情及俄烏戰爭影響運價等因素，造成廠商投標風險增高、投標意願低落而流標多次；然捷運團隊仍不斷的瞭解廠商風險顧慮及檢討調整發包策略、內容，提高廠商投標意願，並已順利決標部分區段標。","u":"第一區工程處","h":4143,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BDE1593EC895DD2E","d":"2020-09-21","sid":"BDE1593E"},{"q":"捷運環狀線北環段交會站簡介","a":"捷運北環段設有12個地下車站，其中有4個與現有或未來路線交會之車站，其中Y21站位於新北市徐匯中學前，中山一路與集賢路交叉口之集賢路道路下方，與中和新蘆線徐匯中學站站內轉乘；Y24站位於臺北市中正路與通河西街二段交口西側停車場及社正公園下方，與規劃中社子/士林/北投區域輕軌線(LO04車站)交會轉乘；Y26站位於臺北市中正路與捷運淡水線交口之中正路下方，設置轉乘通道與淡水線士林站轉乘；Y29站位於臺北市敬業二路與敬業三路間之北安路下方，設置轉乘通道與文湖線劍南路站站內轉乘。","u":"第一區工程處","h":3290,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3D37950AF39F316","d":"2020-09-21","sid":"D3D37950"},{"q":"萬大線金城機廠及莒光站主要工程內容及特色為何？","a":"金城機廠位於新北市土城區金城路三段北側延壽路東側及中和區莒光路南側區域，面積有11.82公頃，其主要設施有儲車廠、維修工廠、行控中心、土木軌道廠、變電站及兩座滯洪池等，為具備全線儲車、維修、測試及管理等之全功能五級地下機廠，是全線唯一的機廠，將來於機廠結構上方預留構建聯合開發大樓空間。\nLG08A莒光站為地下二層捷運車站，設置2座出入口，地下車站上方於完工後則新闢20公尺的道路，連結土城區金城路三段及中和區莒光路，通車營運後可紓解當地交通。","u":"第一區工程處","h":2746,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=04FBF1A8A3591557","d":"2020-09-21","sid":"04FBF1A8"},{"q":"北環段CF680A工程出土段路線為何?","a":"路線規劃方案於108年5月31日奉行政院核定，採地下興建方式進入新北產業園區，於108年9月至109年3月召開4次協調會議說明路線規畫方案，並於109年5月8日辦理地方說明會，路線規劃內容如下：\n1. 出Y19 (幸福) 站採高架橋以5.5%坡度沿五工路進入園區。\n2. 高架橋跨越五權一路，於五權三路前設出土段。\n3. 於五權五路附近設Y19A地下車站，以潛盾隧道穿越路口建築物。","u":"第一區工程處","h":1373,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA653B90AE473F8F","d":"2020-09-21","sid":"AA653B90"},{"q":"捷運車站有哪些火災警報設施及設置目的，火災發生時旅客如何疏散？","a":"1.捷運車站火災警報設施：車站旅客服務處（PAO）附近設有1台智慧型火警授信總機（LFAP），連接轄區內火警探測器、火警警鈴、火災警示燈、手動火災警報器、自動撒水控制盤訊號、低污染氣體自動滅火設備訊號等，達到監控站體內各區域之火警狀態，並經由建築物管理系統（BMS）將訊號傳至中央監控系統（SCADA），同時連動緊急廣播對車站廣播火警狀態。\n2.火災警報設施設置之主要目的有二：(一)、第一時間即偵知火災發生之地點及狀況，俾利站務人員採取適當防護措施，以有效降低人員傷亡及財物損失；(二)、自動發出火災警報音響並連動緊急廣播系統，俾便快速疏散人群，同時連動各滅火及排煙等防災設備動作。\n3.捷運車站發生火災或緊急事故時，經由車站站務員確認後，啟動警報聲響後並透過車站廣播系統對旅客進行緊急廣播及必要的疏散訊息，旅客應聽從廣播或站務人員指揮疏散至安全地點。","u":"第一區工程處","h":1327,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AD9E85776D85CA25","d":"2020-09-21","sid":"AD9E8577"},{"q":"捷運北環段路線經過哪裡?何時開工?","a":"1. 捷運北環段起自新北產業園區站經新莊、五股、蘆洲、三重至士林，再往故宮後穿越文尖山至捷運劍南路站交會，共設置車站12座(臺北市6座、新北市6座)及機廠1座，採中運量系統地下化方式興建，全長14.93公里。\n2. 捷運北環段工程已有3個標案完成發包並自111年3月1日陸續開工。","u":"第一區工程處","h":1325,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8781B3136BC7247E","d":"2020-09-21","sid":"8781B313"},{"q":"捷運連續壁及開挖施工，如何預防鄰近建築物沉陷及受損？","a":"捷運施工前會依設計規定對建築物影響範圍內進行建築物現狀調查及安裝觀測儀器(傾斜計、沉陷計、水位計等)，以釐清施工前現狀，及於施工期間固定頻率觀測建築物之傾斜計及沉陷計之變形量管制數值，以確保建築物是否在安全範圍內。\n連續壁施作前會先進行施工區導溝及鋪面施作，避免鄰近建物下方造成坍塌及滲水等影響，後續當連續壁一片接一片完成接合後，此時周邊與捷運連續壁工程處於較穩定狀況。接續進行中間柱基樁、覆工版及開挖支撐施工，而開挖支撐需採小區域採淺挖淺撐施作，對開挖後連續壁位移變形量控制於最小值，以防止周邊建築物傾斜及沉陷量超出設計規定，確保建築物安全及避免受損。","u":"第一區工程處","h":1185,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FD691BA02E94AC05","d":"2020-09-21","sid":"FD691BA0"},{"q":"捷運環狀線北環段先期工程目前招標狀況。","a":"捷運環狀線北環段汙水管遷移及植栽標等先期工程均完工並驗收合格。","u":"第一區工程處","h":1079,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9986050F17C2E504","d":"2020-09-21","sid":"9986050F"},{"q":"萬大線金城機廠及莒光車站目前工作進度如何及預定何時完工？","a":"至112年6月30日止累計進度63.07%微幅超前，土建工程預計於114年9月完工。\n目前正進行東側道路滯洪池主體結構已完成、人工平台基礎施作、儲車廠區結構、扇形區結構、土軌廠結構、通風豎井結構、主變電站裝修、管理中心結構、維修工廠區結構、牽引動力變電站結構，莒光車站建築裝修等施作。","u":"第一區工程處","h":1020,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=484701C5A9BD8B8F","d":"2020-09-21","sid":"484701C5"},{"q":"北環段CF680A工程潛盾作隧道遭遇之困難及挑戰?","a":"1. 土壤液化：Y19A至Y19B(五工路/五權路口至疏洪東路三段/中興路二段口)之潛盾隧道段，地表下8.9～20公尺之土壤為松山層第5次層之砂土層(N值約8～19)，抗液化安全係數小於1，屬中度液化潛能區，將於隧道環片底部深度小於20公尺施作抗液化地盤改良。\n2. 急曲線段 R=50m，R=60m：採中折式潛盾機，可隨時修正掘進線形，並同步背填灌漿，即時填補盾尾之地層空隙；盾殼及盾首設置灌漿孔，必要時由潛盾機內灌漿，並採用鑄鐵環片及機身灌漿因應。\n3. 穿越既有建物下方：穿越既有建物下方潛盾超挖可能造成地表鄰房沉陷，於既有建物下方採地盤改良水平灌漿方式進行建物保護。\n4. 地中障礙：Y19A~Y19B車站間之潛盾隧道可能遭遇台電廢棄電塔基礎之障礙，將於施工前進行試挖、地球物理探測調查及鑽心等方式確認位置及深度是否與隧道線形衝突，並於潛盾施工前予以破除。\n5. Y19B ~Y20(五股至蘆洲段)車站間之潛盾隧道穿越中山高，潛盾施工鄰近橋梁基礎，其到達橋梁基礎前除須完成橋梁之相關保護措施(如地改)及佈設檢驗孔外，施工須慎重以避免影響橋梁基礎及營運。潛盾機穿越高速公路時，將依現地監測結果採用必要之灌漿措施(如：地表地盤改良、機身灌漿、背填灌漿等)以減少沉陷。","u":"第一區工程處","h":859,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CE86CB8BC4C9553C","d":"2020-09-21","sid":"CE86CB8B"},{"q":"環狀線捷運高架車站以自然通風換氣及局部空調設計概念？","a":"環狀線高架車站設計空調以自然通風換氣為主，夏天熱空氣屬上升氣流，當外部空氣進入站體，會順勢往上流動直接排出達到換氣效果，而在月台採局部空調，候車區域符合人體舒適溫度，並可使車站與外部空氣混合達到空氣交換及增加候車民眾舒適感。 當冬季時，則可關閉空調全採取自然通風，達到節能並能兼顧乘客舒適性。","u":"第一區工程處","h":670,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A5A5E83E7FB0AE72","d":"2020-09-21","sid":"A5A5E83E"},{"q":"第一區工程處轄管施工之捷運萬大線（第一期工程）LG07 (連城錦和站)、LG08 (中和高中站)的主要工程內容及特色為何？","a":"1. LG07連城錦和站：\n位於新北市連城路與錦和路口，為一地下3層島式月臺車站，車站南北兩側各設出入口及通風井，且道路下方管線密佈，並於連續壁施工前需妥善遷移，另為減低對交通的影響，採3階段交維措施，分別為南側、北側及中央段，兼顧施工與車流之需。\n2. LG08中和高中站：\n位於新北市連城路與員山路口，為一地下2層島式月臺車站，車站南北兩側各設一出入口及通風井。","u":"第一區工程處","h":653,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4CA567FB3911F9FC","d":"2020-09-21","sid":"4CA567FB"},{"q":"有關衛福部目前所採行之樂生療養院入口意象方案，因樂生保留自救會與青年樂生聯盟反對，以致遲遲無法施作，是否會連帶影響捷運新莊機廠營運？","a":"不影響捷運新莊機廠營運。\n1. 樂生入口意象案目前雖暫時無法執行，惟捷運新莊機廠現已納入營運，不受影響。\n2. 衛福部辦理之樂生療養院入口意象景觀工程案歷經4次流標後，於109年5月19日決標。臺北高等行政法院109年7月7日裁定同意公民團體就樂生入口意象案所提出之假處分聲請，要求環保署應命衛福部樂生療養院於環評核准前暫停施作。其後衛福部於109年7月14日開會決議依照法院裁定，暫停執行入口意象景觀工程。\n3. 有關公民團體針對「樂生入口意象與第二人行陸橋規劃案」環境影響評估事件提起行政訴訟案，經臺北高等行政法院於111年6日30日判決駁回原告之訴。上訴人(同原告)於111年7月27日提起行政上訴，目前正由最高行政法院受理中，經樂生療養院表示，待訴訟案定讞後，方能辦理後續招標事宜。\n4. 後續如樂生入口意象案再次復工施作時，將要求衛福部及樂生療養院應就施工時間與臺北捷運公司協調，以不影響機廠進出及營運為原則。","u":"第一區工程處","h":616,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=602D327B2B353759","d":"2020-09-21","sid":"602D327B"},{"q":"捷運施工後，如何減輕對周邊交通及居民生活環境影響？","a":"為避免用路人因重大捷運交通工程施工之影響，致增加行車時間，除加強宣導用路人儘量利用周邊平行替代道路疏導車流外，在重要路口尖峰時段均會派駐義交協勤，以達交通舒緩之目的。針對施工音量較大工項，除要求廠商儘量採用低噪音機具外，在施工圍籬周邊亦會裝設減噪之措施，並要求施工工人降低機具碰撞聲或減低音量，以減輕對鄰近居民之影響。","u":"第一區工程處","h":578,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7DD8489B1DC73BD7","d":"2020-09-21","sid":"7DD8489B"},{"q":"臺北車站特定專用區台北雙星土地開發案，目前辦理情形？何時動工？","a":"投資人台北雙星公司分別於111年10月21日及25日領取西側D1大樓及東側C1大樓建造執照112年4月19日申報開工，目前進行基地內圍籬架設、室外花台區移除及地坪整平補強等前置作業。本開發案工期1718日曆天(約4年9個月)，預計116年底完工取得使照。","u":"第一區工程處","h":542,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=23F318DBCFF044B6","d":"2023-02-15","sid":"23F318DB"},{"q":"捷運局第一區工程處代辦文化局「臺北市立美術館典藏庫房新建暨南進門改善統包工程」案之位置、工程內容及時程為？","a":"1.典藏庫房基地位於現有美術館東側，屬於花博公園園區。\n2.統包工程內容包含新建典藏庫房大樓、既有館舍改善工程及南進門改善工程。\n3.109年9月2日統包標經公開評選決標予久年營造股份有限公司／益鼎工程股份有限公司／張樞建築師事務所共同承攬，109年 9月7日簽約，於109年9月17日開工，預計112年10月29日竣工。","u":"第一區工程處","h":531,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=31A34EF6634E2F5D","d":"2020-09-21","sid":"31A34EF6"},{"q":"施工期間機場捷運台北車站有營運嗎?","a":"1.機場捷運台北車站於施工期間仍正常營運。\n2.但部分出入口如機場捷運 2 號、4號、7 號及台北地下街 Y18 及 22 出口管制通行，民眾可依循導引指標，改由機場捷運 1 號、3 號、5 號、6 號及台北地下街 Y12、Y26 等出口進出。","u":"第一區工程處","h":478,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F36D40ADC24228FF","d":"2023-07-24","sid":"F36D40AD"},{"q":"為什麼男女廁所入口有設置使用狀況顯示盤？","a":"在廁所入口處設置使用狀態顯示盤，可提高緊急狀況應變處置，並方便旅客了解使用情形等，以提升服務品質。","u":"第一區工程處","h":447,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C9ED86FF13E58CF0","d":"2020-09-21","sid":"C9ED86FF"},{"q":"士林區至善路2段故宮博物院附近路樹有綁抗議布條，後續這些樹木會是如何處理?","a":"有關士林區至善路2段故宮博物院附近之路樹原規劃於先期植栽標進行移除，因有民眾反映應妥善規劃保護避免用移除方式處理，經本處與當地民眾及里長協調後，本區域之樹木將由移除改為移植方式處理，並將該區需移植之樹木納入Y28故宮站主體工程內辦理，於主體工程開工後再行辦理移植作業。","u":"第一區工程處","h":439,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2F697384FCC7108F","d":"2023-02-15","sid":"2F697384"},{"q":"第一區工程處如何督導確保工地材料符合規定？","a":"本處材料試驗工務所負責辦理本處第二級材料品管，工作內容包括材料商資格審查、大宗材料查證，以及品質計畫落實度、現場品管抽查查證等工作，可以再次驗證並確保工地材料符合規定。","u":"第一區工程處","h":414,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C9852635EA40405B","d":"2020-09-21","sid":"C9852635"},{"q":"有關環狀線北環士林站出入口B土開大樓興建內容。","a":"捷運北環段路線於士林區採地下化方式興建，沿中正路與捷運淡水線士林站交會，於士林站東南側基地，由投資人開發為捷運環狀線北環段士林站出入口B(及相關附屬設施)以及捷運共構大樓使用。基地東臨17公尺文林路，南接6公尺文林路421巷 ，北側及西側為鄰房；基地面積1,051平方公尺，設計規模為地下3層至地上12層(含屋突二層)，本案工程內容包括B3-3F共構部分及4F-R1F之捷運冷卻水塔管道間、維修梯間等捷運設施(含出入口、通風口及其他相關附屬設施)。","u":"第一區工程處","h":403,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=773D5F34FCB97592","d":"2023-02-15","sid":"773D5F34"},{"q":"捷運萬大線第一期工程由第一區工程處所負責監造之工程範圍及車站位置？","a":"捷運局第一區工程處負責監造施工之工程路線，自連城路與景平路口西南側之連城路下方LG06中和站，往西以潛盾隧道方式沿連城路，西經錦和路附近設置LG07連城錦和站及一座中央避車線，再向西穿越中正路至員山路附近設置LG08中和高中站，再以潛盾隧道銜接土城區金城路3段之明挖覆蓋隧道，至延壽路以東之金城機廠，機廠內設置1座LG08A莒光站。","u":"第一區工程處","h":374,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8FE4A365D96174A6","d":"2020-09-21","sid":"8FE4A365"},{"q":"北捷局一工處代辦工程之招標狀況","a":"1.臺北市立圖書館康寧分館合署大樓新建工程（案號：IZ0008）招標案已於112年4月28日由菁木營造有限公司得標，決標金額為4億9,584萬元整，並於112年7月16日開工。\n2.臺北市立浩然敬老院重建工程（案號：IZ0007）已於112年7月3日公開招標，訂於112年8月17日開標。","u":"第一區工程處","h":372,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A4A30467FC06DCA1","d":"2023-07-13","sid":"A4A30467"},{"q":"萬大線LG08A莒光站及機廠噪音是否符合法令規定？","a":"均符合最新環保相關法規\nLG08A莒光站之通風口，其出口噪音測值均需符合最新環保相關法規，設計時除已考量通風廊道隔音及吸音裝修外，並已訂定設備噪音(如冷卻水塔、配電室及水電環控設施)之八度音頻合理值，另就環控系統大型重要設備及常時運轉之設備訂定振動標準，以阻隔機組運作產生之音源噪音並配合消音箱作噪音衰減，前述噪音防治均以不妨礙毗鄰建物之環境舒適，並交付得標廠商作為責任施工。\n金城機廠之水電環控設施亦已考量前述噪音防制條件，因廠區棟距較寬及環廠道路等有利條件值，噪音影響層面相對較少。","u":"第一區工程處","h":368,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7F77DB848FB3F180","d":"2023-02-15","sid":"7F77DB84"},{"q":"台北雙星施工期間若有施工疑問，現場詢問管道為何?","a":"1.施工期間若有相關問題詢問，可撥打下列電話。\nTBJ-JV團隊 工程師/廖瑞廷/0922-410-309\n2.另可透過台北市政府、臺北市政府捷運工程局、台北雙星股份有限公司及中正區公所網址首頁了解資工資訊。","u":"第一區工程處","h":349,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=78C5903AB1C35C66","d":"2023-07-24","sid":"78C5903A"}]},{"org":"財政局","total":51,"items":[{"q":"販賣菸酒，是否需要申請菸酒販賣業許可執照？","a":"不，無需申請販賣業許可執照。\n自91年1月1日起，販賣菸酒只須向臺北市商業處辦理營利事業登記，及向財政部臺北國稅局辦理營業稅籍登記即可，不須申請菸酒販賣業許可執照。如有疑義，請洽財政局菸酒暨稅務管理科查詢，電話02-27208889/1999轉6294","u":"臺北市政府財政局菸酒暨稅務管理科","h":61566,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=92FC9BFBC8C5412B","d":"2008-12-29","sid":"92FC9BFB"},{"q":"軟體是否應列入財產帳管理？","a":"否。\n依行政院主計處七十五年十月二十三日臺(七五)處孝五字第○九七二五號函釋，套裝軟體或委託電腦公司規劃設計之各項應用軟體，非屬財產範疇，不需列財產帳管理。","u":"臺北市政府財政局公產管理科","h":23386,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4F3417554D32F33A","d":"2015-04-23","sid":"4F341755"},{"q":"請問領取支票需要帶什麼證件及資料？","a":"1.如果本人領取，請帶付款憑單關係通知單、本人身分證件正本及印章。\n2.如果委託他人代領，請帶已填妥授權資料之付款憑單關係通知單、本人及代領人身分證件正本及印章。","u":"臺北市政府財政局支付科","h":16129,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=898E8ABE97C7D93B","d":"2018-03-26","sid":"898E8ABE"},{"q":"新增之財產，如行政院頒布之「財物標準分類」未列舉者，應如何處理？","a":"財物標準分類未列舉者，以「財物標準分類」相同材質、用途及最低使用年限相近之編號入帳。","u":"臺北市政府財政局公產管理科","h":13919,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1FEFFBCC75539E6F","d":"2015-04-23","sid":"1FEFFBCC"},{"q":"申購市有畸零土地之條件？如何申購？計價方式？","a":"(一)私有土地有合併市有土地使用之必要者，私有土地所有權人應先取得市有畸零地所在地之直轄市或縣（市）政府建築主管機關核發公私有畸零地合併使用證明書後，洽財政局申購。\n(二)申購畸零地應檢附相關證明文件郵寄、親自或委託他人向財政局申辦，申請書格式及應備證明文件可至「台北服務通」(網址： https://service.taipei/ )下載查詢。\n(三)計價方式：按市價查估。\n(四)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉6312","u":"臺北市政府財政局非公用財產管理科","h":13895,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD5168C0402CC47E","d":"2017-05-05","sid":"CD5168C0"},{"q":"機關接受民間捐款之相關規範為何？","a":"本府訂有「臺北市政府所屬各機關學校捐款收支管理要點」，規範本府各機關收受捐款之收支管理作業。\n要點規範內容包括：接受捐款之迴避處理原則、捐款收支處理原則、管理委員會之設置、指定用途捐款結餘之處理方式、捐款收支應定期公告經費收支運用情形及主管機關查核等事項。","u":"臺北市政府財政局財務管理科","h":12941,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CF7A9400D10A12A6","d":"2015-04-23","sid":"CF7A9400"},{"q":"申報個人綜合所得稅有疑義要向哪一單位詢問?","a":"綜合所得稅是國稅，非財政局及稅捐處業務權責，請洽財政部臺北國稅局，聯絡電話：02-23113711； 另財政部臺北國稅局免費服務電話 : 0800-000-321（稅務問題，限辦公時間星期一至星期五 上午08:30~12:30、下午1:30~5:30 提供服務）。","u":"臺北市政府財政局菸酒暨稅務管理科","h":12628,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1B9DC7B60B3AC22B","d":"2015-04-24","sid":"1B9DC7B6"},{"q":"電連存帳發生退匯時如何處理？","a":"各支用機關接獲退匯通知後，應於金融機構營業日4個工作日內，填妥更正申請單送達財政局辦理更正再匯或不匯作業。不匯作業須由原支用機關檢具財政局審核後之更正申請單，連同「支出收回書」送代庫銀行辦理繳庫事宜。","u":"臺北市政府財政局支付科","h":12365,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E21D30F0D9111DF7","d":"2018-03-26","sid":"E21D30F0"},{"q":"電連存帳匯款時間？","a":"每日匯款作業於9點至15點30分執行。","u":"臺北市政府財政局支付科","h":11979,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=478B34B474E82C2D","d":"2018-03-26","sid":"478B34B4"},{"q":"被占用市有土地收回後之處理？","a":"可行方法如下：\n1.未開闢使用前，應暫時標租作臨時平面停車埸或協調停管處評估劃設停車格，以紓解停車需求。\n2.依「臺北市市有公用不動產提供使用辦法」提供使用，增裕庫收。\n3.倘無法出租（提供使用）則應定期巡查避免被占用或辦理綠美化以美化市容。\n4.經檢討原定用途需予廢止者，則洽本府都市發展局研議辦理都市計畫變更作其他用途使用。","u":"臺北市政府財政局公產管理科","h":11727,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=940D9EE8CCBC3F7D","d":"2017-10-16","sid":"940D9EE8"},{"q":"承租市有土地之租金有無優惠？","a":"(一)市有土地出租租金計收方式，原則依照土地申報地價年息5%計收租金。承租戶設有戶籍並自住者，其承租面積在100平方公尺以內部分，租金按6折優惠計收，如承租人本人為低收入戶或中低收入老人，租金則按4折優惠計收。\n(二)申請自用住宅租金優惠應檢附相關文件郵寄、親自或委託他人向財政局申辦，申請書格式及應備證明文件可至「台北服務通」(網址：https://service.taipei)下載查詢。\n(三)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉1183。","u":"臺北市政府財政局非公用財產管理科","h":11106,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=42E7035372E69F5C","d":"2017-05-05","sid":"42E70353"},{"q":"檢舉違法菸酒可以請領獎勵金的範圍為何？","a":"依現行檢舉或查獲違規菸酒案件獎勵辦法規定，檢舉案件如經主管機關依法裁罰者，其給獎範圍以檢舉私、劣菸酒之案件為限；至酒廣告未標示警語、網路賣酒、販賣逾期菸酒、菸酒標示不符規定等檢舉案件，則不再發給檢舉獎金。如有疑義，請洽財政局菸酒暨稅務管理科查詢，電話02-27208889/1999轉6294","u":"臺北市政府財政局菸酒暨稅務管理科","h":10734,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A7A266C3A422EE8D","d":"2015-01-05","sid":"A7A266C3"},{"q":"建物之列帳價格為何？","a":"房屋建築及設備以建造或取得成本為準。但無法查明建造或取得成本者，以稅捐稽徵機關提供之房屋評定現值為準，如無房屋評定現值者，由管理機關估定之。","u":"臺北市政府財政局公產管理科","h":10533,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2BD3A9F425E018FF","d":"2015-04-23","sid":"2BD3A9F4"},{"q":"經管市有房地如已無公務使用需要應如何處理？","a":"一、公用不動產因用途廢止或基於事實需要，已不需使用者，依本市市有財產管理自治條例第32至35條規定，申報變更為非公用財產及依臺北市市有公用不動產變更為非公用財產移交接管注意事項規定，得由財政局徵詢各機關使用需求，優先提供公務使用，或報經本府依本市市有財產管理自治條例第7條規定核定接管機關。 二、另倘無其他公務使用需求，則管理機關應清理完善後報府核准變更為非公用財產，由財政局接管依法處理。","u":"臺北市政府財政局公產管理科","h":10461,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4C2E62F948E78CFD","d":"2018-03-21","sid":"4C2E62F9"},{"q":"財產應由何單位保管？","a":"各機關之財產，由使用單位個人使用部分，以使用人為保管人員；由使用單位二人以上共同使用部分，由主管人員指定專人保管；由二個以上使用單位共同使用者，由機關指定專人保管。","u":"臺北市政府財政局公產管理科","h":9818,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EED3D526DE8979B7","d":"2015-04-23","sid":"EED3D526"},{"q":"台北富邦銀行的業務主管機關是臺北市政府財政局嗎？","a":"否，是金管會銀行局。\n銀行業為受高度監管的特許行業，金融監督管理委員會(簡稱金管會)主管金融市場及金融服務業之發展、監督、管理及檢查業務。金管會下設銀行局辦理銀行市場、票券市場、金融控股公司與銀行業之監督、管理及其政策、法令之擬訂、規劃、執行等業務。","u":"臺北市政府財政局菸酒暨稅務管理科","h":9535,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F65CE9EA10FC9352","d":"2015-04-24","sid":"F65CE9EA"},{"q":"租占人如何申購已承租或占用之市有土地？如何計價？","a":"(一)市有非公用土地，在民國59年3月27日前被占建房屋，經繳納占用期間之使用補償金後，得洽財政局申購。\n(二)承租人或占用人擬申購使用之市有土地，應檢附相關證明文件郵寄、親自或委託他人向財政局申辦，申請書格式及應備證明文件可至「台北服務通」(網址： https://service.taipei/ )下載查詢。\n(三)計價規定：按市價查估。\n(四)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉6312","u":"臺北市政府財政局非公用財產管理科","h":8706,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9085707C2EB9448F","d":"2017-05-05","sid":"9085707C"},{"q":"市有閒置房地可否提供民眾使用？","a":"(一)市有非公用不動產，經評估無公務或其他使用計畫，有下列情形之一者，得採申請使用方式辦理:\n1、經公開標租無法標脫。\n2、經評估不具公開招標條件。\n3、與私有土地或建物毗鄰，併同使用具經濟效益。\n(二)市有非公用不動產提供使用，申請人應為本國法人、合法立案之團體或具有行為能力之自然人。使用期限最長5年，並得延長1次。\n(三)申請人應檢附相關文件郵寄、親自或委託他人向財政局申辦，申請書格式及應備文件可至「台北服務通」(網址： https://service.taipei/ )下載查詢。\n(四)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉6281。","u":"臺北市政府財政局非公用財產管理科","h":8587,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=353F6A74C6D8884D","d":"2017-05-05","sid":"353F6A74"},{"q":"如果酒的廣告或促銷違反規定，會怎麼處罰？","a":"違反菸酒管理法第37條規定而為酒之廣告或促銷者，處新臺幣3萬元以上50萬元以下罰鍰，並通知限期改正；屆期未改正，得按次連續處罰。（菸酒管理法第51條）如有疑義，請洽財政局菸酒暨稅務管理科查詢，電話02-27208889/1999轉6294","u":"臺北市政府財政局菸酒暨稅務管理科","h":8061,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=14DFA3C7A65FBED9","d":"2015-01-05","sid":"14DFA3C7"},{"q":"臺北市市庫代理銀行是哪家金融機構？如何產生？","a":"現任市庫代理銀行為台北富邦銀行。臺北市市庫代理銀行係依公庫法等規定，公開招標遴選產生，並報經臺北市議會同意後簽約。","u":"臺北市政府財政局財務管理科","h":7917,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F929B7713B219336","d":"2012-05-02","sid":"F929B771"},{"q":"占用市有土地如何申請分期攤繳使用補償金？","a":"(一)市有土地占用人積欠無權占用使用補償金，確有困難不能一次繳清，得檢附申請書洽財政局申請分期繳納，並提供本票及授權書擔保。 申請書格式及應備文件可至「台北服務通」(網址： https://service.taipei/ )下載查詢。\n(二)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉1183","u":"臺北市政府財政局非公用財產管理科","h":7284,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=02EE6C6554C50B7F","d":"2017-05-05","sid":"02EE6C65"},{"q":"私有建物占用市有土地可否申請承租？","a":"(一)占用市有土地申請承租者，需在民國82年7月21日前即占建房屋，而不妨礙都市計畫，並繳納占用期間之使用補償金者，始能申請承租。 (二)申請人應檢附相關文件郵寄、親自或委託他人向財政局申辦，申請書格式及應備證明文件可至「 台北服務通 」(網址：https://service.taipei)下載查詢。 (三)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉1183。","u":"臺北市政府財政局非公用財產管理科","h":6179,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A0AB371BFDA1A691","d":"2017-05-05","sid":"A0AB371B"},{"q":"私有建物使用市有土地已辦理承租者，如私有建物買賣或贈與，應如何辦理後續承租市有土地手續？","a":"(一)市有土地承租人將地上建物出售，應先依土地法第104條規定通知財政局依同樣條件優先購買；承租人將地上建物出售或贈與他人，應於移轉事實發生之日起30日內會同承受人向出租機關申請過戶承租。\n(二)申請人應檢附相關文件郵寄、親自或委託他人向財政局申辦，申請書格式及應備文件可至「台北服務通」(網址：https://service.taipei/)下載查詢。\n(三)如有疑義，請洽財政局非公用財產管理科查詢，電話1999(外縣市02-27208889)轉1183。","u":"臺北市政府財政局非公用財產管理科","h":6130,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BDCA3CC40D74F425","d":"2017-05-05","sid":"BDCA3CC4"},{"q":"財政局經管之捷運中山、東區及西門地下街目前是由誰經營管理及聯絡方式？","a":"財政局經管之捷運中山、東區及西門地下街目前係委由臺北大眾捷運股份有限公司經營管理。地下街位址及捷運公司聯絡電話如下：\n中山地下街：臺北市大同區長安西路52之1號及民生西路47號地下1層；聯絡電話02-25505600，分機：3228\n東區地下街：臺北市大安區大安路1段77號地下1層；聯絡電話02-25505600，分機：3202\n西門地下街：臺北市中正區中華路1段51之1號地下1層；聯絡電話02-25505600，分機：3202","u":"臺北市政府財政局菸酒暨稅務管理科","h":6073,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F3C99E5F25E9E966","d":"2015-04-24","sid":"F3C99E5F"},{"q":"請問台北市信用合作社之金融管理是財政局哪一科辦理？","a":"由財政局菸酒暨稅務管理科辦理，電話1999(外縣市02-27208889)轉6295。","u":"臺北市政府財政局菸酒暨稅務管理科","h":5641,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CA6C1A2724FCB547","d":"2008-12-08","sid":"CA6C1A27"}]},{"org":"市場處","total":49,"items":[{"q":"本市市場處轄有超級市場有幾處？其地點為何？","a":"本市營業中市場處轄有超級市場共計37處，有關各超市地點與其他相關資訊，請進入臺北市市場處網站（ https://www.tcma.gov.taipei ）→「 市集介紹 」→「 超級市場 」，點選所要查詢的市場即會顯示其基本資料。","u":"臺北市市場處市場輔導科","h":39621,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E27615EC48420E22","d":"2026-04-01","sid":"E27615EC"},{"q":"臺北市公有零售市場有幾個？名稱為何？地址及電話？","a":"一、臺北市公有零售市場計有40處，商場計有7處，共計47處。\n二、請進入臺北市市場處機關入口網（ https://www.tcma.gov.taipei ）→「市集介紹」→「 傳統市(商)場 」，點選各市(商)場即會顯示其基本資料。","u":"臺北市市場處公有零售市場科","h":23071,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=90E71575EB75D6FB","d":"2026-04-01","sid":"90E71575"},{"q":"南門市場營業時間？","a":"休市日:週一休市\n營業時間:上午7時至晚上7時。","u":"臺北市市場處公有零售市場科","h":16496,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2688994AA7072C0C","d":"2026-04-01","sid":"2688994A"},{"q":"台北地下街之地理位置為何？","a":"台北地下街位於本市市民大道下方，西起塔城街東側，沿市民大道經過延平北路、重慶北路、太原路等重要南北幹道路口，擁有三捷二鐵（桃園機場捷運線、捷運臺北車站、捷運北門站、台鐵及高鐵），並與京站（臺北轉運站）連接 ，全長825公尺，寬36至39公尺。","u":"臺北市市場處市場輔導科","h":13723,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9B60577413A312AE","d":"2026-04-01","sid":"9B605774"},{"q":"臺北市花卉批發市場(俗稱台北花市)位置、營業時間、聯絡電話?","a":"臺北市花卉批發市場103年3月搬遷至台北市內湖區新湖三路28號(A館)、36號(B館)。 營業時間:原則上週一至週六上午4時至12時，如有異動可洽公司詢問。 休市日：請至公司網站（ http://www.tflower.com.tw ）查詢。\n聯絡電話:(02)2790-9729","u":"臺北市市場處批發市場科","h":12477,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4F3CF16B4747335F","d":"2026-04-01","sid":"4F3CF16B"},{"q":"如何申請建國玉市攤位？","a":"有關建國玉市設攤入會事宜，請洽「社團法人中華玉器藝術文化交流協會」（聯絡電話：（02）2708-5931）及「社團法人台北市玉石文物協進會」（聯絡電話：（02）2708-7883）。依本府核定之場地使用人遞補規定，其遞補資格為原攤位經營人之配偶、直系親屬、兄弟姐妹及合夥人。\n（如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）2550-5220分機2405至2417）","u":"臺北市市場處攤販科","h":12175,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=455B30DCB880A54D","d":"2026-04-01","sid":"455B30DC"},{"q":"申請配租公有市場攤位資格？","a":"身心障礙朋友、原住民朋友及領有攤販營業許可證者，須依民法規定具有完全行為能力且設籍臺北市，並以一戶一攤（鋪）位為原則，可申請配租公有市場攤位。最新可個別配租空攤位明細可至臺北市市場處機關入口網（ https://www.tcma.gov.taipei ）→「便民服務」→「 公有市(商)場空攤明細表」查詢、下載，如有任何疑問請洽詢臺北市市場處，聯絡電話：（02）2550-5220分機2139。","u":"臺北市市場處公有零售市場科","h":10926,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=308C59467205D248","d":"2026-04-01","sid":"308C5946"},{"q":"各批發市場的位置及聯絡電話？","a":"各批發市場地址及聯絡電話如下：\n一、 臺北市 第一果菜批發市場—地址：臺北市萬華區萬大路533號，聯絡電話：（02）2307-7130。\n二、 臺北市 第二果菜批發市場(濱江果菜市場)—地址：臺北市中山區民族東路336號，聯絡電話：（02）2516-2519。\n三、臺北市魚類批發市場(萬大路魚市)—地址：臺北市萬華區萬大路531號，聯絡電話：（02）2303-3117。\n四、民族魚市場(臺北魚市)—地址：臺北市中山區民族東路410巷2弄20號，聯絡電話：（02）2509-9490。\n五、臺北市家禽批發市場(家禽批發市場)—地址：臺北市萬華區環河南路二段338號，聯絡電話：（02）2305-5115。\n六、第二家禽批發市場—地址：臺北市文山區興隆路二段99號，聯絡電話：（02）2932-7755。\n七、第四區肉品批發市場—地址：臺北市大同區昌吉街59號，聯絡電話：（02）2585-3388。\n八、臺北市花卉批發市場(台北花市)—地址：臺北市內湖區新湖三路28號、36號，聯絡電話:(02)2790-9729。\n您也可以至臺北市市場處網站（ https://www.tcma.gov.taipei ）→「 市集介紹 」→「 批發市場 」查詢更多市集基本資料相關資訊。","u":"臺北市市場處批發市場科","h":10881,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69ED6DBEC81C5296","d":"2026-04-01","sid":"69ED6DBE"},{"q":"攤販與公有市場攤商如何區別？","a":"一、「攤販」之定義依現行之「臺北市攤販管理自治條例」第二條，係指市場以外之攤販而言。\n二、「臺北市零售市場管理自治條例」第3條：「本自治條例所稱零售市場，指經臺北市政府（以下簡稱市政府）核准設立，於本市都市計畫市場用地，以零售及劃分攤（鋪）位方式，供蔬、果、魚、肉類及其他民生用品集中零售之營業場所」、第7條：「申請使用公有市場攤（鋪）位，應填具申請書，向市場處提出；經核准後，應參加公有市場攤（鋪）位分配，並簽訂契約，違者視同放棄使用資格。前項申請使用人應於簽訂契約之次日起一個月內，加入公有市場自治組織成為會員後，始得營業 」；是以「攤商」之定義，係指承租（或使用）市場攤（鋪）位之承租人（或使用人）。\n（如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）2550-5220分機2405至2417）","u":"臺北市市場處攤販科","h":10467,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2E18053DEC1E72EA","d":"2026-04-01","sid":"2E18053D"},{"q":"騎樓或商店前人行道可以作為營業地點嗎？","a":"一、依現行之「道路交通管理處罰條例」規定，騎樓及人行道未經許可不准為攤販之營業地點。\n二、若違反者，依「道路交通管理處罰條例」規定由臺北市政府警察局依法告發取締。\n（如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）2550-5220分機2405至2417）","u":"臺北市市場處攤販科","h":10172,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9B5171F8AF5EFC65","d":"2026-04-01","sid":"9B5171F8"},{"q":"有關臺北市市場處權管台北及站前地下街代號如何分辨？","a":"臺北車站特定區位於本市交通樞紐，有高鐵、臺鐵、捷運淡水線、捷運板南線、捷運松山新店線及桃園機場捷運線等6條交通線路交會，並有台北(Y區)、站前(Z區)、中山(R區)及K區等4條地下街（分屬不同機關管理）；有關特定區各出入口的指標系統主要以色彩、符號及編號等三種方式區分規劃。各出入口並張貼有導覽圖，歡迎民眾多多利用。台北及站前地下街出入口分辨原則如下：\n一、台北地下街：黃色，符號為Y，編碼原則是北側單號、南側雙號，由東至西依序編號，包含Y1至Y28。\n二、站前地下街：粉紅色，符號為Z，編碼原則為北側單號、南側雙號，由東至西依序編號，包含Z1至Z10。","u":"臺北市市場處市場輔導科","h":9690,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B692574C86ACDF3","d":"2026-04-01","sid":"5B692574"},{"q":"有證攤販申請變更許可證名義、營業地點或營業項目，應準備哪些資料？","a":"一、填寫申請書並請附上： 1.資格證明文件； 2.最近三個月半身1吋照片2張； 3.飲食攤販請加附公立醫院體檢表（含胸部Ｘ光及A型肝炎檢查項目）； 4.設攤地點位於私人土地者應檢附全體土地所有權人使用同意書； 5.申請變更營業地點者應自行尋覓適當營業地點，且該營業地點不得違反「臺北市攤販管理自治條例」第16條所規定之觀光地區、重要街道或市場周圍200公尺內不得擺設攤販之限制者。 6.依「臺北市攤販營業許可證收費標準」：申請核發、補發、換發攤販營業許可證者，每張收費新臺幣三百元。但設籍於臺北市之低收入戶並檢附證明文件者，得予免徵。\n二、另外也可以進入「台北服務通」(https://service.taipei頁面最下方:機關/產業局/市場處))查詢申請方式及處理期限，或網路申辦。 （如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）25505220分機2405至2417）","u":"臺北市市場處攤販科","h":9282,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0CDF3E8B326337BB","d":"2026-04-01","sid":"0CDF3E8B"},{"q":"請問申請攤販營業許可證應具哪些條件？","a":"申請攤販營業許可證，應在臺北市設籍六個月以上，並符合下列規定之一者為限：\n一、經核准接受救助之低收入戶。\n二、原發證或登記有案之攤販。\n三、身體殘障。\n四、能提出民國73年12月31日以前曾為攤販之具體證明且年滿50歲、無其他收入且家庭賴其生活者。\n（如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）2550-5220分機2405至2417）","u":"臺北市市場處攤販科","h":8469,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CA57287AA4E27F46","d":"2026-04-01","sid":"CA57287A"},{"q":"如何進入台北、站前及龍山寺地下街經營店鋪？","a":"台北、站前及龍山寺地下街店鋪(B1)係由安置戶組成之公司或商號承租使用，均不受理個別申請承租店鋪，如有需要可設專櫃經營，有意者歡迎電話洽詢下列單位：\n一、台北地下街：保證責任臺北市臺北地下街場地利用合作社，聯絡電話：（02）2559-4566分機504。\n二、站前地下街：保證責任臺北市站前地下街場地利用合作社，聯絡電話：（02）2375-1567分機20。\n三、龍山寺地下街：龍山寺地下街商場行政中心，聯絡電話：（02）2306-5988分機1。","u":"臺北市市場處市場輔導科","h":7814,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A4A9EB32385DA088","d":"2026-04-01","sid":"A4A9EB32"},{"q":"如果承租人死亡，原先承租之攤位是否可以由其子女繼承，須準備甚麼文件","a":"是，原則上可由其子女繼承。 依照現行「零售市場管理條例」規定，使用人死亡，其繼承人自繼承開始之日起六個月內，互推一人申請變更。惟依現行「臺北市公有零售市場攤（鋪）位申請使用順序處理原則」規定，身心障礙者、原住民及國軍退除役官兵不得申請攤位承租人名義之變更。 公有零售市場攤商申請攤（鋪）位繼承應準備以下資料： 一、遺眷應提出原承租人（死亡人）之資料： 1.死亡證明書、登載被繼承人死亡記事之戶口名簿影本或電子戶籍謄本 2.原攤位租賃（行政）契約書 二、拋棄人： 1.繼承系統表 2.法定繼承人拋棄繼承權切結書 3.身分證正反面影本 三、繼承人： 1最近三個月租金單收據 2.身分證正本及身分證正反面影本 3.戶口名簿影本或最近三個月內申請之電子戶籍謄本(均為現住人口含詳細記事) 4.最近三個月印鑑證明及印章 5.水電費及管理費結清證明（自治會出具證明） 四、保證人： 1.身分證正反面影本 2.印章 注意事項： 1.繼承期限不可超過原承租人死亡之日起六個月 2. 須依民法規定具有完全行為能力 3.繼承人需設籍臺北市且在本市場或本市其他公有市場不可有承租攤位情形","u":"臺北市市場處公有零售市場科","h":7748,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3B75292B7E7E0A9","d":"2026-04-01","sid":"D3B75292"},{"q":"申請配租公有市場攤位需要攜帶何種證件？","a":"一、身心障礙朋友請攜帶印章、身心障礙手冊（正反面）影本、戶口名簿（正反面）影本各乙份至臺北市市場處（臺北市大同區迪化街一段21號6樓）辦理，或進入臺北市市場處機關入口網（ https://www.tcma.gov.taipei ）→「申請案件」，利用「 臺北市政府市民服務大平臺 」網路申辦。\n二、原住民朋友請攜帶印章、身分證（正反面）影本、加註有原住民身分註記之戶口名簿（正反面）影本各乙份至臺北市市場處（臺北市大同區迪化街一段21號6樓）辦理，或進入臺北市市場處網站（ https://www.tcma.gov.taipei ）→「申請案件」，利用「 臺北市政府市民服務大平臺 」網路申辦。\n三、有證攤販請攜帶印章、攤販營業許可證正本、戶口名簿（正反面）影本各乙份至臺北市市場處（臺北市大同區迪化街一段21號6樓）辦理，或進入臺北市市場處網站（ https://www.tcma.gov.taipei ）→「申請案件」，利用「 臺北市政府市民服務大平臺 」網路申辦。。\n四、最新可個別配租空攤位明細可至臺北市市場處機關入口網（ https://www.tcma.gov.taipei ）→「便民服務」→「公有市(商)場空攤明細表」查詢、下載，如有任何疑問請洽詢臺北市市場處，聯絡電話：（02）2550-5220分機2139。","u":"臺北市市場處公有零售市場科","h":7606,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D55A22FDE140EA8D","d":"2026-04-01","sid":"D55A22FD"},{"q":"臺北市花卉批發市場(俗稱台北花市)場地配置情形?","a":"臺北市花卉批發市場「A館」一樓為鮮切花拍賣場、163攤鮮切花零批場、二樓為37攤資材零批場，「B館」一樓為86攤盆花零批場，二樓為盆花及蘭花溫室，A、B館分別設有停車場供業者、民眾使用。\n停車場資訊:\nA館:可停放小型車460格(含身心障礙車位10格)\nB館:可停放小型車75格(含身心障礙車位2格)\n收費標準:平日：每小時30元/半小時15元(配合市場春節作業，自115年1月28日00:00至2月24日24:00止，停車費率異動為每小時40元/半小時20元，115年2月25日00:00後恢復為每小時30元)\n※建議民眾將車輛停放於停車空間較大之A館","u":"臺北市市場處批發市場科","h":7558,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=248CBCB5452F8122","d":"2026-04-01","sid":"248CBCB5"},{"q":"騎樓或道路用地有政府核准之有證攤販營業時，土地所有權人可否請求廢止其攤販營業許可證？須依何種程序辦理？","a":"一、依現行之「臺北市攤販管理自治條例」，申請設置攤販，如涉及私人土地，而不違反現行法令規定者，應檢具所有權人同意書。\n二、攤販擺設位置之土地所有權人如果向臺北市市場處提出異議或不同意之書函，並提出土地及建築改良物所有權狀影本各1份，經市場處查證屬實後即會依規定請攤販持證人改配公有零售市（商）場空攤或變更為其他適法地點。\n（如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）2550-5220分機2405至2417）","u":"臺北市市場處攤販科","h":7432,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2902585016596D91","d":"2026-04-01","sid":"29025850"},{"q":"各批發市場休市日？","a":"原則上周一休市，內湖花市周日休市。\n各批發市場原則上每週一休市，花卉批發市場原則上每週日休市，請至臺北市市場處網站（ https://www.tcma.gov.taipei ）→「便民服務」→「 市場休市日 」查詢相關資訊。","u":"臺北市市場處批發市場科","h":6790,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=713D507D020B6446","d":"2026-04-01","sid":"713D507D"},{"q":"父母向市場處承租之攤位如何轉給兒女，需準備什麼文件？","a":"父母向臺北市市場處承租之攤位欲轉給兒女，可透過一般轉讓方式，或因身心障礙或年老體弱不能親自經營，以變更使用人名義方式，洽詢臺北市市場處（聯絡電話：（02）2550-5220）各市場管理員辦理，轉讓須準備文件如下：\n一、原承租人：\n1.身分證正本\n2.身分證正反面影本\n3.原攤位租賃（行政）契約書\n4.原契約書之印章\n5.最近三個月租金單收據\n6.水電費及管理費結清證明（自治會出具證明）\n二、受讓人：\n1.身分證正本\n2.身分證正反面影本\n3.戶口名簿影本或最近三個月內申請之電子戶籍謄本(均為現住人口含詳細記事)\n4.印章\n5.設籍臺北市滿6個月\n6.2吋彩色照片2張\n三、保證人：\n1.身分證正反面影本\n2.印章\n注意事項：\n1.原承租人承租須屆滿二年\n2.受讓人在本市場或本市其他公有市場不可有承租攤位情形","u":"臺北市市場處公有零售市場科","h":6628,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=853ABDC79C95D3FA","d":"2026-04-01","sid":"853ABDC7"},{"q":"身心障礙朋友及原住民朋友已向臺北市市場處承租攤位後，因生意清淡經營不善，欲放棄承租權，日後可否再行申請配租空攤？","a":"是，仍可再行申請配租攤位。\n本處依「身心障礙者權益保障法」及「臺北市公有零售市場攤（鋪）位申請使用順序處理原則」規定輔導身心障礙者配置市場空置攤位，並無規定身心障礙者放棄承租權後，不可再行申請配租空攤。","u":"臺北市市場處公有零售市場科","h":6604,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4EDCC84C24640340","d":"2026-04-01","sid":"4EDCC84C"},{"q":"請問申請配租公有零售市場攤（鋪）位須要繳交什麼費用？","a":"申請過程不必繳交任何費用，但簽約後自起租月起須向臺北市市場處繳交每月月租金（月租金計算方式依承租之攤（鋪）位面積大小及公告地價計算而得）；另外每月清潔、水、電費由各公有零售市場攤商自治會統籌收取分攤費用。","u":"臺北市市場處公有零售市場科","h":6513,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DFB5DFD783DB588C","d":"2026-04-01","sid":"DFB5DFD7"},{"q":"請問農產品（包括果菜、肉品、家禽及漁產品）販運商許可證申請資格及所需準備資料？","a":"一、資格：\n(一)申領販運商許可證者，應填具申請書，並檢附下列文件連同證書費，向所在地直轄市、縣（市）主管機關為提出：\n1.獨資或合夥：商業登記證明文件影本。\n2.公司：公司登記證明文件影本。\n3.政府捐助之農業財團法人：財團法人登記證明文件、捐助章程及財團法人主管機關同意從事販運商業務文件影本。\n(二)依農產品販運商輔導管理辦法，屬獨資、合夥或公司者申請販運商許可證者，資本額應合於下列標準： 1.獨資者，不得低於新臺幣二十萬元。 2.合夥組織者，不得低於新臺幣一百萬元。 3.公司組織者，實收資本額不得低於新臺幣二百萬元。\n(三)同一事業資本額超過新臺幣四十萬元，得增領販運商許可證副證一件。\n二、申請人所需準備資料：\n(一)申請書1份，可至「臺北市政府市民服務大平臺」搜尋「案件名稱」後點選進入「申請臺北市核發農產品販運商許可證」下載申請表。\n(二)商業登記證明文件影本或公司執照證明文件影本或財團法人登記證明文件影本、捐助章程及財團法人主管機關同意從事販運商業務文件影本。\n(三)最近1吋半身脫帽相片2張（如僅領正證1件附照片2張，增領副證1件，需增附相片1張，餘類推）。\n(四)身分證影本\n(五)證書費180元。","u":"臺北市市場處批發市場科","h":6471,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F7CAC5FABAAD3280","d":"2026-04-01","sid":"F7CAC5FA"},{"q":"請問哪個公有零售市場尚餘有空攤可供承租？","a":"請進入臺北市市場處網站（ https://www.tcma.gov.taipei ）→「便民服務」→「 公有市(商)場空攤明細表 」查詢、下載最新可個別配租空攤位明細表。\n或洽詢臺北市市場處，聯絡電話：（02）25505220分機2139。","u":"臺北市市場處公有零售市場科","h":6362,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2C8848192243C253","d":"2026-04-01","sid":"2C884819"},{"q":"公有市場攤位使用費繳款單遺失要如何繳款？","a":"請您撥打（02）2550-5220分機2139，臺北市市場處將有專人負責重新印製並請市場管理員轉交給您。","u":"臺北市市場處公有零售市場科","h":6256,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7775087841157950","d":"2026-04-01","sid":"77750878"}]},{"org":"人事處","total":48,"items":[{"q":"權理有何限制？","a":"依據公務人員任用法第9條規定，初任各職務人員，應具有擬任職務所列職等之任用資格；未具擬任職務職等任用資格者，在同官等高二職等範圍內得予權理。權理人員得隨時調任與其所具職等資格相當性質相近之職務。 復依公務人員任用法施行細則第10條，所稱未具擬任職務職等任用資格者，在同官等高二職等範圍內得予權理，指擬任人員所具任用資格未達擬任職務所列最低職等，而具有該職等同一官等中低一或低二職等任用資格者，始得權理。例如委任第一職等或委任第二職等具任用資格者，可權理委任第三至第五職等辦事員職務；薦任第六職等或薦任第七職等具任用資格者，可權理薦任第八職等股長職務。但職務跨列二個官等者，不得權理。例如委任第三職等具任用資格者，不得權理委任第五職等至薦任第七職等人事管理員職務。 惟於公務人員任用法修正施行前（即民國91年1月29日前）經銓敘部銓敘審定准予權理高三職等以上職務人員，得隨時調任與其所具職等資格相當性質相近之職務或繼續任原職至離職為止。","u":"臺北市政府人事處任用科","h":55270,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A9C018B62B312BA8","d":"2021-10-21","sid":"A9C018B6"},{"q":"一般民眾想進入臺北市政府工作，除了參加國家考試外，還有什麼管道呢？","a":"目前本府各機關新進之年度計畫約聘僱人員與新僱之專案技工及專案工友，已委由本市就業服務處採公開甄選方式辦理，相關職缺均刊載於該處網站，詳細資訊請見該處網站。 另各機關留職停薪約聘僱人員，則係由各機關自行辦理公開甄選，相關訊息均刊載於各機關網站及本府求職徵才網(https://job.gov.taipei/)，建議民眾可上網留意相關訊息。","u":"臺北市政府人事處管理科","h":26981,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=499885E9EA117A91","d":"2017-12-08","sid":"499885E9"},{"q":"公務員兼職有何相關規定？","a":"公務員服務法第15條規定：\n公務員除法令規定外，不得兼任他項公職；其依法令兼職者，不得兼薪。\n公務員除法令規定外，不得兼任領證職業及其他反覆從事同種類行為之業務。但於法定工作時間以外，從事社會公益性質之活動或其他非經常性、持續性之工作，且未影響本職工作者，不在此限。\n公務員依法令兼任前二項公職或業務者，應經服務機關（構）同意；機關（構）首長應經上級機關（構）同意。\n公務員兼任教學或研究工作或非以營利為目的之事業或團體職務，應經服務機關（構）同意；機關（構）首長應經上級機關（構）同意。但兼任無報酬且未影響本職工作者，不在此限。\n公務員有第二項但書及前項但書規定情形，應報經服務機關（構）備查；機關（構）首長應報經上級機關（構）備查。\n公務員得於法定工作時間以外，依個人才藝表現，獲取適當報酬，並得就其財產之處分、智慧財產權及肖像權之授權行使，獲取合理對價。\n第二項、第四項及第六項之行為，對公務員名譽、政府信譽、其本職性質有妨礙或有利益衝突者，不得為之。\n公務員兼任第三項所定公職或業務及第四項所定工作或職務；其申請同意之條件、程序、限制及其他應遵行事項之辦法，由考試院會同行政院定之。","u":"臺北市政府人事處任用科","h":24470,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=782313B829676D53","d":"2021-10-21","sid":"782313B8"},{"q":"若考績年度內，請事、病假合計未超過5日，則當年年終考績是否一定可以拿甲等？","a":"查公務人員考績法施行細則第4條，對公務人員得考列甲等及不得考列甲等之條件，均有明確規定，公務人員必須在考績年度內，具有特殊條件各目之一或一般條件二目以上的具體事蹟，才能評列為甲等。公務人員於考績年度內所請事、病假合計未超過5日，僅係符合得考列甲等的一般條件之一，並非表示一定可以考列甲等，仍應由機關依其工作、操行、學識及才能予以綜合考評。","u":"臺北市政府人事處考訓科","h":22799,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B9999CCB7D3DFC5F","d":"2026-08-14","sid":"B9999CCB"},{"q":"曾擔任公務機關約用人員職務，考上公務人員考試，其約用年資可否提敘？","a":"曾擔任公務機關約用人員職務，為各機關以契約聘僱用之專業或行政人員，此類人員不適用公務人員任用法、聘用人員聘用條例、行政院與所屬中央及地方各機關約僱人員僱用辦法及工友管理要點。因此，約用人員年資無法採計及辦理公務人員俸級提敘，亦無法依公務人員考試錄取人員訓練辦法相關規定，免除基礎訓練及縮短實務訓練。","u":"臺北市政府人事處任用科","h":20815,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B20519B5EBCF5B7B","d":"2021-10-21","sid":"B20519B5"},{"q":"駕駛依勞動基準法第84條之1規定另行約定工時與休假的上限為何?","a":"1.每日正常工作時間不得超過10小時，連同延長工作時間，1日不得超過12小時。 2.每月正常工作時間連同延長工時不得超過260小時(資料來源：勞動局106年12月26日北市勞職字第10642118200號令)。 3.勞工每7日中應有2日之休息，其中1日為例假，1日為休息日。如經勞資雙方彈性約定，得於2週內另行安排勞工2日休息，作為例假。 (權責機關本府勞動局)","u":"臺北市政府人事處考訓科","h":19340,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3524EF378AB26393","d":"2017-02-06","sid":"3524EF37"},{"q":"請問可否使用加班補休及休假出國旅遊?","a":"現行法令並沒有規定一定要使用休假出國旅遊，除了可以利用休假、例假日及其他放假日出國旅遊，還可以利用加班補休。","u":"臺北市政府人事處考訓科","h":18433,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A0CA637B38FEDF1C","d":"2010-02-25","sid":"A0CA637B"},{"q":"聘用人員服務年資得否採計為公務人員退休年資？","a":"凡依聘用人員聘用條例及行政院暨所屬各級機關約聘聘用人員注意事項規定約聘之聘用人員，於聘用後依聘用人員聘用條例第3條規定列冊送銓敘部登記備查者，其服務年資始予採計（按84年7月1日以後不採），未經送該部登記備查者，不予採計。","u":"臺北市政府人事處給與科","h":16644,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A77E5F2037DBC9D1","d":"2008-03-13","sid":"A77E5F20"},{"q":"不服服務機關將其年終考績考列乙等，應如何提起救濟？","a":"公務人員對於服務機關所為年終考績考列乙等之評定不服，依公務人員保障法相關規定，得於收受考績通知書之次日起30日內，繕具復審書經由原處分機關重新審查後，轉公務人員保障暨培訓委員會提起復審。","u":"臺北市政府人事處考訓科","h":15937,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FA84180333BE594F","d":"2026-08-14","sid":"FA841803"},{"q":"員工執行職務意外傷亡慰問金申請條件為何？","a":"1.公務人員執行職務意外傷亡慰問金發給辦法第3條：「本辦法所稱意外，指非由疾病引起之突發性的外來事故。依本辦法發給慰問金者，以其受傷、失能或死亡與執行職務時所發生之意外，具有相當因果關係者為限。」 2.如係單純上下班途中意外傷亡，因與職務內容本身不具密切關係，爰不得發給慰問金。 3.前述意外之發生如公務人員有故意情事者不發給；有重大過失情事者減發30%。故意或重大過失之認定，由核定權責機關學校依事實調查或依有關機關之鑑定報告辦理。","u":"臺北市政府人事處給與科","h":14949,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3A901ED415897AC7","d":"2011-06-07","sid":"3A901ED4"},{"q":"想到臺北市政府上班，要參加何種考試？","a":"如果想在本府或其他政府機關服務，可以參加公務人員高等暨普通考試、初等考試、特種考試地方政府公務人員考試、特種考試身心障礙人員考試及特種考試原住民族考試等。上述公務人員考試通常每年各舉辦1次，各類考試依學歷、年齡、考試內容對應考人的資格條件有不同要求，只要符合這些要求即可報考，一旦考試錄取，就有機會到各政府機關服務。有關各類考試應考規定，可以查閱考選部網站「應考人專區-考試資訊」選項中（ https://www.moex.gov.tw/ ）資訊。","u":"臺北市政府人事處任用科","h":14352,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA7DD65C2C82EDC5","d":"2021-10-21","sid":"AA7DD65C"},{"q":"進用身心障礙者的
