餘額。 1、協議合建-雙方協議 2、權利變換-估價 安置期間為更新期間(以開工之日起算至取得使用執照)加計6個月 1、協議合建-雙方協議 2、權利變換-估價租金單價 領取身分 建物所有權人、其他改良物使用人 建物所有權人 發放時點 由實施者於權利變換計畫發布實施之日起10內通知受補償人領取，領取期限以受通知之日起30日內領取為原則。 依實施者通知結果為準。","u":"臺北市都市更新處","h":3664,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A40BFA322C826EAD","d":"2025-10-10","sid":"A40BFA32"},{"q":"建商若已達80%的送件門檻，剩餘20%的住戶是否就會被迫參與更新?","a":"1.都市更新是採多數決方式辦理，實施者只要整合所有權人意願，並取得土地及合法建築物所有權人數及持分面積之同意比率皆達都市更新條例第37條規定之同意比率門檻，即可向本府申請實施都市更新事業計畫報核，但為保障剩餘未同意戶之權利，實施者仍應本於真誠磋商精神，持續與未同意戶溝通協調，所有權人亦可於審議期間提出陳情意見，市府會將其意見提供審議委員作為審議參考，避免少數人的權益被忽視。\n2.但至權利變換計畫核定發布實施後，雙方若仍無法達成共識，實施者可依「 臺北市政府辦理都市更新實施者申請代為拆除或遷移土地改良物實施辦法 」規定市府提出代為拆除申請。","u":"臺北市都市更新處","h":3495,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F2A649E8FE3101A9","d":"2025-10-10","sid":"F2A649E8"},{"q":"都更案核定後多久內會要搬遷及拆除?","a":"1.協議合建：依所有權人及實施者雙方協議內容為準。\n2.權利變換：依「都市更新權利變換實施辦法」第24條規定，實施者應於權利變換計畫核定發布實施之日起10日內，通知預定拆遷日，且權利變換計畫公告期滿至預定拆遷日，不得少於2個月，故一般約核定3個月後，土地及建物所有權人、管理人或使用人應於預定拆遷日前完成搬遷，以利後續拆除作業。","u":"臺北市都市更新處","h":2832,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AF9A85EE22971DA3","d":"2025-10-10","sid":"AF9A85EE"},{"q":"何謂都更8箭？","a":"相關資訊可至「臺北市都市更新處網站首頁/熱門查詢/ 都更8箭專區 」查詢。\n1.「降門檻」\n(1)市府於112年3月3日公告實施「公辦都更7599專案計畫」，受理意願門檻由90%降至75%，並引進民間專業技術團隊，以「早進場、幫試算、助選屋」三大創新服務，協助民眾參與公辦都更。\n(2)資訊查詢：臺北市都市更新處網站首頁/熱門查詢/公辦都更P.R.O/O-自助人助型(Organization)/ 公辦都更7599專案計畫 。\n2.「法放寬」\n市府於112年12月18日公布修正「臺北市都市更新自治條例」，協助民間加速辦理都市更新，包括「都更單元及事業計畫全面開放併送」、「山坡地危險建物可更新」、「放寬商業區都更案後院深度比」等法令鬆綁，使得民間辦理重建能更有彈性。\n3.「速通關」\n為加速審議程序，市府推出「 都市更新150專案 」，審議時程150日，另外「權變小組提前進場」及「都市設計審議130快速通關專案」等方案，藉由提前審查及分流審查制度縮短行政時程，讓民眾立即有感。\n4.「排障礙」\n目前臺北推動危老案件是六都之冠，未來市府將以「擴大培植民間專業人力」、「放寬檢討審查項目」、「精簡程序提升效能」等面向，持續加速危老重建案件進程，預計可縮短審查時間約6個月。\n5.「加碼辦」\n因應超高齡社會來臨，老舊公寓加裝電梯需求大增，自112年4月7日起提高補助金額至300萬元，加速推動老舊公寓增設電梯。\n6.「防災型都更專案」\n「 擬定臺北市防災型都市更新細部計畫案 」，透過容積獎勵鼓勵「耐震能力不足」之危險建築物更新重建，期能建構居家安全之韌性城市。\n7.「整建住宅專案計畫」\n(1)「整建住宅專案計畫」以「增容積、補利息、齊協力」三大亮點服務，給予整建住宅專案容積獎勵，並提供財務協助等方式，提高整宅都更意願、加速整宅新生。\n(2)資訊查詢：臺北市都市更新處網站首頁/熱門查詢/防災都更整宅專案/ 臺北市整建住宅專案計畫 。\n8.「危險建築物575專案計畫」\n(1)「危險建築物575專案計畫」推出「危險我就幫」、「過半即進場」兩大亮點服務，只要經本府列管屬「須拆除重建」之高氯離子混凝土","u":"臺北市都市更新處","h":2615,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8F82C107B7B06C3C","d":"2025-10-10","sid":"8F82C107"},{"q":"何謂都市更新?好處有哪些？與危老都更有何不同?","a":"1.都市更新的處理方式可分為重建、整建及維護，說明如下：\n(1)重建：指拆除更新單元內原有建築物，重新建築，住戶安置，改進公共設施，並得變更土地使用性質或使用密度。\n(2)整建：指改建、修建更新單元內建築物或充實其設備並改進公共設施。\n(3)維護：指加強更新單元內土地使用及建築管理，改進公共設施，以保持其良好狀況。\n2.都市更新主要是為促進都市土地有計畫之再開發利用，並有效復甦都市機能、提升防災效益，使整體居住環境品質更安全、更舒適，增進公共利益，且更新後房屋價值也會藉此提升。其中，採重建方式辦理都市更新者，除了可申請容積獎勵，增加建築面積外，在稅賦方面，還提供土地增值稅、地價稅、契稅等相關稅捐減免的優惠。另外，都市更新的審議程序是公平、公正、公開的，都市更新審議會會替民眾把關整體程序及相關合理性，讓參與者受到都市更新條例等相關法令的規範與權益的保障。\n3.都市更新與危老重建的主要差異摘要如下：\n差異比較\n都市更新重建\n危老重建\n法令依據\n都市更新條例\n都市危險及老舊建築物加速重建條例\n計畫書\n都市更新事業計畫、權利變換計畫\n重建計畫\n審議程序\n重建計畫\n重建計畫\n實施期間\n依都市更新條例第32、48條規定辦理審議程序\n無審議會設置，建管單位審查重建計畫及核發建照\n實施方式及同意比率\n1.協議合建(全體同意)： 私有土地及私有合法建物所有權人數及面積均達100%同意。\n2.權利變換(多數決同意)： 私有土地及私有合法建物所有權人數及面積均達都市更新條例第37條規定之同意。\n3.部分協議合建、部分權利變換： 私有土地及私有合法建物所有權面積達80%以上同意採協議合建，剩餘未同意部分採權利變換方式。\n1.協議合建(全體同意)：土地及合法建物所有權人數及面積均達100%同意。\n2.涉及國產署管理之公有土地，依「國家住宅及都市更新中心參與都市危險及老舊建築物加速重建作業辦法」辦理。\n3.涉及臺北市市有不動產，依「臺北市市有不動產參與危險及老舊建築物加速重建處理原則」辦理。\n申請人\n實施者\n1.都市更新事業機構(股份有限公司)\n2.都市更新會\n起造人\n1.法人(機構)\n2.自然人","u":"臺北市都市更新處","h":2462,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0245995C5DF74EF8","d":"2025-10-09","sid":"0245995C"},{"q":"重建期間因搬遷需遷出原址戶籍，是否會影響孩童就讀原學區？","a":"若重建期間欲申請原戶籍地學區分發入學，可依「臺北市公立國民小學新生分發及入學辦法」第13條規定，經核定發布之都市更新事業計畫範圍內學童入學，應依下列規定辦理；其於原戶籍地入學，學童設籍日期仍依原戶籍設籍日起算：\n1.學童之二親等內直系血親尊親屬或監護人於基準日前，尚未取得重建後之新建物所有權，且原設籍學童戶籍已遷出，得於當年度4月30日前提供核定公文、核定版都市更新事業計畫書或核准版重建計畫書及戶口名簿向教育局申請以原戶籍地學區分發入學。\n2.學童之二親等內直系血親尊親屬或監護人於基準日前，已取得重建後之新建物所有權，且原設籍學童戶籍已遷入，依學童戶籍地學區分發入學。","u":"臺北市都市更新處","h":2321,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4E8D3B94D5BFE892","d":"2025-10-10","sid":"4E8D3B94"},{"q":"都市更新有哪些程序?","a":"都市更新事業計畫及權利變換計畫階段，須分別擬具計畫書提送市府報核，並歷經公開展覽、公辦公聽會、幹事會或權變小組審查、聽證、審議會及發布實施等相關程序，主要差異性如下：","u":"臺北市都市更新處","h":2213,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D2FD2716F001C256","d":"2025-10-09","sid":"D2FD2716"},{"q":"什麼是選配？參與權利變換時選配期間至少要幾天？同意戶有優先選屋權嗎?未同意戶可以先選屋嗎?","a":"1.協議合建：選配內容皆依與實施者雙方協議內容為準。\n2.權利變換：依「都市更新權利變換實施辦法」第17條規定，更新後應分配之土地及建築物位置，應由所有權人就其應分配價值及事業計畫書內所載之選配原則規定進行選屋作業，其選配期間不得少於30日；若未於規定期限內提出申請者或同一位置有2人以上申請分配時，皆以公開抽籤方式辦理。\n3.不論是否為同意戶，為保障所有權人選配權益，只要符合選配原則者皆應於選配期間辦理選配作業，否則未於期限內辦理選配者，僅能就剩餘單元及車位透過公開抽籤方式辦理，後續倘有更換選配需求，應經實施者同意後始得辦理。","u":"臺北市都市更新處","h":2134,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=19D8D7F0B4722C7B","d":"2025-10-10","sid":"19D8D7F0"},{"q":"海砂屋重建有何獎勵措施?","a":"依「臺北市高氯離子混凝土建築物善後處理自治條例」第7條規定辦理。\n1、 容積量體 ：經列管須拆除之建築物經都發局專案核准者，得依原建蔽率、原容積率（或原總樓地板面積）、原院落深度重建。申請重建者，得放寬法定容積率、原容積率或原總樓地板面積之30%。\n2、 拆除補助 ：建築物拆除後，所有權人得向都發局申請補助費用，每戶20萬元。","u":"臺北市都市更新處","h":2028,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F027D68532D0B5EB","d":"2025-10-09","sid":"F027D685"},{"q":"如何申請公辦都更?","a":"本府於112年3月3日公告實施「 臺北市公辦都市更新7599專案計畫 」，包含以下四階段作業：\n1.民眾整合意願達75%且符合申請條件，即可申請專案讓市府資源「早進場」。\n2.市府委託專業技術團隊「幫試算」更新方案，社區同意試算成果且意願達90%後，即啟動第三階段。\n3.由臺北市住宅及都市更新中心「助選屋」協助社區模擬選配，民眾釐清都更權益且選配率達90%，即由市府同意臺北市住宅及都市更新中心擔任實施者。\n4.臺北市住宅及都市更新中心將公開徵求出資者，並擬定都市更新事業及權利變換計畫。","u":"臺北市都市更新處","h":1974,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=75051238204F5D67","d":"2025-10-10","sid":"75051238"},{"q":"何謂都市更新會?怎麼成立都市更新會?","a":"1.都市更新會為土地及建物所有權人有辦理都市更新重建意願時，自行組成的法人組織，如同擔任建設公司的角色，作為主導及推動更新事業的實施者。\n2.成立都市更新會，應依「都市更新會設立管理及解散辦法」規定辦理，主要可分為兩大階段(申請籌組、申請立案)，說明如下：\n(1)申請籌組：需由範圍內超過7位所有權人或超過半數的所有權人發起，並經超過半數的土地及合法建物所有權人同意後，由發起人檢具相關資料，向臺北市都市更新處申請籌組。\n(2)申請立案：經市府核准籌組後，發起人應於6個月內召開成立會員大會，大會召開後30日內，需再檢附更新會申請立案的相關文件，向臺北市都市更新處申請核准立案(如未依時間內申請，主管機關得撤銷核准籌組)，符合規定後就會核發立案證書。","u":"臺北市都市更新處","h":1965,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4878C0F959E37036","d":"2025-10-10","sid":"4878C0F9"},{"q":"什麼情況要做鄰地協調?若鄰地協調不成，鄰地地主何時還可以申請納入?最後加入的時點為何?","a":"1. 位於更新地區範圍內之更新單元 ：依「臺北市都市更新自治條例」第14條規定，其更新單元範圍應以不造成街廓內相鄰土地無法劃定更新單元為原則，若無法依其原則辦理則應於舉行自辦公聽會時，一併通知相鄰土地及其合法建築物所有權人前述情形，並邀請其參加公聽會，徵詢參與更新之意願並協調後，依規定申請實施都市更新事業。若協調不成時，土地及合法建築物所有權人得申請市府協調。\n2. 單獨申請自行劃定更新單元：\n(1) 自辦鄰地協調會 ：自劃更新單元及其鄰地有涉及「臺北市自行劃定更新單元重建區段作業須知」第9點規定的情形時，應於送件前就單元所在街廓內全部相鄰土地召開協調會，並調查相鄰土地及其合法建築物所有權人參與意願。\n(2) 公辦鄰地協調會 ：自劃更新單元及其鄰地有涉及「臺北市自行劃定更新單元重建區段作業須知」第11點規定的情形時，市府應就單元所在街廓內相鄰土地召開法令說明會，並調查相鄰土地及其合法建築物所有權人參與意願。\n3.非屬上述情形之鄰地地主，仍可於事業計畫報核後至審議期間向市府陳情希望納入更新單元，其最後加入時點應依審議會決議為準。","u":"臺北市都市更新處","h":1915,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D7825D752BC00D07","d":"2025-10-10","sid":"D7825D75"},{"q":"【第六箭】防災型都更專案","a":"1.為提高危險建築物重建誘因，訂定全市性都市計畫「擬定臺北市防災型都市更新細部計畫案」，於113年3月28日公告實施，並於114年5月9日修訂放寬適用對象申請規定，期能透過容積獎勵鼓勵「耐震能力不足」之危險建築物更新重建，建構居家安全之韌性城市。\n2.適用條件：\n(1)位於本市都市計畫地區，以都市更新實施「重建」者。\n(2)基地面積達1,000平方公尺以上。\n(3)「經結構安全性能評估(初評或詳評皆可)ID值＜0.35」或「於『建築物耐震設計規範』訂定發布前(民國63年2月15日)已申請建造執照之領有使用執照」之合法建築物，並依各該建築物原建築基地面積計算獎勵值。\n3.重建後建築物應達4面向(結構安全、耐候減碳、都市減災、環境友善)、5條件(耐震設計、綠建築、智慧建築、雨水流出抑制設施、無障礙環境等)規劃設計。\n4.詳細內容依都市計畫發布實施內容為準。","u":"臺北市都市更新處","h":1666,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5C4CECE3B693F2FE","d":"2025-10-10","sid":"5C4CECE3"},{"q":"何謂更新地區?位於更新地區內有什麼好處?","a":"1.更新地區指依都市更新條例第5、6、7、8條或都市計畫法規定，於都市計畫特定範圍內劃定或變更應進行都市更新之地區，其範圍可能包括數個街廓。\n2.位於更新地區之好處：\n(1)無須辦理自行劃定更新單元程序。\n(2)降低事業計畫報核之同意比率門檻：\nA、迅行劃定更新地區(第7條)：私有土地及私有合法建築物所有權人數及總面積均超過50%。\nB、其餘更新地區(第5、6、8條)：私有土地及私有合法建築物所有權人數及總面積均超過75%。\n(3)更新單元規模：位於迅行劃定更新地區(第7條)者，免依「臺北市都市更新自治條例」第12條規定檢討。\n(4)時程獎勵額度較高：依都市更新建築容積獎勵辦法第 14 條規定，於113年5月16日起提供5%及3.5%之基準容積。\n(5)投資抵減：實施者為股份有限公司者，得依都市更新條例第 70 條規定申請投資抵減。","u":"臺北市都市更新處","h":1503,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=25C1035F15BF52BB","d":"2025-10-09","sid":"25C1035F"},{"q":"何謂容積移轉? 申請容積獎勵後，是否還可以申請容積移轉？","a":"1.指將一宗土地容積移轉至另一宗可建築土地上供建築使用。\n2.都更案申請容積獎勵後仍可依「都市計畫容積移轉實施辦法」及「臺北市容積移轉審查許可自治條例」規定申請容積移轉，可移入容積不得超過接受基地基準容積之40%，移入容積方式如下：\n(1)可移轉土地：未開闢之公園用地、綠地用地、廣場用地，道路用地，以及本市歷史建築所定著之私有土地。\n(2)繳納代金：由本府都市發展局委託3家以上估價師查估後評定之。\n3.計算方式：申請移入容積量上限(都更基地基準容積40%)=【移出基地量體≦申請移入容積量50%】+【代金量體≧申請移入容積量50%】。","u":"臺北市都市更新處","h":1441,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0E7760BB6C62C453","d":"2025-10-10","sid":"0E7760BB"},{"q":"我目前不願參與都更，應如何保障自身權益?有哪些管道可以申訴？","a":"1.若目前尚無意願參與都市更新重建，應審慎思考是否簽署並出具「 都市更新事業計畫同意書 」，因出具同意書即視為同意參與該案都市更新，但若範圍內其他所有權人參與意願度不高，致該案同意比率未達都市更新條例第37條所定之法定門檻，則計畫將無法推動。\n2.不論是否願意參與都市更新，為保障所有權人選配權益，只要符合選配條件者皆應於選配期間辦理選配作業，至少目前選擇房型及車位結果是所有權人自行挑選的，否則未於期限內辦理選配者，僅能就剩餘單元及車位透過公開抽籤方式辦理，後續倘有更換選配需求，皆應經實施者同意後始得辦理。\n3.另所有權人倘有表達都市更新意見之需求，可至「公聽會、聽證」等相關會議說明或透過書寫陳情意見至「臺北市都市更新處」，表達不願參與都更或提供相關意見，並由實施者將意見納入計畫書並作適當回應後，提供臺北市都市更新及爭議處理審議會審議參考。","u":"臺北市都市更新處","h":1301,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4F971ECE90BDC58B","d":"2025-10-10","sid":"4F971ECE"},{"q":"建商若於拆屋後發生財務問題或房子蓋到一半跑路，導致無法興建完成怎麼辦？","a":"1.所有權人在選擇實施者時，建議挑選規模較大、信譽良好的建商，並適度調查其過去的開發紀錄與財務狀況。\n2.依都市更新條例第36條規定，實施者需於事業計畫書內詳細載明本案之風險控管方案，常見的風險控管方案多為不動產開發信託、資金信託及續建機制等，並由臺北市都市更新及爭議處理審議會就所提內容進行審議，以降低重建執行風險，並維護相關權利人之權益。\n3.資金信託：實施者與信託銀行簽訂信託契約後，重建資金需存放於信託專戶，並依工程進度專款專用，不得挪作他用；資金撥付前，需經專業管理團隊、建經公司及信託銀行共同查核與核准。\n4.續建機制：當實施者遭遇解散、破產、重整、廢止許可、撤銷登記、連續停業達一定期限以上或歇業，或財務困難無力支應工程款、無正當理由停工達一定期限致工程進度嚴重落後，經催告未獲改善等情事，信託銀行可依信託契約規定邀集當事人及相關人評估是否啟動續建機制，並接手後續興建工程作業，以確保重建程序得以延續。","u":"臺北市都市更新處","h":1281,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=76095CFEA769D3AF","d":"2025-10-10","sid":"76095CFE"},{"q":"實施者要將產權辦理銀行信託，是合理的嗎?是否一定要辦理信託登記？要出具什麼文件?","a":"1.都市更新條例第25條規定，都市更新事業得以信託方式實施之。且實施者辦理產權信託，並登記予信託機構(通常是銀行，以下以銀行為例)係為降低辦理都市更新的風險，故都市更新案常有實施者請所有權人將土地及建物產權信託登記給銀行(受託人)，交由其進行產權管理，至全案更新完成後，銀行再依信託約定內容，將更新後產權登記予原所有權人，以確保都市更新之執行。\n2.辦理信託方式及相關內容將載明於都市更新事業計畫之風險控管專章內，並由臺北市都市更新及爭議處理審議會審查相關內容。","u":"臺北市都市更新處","h":1275,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=72F6592C18519AB7","d":"2025-10-10","sid":"72F6592C"},{"q":"事業計畫同意書簽署後可以撤銷嗎?","a":"依臺北市政府受理都市更新案審查與處理同意書重複出具及撤銷作業要點第7點所載規定辦理。\n1.所有權人依本條例第37條第4項規定撤銷同意時，應以書面通知申請人或實施者，並副知本府。撤銷發生效力之時點，以書面通知送達相對人為準。\n2.本府為處理所有權人依本條例撤銷其同意，作業程序如下：\n(1)事業概要或都市更新事業計畫申請核准或報核前，所有權人得撤銷其同意，不計入同意比率計算。\n(2)都市更新事業計畫之報核日在本要點實施生效日起未滿1年者，市府於其報核後接獲所有權人撤銷同意、未填具完整之所有權人權利價值比率或分配比率、未依內政部公布之同意書格式出具，依下列方式處理，經審議會審議認得撤銷同意者，該同意書不計入同意比率計算：\nA.適用108年1月30日修正公布前之本條例規定者：應請雙方於14日內，說明其出具同意書與報核時都市更新事業計畫權利義務是否相同，並將雙方意見提請審議會審議之。另撤銷同意事由有下列情形之ㄧ者，視為權利義務不相同，得免提請審議會審議，本府得逕將該同意書不計入同意比率計算：\n(a)都市更新實施方式不一致。\n(b)適用申請獎勵項目不一致。\n(c)更新後土地及建築物位置分配方式不一致。\n(d)公開展覽之都市更新事業計畫所載更新後分配之權利價值比率或分配比率低於出具同意書時。\n(e)經法院判決確定屬無效之同意者。\nB.適用108年1月30日修正公布後之本條例規定者：應請雙方於14日內，說明公開展覽之都市更新事業計畫所載更新後分配之權利價值比率或分配比率是否低於出具同意書時，並將雙方意見提請審議會審議之。\n(3)同意之意思表示具有民法第88條、第89條、第92條所定錯誤、詐欺、脅迫情事，經法院判決確定，或雙方合意撤銷者，本府逕將該同意書不計入同意比率計算。","u":"臺北市都市更新處","h":1255,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F39E16A94418A6CE","d":"2025-10-09","sid":"F39E16A9"}]},{"org":"消防局","total":88,"items":[{"q":"請問現在叫救護車要收費嗎？","a":"一、原則上不需要。 二、自101年12月8日起，針對民眾或家屬指定119救護車送至『本市「非」急救責任醫院』以及『「未」赴急診室檢傷掛號』者進行收費。經審查確定為濫用119救護車者將於事後寄發繳款單，收取的費用為每趟次1,800元。 三、民眾如有腦中風、心肌梗塞、意識不清或昏迷、重大創傷等，仍應儘速撥打119，將不會負擔任何費用。 四、有關救護車使用時機及收費制度，請參閱消防局網站：https://www.119.gov.taipei/ 路徑: 首頁 > 業務服務 > 緊急救護 > 救護車使用時機及收費制度","u":"臺北市政府消防局","h":73666,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BF89E26884833FC7","d":"2017-11-06","sid":"BF89E268"},{"q":"臺北市劃設消防通道Q&A","a":"一、問：何謂「消防通道」？\n答：消防通道係指通往火災搶救困難地區救災必經之道路或本市現有道路寬度未滿7.5公尺，距離有人居住或使用之建築物在140公尺以上之道路（囊底路道路長度在140公尺以上，雙向連通道路長度在280公尺以上）劃設消防通道。\n二、 問：何謂「火災搶救困難地區」？\n答：火災搶救困難地區係指具有容易擴大延燒、水源缺乏、避難逃生困難、收留弱勢人員、存放大量易燃物或危險物品等因素，有造成重大人命傷亡之虞之場所或地區，因該場所（地區）一旦發生緊急事故，消防人員若無法立即趕到現場搶救，極可能造成重大人員傷亡及財產損失，認定項目如下：\n（一）連棟式磚、木造建築物達50戶以上。\n（二）建築物密集且水源缺乏地區。\n（三）甲類地下室營業面積在5,000平方公尺以上之場所。\n（四）20層以上高層建築物。\n（五）身心障礙福利機構、收容人數在20床以上之老人養護機構及住院病床在100床以上之醫院。\n（六）捷運地下車站及捷運地下商店街。\n（七）機械式密閉停車塔。\n（八）總樓地板面積3,000平平方公尺以上之百貨公司及大型賣場。\n（九）其他經認定具有容易擴大延燒、有造成重大人命傷亡之虞或避難逃生困難等場所\n三、問：為什麼要劃設消防通道?\n答：為確保地震、水災、火災等都市災害發生時，救援車輛（包括消防車、工程救險車、警備車等）及時前往災害現場，本府針對通往臺北市火災搶救困難地區救災必經之道路及臺北市既有道路寬度7.5公尺以下者，直接連接有人居住或使用之建築物之道路，其中救援車輛（消防車、工程救險車及警備車等）能順利抵達之區域（如巷口），距離有人居住或使用之建築物在140公尺以上之道路劃設消防通道實施禁停管制措施。因上述地區一旦發生意外事故，救援車輛若無法立即趕抵現場搶救，消防人員必須花很多時間忙於部署消防水線、攜帶救災裝備或運用移動式消防幫浦入內救災，將影響救災時效，並使災情擴大，極可能發生重大傷害。\n四、問：為何防火間隔(巷)不能劃設為消防通道?\n答：有關防火間隔(巷)規定於建築技術規則第110條、第110-1條，係屬本市建築管理工程處權責事項，又防火間隔(巷)功能主要為確保鄰棟建","u":"臺北市政府消防局","h":64726,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=52792757EFCC98F3","d":"2015-09-14","sid":"52792757"},{"q":"過期滅火器該如何回收處理？","a":"有關滅火器過期回收部分，經查乾粉滅火器每3年應實施一次性能檢查，民眾可至內政部消防署網站(https：//www.nfa.gov.tw)選擇「首頁」>「便捷查詢」>「滅火器性能檢查及藥劑更換充填作業專業廠商」進行滅火器及其藥劑檢修、充填、更新或回收，至於滅火器如有損壞或不堪用情形，依環保署「廢棄物清理法」第28條及「滅火器性能檢查及藥劑更換充填作業專業廠商認可及管理要點」第17點規定，建議依下列方式處理：\n1.委請滅火器性能檢查及藥劑更換充填作業專業廠商回收。\n2.委託公民營廢棄物處理機構依廢棄物清理法相關規定辦理。\n(處理機構查詢 請 至https://waste1.moenv.gov.tw/Grant/GS-UC60/QryGrantData.aspx)\n3.委託原製造廠商或其他經依廢棄物清理法公告具處理能力業者重新回收再處理。","u":"臺北市政府消防局","h":58946,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=82543006984EC2D2","d":"2018-01-23","sid":"82543006"},{"q":"哪些地點可以施放爆竹煙火？","a":"1、施放爆竹煙火應選擇空曠地區、人潮少及風向佳之地點，不可於漁船加油站、儲油設備之油槽區、彈藥庫、火藥庫、可燃性氣體儲槽及公共危險物品、可燃性高壓氣體、爆竹煙火製造、儲存、處理（販賣）、高速公路、大眾捷運系統及高架道路路權範圍內、古蹟、醫院、護理之家、產後護理機構及老人福利機構等場所及其基地內施放。","u":"臺北市政府消防局","h":24231,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C4FBB18B09EBF12C","d":"2017-11-06","sid":"C4FBB18B"},{"q":"有關住宅用火災警報器補助安裝相關資訊？","a":"一、本局現階段針對5樓以下未設置火警自動警報設備之住宅辦理補助安裝住警器，凡符合前述補助條件者（https://rfa119.gov.taipei/cp.aspx?n=E3CD9DBA39F0722F），均可攜帶身分證等相關證明文件至住家鄰近之消防分隊申請補助，經本局審查符合補助資格者，可領取住警器1只，惟以同一人同一地址補助1只為原則，不得重複申請。\n二、因住宅用火災警報器能提早偵知警報，提高避難逃生，且價格便宜，便於安裝之優點，為提升居家安全且未符合補助資格之住戶，建議自行採購住宅用火災警報器安裝。\n三、更多住警器訊息可參考下述網站：\n(一)本局住警器資訊網(https://rfa119.gov.taipei/)\n(二)本局網站(https://www.119.gov.taipei/)","u":"臺北市政府消防局","h":21641,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=25F147C293112824","d":"2013-08-23","sid":"25F147C2"},{"q":"什麼是住宅用火災警報器？為何要設置？價格為何？如何使用？如何維修保養？","a":"一、住宅用火災警報器是使用於未設火警自動警報設備之住宅，又稱獨立式火警探測器，內裝電池，不需配線，可獨立安裝於天花板上或牆壁上，當住宅用火災警報器偵測到煙霧或熱氣時，就會發出極大的警報聲響，讓民眾即早應變逃生。市面及網路上販售住宅用火災警報器可分為偵煙式或定溫式2種。偵煙式住宅用火災警報器安裝於臥室、客廳或樓梯間，定溫式住宅用火災警報器安裝於廚房。\n二、設置住宅用火災警報器之原因：一般火災之發覺，大都因聞煙味或看到濃煙而警覺，若半夜發生火災常因睡眠狀態下嗅覺及視覺的敏覺性較差，造成火災發生時未能即時發現，延誤避難逃生之黃金時間，因此民眾居家若安裝住宅用火災警報器，利用警報器偵測到煙霧或熱氣發出極大的警報聲響，即使半夜發生火災，也可以即早發現，即時應變，即時逃生。\n三、住宅用火災警報器一般售價為新臺幣250至1000元不等，現有許多賣場及消防器材公司或網路皆有販售。請注意是否張貼內政部消防署個別認可合格標示。\n四、使用方式：\n(一)購買住宅用火災警報器時應按測試鈕測試是否會發出正常功能之警報聲。\n(二)住宅用火災警報器安裝之位置為居家臥室及樓梯間頂部天花板。\n(三)住宅用火災警報器安裝時應依照產品使用說明書，並注意下列事項以確保其效果及避免誤報：\n1、住宅用火災警報器裝於天花板應與其周圍牆壁保持60公分以上。\n2、警報器應與冷氣等通風口保持1.5公尺以上。\n3、壁掛式警報器偵測中心點應與天花板間距15-50公分。\n五、維修保養：\n(一)住宅用火災警報器安裝完成後，應貼上標籤標示安裝日期，每月定期使用住宅用火災警報器測試鈕測試，是否發出正常功能之警報聲，如未鳴響請立即更換電池或新品；配合電池有效期限更換電池，以確保正常運作所需電量。\n(二)部分廠商出廠之住宅用火災警報器若發出間斷式短聲響應為顯示電池電力不足，應立即更換確保功能正常。","u":"臺北市政府消防局","h":19681,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=347D28000B7B4E62","d":"2017-11-06","sid":"347D2800"},{"q":"汽車臨時停車於消防栓前的罰則？","a":"依據「道路交通安全規則」第111條第1項第2款規定:「交岔路口、公共汽車招呼站10公尺內、消防栓、消防車出入口5公尺內不得臨時停車。」違法者依道路交通管理處罰條例第56條第1項規定汽車駕駛人停車時，處新臺幣300元以上600元以下罰鍰。","u":"臺北市政府消防局","h":19451,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4944E2A580C74625","d":"2017-11-06","sid":"4944E2A5"},{"q":"加入義消須具備哪些資格條件？","a":"一、年滿18歲之中華民國國民或依法領有居留許可之外國人、大陸地區人民、香港或澳門居民。\n二、居住當地且未參加其他義勇或民防組織者。\n三、具助人熱忱與服務志趣，且願餘時參與救護及相關工作者。\n四、中華民國國民10年內或外國人、大陸地區人民、香港、澳門居民在臺期間，未曾受有期徒刑以上刑之宣告確定。但中華民國國民因過失犯罪或受緩刑宣告者，不在此限。\n五、年齡限制：\n(一)新進義勇消防人員應為年滿18歲之中華民國國民。\n(二)義勇消防人員除總隊長、副總隊長、顧問外，年齡規定如下：\n(1)總隊之人員為70歲以下。\n(2)大隊之人員為68歲以下。\n(3)中隊之人員為65歲以下。\n(4)分隊之人員為60歲以下。\n(5)專責協助防災教育宣導之中隊及分隊人員為68歲以下。","u":"臺北市政府消防局","h":19094,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B1B4F253977CEB94","d":"2017-11-06","sid":"B1B4F253"},{"q":"我可以自願付費請消防局救護車送往指定醫療機構？","a":"一、 不可以。 二、 本府消防局的救護車是提供緊急傷病患到院前緊急救護服務，救護車收費是為了抑制民眾濫用本局救護車，及保障真正需要緊急就醫民眾的權益，讓有限資源做最有效的規劃運用。 三、 如果民眾使用救護車不符合緊急傷病原則，即使願意付費，仍請市民優先利用其他交通工具前往，相關資訊如下： (一) 復康巴士：02-2727-4168轉分機8532(公共運輸處一般運輸科)、1999轉分機6967、1672 (社會局老人福利科)、02-2537-1099轉分機6966~6968 (臺北市長期照顧管理中心)，或民眾網路訂車系統(https://0809080650.gov.taipei/) (二) 中重度失能年長者交通接送資訊(無揹扶服務)： 1.世豪小客車租賃有限公司：0800-010908、02-8792-7758。 2.福倫交通股份有限公司：0800-616978、412-8789 。 3.生通股份有限公司：(02)2599-7667。 4.小驢駒小客車租賃有限公司：(02)2721-5998。 5.社團法人臺灣計程車學院協會：(02)2912-0299。 6.祝三實業股份有限公司：(02)2966-1009。 7.清山交通有限公司：：(02)2745-7715、0961-329-999、0970-508-999。 8.三合利計程車客運服務有限公司：(02)2929-0577。 9.北台灣無障礙運輸產業工會：(02)7751-5349。 10.大瑩長照服務股份有限公司：(02)8502-3736。 11.大中華國際租賃有限公司：(02)2652-2662、 0913-239685。 12.亞捷汽車租賃股份有限公司：(02)2882-2277。 13.常樂企業有限公司：(02)2523-8456。 14.吉盛交通股份有限公司：02-2828-0333。 15.一翔交通股份有限公司：02-2312-0985。 16.台灣樂康協會：02-77230088。 17.大豐國際租賃限公司：02-2246-8999。 18.中華民國愛無界長期照顧產業發展協會：02-25681379。 ","u":"臺北市政府消防局","h":12864,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5ABA72A722550B94","d":"2017-11-06","sid":"5ABA72A7"},{"q":"緩降機使用要領？","a":"一、開-拉開窗戶。\n二、拉-拉起上部立桿至固定高度。\n三、抽-抽出臂桿往外翻出。\n四、開-打開緩降機保護箱，取出緩降機。\n五、掛-掛上緩降機，並鎖緊掛環旋鈕。\n六、拋-將緩降機輸盤往下拋，放出繩索。\n七、套-將環帶套至兩手腋下，收緊扣環至胸前。\n八、跨-跨出至陽臺或窗臺外，面向牆面往下垂降。\n九、推-雙手將身體往外推避免與牆面接觸。\n十、脫-降到地面後立刻拖吊環帶，以便另一邊環帶供其他人逃生。","u":"臺北市政府消防局","h":8779,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B18CA2CE7908EF5","d":"2008-09-25","sid":"5B18CA2C"},{"q":"消防安全檢查重大不合格場所可至哪裡查詢？","a":"可至臺北市政府消防局網址（https://www.119.gov.taipei/）「最新消息」點選「建築物消防安全檢查不合格場所公告」查詢，或至臺北市政府網站(https://www.gov.taipei/)「市政公告」>公共安全專區>公共安全聯合稽查小組>消防安全不合格告示張貼情形(消防)查詢。","u":"臺北市政府消防局","h":6944,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=63F594CBF6B56ED5","d":"2017-11-06","sid":"63F594CB"},{"q":"房子的電線多久檢查一次？找誰檢查？如何檢查？","a":"依據用戶用電設備檢驗辦法第16條規定：「用戶用電設備自新設現場檢驗接電起五年內應至少檢驗一次；超過五年者，每三年應至少檢驗一次。」，另相關檢查流程，可依各場所狀況洽詢台電或經濟部能源局。","u":"臺北市政府消防局","h":6288,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E801A05B48A6C92B","d":"2008-09-25","sid":"E801A05B"},{"q":"懷疑瓦斯行超量儲存或經常違規停放載滿瓦斯桶的貨車，有危害公安之虞，要如何檢舉？","a":"可直撥119電話檢舉，俾便即刻派員到場處理。","u":"臺北市政府消防局","h":5972,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4BCEB3CA29155959","d":"2017-11-06","sid":"4BCEB3CA"},{"q":"電器用品要如何使用才能避免災害發生？","a":"鋰電池產品使用前安全建議事項\n一、購買產品時，尋求通路明確且經過經濟部標準檢驗局(BSMI)認證，貼有商品安全標章的產品。\n二、依照產品充電及使用說明說正確使用，並使用專為產品設計的充電器進行充電。\n三、更換購買新電池時，選用經原廠認證合格的電池設備，不要使用來路不明，私人制造的電池。\n鋰電池產品充電使用注意事項\n一、避免過度充電，建議充電量維持在20~80%之間。\n二、在安全通風的處所進行充電。\n三、避免在床上或沙發附近未設備充電。\n四、避免在高溫潮濕環境下充電。\n五、避免邊充電邊使用產品。\n六、充電或存放時遠離火源、高熱設備、易燃物。\n七、使用時有下列異常情形應立即停止使用:變形、膨脹、漏夜、生鏽、異常氣味、異常高溫等。","u":"臺北市政府消防局","h":5866,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4ADE70B12C3859AF","d":"2017-11-07","sid":"4ADE70B1"},{"q":"有關熱水器遷移或更換補助3000元相關資訊？","a":"截至115年7月6日登記額滿，如有意願申辦之本市市民，請洽住家鄰近消防分隊登記備取，補助資格須待消防人員居家訪視後判定。\n※詳細說明請至前往連結參閱\nhttps://www.119.gov.taipei/News_Content.aspx?n=FC754D463CA180F5&sms=A1BD9289D533C42C&s=A5EF438AEA786826","u":"臺北市政府消防局","h":5845,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BFC9A3F543D32E41","d":"2017-10-31","sid":"BFC9A3F5"},{"q":"使用瓦斯前應注意什麼？瓦斯管線漏氣時之處置方法為何？","a":"一、使用瓦斯注意事項：注意是否有臭味，確認無漏氣時再開火使用，並注意通風要良好。若懷疑家中瓦斯配管(管線)有漏氣時，不可用火柴或打火機點火測試，應以肥皂泡沫檢查有無洩漏，或通知瓦斯行協助檢測確認；也可用以下方法檢查有無瓦斯漏氣： (1)嗅覺─家中瓦斯中摻\n有臭劑，漏出時會有臭味。\n(2)視覺─瓦斯外洩，會造成空氣中形成霧狀白煙。\n(3)聽覺─會有“嘶嘶”的聲音。\n(4)觸覺─手接近外洩的漏洞，會有\n涼涼的感覺。\n二、瓦斯外洩緊急處置要領「禁、關、推、離」四步驟：\n(1)禁止開、關任何電\n器，以免產生火花。 (2)關閉瓦斯總開關或瓦\n斯桶開關閥。\n(3)輕輕推開窗戶通風，讓瓦斯飄散出去。\n(4)離開現場到戶外，並撥打119報案。","u":"臺北市政府消防局","h":5547,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=32FE8245DE341723","d":"2017-11-06","sid":"32FE8245"},{"q":"鋼瓶（瓦斯桶）放置及安全注意事項？","a":"一、鋼瓶請注意檢驗期限並附有檢驗合格標誌。\n二、鋼瓶請直立或固定，且避免放置於受猛烈震動及易於掉落之處所(樓梯口或陽臺處)。\n三、放置於通風良好且避免日曬之處所。\n四、即將使用完畢之瓦斯桶，不可將鋼瓶放倒使用。\n五、平時應注意瓦斯管線是否龜裂並予以更換，避免瓦斯漏氣。\n六、容器內液化石油氣使用完後，仍應緊閉開關，切勿自行移動或傾倒。","u":"臺北市政府消防局","h":5467,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=66210490717FCC19","d":"2017-11-06","sid":"66210490"},{"q":"是否有心肺復甦術(CPR)及自動體外心臟電擊去顫器(AED)訓練？","a":"一、有。\n二、衛生局於本市各行政區健康服務中心均定期辦理免費訓練。\n三、個人或機關團體均可逕洽消防局網站(http://cpr.tfd.gov.tw)報名，辦理方式：\n1.定點學習：每月第2週星期六9:00-11:00於防災科學教育館。\n2.到府服務：本市轄內機關（團體）、學校及社區選定適當場所，並向消防局申請教學。\n3.體驗學習：各行政區急救教學站如下：\n地點     分隊別     地點    分隊別    地點     分隊別\n中正區 泉州分隊 大安區 金華分隊 內湖區 東湖分隊\n萬華區 雙園分隊 南港區 成德分隊 大同區 延平分隊\n文山區 木柵分隊 中山區 建國分隊 士林區 後港分隊\n信義區 莊敬分隊 松山區 中崙分隊 北投區 光明分隊\n路徑: 首頁>影音專區>CPR及異物哽塞教學。\n四、急救教學請上消防局網站(https://www.119.gov.taipei)\n1.流程路徑：首頁>宣導教育>救護宣導。\n2.影片路徑：首頁>影音專區>救護宣導。","u":"臺北市政府消防局","h":5275,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B945D62AAEE42469","d":"2013-01-15","sid":"B945D62A"},{"q":"變壓器爆炸或電線掉落地面，應如何處理？","a":"請立即撥打119電話報案或通知臺灣電力公司(或區營業處)派員處理，並代為看守現場不要讓行人或車輛靠近(通行)，以免發生觸電危險。","u":"臺北市政府消防局","h":5079,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9B770506DE200AC7","d":"2017-11-06","sid":"9B770506"},{"q":"為了申請保險理賠，需要報案救護證明，該如何申請？","a":"一、凡7年內之緊急送醫救護服務案件，皆可申請。\n二、申請人得為當事人(傷病患本人)、配偶、直系血親或委託代理人(填具委託書)，檢齊證件後向消防局申請提供。\n三、申請方式\n四、申請書可於消防局網站(https://www.119.gov.taipei/）之首頁>下載專區>一般申辦案件中，點選「救護證明」下載填寫，如委託他人辦理，請下載填寫委託書。\n五、如有相關問題，可撥打電話(02-27297668轉分機6428)洽詢。","u":"臺北市政府消防局","h":5070,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B79CCC2F340E32C8","d":"2017-11-06","sid":"B79CCC2F"},{"q":"如果瓦斯行販售的桶裝瓦斯容器已逾檢驗期限，該怎麼辦？","a":"請立即撥打119電話檢舉，並提供相關購買證明資料，本局將立即派員到場協助處理，如確認為瓦斯行販售逾期液化石油氣容器予民眾使用，將針對販售之瓦斯行依違反「消防法」第15-4條規定，開立臺北市政府消防局舉發違反消防法案件通知單。","u":"臺北市政府消防局","h":4969,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D9649D192D9DF32D","d":"2017-11-06","sid":"D9649D19"},{"q":"自行車鑰匙遺失無法打開車鎖時怎麼辦？","a":"請您就近尋找鎖匠或車行協助開鎖，或撥打1288查號台查詢周邊鎖匠或車行電話號碼。","u":"臺北市政府消防局","h":4924,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3A74AF534D230F4D","d":"2013-05-07","sid":"3A74AF53"},{"q":"呼吸道哽塞（吃東西哽住、哈姆立克法）之急救要點？","a":"1.輕度異物哽塞：\n(1)立即詢問病人或家屬「病人噎到了嗎?」。\n(2)鼓勵病人咳嗽，絕不要去干擾病人自發性的咳嗽和出力的呼吸。\n2.重度異物哽塞：（清醒）\n(1)立即詢問病人或家屬「病人噎到了嗎?」。\n(2)若病人點頭表示或無法發出聲音時，應立即在病人後面使雙腳成弓箭步、前腳膝蓋置於病人胯下、上半身靠近或貼緊病人背部以穩住病人。\n(3)一手握拳（大拇指與食指形成之拳眼面向肚子）放於上腹部正中線，位置於肚臍上緣，另一手抱住放好之拳頭（懷孕後期或非常肥胖者應考慮胸部按壓）。\n(4)雙手用力向病人的後上方快速瞬間重複推擠，且隨時留意是否有異物吐出，直到病人意識喪失或異物被排除為止。\n3.若異物無法排除且病人意識喪失而癱在施救者身上時，應求救或打119：\n(1)弓箭步之前腳應往後退，小心迅速的讓病人仰躺於地上。\n(2)以壓額抬下巴法打開病人的呼吸道，同時間若發現病人嘴內有可見的固體異物時，應先將病人頭部側向一邊，可用手指清除。\n(3)若無可見的固體異物或已清除後時， 以拇指與食指捏住病人鼻子，口對口施予人工呼吸，給予吹氣1 次。(如果不願意實施人工呼吸，可直接進行壓胸)。\n(4)若氣吹不進去或胸部沒有升起時，重新打開病人呼吸道(再操作1 次「壓額抬下巴」)並且再吹氣1次。\n(5)若氣仍吹不進去或胸部沒有升起時，應立即給予胸部按壓30次（速率約每分鐘100 - 120次），並重複步驟2-5，同時要目視有無異物吐出或阻塞解除的現象。\n(6)重複吹2口氣及壓胸30次(或持續壓胸)，直到阻塞解除或執行5個循環(約2分鐘)後立即送醫。\n4.兒童(1-8歲)的施救方式與成人急救流程相同， 施救者應視病人體型調整施力， 如體型較小時， 可以單手壓胸。\n5.一歲以下小孩呼吸道哽塞：\n(1)先拍背，將嬰兒翻轉，使面朝下，讓嬰兒趴在手臂上，以手掌托住嬰兒下巴，身體前傾，頭低腳高，以掌根拍擊兩肩胛中間5次。\n(2)將嬰兒翻轉成面朝上，保持身體前傾，頭低腳高，使用2手指按壓胸骨及乳頭連線下方，也是壓5下，同時目視異物是否吐出。\n(3)持續上述方法急救，急救過程需求救或打119。\n6.其他注事事項：鼓","u":"臺北市政府消防局","h":4914,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C30134A2D4E0AA11","d":"2008-09-25","sid":"C30134A2"},{"q":"住家附近有人任意燃放煙火，危害公安，擾亂安寧，要如何檢舉？","a":"可直撥119電話檢舉，俾便即刻派員到場處理。","u":"臺北市政府消防局","h":4879,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8DE9EFD9BE5156EA","d":"2017-11-06","sid":"8DE9EFD9"},{"q":"如何準備緊急避難包呢？","a":"二、緊急避難包可用一般家中現有的背包即可替代，依使用者的需求放置物品的種類，逃生避難時，一定要穿上鞋子，最好戴上安全帽，並記得攜帶緊急避難包！","u":"臺北市政府消防局","h":4546,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F43BEDAC6BC194D4","d":"2017-11-06","sid":"F43BEDAC"}]},{"org":"資訊局","total":76,"items":[{"q":"如何取得停車費用的繳費收據?","a":"￭ 臺北市停車管理處網站提供三個月內之停車繳費收據下載列印服務，如有需要亦可上網查詢並列印收據。\n- 臺北市停車單「補印繳費收據」官網操作流程如下：\n(1) 前往臺北市停車管理處網站 https://parkingfee.pma.gov.taipei/\n(2) 輸入您要補印收據的車號及車種，收費來源選擇「第三方支付」。(公司統一編號為非必填)\n(3) 選擇您欲開立收據之停車單並完成列印。\n￭ 如欲取得電子繳費紀錄，可透過以下方式取得：\n1. pay.taipei智慧支付平台(https://pay.taipei)：\n若您於繳費前，先以台北通會員登入，則可點選網站中的「繳費紀錄」選單，列印繳費資料；\n若繳費前未登入會員，則請於pay.taipei智慧支付平台繳費後，以手機截屏畫面作為紀錄。\n2. pay.taipei智慧支付平台合作之支付業者APP：\n可於您使用的支付業者APP查閱「交易紀錄」，並可以手 機截屏畫面作為收據使用。詳細內容請見各業者網站或app。","u":"臺北市政府資訊局","h":118330,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=86B39FF6B8089B78","d":"2025-05-14","sid":"86B39FF6"},{"q":"pay.taipei智慧支付平台的扣款方式？ 這些電子支付方式我都沒有，還可以怎麼繳費呢？","a":"1. pay.taipei智慧支付平台合作之支付業者如下，民眾可透過pay.taipei選擇符合個人需求之支付工具進行繳費。\n橘子支付、Pi拍錢包、街口支付、歐付寶、悠遊付、ezPay簡單付、台北富邦銀行、嗶嗶繳、遠傳心生活、停車大聲公、車麻吉、全支付、iPASS MONEY、元大銀行、蝦皮購物、發票存摺、Apple Pay、icash pay、遠通電收、永豐銀行、PChome 24h購物、全盈+PAY。\n2.北市府各稅費、規費、罰單除電子支付外，亦提供各大超商/金融機構臨櫃、轉帳等繳費方式，詳細請參閱各費用帳單繳納說明及各費用主管機關公告。","u":"臺北市政府資訊局","h":100822,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BF3A64ACA8CF20BD","d":"2025-05-14","sid":"BF3A64AC"},{"q":"如何申請註冊成為台北通會員？","a":"您可以透過網站或台北通APP完成會員註冊。\nAPP可透過以下3種方式( APP下載連結頁 )：\n網頁：","u":"臺北市政府資訊局","h":32946,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=87483ACB43C87C87","d":"2020-09-21","sid":"87483ACB"},{"q":"台北通一般會員、金質會員會員身份差異性是什麼？","a":"「金質會員」為台北通經過實名驗證之會員，「金質會員」可享有更多服務，詳細服務分級說明可參考以下表格。","u":"臺北市政府資訊局","h":14875,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6FAB1E59C7C323E6","d":"2020-09-21","sid":"6FAB1E59"},{"q":"「臺北公眾區免費無線上網」的服務時間及服務區域為何？","a":"TaipeiFree提供服務時間並無限制，在室內公共場所內，只要在營運時間內可免費上網，在室外公共場所部分則為24小時全年無休。\n本案服務範圍則為本市主要公共場所，如市府市政大樓、12個區行政中心、市立圖書館及各分館、市立聯合醫院各院區、臺北捷運車站及捷運地下街等場所，您可以利用TaipeiFree官網( https://wifi.taipei )「尋找附近熱點」功能，查出熱點資訊或最靠近的熱點。","u":"臺北市政府資訊局","h":13424,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E92A7CA626F7C021","d":"2024-05-16","sid":"E92A7CA6"},{"q":"申辦市民光纖有什麼優惠方案呢？","a":"台灣智慧光網提供臺北市光纖網路服務，以較市場低廉之費率給臺北市民，並提供原住民、弱勢團體(包含低、中低收入戶，身心障礙人士等)、社福機構優惠方案。\n民眾如果想要更進一步了解相關訊息，歡迎到台北光纖網站瀏覽， https://www.taipeifiber.com.tw ，或者撥打24小時服務電話：0809-080-081詢問。","u":"臺北市政府資訊局","h":10418,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3FF7054A65DAA77D","d":"2024-05-16","sid":"3FF7054A"},{"q":"逾期的費用還可查詢繳費嗎?","a":"原則上，逾期款項即無法使用pay.taipei智慧支付平台(https://pay.taipei)查詢繳費，惟北市水費、路邊停車費逾繳費期限仍提供繳納服務(請注意，各費用主管機關可能有不同滯納金或罰金加計之規定)。\n各費用逾期繳費規定，依費用主管機關規定與公告為準。","u":"臺北市政府資訊局","h":8444,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=623A0CB05906F7F8","d":"2025-05-14","sid":"623A0CB0"},{"q":"「臺北公眾區免費無線上網」的相關資訊，可以在何處查詢？","a":"有關「臺北公眾區免費無線上網」的相關資訊、熱點位置及使用方式，可以隨時在服務網站( https://wifi.taipei )查詢，期盼所有市民多加支持與利用。","u":"臺北市政府資訊局","h":8103,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D077D0A1FEEBFF8A","d":"2024-05-16","sid":"D077D0A1"},{"q":"台北通註冊會員時，提示此身分證號已被註冊使用了，該怎麼辦？","a":"出現「身分證已被使用」或是「您已是金質會員」的提示訊息，表示您曾經註冊過台北通金質會員哦。\n請以提示訊息上顯示的帳號聯絡方式（email或手機號碼）進行登入即可；如您忘記密碼，可以透過忘記密碼功能進行密碼設定。\n若仍有疑問，請致電客服(1999外縣市02-27208889)轉8585，將由專人為您確認。","u":"臺北市政府資訊局","h":7506,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E235C4CC2D35BC74","d":"2025-05-15","sid":"E235C4CC"},{"q":"臺北公眾區免費無線上網對影音網站有限制嗎？","a":"「臺北公眾區免費無線上網」開放多媒體影音網站(不含即時轉播(real-time streaming)類型)瀏覽服務，僅對線上遊戲等高頻寬使用量之網站或應用程式，以及對有害兒童及少年身心發展的限制級（如色情暴力等）不當內容網站採取連線管控措施；兼顧使用者需求、網路品質優化、以及本案公共服務性質；對於大部分民眾的主要網路使用行為應已足夠。至於有更高上網頻寬或網路資源需求之民眾，宜自行向相關電信業者申請相關付費上網服務，以維有限資源之公平運用。","u":"臺北市政府資訊局","h":6767,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=81752A20DFF576D4","d":"2024-05-16","sid":"81752A20"},{"q":"請問台北光纖（Taifo，台灣智慧光網股份有限公司）的0809-080-081這支客服專線是否為免付費電話呢？","a":"目前用市話及手機撥打0809-080-081客服專線皆屬免付費，若日後有調整，台灣智慧光網股份有限公司將於網頁上 www.taipeifiber.com.tw 公佈調整訊息。","u":"臺北市政府資訊局","h":6667,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DD79A633DCA59F0A","d":"2024-05-16","sid":"DD79A633"},{"q":"1999網路電話無法使用","a":"Q1.網頁電話支援那些瀏覽器?\nAns：目前支援個人電腦或筆電上的Google Chrome、Mozilla Firefox及Microsoft Edge三款瀏覽器。如果市民朋友使用上述三款瀏覽器卻無法執行網頁電話，最常見的原因是瀏覽器版本太舊，請更新至最新版本後再繼續使用。\nQ2.為什麼點擊了網頁電話的小圖示卻未出現要求「使用你的麥克風」權限的提示訊息?\nAns：此訊息只會在您所使用的個人電腦或筆電從未訪問過網頁電話的網址時，才會出現。若是曾經訪問過網頁電話的網址，且按過「允許」或「封鎖」存取麥克風的按鈕，您的瀏覽器就會將此設定儲存在瀏覽器裡面了。以Google Chrome瀏覽器為例，遇到此問題時，請參考以下畫面按左上角的「小鎖」圖示，允許「麥克風」使用權限後，再按一次左上角「小鎖」圖示以關閉功能選單，然後再按「F5」按鍵重新載入網頁，即可開始使用網頁電話。\nQ3. 網頁電話於通話時的聲音斷斷續續。\nAns：可能是個人電腦或筆電的網路品質及頻寬不足所造成，在通話時請試著關閉其他應用程式並避免下載資料或大型檔案。\nQ4. 網頁電話訊息提示已經連接上(connected)，但聽不到對方的聲音。\nAns：請先確認是否已經開啟音效卡的喇叭及麥克風功能。若喇叭及麥克風皆已打開卻仍聽不到聲音，那麼很可能是您所處的網路環境中有防火牆，防火牆關閉了網頁電話服務所需要的通訊埠，才會發生沒有聲音的問題，此時請您試著更換連網的方式後再使用網頁電話（例如改用手機的無線熱點分享等方式連網）。\nQ5. 網頁電話無法使用音效卡。\nAns：因為網頁電話需要進行語音通話，所以個人電腦或筆電之音效卡必須支援全雙工(full duplex)才能與對端進行語音通話。\nQ6. 網頁電話通話時，對方可以聽到我的聲音，但我聽不到對方的聲音（或是我可以聽到對方的聲音，但對方聽不到我的聲音）。\nAns：請先確認是否已經開啟音效卡的喇叭及麥克風功能。若喇叭及麥克風皆已打開卻仍聽不到聲音，那麼很可能是您所處的網路環境中有防火牆，防火牆關閉了網頁電話服務所需要的通訊埠，才會發生沒有聲音的問題，此時請您試著更換連網的方式後","u":"臺北市政府資訊局","h":6444,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=49B64E3689993525","d":"2024-05-16","sid":"49B64E36"},{"q":"接到學校通知，學生要透過台北通才能下載電子畢業證書，要怎麼註冊和取得畢業證書呢？","a":"臺北市政府試辦109學年度畢業證書電子化自110年7月19日上線，共計20所學校參與試辦，試辦學校名單（請詳見： https://sites.google.com/view/taipeimydocgra/ ） 請先確認您的學校是否為試辦學校 ，再進行登入臺北市政府MyDoc電子文件服務平台（ https://mydoc.gov.taipei/MYDOC/ ）下載。\n台北通帳號註冊請參考以下方法， 若有註冊上的疑問，請於周一至五（8:30~17:30）撥打本局客服專線1999（外縣市請撥02-27208889）轉分機8585，由專人協助確認：\n一、本國籍學生：\n1.若您 已經有身分證 ，可以透過台北通APP或官方網站的「身分證驗證」完成註冊 請先準備身分證，並於步驟中拍攝或上傳身分證正反面，操作步驟如下：\n(1)請於APP或官方網站選擇「身分證」註冊，閱讀注意事項及個資使用聲明。 (2)拍攝身分證正面及反面。 (3)確認註冊資料是否正確、符合身分證資訊，進行修改或送出。 (4)設定帳號（手機或email）及密碼。 ※APP上僅提供以手機號碼設定帳號、官網則可選擇手機號碼或email。\n2. 還沒有身分證 ，請透過 台北服務通 上傳其他證件（如健保卡、戶口名簿等）進行驗證，請參考以下步驟， (1)請先至台北通官網（ https://id.taipei/tpcd/registration/basic ）註冊一般會員（驗證聯絡方式有效性）。 (2)透過台北服務通「 台北通會員升級暨異動申請 」，上傳相關身分文件，以線上送件申請（送件網址： https://service.taipei/case-detail/AW004 ）\n二、外國籍學生：\n1.若您持有 晶片式居留證 ，則可以透過台北通APP或官方網站的「居留證驗證」完成註冊 請先準備居留證，並於步驟中拍攝或上傳居留證正反面，操作步驟如下：\n(1)請於APP或官方網站選擇「居留證」註冊，閱讀注意事項及個資使用聲明。 (2)拍攝居留證正面及反面。 (3)確認註冊資料是否正確、符合居留證資訊，進行修改或送出。 (4)設定帳號（手機","u":"臺北市政府資訊局","h":6365,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D4CB2EC024A67D0D","d":"2021-07-16","sid":"D4CB2EC0"},{"q":"台灣智慧光網公司告知光纖纜線將拉進社區（大樓），是否屬實？","a":"是的，確實如此。\n光纖到府案建設，就是將光纖纜線直接佈放至每一家戶中。當光纜佈建到達建物附近後，必須將管線引進社區(大樓)，屆時居民即可申辦光纖網路服務。\n民眾如果想要更進一步了解相關訊息，歡迎到台北光纖網站瀏覽， https://www.taipeifiber.com.tw ，或者撥打24小時服務電話：0809-080-081詢問。","u":"臺北市政府資訊局","h":6120,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C43CDD97517B28F6","d":"2024-05-16","sid":"C43CDD97"},{"q":"如何透過台北通APP掃描QRcode登入市政線上服務？","a":"台北通提供透過QRcode登入台北通官方網站會員中心及應用台北通帳號登入的市政線上服務。\n請開啟台北通APP，點選 首頁 左上方「掃描」功能，或 卡證 「台北通虛擬卡」下方右側的「掃描」，將掃描框對準QRcode，即可登入。\n請參考 官方網站步驟說明 （首頁->功能教學與Q&A->新手上路功能教學->登入->WEB網頁版->QRcode 登入 ）","u":"臺北市政府資訊局","h":6111,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D6CF2A0D89DE06DB","d":"2025-05-16","sid":"D6CF2A0D"},{"q":"我用「臺北公眾區免費無線上網」有遇到問題，可以向誰詢問？","a":"您在使用「臺北公眾區免費無線上網」過程中，可以撥打24小時市話免付費客服專線：0809-031-081， 讓客服中心為您處理：\n（一）熱點查詢。\n（二）TaipeiFree官網資訊查詢。\n（三）網路訊號障礙與連線問題。","u":"臺北市政府資訊局","h":5975,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=68A893ECFAA6D352","d":"2024-05-16","sid":"68A893EC"},{"q":"如何使用網頁電話？","a":"如何使用網頁電話？\n臺北市政府為提供民眾更為多元之聯繫管道，提供不受地點限制之網頁電話服務，如欲使用本項服務之市民朋友請先確認網路功能正常並接妥耳機及麥克風後方可正常使用，有關本項服務使用說明如下：\n開啟頁面後，市民朋友可依對應之機關名稱點擊右側之耳機圖示，若是第一次使用，將會跳出以下頁面，請按下「允許」將會開啟撥號頁面。\n按下「允許」後，網頁電話才能使用您個人電腦或筆電的麥克風發送聲音。頁面將出現以下圖示，並以紅色旋轉動畫呈現與該機關單位的網路電話系統連接中，此時您可按點擊紅色動畫，以中斷或取消連接。\n當完成與該機關單位的網路電話系統連接後，頁面將出現以下圖示。此時個人電腦或筆電可聽到電話交換機自動總機系統所提供的語音宣告，此時於數字鍵盤按下您要轉接的分機號碼，並等候該分機接聽後，即可與對方進行通話。若是由真人直接接聽時，您就不需再按數字鍵盤輸入分機號碼，可直接與對方進行通話。\n完成通話後請按下紅色圖示即可掛斷，此時頁面將出現以下內容。","u":"臺北市政府資訊局","h":5809,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=073E1F392BD19689","d":"2024-05-16","sid":"073E1F39"},{"q":"無線上網的電磁波會不會很強？會不會影響人體健康？","a":"Wi-Fi無線網路的電磁波強度很小，小於日光燈、行動電話、吹風機、微波爐等各種電器用品；Wi-Fi 無線接取器(AP)電源在開啟及關閉時的電磁波功率密度更幾乎沒有差距。世界衛生組織（WHO）相關報告也表示：「至今沒有可靠的科學證據顯示，無線網路產生的微弱射頻訊號會對健康造成負面影響」，對於環境中的無線廣播、無線電視電臺以及無線網路訊號，WHO的報告也維持「無可靠科學證據顯示有致癌關聯性」的結論。","u":"臺北市政府資訊局","h":5798,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=210B7CF9930099D8","d":"2024-05-16","sid":"210B7CF9"},{"q":"想瞭解光纖到府案的施工進度，該如何查詢？","a":"民眾如果想要更進一步了解相關訊息，歡迎到台北光纖網站瀏覽， https://www.taipeifiber.com.tw ，或者撥打24小時服務電話：0809-080-081詢問。","u":"臺北市政府資訊局","h":5748,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CA81E209EA166158","d":"2024-05-16","sid":"CA81E209"},{"q":"台北通帳號輸入錯誤幾次會被鎖定？被鎖定該如何解鎖？","a":"為了保護您的帳號安全，帳號密碼輸入錯誤3次將被鎖定15分鐘。\n建議您可以使用忘記密碼的功能，系統將發送驗證資訊，並提供您變更密碼功能。\n※提醒您鎖定期間可能會無法透過忘記密碼功能變更密碼。\n如仍有相關問題，請致電客服(1999外縣市02-27208889)轉8585。\n客服中心服務時間為08:00-18:00。","u":"臺北市政府資訊局","h":5532,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=ADF922FDDA8577F8","d":"2025-05-16","sid":"ADF922FD"},{"q":"捷運車站有「臺北公眾區免費無線上網」，那捷運列車呢？","a":"捷運全線目前為車站的詢問處提供免費之無線上網服務，Taipei Free服務名稱(SSID)為「TPE-Free」。","u":"臺北市政府資訊局","h":5528,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=350F3A597DBA56CD","d":"2024-05-16","sid":"350F3A59"},{"q":"我有圖書借閱證，為什麼我台北通APP裡面沒有圖書借閱證？","a":"請登入 臺北市立圖書館館藏查詢系統 ，登入進入我的主頁，並且點選「與台北通結合」。","u":"臺北市政府資訊局","h":5216,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A9BFEF2AFEE0CD2C","d":"2025-05-16","sid":"A9BFEF2A"},{"q":"「臺北市光纖網路委外建設暨營運案」是由臺北市政府出資興建嗎？","a":"臺北市政府於本案建設過程中完全「零出資」，依政府採購法第99條（開放民間投資興辦）以公開招標方式辦理招標作業，委由廠商負責建設、營運，採收取使用費、權利金之方式，並自負盈虧；所有的成本皆由台灣智慧光網股份有限公司(Taifo)負擔。","u":"臺北市政府資訊局","h":4995,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6AB3BCAD5CB6978A","d":"2024-05-16","sid":"6AB3BCAD"},{"q":"我用智慧型手機上網，感覺比用筆記型電腦或平板電腦要慢？","a":"在頻寬相同的狀況下，基於智慧型手機的硬體功能因素，在讀取含大量圖形資料的網頁時，需要比筆記型電腦或平板電腦較多的處理時間，可能直接影響網頁顯示速度，讓使用者認為「上網比較慢」。","u":"臺北市政府資訊局","h":4896,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D299339728A9498C","d":"2024-05-16","sid":"D2993397"},{"q":"為什麼我在家裡收不到「臺北公眾區免費無線上網」的網路訊號？","a":"市府的便民措施，是針對民眾的基本需求提供免費服務，並非要取代商業性服務。基於本案公共服務性質及Wi-Fi無線網路訊號之穿透力因素，室外公共場所之Taipei Free熱點之最佳化服務範圍，以「熱點周邊，未受建築物及其他人工設施遮蔽阻隔之公共場域」為主，室內公共場域提供服務場域則以「市府所轄公共場域」為主；不會特別保證家戶、辦公室、民間營業場所及巷弄、山區等區域之網路訊號品質，敬請理解體諒。","u":"臺北市政府資訊局","h":4878,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=771274C4C9C0AEF8","d":"2024-05-16","sid":"771274C4"}]},{"org":"青年局","total":76,"items":[{"q":"青年局停車場是否對外開放？開放時間為何？如何收費？","a":"青年局經管B3、B4停車場採24小時對外開放，管理室人員服務時間:自上午8時至晚上10時。 車輛臨停費用：每半小時15元計費，未達半小時者以半小時計。","u":"臺北市政府青年局","h":1279,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=962B6699976CD476","d":"2024-05-24","sid":"962B6699"},{"q":"青年局成立後，攀岩場、直排輪場開放時間、費用是否改變？","a":"攀岩場、直排輪場開放時間及費用維持不變。\n場地已委由思福緹股份有限公司營運管理，購票方式採線上購票，可至青年局官網（點選場館資訊）→場館介紹→攀岩場【9F】)查詢","u":"臺北市政府青年局","h":1148,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F8A13F4F1417AAF7","d":"2024-05-27","sid":"F8A13F4F"},{"q":"如何申請社會住宅「青年創新回饋計畫」？","a":"青創計畫的申請僅限線上申請，請於申請期間至「臺北市政府安心樂租網」（連結點： https://rent.thurc.org.taipei/ ），以台北通帳號或其他方式登入申請，填寫基本資料，並上傳應檢附文件及提案計畫書。不受理紙本郵寄到件，且不另行通知。","u":"臺北市政府青年局","h":1015,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B04BDF236DDF5470","d":"2024-05-24","sid":"B04BDF23"},{"q":"如何申請青年實習津貼計畫？","a":"青年應於申請本計畫補助之實習期間末日之次日起三十日內，檢附規定文件向本局提出津貼申請，共有三種申辦方式：","u":"臺北市政府青年局","h":671,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6450BEE1F2088401","d":"2024-08-30","sid":"6450BEE1"},{"q":"青創貸款如事業經營良好，可否提前清償？當申請青創貸款後，若開店未滿5年就停業，是否能延長貸款償還期限？那利息又該如何計算?","a":"（一）可以。貸款人如申貸後如營運良好、資金充裕，得視個別情況向承貸金融機構提出提前還款，以減輕債務負擔。如有送保並可就提前清償之貸款金額請承貸金融機構代為申請退還信用保證手續費。\n（二）青創貸款之貸款年限是由青創貸款審查小組進行審查後核定，故事業結束營業後，仍應依原核定年限還款；若未按時繳款，承貸金融機構-玉山銀行或台北富邦銀行將採取訴訟程序向貸款人追繳未還款項。\n（三）依臺北市青年創業融資貸款實施要點第十九點規定，貸款人於貸款期間內所經營事業結束營業後，未於事實發生起三日內，以書面通知青年局，未來即使恢復營業，亦不再補貼利息。停業後之利息及還款方式請洽承貸金融機構-玉山銀行或台北富邦銀行。","u":"臺北市政府青年局","h":548,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3B7788B498DB16BF","d":"2025-03-19","sid":"3B7788B4"},{"q":"逾期未還款者，會有什麼影響？","a":"申請人逾期未還款 6 個月以上者，將立即停止補助，另承貸銀行將對申請人及保證人就積欠之貸款及利息依法追訴求償，並將資料送請財團法人金融聯合徵信中心建檔，列為金融債信不良往來戶，並揭露至貸款完全償還為止且開放金融機構查詢。這項紀錄將會影響申請人、保證人與銀行的往來關係，包括向銀行申請支票、信用卡、房屋貸款或信用貸款等，均將遭到拒絕；同時也會影響其日後在國、內外之就業或就學貸款機會。","u":"臺北市政府青年局","h":525,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4CF7092E94C442F3","d":"2024-05-27","sid":"4CF7092E"},{"q":"「模擬聯合國工作坊」是什麼？","a":"模擬聯合國會議，是一個模擬國際事務的平台，目的在於培養學生的國際視野、溝通技巧和領導力，能夠促進學生國際化教育、推動國際交流的重要平台，近年來已逐漸成為高中生的熱門社團活動。\n臺北市政府致力於提升學生的國際視野和全球思維，臺北市青少年發展暨家庭教育中心（原青發處）自2016年起開始辦理「臺北市模擬聯合國工作坊」，邀請長期參與模聯活動的人員與專精國際議題的講師蒞臨授課。期望透過工作坊的形式，讓學生打破校際與年齡藩籬相互切磋，並與講師學習、與模聯學長姐交流，ㄧ同建立宏觀視野，關心全球議題，走出國界，認識世界，同時培養學生的全球事務、溝通技巧和領導力有助於培養具有全球視野的青年領袖，活動富有國際社會的多元性和包容性。","u":"臺北市政府青年局","h":524,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2DF58D5470CDC198","d":"2024-05-27","sid":"2DF58D54"},{"q":"申請青年留貸應檢附哪些證件向承貸銀行申請？","a":"(一) 申請時未出國就讀者應檢附：\n1.有效護照影本、國內高級中等學校及大專校院畢業證書影本或同等學力證明文件。\n2.留學生及保證人之身分證正本、印章。\n3.申請日前三個月內之戶籍謄本。\n4. 稅捐稽徵機關出具之留學生或申報留學生為受扶養人之納稅義務人之最近一年綜合所得稅核定通知書。其未達申報標準者，檢附稅捐稽徵機關出具最新年度所得資料清單。\n5.國外學校、機構入學許可證明或在學證明書、註冊文件或其他足資證明留學等相關文件（文件為英文以外者，須附由政府立案之翻譯社出具之中文譯本）。\n6 國外大專院校參考名冊頁次或自教育部國際文教處網站所列印就讀學校名單。\n7.攻讀專技證照者，須檢附該留學國政府權責機關認可之學校或機構相當於副學士後學歷資格之證明文件，及全時半年以上學習之課程證明文件。\n8.未重覆申貸切結書。\n(二)申請時已出國就讀者應檢附：\n1.同上 1-8。\n2.內政部入出國及移民署核發之該留學生入出國日期證明書等相關文件。\n3.已出國就讀無法親自辦理本貸款者，檢具公證人或我國駐外使領館、代表處、辦事處或其他外交部授權機構認證之授權書。\n4.受領公費期間已結束，應檢附該公費核定領受期間之證明文件，另須經原核派機關核准方得自費在國外進修者，應檢附該機關核准之證明文件。\n(三) 所稱同等學力其認定標準適用「報考大學同等學力認定標準」第2 條及第 3 條有關國內高中及大專校院同等學力認定之標準，但大陸、國外高中及大專校院畢業或肄業者不符合青年留貸辦法貸3款對象資格。「大學同等學力認定標準辦法」請至「全國法規資料庫」之「法規檢索」輸入「報考大學同等學力認定標準」即可查詢。網址 http://law.moj.gov.tw/\n(四)在學證明文件，應由申請人就讀國外學校提供，並應載明該生所就讀系所、攻讀學位、在學起迄時間或由留學生提供學生證影本，惟需佐以附有系所、學位等資訊之選課單。","u":"臺北市政府青年局","h":404,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CB0C05D733C55D72","d":"2024-05-27","sid":"CB0C05D7"},{"q":"青年局成立後，停車場相關優惠是否有變動？","a":"1. 停車場相關優惠維持不變。\n2. 相關優惠：","u":"臺北市政府青年局","h":403,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CCEE5CF46278101B","d":"2024-05-24","sid":"CCEE5CF4"},{"q":"臺北市政府青年留學免息貸款(以下簡稱青年留貸)何時開始申請？如何申請？","a":"(一)青年留貸自 100 年 6 月 1 日起正式開放申請。\n(二)請參考承貸銀行(台北富邦)網站資料，齊備相關證明文件後至臺北市政府指定之承貸銀行提出申請。","u":"臺北市政府青年局","h":400,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FBCA8F8209CEF1BD","d":"2024-05-27","sid":"FBCA8F82"},{"q":"青年留貸是否有須返臺服務之規定？","a":"青年留貸並無返回臺北市服務之相關規定，申請人僅需依規定償還貸款即可。","u":"臺北市政府青年局","h":377,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F4FB7FA7C21B094A","d":"2024-05-27","sid":"F4FB7FA7"},{"q":"如何申請職涯諮詢服務？","a":"請至本局官網「臺北青年職涯發展中心」項下，進入預約職涯諮詢服務，亦可洽詢：臺北青年職涯發展中心，電話：02-23958567。","u":"臺北市政府青年局","h":377,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D1861858B2371165","d":"2024-05-24","sid":"D1861858"},{"q":"職涯支援科提供青年那些服務？","a":"職涯支援科整合青年職涯發展、實習、就業、創業等一站式服務窗口，提供青年全方位職涯發展，期許成為陪跑青年職涯路途上的最佳夥伴，所提供服務如下：\n(一)職前體驗探索，增加職場即戰力：\n鼓勵青年充實職涯發展，提早進行職涯規劃及職場技能訓練，減少學用落差、增加職涯選擇及職場競爭力，青年局提供青年實習津貼、青年職涯進修相關補助及辦理職涯發展活動相關補助。\n(二)職場培力實習，提升競爭力：\n青年局持續開發青年多元實習職缺，增強青年職場職能及適應力，與青年共同規劃職涯方向，提早在職前做好完善準備。\n(三)創業輔導協助，發揮影響力：\n為加強協助臺北市青年創業，青年局自114年起受理青年創業融資貸款，並搭配青年創業諮詢、系列培力課程、一案到底創業輔導及創業相關補助，全方位協助臺北市青年邁開創業腳步。","u":"臺北市政府青年局","h":372,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BA95D79043856E3F","d":"2024-05-24","sid":"BA95D790"},{"q":"青年局成立後，所在大樓開放時間是否有改變？","a":"1.青年局所在大樓開放時間維持週一至週日8：30至21：30。\n2.上、下半年配合場館設施維護，各訂1日歲修日休館一天，當天暫停場地租借。","u":"臺北市政府青年局","h":367,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7952BDF645DB7B80","d":"2024-05-24","sid":"7952BDF6"},{"q":"出國攻讀碩、博士學位、專技證照之範圍為何？","a":"(一)碩、博士學位：指已列入教育部外國大學參考名冊之大學校院，且符合教育部「大學辦理國外學歷採認辦法」相關規定者。\n(二)專業、技術證照(簡稱專技證照)：指經留學國政府認可之學校或機構辦理半年以上相當副學士後專業或技術學習課程並核發之資格證明文件；申請攻讀專技證照者，須由本府審查小組審核是否具有申貸資格。\n(三)國外大學參考名冊可於教育部國際文教處網站查詢。","u":"臺北市政府青年局","h":360,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A0D8AF646F3A7ECC","d":"2024-05-27","sid":"A0D8AF64"},{"q":"如何報名「模擬聯合國工作坊」？","a":"採網路報名，依報名先後順序錄取，額滿為止。預計於每年10月底將活動資訊公告於本局官方網站，並開放兩週時間報名，11月中旬於本局官方網站公布錄取名單及代表國家，並以e-mail及簡訊通知學員。","u":"臺北市政府青年局","h":359,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0EE85E590F18B042","d":"2024-05-27","sid":"0EE85E59"},{"q":"如申請到青年留貸後，戶籍可否遷出臺北市？","a":"如申請人將戶籍遷出臺北市，將停止利息補助，並自戶籍遷出日起算，由申請人按月攤還本貸款本金及利息。","u":"臺北市政府青年局","h":356,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2B4EC7ECDBA13360","d":"2024-05-27","sid":"2B4EC7EC"},{"q":"青年留貸應於何時償還？","a":"攻讀碩士學位或專技證照者，自借款日起算於第 4 年起按月償還本金；攻讀博士學位者，自借款日起算，於第 6 年起按月償還本金，於第 11 年起開始按月攤還本息。","u":"臺北市政府青年局","h":354,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EEF484DB12CABC75","d":"2024-05-27","sid":"EEF484DB"},{"q":"申請人如於中途轉學、休學或退學應如何處理？如果於寬限期屆滿前休學後復學，寬限期可以延長嗎？","a":"(一)申請人於寬限期屆滿前因故退學、休學或停止原訓練機構技術學習者，應於 3 個月內主動通知承貸銀行。寬限期自退學或休學生效之日起滿 6 個月屆滿，但最長不得超過原規定之寬限期。寬限期屆滿，即停止青年局利息之補貼並應依年金法按月平均攤還本息。\n(二)申請人中途轉學，所轉入之學校不符合教育部採認規定之國外大學校院者，依前款規定辦理。\n(三)申請人於寬限期屆滿前復學者，得檢附相關證明文件，向承貸銀行申請，經同意後，得繼續享有青年留貸之寬限期。但最長不得超過原申請日起算之寬限期。\n(四)申請本人於申請補助後，有戶籍遷出本市、轉學，或申請人本人、保證人有變更通訊資料等相關事項，應主動通知承貸銀行。","u":"臺北市政府青年局","h":352,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E5CA3A8A06CCF527","d":"2024-05-27","sid":"E5CA3A8A"},{"q":"青年留貸之期限及寬限期為何？寬限期是什麼？","a":"(一)攻讀碩士學位或專技證照者貸款期限最長 10 年(含寬限期 3 年)，第 4 年起須按月償還本金。\n(二)攻讀博士學位者貸款期限最長 16 年(含寬限期 5 年)，第 6 年起須按月償還本金，利息補助 10 年，第 11 年起須按月攤還本金及利息。\n(三)寬限期係指無須償還貸款本金，僅需償還利息之期間，自第一次撥貸之撥款日起算。","u":"臺北市政府青年局","h":348,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EF1696B7BA6B0079","d":"2024-05-27","sid":"EF1696B7"},{"q":"如何找青年實習職缺？","a":"請至本局官網「臺北青年職涯發展中心」項下，進入職場體驗實習，亦可洽詢：臺北青年職涯發展中心，電話：02-23958567。","u":"臺北市政府青年局","h":346,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4E5551F503C50378","d":"2024-05-24","sid":"4E5551F5"},{"q":"青年留貸是否有免息補助?如何計息？","a":"(一)青年留貸前 10 年之利息由臺北市政府青年局依規定給予全額補助或半額補助。\n(二)青年局局應自申請人第一次撥貸日之次年開始，每年七月定期查核申請人或申報申請人為受扶養人之納稅義務人經稅捐稽徵機關核定之最近一年綜合所得稅稅率，其稅率為百分之三十以上者，申請人自查核當年七月一日起之利息均不予補助。\n(二)青年留貸所稱之利息，係以郵政儲金 1 年期定期儲蓄存款機動利率為指標利率，加碼計算後浮動計息；其加碼後之利率由教育局公告之；加碼數由青年局局適時檢討調整。","u":"臺北市政府青年局","h":335,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9A42947B9A2D2282","d":"2024-05-27","sid":"9A42947B"},{"q":"申請人因修讀本貸款之碩、博士學位或專技證照，出境 2 年以上經戶政事務所逕為遷出與主動遷出國外者是否違反「本辦法第十九條第一項第八款」之規定?","a":"本辦法第十九條第一項第八款所稱之情形，係指申請人於利息補助受領期間主動將戶籍遷出本市，或申請人因就學、就業、定居、遊學等因素，於利息補助受領期間出境 2 年以上經戶政事務所逕為遷出；惟因修讀本貸款核定之碩、博士學位或專技證照，出境 2 年以上經戶政事務所逕為遷出者，不在此限。但申請人因修讀本貸款之碩、博士學位或專技證照，出境 2 年以上經戶政事務所逕為遷出者，於畢業、完成技術訓練或取證之次日起 3 個月內，應將戶籍遷入本市並將戶籍謄本主動繳交至承貸銀行，逾期即視為有本辦法第十九條第一項第八款所稱之戶籍遷出本市情形。","u":"臺北市政府青年局","h":334,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=82BB77E0174EF47E","d":"2024-05-27","sid":"82BB77E0"},{"q":"申請人已取得入學許可但正式入學前需先就讀語言訓練課程者，或欠缺財力證明者者，得否申請青年留貸？","a":"(一)如碩、博士學位入學許可明定須先就讀該校語言課程或通過語言測驗方可就讀，係屬為有條件式入學，需俟通過語言課程並正式入學者，始可提出申請。\n(二)如欠缺財力證明者，持有該校「原則同意入學證明」(conditional offer)，即可申請青年留貸。","u":"臺北市政府青年局","h":328,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F25D931AE296376B","d":"2024-05-27","sid":"F25D931A"},{"q":"臺北市辦理「希望專案─青年留學免息貸款方案」之目的為何？","a":"臺北市為協助青年克服經濟困難，赴海外深造，以拓展國際視野，增進學能，於 100 年 6 月 1 日起推動「希望專案-青年留學免息貸款方案」，希從青年人踏出學校，到進入職場、走進婚姻、組織家庭，臺北市都能提供妥適的照顧方案，透過政府與市民的努力，讓青年夢想起飛，逐夢踏實。","u":"臺北市政府青年局","h":327,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=80469F2EBDDD10B0","d":"2024-05-27","sid":"80469F2E"}]},{"org":"公務人員訓練處","total":73,"items":[{"q":"在臺北e大取得的學習時數,是否可以登錄為公務人員終身學習時數?","a":"臺北 e 大為臺北市政府公務人員訓練處（以下簡稱公訓處）負責經營之線上學習網站，依據「行政院及所屬機關學校推動公務人員終身學習實施要點」（直轄市政府得準用之）第三點規定，公訓處係為該要點所稱之學習機關，故由臺北e大所核發之學習時數可以登錄為公務人員終身學習時數（核發單位註記為「臺北市政府公務人員訓練處」）。您需要在臺北e大＞研習時數核發設定＞設定上傳至指定網站（如公務人員終身學習網）後，當您完成課程，臺北e大會批次將認證時數上傳到公務人員終身學習網。您可以於7個工作日後至該學習網查詢您的認證時數登錄情形。\n新手上路網址：https://elearning.taipei/mpage/home/view_page/372","u":"臺北市政府公務人員訓練處","h":36996,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6D06E29AA2D8FCBF","d":"2010-11-22","sid":"6D06E29A"},{"q":"臺北e大目前有哪些線上課程?","a":"臺北e大目前計有公務、語言、資訊、管理、人文、職訓等六大類課程，以便利學員查詢。\n詳細課程資訊請上臺北e大網站https://elearning.taipei/\n一、公務類：法制知能、專業職能。\n二、語言類：生活實用、職場應用、認證檢定。\n三、資訊類：資訊概論、軟體應用。\n四、管理類：組織經營、管理機能、個人發展、公共議題。\n五、人文類：家庭教育、人文藝術、法律理財、生命教育、自然科普、醫療保健。\n六、職訓類：修護課程、餐飲製作、家政美容。","u":"臺北市政府公務人員訓練處","h":28015,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B6B8468C1A307E64","d":"2010-11-22","sid":"B6B8468C"},{"q":"無法登入會員？","a":"臺北e大目前有台北通及ｅ大帳號共2種會員登入方式，說明如下：\n1、台北通帳號\n(1)如欲申請註冊臺北e大會員，申請人應提供本人正確個人資料(包含身份證字號)，以免影響權益或相關學習紀錄。\n(2)由於臺北e大的會員資料是儲存於「臺北通」，故當您要加入會員、填寫身分證字號、忘記帳號密碼或修改個人資料等相關帳密問題，須請您電洽臺北通，並請您與客服人員說明您的帳號狀態為何，以協助您將此故障問題排除。\n(3)臺北通聯絡資訊\nA.電話：1999(外縣市請撥 02-27208889)轉分機8585\nB.信箱：taipeipass@gov.taipei\nC.網址：https://id.taipei/tpcd/\n2、e大帳號登入及忘記密碼問題\n客服電話：02-29320212轉分機341／pstcservice@gov.taipei","u":"臺北市政府公務人員訓練處","h":25277,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=16B3312C6ACCFD81","d":"2010-11-22","sid":"16B3312C"},{"q":"研習期間如何請假，是否有一定之時數限制？","a":"1、研習期間因故請假者，依本處｢學員研習注意事項｣之差勤管理規定，須至學員線上請假系統完成「線上請假」並刷退後始得離開本處。\n2、後續請自行回機關修改假別（至差勤系統取消公假並更改假別）。\n3、本處於結訓後將勤惰紀錄送請機關訓練業務承辦人列入差假登記。\n4、請假時數逾實體課程總時數1/5時（若研習班期另有特殊規定則依其規定），應予退訓。\n5、「學員線上請假系統」請連結至本處網站-「實體班期」-「實體課程學員服務網」-線上請假登錄。","u":"臺北市政府公務人員訓練處","h":16099,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=17D2D8C1F97DB6E2","d":"2015-05-26","sid":"17D2D8C1"},{"q":"如何聯繫臺北e大客服?","a":"A.撥打客服中心專線 (02)2932-0212分機341，將有專人為您服務(週一至週五，8:30~17:30，中午時間12:00至13:30請利用語音留言或客服信箱pstcservice@gov.taipei)。\nB.於臺北e大首頁右上方點選客服中心，留下您的問題及聯絡方式等相關資訊，客服人員將儘速採電子郵件回復您的問題。","u":"臺北市政府公務人員訓練處","h":15791,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=82560F716AEAC6F9","d":"2010-06-23","sid":"82560F71"},{"q":"加入臺北e大會員是否需要付費?不加入會員能否看到課程?","a":"1、加入會員完全免費。\n2、臺北e大於100年7月1日起開辦無需加入會員即可［直接觀看］課程的服務，大部分的課程都有此功能。提醒您，［直接觀看］並不會記錄您的學習進度，若您需要［認證時數］，請先加入會員，並完成課程報名，再至［我的課程］閱讀，課程達成後，方可取得時數認證。","u":"臺北市政府公務人員訓練處","h":14694,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7A3BF8F7BC02DC9F","d":"2010-11-22","sid":"7A3BF8F7"},{"q":"學員如何查詢或列印課表及名冊？","a":"請登入臺北e大網站-輸入臺北通帳號及密碼-點選上方「我的課程」-「實體班期專區」-「29學員專區」-「29B班期錄取列表」或「29E學員上課紀錄」進行查詢。","u":"臺北市政府公務人員訓練處","h":14291,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B8494DEF6D0C60A4","d":"2012-11-20","sid":"B8494DEF"},{"q":"公務人員訓練處平時是否有提供停車位？","a":"機車：本處內設有學員機車停放區。 汽車：本處正門口前停管處委外(計次)收費停車場「萬芳八號公園停車場」。 汽、機車停車位有限，為避免停車困擾，請多搭乘大眾交通工具至本處上課。 請點選交通指引","u":"臺北市政府公務人員訓練處","h":14287,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=58EC60F730C98ED9","d":"2008-06-04","sid":"58EC60F7"},{"q":"機關訓練業務承辦人可以查詢機關同仁的受訓紀錄嗎？","a":"可以，請訓練業務承辦人登入「實體班期人事人員登入系統」-登錄貴局（處）帳號及密碼-點選左側「人事管理介面」-點選「28E機關參訓學員學習紀錄」-鍵入姓名作查詢。","u":"臺北市政府公務人員訓練處","h":13852,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=71E0DB9656FD2052","d":"2015-05-26","sid":"71E0DB96"},{"q":"參訓異動原則＿基層主管班","a":"依公務人員陞遷法等相關法令及「行政院及所屬各機關初任各官等主管職務人員管理才能發展訓練實施計畫」，規定初任各官等主管職務1年內由各主管機關調訓之。 另於初任各官等主管職務前後 1年內，曾參加相當官職等主管人員之培育訓練並持有結業證明者，視同完成本項訓練。 為配合本府各機關學校初任主管人員陞任主管職務1年內完成管理才能發展訓練，爰建立參訓異動機制如下： 1.依人事處列管初任主管人員名冊於1年內辦理調訓完畢，並不開放線上異動取消作業。 2.經調訓後未能如期參訓者或於1年內無法完成參訓者，請機關應主動商請公訓處協助於妥適時間排入調訓，並填具異動表傳真至教務組，Fax:2932-3334。 3.若有特殊原因未能參訓者，請該機關敘明未能參訓之事由專案簽陳市長，簽奉核可後函知人事處及本處取消列管受訓名冊。","u":"臺北市政府公務人員訓練處","h":13175,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=909AEEEF05045B6B","d":"2015-05-26","sid":"909AEEEF"},{"q":"學員身分證字號錯誤應如何修改？","a":"1、學員尚無上課紀錄：訓練業務承辦人於28C報名作業新增錯誤個資時，可逕至28B學員基本資料，將錯誤資料勾選刪除，再重新建置。\n2、學員已有上課紀錄：已有上課紀錄或已結訓之學員，已無法修改身分證字號，敬請電洽本處客服中心29320212#341協助辦理。","u":"臺北市政府公務人員訓練處","h":12885,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=463873502ABF74BA","d":"2015-05-26","sid":"46387350"},{"q":"臺北e大實體班期專區相容之瀏覽器為何？","a":"1、臺北e大－實體班期作業專區以chrome瀏覽器開啟為原則，如有跑版情形請改用edge瀏覽器。\n2、臺北市政府員工亦可由「TAIPEION」-「共通性作業」-「臺北e大」-「我的課程」進入實體班期專區。","u":"臺北市政府公務人員訓練處","h":12687,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=779381D49DB399F0","d":"2015-05-26","sid":"779381D4"},{"q":"機關訓練業務承辦人如何進行局處線上報名？","a":"請訓練業務承辦人登入「 公訓處實體班期人事登入系統 」-「登錄貴局（處）帳號及密碼」-點選左側「28人事管理介面」-「28C報名作業（機關人事）-輸入班期代碼或班期名稱查詢後-點選該班代碼-輸入機關同仁資料-點選【確認】進行線上報名。","u":"臺北市政府公務人員訓練處","h":12625,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7D045ACB6AD6CECE","d":"2015-05-26","sid":"7D045ACB"},{"q":"調訓後若不克前來參訓，該如何處理？","a":"1、報名參訓係經首長同意，如因故無法受訓者，至遲應於開課前一工作日辦妥異動手續，並請單位訓練業務承辦人進行線上異動作業。 2、未報到者不另行通知，結訓後於研習紀錄登錄「未報到」發文至服務機關處理。","u":"臺北市政府公務人員訓練處","h":12440,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F960FC492C4BC176","d":"2015-05-26","sid":"F960FC49"},{"q":"何時會收到公務人員訓練處所開辦之語言自費班期上課通知？","a":"上課通知將於每期開課前適時以電子郵件方式通知學員，並歡迎來電詢問。","u":"臺北市政府公務人員訓練處","h":12359,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A4440477A9925C53","d":"2008-06-04","sid":"A4440477"},{"q":"於臺北e大選課後,多久可以上課?","a":"登入臺北e大於選課中心完成選課後，點選我的課程選項即可上課。","u":"臺北市政府公務人員訓練處","h":12275,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B1A1906E1D91B743","d":"2010-11-22","sid":"B1A1906E"},{"q":"如何申請使用公務人員訓練處場地？","a":"請參閱本處網站--顧客服務--\n場地租借","u":"臺北市政府公務人員訓練處","h":12241,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5231F7E8F39DDFF2","d":"2008-05-28","sid":"5231F7E8"},{"q":"請問個人可以租借公務人員訓練處場地嗎？","a":"目前場地外借服務對象為機關、學校、團體，並以本府所屬機關學校為優先。","u":"臺北市政府公務人員訓練處","h":12104,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B6746F7B2A02D021","d":"2008-05-28","sid":"B6746F7B"},{"q":"為什麼我進入臺北e大後會轉至”研習時數認證”設定頁面？","a":"(1)因您尚未完成研習時數設定，若您為公務人員需上傳認證時數請您先填寫資料，以免因沒有輸入單位資料而延遲時數的上傳影響您的權益。\n(2)若您為第一次登入的一般使用者請設定「不需要」後點擊「確認資料」。","u":"臺北市政府公務人員訓練處","h":12052,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=46F539292EE3C173","d":"2015-05-26","sid":"46F53929"},{"q":"受訓期間是否有提供用餐？","a":"1、課程若為全天或上午半天之班期本處提供午餐。\n2、課程若為下午半天之班期，無提供午餐。","u":"臺北市政府公務人員訓練處","h":11669,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FCD67E4F62E3D338","d":"2015-05-26","sid":"FCD67E4F"},{"q":"機關訓練業務承辦人於報名後可以取消嗎？","a":"1、班期報名截止前：\n機關訓練業務承辦人登入「公訓處實體班期人事登入系統」-登錄貴局（處）帳號及密碼-點選左側「28人事管理介面」-「28C報名作業（機關人事）-輸入班期代碼或班期名稱查詢後-點選該班代碼-將欲取消報名人員點選【取消報名】即可。\n2、班期報名已截止：\n請訓練業務承辦人於收到調訓通知Email後，再行辦理取消參訓作業。若有特殊需求亦可電洽班期承辦人詢問。","u":"臺北市政府公務人員訓練處","h":11527,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B77E98E61D922A0E","d":"2015-05-26","sid":"B77E98E6"},{"q":"若是錄取後無法來上課或者未報到者，往後是否可以再參加相同的班期？","a":"目前仍可報名相同的班期，未有停權處分，然為避免訓練資源浪費，請儘量參加或最慢於開課前一工作日請貴機關訓練業務承辦人逕至－公訓處實體班期人事登錄系統登錄學員異動作業。","u":"臺北市政府公務人員訓練處","h":11477,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F638474042382B55","d":"2015-05-26","sid":"F6384740"},{"q":"學員如何得知報名已錄取及上課訊息？","a":"1、各班期於開課前會寄送Email調訓通知予學員，請學員多加留意。\n2、研習通知同時發送予機關訓練業務承辦人轉知參訓學員，俾辦理公假事宜。\n3、課前如未收到Email通知，可能係公務信箱有誤，須請機關訓練業務承辦人逕至「WebHR人力資源管理系統」修正可正常收信之公務信箱。\n4、學員亦可至臺北e大－實體班期專區－29學員專區－29A鍵入私人外部信箱，避免漏收訊息。\n5、開課前可至臺北e大網站-登入後點選上方我的課程-「實體班期專區-「29學員專區」-「29B班期錄取列表」或「29E學員上課紀錄」查詢課程訊息。","u":"臺北市政府公務人員訓練處","h":11325,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8BA40B418BA3A144","d":"2015-05-26","sid":"8BA40B41"},{"q":"任何人皆能線上報名平日公假班期嗎？","a":"並非任何人皆能進行線上報名，僅能透過北市府各機關訓練業務承辦人線上報名。\n請欲參加平日公假班之同仁（服務於臺北市政府人員）向機關訓練業務承辦人提報參訓需求，經簽准後再統一由訓練業務承辦人至「公訓處實體班期人事登入系統」-「人事管理介面」-「28C報名作業」進行線上報名。","u":"臺北市政府公務人員訓練處","h":11178,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B7D9401FF1894D16","d":"2015-05-26","sid":"B7D9401F"},{"q":"如何得知機關同仁報名是否錄取？","a":"請訓練業務承辦人登入「實體班期人事人員登入系統」-登錄貴局（處）帳號及密碼-點選左側「人事管理介面」-點選「28G班期學員錄取、未錄取名單」-輸入班期名稱-錄取狀態選擇「錄取名冊」-查詢後點選「錄取名冊」作查詢。","u":"臺北市政府公務人員訓練處","h":11066,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6F6D72BC60034F66","d":"2015-05-26","sid":"6F6D72BC"}]},{"org":"殯葬管理處","total":68,"items":[{"q":"臺北市神主牌位寄存如何申請？目前之規費標準各為何？","a":"A 申請人檢具下列證件，向欲寄存之市立骨灰（骸）存放設施或臺北市殯葬管理處懷愛館服務中心辦理：\n1、死亡者除戶謄本可至戶政事務所申請1份 。\n2、申請人身分證 。\n臺北市市立骨灰（骸）存放設施之神主牌位使用規費，按死亡者往生時設籍地區分如下：\n★ 富德靈骨樓：\n1 神主牌位寄存死亡者戶籍為本市者1位收費新臺幣1萬元；非設籍本市者3倍收費 。\n2.使用年限為 50 年。\n★ 陽明山臻愛樓：\n1 神主牌位寄存：限設籍本市之死亡者使用，收費為新臺幣2萬元，申請使用109年9月以後新設置之神主牌位區，其使用費依前述金額1.8 倍收費 。\n2.使用年限為 50 年。\n3.設籍本市北投區林泉里、泉源里（ 2 鄰、 4 鄰 ~16 鄰）、永和里（ 1 鄰 ~19 鄰） 2年以上之死亡者，按 1/5 收費 。\n4 設籍本市北投區泉源里（ 1 、 3 鄰）、永和里（ 20 鄰 ~24 鄰）、中心里 2 年以上之死亡 者 ，減半收費。","u":"臺北市殯葬管理處","h":45131,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C1BDD6004F197277","d":"2023-01-18","sid":"C1BDD600"},{"q":"如何前往臺北市懷愛館及陽明山、富德靈骨樓〈塔〉？","a":"臺北市懷愛館交通資訊如下：\n免費懷恩專車：每日上午6時45起至下午6時10分止，每隔10～20分鐘發車，敬請民眾多加利用。\n接駁停靠處：\nS31免費懷恩專車：捷運松山新店線-公館站(3號出口)。\nS32免費懷恩專車：捷運文湖線-六張犂站(基隆路2段國軍人才招募中心前)。\nS33免費懷恩專車：捷運板南/文湖線-忠孝復興站(2號出口)、捷運文湖線-科技大樓站、大安高工站(捷運信義線-大安站5號出口斜對面大安高工)；115年2月1日起新增捷運松山新店/文湖線-南京復興站(8號出口左轉直行，復興北路164號前站牌)。\nS34免費懷恩專車：捷運中和新蘆/松山新店線-古亭站(和平)。\n陽明山靈骨塔、臻愛樓 交通資訊如下：\n捷運淡水線石牌站，轉公車508至惇敘高工，下車步行約20分鐘\n富德靈骨塔交通資訊如下：\n山區小型12路公車→富德靈骨樓（樹葬區）","u":"臺北市殯葬管理處","h":34327,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E48197B016CAD84E","d":"2021-08-04","sid":"E48197B0"},{"q":"請問遺體火化至撿骨需要多久時間？","a":"火化時間約需90分鐘,依大體實際情形略有增減,冷卻及整理約需15分鐘。","u":"臺北市殯葬管理處","h":23753,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D375B2D5058D3398","d":"2016-05-06","sid":"D375B2D5"},{"q":"請問如何申請樹、花葬？","a":"一、本市多元環保葬自115年4月20日起已改採「線上預約平台」辦理。為確保本處樹、花葬申請系統資料庫有效勾稽亡者與其家屬關聯，無論是家屬親自上網或委由業者代為操作，線上系統填寫之「申請人」欄位，皆應為亡者家屬資料。\n二、欲提出申請本事環保葬，請至 臺北市多元環保葬線上預約平台 註冊帳號申辦。\n三、詳細申辦對象、適用管道與操作流程，請參閱本處官網最新消息公告： 【115年4月20日起「多元環保葬」預約新制上線，申辦對象及管道調整須知】","u":"臺北市殯葬管理處","h":22943,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=23D3052E9D85EF20","d":"2011-11-07","sid":"23D3052E"},{"q":"臺北市骨灰（骸）寄存如何申請？目前之規費標準各為何？","a":"一、申請人填寫申請書並檢具身分證影本（正本驗退，影本留存）及亡者除戶謄本1份及下列證件之一，向欲寄存之市立骨灰（骸）存放設施或臺北市殯葬管理處懷愛館服務中心辦理：\n1.火化許可證。\n2.墓政管理單位出具之起掘許可證明。\n3.原寄存寺廟出具之骨灰（骸）寄存遷出證明。國外運回之骨灰（骸），應檢具死亡地權責單位出具之火化許可證明（含翻譯本）、（大陸運回之骨灰（骸）須經海基（協）會驗證）。\n二、臺北市市立骨灰（骸）存放設施使用規費，按亡者往生時設籍地區分如下：\n★富德靈骨樓及陽明山靈骨塔：\n1.骨灰罐寄存：戶籍為本市者新臺幣1萬元；外縣市者新臺幣3萬元。\n2.撿骨罈寄存：戶籍為本市者新臺幣3萬元；外縣市者新臺幣9萬元。\n3.亡者戶籍為各縣市政府列冊之低收入戶者，免費寄存。\n★陽明山臻愛樓：\n骨灰罐寄存：限設籍本市之亡者使用，各樓層第3至第7層收費為6萬元，其餘各層收費為5萬元。\n設籍本市北投區林泉里、泉源里（2鄰、4鄰~16鄰）、永和里（1鄰~19鄰）2年以上之往生者以2折收費。\n設籍本市北投區泉源里（1、3鄰）、永和里（20鄰~24鄰）、中心里2年以上之往生者以5折收費。","u":"臺北市殯葬管理處","h":21770,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD93C0C9C70792BA","d":"2011-11-07","sid":"CD93C0C9"},{"q":"人往生後，家屬如何處理遺體？","a":"Q：人往生後，家屬如何處理遺體？\nA：家屬可先與委託之殯儀業者連繫。若未委託業者辦理後事，則可至臺北市懷愛館填寫「 臺北市殯葬管理處殯葬設施使用申請書 」申請接運遺體，接運遺體之相關規定如下： （一）上班時段需取得死亡證明或檢察署相驗屍體証明書之正本文件始得申請派車接運遺體至本處冰存（大體接運專線87329762）。 （二）如無法立即取得死亡證明或檢察署相驗遺體證明書文件，可依下列方式辦理：\n（三）遺體進館後，家屬再辦理治喪事宜，如做七、唸經、決定土葬或火葬、選擇墓地或靈骨樓塔、決定出殯日期、訂禮堂、訂火化爐、申請埋（火）葬許可證、印訃聞．．等。","u":"臺北市殯葬管理處","h":17728,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C2AC91627A875333","d":"2015-09-24","sid":"C2AC9162"},{"q":"親友死亡後，家屬如何辦理身後事？","a":"家屬可先與委託之殯儀業者連繫。若未委託業者辦理後事，則可先以電話申請接運遺體，接運遺體之相關規定如下：\n1. 上班時段需取得死亡證明或檢察署相驗屍體證明書之正本文件，始得申請派車接運遺體至本處冰存（大體接運專線：02-87329762、02-87329686 後按0或分機29762）。\n2. 如在下班後及例假日無法立即取得死亡證明或檢察署相驗遺體證明書文件，可依下列方式辦理：","u":"臺北市殯葬管理處","h":17288,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FC5B6A9F7D31A3F5","d":"2015-09-24","sid":"FC5B6A9F"},{"q":"可透過何途逕捐款給臺北市殯葬管理處？","a":"如對本處公共事務關心並有意捐款，本處提供聯合奠祭捐款帳戶：\n「戶名：臺北市殯葬管理處，帳號：14874689」供劃撥。\n或使用本網站「 線上信用卡捐款 」功能。","u":"臺北市殯葬管理處","h":13128,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8234038CFA8E9649","d":"2011-11-07","sid":"8234038C"},{"q":"遺體冷藏費用如何計算？","a":"設籍本市者：\n7日以下者，不收費。\n8日至12日者，按表收費。\n逾12日者，除前12日按表收費每日400元外，自第13日起每日為800元。\n非設籍本市者：\n7日以下者，減半收費；8日至12 日者，按表收費。\n逾12日者，除前12日按表收費每日800元外，自第13日起每日為 1,600元。","u":"臺北市殯葬管理處","h":11147,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=799E877E3825B8F6","d":"2015-09-24","sid":"799E877E"},{"q":"違法濫葬的處理","a":"違反殯葬管理條例第71條第1項的規定，將依殯葬管理條例第99條，命墓主限期改善(即回復為原墳墓面積或高度)，屆期仍未改善者，處新臺幣六萬元以上三十萬元以下罰鍰，超過面積或高度達一倍以上者，按其倍數處罰。\n本市目前查獲較頻繁違法濫葬地區：","u":"臺北市殯葬管理處","h":10416,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4606A8CCA2F1C205","d":"2016-05-06","sid":"4606A8CC"},{"q":"臺北市目前有幾處公立靈骨樓（塔）？位置各在哪裡？","a":"臺北市目前有3處公立靈骨樓（塔），各所在位置如下:\n(1)富德靈骨樓：位於富德公墓內，地址：文山區木柵路5段190號。電話(02)87329686轉36001~36005。\n(2)陽明山靈骨塔：位於北投區陽明山第一公墓內，地址：北投區泉源路220號。電話(02)87329686轉33001。\n(3)陽明山臻愛樓：位於北投區陽明山第一公墓內，地址：北投區泉源路220號。電話(02)87329686轉31001~31004。","u":"臺北市殯葬管理處","h":10224,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7C2065DE2AC30ACC","d":"2011-11-07","sid":"7C2065DE"},{"q":"何謂聯合奠祭？提供那些免費服務項目？申請必備證件為何？","a":"請點連結閱讀「 參加聯合奠祭 」相關內容。","u":"臺北市殯葬管理處","h":9520,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=652EA562C7703187","d":"2011-11-07","sid":"652EA562"},{"q":"遺體可否土葬？要如何辦理？","a":"本市全面禁止土葬，除死亡者為本市市民外，得申請使用富德公墓墓基埋葬遺體（墓基使用年限為7年，另陽明山第一公墓僅限民國70年以前申請預留有案壽穴始得使用）。申請應檢附下列文件，至富德公墓辦公室（電話：87329686轉35001~3，傳真：27882421）辦理；陽明山第一公墓辦公室（電話： 87329686轉3 3001，傳真：28950531）辦理，約需2天工作日：\n1. 墓地使用申請書。\n2. 死亡證明書或相驗屍體證明書2份。\n3. 死亡者之除戶謄本。\n4. 預定墓基之照片。\n5. 墳墓施工圖。\n6. 申請人身分證明文件。\n7. 委託申辦者，需附業者公會識別證影本、身分證明文件及委託書1份。\n備註：\n1. 受理郵寄申請案件經審核必備文件無誤後，聯繫申請人勘定墓位，並依規定繳費。\n2. 陽明山第一公墓僅限預留有案壽穴始得申請使用。","u":"臺北市殯葬管理處","h":8672,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=29EDF182196CA94B","d":"2016-05-06","sid":"29EDF182"},{"q":"臺北市目前有幾處寺廟興辦合法靈骨樓（塔）？位置各在哪裡？","a":"目前本市得繼續使用之寺院、宮廟及宗教團體所屬公墓、骨灰(骸)存放設施有36處，其設施所在地位置如附件。","u":"臺北市殯葬管理處","h":7861,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6C5FD1CFCF198DEE","d":"2024-12-06","sid":"6C5FD1CF"},{"q":"臺北市目前可供埋葬之墓地有幾處？位置在哪裡？相關申請規定為何?","a":"臺北市目前僅有富德公墓可供往生市民埋葬，其位置係界於木柵、南港邊界山坡地（地址:臺北市文山區木柵路4段159巷130號），富德公墓現採7年輪葬制；另陽明山第一公墓僅限預留有案壽穴始得申請使用。\n申請應檢附下列文件，至富德公墓辦公室（電話：87329686轉35001，傳真：27882421）；陽明山第一公墓辦公室（電話：87329686轉33001，傳真：28950531）辦理，約需2天工作日：\n1.墓地使用申請書。\n2.死亡證明書或相驗屍體證明書2份。\n3.死亡者之除戶戶籍謄本。\n4.預定墓基之照片。\n5.墳墓施工圖。\n6.申請人身分證明文件。\n7.委託申辦者，需附業者公會識別證影本、身分證明文件及委託書1份。\n備註：\n1.受理郵寄申請案件經審核必備文件無誤後，聯繫申請人勘定墓位，並依規定繳費。\n2.陽明山第一公墓僅限預留有案壽穴始得申請使用。\n目前之墓地規費標準如下：\n二坪：77,000元。\n四坪：221,700元。","u":"臺北市殯葬管理處","h":7665,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BBE05C440F328D43","d":"2011-11-07","sid":"BBE05C44"},{"q":"富德及陽明山靈骨樓(塔)骨灰罐(罈)位滿位，如何申請候補？","a":"富德靈骨樓及陽明山靈骨塔骨灰罐位及撿骨罈位均已滿位，如欲申請排隊候補，須檢具申請人身分證影本及亡者死亡相關證明文件，至富德靈骨樓或陽明山靈骨塔辦公室辦理。","u":"臺北市殯葬管理處","h":7348,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E334B180D06D82FD","d":"2016-05-06","sid":"E334B180"},{"q":"本市低收入戶（中低收入戶）辦理喪葬事宜，需要多少費用？","a":"亡者為本市低收入戶者，除公墓使用費外，殯儀館各項設施使用費及公立靈骨樓塔位費用全免，惟遺體寄存及骨灰暫厝以30日為限。中低收入戶者，除公墓使用費外，使用殯儀館各項設施及公立靈骨樓塔位，均享減半收費。","u":"臺北市殯葬管理處","h":7311,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=50CA379C7380DF21","d":"2011-11-07","sid":"50CA379C"},{"q":"生前欲指定朋友辦理身後事之手續？","a":"依臺北市市立殯葬設施使用管理辦法第5條之規定：「申請使用殯儀館、禮廳或火化場者，應符合下列條件之一：一、死亡者之親屬或生前以遺囑指定為其辦理喪葬事宜之人。……。」故若欲將後事交由無親屬關係者辦理，建請亡者於生前預立遺囑指定身故後之喪葬事宜辦理人，並建議將遺囑交由法院公證。如未預立遺囑，尚需經本處函詢戶政及警政機關確認無親屬，或雖有親屬而不願為亡者辦理喪葬事宜時，始得辦理。","u":"臺北市殯葬管理處","h":7001,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9908855F5F6EE690","d":"2017-08-04","sid":"9908855F"},{"q":"如何申請多元環保葬鼓勵金？","a":"◆申請對象及方式：\n◆ 多元環保葬鼓勵金金額如下：\n◆ 應備文件：","u":"臺北市殯葬管理處","h":6349,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C6E202605CD7FDBA","d":"2017-08-04","sid":"C6E20260"},{"q":"非本市市民可以申請樹、花葬嗎？","a":"樹、花葬之申請不受受葬者設籍臺北市或其他縣市之限制，均可申請。","u":"臺北市殯葬管理處","h":6265,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2B71989DF5CAF498","d":"2011-11-07","sid":"2B71989D"},{"q":"請問參加樹、花葬需要繳交費用嗎？","a":"1.亡者設籍本市者，或自本市富德靈骨樓、陽明山靈骨塔或陽明山臻愛樓遷出者，免收費用。\n2.亡者非設籍本市者，收費新臺幣6,000元。\n3.符合下列任一情形者，不論亡者設籍本市或非本市，免收費用:\n(1) 埋葬於本市之墳墓，起掘後使用本市環保葬區者。\n(2) 非設籍本市之低收入户或中低收入户者。\n(3) 重大災害罹難者。\n(4) 具急難救助需求者。\n(5) 殉職警察、義勇警察、民防人員、消防人員、義勇消防人員或其他依法令從事於公務之人員。","u":"臺北市殯葬管理處","h":5757,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6DEC2B19B8217385","d":"2011-11-07","sid":"6DEC2B19"},{"q":"請問如何申請海葬？","a":"(1)申請資格：海葬報名資格不限國籍及戶籍。\n(2)檢附文件：","u":"臺北市殯葬管理處","h":5546,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AB9FDB7F1939E04D","d":"2015-09-24","sid":"AB9FDB7F"},{"q":"一櫃多罐收費基準為何？","a":"第一罐依「臺北市市立殯葬設施及服務收費基準表」收費，使用第二罐以上，每罐按櫃位原價1/4收費。申請人應於申請許可後3日內繳納使用費，逾期未繳納者，許可處分失其效力。繳納使用費後應於3個月內存放骨灰，逾期未存放者，得廢止其許可處分，並就已繳納之使用費扣除10分之1後退還。","u":"臺北市殯葬管理處","h":5307,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=05CA223E849B15C5","d":"2017-08-04","sid":"05CA223E"},{"q":"請問7日內火化之優免措施為何？","a":"設籍本市死亡者，自死亡次日起7日內完成火化，使用本市火化爐規費新臺幣2,000元全免；設籍外縣市死亡者，火化爐規費由原新臺幣6,000元減半為新臺幣3,000元。","u":"臺北市殯葬管理處","h":5176,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=33D66D1644B88547","d":"2015-09-24","sid":"33D66D16"},{"q":"亡者子女屬大陸居民且在台無其他親屬，朋友能協助辦理身後事嗎？","a":"需提供亡者在臺無親屬相關證明文件，否則仍需經本處函詢戶政及警政機關確認該亡者在臺無親屬，或雖有親屬而不願為亡者辦理喪葬事宜時，臺灣友人始得辦理。","u":"臺北市殯葬管理處","h":5052,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=44B9E7A47F08B299","d":"2011-11-07","sid":"44B9E7A4"}]},{"org":"都市發展局","total":66,"items":[{"q":"115年度300億中央擴大租金補貼撥款期程暨婚育加碼新規定問答集","a":"Q1 ：115年中央300億中央擴大租金補貼撥款時間\nA1：有關今年度上半年租金補貼撥款期程，內政部國土管理署規劃於1月2日、1月9日、1月16日、2月3日、2月12日、3月3日、3月17日、4月2日、4月17日、4月30日、5月15日、6月3日、6月18日、7月3日及7月17日撥款。\nA2：有關今年度下半年租金補貼撥款期程，內政部國土管理署規劃於8月3日、8月18日、9月3日、9月18日、10月2日、10月16日、11月3日、11月17日、12月3日、12月18日、12月31日撥款。\nQ2 ：什麼情況會被系統「舊案帶入」申請 115 年度？\nA：符合下列任一情形者，系統將直接舊案帶入，無須重新申請：\nQ3 ：我要怎麼知道自己有沒有被舊案帶入？\nA：可透過以下方式確認：\n若查無案件編號，即尚未被帶入，請耐心等候，如仍有疑義請來電本局南門辦公室02-27772186轉0再轉1洽詢。\nQ4 ：115年度申請案審核通過後，何時可以領到補貼款?\nA：案件經核定後，國土管理署將依最近一期撥款期程，儘速撥付 115 年度租金補貼款項。\nQ5 ：115 年度申請案已審核通過，但尚未收到補貼款，可能原因為何？\nA ： 常見原因如下 ：\nQ6 ：請問「青年婚育租屋協助專案」的加碼措施是什麼?\nA1：於專案公布後，只要符合新婚或育有未成年子女條件，就能放寬申請之所得標準，即每人每月平均所得從最低生活費3倍（6萬1,137元）放寬至3.5倍（7萬1,327元）。\nA2：於專案公布後登記結婚，新婚2年內租金補貼加碼50%(即1.5倍)；有新生兒出生之家庭，育有未成年子女1人加碼提高到100%（即2倍），之後每增生育1名補貼金額再多加碼50%（即0.5倍），依此類推無上限。\nA3：於專案公布前，原育有之未成年子女數可併入加碼倍數計算。\n例如:原育有2名未成年子女，於專案公布後，即115年1月1日起，再生育1名新生兒，未成年子女數計為3名，可依原補貼金額加碼3倍(2+0.5+0.5)。\nQ7 ：我已經是115年度租金補貼核定戶,於補貼期間符合上開婚育專案條件，我該如何取得新加碼資格的補貼呢?\nA：","u":"臺北市政府都市發展局","h":39478,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=90E56FB034F55888","d":"2025-12-26","sid":"90E56FB0"},{"q":"地形圖、影像圖、空照圖、航照圖與航測圖有何不同？","a":"答：","u":"臺北市政府都市發展局","h":26372,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=495C21F32C3CFABA","d":"2008-05-13","sid":"495C21F3"},{"q":"社子島地區開發目前都市計劃規劃進度如何？","a":"社子島地區依99年5月行政院之核定防洪計畫，全區採高保護方式，區內人居地須填土至8.15公尺高程，導致整體填土量高達1,625萬方、開發期程長達13年，耗費高額時間、經費成本，卻仍不符民眾之期待，同時致使整體環評、區段徵收作業進度緩慢。本地區基於「加速發展、儘早解禁」之辦理原則，全區採高保護方式與200年防洪頻率，維持既有高程採不填土，島內以挖填平衡為原則，降低填土土方來源，設置兼具滯洪功能之生態濕地公園，檢討現行區段徵收開發分期分區開發及區外安置之可行性，以改善當地公共環境，並以海綿城市及田園城市為發展概念，推動還地於河、創造水岸城市等理念，作為本市復興水岸的最佳示範區。\n105年2月27、28日舉辦社子島地區i-Voting作業，並已由多數社子島居民選定以『生態社子島』為未來開發方向，本局業以『生態社子島』為基礎，分別於105年5月5日及5月26日提送本市都市計畫委員會研議並訂於105年6月6日進行區段徵收委員會之研議，本案都市計畫已於105年6月17日公告公開展覽作業，並分別於105年6月28日及7月5日舉辦公展說明會，105年7月29日、8月25日、9月18日及9月29日分別提請本市都市計畫委員會第692、694、696、697次會議審議，經697次會議決議，修正後通過，業於105年10月31日報請內政部核定。\n內政部都市計畫委員會於105年11月至107年1月共召開5次專案小組會議審議社子島案，社子島案經107年1月15日第5次專案小組審查通過，並經內政部都市計畫委員會107年6月26日審議修正通過。另配合申請剔除區段徵收範圍、文資保存等修正細部計畫案，於108年12月31日提送臺北市都市計畫委員會審議，並經市都委會109年2月27目、3月26日、4月23日三次委員會議審議修正通過。","u":"臺北市政府都市發展局","h":11529,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=38CFC0B27D1D8E39","d":"2008-05-13","sid":"38CFC0B2"},{"q":"住宅區附條件允許設置一般事務所之核准條件認定疑義？","a":"(一)第三、四種住宅區設置第二十八組：一般事務所之允許使用條件：\n1、營業樓地板面積未達一○○平方公尺者，應臨接寬度六公尺以上之道路；營業樓地板面積一○○平方公尺以上、未達五○○平方公尺者，應臨接寬度八公尺以上之道路；營業樓地板面積五○○平方公尺以上者，應臨接寬度十公尺以上之道路。\n2、臨接道路寬度六公尺以上，未達八公尺者，限於建築物直接面臨道路之第一層設置。\n3、臨接道路寬度八公尺以上者，限於其地面層以上總樓層數三分之一以下樓層設置。 但使用執照用途登載為一般事務所或自由職業事務所者，不受設置樓層之限制。 4、 既有建築物整棟各樓層均為非住宅使用，且臨接寬度六公尺以上之道路者，不受前三款規定之限制。\n(二)第三之一、三之二、四之一種住宅區設置第二十八組：一般事務所之核准條件：\n1、營業樓地板面積未達一○○平方公尺者，應臨接寬度六公尺以上之道路；營業樓地板面積一○○平方公尺以上、未達五○○平方公尺者，應臨接寬度八公尺以上之道路；營業樓地板面積五○○平方公尺以上者，應臨接寬度十公尺以上之道路。\n2、臨接道路寬度六公尺以上，未達八公尺者，限於建築物直接面臨道路之第一層設置。\n3、既有建築物整棟各樓層均為非住宅使用，且臨接寬度六公尺以上之道路者，不受前二款規定之限制。\n(三)有關住三、住四允許使用條件3之認定方式以住三為例：１地面第一層允許設置一般事務所，二樓以上樓層允許設置範圍以地面層以上總樓層數三分之一以下樓層計算，如建築物總樓層為四層，限於第一層設置，建築物總樓層為五層，限於第一、二層設置。","u":"臺北市政府都市發展局","h":8662,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E0DF09B025B367D6","d":"2008-10-17","sid":"E0DF09B0"},{"q":"臺北市古蹟、歷史建築、公共設施保留地容積移轉的算式各應該如何計算？","a":"1.公共設施保留地之算式係依「都市計畫容積移轉實施辦法」第9條規定：接受基地移入送出基地之容積，應按申請容積移轉當期各該送出基地及接受基地公告土地現值之比值計算，其計算公式如下：\n接受基地移入之容積=送出基地之土地面積×（申請容積移轉當期送出基地之公告土地現值／申請容積移轉當期接受基地之公告土地現值）×接受基地之容積率\n2.歷史建築之算式係依「都市計畫容積移轉實施辦法」第9條第2項規定：送出基地如屬第6條第1項第1款所稱都市計畫表明應予保存或經直轄市、縣（市）主管機關認定有保存價值之建築所定著之私有土地，其接受基地移入之容積，應扣除送出基地現已建築容積及基準容積之比率。其計算公式如下：\n接受基地移入之容積=第6條第1項第1款土地之接受基地移入容積＝接受基地移入之容積×（１－送出基地現已建築之容積／送出基地之基準容積）\n3.另依「古蹟土地容積移轉辦法辦理」辦理古蹟容積移轉，其算式依第8條規定如下：\n接受基地移入之容積=送出基地移出之容積×（申請容積移轉當期送出基地之毗鄰可建築土地平均公告土地現值／申請容積移轉當期接受基地之公告土地現值）。依本辦法所稱送出基地可移出容積應扣除非屬古蹟之已建築容積。","u":"臺北市政府都市發展局綜合企劃科","h":8416,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=537BAB9FC18570EB","d":"2012-05-08","sid":"537BAB9F"},{"q":"「包租代管」與「社會住宅包租代管」權責區分","a":"「包租代管」與「社會住宅包租代管」權責區分\n壹、「包租代管」：\n由 本府地政局 辦理租賃住宅服務業相關管理機制。\n貳、「 社會住宅 包租代管 」：\n社會住宅包租代管計畫係由業者開發物件、媒合房東客，由內政部委託 各地方政府、國家住宅及都市更新中心 辦理計畫，故於臺北市轄內，尚有臺北市政府都市發展局辦理縣市版案件，及國家住都中心辦理公會版案件，其所屬主管機關及業者分述如下：\n一、臺北市政府都市發展局（縣市版案件）：\n本府第5期計畫，委託業者計3家，如有租屋或出租需求，可洽服務業者瞭解；如有計畫內容欲詢問，可洽臺北市政府都市發展局詢問，聯絡方式如下：\n● 崔媽媽蝸牛租屋有限公司（電話：02-23685670；02-23683071）\n●日盈不動產仲介經紀有限公司（電話：02-66377177）\n●力群不動產經紀有限公司（電話：02-29871222）\n⯁ 管理機關都市發展局（聯絡電話：02-27772186#2502 、2522 、 2507、2910、2511）\n二、國家住宅及都市更新中心（公會版案件）：\n由國家住宅及都市更新中心辦理之「公會版」社會住宅包租代管計畫，目前第5期計畫委由12家業者開發物件媒合，聯絡方式如下：\n● 兆基屋管股份有限公司（原名：兆基管理顧問股份有限公司）（電話：02-23955522）\n● 大管家房屋管理顧問有限公司（電話：02-27317933）\n● 禾豐好宅管理顧問股份有限公司（電話：02-25475003）\n● 星鴻股份有限公司（電話：02-77552669）\n● 匯康資產管理有限公司（電話：02-66178885）\n● 聯勝開發有限公司（電話：02-25705000）\n● 五泰房屋仲介有限公司臺北分公司 （電話：0800-666-464）\n● 顧家租賃住宅服務股份有限公司 （電話：02-25238928）\n● 東昇國際管理顧問股份有限公司 （電話：02-77012996）\n● 凌群不動產有限公司 （電話：02-25506685）\n● 松信不動產有限公司 （電話：02-25471133）\n● 易居管理顧問股份有限公司 （電話：02-227","u":"臺北市政府都市發展局住宅企劃科","h":6879,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=56222B46E90075F3","d":"2024-03-18","sid":"56222B46"},{"q":"如何申請土地使用分區證明書?","a":"答：\n申請土地使用分區證明書應將土地的地段地號資料逐筆填列於申請書(申請書可至 台北服務通 下載或直接臨櫃填寫)，申辦時不需任何證件、任何人皆可申請，除非經本局認定有查證地籍資料之必要時，才需檢附最新地籍圖謄本一份。\n一、申請方式可分為以下兩種：\n1.臨櫃申請：市民可以在上班日的上午8時30分起至下午4時0分止（中午不休息）親洽本府1樓東區都市計畫工作站辦理，隨到隨辦。\n2.網路申請： 土地使用分區證明書申請網頁\n二、收費方式：土地使用分區證明書應繳納規費，其收費標準為5筆土地以內以100元計算，每超過1筆需加收20元。","u":"臺北市政府都市發展局","h":4788,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7380937724946D3B","d":"2022-09-22","sid":"73809377"},{"q":"都市計畫區內之既成道路是否可以辦理容積移轉？","a":"1.「都市計畫容積移轉實施辦法」第 6條第1項第3款明文規定，送出基地包括私有都市計畫公共設施保留地。但不包括都市計畫書規定應以區段徵收、市地重劃或其他整體開發方式取得者，或有其他可行之取得或開闢計畫者。 2.都市計畫區範圍內之既成道路，如非屬都市計畫公共設施保留地，自不符上述之規定無法辦理容積移轉。","u":"臺北市政府都市發展局綜合企劃科","h":3797,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C692ABBB2C5A4A67","d":"2012-05-08","sid":"C692ABBB"},{"q":"請問申請辦理都市計畫容積移轉流程為何？其時程需要多久？","a":"1. 本府依「都市計畫容積移轉實施辦法」及「臺北市容積移轉審查許可自治條例」申請辦理容積移轉主要程序可分為三階段說明：\n（1）第一階段書面審查：書面審查階段會在 15 日內完成，如需補件應於一定期限內完成，否則即不予受理；經補件後臺北市政府再於 15 日內完成書面審查後，送都市設計委員會進行接受基地都市設計審議。\n（2）第二階段容積代金階段：申請人經本局書面審查後，提送都市設計審議核定版報告書，由本局委託三家估價單位辦理查估。經估價單位查估後，由本局召開專案小組，檢視報告書內容，作成建議，送本局容積代金審議委員會評議，經本府核定容積代金後後，函請申請人繳納容積代金。\n（3）容積移轉許可證明核發階段：私有未徵收之公共設施保留地應在限期內完成送出基地上土地改良物、租賃契約、他項權利及限制登記等法律關係之清理，經由臺北市政府辦理會勘完成將土地產權登記予市政府，並完成繳納代金後，始得申請核發容積移轉許可證明。\n2. 有關書面審查開始至核發容積移轉許可證明期間，依目前辦理經驗約需6至8個月，惟實際仍需視個案審查進度為準。","u":"臺北市政府都市發展局綜合企劃科","h":3787,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=650B618294CD2D33","d":"2012-05-08","sid":"650B6182"},{"q":"臺北市政府「正俗專案」裁罰處罰依據、執行對象、罰鍰標準及復水復電規定為何？","a":"（一）處罰依據：\n依據「臺北市政府執行『正俗專案』停止及恢復供水電工作方案暨裁罰基準」，並依都市計畫法、臺北市都市計畫施行自治條例及臺北市土地使用分區管制自治條例等相關規定，援引都市計畫法第79條規定裁處建物使用人或所有人勒令停止違規使用、行政罰鍰及違規建物之停止供水供電處分。\n（二）執行對象：\n1. 查獲妨害風化（俗）經移送法辦案件之營業場所。\n2. 查獲負責人或從業人員，販賣、持有、提供或容留、媒介他人販賣毒品之營業場所。\n3. 查獲經營賭博性電動玩具經移送法辦案件之營業場所。 4.違法（規）提供服務生（含男、女及喬裝異性）陪侍或從事按摩之營業場所（建築物），經處以「勒令歇業」、「命令停業」、「吊銷執照」或「勒令停止使用」，拒不遵行仍繼續違規營業（使用）者。\n（三）罰鍰標準：\n1. 經查獲擺設賭博性電玩（如小瑪俐）、從事性交易、販吸毒行為，或於住宅區內違規經營特種行業（特種茶室、酒吧、酒家）、舞場等場所，採「二階段式」裁罰。\n2. 第一階段，處使用人新臺幣二十萬元罰鍰並勒令使用人、所有權人停止違規使用；第二階段則針對第一階段已處分之對象，由市府警察局逐件列管(為期兩年)進行複檢，列管期間再經警察局查獲違規情事，處使用人新臺幣三十萬元罰鍰、所有權人新臺幣二十萬元罰鍰並停止 違規建築物供水供電。\n（四）復水復電：\n1.建築物或營業場所符合下列各目全部之規定者，於執行停止供水、供電屆滿六個月後，其所有人得申請恢復供水、供電（依行政執行法執行者，並得由營業人提出申請）：\n(1)原建築物室內裝修拆空或拆除至符合原核准圖說，若有市招併予拆除。\n(2)繳清與正俗專案有關之違規罰鍰。\n(3)建築物所有人切結不再自行或提供他人違法（規）使用（依行政執行法執行，並由營業人提出申請者，營業人亦須切結不得再違法（規）使用）。\n2.建築物使用人違法行為經不起訴處分、緩起訴處分確定或為無罪、免訴、不受理、不付審理、不付保護處分、免刑、緩刑之裁判確定，且建築物所有人已收回建築物，並已依前款規定辦理者，得於執行停止供水、供電屆滿三個月後，申請恢復供水供電。但該建築物復水復電後，再有違法（規）使用列","u":"都市發展局建築管理科","h":3589,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D958E63E79412128","d":"2010-12-07","sid":"D958E63E"},{"q":"如何申請都市計畫現況地形圖？","a":"答：","u":"臺北市政府都市發展局","h":3541,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C80A67016A65B836","d":"2009-06-03","sid":"C80A6701"},{"q":"如何查詢土地使用分區及土地使用核准條件？","a":"答：\n（一）查詢土地使用分區可利用網路查詢：臺北市政府都市發展局首頁/業務服務/都市測量/便民服務系統及網站之「土地使用分區查詢」或「地籍套繪都市計畫分區圖查詢」\n（二）查詢土地使用允許條件可利用網路查詢： 臺北市政府都市發展局首頁 / 業務法令 / 土地使用分區法令 / 臺北市土地使用分區附條件允許使用標準","u":"臺北市政府都市發展局","h":3117,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E0FE003EB3E9D5C2","d":"2008-10-17","sid":"E0FE003E"},{"q":"請問接受基地容積最高可接受多少？","a":"1.依「都市計畫容積移轉實施辦法」第8條規定，接受基地之可移入容積，以不超過該接受基地基準容積之百分之三十為原則。位於整體開發地區、實施都市更新地區、面臨永久性空地或其他都市計畫指定地區範圍內之接受基地，其可移入容積得酌予增加。但不得超過該接受基地基準容積之百分之四十。\n2.本市古蹟依「古蹟土地容積移轉實施辦法」申請容積移轉，依該辦法第7條規定，接受基地之可移入容積，以不超過該土地基準容積之百分之四十為原則。位於整體開發地區、實施都市更新地區或面臨永久性空地之接受基地，其可移入容積，得酌予增加。但不得超過該接受基地基準容積之百分之五十。\n3.另依「臺北市容積移轉審查許可自治條例」第9條規定，接受基地依本自治條例移入之容積加計其他依法規規定予以獎勵之容積總和，不得超過各該建築基地法定容積之百分之五十。前項容積總和不含都市更新獎勵及依都市危險及老舊建築物加速重建條例規定獎勵之容積。","u":"臺北市政府都市發展局綜合企劃科","h":2878,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6A56CD88922DE945","d":"2012-05-08","sid":"6A56CD88"},{"q":"有捷運穿越的公共設施保留地可不可以容積移轉？","a":"因捷運穿越之公共設施保留地，亦可為送出基地，其換算公式依「都市計畫容積移轉實施辦法」第9條第3項規定如下：\n送出基地屬第6條第1項第3款且因國家公益需要設定地上權、徵收地上權或註記供捷運系統穿越使用者之接受基地移入容積＝接受基地移入之容積×〔1－（送出基地因國家公益需要設定地上權、徵收地上權或註記供捷運系統穿越使用時之補償費用／送出基地因國家公益需要設定地上權、徵收地上權或註記供捷運系統穿越使用時之公告土地現值）〕","u":"臺北市政府都市發展局綜合企劃科","h":2750,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=46BFB686F8835898","d":"2012-05-08","sid":"46BFB686"},{"q":"正俗專案罰鍰可否申請分期付款?","a":"(一)違反都市計畫法並經裁處罰緩者，得依「臺北市政府各機關行政罰鍰作業手冊」規定辦理分期付款。 (二)另義務人得依行政執行法施行細則第27條「義務人依其經濟狀況或因天災、事變致遭受重大財產損失，無法一次完納公法上金錢給付義務者，行政執行處於徵得移送機關同意後，得酌情核准其分期繳納。經核准分期繳納，而未依限繳納者，行政執行處得廢止之。」及行政執行事件核准分期繳納執行金額實施要點第二點「義務人有下列情形之一者，法務部行政執行署所屬各地行政執行處（以下簡稱行政執行處）得依職權或依義務人之申請，於徵得移送機關同意，酌情核准分期繳納執行金額：1.義務人依其經濟狀況，無法一次完納公法上金錢給付義務者。2.因天災、事變，致義務人遭受重大財產損失，無法一次完納公法上金錢給付義務者。」之規定，向戶籍所在地之該管行政執行處申請。","u":"都市發展局建築管理科","h":2733,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CB485355D5A9FC10","d":"2010-12-07","sid":"CB485355"},{"q":"國民住宅條例廢止，有關產權移轉等事項，該如何辦理?","a":"總統府104年1月7日華總一字第10300201421號令廢止「國民住宅條例」在案，有關國宅產權移轉等事項，請逕向轄區地政事務所辦理。","u":"臺北市政府都市發展局","h":2711,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FCC34B5D2123B58A","d":"2015-01-26","sid":"FCC34B5D"},{"q":"符合那些條件需提送都市設計及土地開發許可審議委員會審議？","a":"答：\n一、臺北市（以下簡稱本市）都市計畫說明書中載明需經審議地區、大規模建築物、特種建築物及本市重大公共工程、公共建築之案件。\n二、依都市計畫規定指定為土地開發許可地區之開發許可之案件。\n三、經臺北市政府（以下簡稱本府）目的事業主管機關核准之新興產業或生產型態改變之產業，調整其使用組別及核准條件之案件。\n四、其他依法令規定須經臺北市都市設計及土地使用開發許可審議委員會（以下簡稱委員會）審議之案件。\n前述大規模建築物、特種建築物及重大公共工程、公共建築；指下列情形之一:\n一、開發基地面積達六千平方公尺，且總樓地板面積達三萬平方公尺之開發案。\n二、依建築法第九十八條規定許可之特種建築物。但大眾捷運系統工程，不在此限。\n三、開發基地面積達一萬平方公尺之公共設施用地之廣場或公園整體規劃案。\n四、開發基地面積達六千平方公尺之立體停車場。但建築物附屬停車場，不在此限。\n五、開發基地面積達六千平方公尺適用都市計畫公共設施用地多目標使用辦法之開發案。\n六、位於公共設施用地之地下建築物、高架道路、人行陸橋或長度達二百公尺之跨河橋樑。\n七、公有土地、公有建築物或公私立各級學校（含幼兒園）符合下列條件之一者：\n（一）以設定地上權方式開發，且總樓地板面積達三千平方公尺之建築物。\n（二）適用促進民間參與公共建設法開發，且總樓地板面積達三千平方公尺之建築物。\n（三）適用大眾捷運系統土地開發辦法開發。\n（四）社會住宅。\n（五）公辦都市更新。\n（六）總樓地板面積達一萬五千平方公尺之建築物。\n八、前款興建完成之建築物坐落基地有新建、增建、改建或修建之樓地板面積達三千平方公尺者。\n九、高架捷運車站或捷運路網交會站。\n十、適用臺北市都市計畫劃定山坡地開發建築管制規定之開發案。但區段徵收或市地重劃之地區相關公共設施、水土保持及整地設施業已施築完善者；或適用臺北市都市計畫劃定山坡地開發建築管制規定之範圍內無開挖、整地、配置建築物行為，且無水土保持法第十二條規定之適用者，不在此限。\n十一、保護區建築面積達二百平方公尺之開發案。\n十二、依法辦理容積移轉且移入之容積達接受基地原基準容積百分之二十，或因接受容積移入增加","u":"臺北市政府都市發展局","h":2700,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=05E4ABD9DEF4DC71","d":"2009-03-18","sid":"05E4ABD9"},{"q":"臺北市建築線指示圖有效期限是多久?","a":"依據「臺北市建築線指示申請辦法」第六條第二項規定建築線指示圖自申請案件核准日起八個月為有效期限。","u":"臺北市政府都市發展局","h":2593,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8F24BBCA9E078F09","d":"2018-05-01","sid":"8F24BBCA"},{"q":"接受基地申請人辦理容積移轉，是否需先取得送出基地土地所有權？","a":"依「都市計畫容積移轉實施辦法」第17條及「臺北市容積移轉審查許可自治條例」第10條規定，除送出基地為都市計畫表明應予保存或經直轄市、縣（市）主管機關認定有保存價值之建築所定著之土地(如本市古蹟及歷史建築所定著之私有土地)外，接受基地所有權人應於限期內完成取得送出基地所有權及將送出基地依規定贈與登記為公有等事項，始得核發容積移轉許可證明。","u":"臺北市政府都市發展局綜合企劃科","h":2427,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=04F40FEC8E6EF2E2","d":"2012-05-08","sid":"04F40FEC"},{"q":"正俗專案行政救濟管道及程序?","a":"（一）行政救濟管道：訴願人如有不服，應依訴願法第58條之規定，應繕具訴願書經由原行政處分機關（臺北市政府都市發展局）向訴願管轄機關（臺北市政府）提起訴願，並將副本抄送訴願管轄機關。\n（二）行政救濟程序：依訴願法第14條之規定，訴願應在收到原行政處分或公告期滿之次日起30日內提起（以本府實際收受訴願書之日期為準，而非投遞日），但若自行政處分達到或公告期滿後，已逾3年者，不得提起；訴願決定作成後，如果訴願人仍不服的話，得於決定書送達之次日起2個月內提起行政訴訟。","u":"都市發展局建築管理科","h":2426,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=63B083F7D3A99148","d":"2010-12-07","sid":"63B083F7"},{"q":"土地補償狀況查詢結果回覆公文是否代表一定可以容積移轉？","a":"查詢結果僅為土地之開闢及補償情形，若查詢結果皆為查無資料或不在徵收清冊範圍內等，則推定未受領補償，得依「都市計畫容積移轉實施辦法」等相關規定申請辦理容積移轉；惟容積移轉之准駁，應正式以書面向本府都市發展局提出申請。","u":"臺北市政府都市發展局綜合企劃科","h":2269,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=07FA05F974287281","d":"2012-05-08","sid":"07FA05F9"},{"q":"有關容積移轉申請相關法規、表格、申請書等資料哪裡可以找到？","a":"1.自106年10月11日起，申請都市計畫、古蹟容積移轉請至「 臺北市容積移轉審查管理系統 」，依系統操作程序進行案件申請，並應列印申請書表併同檢附相關資料送達本府都市發展局，始完成案件申請。\n2.有關容積移轉申請相關法規、前置作業查詢申請書等相關資料，請至上開系統點選「法規資訊」，該網頁有本市辦理容積移轉相關法令規定及前置作業查詢等資料可供下載。","u":"臺北市政府都市發展局綜合企劃科","h":2260,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=87AAB9EB910F92F0","d":"2012-05-08","sid":"87AAB9EB"},{"q":"正俗專案查報案件，經刑法不起訴後，得否再依都市計畫法處罰?","a":"依刑法優先原則，針對同時違反刑法之正俗專案查報案件，依據行政罰法第26條第1項規定「一行為同時觸犯刑事法律及違反行政法上義務規定者，依刑事法律處罰之。」送地方法院審判，另依同法條第2項「如經不起訴處分或為無罪、免訴、不受理、不付審理之裁判確定者，得依違反行政法上義務規定裁處之。」故除於裁罰處分書說明已載明上述法令規定外，針對經地方法院不起訴處分案得續依都市計畫法處罰，尚無違反一事不二罰之規定。","u":"都市發展局建築管理科","h":2259,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FE2F3A1009CFFEE2","d":"2010-12-07","sid":"FE2F3A10"},{"q":"查詢表單說我有領過補償費，但我卻沒領到，或是只領到一部分沒有全領？","a":"本局為辦理容積移轉前置作業之公共設施用地查詢開闢、補償情形之單一受理窗口，相關補償資料係由本府地政局、工務局新工處提供，土地所有權人如對查詢結果有疑義，係屬用地取得補償問題，因相關補償清冊、領據等資料皆在原機關，所有權人請逕向該機關洽詢。","u":"臺北市政府都市發展局綜合企劃科","h":2169,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9405EC463DB1257C","d":"2012-05-08","sid":"9405EC46"},{"q":"請問送出基地無法於本次申請案件完成所有容積送出怎麼辦？","a":"1.都市計畫容積移轉部分：\n(1)「都市計畫容積移轉實施辦法」第10條規定，送出基地除第6條第1項第2款之土地外，得分次移轉容積。接受基地在不超過第8條規定之可移入容積內，得分次移入不同送出基地之容積。\n(2)同辦法第11條規定，接受基地於申請建築時，因基地條件之限制，而未能完全使用其獲准移入之容積者，得依本辦法規定，移轉至同一主要計畫地區範圍內之其他可建築土地建築使用，並以一次為限。\n2.古蹟土地容積移轉部分：\n(1)「古蹟土地容積移轉實施辦法」第6條規定，接受送出基地可移出容積之土地（以下簡稱接受基地）於申請建築時，因基地條件之限制，而未能完全使用其獲准移入之容積者，得依本辦法規定，移轉至同一都市主要計畫地區或區域計畫地區之同一直轄市、縣（市）內之其他建築基地建築使用，並以一次為限。但經內政部都市計畫委員會審議通過後，得移轉至同一直轄市、縣（市）之其他主要計畫地區。\n(2)同辦法第9條規定，送出基地之可移出容積，得分次移出。 接受基地在不超過第七條規定之可移入容積內，得分次移入不同送出基地之可移出容積。\n3.臺北市政府核發容積移轉許可證明，註記有「送出基地可送出容積數量」、「本次容積送出數量」、「尚餘容積數量」等，據以供下次申請辦理容積移轉送出使用。","u":"臺北市政府都市發展局綜合企劃科","h":2169,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A6A345BDDE35FE87","d":"2012-05-08","sid":"A6A345BD"}]},{"org":"觀光傳播局","total":64,"items":[{"q":"加入臺北市政府LINE官方帳號的方式？","a":"只要在手機LINE app的「加入好友」中以ID搜尋「@taipei」，或於LINE「官方帳號」頁面中搜尋「臺北市政府」，都可以很方便的加入臺北市政府LINE好友。","u":"臺北市政府觀光傳播局","h":17843,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E7401A24DD23C28A","d":"2020-05-19","sid":"E7401A24"},{"q":"市府如何處理非法經營的旅館（含有日租型套房）?","a":"若發現非法旅館，觀光傳播局將邀集消防局、建築管理工程處、警察局等單位，辦理秘密聯合檢查，若查有業者無照經營實證，該局即依「違反發展觀光條例」處以罰鍰，並勒令歇業，後續亦將持續不定期巡查，確保業者停止非法經營旅館業。","u":"臺北市政府觀光傳播局","h":14004,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=694D09278078297B","d":"2023-06-15","sid":"694D0927"},{"q":"低收入戶及中低收入戶如何向有線電視業者申請收視費用減免？","a":"（1）凡於臺北市政府社會局登記有案的低收入戶，可攜帶行政處分、總清查核定通知書、各區公所開立之證明文書、已完成線上福利身分開通之台北卡APP系統畫面等福利資格識別證明(正本、影本各1份)及個人國民身份證向當地1家有線電視業者申請，免收裝機費及基本頻道每月收視費。\n（2）於臺北市政府社會局登記有案的中低收入戶，可攜帶行政處分、總清查核定通知書、各區公所開立之證明文書、已完成線上福利身分開通之台北卡APP系統畫面等福利資格識別證明（正本、影本各1份）及個人國民身分證正本，向所在地之有線電視業者申請，基本頻道收視費以二分之一月費計價為原則。\n（3）如原未申裝有線電視，自申裝當日起即享有前述優惠；如前已申裝但以一般用戶計費，自申裝次月起優惠。\n（4）因(中)低收入戶資格係每年重新認定，請於取得新的(中)低收入戶相關福利資格識別證明後儘速向業者重新申請。如未再提出申請，業者將依一般收視戶收費。","u":"臺北市政府觀光傳播局","h":13348,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=18858A4DC894B4E5","d":"2021-03-02","sid":"18858A4D"},{"q":"同一「戶」接裝有線電視於多台電視機，費用如何計算？","a":"（1）本府公告核准115年度本市各有線廣播電視系統經營者之基本頻道收視費用上限為每月每戶200元至530元不等。裝機費為1,300元。單一分機裝機費：於主機裝機時設置：300元；於主機裝機後設置：500元（以上費用不含數位機上盒押金）。\n（2）數位機上盒費：每戶第1臺免收保證金，第2臺（含）以上每臺得收保證金1,000元。但107年12月31日前已裝設或申請裝設者，前2臺仍免收保證金(含定期免費更換數位機上盒)。\n（3）舉例如下：\nA.王先生1月間搬入新家，新家僅有家人居住，王先生計劃在客廳裝接1台有線電視主機，另外在主臥室裝接1台有線電視分機，此時王先生需繳客廳主機裝機費1,300元及第1個月收視費（最多）490元(如選購A組)，分機裝機費300元，及數位機上盒保證金1,000元。以後每個月王先生只需繳收視費（最多）490元。\nB.王先生3月間決定在1間套房及餐廳各再裝接1台有線電視分機，須另支付2台分機裝機費各500元（合計1,000元），及數位機上盒保證金2,000元（每臺1,000元）。此時王先生家中收視有線電視的電視雖共4台，但每
