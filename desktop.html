81B16&s=7185CEC675C163CF","d":"2020-10-07","sid":"7185CEC6"},{"q":"藝文推廣處藝文大樓本週有無藝文活動?活動主題及內容為何？","a":"◎請參閱本處每月出版之「藝文快訊」刊物或本處網站「藝文訊息」專區下載數位刊物查詢。 ◎其他相關資訊，歡迎電洽02-2577-5931分機342-344藝文推廣課。","u":"臺北市藝文推廣處","h":829,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5079B90A6C92BC10","d":"2020-10-07","sid":"5079B90A"},{"q":"我要如何購買藝文推廣處大稻埕戲苑主辦節目的票券呢?","a":"※售票系統操作及相關問題，請洽兩廳院：02-33939888","u":"臺北市藝文推廣處","h":678,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1761D9D9EE2D6877","d":"2021-01-14","sid":"1761D9D9"}]},{"org":"市政大樓公共事務管理中心","total":23,"items":[{"q":"市政大樓停車場是否提供洽公民眾臨時停放？","a":"市政大樓地下停車場屬公務機關停車場，主要係提供本府各機關公務車輛使用，目前除開放身心障礙市民洽公使用外，所剩公務洽公臨停車位有限，實無多餘車位可供一般洽公民眾使用。\n市府週邊停車場充足，洽公民眾到市府洽公，建議可將車輛停放於府前停車場，在停車場地下1樓南區及北區均設有聯通道與市府相連，可直接到府洽公十分方便。","u":"臺北市市政大樓公共事務管理中心","h":15519,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6096CA6B58FB1509","d":"2026-06-10","sid":"6096CA6B"},{"q":"市政大樓1 樓影印及大圖影印服務的收費及時間為何?","a":"答：\n詳見本中心網頁： http://tpmc.gov.taipei/→服務園地→公管業務問答集→ 市政大樓各類服務查詢類","u":"臺北市市政大樓公共事務管理中心","h":11651,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C1821E501A69A14F","d":"2018-09-07","sid":"C1821E50"},{"q":"市政大樓1樓中庭、市政大樓週邊場地及市民廣場如何辦理租借？","a":"答：\n市政大樓1樓中庭、市政大樓周邊場地及市民廣場，提供本府各機關及其他機關、團體舉辦活動使用，辦理活動性質限制如下：\n（一）市政大樓1樓中庭：政令宣導、公益、文化、社教等活動，活動人數不超過200人且活動時間不超過1日。\n（二）市政大樓周邊場地(東門廣場、街舞區及好望角步道)：政令宣導、公益、文化、社教、休閒體育、宗教慶典、民俗節慶等非商業性活動。但為促進經濟、文創產業及具公益性之營業行為，不受限制。\n（三）市民廣場(新仁愛路及流水噴泉區)：政令宣導、公益、文化、社教、休閒體育、宗教慶典、民俗節慶等非商業性活動。但為促進經濟、文創產業及具公益性之營業行為，不受限制。\n應備申請資格、文件及場地使用費等資訊詳見網頁： http://tpmc.gov.taipei/→業務項目→活動場地租借 。\n如有相關疑問，可洽電話1999（外縣市：02-27208889）轉8624。","u":"臺北市市政大樓公共事務管理中心","h":8544,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DD8D7FF0D64E51BB","d":"2018-09-07","sid":"DD8D7FF0"},{"q":"市政大樓門禁管制時間為何?","a":"一般門禁管制時間：\n一、西大門 ( 市政大樓面市府路之大門 ) ：自上午 7 時至晚間 10 時開放。\n二、其他大門：\n( 一 ) 東大門、南大門 ( 面松智路段、面松壽路段 ) ：上班時段自上午 7 時至晚間 8 時開放；假日不開放。\n( 二 ) 北大門 ( 面松高路段 ): 上班時段自上午 7 時至晚間 8 時開放，晚間 8 時至 10 時只出不進方式管制；假日不開放。\n三、市政大樓各樓層辦公區域不對外開放，洽公民眾請一律於 1 樓北區聯合服務中心辦理或向秘書處市民服務組洽詢。","u":"臺北市市政大樓公共事務管理中心","h":6059,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AFAAFFC4D880B263","d":"2018-09-07","sid":"AFAAFFC4"},{"q":"市政大樓地下停車場位置？","a":"停車場分南北 2 區，出入口處皆設有崗亭，詳細位置如下： 南區：位於松壽路上。\n北區：位於松高路上。","u":"臺北市市政大樓公共事務管理中心","h":5416,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1AD37B9C45725E8F","d":"2018-09-07","sid":"1AD37B9C"},{"q":"師生畫廊要如何申請展出?","a":"答：\n師生畫廊的展出場地由本府公管中心提供，另由本府教育局特殊教育科負責安排本市公私立高中職學校學生作品輪展展期。有關申請展出事宜請洽本府教育局特殊教育科，聯絡電話1999（外縣市02-27208889）轉分機 1089。","u":"臺北市市政大樓公共事務管理中心","h":3471,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=80D7903D2B3D0233","d":"2018-09-07","sid":"80D7903D"},{"q":"市政大樓機電維護停電時程表那裡可以查詢或下載？","a":"答：\n有關本市政大樓停電時程表均定期公佈於本中心網頁，如欲下載查詢詳見本中心網頁： http://tpmc.gov.taipei/→服務園地→查詢服務→停電時程表。","u":"臺北市市政大樓公共事務管理中心","h":3469,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=46C607616121C303","d":"2018-09-07","sid":"46C60761"},{"q":"市政大樓市府生活廣場活動式臨時攤位申請","a":"答：\n市政大樓市府生活廣場活動式臨時攤位申請方式，詳見本中心網頁： https://tpmc.gov.taipei/Default.aspx","u":"臺北市市政大樓公共事務管理中心","h":3466,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6FE4903319153A96","d":"2018-09-07","sid":"6FE49033"},{"q":"市政大樓各項設備之報修分機號碼為何？","a":"市政大樓各項設備之報修分機號碼 報修項目 分機號碼 土木、雜項修繕 8620 清潔維護 8620、8623 分機故障 8620、8679 場地租借 8620、8624 停漏水管路故障 3002、8647 供電系統、照明設備 8644 電梯設備、空調調整 3005、3006、8649 消防設備 3005、3006、8649、2805 辦公室及廁所喇叭 8652、8650 電子看板、有線電視訊號 8652","u":"臺北市市政大樓公共事務管理中心","h":3441,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DF59BF2A4ED1C6F9","d":"2018-09-07","sid":"DF59BF2A"},{"q":"市政大樓各局處科室位置圖","a":"答：\n詳見本中心網頁： http://tpmc.gov.taipei/→服務園地→查詢服務→市政大樓樓層簡介","u":"臺北市市政大樓公共事務管理中心","h":3388,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=47A8B1502AB8886F","d":"2018-09-07","sid":"47A8B150"},{"q":"如何辦理借用市政大樓會議室？","a":"答：\n1.本市政大樓統一調度會議室係提供本府各機關學校召開會議或經管理機關核准之公務活動使用，會議室借用程序由各機關至本府「TAIPEION/行政作業/會議室管理系統」進行線上申請，經由系統自動核准，各機關依規定如期使用。\n2.會議室相關使用及借用資訊詳見本中心網頁： http://tpmc.gov.taipei/→業務項目→各項設施申請→會議室管理 。","u":"臺北市市政大樓公共事務管理中心","h":3140,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F994AAE54CFA8376","d":"2018-09-07","sid":"F994AAE5"},{"q":"市政大樓音樂節目播放時程表何處可以查詢或下載？","a":"答：\n有關本市政大樓音樂節目播放時程表均定期公佈於本中心網頁，如欲下載查詢詳見本中心網頁： http://tpmc.gov.taipei/→服務園地→查詢服務→音樂節目表。","u":"臺北市市政大樓公共事務管理中心","h":3080,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=78AFA205F0594CD7","d":"2018-09-07","sid":"78AFA205"},{"q":"身心障礙市民到府洽公可否將車輛停放於本大樓地下停車場？","a":"身心障礙者將車輛停放於本大樓地下停車場，須由身心障礙者本人（如為被載送者，亦應在場）備齊身心障礙專用停車識別證 ( 或懸掛身心障礙專用車牌 ) 、身心障礙手冊、駕駛執照及行車執照（ 4 證）供查核。","u":"臺北市市政大樓公共事務管理中心","h":3069,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7B976539069DC8CB","d":"2018-09-07","sid":"7B976539"},{"q":"市政大樓空調使用要如何申請？","a":"答：\n（一）使用空調人數每日最少須有10員，方可提出申請。請提前辦理申請作業，申請表電子檔填妥後，請併同機關首長或其授權人核准之奉核檔電子檔，傳送至表單上電子郵件信箱。使用期間之申請最長以一星期為限，若有特殊情形（如長期上課…..等）請來文專案申請。空調使用完畢請隨即通知中控室值班人員（分機：3005、3006）予以關閉。\n（二）申請表單下載，詳見本中心網頁： http://tpmc.gov.taipei/→業務項目→各項設施申請→空調使用申請。","u":"臺北市市政大樓公共事務管理中心","h":3022,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0C2F99B36032F5C5","d":"2023-03-31","sid":"0C2F99B3"},{"q":"市政大樓何種情形可以申請播音？外界或私人企業可以申請嗎？要如何申請？","a":"答：\n（一）市政大樓播音系統播放內容以防災、緊急避難、業務宣導、重大事項宣布為限，僅限市政大樓各機關使用，不提供外界或私人企業使用。\n（二）使用播音系統應向公管中心提出書面申請，經同意後始得至中央監控室播音。但遇緊急狀況時可先知會公管中心，並於事後補送申請表。\n（三）播音時間為上午12時及下午17時兩個時段，請於播音前提早5分鐘至中央監控室試音。\n（四）申請表單下載，詳見本中心網頁： http://tpmc.gov.taipei/→業務項目→各項設施申請→播音申請。","u":"臺北市市政大樓公共事務管理中心","h":2915,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B5F5EE541C7DDB7E","d":"2018-09-07","sid":"B5F5EE54"},{"q":"市政大樓內台北富邦銀行營業時間為何?","a":"台北富邦銀行營業時間為早上09:00至下午3:30。","u":"臺北市市政大樓公共事務管理中心","h":2267,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1DD313A4E8C7883E","d":"2018-09-07","sid":"1DD313A4"},{"q":"請問在臺北市市政大樓內遺失物品該如何找尋？","a":"本市政大樓內拾得遺失物品，均統一送交本市政大樓B1樓層中央區駐警隊值班台保管，請攜帶｢身份證明文件｣逕洽本中心駐警隊值班台辦理認領或登記協尋手續。如已離開本市政大樓，可於臺北市市政大樓公共事務管理中心網站上「最新消息」區查詢拾得遺失物之公告，或電洽本中心駐警隊值班台詢問（聯絡電話：市話直撥1999(外縣市請撥 02-27208889)轉分機8664）。","u":"臺北市市政大樓公共事務管理中心","h":1759,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B3EDB3C470D02501","d":"2021-04-19","sid":"B3EDB3C4"},{"q":"市政大樓飲用水設備(飲水機)是否定期檢測用水品質?是否定期更換濾心?","a":"一、有關市政大樓飲用水設備水質檢驗報告可於 http://tpmc.gov.taipei/服務園地→ 查詢服務 → 飲用水設備水質檢驗報告\n二、有關飲水機濾心更換頻率，為每3個月進行更換1次。","u":"臺北市市政大樓公共事務管理中心","h":1673,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=92837B299556800D","d":"2018-09-07","sid":"92837B29"},{"q":"若車輛停放在市政大樓地下停車場內，因開放時間已過，該如何取車?","a":"市政大樓地下停車場開放時間為上班日上午七時至下午八時，若因執行公務逾停車場開放時間，目前本市政大樓地下停車場已建置車牌辨識系統，車輛行至出口處，柵欄及鐵捲門即可自動辨識開起。","u":"臺北市市政大樓公共事務管理中心","h":1074,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4778F7C50CF98FD6","d":"2018-09-07","sid":"4778F7C5"},{"q":"市政大樓東南景觀區戲沙區開放時間？是否可以租借舉辦活動?","a":"1. 東南景觀區人工沙灘自112年3月31日起開放使用。\n2. 本區域屬開放性景觀區，不開放租借舉辦活動。","u":"臺北市市政大樓公共事務管理中心","h":1006,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C3737C74DEDC36A7","d":"2018-09-07","sid":"C3737C74"},{"q":"市政大樓地下停車場開放時間?","a":"(一)停車場開放時間：上班日上午七時至下午八時。 (二)裝卸貨車輛進出時間：上班日上午七時至下午六時。","u":"臺北市市政大樓公共事務管理中心","h":993,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E1804656F0BDDAB1","d":"2018-09-07","sid":"E1804656"},{"q":"市政大樓各大門及電梯前影片播放器如何申請?外界或私人企業可以申請嗎?","a":"一、本項設備係供各局處宣導本府施政理念及重大活動等訊息使用，方便市民即時得知本府各局處重要施政與活動，並不提供外界或私人企業使用。\n二、申請表單下載，詳見本中心網頁: http://tpmc.gov.taipei/業務項目→各項設施申請→影片播放申請 。","u":"臺北市市政大樓公共事務管理中心","h":918,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3050DC9F88AE1A94","d":"2018-09-07","sid":"3050DC9F"},{"q":"請問在臺北市市政大樓內發現抽菸情形該如何處理？","a":"本市市政大樓室內場所為菸害防制法第18條所訂全面禁止吸菸場所，僅於指定之戶外場所設有吸菸區，如發現違規吸菸情形，將依法開立通知單送本府衛生局裁罰，以維洽公市民與市府同仁拒吸二手菸之權益。如您發現該區域有違規吸菸情形，請直接撥打本中心駐警隊值班台，聯絡電話：市話直撥1999（外縣市請撥 02-27208889）轉分機8664，本中心將立即派員至現場稽查。","u":"臺北市市政大樓公共事務管理中心","h":600,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0A360E76CA8DB30E","d":"2022-11-18","sid":"0A360E76"}]},{"org":"秘書處","total":21,"items":[{"q":"民眾欲申請市長輓聯是否有條件限制?該如何申請？","a":"一、民眾申請市長輓聯並無條件限制，惟本府落實環保及節約政策，僅致送電子輓聯；公祭場所無播放電子輓聯設備者，則致送慰問信函。\n二、申請市長輓聯時，請依公祭場所有無提供播放電子輓聯設備為判斷依據，公祭場所可播放電子輓聯設備，請申請電子輓聯；公祭場所無播放電子輓聯設備者，請申請慰問信函。\n三、申辦作業請詳下表：\n※上述日期為考量全臺各地殯葬場所及郵務作業時間訂定，不便之處，尚請諒察！","u":"臺北市政府秘書處","h":75455,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FA655A8A312CCEAB","d":"2020-12-31","sid":"FA655A8A"},{"q":"承辦單位補發公文作業要如何處理？","a":"承辦人辦理補發公文作業時，應檢附原案，加簽說明，經陳奉核可後，送請發文人員補發，不必重新辦稿，惟須於文面左上側空白處註明補發日期及「補發」字樣。\n聯繫電話：1999(外縣市02-2720-8889)轉1023","u":"臺北市政府秘書處","h":23203,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F291F379FCCC7A83","d":"2023-02-10","sid":"F291F379"},{"q":"如何洽詢秘書處建築師諮詢服務？","a":"建築諮詢服務，由臺北市建築師公會每週一、週三、週五之上班日輪派會員，提供有關建築疑難問題之專業諮詢服務。\n建築諮詢服務\n服務時間：每週一、週三、週五之上班日上午09:00-12:00/下午02:00-05:00\n服務地點：臺北市市府路1號市政大樓1樓北區市民服務組建築諮詢室\n服務對象：以在本市設有戶籍之市民為限；但非本市市民而其申請專業諮詢服務之內容與本市或本府有關者，不在此限。\n服務方式：面談或電話諮詢。\n服務電話：1999轉分機6163或（02）27256163","u":"臺北市政府秘書處","h":21290,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1184705FC55DB27F","d":"2024-01-01","sid":"1184705F"},{"q":"公文正本為上行文，副本為下行文時，公文應如何蓋印或簽署？","a":"副本之蓋印與正本同，抄本或譯本不必蓋印，但應標示「抄本」或「譯本」。\n聯繫電話：1999(外縣市02-2720-8889)轉1023","u":"臺北市政府秘書處","h":18999,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0D6CEC308D761570","d":"2023-02-10","sid":"0D6CEC30"},{"q":"承辦單位遺失已收文編號之公文時，應如何處理？","a":"承辦單位因故遺失已收文編號之公文，請先洽請原發文機關補發公文後，沿用原收文日期及原收文號。\n聯繫電話：1999(外縣市02-2720-8889)轉6076","u":"臺北市政府秘書處","h":14844,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C58F8C10F2628BDB","d":"2021-02-01","sid":"C58F8C10"},{"q":"臺北市雙語環境建置狀況如何？","a":"為提昇臺北市之國際化與加強國際競爭力，本府自民國89年底起推動「臺北市政府建置中英文雙語環境方案」，積極推動建置中英文雙語環境；就各機關及附屬單位之「機關名稱」、「人員職稱」、「辦公場所」及「公共場所」等4大項中英譯資料進行審議。本府所屬機關建築與業務說明標示、職銜牌及公共標示牌等已達成雙語化，另各機關出版品、法規及網站等資料亦持續雙語化，以建構全面雙語環境，成為適合國際人士居住之城市。\n聯繫電話：\n1999(外縣市02-2720-8889)轉6107~6115\n1999(外縣市02-2720-8889)轉1020~1021","u":"臺北市政府秘書處","h":12625,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=17DDED91BA74AAC1","d":"2024-05-17","sid":"17DDED91"},{"q":"臺北市與其他國外城市關係如何？","a":"為加強臺北市的國際參與，臺北市與國際城市透過結盟、簽署合作計畫及參與國際組織等方式，增加交流與互動。結盟主要係為提供本市與外國城市間合作之橋樑及架構，以推動實質交流互惠合作關係，臺北市政府與現有之53個姐妹市、3個夥伴市、7個友誼市，透過文化、藝術、經貿、體育、學術等合作計畫及實質交流，促進雙方關係發展，以提昇本市國際地位，為市民謀福利。此外，臺北市政府亦積極爭取加入重要國際城市組織會員，如「城市與地方政府聯盟(United Cities and Local Governments, UCLG)」、城市與地方政府聯盟亞太分會(UCLG-ASPAC)、國際姊妹市協會(Sister Cities International, SCI)、城市網(CITYNET)等，另外亦參與國際會議如世界城市高峰會(World Cities Summit, WCS)及亞太城市高峰會(Asia Pacific Cities Summit,APCS)等。藉由參與國際組織之各項會議或活動，與其他會員城市加強聯繫交流，爭取各該組織在本市舉辦會議或活動等方式，以增加本市之國際能見度，提昇本市在區域間及國際上的地位。\n聯繫電話：\n1999(外縣市02-2720-8889)轉6107~6115\n1999(外縣市02-2720-8889)轉1020~1021","u":"臺北市政府秘書處","h":11816,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4BD7BC9750E729A7","d":"2024-05-17","sid":"4BD7BC97"},{"q":"臺北市政府如何推動城市外交？","a":"本府為引領臺北市永續成長並突破既有框架，加速國際化進程，特設立「國際事務委員會」，以統籌本市的涉外事務及資源整合計畫，並以本府秘書處國際事務組為對外聯繫之窗口及協調本府各局處共同進行國際事務工作。對外著重交流之實質內涵與品質，以特定政策議題導向之合作備忘錄為主軸，務實應用至市政；對內持續經營友好關係，藉與駐臺外交機構及商會維護良好互動，宣傳國際活動資訊、開展多元合作或維繫國際城市實質往來，進一步以城市地位協助總體外交拓展。\n聯繫電話：\n1999(外縣市02-2720-8889)轉6107~6115\n1999(外縣市02-2720-8889)轉1020~1021","u":"臺北市政府秘書處","h":11715,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3DC40D7967982045","d":"2024-05-17","sid":"3DC40D79"},{"q":"秘書處志工服務項目為何?","a":"本處志工分別在市政大樓東、西、南、北四個大門及北區聯合服務中心，提供引導與諮詢服務。\n志工業務聯繫電話1999轉分機6159","u":"臺北市政府秘書處","h":11364,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=87A89BAE640556C3","d":"2022-09-29","sid":"87A89BAE"},{"q":"有關檔案管理實務作業問題？","a":"有關檔案管理實務作業問題，可至國家發展委員會檔案管理局網頁點選「 便民服務/諮詢溝通 」或「 便民服務/常見問答 」進行問題檢索或依問題分類之查詢條件查詢。","u":"臺北市政府秘書處","h":9590,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AD9CC8EE827861A2","d":"2021-02-01","sid":"AD9CC8EE"},{"q":"如何申請應用本府各機關檔案應用？","a":"申請方式：\n1、您可先至「機關檔案目錄查詢網」（[ 連結 ]）查詢所需檔案資訊。\n2、為提供民眾便捷的服務體驗，本府提供檔案應用全程式線上申辦服務，您可不受時間、地點限制，透過「 台北服務通 」（請於首\n頁搜尋「檔案應用」）即時提出線上申請；或下載相關書證表單並填寫完備後，以臨櫃、郵寄或傳真等方式提出申請。\n3、本府各檔案管有機關將於接獲申請後30日內通知您審核結果。\n相關法規及檔案：\n． 臺北市政府及所屬各機關大專院校檔案開放應用要點（PDF檔）\n． 檔案閱覽抄錄複製收費標準\n．檔案應用申請書 （ODF檔） （PDF檔）\n．檔案應用委任書 （ODF檔） （PDF檔）","u":"臺北市政府秘書處","h":8854,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2434683097FA6613","d":"2021-11-03","sid":"24346830"},{"q":"臺北市政府聯合服務中心的位置與服務時間為何?","a":"一、臺北市政府聯合服務中心位於市政大樓1樓北區。\n二、服務時間：\n(一)8:30〜17:30  (户政櫃檯至17:00止)。\n(二)8:30〜9:00、12:30〜13:30、17:00〜17:30，為彈性上班時間，服務人力較少。\n三、取號機最後抽號時間至17:15 止 (戶政櫃檯至16:45止)。","u":"臺北市政府秘書處","h":2975,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B3435CE7E861C7AE","d":"2025-03-03","sid":"B3435CE7"},{"q":"檔案應用是什麼？","a":"有關「檔案應用」係指民眾為了解政府機關公文檔案內容，或因歷史考證、學術研究、權益保障需要，向政府機關提出查看、抄錄或複製公文檔案之申請。\n法規依據：檔案法、檔案閱覽抄錄複製收費標準、臺北市政府檔案管理作業要點、臺北市政府及所屬各機關大專院校檔案開放應用要點","u":"臺北市政府秘書處","h":2904,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EA97E684E2C415C2","d":"2025-02-06","sid":"EA97E684"},{"q":"為民服務綜合諮詢櫃檯有哪些服務?","a":"由本組人員提供市政業務綜合諮詢服務，及有關市民陳情、建議等之反映，協助聯繫各機關處理。\n聯繫電話\n1999轉分機1000~1001","u":"臺北市政府秘書處","h":2643,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=631E871F6D43F2B0","d":"2016-12-01","sid":"631E871F"},{"q":"如何閱讀本市政大樓之電子報紙及雜誌？","a":"本市政大樓提供電子報紙及雜誌之場域閱讀服務，閱讀方式如下：\n(一)開啟您的手機或平板，下載Hami Book的APP，並允許GPS定位，只要位於本市政大樓服務場域內，即可使用該服務。\n(二)本服務定位於本市政大樓，每次啟用後使用時間為240分鐘，逾時將自動登出，如需再次使用，應重新啟用定位閱讀。\n(三)如有相關操作問題，歡迎撥打本府合作廠商「春水堂科技娛樂股份有限公司」客服電話0800-007-368。","u":"臺北市政府秘書處","h":1370,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=84B4B3AF24F9F8D4","d":"2023-04-13","sid":"84B4B3AF"},{"q":"我想知道案件刊登臺北市政府公報情形，該如何查詢？","a":"您可至 臺北市政府電子公報資訊網 ，於右上方公報查詢欄位，輸入關鍵字查詢；或可點選「進階查詢」，輸入您所需要的查詢條件進行查詢。","u":"臺北市政府秘書處","h":953,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=099E61A41CAA0D5A","d":"2023-05-11","sid":"099E61A4"},{"q":"如何查詢本府常見問題？","a":"請至臺北市政府網站/首頁/常見問答，網址 https://www.gov.taipei/News_FAQ.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16 ，即可查詢。","u":"臺北市政府秘書處","h":926,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=370A01785BD76166","d":"2020-06-30","sid":"370A0178"},{"q":"我想要收到臺北市政府公報電子檔，該怎麼做？","a":"您可至 臺北市政府電子公報資訊網電子報訂閱區 ，輸入您接收電子公報資訊的電子信箱、選擇訂閱內容，並輸入畫面上驗證碼後，按下確認訂閱。再至您剛剛輸入的電子郵件信箱執行驗證，確認訂閱作業，即可定期收到您訂閱的電子公報資訊。","u":"臺北市政府秘書處","h":662,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=65B2EF3A57D822E4","d":"2023-05-11","sid":"65B2EF3A"},{"q":"民眾欲申請市長祝福婚慶賀卡是否有條件限制?該如何申請？","a":"一、民眾申請市長祝福婚慶賀卡並無條件限制，惟本府落實環保及節約政策，僅致送賀卡。\n二、新人或親友可於婚慶儀式5個工作日前以下列方式申請市長祝福婚慶賀卡：\n（一）登入「台北服務通」系統，申請市長賀卡。\n（二）郵寄賀卡申請書喜帖或婚慶證明文件至「臺北市信義區市府路1號11樓市長收」申請市長賀卡。\n三、若文件錯漏者，本處將以系統、電話或電子郵件通知補正，如無法於時限內補正，即通知退件。\n四、申辦作業請詳下表：\n※上述日期為考量全臺各地郵務作業時間訂定，不便之處，尚請諒察！","u":"臺北市政府秘書處","h":642,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=19DE9A775191AA53","d":"2025-11-03","sid":"19DE9A77"},{"q":"如何得知市長及市府重要新聞？","a":"可至 本府官網 上方點選「市政公告」之Banner，並選擇「市長新聞稿專區」及「市府新聞稿」即可查詢相關新聞。","u":"臺北市政府秘書處","h":618,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AC186152766FB5AD","d":"2023-08-08","sid":"AC186152"},{"q":"市長新聞稿專區的文字及照(圖)片是否可以轉載使用？","a":"(一)本府市長新聞稿，乃著作權法第9條第1款之公文，不為著作權之標的。\n(二)本府市長新聞稿照(圖)片，可作為新聞報導使用，且須註明出處，其他用途之利用請洽媒體事務組。","u":"臺北市政府秘書處","h":551,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BC15F8579A2460BC","d":"2023-08-08","sid":"BC15F857"}]},{"org":"第二區工程處","total":19,"items":[{"q":"交通維持>何謂「植物園遺址」？與捷運萬大線LG02植物園站工程有何關係？","a":"植物園遺址為西元1900年發現，當時稱為「大加蚋堡貝塚」，發現有陶器、石器及玉器等，植物園遺址自早期至近代包含：訊塘埔文化（年代距今約4600~3500年間）、圓山文化（年代距今約3200~2500 年間）、植物園文化（年代距今約2200~1800 年間）、十三行文化（年代距今約1400~350 年間）、近現代文化（年代約18~20 世紀）等，範圍約以植物園為中心，北側分布至南門國中附近，東側至南海學園、教育資料館附近，西、南界則約沿現今三元街一帶。 捷運萬大線LG02植物園站，全區均位於已知的植物園遺址範圍之內，基於遺址保護、研究及「文化資產保存法」、「遺址監管保護辦法」之規定，工程施工前將進行全面性的搶救發掘作業，搶救發掘深度約為地表下0至6公尺（發掘至文化層結束為止）之地層內各階段的文化遺留、自然遺物及遺跡等。 未來車站內建築裝修設計概念，特別融入歷史博物館建物及植物園文化遺址等環境特質及意象，藉地下車站空間，導入認識歷史遺址與文化資產的情境，使捷運車站除運輸功能外，同時展現教育及歷史傳承的功能；遺址發掘過程中出土之部分文物、文化層之地層剖面及發掘過程攝錄影像，屆時亦將配合於捷運車站、出入口與國語實小共構大樓等空間常態展示，型塑「地下文物藝廊」的氛圍。","u":"第二區工程處","h":8340,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88816BBA383E3B78","d":"2018-10-11","sid":"88816BBA"},{"q":"交通維持>捷運萬大線工程路線範圍為何？","a":"捷運萬大-中和-樹林線（簡稱萬大線），全線規劃由捷運中正紀念堂站起，向西經過臺北市中正區南海路、西藏路、萬華區萬大路，地下穿越新店溪進入新北市中和區中山路、連城路、土城區金城路及樹林地區沿線廊帶後，與捷運中和新蘆線迴龍站相接，路線總長度約22.8公里（含機廠支線），全線採地下及高架型式興建，共設22座車站（11座地下車站、11座高架車站）及1座機廠，採中運量全自動無人駕駛捷運系統設計。 行政院於99年2月12日核定萬大線全線，分2期開發：","u":"第二區工程處","h":4810,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7ABD1B92CDC9BA4D","d":"2018-10-11","sid":"7ABD1B92"},{"q":"交通維持>環狀線東環段目前規劃及辦理期程為何？","a":"環狀線東環段第二區工程處負責分為3個工程標案進行:\n1.環狀線東環段優先標CF763施工標工程範圍，北側銜接Y39車站南端(CF760區段標)，沿松仁路續行穿越拇指山山脈、國道三號及景美溪轉新光路二段與南環段Y1站進行銜接(CF670A區段標)。本標路線全長約3.1公里，設置1座地下5層通風豎井及1段長隧道。工程已於113年10月18日順利決標，並於113年12月24日工程開工，目前進行潛盾隧道發進井擋土排樁施工作業。\n2.CF760區段標工程範圍，包含4個子施工標，歷經2次流標，已於114年7月22日以256億6,645萬8,000元順利決標，由互助營造/日商華大林組承攬，並於114年10月20日工程開工，目前進行Y38站第0A階段人行道掘削及Y39站污水管遷移推管等作業。\n(1)CF761施工標為銜接Y37站(不含)至Y38站之車站及潛盾隧道間之土建工程，路線長度約為2,056公尺，施工範圍共設1座地下車站(Y38) 與捷運淡水信義線象山站交會轉乘，站體南端銜接中央避車線約為278公尺、1段潛盾隧道長度約為1,644公尺及1段潛盾連通道長度約為125公尺。\n(2)CF762施工標為銜接Y38站(不含)至Y39站之車站及潛盾隧道間之土建工程，路線長度約為745公尺，施工範圍共設1座地下車站(Y39)及一段潛盾隧道長度約為608公尺。\n(3)CF764A施工標為包含CF761施工標工程範圍內之Y37站(不含)至Y38站之車站及潛盾隧道間之水電及環境控制系統工程。\n(4)CF764B施工標為包含Y38站(不含)至Y39站之車站及潛盾隧道，及至計畫終點(南環段Y1站不含)之豎井及潛盾隧道(含工作井)間之水電及環境控制系統工程。\n3.CF750區段標工程範圍，包含3個子施工標，已辦理2次公開招標作業，並請細部設計顧問依公開徵求廠商提供意見修正招標預算及招標文件中，將儘速再辦理第3次公告招標作業。\n(1)CF751施工標施工範圍設1座地下車站(Y36)與捷運松山線松山站及臺、高鐵松山站交會轉乘，車站長度約為172公尺。\n(2)CF752施工標為銜接Y36站(不含)至Y37站之車","u":"第二區工程處","h":2152,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=351EF92BA9E61337","d":"2024-09-24","sid":"351EF92B"},{"q":"交通維持>捷運信義線東延段工程範圍及廣慈/奉天宮站位置？","a":"捷運信義線東延段為信義線之延伸，從象山站東端之尾軌段（松德路以東），沿信義路六段，接福德街轉中坡南路至玉成公園，總長約1.42公里。廣慈/奉天宮站位於福德街84巷至大道路巷間之廣慈博愛園區前。","u":"第二區工程處","h":1850,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=37674C92236E0644","d":"2020-08-13","sid":"37674C92"},{"q":"交通維持>捷運南環段工程目前施作情形？","a":"2. CF670區段標工程，於113年12月9日由大陸工程股份有限公司得標，於114年3月28日工程開工，其中CF672施工標目前辦理Y2A站1-1階段交通維持範圍中間柱工程施工、污水管遷移及500mm自來水管臨遷。Y03站北側臨時排水溝施作、舖面施作及中華電信與台電管線遷移。CF673施工標目前進行Y05站~Y06站間潛盾隧道範圍補充地質鑽探；Y04站第1階段交通維持範圍於木柵路1段南側辦理地下管線撥遷、中間柱位置探挖、人行道掘削及擋土密排樁導溝施築等作業；Y05站則進行站體連續壁施工作業。","u":"第二區工程處","h":1547,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D19A014FE6112034","d":"2020-08-12","sid":"D19A014F"},{"q":"交通維持>捷運信義線東延段的主要工程內容及特色為何？","a":"橫渡線：位於福德街51巷至89巷間。\n潛盾隧道：象山站尾軌至廣慈/奉天宮站間長約489公尺及廣慈/奉天宮站至玉成公園間長約519公尺，其上下行長分別約為 1,006 公尺、1,012公尺，合計總長為2,018公尺。","u":"第二區工程處","h":861,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A7B76D94C2295191","d":"2020-08-13","sid":"A7B76D94"},{"q":"交通維持>捷運南環段工程路線範圍為何？","a":"南環段路線自文湖線動物園站(銜接轉乘)起，設置端點站Y01車站，自新光路一段穿越告尖山山區至秀明路二段，於秀明路二段、萬壽路交岔口之國立政治大學內設置Y1A車站，後穿越景美溪下方，於木新路一段、木柵路三段交口設置Y2A車站。再由南轉西行接秀明路一段後直行銜接位於木柵路二段之Y03站，接著直行木柵路二段、一段，並於木柵路一段與試院路交岔口東側設置Y04車站；經過Y04車站即自考試院國家考場旁續轉南行穿越埤腹山後，二度穿越景美溪。再沿防汛道路旁之工業區行進，並於遠東工業區都市更新計畫留設之公園用地內設置Y05車站，後接續西行以地下穿越部分民房後於新店民權路銜接環狀線第一階段通車路線之Y06車站(大坪林站)。","u":"第二區工程處","h":670,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2A011AEDA7D790BD","d":"2020-08-12","sid":"2A011AED"},{"q":"交通維持>捷運萬大線第一期完工通車後與其他路線之交會轉乘站各為何?","a":"於LG01中正紀念堂站轉乘紅線（淡水-信義）及綠線（松山-新店），於LG06中和站轉乘環狀線。","u":"第二區工程處","h":653,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=52143A9F60EA39DA","d":"2020-08-12","sid":"52143A9F"},{"q":"交通維持>捷運萬大線各車站的主要工程內容及特色為何？","a":"LG01至LG05站隧道上下行長分別約為4,744 公尺、4,735公尺，合計總長為9,479公尺，及7處聯絡通道。","u":"第二區工程處","h":601,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3035EF78DB5F161","d":"2020-08-13","sid":"D3035EF7"},{"q":"交通維持>環狀線北機廠規劃及目前施作情形？","a":"北機廠位於新北市三重區集賢路與環堤大道間，為全台首座具完整功能之地下捷運機廠。依據環狀線目標期程及配合捷運機廠土地開發作業時程，北機廠區分兩區域及階段進行：","u":"第二區工程處","h":591,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E5C98AE8F1D51579","d":"2020-11-20","sid":"E5C98AE8"},{"q":"交通維持>捷運萬大線LG01~LG05車站工程發包及施工？","a":"發包施工現況： CQ840區段標(含LG01中正紀念堂站、LG03廈安站等)：已於105年11月23日決標、106年2月6日開工。 CQ842標(LG02植物園站)：工程初期須辦理遺址搶救作業，已於103年10月15日決標、103年12月11日開工。 CQ850A區段標(LG04加蚋站)：已於105年11月8日決標、105年12月31日開工。 CQ850區段標 (LG05永和永平國小站)：已於104年11月11日決標、105年1月19日開工。 目前辦理進度：捷運萬大線LG01~LG05車站工程辦理進度現況，請詳捷運工程局官方網址： https://www.dorts.gov.taipei 首頁之「捷運路網/興建中路網/萬大中和樹林一期」之各區段標工程簡介。","u":"第二區工程處","h":507,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=05A88D413E942FA3","d":"2020-08-12","sid":"05A88D41"},{"q":"交通維持>捷運萬大線第一期工程，第二區工程處所負責監造之工程範圍及車站位置？","a":"捷運局第二區工程處負責監造施工之工程路線，自羅斯福路與南海路口之LG01中正紀念堂站起始，向西沿南海路於林業試驗所與國語實小間設置LG02植物園站，穿越和平西路，至中華路與汀洲路間之忠義國小附近設置LG03廈安站，接著再轉萬大路至長泰街與東園街間之東園國小附近設置LG04加蚋站，續向西沿萬大路經果菜市場穿越新店溪進入新北市永和區經保順路至保生路，於永平國小前設置LG05永和永平國小站，再轉中山路至中和區連城路（景平路口），接LG06中和站(不含)。","u":"第二區工程處","h":447,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4CAE149277C6A551","d":"2020-08-13","sid":"4CAE1492"},{"q":"交通維持>捷運萬大線南昌路人行道削減作業，發現水溝壁體為台北城牆石組成，施工期間及完工後之後續處理方式為何？","a":"已委託中研院辦理搶救及研究，並經台北市文資審議委員審議通過採行處理計畫如下：","u":"第二區工程處","h":446,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E2C9ED67AD054DC9","d":"2020-08-13","sid":"E2C9ED67"},{"q":"交通維持>捷運信義線東延段工程發包施工現況及目前辦理進度？","a":"已於105年7月19日決標、105年10月17日開工，全部工程預定114年底完工。\n本工程辦理進度現況，請詳捷運工程局官方網址： https://www. dorts.gov.taipei 首頁之「捷運路網/興建中路網/信義線東延段/工程資訊」之各區段標工程簡介。","u":"第二區工程處","h":438,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FB1B755F01366AEB","d":"2020-08-13","sid":"FB1B755F"},{"q":"交通維持>捷運萬大線及信義線東延段動工後，如何減輕對周邊的交通及居民生活環境造成影響？","a":"捷運萬大線及信義線東延段均依審核通過各階段之交維計畫施工，並指派義交協助指揮，以減少對沿線交通造成影響。施工先期工程完成後，將進行道路淺挖架設覆工版，供施工後期於道路下方進行車站站體開挖施作，以減輕對鄰近居民之影響。","u":"第二區工程處","h":425,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1A968B25683A5B6D","d":"2020-08-12","sid":"1A968B25"},{"q":"交通維持>請說明捷運萬大線有四個車站施工位置鄰近小學校區，施工期間交通維持與維護學童上、下課安全措施為何。","a":"為維護學童上、下課安全，均特別加強交通維持措施，例如，於交通維持轉換時於圍籬設置前、後須邀集各相關單位（包含當地里長及鄰近機關、學校等）辦理現場會勘，經充分討論後依結論執行；並與校長、導護人員及導護志工充分溝通，依校方需求於每日上、下學時段及周邊重要路口均派員協勤疏導。","u":"第二區工程處","h":404,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=189F092EE5DDEEBA","d":"2020-08-13","sid":"189F092E"},{"q":"交通維持>請說明萬大線及信義線東延段施工期間如何管理及防治施工噪音與振動。","a":"除於工程契約中已明訂營建噪音須符合環保署之噪音管制法規外，並嚴格要求施工廠商須採用低噪音、低污染之施工機具，及於施工過程中採低噪音之工法施工，另噪音較大之施工項目，將儘量於例假日上午延後開工及平常日之白天時間進行施工，以降低對民眾休息及睡眠時間之噪音干擾。","u":"第二區工程處","h":382,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=17CBA33E8E836597","d":"2020-08-13","sid":"17CBA33E"},{"q":"交通維持>環狀線東環段第二區工程處所負責監造工程範圍之車站內容？","a":"環狀線東環段第二區工程處負責4座車站:\n1.Y36站:\n(1)車站位於臺北市松山區松山路與市民大道6段路口南側之松山路下方，站體型式為為地下四層島式月臺車站，覆土深度約2.5公尺，車站長度約為143.8公尺，車站寬度為21.6公尺~25.6公尺不等寬，與臺、高鐵松山站及捷運松山線松山站交會轉乘。本站於出入口A位於松山路西側廣場用地，通風井X設置於松山路中央安全島之道路用地，出入口B、通風口及冷卻水塔場皆設置於松山路東側交三用地，車站南側穿堂層與臺鐵停車場為轉乘連通。車站北側與臺鐵松山站及松山捷運站轉乘，合計設置2部無障礙電梯。\n(2)工程起點由Y35站南側之潛盾隧道開始，先以水平線形沿舊宗路一段行進，經南京東路六段路口時則採疊式線形，以避開成美橋基樁並穿越民宅，經基隆河時則採水平線形穿越玉成抽水站，於成美橋引道端下橋處採 R50/R60 轉彎半徑西轉南港路三段續行，經松山橋及松山國小，為了避開松山國小停車場之基樁及連續壁，則以R50轉彎半徑往南進入八德路四段到達Y36 站。\n(3)Y36車站相鄰已營運中之捷運松山站及臺、高鐵松山站，以捷運松山站地下橢圓廣場作為三鐵共構之集中轉乘大廳，使Y36車站得與快速通達已營運中之捷運及臺、高鐵松山站。\n2.Y37站:\n(1)車站位於臺北市松山區松山路與忠孝東路五段路口北側之松山路下方，站體型式為地下四層島式月臺，覆土厚約6.2公尺，車站長度約167.4公尺；寬度約20.90公尺，與捷運板南線永春站交會轉乘地下連通結構約為230公尺。於車站南北兩側共設置2座出入口、2部無障礙電梯、2座通風井，並於穿堂層北側東西端預留二處可拆式牆板作為連接未來基地之機制，出入口A設置於松山路342巷（道路用地變更為捷運系統用地）、出入口B設置於捷運開發區（商三(特) 變更為捷運開發區用地）。\n(2)Y37站與已營運中之板南線永春站採站內未付費區聯通轉乘。地下連通道設置於Y37站穿堂層，行經松山路342巷(出入口A結構下方)、虎林街、忠孝東路五段，高程差約6.25m，須通過板南線永春站與其土開大樓之間隙及板南線永春站通風管道下方，於板南線永春站北側佈設垂","u":"第二區工程處","h":293,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C1CF4BC54BE4B4E8","d":"2024-09-24","sid":"C1CF4BC5"},{"q":"交通維持>捷運東環段工程第二區工程處所負責監造之工程範圍為何？","a":"環狀線東環段為中運量捷運系統，第二區工程處負責路線全長約6.89公里，路線起自捷運松山站及臺鐵松山站下方設置之Y36站；沿松山路直行於忠孝東路口北側設置Y37站；續行松德路轉松德路168巷及松仁路95巷，再轉至松仁路直行過信義路五段，於松仁路口設置Y38站及中央避車線；續行松仁路至吳興街口設置Y39站；續行穿越拇指山山脈、國道三甲及景美溪轉新光路二段，於南環段Y1站前止。共設置4座地下車站(Y36站~Y39站)、3段潛盾隧道、1座中央避車線及1座獨立通風豎井，除隧道及Y38站與已營運中捷運淡水信義線象山站之連通道由潛盾工法施作外，其餘皆採明挖覆蓋施築。","u":"第二區工程處","h":187,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=062A174D8C88D43E","d":"2024-09-24","sid":"062A174D"}]},{"org":"客家事務委員會","total":18,"items":[{"q":"想要學客家話，有什麼管道？","a":"可依個人時間及程度選擇學習管道包括： 一、網路客語教學：可上 本會網站 「客語 e 學堂」學習。 二、空中客語學堂：本會委託的電臺製播客語廣播節目，其中包含客語教學單元。 三、臺北客家書院：本會委託財團法人台北市客家文化基金會辦理各類課程，整合五大領域 「 客家新興議題、客家技藝傳承、客家跨域共學、客家表演藝術、客家語言及文化 」 為課程發展主軸，連結工藝美學、藝術創作、影像敘事等領域，透過各種課程、工作坊、公共參與、服務回饋等活動的舉辦，建構都會區客家終身學習環境。詳請請見 臺北客家書院 網站。","u":"臺北市政府客家事務委員會","h":12624,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=70BA4CE7ADE27D95","d":"2020-10-28","sid":"70BA4CE7"},{"q":"如何申請「臺北市市民或立案臺北市客家團體辦理客家文化語言相關研習計畫」補助？","a":"壹、申請資格： 一、個人：年滿20歲，具行為能力且設籍於本市之市民。 二、團體：於本市立案之非營利法人或非法人客家團體，或立案地址在本市之全國性客家組織。 貳、申請時間：每年年初於本會網站公告相關計畫。 參、申請方式： 一、網路申辦：各申請單位請至「 臺北服務通 」->點選「補助臺北市市民或立案臺北市客家團體辦理客家文化語言相關研習計畫」->依照申請步驟完成申請。 二、紙本申辦： (一)符合資格之個人請檢附身分證、申請書、師資聘書、研習課程計畫書及其他申請資料各一份（ 電子檔請一併送交本會 ），於本會規定期限內提出申請，逾期不予受理。 (二)申請者如係客家團體，除應檢附團體立案或登記證明、負責人當選證書或相關證明文件、組織章程及社團基本資料外，其他申請表件及程序同前項個人之規定（ 電子檔請一併送交本會 ）。 三、計畫書內容應包括計畫名稱、目的、日期、地點、研習內容、實施方法、時程表、課程一覽表（需註明內、外聘師資授課日期）、學員名冊、經費來源、經費明細表、預期效益等。計畫書請用A4紙張直式橫書繕打。 四、應詳列全部經費內容及向本會申請經費之項目及金額，若有申請其他政府機關補助或委託類似計畫者，應列明申請各該機關補助或委託項目及金額。 五、表件不全者，本會得請申請者限期補正一次，未於規定期限內補正者，本會得不予受理。 肆、其他補助內容及規定詳見「補助臺北市市民或立案臺北市客家團體辦理客家文化語言相關研習計畫」；如有任何疑問，可洽詢文教推廣組，聯絡電話：(02)2702-6141轉221。","u":"臺北市政府客家事務委員會","h":6327,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1441BFFD484ACAC3","d":"2026-06-29","sid":"1441BFFD"},{"q":"如何申請「本市國中、小學推行客家語傳承及文化推廣計畫」補助？","a":"一、申請資格：本市各公私立國中、小學，且願意配合本府客家語言推廣政策，開辦客家語言、文化相關課程、活動者。\n二、申請時間：每年年初於本會網站公告相關補助計畫，也會發函檢送計畫內容至本市各國中、小學，歡迎各校提出申請。\n三、申請方式：採網路申辦，請於申請期限內上「 台北服務通 」點選補助臺北市國中小學推行客家語傳承及文化推廣計畫提出線上申請。\n四、其他補助內容及規定詳見「補助臺北市國中小學推行客家語傳承及文化推廣計畫」；如有任何疑問，可洽詢文教推廣組，聯絡電話：(02)2702-6141轉222。","u":"臺北市政府客家事務委員會","h":6248,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5EE5EFD447B23717","d":"2026-06-26","sid":"5EE5EFD4"},{"q":"如何申請「補助臺北市幼兒園辦理客語教學實施計畫」？","a":"壹、申請資格：本市經主管機關登記有案之公、私立幼兒園，且願意配合本府客家語言推廣政策，開辦客家語言、文化相關課程、活動者。 貳、申請時間：每年年初於本會網站公告相關實施計畫。 參、申請方式： 一、網路申辦：各申請單位符合資格者請登入「 台北服務通 」進行線上申請->選擇申辦案件「客委會」->點選【補助臺北市幼兒園辦理客語教學實施計畫】->依步驟網路申辦。\n二、計畫書內容應包含計畫名稱、教學計劃、課程時間表等。\n三、各單位申請計畫書內應詳列全部經費內容及向本會申請經費之項目及金額，同時間若有申請其他政府機關補助或委託類似計畫者，應列明申請各該機關補助或委託項目及金額。\n四、表件不全者，本會得請申請單位限期補正一次，未於規定期限內補正者，本會得不予受理。 肆、其他補助內容及規定詳見「補助臺北市幼兒園辦理客語教學實施計畫」；如有任何疑問，可洽詢文教推廣組，聯絡電話：(02)2702-6141轉228。","u":"臺北市政府客家事務委員會","h":6092,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1F987025A735D400","d":"2026-06-30","sid":"1F987025"},{"q":"如何申請「本市客家歌謠班辦理客家歌謠及客語學習等計畫」補助？","a":"壹、申請資格： 本市立案之非營利公益社團所屬歌謠班者。 貳、申請時間：每年年初於本會網站公告相關實施計畫。 參、申請方式：\n一、網路申辦：各申請單位符合資格者請登入台北服務通進行線上申請;選擇申辦案件「客委會」;點選【補助本市客家歌謠班辦理客家歌謠及客語學習等計畫】;依步驟網路申辦。\n二、紙本申辦：各申請單位符合資格者應於申請期限內檢具申請書、團體立案或登記證明、負責人當選證書或相關證明文件、組織章程或社團基本資料、師資聘書、研習課程計畫書、公職人員及關係人身分關係揭露表及其他說明資料各一份申請書表件請至臺北市政府客委會官網首頁/業務資訊/支付或接受之補助/111下載，或電洽承辦人索取電子檔；請務必併送申請資料電子檔），於本會規定期限內免備文掛號郵寄或親送本會，逾期不予受理。以上申請案件俟補助經費用罄後,即不再接受申請。\n三、計畫書內容應包括計畫名稱、目的、日期、地點、研習內容、實施方法、時程表、課程一覽表（需註明內外聘師資授課日期）、學員名冊、經費來源、經費明細表、預期效益等。計畫書請用A4紙張直式橫書繕打。\n四、各申請單位申請計畫書內應詳列全部經費內容及向本會申請經費之項目及金額，同時間若有申請其他政府機關補助或委託之類似計畫者，應列明申請各該機關補助或委託項目及金額。\n五、表件不全者，本會得請申請單位限期補正一次，未於規定期限內補正者，本會得不予受理。\n肆、其他補助內容及規定詳見「本市客家歌謠班辦理客家歌謠及客語學習等計畫」；如有任何疑問，可洽詢文教推廣組，聯絡電話：(02)2702-6141轉227。","u":"臺北市政府客家事務委員會","h":5480,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A67019805CCB480B","d":"2021-07-01","sid":"A6701980"},{"q":"如何申請「本市優異客家藝文團體推廣客家文化計畫」補助？","a":"一、申請資格：\n於本市立案之非營利法人或非法人團體，或立案地址在本市之全國性組織。\n二、申請時間：每年年初於本會網站公告相關實施計畫。\n三、申請方式：\n(一)各申請單位應於申請期限內於台北服務通以線上申辦方式申請。\n(二)計畫書應明確陳述申請案之計畫特色，須含計畫名稱、目的、計畫日期（起迄時間）、計畫辦理地點、經費來源及明細、計畫內容（包含節目或活動流程）、實施方法、其他(如過去辦理活動照片、成果說明等)。計畫書請用A4紙張直式橫書繕打。\n(三)各單位申請計畫書內應詳列全部經費內容及向本會申請經費之項目及金額，團體自籌經費須符合所提計畫經費50%(含)以上，若有申請其他政府機關補助或委託類似計畫者，應列明申請各該機關補助或委託項目及金額。\n(四)表件不全者，本會得請申請單位限期補正一次，未於規定期限內補正者，本會得不予受理。\n四、其他補助內容及規定詳見「補助優異客家藝文團體推廣客家文化計畫」；如有任何疑問，可洽詢文教推廣組，聯絡電話：(02)2702-6141轉225。","u":"臺北市政府客家事務委員會","h":5189,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C78D63C974A582A2","d":"2026-06-26","sid":"C78D63C9"},{"q":"客家各會館的地址及開放時間?","a":"客家文化會館 地　　址：10658 臺北市大安區信義路三段 157 巷 11 號 電　　話：02-27026141 傳　　真：02-27026154 開放時間：週一至週五 -- 每日早上 9 時至晚上 9 時。 週六至週日 -- 早上 9 時至下午 5時。 政府公告之放假日為休館日，不對外開放。\n客家藝文活動中心 地　　址：106 臺北市大安區新生南路一段 157 巷 19 號 3 樓 電　　話：02-27093234 傳       真：02-27094443 開放時間：週一至週五 -- 每日早上 9 時至晚上 9 時。 週六至週日 -- 早上 9 時至下午 5時。 政府公告之放假日為休館日，不對外開放。\n(臺北市客家文化題公園)臺北市客家文化中心 地　　址：10087 臺北市中正區汀州路三段 2 號 電　　話：02-23691198 傳　　真：02-23697660 開放時間：週一至週五 -- 每日早上 9 時至晚上 9 時。 週六至週日 -- 早上 9 時至下午 6時。 週一休館，適逢國定假日照常開放。\n(臺北市客家文化題公園)臺北市客家音樂戲劇中心 地　　址：10087 臺北市中正區汀州路三段 2 號 電　　話：02-23691198 傳　　真：02-23697660 開放時間：週一至週五 -- 每日早上 9 時至晚上 9 時。 週六至週日 -- 早上 9 時至下午 6時。 週一休館，適逢國定假日照常開放。\n臺北市客家圖書影音中心 (委託營運單位：財團法人台北市客家文化基金會) 地　　址：10093 臺北市中正區羅斯福路一段 95 巷 1 號 電　　話：02-23973733 傳　　真：02-23973755 開放時間：週二-週六1000-2100 週一、日及政府公告之放假日為休館日，不對外開放。","u":"臺北市政府客家事務委員會","h":4528,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AD980E9CFFCBF976","d":"2026-06-26","sid":"AD980E9C"},{"q":"客委會志工的工作性質、內容及服務時間為何？","a":"一、志工的工作性質及內容：\n(一)經常性櫃檯執勤服務及至社區推廣客家文化體驗活動。\n(二)參與志工感恩大會等活動，增進彼此情感與經驗分享。\n(三)參與志工教育訓練，加強提升客家志工專業能力，對客家文化與志願服務業務有更深入的了解，進而提供市民更優質的服務。\n(四)本會舉辦相關文化活動時，協助活動之進行。\n二、服務時間：\n周一至周五：9至12時、12至15時、15至18時共分三班。\n周六至周日： 9至12時、12至15時共分二班。\n如有任何疑問，可洽詢研究發展組，連絡電話：(02)27026141轉216。","u":"臺北市政府客家事務委員會","h":4338,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=51A1F583D8283509","d":"2026-06-26","sid":"51A1F583"},{"q":"如何購買本會出版品？","a":"如何購買本會出版品\n一、展售門市\n臺中市北屯區軍福七路600號\n其餘門市請查詢→ 五南文化廣場門市資訊\n二、網路書店(可以「臺北市政府客家事務委員會」關鍵字搜尋)\n1. 國家網路書店\n2. 五南網路書店\n3. 博客來網路書店\n相關疑問可至OPEN政府出版品資訊網(https://gpi.culture.tw/)查詢\n如有任何疑問，可洽秘書室，聯絡電話：(02)2702-6141轉326","u":"臺北市政府客家事務委員會","h":4279,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AC095EC1FE3E1A14","d":"2026-06-30","sid":"AC095EC1"},{"q":"如何成為客委會的值班志工?申請資格是什麼?","a":"一、申請資格：需對客家文化充滿熱誠，願意學習客語，俾利於櫃檯服務期間能以客語回答來電或來賓之查詢問題。\n二、申請方式：須具備已完成志願服務基礎訓練（6小時）課程（於報名時檢附），並至客家會館向志工督導索取加入志工服務申請書，填妥個人資料並提供 1 吋照片(含電子檔)，待完成特殊訓練及審核通過後，由本會製發志工服務證，即為本會正式志工夥伴。\n如有任何疑問，可洽詢研究發展組，聯絡電話：(02)2702-6141轉216。","u":"臺北市政府客家事務委員會","h":3745,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=ED8F761814AE56D5","d":"2026-06-26","sid":"ED8F7618"},{"q":"臺北市客家圖書影音中心開放借閱時間？","a":"週二-週六1000-2100\n週一、日及政府公告之休假日為休館日，不對外開放。\n申請借閱證及借還書在閉館前1小時停止受理。\n地　　址：臺北市中正區羅斯福路一段95巷1號\n電　　話： 02-23973733分機10、11\n除了館藏及場地租借外，如有其他問題，可洽詢臺北市政府客家事務委員會研究發展組，聯絡電話：(02)2702-6141轉217。","u":"臺北市政府客家事務委員會","h":3466,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=983EC144C58C50FD","d":"2026-06-26","sid":"983EC144"},{"q":"何謂「臺北客家義民嘉年華」？","a":"「臺北客家義民嘉年華」為臺北具指標性重要慶典，每年到了這個重要的時刻，都會匯集全臺無數客家人，也有來自海外的客家鄉親，大家一起熱情投入義民祭典的籌劃與辦理。\n早期，從民國77年開始是由民間自發舉辦義民祭典，當時是新竹新埔義民廟創建二百周年時，由台北市中原客家崇正會恭請新埔義民廟本廟義民爺北上祈福，讓旅居大臺北地區的客家鄉親就近祭拜。直到89年由官方主辦，97年改於10月以嘉年華形式舉辦，打造全國最盛大義民慶典。\n義民嘉年華不僅保留了傳統的祭祀儀式，如迎神遶境、挑擔奉飯、安座大典、主祭大典、送神大典，還結合了現代元素，通過創意踩街和藝文展演等活動，讓更多年輕人認識和參與客家文化。\n本會融合「傳統」與「創新」，每年邀請全臺各地義民爺集結臺北，以慶典形式辦理「臺北客家義民嘉年華」活動，希望鼓勵客家鄉親積極投入，活化民間參與，並以移民節慶觀點導入，提高多元族群參與，開創都會型客家慶典典範。\n活動主要透過「祭典」、「遊行」、「展演」及「市集」四大核心活動下，型塑都會客家慶典新樣貌呈現客家文化價值，並強化下列4項重點：\n1.擴大並活化民間參與，強化民間辦理的主體。以公私協力與異業結盟方式，增進鄰里互動。\n2.增進臺北客家文化的活力與創意，吸引跨世代及跨族群的參與。\n3.透過「在地化」、「產業化」、「國際化」以及「年輕化」等多角化籌劃，深刻呈現客家多元面貌。\n4.塑造本活動成為臺北市重要移民節慶，提高客家文化的能見度，探觸下一個客家，打造深具客家特色的城市藝術節。","u":"臺北市政府客家事務委員會","h":1459,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EEFCB797015F8FD0","d":"2026-06-26","sid":"EEFCB797"},{"q":"與臺北市政府客家事務委員會合作的廣播電臺(節目)有哪些？","a":"與臺北市政府客家事務委員會合作的廣播電台有寶島客家廣播電臺(FM93.7)為客語發音，另外臺北廣播電臺(FM93.1)亦有播出客語的節目。如有任何疑問，可洽詢研究發展組，聯絡電話：(02)2702-6141轉216。","u":"臺北市政府客家事務委員會","h":1297,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A656BEB7F14128DD","d":"2020-11-02","sid":"A656BEB7"},{"q":"「臺北市客家文化主題公園」相關常見問題","a":"親愛的鄉親、市民朋友，您好！\n「臺北市客家文化主題公園」開放時間如下：\n戶外園區全天開放。\n場館開放時間(音樂戲劇中心、客家文化中心 )\n星期二至星期日09：00-18：00(逢國定假日照常開放 )。\n星期一休館。\n如有任何疑問，可洽詢研究發展組專人處理，聯絡電話：(02)2702-6141#217。","u":"臺北市政府客家事務委員會","h":1230,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=42A298E45D732F48","d":"2026-06-26","sid":"42A298E4"},{"q":"如何閱覽客家文化季刊？","a":"配合本府無紙化政策，本會出版之客家文化季刊改以電子化形式發行，預計於每年4月、7月、9月及12月出版。民眾可於本會網站「客家文化季刊」項目下，下載閱覽當期季刊。如有任何疑問，可洽詢文教推廣組，聯絡電話：(02)2702-6141轉222。","u":"臺北市政府客家事務委員會","h":1121,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=99B107480D6C702B","d":"2026-06-26","sid":"99B10748"},{"q":"臺北市客家圖書影音中心收藏內容為何？","a":"一、圖書影音中心針對臺灣之「客家文物」、「客庄文化資產」「圖書文獻」、「影音資料」，結合官方、學界、產業及民間組織力量，進行紀錄、收藏與各項數位學習開發，開幕迄今共收藏1萬3,000餘冊書籍、DCD、VCD 及二百餘冊電子書。\n二、為了讓民眾了解圖書館藏，B1館藏區特以童趣方式呈現各項客家意象，吸引來館民眾親近客家史料蒐集並方便了解館藏圖書分類。內容包括如：史地類(客家建築)、影音、社會科學類(服飾、民謠)、應用科學類(藥材、私房菜)、自然科類、美術類(皮影戲、戲曲)、史地類(西洋)、六堆、百家姓、宗教類(三山國王、義民爺、保生大帝)、論文、哲學類(兒童發展、心理學)、總類、語文類(客家諺語)。\n如有任何疑問，可洽詢圖書影音中心場管人員，聯絡電話：(02)23973733分機11、10\n其他問題可聯絡研究發展組聯絡電話：(02)2702-6141轉217。","u":"臺北市政府客家事務委員會","h":1088,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CF53F414F2F3DA0E","d":"2026-06-26","sid":"CF53F414"},{"q":"如何申請「客家學術、社區營造、政策推廣、音樂及劇本創作等」補助？","a":"一、申請資格：\n(一)個人：年滿二十歲，具行為能力且設籍於臺北市（以下簡稱本市）之市民。\n(二)團體：會址設於本市立案之法人或非法人團體或立案地址在本市之全國性組織。\n(三)公、私立大學碩、博士研究生，得申請學術調查研究補助，不受前項第一款之限制。\n二、申請方式：\n(一)紙本申辦(掛號郵寄申請、專人送達等)。\n(二)線上申請:加入台北卡3.0網站登入台北服務通。\n(三)各申請單位（個人）應於申請期限內檢具計畫書及相關申請文件（申請表請上本會網站下\n載）向本會提出申請。\n(四)申請計畫書內應詳列全部經費內容及向本會申請經費之項目及金額，若同一案件向2個以上機關提出申請補（捐）助，應列明全部經費內容，及向各機關申請補（捐）助之項目及金額。如有隱匿不實或造假情事，本會得撤銷該補(捐）助案件，並收回已撥付款項。\n(五)表件不全者，本會得請申請單位（個人）限期補正一次，未於規定期限內補正者，本會得不予受理。\n三、其他補助內容及規定詳見「補助客家學術、社區營造、政策推廣、音樂及劇本創作」；如有任何疑問，可洽詢研究發展組，聯絡電話： (02)2702-6141轉213。","u":"臺北市政府客家事務委員會","h":575,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D2BA777AE739ACB7","d":"2020-11-02","sid":"D2BA777A"},{"q":"有關臺北市客家文化主題公園辦理活動音量管控問題","a":"一、臺北市客家文化主題公園是由臺北市政府客家事務委員會(以下簡稱客委會)委託財團法人臺北市客家文化基金會(以下簡稱客基會)經營管理。\n二、客基會辦理(外借)各項辦理活動活動期間，除於各項活動辦理前皆與主辦單位、音響廠商溝通擴音設備音量掌控問題，活動期間客基會同仁依照環保局噪音測量規範(日間7:00-19:00音量不得超過72分貝、晚間19:00-22:00音量不得超過57分貝、夜間22:00-07:00音量不得超過47分貝），在現場定時與不定時檢測，以掌控擴音設備之音量。\n三、客基會亦於「臺北市客家文化主題公園場地使用申請表」中修訂音量超標時相關罰則，藉此督導、規範外借單位控制音量，降低活動辦理時對周邊鄰居的影響。不遵守管理規定或違反情節重大者，將通知有關單位到場開罰，或依規定要求停止使用場地。使用單位未遵活動音量管制規定，嚴重影響周遭居民生活，核屬情節重大者，一年內不再接受申請。\n四、客委會將持續督導客基會對於園區內活動音量的掌控，避免造成周邊鄰居的困擾與影響。\n五、若對活動音量控管上有疑問或建議，歡迎聯絡客基會行政管理中心組員鄭小姐（02-23691198分機334)，將竭誠為您服務，謝謝。","u":"臺北市政府客家事務委員會","h":408,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=887D7660C12FEB83","d":"2024-02-26","sid":"887D7660"}]},{"org":"中山堂管理所","total":18,"items":[{"q":"請問中山堂開館時間為何？","a":"週一至週日9:30～17:00，原則春節期間（除夕至初四）及每月第1週星期一休館（實際休館時間依本所公告為準）。","u":"臺北市中山堂管理所","h":338,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DFEF1470806774ED","d":"2025-07-29","sid":"DFEF1470"},{"q":"請問中正廳觀眾席位是幾席？","a":"中正廳觀眾席位共1,100席，一樓座位數640席（包含輪椅席10席、陪同席10席），二樓座位數460席。","u":"臺北市中山堂管理所","h":338,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=11CC2CBD303D62B4","d":"2025-07-18","sid":"11CC2CBD"},{"q":"請問中山堂餐飲服務時間及洽詢電話？","a":"本所目前餐飲服務位於4F之劇場咖啡，營業時間是11:00至19:00，農曆年初夕至初四與每月第一週的週一配合中山堂休館停止營業。\n洽詢電話：02-2331-5055","u":"臺北市中山堂管理所","h":319,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D5F07F104178825B","d":"2025-07-26","sid":"D5F07F10"},{"q":"請問中山堂有哪些導覽服務？該如何申請？","a":"中山堂提供下列4種導覽服務，其中定時與團體導覽，請於導覽時間至一樓大廳（延平南路正門進左側）志工接待室集合。\n1.定時導覽：平日10:00｜14:00｜16:00\n假日10:00｜11:00｜14:40｜16:00\n2.團體預約導覽：\n(1)請於一週前至 台北服務通 填寫申請表格。\n(2)受理每團人數為10人以上，30人以下（每日團體導覽以2個場次為限，額滿為止）。\n3.語音導覽機租借：\n請持本人身分證、健保卡或學生證等有效證件，至一樓大廳服務台（延平南路正門進入右側）借用。\n4.QRcode：\n可掃描館內展示牌上QRcode，提供語音及文字導覽。","u":"臺北市中山堂管理所","h":297,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FAD636049E040FA7","d":"2025-07-25","sid":"FAD63604"},{"q":"我想了解關於黃土水「水牛群像」這件作品？","a":"位在光復廳正門前方的大型浮雕作品《南國》，也稱為《水牛群像》，為臺灣第一位雕塑家黃土水先生於1930年創作的巨幅石膏淺浮雕作品，黃土水先生於完成這件作品後隨即因病過世。1936年12月，他的遺孀黃廖秋桂女士將《水牛群像》捐贈給臺北市役所，而市役所決定將之鑲嵌在臺北公會堂中央樓梯牆面上。因尺寸巨大，擔心作品由日本船運回臺時石膏會碎裂，故切解成8塊石膏板，抵臺時再接合。《水牛群像》於1937年正式對外展出，是臺灣第一件大型室內公共藝術作品，並於2009年指定為國寶，也是臺灣第一件二十世紀的國寶，成為中山堂的「鎮堂之寶」。《水牛群像》由5隻水牛和3個牧童為主體所構成的畫面，透過芭蕉園、臺灣水牛、戴斗笠裸身牧童，刻劃出早期臺灣特有之亞熱帶風情。","u":"臺北市中山堂管理所","h":259,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B284B1FDBD3A906F","d":"2025-07-14","sid":"B284B1FD"},{"q":"請問中山堂有電梯嗎？","a":"中山堂設有兩部電梯，位於一樓後臺區域，有需求的民眾可由秀山側門入內，並請保全協助引導使用。","u":"臺北市中山堂管理所","h":250,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F6660A8E99719C73","d":"2025-07-27","sid":"F6660A8E"},{"q":"我想了解中山堂古蹟特色？","a":"1920年代，臺灣建築風潮從之前的西洋歷史式樣，轉向現代主義；過渡期出現一批兼採兩種風格的建築。1936 年落成的臺北公會堂，外觀極具風格，猶如一塊以大型積木為主體的建築，旁邊依附十塊中小型積木所建構堆砌而成。主體大積木中後段三分之二處，以中央樓梯分隔為東側大集會室(現中正廳)與西側之大宴會場(現光復廳)，南北二側則構成展覽室與迴廊等空間。\n臺北公會堂整體造型大體維持均衡的對稱性，而建材採用鋼筋混凝土、面磚，外貌以幾何線條為主，簡潔明朗，呈現現代主義精神。建築風格上，降低明治維新以來盛行的希臘羅馬建築樣式，轉向其他古文明取材，形成特殊的折衷風格。\n入口有厚重拱形門廊，部分立面鑲飾歷史語彙，屬於西洋歷史式樣的特色，更可見以臺式紅陶瓦為素材組砌而成，中國傳統「方勝」造型的通氣窗，戶外則有高懸在山牆正立面，沿著女兒牆鋪排延伸的紅陶瓦片，妝點出閩南風情，外牆雨庇，以綠色中式琉璃瓦裝飾，洋溢東方建築韻味。","u":"臺北市中山堂管理所","h":247,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F59E634A939A57C6","d":"2025-07-12","sid":"F59E634A"},{"q":"請問中山堂今年休館日期為何？","a":"115年每月週一休館日期如下(含4F劇場咖啡)：\n1月5日、2月2日、3月16日、4月13日、5月4日、6月1日、7月13日、8月3日、9月7日、10月5日、11月2日、12月7日。","u":"臺北市中山堂管理所","h":222,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7DA3D08713F9F989","d":"2025-07-28","sid":"7DA3D087"},{"q":"請問劇場咖啡營業時間？如何抵達？","a":"劇場咖啡營業時間是11:00至19:00，農曆年初夕至初四與每月第一週的週一配合中山堂休館停止營業。\n劇場咖啡位於中山堂4樓(近酉陽街側)：\n1. 11:00-17:00本所開館期間：自延平大門進出或自秀山側門搭電梯上4樓。\n2. 17:00-19:00本所閉館期間：一律自秀山側門搭電梯上4樓。","u":"臺北市中山堂管理所","h":221,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6441E3449E164F8F","d":"2025-07-24","sid":"6441E344"},{"q":"我想了解廣場國父銅像這件作品？","a":"孫中山先生銅像／2008年臺北市政府登錄為臺北市「一般古物」\n《孫中山銅像》高約300公分，身著西式禮服，外穿大衣，左手下垂執演講稿一卷，雙目平視，炯炯有神但又透露出溫暖關懷，有一種為理想奔走不懈的寓意，外形為西方知識份子的形象，但精神的表現上蘊含東方的特質。造型、服裝、手勢與姿態的選擇，等都能勾勒出中山先生以知識份子所流露出來的悲天憫人情懷。\n雕塑家蒲添生\n中山堂廣場東北角的《孫中山銅像》，為雕塑家蒲添生的作品。1912年出生於臺灣嘉義的蒲添生，於1932年進入日本東京美術學校學習繪畫，1934之後師事日本雕塑大師朝倉文夫，從此走向雕塑之路。1941年蒲添生學成歸國，主要從事人物雕像創作，其作品精準忠實刻劃人物精神，為臺灣西洋古典雕塑發展奠定基礎。這座孫中山先生銅像落成於1949年，是臺灣第一座由本土藝術家完成的戶外大型銅像。","u":"臺北市中山堂管理所","h":218,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=993483FF4EBFE002","d":"2025-07-13","sid":"993483FF"},{"q":"請問如何得知中山堂的展演資訊？","a":"本所節目資訊可由《中山堂藝事》節目手冊及《中山堂藝想報》電子報取得。\n節目手冊紙本可於本所及本市各藝文展演單位、區公所等地索取。\n節目手冊電子書可於本所官網首頁查閱。\n電子書可於本所官網首頁查閱。\n(1)《中山堂藝事》節目手冊：每年發行4期，第一期為2至4月、第二期5至7月、第三期8至10月、第四期11至1月，每期出刊日為1月25日、4月25日、7月25日、10月25日。\n(2)《中山堂藝想報》電子報：每年發行12期，每月30日前出刊次月電子報，歡迎訂閱（ 訂閱連結 ）。","u":"臺北市中山堂管理所","h":202,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B1B9ACB32B90C403","d":"2025-07-23","sid":"B1B9ACB3"},{"q":"請問如何租用中正廳？","a":"中正廳檔期申請採「外聘委員審議制度」，每年7月1日至7月31日受理申請次年度檔期。\n檔期及申請表格資料，可於 本所網站 或 台北服務通 頁面查詢與下載。","u":"臺北市中山堂管理所","h":202,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4DF07C530AC6A02D","d":"2025-07-21","sid":"4DF07C53"},{"q":"請問中山堂場地租借費用為何？","a":"中山堂場地資料及收費基準 本所場地租借費用請參考「臺北市中山堂管理所場地使用收費基準」，可於本所官網首頁熱門服務「中山堂場地資料及收費基準」下載。","u":"臺北市中山堂管理所","h":195,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=96503D2511096AC8","d":"2025-07-19","sid":"96503D25"},{"q":"請問如何租用中山堂其他場地（含光復廳、廣場、臺北書院及展覽室）？","a":"每年7月起開放申請次年度1月至12月檔期，一律於市民服務大平臺受理，至遲應於使用前一個月提出申請。檔期及申請表格資料可於 台北服務通 頁面查詢與下載。","u":"臺北市中山堂管理所","h":190,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64D269347DA19FF2","d":"2025-07-20","sid":"64D26934"},{"q":"請問如何查詢中正廳、光復廳、廣場、臺北書院及展覽室檔期？","a":"請至 台北服務通 查詢，或電洽本所業務組洽詢。\n中正廳／廣場：02-23813137轉103\n光復廳：02-23813137轉102\n臺北書院／展覽室：02-23813137轉105","u":"臺北市中山堂管理所","h":184,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EC166CF1310B937D","d":"2025-07-22","sid":"EC166CF1"},{"q":"請問如何申請中山堂影視拍攝？","a":"本所影視拍攝請統一由台北市電影委員會協助申請，影委會洽詢電話為02-2709-3880。","u":"臺北市中山堂管理所","h":160,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=37B151BCD2E97C12","d":"2025-07-15","sid":"37B151BC"},{"q":"請問中山堂場地技術資料在哪？","a":"本所提供中英文場地技術資料，「2024年最新版中山堂場地中英文技術手冊與圖檔」可於本所官網首頁熱門服務「 中山堂場地資料及收費基準 」下載。","u":"臺北市中山堂管理所","h":147,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=98D1902D0BF7F783","d":"2025-07-17","sid":"98D1902D"},{"q":"請問光復廳容留人數是幾人？","a":"光復廳觀眾、演出與工作人員容留總數350人。","u":"臺北市中山堂管理所","h":146,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6FA69B255857F7CC","d":"2025-07-16","sid":"6FA69B25"}]},{"org":"職能發展學院","total":18,"items":[{"q":"請問技術士證遺失或補發證照該如何辦理?","a":"請洽詢技能檢定中心，電話04-22595700轉411或至其官網(https://www.wdasec.gov.tw/技能檢定/ 技能 檢定報檢流程與費用/技術士證換補發申請及發證進度查詢)下載【技術士證換、補發申請書】依照該申請書說明辦理。線上申請者，請由下列網址進入(https://eservice.wdasec.gov.tw/www/CC91M) 依照說明申請。","u":"臺北市職能發展學院","h":16923,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD4FB6287AAEFCAE","d":"2020-08-18","sid":"CD4FB628"},{"q":"請問我現在失業中沒有工作,如果參加政府的職訓課程是否有補助或津貼?","a":"答：只要您目前確實是失業中(無勞保或其它軍公教保險投保紀錄)，參加政府主辦的全日制職業訓練課程且符合政府規定申請資格，得申請職業訓練生活津貼，保障您參訓期間的基本生活需求。","u":"臺北市職能發展學院","h":5316,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FAD262F53A9B8017","d":"2018-11-26","sid":"FAD262F5"},{"q":"請問如果我申請職訓生活津貼每月可領到多少錢?如何計算?","a":"答： 1.職訓生活津貼核發金額會依您勞工保險退保前6個月平均投保薪資之60%(就業保險法之非自願離職者)或基本工資之60%(就業服務法之特定對象)發給，最長發給6個月。 2.請領月數計算方式為參訓日起每30日為1個月，第1個月須滿30日才發放，第2個月開始未滿30日者，10日以上且訓練時數達30小時發放半個月，20日以上且訓練時數達60小時發放1個月，確切可領取金額還需依您實際參訓日數而定。","u":"臺北市職能發展學院","h":5258,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=92AFC517B21F351C","d":"2018-11-26","sid":"92AFC517"},{"q":"職能培育（職前訓練）及職能進修上課時間？","a":"答：職能培育（職前訓練）課程上課時間原則為每週一至週五上午08:30至下午17:05，部分課程時間另有安排，詳細情形請參考各梯次招生簡章；職能進修課程則依各班實際上課時間為準，詳細情形仍請參考各梯次招生簡章。","u":"臺北市職能發展學院","h":3533,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7AF884FAACEDC34E","d":"2018-11-26","sid":"7AF884FA"},{"q":"臺北市職能發展學院有開哪些職類（班）？","a":"答：本學院每年規劃職能培育（職前訓練）及職能進修課程，並分梯次招生報名，計有資訊服務職類、設計服務職類、通訊媒體職類、照顧服務職類、物業管理職類、觀光休閒 職類 、工業工藝文創職類及汽機車保修職類等八大類，相關開課資訊請至學院官網自辦招生訊息查看，或電洽(02)2872-1940諮詢。","u":"臺北市職能發展學院","h":3469,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6CB145E7D7CF4CF6","d":"2018-11-26","sid":"6CB145E7"},{"q":"失業民眾如何報名職能培育（職前訓練）課程？","a":"答:\n(1)採掛號郵寄報名資料方式報名（於報名截止前（以郵戳為憑）郵寄至本學院「臺北市士林區士東路301號」）。\n(2)各職科開放2日（詳細日期請參考簡章說明），於本學院志工服務台受理現場報名（受理時間為09:00-12:00及13:30-16:30），其餘日期仍僅受理郵寄報名。\n(1)如符合「就業保險被保險人非自願離職失業者」〈有一定雇主非自願性失業者〉，須在報名截止日前至公立就業服務機構完成推介手續後，檢附推介資料報名。\n(2)如符合就業服務法第24條「特定對象失業者」，須檢附身分證明文件，可參考各梯次招生簡章。","u":"臺北市職能發展學院","h":2840,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1C67826F79ADD8FC","d":"2018-11-26","sid":"1C67826F"},{"q":"職能培育（職前訓練）課程與職能進修課程是否需要費用？","a":"答：本學院職能培育（職前訓練）課程所需費用均由政府負擔，參訓學員免付學費；職能進修課程屬在職進修性質，故依「使用者付費」之精神與原則辦理，酌收部分負擔費用。","u":"臺北市職能發展學院","h":2815,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E3ABCA4E26CD699C","d":"2018-11-26","sid":"E3ABCA4E"},{"q":"請問如果我想要申請職訓生活津貼.必須具備何種資格?","a":"答：職訓生活津貼有2種: 1.如果您是就業保險法所說的非自願離職而失業者、需要提供相關證明向公立就業服務機構辦理求職登記並推介參加職業訓練。 2.或您是就業服務法第24條第1項具有特定對象身分的失業者(如獨力負擔家計者、高齡及中高齡者、身心障礙者、原住民、低收入戶或中低收入戶中有工作能力者、長期失業者、二度就業婦女、家庭暴力被害人、更生受保護人、15歲以上未滿18歲未就學未就業少年等)，或失業之新住民(新住民指與在中華民國境內設有戶籍之國民結婚，獲准居留依法得在臺灣地區工作之外國人、大陸地區人民、香港居民或澳門居民)。","u":"臺北市職能發展學院","h":2752,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5227F7F9A4D14209","d":"2018-11-26","sid":"5227F7F9"},{"q":"在臺北市職能發展學院受訓，有幫學員投保勞、健保嗎？","a":"答：本學院職能培育（職前訓練）及進修課程受訓的學員，在受訓期間依相關規定辦理投保作業；健保部份由學員自行負擔，請依全民健康保險法規定之身分別至所屬投保單位辦理加保手續。","u":"臺北市職能發展學院","h":2717,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0832364F1E3E47FA","d":"2018-11-26","sid":"0832364F"},{"q":"報名臺北市職能發展學院職能培育（職前訓練）暨職能進修課程後，何時會知道是否錄取？","a":"答： 依據您報名的課程類型，錄訓名單公告時間如下： 1.職能培育（職前訓練）： 甄試後8個工作日內於本學院公告欄(姓名全名)及官網公告錄訓名單，並於公告後3個工作日內以簡訊發送甄試結果通知。 2.職能進修： (1)非屬進階課程： *報名截止後8個工作日內於本學院官網公告錄訓名單，倘尚有名額，則依序通知備取者依期限繳費，併同時於官網更新錄訓名單及繳費情形。 *完整錄訓名單將於本學院公告欄(姓名全名)公告。 *公告後3個工作日內以簡訊發送錄訓通知。 (2)進階課程甄試後8個工作日內於本學院公告欄(姓名全名)及官網公告錄訓名單，並於公告後3個工作日內以簡訊發送甄試結果通知。 3.作業時間適逢假日或不可抗力事件（如颱風、地震、豪雨等天災），將往後順延。","u":"臺北市職能發展學院","h":2479,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FB0DF6B089C34ED3","d":"2018-11-26","sid":"FB0DF6B0"},{"q":"報名參加職能培育（職前訓練）或進修課程是否有身分條件限制或設籍限制？","a":"答：年滿15歲以上民眾，設籍不限臺北市，皆可報名；但因各班課程性質不同，各班相關資格要件依各梯次招生簡章辦理。","u":"臺北市職能發展學院","h":2407,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6C3AC2220019E12E","d":"2018-11-26","sid":"6C3AC222"},{"q":"哪些身分的失業者無法申請職訓生活津貼?","a":"答： 1.已領取公教人員保險養老給付、勞工保險養老給付、軍人退休俸、或公營事業退休金者，無法申請。但，如您符合社會救助法之低收入戶或中低收入戶身分，領取中低收入老人生活津貼或身心障礙者生活補助費者，仍得申請。 2. 2年內已領取就業促進津貼實施辦法或就業保險法各項津貼給付(例如職訓生活津貼、臨時工作津貼等)或政府機關其他同性質津貼或補助，已滿6個月。","u":"臺北市職能發展學院","h":2112,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0294719D0561F61A","d":"2018-11-26","sid":"0294719D"},{"q":"臺北市職能發展學院是否提供學員就業媒合與廠商徵才？","a":"答： 1.有關學員就業媒合：本學院會提供相關的廠商徵才資訊，並協助學員與廠商面試僱用。 2.有關廠商徵才：求才公司可進入 本學院網站 http://www.tvdi.gov.taipei 點選首頁上方『輔導服務』，再點選『就業輔導』，接著可看到『求才登記』說明，請依說明由上方功能列進入『表單下載』，點選『求才申請表』，依據表單內容填寫後，傳真至02-28733985，或以電子郵件傳送至tvtca110@gov.taipei，我們將有專人為您服務！","u":"臺北市職能發展學院","h":1984,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0963E3619D2F97D3","d":"2018-11-26","sid":"0963E361"},{"q":"如果我有其他職訓生活津貼的相關疑問可以問誰?","a":"答：如果您對職訓生活津貼有任何疑問或需要更詳細之資訊,可以洽詢各訓練單位之業務承辦人。","u":"臺北市職能發展學院","h":1312,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1DA2E03E549153FA","d":"2018-11-26","sid":"1DA2E03E"},{"q":"新住民 ( 外籍配偶及大陸配偶 ) 是否可參加職業訓練課程？","a":"答：與在中華民國境內設有戶籍之國民結婚，且獲准居留依法得在臺灣地區工作之外國人、大陸地區人民、香港居民或澳門居民(簡稱新住民)，性別不拘，均可報名；各班相關資格要件依招生簡章辦理。","u":"臺北市職能發展學院","h":1225,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FF1A1812591CD416","d":"2018-11-26","sid":"FF1A1812"},{"q":"有關即測即評技術士技能檢定之相關資訊可由何處查詢？","a":"答：相關資訊請至勞動力發展署技術士技能檢定「即測即評及發證等學科測試服務網網站」（https://etest.wdasec.gov.tw/）查詢。","u":"臺北市職能發展學院","h":1164,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=25EE9528E72207ED","d":"2018-11-26","sid":"25EE9528"},{"q":"有關臺北市職能發展學院場地租借事宜?","a":"答:\n本學院辦理「原機工大樓及學員宿舍用地改建工程」施工期間， 考量人員及公共安全，場地暫停對外租借並停止受理租借申請。","u":"臺北市職能發展學院","h":975,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EB844CE4DB9D366C","d":"2018-11-26","sid":"EB844CE4"},{"q":"有關本市促進勞工職業技能補助申請條件?如何申請?","a":"答：\n1.連續設籍本市4個月以上之勞工或於本市連續提供勞務4個月以上之新住民，參加「勞動部推派參加之國際技能競賽」、「勞動部主辦之全國技能競賽」、「本市勞動局主辦之技能競賽」獲獎前三名或取得勞動部核發之甲、乙級技術士證者，或經勞動部認可得比照甲級或乙級之單一級技術士證者，得依「臺北市促進勞工職業技能補助辦法」申請補助。\n2.申請人應於獲獎日或技術士證生效日起三3個月內，備妥(1)申請書、(2)領據、(3)新式戶口名簿（含詳細記事）影本或最近三3個月內之戶籍謄本（如為新住民應提供居留證影本）等證明文件，親送或郵寄至本學院。相關申請表件可至本學院網站（https://www.tvdi.gov.taipei/Default.aspx/表單下載/臺北市促進勞工職業技能補助申請表件）查詢。","u":"臺北市職能發展學院","h":495,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5121878076EFCB68","d":"2025-04-15","sid":"51218780"}]},{"org":"家庭暴力暨性侵害防治中心","total":15,"items":[{"q":"臺北市家庭暴力被害人補助要點相關內容Q&A","a":"一、本市針對家庭暴力被害人有「臺北市特殊境遇家庭扶助（特殊境遇家庭扶助條例第4條第1項第3款家庭暴力受害者）」及「臺北市家庭暴力被害人補助」兩大項補助，相關資訊分述如下：\n(一)臺北市特殊境遇家庭扶助（ 特殊境遇家庭扶助條例 第4條第1項第3款家庭暴力受害者）\n1.補助項目：緊急生活扶助、子女生活津貼 、子女教育補助 、傷病醫療補助 、兒童托育津貼、法律訴訟補助及創業貸款補助。\n2.補助資格：\n(1)設籍臺北市，且最近一年居住國內超過一八三日。但初次申請者，得不受前開居住國內最低日數之限制。新移民與設籍本市市民辦理結婚登記，且實際居住本市者，於尚未取得本國國籍前，得不受設籍限制。\n(2)符合 特殊境遇家庭扶助條例 第四條第一項第三款家庭暴力受害。\n(3)家庭總收入按全家人口平均分配，每人每月未超過當年度公告臺北市平均每人每月消費支出百分之八十，且家庭財產未超過中央主管機關公告之一定金額。\n3.各項補助申請期限：受理申請日期，依申請表件交郵當日郵戳或本局收文戳認定之。\n(1)緊急生活扶助：應於本條例第四條第一項各款情形發生後6個月內提出申請（若112年4月20日遭受家庭暴力之對待，須於112年10月20日前提出申請）。\n(2)延長緊急生活扶助：應於緊急生活扶助補助期滿前，向輔導單位提出申請。\n(3)兒童托育津貼：應於兒童實際就托於托育機構後6個月內提出申請。\n(4)法律訴訟補助：應於提起訴訟起至法院判決確定後6個月內提出申請。\n(5) 傷病醫療補助：應於就診後3個月內提出申請。\n(二)臺北市家庭暴力被害人補助\n1.補助項目：驗傷醫療費用、心理復健費用、安置住宿費用、房屋租金及必要生活費用 、 律師費用 。倘無主責社工服務者，必要時將另案派員訪視評估，並需由本市家防中心審核後認定。\n2.補助資格：\n(1)設籍臺北市之市民。\n(2)合法居留且與設籍本市市民辦理結婚登記或同居關係之無戶籍人士、外國人、大陸地區人民、香港或澳門居民。\n3.各項補助申請期限：\n(1)驗傷醫療費用：每次家庭暴力事件3個月內提出（若112年4月20日遭受家庭暴力之對待，須於112年7月20日前提出申請）","u":"臺北市家庭暴力暨性侵害防治中心","h":4551,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C5AA7F15EE95DD41","d":"2026-02-24","sid":"C5AA7F15"},{"q":"什麼是未成年子女監督會面交往與交付服務呢？","a":"本服務係針對因家庭暴力由法院裁定執行監督會面交往或交付之案件，提供安全中立的環境，維繫家庭暴力之兒少與未同住方之親情。\n「未成年子女監督會面交往（交付）」就是父母關係因家暴事件處於緊張階段(如分居離婚、或取得保護令) ，經法院調解或裁定有未成年子女監督會面需要，由本中心提供適當的環境，並有監督人員陪同，提供未成年子女與未同住親屬監督會面交往（交付）服務，並依實際需要輔以保全人員，維護會面交往（交付）環境的安全，讓父母與未成年子女安心相聚，親情得以延續不間斷；於會面前後，另由社工人員協助與同住及不同住的父母進行親職討論，幫助未成年子女漸進式適應探視。\n一、服務內容：以家庭暴力案件當事人為原則，當事人雙方及其未成年子女，至少有 一方需設籍或實際居住本市，並且符合以下條件之ㄧ：\n(一)經法院裁定進行未成年子女監督會面交往或交付之民事保護令當事人。\n(二)經法院判決或裁定之監督會面交往（交付）案件。\n(三)法院於裁判程序、調解過程中考量未成年子女權利，函文或轉介於審理、調解期間提供未成年子女監督會面交往（交付）服務。\n二、承辦單位：財團法人現代婦女教育基金會，電話：02-2356-0980。","u":"臺北市家庭暴力暨性侵害防治中心","h":3679,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F2A8DAE041CC2F89","d":"2026-02-24","sid":"F2A8DAE0"},{"q":"一般情侶沒有同居遭到對方暴力或威脅時，可以適用家庭暴力防治法嗎？","a":"家庭暴力防治法第63條之1於104年增訂後，於105年2月4日正式施行，有關16歲以上未同居之親密關係暴力將亦得準用保護令相關保護措施。此次修正，對一般大眾影響在於，使得未有同居關係者，亦即一般情侶無論異性或同性之間，只要雙方是以情感或性行為為基礎，發展親密之社會互動關係，於遭到對方不法侵害時，就可以依家庭暴力防治法向法院聲請保護令。若有需聲請保護令可就近至所在地派出所報案或可直接撥打113、110或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。亦可於上班時間直接到管轄地方法院家暴及家事聯合服務中心聲請保護令。","u":"臺北市家庭暴力暨性侵害防治中心","h":3578,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3D88CF3AA71390D3","d":"2026-02-24","sid":"3D88CF3A"},{"q":"若我的孩子目睹家人間的暴力，該如何處理？","a":"若有18歲以下之兒童及少年目睹家庭暴力，可撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。\n本中心亦有結合民間社福團體資源，透過個案及團體輔導方案介入，協助目睹家庭暴力兒童及少年心理創傷之重建與復原，並建立其對暴力之正確認知及因應策略，進而促進其人格健全發展。\n承辦單位:\n財團法人天主教善牧社會福利基金會，負責區域：中正、南港、信義、大安、文山、中山，連絡電話：(02)2381-1123。\n財團法人台北市婦女救援社會福利事業基金會，負責區域：內湖、士林、北投、萬華、松山、大同，連絡電話：(02)2834-7045。","u":"臺北市家庭暴力暨性侵害防治中心","h":2122,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D64F8F85B9C1A65E","d":"2026-02-24","sid":"D64F8F85"},{"q":"我要索取家暴或性侵害宣導品或宣導影片","a":"如需各類宣導素材可至臺北市家庭暴力暨性侵害防治中心網站/業務資訊/文宣品及出版品/家庭暴力防治類、性侵害防治類、兒少保護類、宣導海報類及其他項下下載。","u":"臺北市家庭暴力暨性侵害防治中心","h":2086,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D7A1E89AD7DA5E7A","d":"2026-02-24","sid":"D7A1E89A"},{"q":"孩子被家防中心安置了，家長可不可以跟孩子通話或見面？","a":"一、本中心依「臺北市政府社會局辦理兒童及少年保護個案安置期間會面探視處理原則」，應與兒少本人、探視人(兒少之父母、原監護人及其他重要他人)及現在提供兒童及少年照顧之人等會商，依兒少個別需求與配合服務計畫或特殊情形，擬定會面探視計畫(包含會面探視對象、頻率、方式及地點等，並每3個月檢視執行狀況，依家庭處遇情形及兒少需求修正會面探視計畫)，並納入兒少保護個案之家庭處遇計畫執行。\n二、在擬定會面探視計畫前探視人可先提出申請：\n(一)兒少或探視人得以書面或言詞提出會面探視申請，以言詞提出申請者，本局應確認其意旨後，代為填寫申請表，並由其簽名或蓋章。\n(二)本局受理申請後，應徵詢兒少意見並先與探視人洽定會面探視時間、地點及方式等事項，原則上應同意申請，並於受理申請後5個工作日內回復申請結果，如為不同意者，應以書面敘明不同意之理由及申復方式。\n(三)探視人於收到回復結果倘有不服，得於5個工作日內向本局提出申復。本局受理申復後，應綜合考量，並基於兒少最佳利益，另為其他有助維繫親情之適當處置。\n(四)申請表單及規定請於本市家防中心網站:業務資訊/兒少保護服務/保護個案安置期間會面探視相關表件路徑下載使用。","u":"臺北市家庭暴力暨性侵害防治中心","h":2066,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=26B6C21831716E88","d":"2026-02-24","sid":"26B6C218"},{"q":"「性侵害被害人一站式服務」的服務據點有哪些？","a":"一、臺北市現有6間一站式醫院提供性侵害被害人一站式服務，包括：臺北市立聯合醫院（忠孝院區、陽明院區、和平婦幼院區、仁愛院區、中興院區）以及臺北市立萬芳醫院。\n二、本市自112年5月1日起恢復「性侵害被害人一站式服務」，本市民眾如遭性侵害案件，可依照被害人意願，直接或轉銜至6間一站式醫院，將由本市服務團隊提供性侵害案件驗傷採證及製作筆錄整合性服務，並依需求由本市家防中心社工進行陪同偵訊、評估進行性侵害案件減少被害人重複陳述作業等；如本市民眾無意願轉銜至一站式醫院，仍可於本市19家驗傷責任醫院（詳附件）進行驗傷，並由本市派出所警察協助接送至本市婦幼隊製作筆錄。\n三、如有相關問題可逕洽各一站式服務據點或直接撥打家防中心電話詢問業務承辦人陳社工師（02-23615295轉分機6704）。","u":"臺北市家庭暴力暨性侵害防治中心","h":2037,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A7AA7AAB7E47D11E","d":"2026-02-24","sid":"A7AA7AAB"},{"q":"（一般民眾）要詢問或求助家庭暴力或性侵害事件","a":"若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http://ecare.mohw.gov.tw/進行通報。","u":"臺北市家庭暴力暨性侵害防治中心","h":1587,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6044EDE5AFBACE3D","d":"2026-02-24","sid":"6044EDE5"},{"q":"若遭受配偶、同居人暴力，該怎麼辦？","a":"若遭受配偶、同居人暴力，可撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站 http://ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。 本中心亦有結合民間社福團體資源，提供設籍或居住本市遭受親密關係暴力被害人其 子女或家人服務，以協助降低受暴危機，提昇家庭功能。 承辦單位: 1.財團法人台北基督教女青年會（中正區、萬華區、士林區、北投區）連絡電話： (02)7734-0001。 2.財團法人現代婦女教育基金會（大安區、文山區、中山區、大同區）連絡電話：(02)7728-5098 。 3.財團法人「張老師」基金會台北分事務所（松山區、內湖區、信義區、南港區）連絡電話：(02)2532-6180。","u":"臺北市家庭暴力暨性侵害防治中心","h":1504,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=829C4DDC1297606B","d":"2026-02-24","sid":"829C4DDC"},{"q":"（一般民眾）我發現有人虐待動物，我可以怎麼做？","a":"一、可直接撥打臺北市24小時動物保護專線1959，由專人提供服務。 二、除虐待動物外，可同時留意是否有家庭成員也受波及或虐待，如發現有家庭成員受暴，請撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供諮詢服務，或透過衛生福利部設置「關懷e起來」網站http://ecare.mohw.gov.tw/進行通報。遇有緊急人身安全情況，請先撥打110報案，由警方立即前往救援。","u":"臺北市家庭暴力暨性侵害防治中心","h":1238,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=930F3B79E2DFEA6A","d":"2026-02-24","sid":"930F3B79"},{"q":"（機關、團體、學校）要通報或諮詢家庭暴力或性侵害案件","a":"通通報或諮詢家暴或性侵害事件，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http://ecare.mohw.gov.tw/進行通報。遇有緊急人身安全情況，請先撥打110報案，由警方立即前往救援。","u":"臺北市家庭暴力暨性侵害防治中心","h":1217,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B1BC1AA076BBE52","d":"2026-02-24","sid":"0B1BC1AA"},{"q":"獨居老人如需緊急送醫，請問如何處理？(業務主責:社會局老人福利科)","a":"若遇到需緊急送醫者，可直接撥打緊急救難專線119送往附近醫院急救。","u":"臺北市家庭暴力暨性侵害防治中心","h":1061,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8EF6FF7C998CFE68","d":"2026-02-24","sid":"8EF6FF7C"},{"q":"如未成年之兒童、少年、身心障礙少年或無父母、父母失聯之兒少兒童未受適當養育照顧(如長期未進食、或被獨自留在不安全環境等)，請問如何處理？","a":"若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供協助。同時，亦可透過衛生福利部設置社會安全網-「關懷e起來」網站http://ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。","u":"臺北市家庭暴力暨性侵害防治中心","h":1058,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F5F7FD563F65E06E","d":"2026-02-24","sid":"F5F7FD56"},{"q":"保母或安置機構照顧之兒童少年發生意外傷害或死亡事件，請問該如何處理？","a":"若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。","u":"臺北市家庭暴力暨性侵害防治中心","h":996,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D538763D2F2DF298","d":"2026-02-24","sid":"D538763D"},{"q":"（機關、團體、動物醫院）民眾發現有人除了虐待動物之外，也疑似有虐待兒童，民眾要通報","a":"若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226、227，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http://ecare.mohw.gov.tw/進行通報。","u":"臺北市家庭暴力暨性侵害防治中心","h":913,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C35168A07820A31E","d":"2026-02-24","sid":"C35168A0"}]},{"org":"陽明教養院","total":15,"items":[{"q":"臺北市立陽明教養院服務對象照顧費用收費標準","a":"114年招收之新服務對象，收費標準請參照「114年度臺北市身心障礙者日間照顧及住宿式照顧費用補助金額一覽表(身心障礙福利機構)」。\n社工課聯絡方式：(02)2861-1380轉109","u":"臺北市立陽明教養院","h":9264,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=702B864493DC3A9B","d":"2021-02-26","sid":"702B8644"},{"q":"陽明教養院華岡院區門禁管制通行時間為何？","a":"＊因COVID-19疫情影響，訪客需出示3天內採檢之篩檢陰性證明，或已注射第2劑疫苗滿14天之黃卡證明，並配合TOCC調查。\n一、華岡院區大門（凱旋路）管制時間：\n（一）週一至週日：\n1、開放時間：上午07:30至下午23:00止，開放人員及車輛進出。\n2、關閉時間：下午23:00至翌日上午07:30止，管控人員及車輛進出，並由值班人員提供服務。\n二、華岡院區側門（仁民路）管制時間：\n1.週一至週六：\nA.開放時間：上午08:00至下午17:30止，開放人員及車輛進出。\nB.關閉時間：下午17:30至翌日上午08:00止，禁止人員及車輛進出。\n2.週日及例假日：全天候關閉（惟以搭乘公車步行至院區接送院生之家長將開放進出）\n3.側門關閉期間，除公務執行車輛（救護車、公務車及中型巴士）外，均改由院區大門（凱旋路）進出，並請配合大門門禁管制時間進出。\n秘書室聯絡人：（02）2861-1380轉分機101駐衛警李小隊長","u":"臺北市立陽明教養院","h":7925,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=051F9CD82FBC00F7","d":"2018-07-04","sid":"051F9CD8"},{"q":"如何到達臺北市立陽明教養院","a":"一、 【華岡院區】：臺北市士林區凱旋路61巷4弄9號；電話：2861-1380（總機）、2861-3333（社工課）。 二、 【公車路線】搭乘至捷運劍潭或士林站可轉乘紅5、小15、260、303路公車，至【山仔后派出所站】下車，步行約10分鐘即可到達本院。 三、 詳細路線可連結至【 大臺北公車 】、【 大都會客運網站 】或【 皇家客運網站 】查詢","u":"臺北市立陽明教養院","h":3569,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=89A89C37695D7D84","d":"2016-05-09","sid":"89A89C37"},{"q":"臺北市立陽明教養院入院申請資格為何？","a":"一、 設籍並實際居住臺北市6個月以上。 二、 18歲以上。 三、 領有中華民國身心障礙證明，障礙等級為中度、重度或極重度；障礙類別應具新制身心障礙類別第一類，且ICD診斷欄位括弧中之舊制身心障礙類別代碼含06或11。 四、 經需求評估需24小時生活照顧或能力增進（經身心障礙需求評估判定建議使用住宿式照顧服務）。 五、 未使用管路（鼻胃管、氣切管、尿管）者。 六 、 社會局聯絡人：市話手機直撥1999（外縣市02-2720-8889）分機1536身心障礙者福利科李諭綸 社工課聯絡方式：(02)2861-1380轉195","u":"臺北市立陽明教養院","h":3469,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C5A0F5526229101F","d":"2021-02-26","sid":"C5A0F552"},{"q":"臺北市立陽明教養院入院申請程序？","a":"一、申請程序： 本院110年度招收新案報名日期業於4月30日截止，爾後若再次開放新案入住申請，將配合社會局公告，同步更新。\n二、應檢附之文件： 本院未來招收新案時，將由社會局公告招收新案期程、申請程序、應檢附之文件等相關事宜。\n三、評估審核機制：\n(一)由社會局安排專業人員依臺北市立陽明教養院入出院自治條例之「入住評量表」（附件2）針對公告之訪視名單進行訪視評估。\n(二)由社會局召開專家審查會議，以「入住評量表」（附件2）為評估依據，決定申請人入住順序。\n(三)由社會局通知審查結果。\n四、聯絡方式：\n(一)本院聯絡人：社會工作員(02)28611380轉195。","u":"臺北市立陽明教養院","h":2994,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C2A417CE78FB05A8","d":"2021-02-26","sid":"C2A417CE"},{"q":"臺北市立陽明教養院如何受贈？","a":"【捐款】 ：\n一、    捐款方式：\n1.郵政劃撥或轉帳：\n戶名：臺北市立陽明教養院\n帳號：07213884\n2.信用卡授權繳款：下載 臺北市立陽明教養院信用卡捐款授權書 ，由持卡人填寫完畢並簽名後，以掃描、傳真、郵寄…等方式交付社工課承辦人，即可不必到現場，由承辦人代為操作一次性扣款或定期定額扣款服務。\n＊若選擇信用卡繳款，免收手續費，且發卡機構須加入 公務機關暨醫療院所信用卡繳費平台 。\n二、    捐款項目為：設施設備修繕或增購、服務對象直接照顧、服務對象活動費、推廣身心障礙者福利服務事項、配合本院重大活動所需、指定生活區內照顧相關事宜之指定用途；亦可親洽本院社工課。\n三、    依據本院捐款收支管理運用要點規定，未指定用途之捐款，應統一解繳市庫或各該特種基金專戶。\n【捐物】 ：可逕洽本院社工課。\n※請捐贈者留下姓名、電話、地址，當完成捐贈程序後，寄發正式收據與感謝函。另捐款收據可抵稅。\n社工課連絡方式：(02)2861-1380 轉分機109","u":"臺北市立陽明教養院","h":2916,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A526B5D9105BA330","d":"2016-05-09","sid":"A526B5D9"},{"q":"臺北市立陽明教養院教養內容","a":"教保課聯絡方式：(02)2861-1380 轉分機284 吳 課長\n養護課聯絡方式：(02)2861-1380 轉分機208 郭課長\n職能發展課聯絡方式：(02)2861-1380 轉分機154 宋 課長","u":"臺北市立陽明教養院","h":2485,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E252F7FB200AC25E","d":"2016-05-09","sid":"E252F7FB"},{"q":"參觀臺北市立陽明教養院","a":"請確認時間、日期、參觀人數與活動性質，於參觀日兩週前填具申請表格，透過 「台北服務通」 向社工課申請；如有特殊需要請於事前說明。","u":"臺北市立陽明教養院","h":2214,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA2B1D4808ABA862","d":"2016-05-09","sid":"AA2B1D48"},{"q":"如何申請借用陽明教養院之場地與設備？","a":"一、開放場地：\n本院2樓會議室、本院2樓廣場、本院3樓文康中心。\n二、開放租借時間：\n週一至週五上午8時30分至下午5時30分，如遇國定假日欲使用者，考量本院之服務性質，得視情況(如非常態性展演與身障福利服務相關之會議或活動等)採專案方式辦理。\n三、申請方式：\n(一)請於兩週前準備申請書併同附上相關證明文件(研習活動課程表、活動流程)。\n(二)向秘書室提出申請或透過台北服務通網站進行線上申請。\n四、借用規定：\n使用完畢需恢復場地原狀，在借用場地的同時需能兼顧本院服務對象的使用。\n五、處理時限：一般申請4日；網路申請4日。\n六、民眾可連結至「 陽明場地租借申請 」網頁下載申請書表。\n七、秘書室聯絡方式:(02)28611380分機308 于約僱保育員","u":"臺北市立陽明教養院","h":2185,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F041C2F4EC76F938","d":"2018-07-04","sid":"F041C2F4"},{"q":"陽明教養院情支中心可以怎麼申請？要符合哪些條件才能申請？","a":"為使18歲以上有情緒行為問題之智能障礙或自閉症成人，因情緒行為接受醫療（急性期醫療結束或長期接受門診治療）服務、或社福（身心障礙者服務中心、社會福利服務中心以及身心障礙社福設 施服務，包含小作所、機構以及社區式日間服務等）服務，然其行為仍需進行觀察及訓練，使其能穩定於機構或社區生活，臺北市政府社會局擇定臺北市立陽明教養院辦理情緒行為支持中心，提供精神醫療及社區端中繼轉銜服務。\n申請條件：\n一、18歲以上、設籍並實際居住臺北市6個月以上。\n二、有身心障礙證明，障礙等級為中度、重度或極重度；障礙類別應具新制身心障礙類別第一類，且ICD診斷欄位括弧中之舊制身心障礙類別代碼含06或11。\n三、精神症狀已改善，並經醫師評估達出院標準或長期接受門診治療 者、接受身心障礙者服務中心、社會福利服務中心以及身心障礙社 福設施服務，但仍持續有情緒行為問題（例如:自傷、傷人、破壞物 品、干擾、性偏異、社會不易接受但未具傷害性、睡眠異常、過度 退縮…等行為）。\n四、依衛生福利部社會及家庭署訂定之「心智障礙者/自閉症者嚴重情緒行為輔導需求評估表」評估，總分達15分以上（1-3級分者）。\n五、主要照顧者需配合個案行為處遇，延續支持策略。\n六、主要照顧者需配合返家計畫，逐步延長個案返家頻率及天數。\n相關檔案請見臺北市政府社會局網站：\nhttps://dosw.gov.taipei/cp.aspx?n=506C3AC6C1309560","u":"臺北市立陽明教養院","h":2074,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=562621004BB4B71A","d":"2023-07-13","sid":"56262100"},{"q":"臺北市立陽明教養院篩檢吞嚥困難服務對象及提高用餐安全的方式為何?","a":"如果用餐時不專心、速度太快、或用湯泡飯，都可能造成意外。\n陽明教養院注重飲食安全，平時就會留意每位服務對象的用餐狀況，依下列7項觀察指標及4項其他相關徵兆，進行疑似吞嚥困難的篩選，若觀察發現可能有吞嚥困難，便安排復健科門診進一步檢查評估，以下為陽明教養院參考的觀察指標：\n一、    主要觀察指標：\n1.每次吞東西，常常還有食物殘留在口腔內，無法吞乾淨\n2.食物容易卡在喉嚨，很難或無法吞下\n3.每口食物需分多次才能吞乾淨（常常要吞很多次才能全部吞下去）\n4.進食期間或進食完不久，出現咳嗽或嗆咳\n5.進食中、進食完（包括喝水、吃東西），發聲會有混濁的咕嚕聲\n二、    次要觀察指標：\n1.食物時常含在口腔內過長時間，而不易吞下\n2.吃東西時，嘴巴沒有完全閉起來，食物易隨口水或舌頭動作流出口腔外\n三、    其他徵兆：\n1.癲癇發作頻繁(一天2~3次)\n2.頻繁不明原因發燒(尤其是低溫發燒，如:37.2～37.5度)\n3.反覆性的肺炎\n4.體重急遽減輕(如：一個月內減輕5%)\n保健課聯絡方式：(02)2861-1380轉177 張職能治療師","u":"臺北市立陽明教養院","h":2053,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BE2E02E134692A7A","d":"2016-05-09","sid":"BE2E02E1"},{"q":"臺北市立陽明教養院醫療保健服務","a":"本院設有藥師、護理師、營養師及職能治療師、物理治療師等醫事人員，除依服務對象個別需求提供個別或團體活動﹝例如：多元體適能課程、水上活動、感官訓練活動等﹞，並與臺北市立聯合醫院陽明院區合作，設有家醫科、皮膚科、小兒科、心智科、復健科等門診，牙科則由臺北市牙醫師公會醫療團提供診療服務，並與北投三總院區合作提供居家照護服務，為服務對象的身心健康把關。","u":"臺北市立陽明教養院","h":1989,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7D5A47B1C87A763E","d":"2016-05-09","sid":"7D5A47B1"},{"q":"陽明教養院志工服務的申請方式?","a":"一、填寫「臺北市陽明教養院志願服務申請表」後透過下列方式申辦：\n（一）臨櫃親辦（請洽社工課）\n（二）郵寄（11193 臺北市士林區凱旋路61巷4弄9號）\n（三）電話（社工課02-28611380轉386 林社會工作員）\n備註：臺北市陽明教養院志願服務申請表可至本院網站下載或至本院櫃檯領取\n二、申請時間：\n週一至週五8：30~17：30，電洽本院社工課02-28611380分機386或網站 申辦網頁 提出申請;團體服務申請，請於欲來院服務前兩星期提出計畫書至本院。\n三、申請資格：\n（一）個人志工：具愛心、耐心、毅力，願意對智能障礙者付出關心之個人。\n（二）團體志工：各國民中學、高中職及大專院校班級或社團、一般服務性社會團體或企業團體。\n備註：需先接受本院志願服務教育訓練課程後，方得進入本院提供志願服務。","u":"臺北市立陽明教養院","h":1534,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=42AEF04F3CBC13F1","d":"2018-04-13","sid":"42AEF04F"},{"q":"訂購臺北市立陽明教養院服務對象生產產品","a":"一、 產品種類、訂購資訊，請進【 臺北市立陽明教養院服務對象手工產品網 】查詢。\n二 、 產品均由本院師生共同製作，每日產量有限，欲訂購請務必事先來電洽詢：(02)2861-1380分機390 高輔導員。","u":"臺北市立陽明教養院","h":1154,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4C018F857A2E2D3B","d":"2016-05-09","sid":"4C018F85"},{"q":"臺北市立陽明教養院服務對象的餐食規劃？","a":"本院會依服務對象的年度體檢報告，考量其疾病飲食營養、及個別熱量需求後，再依其咀嚼吞嚥能力調整餐食材質及稠度，提供符合安全進食的個別化餐食。\n保健課聯絡方式：(02)2861-1380轉285 吳營養師","u":"臺北市立陽明教養院","h":1102,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B815C94AC430F0D2","d":"2016-05-09","sid":"B815C94A"}]},{"org":"文獻館","total":15,"items":[{"q":"想使用樹心會館多功能區的話，相關規定及辦理方式為何？","a":"場地收費基準及場地使用須知相關文件資料，置於本館網站，首頁>申請案件或>檔案下載，意者可先行瀏覽相關規定。 洽詢該場地開放申請檔期時間，請於辦公時間內，來電本館：(02)2311-5355#22洽詢。 確認檔期後，可於 市民服務大平臺 線上申請或向本館寄出書面申請，申請書格式請參考(使用須知第3頁附表)連同活動企劃書一併提出。 公告檔期申請時限：每年7月開放申請次年1~6月檔期；1月開放申請當年7~12月檔期。第一輪申請案受理收件時間以公告訊息為準。","u":"臺北市立文獻館","h":5374,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=028D0B414371848D","d":"2022-04-12","sid":"028D0B41"},{"q":"臺北市立文獻館開辦之定點史蹟解說與動線史蹟解說有哪些路線？定點史蹟解說與動線史蹟解說時間為何？","a":"定點史蹟解說：為於艋舺龍山寺、剝皮寮歷史街區、西本願寺廣場等 3 處，設定點解說站， 由史蹟解說員在現場服務。 艋舺龍山寺( 每週六、日上午 9:00~12:00 下午 1:30~4:30) 剝皮寮歷史街區( 每週六、日下午 1:30~4:30) 西本願寺廣場( 分本堂常設展區及樹心會館 C 區) 本堂常設展區：「經典畫當年」、「昔日好時光」，週二至週五上午 10:00~ 下午 5:00，每週六、日下午 1:00~5:00 樹心會館 C 區：「箱遇臺北城」，週二至週五上午 10:00~12:30、下午 1:30~4:30) 備註：解說員可視現場狀況，調整解說景點。 動線史蹟解說：為倡導市民參與優質文化休閒活動，拓展文化生活領域，培養民眾探索史蹟 的興趣，本館特別推出 20 條導覽動線及 3 條伴你行無障礙史蹟導覽路線，將史蹟解說點延 伸到本市各行政區史蹟景點，讓民眾可更廣泛地尋根探源並達到史蹟活化的意義。 20 條導覽動線及 3 條伴你行無障礙史蹟導覽路線手冊 申請方式： 導覽申請表格請至 台北服務通 網站下載，並於活動前一週以郵寄、親送、委託、傳真等向本館申請預約。 透過 台北服務通 網路申辦。","u":"臺北市立文獻館","h":4482,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD5CCB759634A31F","d":"2022-04-12","sid":"CD5CCB75"},{"q":"古物有哪些法令規定？","a":"古物相關法令規定為 文化資產保存法 第3條、第65條至77條； 文化資產保存法施行細則 第7條、第15條、第29條及第30條、 古物分級指定及廢止審查辦法 、 公有古物複製及監製管理辦法 、 公有古物管理維護辦法 、 國寶及重要古物運出入處理辦法 、 大陸地區古物運入臺灣地區公開陳列展覽許可辦法 、 文物運出入申請辦法 、 野生動物保育法施行細則 等相關規定。","u":"臺北市立文獻館","h":4123,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4B05DDCFE80720D0","d":"2022-04-12","sid":"4B05DDCF"},{"q":"家中有祖先留下來之古文書、寫真帖、文物、老照片等，希望捐贈由市政府保存，該向那個單位洽詢？","a":"請先洽臺北市立文獻館，由該館評估由本府保存之可行性。 聯絡電話為23115355#27，地址為 臺北市萬華區中華路1段174之1號","u":"臺北市立文獻館","h":3877,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6718C78CFB17F577","d":"2022-04-12","sid":"6718C78C"},{"q":"臺北市立文獻館史蹟導覽活動的申請方式為何？是否收取費用？","a":"凡對史蹟探索有興趣之國小以上學生及民眾皆可組團參加，以10至15人為原則，外國貴賓不限人數。活動費用全免。\n本館目前共規劃20 條導覽動線及3 條伴你行無障礙史蹟導覽路線，平均分佈在全市每一行政區，全年常態性接受社團、學校及民眾組團申請，由本館安排史蹟解說員服務，帶領民眾參觀臺北市主要史蹟景點，請於活動前一週於\n台北服務通\n或至本館官網網站，首頁>申請案件或>檔案下載，意者可先行瀏覽相關規定，下載表格提出申請。\n洽詢請打電話：(02)23115355轉20洽詢。","u":"臺北市立文獻館","h":3871,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=58713AA4DE438345","d":"2022-04-12","sid":"58713AA4"},{"q":"什麼地方可以查閱有關臺北市文獻史料？","a":"臺北市立文獻館蒐藏豐富的臺北市文獻史料，舉凡地方志書、文獻資料、名勝古蹟、姓氏族譜及相關市政建設資料等，於文獻資料室採開架式供民眾閱覽。 文獻資料室借閱及使用須知，如附件。 地址： 臺北市萬華區中華路1段174之1號","u":"臺北市立文獻館","h":3728,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3413C7BEF3F57388","d":"2022-04-12","sid":"3413C7BE"},{"q":"臺北市古物相關問題，要洽詢那個單位？如何提出申請？","a":"臺北市古物業務目前由臺北市政府文化局行政委任臺北市立文獻館辦理，聯絡電話為(02)23115355轉24，地址為\n臺北市萬華區中華路1段174之1號\n臺北市內公有文物需備妥文物提報指定一般古物申請表後，提送臺北市立文獻館審議。\n臺北市內私有文物需備妥(1)文物指定一般古物申請表(2)私有文物來源及所有權屬說明文件與切結書或公證文書向戶籍所在地之主管機關(臺北市立文獻館)提出申請。","u":"臺北市立文獻館","h":3455,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=78E25DEE98A83E97","d":"2022-04-12","sid":"78E25DEE"},{"q":"何處可查臺北市30年代至90年代之，發展歷史圖片？〈工商歷史圖片、都市演進繁榮圖片〉","a":"有關臺北市30年至90年代發展歷史圖片，可查詢「 臺北市立文獻館文物查詢資訊系統 」、臺北市政府觀光傳播局出版的「臺北畫刊」歷年合訂本及大地地理出版社之「20世紀臺灣」系列等書刊中找尋。","u":"臺北市立文獻館","h":3379,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=588FD3D3E2628007","d":"2022-04-12","sid":"588FD3D3"},{"q":"公告指定為古物，日後由誰管理維護？","a":"一般古物由所有人或保管單位管理維護。 公有古物保管單位依 公有古物管理維護辦法 辦理。","u":"臺北市立文獻館","h":3342,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DD28C17A3D5285B9","d":"2022-04-12","sid":"DD28C17A"},{"q":"申請指定為一般古物，要具備哪些條件？","a":"依 古物分級指定及廢止審查辦法 第2條規定，一般古物指定應符合下列基準之一：","u":"臺北市立文獻館","h":3091,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DB1E8791CACB4121","d":"2022-04-12","sid":"DB1E8791"},{"q":"臺北市立文獻館辦理動線史蹟解說申請有無限制或規定？","a":"臺北市立文獻館辦理動線史蹟解說申請注意事項：","u":"臺北市立文獻館","h":2896,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5E3D9AB38D30EF2E","d":"2022-04-12","sid":"5E3D9AB3"},{"q":"國外文物申請運入國內展覽，要向那個單位申請？","a":"設籍或公司登記於臺北市請向臺北市立文獻館提出申請。聯絡電話為(02)23115355轉24，地址為 臺北市萬華區中華路1段174之1號","u":"臺北市立文獻館","h":2775,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=83708E5516958F1A","d":"2022-04-12","sid":"83708E55"},{"q":"《續修臺北市志》纂修之起迄年代為何？內容包含有幾志？","a":"本續修市志以民國71年1月為上限，下迄民國100年12月底，並兼採「詳今略古」原則，民國71年以前之記敘僅適當略述不逾百分之十。\n全志除卷首及卷尾、卷一大事紀外，共有八志（志各一卷），合計11卷33篇（大事紀視同一篇）。八志依序為《土地志》、《政事志》、《經濟志》、《交通志》、《社會志》、《教育志》、《文化志》、《人物志》。\n電子檔請連結\n續修臺北市志\n下載。","u":"臺北市立文獻館","h":1081,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=19F472F660FF61DC","d":"2022-04-12","sid":"19F472F6"},{"q":"古物如何提出指定申請？","a":"臺北市市內公有文物需備妥文物提報指定一般古物申請表後，提送主管機關(臺北市立文獻館)審議。 私有文物需備妥以下文件向戶籍所在地之主管機關(臺北市立文獻館)提出申請。： 文物指定一般古物申請表 私有文物來源及所有權屬說明文件與切結書或公證文書","u":"臺北市立文獻館","h":691,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=84B5006CE23F6700","d":"2022-04-12","sid":"84B5006C"},{"q":"什麼是古物？古物之範疇？","a":"文化資產保存法第一章第三條第一項第一款第八目：古物是指各時代、各族群經人為加工具有文化意義之藝術作品、生活及儀禮器物、圖書文獻及影音資料等。","u":"臺北市立文獻館","h":676,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6B3B50AB6CB8D8D2","d":"2022-04-12","sid":"6B3B50AB"}]},{"org":"自來水園","total":14,"items":[{"q":"自來水園區(含水鄉庭園)參觀資訊?","a":"1.地址：臺北市思源街1號。\n2.營業時間：夏季09:00~18:00(售票至17:00);非夏季09:00~17:00(售票至16:00)\n3票價為：\n4.服務電話：02-8369-5104","u":"臺北自來水園區","h":14058,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=77168C6B54ABA613","d":"2011-07-25","sid":"77168C6B"},{"q":"自來水園區附近有哪些停車場?費率如何？可否使用悠遊卡?有多少停車位? 開放時間? 有否月票優惠？","a":"1.自來水園區共轄管有水岸、公館及水源停車場等3處，均採24小時開放營業，其中水岸停車場緊鄰自來水園區，公館停車場位於寶藏巖周邊，另水源停車場位於汀州路3段160巷及汀州路3段104巷交接處。\n2.費率及格位數：\n(1)水岸停車場 Riverside Parking Lot (105車格)\n(2)公館停車場 Gongguan Parking Lot (133車格)\n(3)水源停車場 Shuiyuan Parking Lot (44車格，118機車格)\n3.停車場均可使用悠遊卡。\n4.有月租優惠，如有停車詢問事宜，請電自來水園區管理中心服務電話(02)8369-5104洽詢。\n5.各停車場目前提供身心障礙者憑證停車前4小時免費、第4小時以後停車半價之優惠。","u":"臺北自來水園區","h":5246,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2B56A90082093DA4","d":"2018-08-31","sid":"2B56A900"},{"q":"請問公館停車場位置?費率？開放時間? 可否使用悠遊卡?各有多少停車位?有否月票優惠？身心障礙是否優惠?","a":"公館停車場位於汀州路3段230巷15號空地，鄰近寶藏巖；停車場目前由北水處自營，採24小時開放營業，屬半無人化停車場，其中人員服務時段為12:00~22:00，現場可使用悠遊卡。\n臨時停車收費方式\n公館停車場目前提供身心障礙者憑證停車前4小時免費、第4小時以後停車半價之優惠。\n公館停車場有月租服務，如有停車詢問事宜，請電自來水園區管理中心服務電話(02)8369-5104洽詢。","u":"臺北自來水園區","h":4404,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6C55AA4D268DABED","d":"2018-08-31","sid":"6C55AA4D"},{"q":"自來水園區的開放時間與門票價格?淡旺季有否區別?有網站可以查閱嗎？休園時間?是否有拍攝婚紗的特定時間","a":"1.)「自來水園區自來水博物館區」每逢周一公休(週一如適逢連續假日則照常營業)，夏季營業時間每日9時至18時(售票、入園至17時)，門票為全票80元、優待票40元；非夏季營業時間每日9時至17時(售票、入園至16時)，門票為全票50元、優待票25元。\n2.) 「自來水園區自來水博物館區」營業時間及票價資訊可上自來水園區網站 https://waterpark.water.gov.taipei 查詢。\n3.) 為方便婚紗朋友拍照，「自來水園區自來水博物館區」每週一仍提供婚紗朋友購票入園拍照!","u":"臺北自來水園區","h":2126,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A4F2829745C6115C","d":"2018-08-25","sid":"A4F28297"},{"q":"自來水園區有哪些景點?遊覽整個園區大約要多久時間?一定要自備泳具嗎?還是有販賣泳具?有販賣食物嗎?能否代訂團體便當嗎? 聯絡方式？","a":"自來水園區佔地約17公頃，其內設有水鄉庭園等親水設施；有自來水博物館、觀音山蓄水池、渾水抽水站、量水室古蹟等百年古蹟；還有小觀音山生態登山步道等適合各種年齡層參訪的景點設施，各景點設施詳細介紹可上自來水園區網站 [連結] 查詢。 遊覽自來水園區自來水博物館區內各景點設施時間約2個小時。 進入水鄉庭園則無須著泳衣泳帽，但不得穿長褲下水。 自來水園區於水鄉庭園開放期間，內有販售區提供泳具及輕食販售服務。目前無提供代訂團體便當服務。 聯絡電話自來水園區02-8369-5104。","u":"臺北自來水園區","h":1570,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1DB7EC1EEB0B3DDB","d":"2018-08-25","sid":"1DB7EC1E"},{"q":"請問前往自來水園區的交通方式?可否騎自行車入園？","a":"1.)捷運搭松山新店線在公館站，四號出口往思源街與汀州路口方向，步行約五分鐘。\n2.)公車搭0南、1、52、109、207、208、236區、251、252、253、254、278、280、284、290、311、505、530、606、643、644、648、660、668、671、672、673、675、676、849、895、907、藍28、棕11、棕12、棕22、綠11、綠13、景美-榮總(快)、復興幹線、羅斯福幹線、松江新生幹線、懷恩專車S31。\n3.)小客車或婚紗小客車可停在水岸停車場(沿思源街至永福橋底左轉進入)。\n4.)自行車目前無法進入「自來水園區自來水博物館區」內騎乘，惟自來水園區周邊水岸廣場及量水室古蹟廣場等免費開放區均開放民眾騎乘自行車。","u":"臺北自來水園區","h":1246,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9FC610D2FD3D5086","d":"2018-08-31","sid":"9FC610D2"},{"q":"自來水園區對老人、學生、身心障礙者、團體、當地週邊社區等人是否有票價及停車優惠?","a":"1.「自來水園區自來水博物館區」由本處自營，目前提供 65歲以上、臺北市政府退休公教人員(持證明文件)、未滿6歲兒童(未持證明文件時以身高未滿115公分認定)、身心障礙者持有身心障礙手冊及其必要陪伴者1人、設籍臺北市55歲以上原住民之持證長者等可免費進入參觀之優惠 。另為鼓勵學校及團體參觀，特別訂有「團體票30人以上8折」優惠票價，及校外教學依購票入園學生人數提供一定名額老師免費入園之優惠。另為敦親睦鄰考量，「自來水園區自來水博物館區」目前提供周邊里民回饋，戶籍登記於臺北市中正區（河堤里、螢圃里、網溪里、板溪里、頂東里、螢雪里、水源里、富水里、文盛里、林興里）及臺北市大安區（大學里、學府里）里民購票半價優惠。\n2.自來水園區附設水岸及公館停車場，目前提供身心障礙者憑證停車前4小時免費、第4小時以後停車半價之優惠。\n3.115年水鄉庭園夏季限定優惠:\n(1)115年7月5日（週日）起，至水鄉庭園營運結束止，活動期間內，凡至自來水園區水鄉庭園現場購票時， 主動出示當日親水樂園之票根（購票證明），即可直接享有現折 20 元的購票優惠！\n(2)115年7月4日（週六）起，至115年8月30日（週日），活動期間內，凡至自來水園區水鄉庭園現場購票時， 主動出示臺北市立兒童新樂園PILIGILI水樂園之票根（購票證明），即可直接享有8折的購票優惠！\n水鄉庭園夏季購票限定優惠每張購票只可擇一使用。\n自來水園區票價及相關優惠資格如下表","u":"臺北自來水園區","h":1227,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AF68171728E28E5F","d":"2018-08-25","sid":"AF681717"},{"q":"如何申請自來水園區的預約導覽? 要什麼資格或多少人才可以申請？聯絡方式？ 導覽時間多久?","a":"1.)以電話02-8369-5104預約，或上自來水園區網站(waterpark.water.gov.taipei)下載報名表填妥後傳真02-8369-5105預約。\n2.)園區預約導覽僅提供定時導覽時段辦理，導覽時段如下所列，惟考量導覽時段人力調度與聯繫，敬請於預訂導覽日３日前預約，以利人員排程及連絡。\n3.)導覽內容：自來水博物館，每次約半小時。\n4.)導覽對象：國小以上學生及社會團體，每次以40人為限。","u":"臺北自來水園區","h":1156,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EE0EA56CA569F416","d":"2018-08-24","sid":"EE0EA56C"},{"q":"園區場地可否出租辦理活動？費率多少?除了營業時間外?非營業時間可否配合申請單位調整?","a":"1.) 為方便機關、學校、團體及個人辦理文化育樂活動或拍攝商業影片，本處訂有「臺北自來水事業處水園區新天地場地使用管理要點」，有關自來水園區場地租借方法、費用均於該要點有詳盡規範。\n2.) 場地租用費率視租借場地位置、時段及平、假日而定，以假日租借公館水岸廣場為例，租借09:00~13:00、13:00~18:00及18:00~22:00各時段場地使用費分別為11,000元、7,000元及12,000元。民眾可上自來水園區網站( waterpark.water.gov.taipei )查詢「臺北自來水事業處水園區新天地其他場地使用收費標準表」，或於機關上班時間(週一至週五　09:00~17:00)洽(02)8369-5104園區管理中心詢問。\n3.)場地租借時間如為自來水園區非營業時間亦可專案配合辦理租借，詳情請於機關上班時間(週一至週五　09:00~17:00) 洽(02)8369-5104園區管理中心詢問。","u":"臺北自來水園區","h":1097,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E9BFB939C2771085","d":"2018-08-25","sid":"E9BFB939"},{"q":"請問辛亥水安停車場位置?費率？開放時間? 可否使用悠遊卡?各有多少停車位?身心障礙是否優惠?","a":"辛亥水安停車場位於大安區長興街131號(辛亥路3段與芳蘭路交接處)；採24小時開放營業，現場可使用現金及悠遊卡繳費。\n辛亥水安停車場 XINHAIXUEIAN Parking Lot (62車格)\n臨時停車收費方式\n身心障礙者憑證前4小時免費、第4小時以後停車半價之優惠。\n如有停車詢問事宜，請電自來水園區管理中心服務電話(02)8369-5104洽詢。","u":"臺北自來水園區","h":975,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A1080DB83113B9FC","d":"2024-01-23","sid":"A1080DB8"},{"q":"請問如何取得自來水博物館簡介與相關資料? 聯絡方式？","a":"1.) 可上自來水園區網站( waterpark.water.gov.taipei )查詢或於搜尋網站輸入「自來水園區中文版」即可獲得該館介紹資訊。 2.) 如需進一步資訊請洽02-8369-5104管理中心詢問；此外，亦可於現場詢問博物館導覽志工或服務人員進行初步了解。","u":"臺北自來水園區","h":955,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FA54B848065AE1AE","d":"2018-08-25","sid":"FA54B848"},{"q":"請問自來水園區有哪些經常性的行銷活動?親水節是否有固定舉辦時間?","a":"1.)自來水園區目前每年固定舉辦之活動主係為親水節及聖誕音樂會，另為配合特定節日及市府大型市政活動需要，園區亦會辦理或協辦相關活動，民眾可於自來水園區網頁或相關新聞資訊得知。\n2.) 親水節自93年以來，每年約於7-8月暑假期間舉辦，確切日期請以當年度官網及官方FB粉絲專頁為準。如為配合中央防疫措施或不可抗力因素，將暫停辦理。","u":"臺北自來水園區","h":828,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B70ACF16DA8EEACD","d":"2018-08-25","sid":"B70ACF16"},{"q":"自來水園區是否會舉辦理免費入園活動？如何得知相關訊息?","a":"1.)自來水園區偶有舉辦大型活動、配合辦理市政宣傳或其他公益特殊活動，開放民眾免費入園。 2.)有上述免費開放情形除將由本處事先發布新聞稿或於網站最新消息公佈，並會在自來水園區網站（ waterpark.water.gov.taipei ）公布相關訊息。","u":"臺北自來水園區","h":819,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A6815776BF4DDF8F","d":"2018-08-25","sid":"A6815776"},{"q":"親水樂園的營業時間、地址、交通方式、門票價格及優惠?","a":"親水樂園相關資訊說明如下： 1.園區地址： 臺北市中正區汀州路3段160巷底（量水室廣場旁）\n2.營業時間： 09:00－18:00（17:00停止售票） 每週一休園。 開放期間為夏季，確切日期以園區公告為準。\n3.服務電話： 02-83695005\n4.交通方式：\n捷運： 搭乘捷運松山新店線至公館站，1號出口往汀州路3段160巷口方向，步行約三分鐘。\n公車： 0南、1、52、109、208、251、252、253、254、278、280、284、290、505、530、606、643、644、648、660、668、671、672、673、675、676、849、895、907、藍28、棕11、棕12、棕22、綠11、綠13、復興幹線、羅斯福幹線、松江新生幹線、懷恩專車S31。\n停車場：\n● 水源停車場（汀州路3段140巷內空地），汽車平日 $40/時，假日 $60/時；機車$20/次。\n● 公館停車場（汀州路3段230巷，近寶藏巖），汽車平日 $40/時，假日 $50/時。\n親水樂園票價 資訊 備註： 親水樂園與自來水園區（水鄉庭園）票券不共用\n5.115年親水樂園夏季限定優惠:\n(1) 115年7月5日（週日）起，至 親水樂園 營運結束止，活動期間內，凡至 親水樂園 現場購票時， 主動出示當日自來水園區(水鄉庭園)之票根（購票證明），即可直接享有現折 20 元的購票優惠！\n(2) 115年7月4日（週六）起，至115年8月30日（週日）  ，活動期間內，凡至 親水樂園 現場購票時， 主動出示臺北市立兒童新樂園PILIGILI水樂園之票根（購票證明），即可直接享有8折的購票優惠！\n備註： 親水樂園 夏季購票限定優惠每張購票只可擇一使用。","u":"臺北自來水園區","h":231,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=75A93DC913CB0C51","d":"2026-07-30","sid":"75A93DC9"}]},{"org":"翡翠水庫管理局","total":14,"items":[{"q":"請問欲參訪翡翠水庫要如何申請？","a":"一、平日參訪：\n時間：每週二、三、四、週五上班日，分上下午兩個時段，每個時段以2.5小時為限，上午時段為09:30~12:00，下午時段為14:00~16:30。\n對象：以團體為單位，包括政府機關、學校、人民團體或公私營事業單位等。 參訪人數：原則為30~150人，若屬公務、學術交流不受以上人數限制，請先洽本局安全檢查科環境教育股(02-26664997)。\n申請方式：請至本局環境學習中心網頁-環教參訪報名專區報名。( https://activity.feitsui.gov.tw/ )\n二、假日參訪：除本局於年度內辦理之活動(大臺北水源故鄉巡禮)外，星期例假日則不接受申請。如欲查看活動日期請至本局環境學習中心網頁-環教參訪報名專區查詢。( https://activity.feitsui.gov.tw/ )。","u":"臺北翡翠水庫管理局","h":23784,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE963FC224213EA2","d":"2023-08-17","sid":"AE963FC2"},{"q":"翡翠水庫是否可以釣魚、捕（撈）魚、行駛船筏浮具、放生或從事任何水上活動等行為?","a":"基於保護水源，水庫蓄水範圍內，並不受理申請任何使用行為，所以在翡翠水庫蓄水範圍內並不得從事釣魚、捕（撈）魚、行駛船筏浮具、放生或任何水上活動。\n翡翠水庫為供應大臺北地區600萬居民民生用水之重要水源，水庫水質一直是全國最優良之水庫之一，是一個以供應民生用水為單一目標的水庫。由於目前新水源開發不易，同時水庫也是環境敏感區域，為維持並保護優良水質，經濟部於107年1月8日公告「翡翠水庫管理機關、蓄水範圍及其管理事項」，翡翠水庫係以家用及公共給水為主要目標，基於保護水源，水庫蓄水範圍內，並不受理申請任何使用行為，所以在翡翠水庫蓄水範圍內不得從事釣魚等水上活動。","u":"臺北翡翠水庫管理局","h":13391,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6A108423590D5F6F","d":"2023-08-17","sid":"6A108423"},{"q":"翡翠水庫運用規線的意義？","a":"為滿足大臺北地區用水安全，本局依據集水區降雨季節特性、供水需求等因素，訂定出上限、中限、下限及嚴重下限4種運用規線，作為水庫運轉、蓄水利用之依據。各運轉規線意義說明如下：","u":"臺北翡翠水庫管理局","h":11853,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C1D76690ED88C64A","d":"2024-03-25","sid":"C1D76690"},{"q":"臺北水源特定區之建築主管機關為何？","a":"臺北水源特定區之建築主管機關為 經濟部水利署臺北水源特定區管理分署 ，連絡電話：02-29173282~5)。\n臺北水源特定區位於大臺北都會區東南隅，面積廣達717平方公里，行政區域包含坪林、烏來全區及部份石碇、雙溪與新店等5區。","u":"臺北翡翠水庫管理局","h":11839,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C31E6FAB0CEBB9C7","d":"2023-08-17","sid":"C31E6FAB"},{"q":"翡翠水庫目前淤積情形如何？","a":"114年淤積量為27.2萬立方公尺。\n翡翠水庫於73年7月初期蓄水以來，本局即積極聯合相關權管機關推動集水區水土保育等防淤減淤工作，迄至114年底，累積淤積量為2,866.7萬立方公尺，僅佔水庫初始總蓄水量4億600萬立方公尺的7.06%，歷年年平均淤積量為69.1萬立方公尺，遠低於水庫設計當時推估北勢溪年輸沙量113.6萬立方公尺，平均年淤積速率僅約水庫總容量的0.2%。近年來更透過蓄清排渾之水力排沙操作，使得近3年(112－114)平均年淤積量更只有28.2萬立方公尺，以此推估平均年淤積速率更僅約水庫總容量的0.1%，因此水庫淤積程度尚屬輕微，對水庫的正常運轉操作並無影響。","u":"臺北翡翠水庫管理局","h":11699,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B1D2B3D6F7B8549C","d":"2024-03-04","sid":"B1D2B3D6"},{"q":"翡翠水庫目前的水質情況如何？","a":"近年來翡翠水庫的水質皆屬於貧養級之優良水質。\n水庫水質的好壞，通常是指水質的優養化程度，一般常用國際通用的卡爾森優養指數(CTSI)法來評定，當卡爾森優養指數(CTSI)在40以下者為貧養，表示水質優良，在40-50之間為普養，表示水質尚屬良好，在50以上者便為優養，表示水質較差(藻類大量孳生，容易有異味，甚至產生藻毒)。\n歷年來，本局除積極協調推動集水區相關保育工作，聯合相關權管機關推動相關防污減污及進行污染源稽查取締與管理外，並實施「蓄清排濁」策略操作，以降低淤積量與營養鹽，使得歷年來水庫年平均卡爾森優養指數(CTSI)都歸屬於普養級以上的良好水質，近年來翡翠水庫的水質皆屬於貧養級之優良水質，故翡翠水庫目前水質優良且安全無虞。","u":"臺北翡翠水庫管理局","h":11508,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=387026A8D3CCF3C9","d":"2023-08-17","sid":"387026A8"},{"q":"翡翠水庫有哪些宣導項目可供民眾參加？","a":"備註：欲報名以上宣導項目，或查詢詳細內容、日期及簡章等，請至本局環境學習中心網頁-環教參訪報名專區查詢。( https://activity.feitsui.gov.tw/ )","u":"臺北翡翠水庫管理局","h":10
