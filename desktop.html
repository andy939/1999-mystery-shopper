義務機關（構），如果有員工因入伍、育嬰而留職停薪，進用機關（構）另請職務代理人，致使一個工作有2個人投保，是否可將員工總人數扣除1人？","a":"依身心障礙者權益保障法施行細則第15條第2款規定，經機關（構）依法核予留職停薪，仍繼續參加勞工保險或公教人員保險之人員，得不予計入員工總人數計算。爰人員留職停薪期間所遺職缺，機關（構）有僱用職務代理人，並加入保險，且能提出相關法令依據及具體事證，足資證明係屬同一個職缺進用者，始可將員工總人數扣除留職停薪人數計算。","u":"臺北市政府人事處任用科","h":12394,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F3AF0AD8A4CD8FA1","d":"2021-10-21","sid":"F3AF0AD8"},{"q":"公務人員任用法第17條第6項委任晉升薦任官等所規定之最近3年年終考績，是否須為連續？","a":"公務人員任用法第17條第6項所稱「最近3年年終考績」，非以連續為必要，期間中斷者，得依次向前推算遞補之。惟須計算合格實授委任第五職等之年終考績，另予考績及併資考績均不得計算。","u":"臺北市政府人事處任用科","h":10962,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4D50671450125C49","d":"2021-10-21","sid":"4D506714"},{"q":"工友(含技工、駕駛)於休假日工作，工作時數是否包括在每月延長工時總額內？","a":"關於勞動基準法第39條規定「雇主經徵得勞工同意於休假日工作者，工資應加倍發給」。所稱「休假日」，僅指該法第37條所定之休假及第38條所定之特別休假而言。至其休假日工作時數，可不包括在同法第32條每月延長工作總時數限額內。如逾當日8小時之延長工作時數，則應計入每月延長工時總額內。 (權責機關本府勞動局)","u":"臺北市政府人事處考訓科","h":9481,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7BA5A9F1E7B39953","d":"2017-02-06","sid":"7BA5A9F1"},{"q":"本府各機關首長駕駛於週六、週日或勞動基準法第37條所定休假日出勤是否應另給予擇期補休？","a":"1.本府各機關首長駕駛於休息日或於勞動基準法第37條所定休假日出勤，應依同法規定發給休息日出勤工資或休假日工資，或徵得駕駛同意後擇期補休。 2.因天災、事變或突發事件，機關認有繼續工作之必要時，得停止勞動基準法第36條至第38條所定之假期(含例假、休假及特別休假)。但停止假期之工資，應加倍發給，並應於事後補假休息。機關並應於事後24小時內，詳述理由，報請本府勞動局核備。 3.至於是否得使駕駛於週六、週日出勤，應視勞資雙方約定該日之性質為何？如為休息日，依勞動基準法第24條第2項規定給付休息日出勤工資；如為例假日，不得使勞工出勤。 (權責機關本府勞動局)","u":"臺北市政府人事處考訓科","h":9413,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=74F8B0E9250FE528","d":"2016-12-26","sid":"74F8B0E9"},{"q":"機關人員專案加班費核定權責為何？","a":"依「臺北市政府及所屬各機關人員加班費支給要點」第6點規定，機關因業務需要，於符合「行政院與所屬中央及地方各機關（構）公務員服勤實施辦法」之規定下，依下列程序專案函（簽）報核准後，始得支給專案加班費：\n一、辦公日超過4小時、放假日及例假日超過8小時，簽請機關首長核准。\n二、每月超過20小時，各一級機關及區公所自行核准；所屬機關報由一級機關核准；輪班輪休人員簽請機關首長核准。\n三、一級機關首長簽報市長核准後支給，區公所首長簽報本府民政局核准後支給，所屬機關首長簽報一級機關核准後支給。","u":"臺北市政府人事處給與科","h":8956,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=81973E465922CA7E","d":"2008-02-26","sid":"81973E46"},{"q":"支領或兼領月退休金人員，再任有給職務應停止領受月退休金之情形？","a":"依公務人員退休資遣撫卹法第77條規定，退休人員經審定支領或兼領月退休金再任有給職務且有下列情形時，停止領受月退休金權利，至原因消滅時恢復之：\n一、再任由政府編列預算支給俸（薪）給、待遇或公費（以下簡稱薪酬）之機關（構）、學校或團體之職務且每月支領薪酬總額超過法定基本工資。\n二、再任下列職務且每月支領薪酬總額超過法定基本工資者：\n(一)行政法人或公法人之職務。\n(二)由政府原始捐助（贈）或捐助（贈）經費，累計達財產總額百分之二十以上之財團法人之職務。\n(三)由政府及其所屬營業基金、非營業基金轉投資，且其轉投資金額累計占該事業資本額百分之二十以上事業之職務。\n(四)受政府直接或間接控制其人事、財務或業務之下列團體或機構之職務：\n1.財團法人及其所屬團體或機構。\n2.事業機構及其所屬團體或機構。\n三、再任私立學校職務且每月支領薪酬總額超過法定基本工資。\n108年8月23日公布之司法院釋字第782號解釋略以：退撫法第77條第1項第3款規定，與憲法保障平等權之意旨有違，應自該解釋公布之日起，失其效力。據此，退撫法第77條第1項第3款有關退休公務人員再任私立學校職務且每月支領薪酬總額超過法定基本工資，應停止領受月退休(職)金之規定，自108年8月23日起，失其效力。","u":"臺北市政府人事處給與科","h":8256,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3662AAA23FF6BE4C","d":"2011-01-01","sid":"3662AAA2"},{"q":"工友(含技工、駕駛)加班後如未支領加班費之補休規定為何？","a":"1.雇主使勞工延長工作時間，或使勞工於休息日工作後，依勞工意願選擇補休並經雇主同意者，應依勞工工作之時數計算補休時數，其補休期限由勞雇雙方協商，補休期限屆期或契約終止未補休之時數，應依延長工作時間或休息日工作當日之工資計算標準發給工資。(勞動基準法第32-1條) 2.該補休應依延長工作時間事實發生時間先後順序補休；補休期限逾勞動基準法第24條第2項所約定年度之末日者，以該日為期限之末日。(勞動基準法施行細則第22-2條) (權責機關本府勞動局及人事處)","u":"臺北市政府人事處考訓科","h":8242,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F40969B108EBB2DB","d":"2011-10-21","sid":"F40969B1"},{"q":"首長駕駛是否適用勞動基準法第84條之1規定?","a":"首長、主管以及獲有配車人員之駕駛，業經行政院勞工委員會86年7月11日（86）台勞動2字第029625號公告核定為勞動基準法第84條之1之工作者。 (權責機關本府勞動局)","u":"臺北市政府人事處考訓科","h":8170,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=12A143ACC07B433A","d":"2011-10-21","sid":"12A143AC"},{"q":"約聘僱人員隨同業務移撥至其他機關後，其原任職期間所繳約聘離職儲金，究應結算予當事人，或逕移續辦？","a":"各機關學校聘僱人員離職給與辦法，訂定意旨係為保障聘僱人員離職後之基本生活，由於某甲隨業務移轉至某機關繼續任職，其間並無離職之事實。是以，如執行無窒礙，其原任職期間所繳約聘僱離職儲金，可逕移該機關續辦，俟符合上開辦法第5條規定發給條件時再予發給。","u":"臺北市政府人事處給與科","h":8120,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=957A8EEF181F02EA","d":"2008-03-13","sid":"957A8EEF"},{"q":"免刷卡首長駕駛加班應如何管理？","a":"依臺北市政府及所屬各機關員工加班費管制要點規定，免刷卡或無法刷卡之員工加班者，其加班起迄時間應有刷卡、簽到退或其他可資證明之紀錄。本處提供出勤紀錄單(如附件)1種供參，各機關可依實際情形自行調整出勤紀錄單格式。\n(權責機關本府人事處)","u":"臺北市政府人事處考訓科","h":7854,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3DFFE73BCC3648A0","d":"2011-10-21","sid":"3DFFE73B"},{"q":"行政院與所屬中央及地方各機關公務人員休假改進措施已放寬國旅卡消費相關限制，請問自109年1月1日起非休假日可否於國旅卡特約商店刷卡消費請領補助？","a":"1 、依國民旅遊卡相關事項Q&A(行政院人事行政總處114年12月修訂)之Q.02.01略以：公務人員自109年1月1日起，使用國民旅遊卡刷卡消費並不限於休假日，惟仍應休完應休畢日數(10日)，至年終未休畢者視為放棄，且應注意遵守辦公紀律，不得於執行職務期間刷卡消費。\n2 、復依前開Q&A之Q. 01.10略以，「 聘用人員聘用條例」及「行政院與所屬中央及地方各機關約僱人員僱用辦法」僱用之人員，依「行政院與所屬中央及地方各機關聘僱人員給假辦法」第6條規定，準用公務人員實施國民旅遊卡措施。","u":"臺北市政府人事處考訓科","h":7441,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=96CCE6A96FBE97CF","d":"2019-03-05","sid":"96CCE6A9"},{"q":"臺北市政府所屬各機關學校員工交通補助費問答集","a":"「臺北市政府所屬各機關學校員工交通補助費問答集」如附件。","u":"臺北市政府人事處給與科","h":7427,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0A1326BD0D479002","d":"2020-09-01","sid":"0A1326BD"},{"q":"勞動基準法一般正常工時與延長工時規定為何?","a":"1.正常工作時間每日不得超過8小時，每週工作總數不得超過40小時。(勞動基準法第30條第1項) 2.延長勞工之工作時間連同正常工作時間，1日不得超過12小時。延長之工作時間，1個月不得超過46小時，但若經工會或勞資會議同意後，延長之工作時間，1個月不得超過54小時，每3個月不得超過138小時。雇主僱用勞工人數在30人以上，依上開但書規定延長勞工工作時間者，應於實施前1日報當地主管機關備查。(勞動基準法第32條第2項及第3項) 3.勞工於休息日工作之時間，計入勞動基準法第32條第2項所定延長工作時間總數。但因天災、事變或突發事件，雇主使勞工於休息日工作之必要者，其工作時數不受同法第32條第2項規定之限制。(勞動基準法第36條第2項) (權責機關本府勞動局)","u":"臺北市政府人事處考訓科","h":7382,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1E9252A81B7DA7A7","d":"2017-02-06","sid":"1E9252A8"},{"q":"想了解臺北市政府各機關組織法規、人員編制及權責劃分，該怎麼查詢？","a":"目前本府各機關的組織法規及編制表，均刊載於人事處網站，可由左列選單的「主題專區」中，點選進入「法規專區」，再點選進入「臺北市政府暨所屬各機關組織法規」，即可查詢。(首頁>主題專區>法規專區>臺北市政府暨所屬各機關組織法規)\n另本府各機關權責劃分，亦可經由人事處網站業務資訊中的「本府分層負責明細表」，查詢各機關之分層負責明細表（甲表）。(首頁>業務資訊>本府分層負責明細表)","u":"臺北市政府人事處管理科","h":6984,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=61DD450B9726180E","d":"2017-12-08","sid":"61DD450B"}]},{"org":"研究發展考核委員會","total":46,"items":[{"q":"請問研考會有那些管制考核的工作?","a":"除了為民服務考核、公文考核及本府所屬市營事業機構年度經營績效考核之外，本會亦列管「重大計畫」、「市政會議市長指裁示事項後續辦理情形」、「災害防救督考」、「臺北市議會市政總質詢、市長施政報告(含專案報告)等議員質詢事項後續辦理情形追蹤列管」及其他臨時交辦之專案查證等。如有任何疑問，可洽詢研考會管制考核組，聯絡電話：(02)27208889轉7782。","u":"臺北市政府研究發展考核委員會","h":5822,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BAE26358EE407E34","d":"2008-12-24","sid":"BAE26358"},{"q":"人民陳情案件如未留下真實姓名及聯絡方式（電話、住址或電子信箱），機關將如何處置？臺北市政府如何保障個人資料安全及避免發生洩密情形？","a":"一、依據「行政程序法」及「臺北市政府及所屬各機關處理人民陳情案件注意事項」規定：陳情案件應載明具體內容、真實姓名及聯絡方式，以利於案件重要內容陳述不明確或有疑義，通知陳情人補陳。如未提供上述資料，機關得不予處理回復。\n二、民眾可自行選擇是否將個人資料提供承辦人員。若民眾選擇不提供，但承辦人員有執行法定職務之需求時，仍可透過申請程序，並經單位主管層級以上人員同意後，取得個人資料。\n三、本府各機關受理人民陳情案件時，對於案內相關文書作業，如有必要之保密事項，其製作、傳遞、保管，均應採密件文書處理，並依「臺北市政府文書處理實施要點」之文書處理保密規定辦理。如有洩漏個資情事，將依規定檢討承辦人員責任，公務員服務法第5條規定公務員有保密義務，如公務人員不慎洩密，亦同時涉及行政程序法、刑法、個人資料保護法等相關規定。","u":"臺北市政府研究發展考核委員會","h":5420,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7E16D8F4FB32167B","d":"2016-06-06","sid":"7E16D8F4"},{"q":"臺北市政府各機關受理人民陳情案件之原則為何？處理人民陳情案件之方式為何？「人民陳情案件處理情形滿意度調查表」如何填寫？","a":"一、臺北市政府各機關受理陳情案件之原則如下：\n(一)人民陳情以書面為之者，包括電子郵件、傳真、網站或相關行動應用程式等在內，應載明具體陳情內容、真實姓名及聯絡方式。\n(二)人民陳情以言詞為之者，包括電話或親至機關陳情，受理機關應作成紀錄，載明陳情內容、真實姓名及聯絡方式，並向陳情人朗讀，或使閱覽請其簽名或蓋章確認後，方據以辦理。\n二、有關陳情案件實質內容之處理，依行政程序法第168條規定及尊重機關專業素養與判斷，由臺北市政府各機關本於權責審慎查證後衡酌辦理，並依「臺北市政府及所屬各機關處理人民陳情案件注意事項」第16點之規定，加強機關內部控制與稽核，責由各機關研考人員落實以案管制作業。\n三、機關回復陳情案件後，請以立案時之「案件編號」及「案件密碼」至本市陳情系統（網址：https://1999.gov.taipei），填寫滿意度調查表。（註：本市陳情系統作業程序另有訂定例外免附滿意度調查表情形）","u":"臺北市政府研究發展考核委員會","h":4412,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=98413F8BEB46B819","d":"2016-06-06","sid":"98413F8B"},{"q":"什麼是i-Voting?","a":"指經行政機關或非行政機關提案，透過多元方式討論，進行意見表達後之投票結果，由議案主責機關參採運用之網路參與機制。","u":"臺北市政府研究發展考核委員會","h":3994,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=48D00BE7C4808834","d":"2017-05-11","sid":"48D00BE7"},{"q":"如何查閱臺北市政府各機關之政府出版品？哪裡可以借閱或購買政府出版品？","a":"本府各機關之政府出版品依規定寄存於「國家圖書館」、「立法院國會圖書館」、「國立臺灣圖書館」、「臺北市立圖書館」、「國立臺灣大學圖書館」、「國立公共資訊圖書館」、「臺南市立圖書館」、「國立東華大學圖書館」、「高雄市立圖書館（總館）」、「屏東縣立圖書館（總館）」等10處圖書館供民眾借閱，並於「五南文化廣場」及「國家書店」等服務據點進行展售。\n另「 臺北市資料大平臺 」提供民眾便利之本府出版品查詢服務，歡迎多加利用。\n如有任何疑問，可洽詢研考會公文及圖資管理組，聯絡電話：(02)27208889轉2277。","u":"臺北市政府研究發展考核委員會","h":3091,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=16EC262DC7A0935C","d":"2014-05-29","sid":"16EC262D"},{"q":"人民陳情案件的處理時效為何？","a":"人民陳情案件辦理期限，依「臺北市政府及所屬各機關受理人民陳情案件注意事項」第14點規定：「各機關受理人民陳情案件處理時限為六個工作日，如因內容複雜無法於處理時限內查處回復或法規另訂有處理期限，應於六個工作日內將預定辦理期程及初步查處結果先行回復陳情人。但最長處理時限不得超過三十日（以日曆天計算）。」本府及所屬各機關應依上開規定辦理。","u":"臺北市政府研究發展考核委員會","h":2901,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D73FD534D0B3F9F8","d":"2016-06-06","sid":"D73FD534"},{"q":"本府各機關受理臺北市陳情系統案件後，應如何辦理改分或代為立案作業？","a":"一、市府各機關請依「臺北市陳情系統作業程序」之規定辦理。\n二、逐級溝通協調：非屬管轄權案件，應簽註意見並與相關管轄權機關人員逐級溝通協調確認，經由機關業務分層負責層級人員核定，於收件後次一工作日內完成改分或代為立案作業。\n三、須現場會勘者：最遲應於次二個工作日內完成改分或移文事宜。","u":"臺北市政府研究發展考核委員會","h":1979,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0E6AE9F84FE194F2","d":"2016-06-06","sid":"0E6AE9F8"},{"q":"臺北市陳情系統案件為何無法查詢處理情形？","a":"可利用臺北市陳情系統案件查詢服務，輸入案件編號、案件密碼及驗證碼，即可查詢案件處理情形（註：如當初以「台北通」會員身分立案者，亦可直接登入會員查詢），若仍無法查詢，請向本府資訊局洽詢，聯絡電話：(02)27208889轉8585。","u":"臺北市政府研究發展考核委員會","h":1956,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4D67FA398B4FBB46","d":"2016-06-06","sid":"4D67FA39"},{"q":"臺北市政府辦理申請案件檢核作業流程為何？","a":"人民依法規申請之案件或各機關受理發給各種證照、證書、提供服務或補助等業務，機關應依「臺北市政府申請案件處理作業要點」填列申請案件處理時限表及流程圖等表件，送本府審查核定；申請案件因法令、作業程序變更及業務需要等因素變動，機關亦應適時自行檢討修正。\n申請案件經審定後，依核定結果公告處理時限表，並完成「台北服務通」網站相關系統功能設定、服務資訊更新等事宜，落實資訊公開及簡政便民之目的，維護民眾申辦權益並提升行政效能。","u":"臺北市政府研究發展考核委員會","h":1901,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=935D280B113214DB","d":"2016-06-06","sid":"935D280B"},{"q":"向臺北市陳情系統網站反映市政問題，但未收到確認信，應如何處理？","a":"向臺北市陳情系統網站反映市政問題後，如事前未登入台北通會員，系統將會自動寄發確認信函。如未接獲確認信函，可先至本市陳情系統網站首頁「待確認案件」功能下確認，並重新發送確認信函；倘確實無法收到確認信函，請向本府資訊局洽詢，聯絡電話：(02)27208889 轉 8585。如為填寫過程中誤繕電子信箱，基於資訊安全問題以及人力考量，目前本府並未提供人工修正電子信箱服務，請以另立新案方式反映市政問題。\n另建議註冊台北通會員，並完成會員電子信箱驗證，後續以會員身份反映案件時，將無須透過確認信機制即可完成立案。","u":"臺北市政府研究發展考核委員會","h":1790,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9422ADA94E3DCE00","d":"2016-06-06","sid":"9422ADA9"},{"q":"我向1999反映的問題，會得到回復嗎？1999對於我反映的事情多久會處理好？如果透過臺北市陳情系統1999網站、台北通App、1999臺北市民當家熱線等管道反映市政問題後，後續如何得知處理結果？我可以撥打 1999 詢問進度嗎？","a":"一、1999協助民眾反映案件時，話務人員會依本府業務職掌分派權責機關妥處，並由權責機關將處理結果上網登錄後，系統再以簡訊方式通知民眾案件已辦結，民眾可自行上網查詢或來電詢問（如民眾於來電立案時主動提供電子郵件信箱，系統於機關辦結後會將回復內容一併寄送至該電子郵件信箱）。\n二、因1999市民熱線為協助民眾反映市政問題之單一窗口，故成立案件後，將以系統後送至權責機關進行處理回復，如該案件性質屬可立即派工之案件時，權責機關受理後即進行處理；針對22項派工案件之處理時限，請至本府「研究發展考核委員會」首頁（網址： https://rdec.gov.taipei/ ）「法規專區」內「話務管理組」之「1999臺北市民當家熱線服務實施計畫」有詳細之一覽表可供查詢；如案件涉及本市行政興革之建議、行政法令之查詢、行政違失之舉發或行政權益之維護等陳情案件，權責機關自收案後隔一工作日起算6個工作天內（不含例假日）回復處理結果。依不同管道反映查詢方式如下：\n（1） 臺北市陳情系統1999網站：如民眾透過本市陳情系統1999網頁（ https://1999.gov.taipei/ ）反映市政問題，因立案過程已完成電子信箱驗證，故成案與結案時，將會分別發送成案通知信件及結案通知信件。結案通知信件會帶入機關回復之文字內容，民眾亦可自行以案件編號及密碼至本市陳情系統1999查詢（如機關回復內容有提供附件者，須以案件編號與密碼至本市陳情系統1999進行查閱）。\n（2） 台北通App：如民眾透過台北通APP首頁「1999」按鈕，使用「有話要說」功能反映市政問題，成案後，可於「有話要說」內的「查詢」頁面檢視機關辦理狀態及辦理完成後之回復內容。如民眾註冊台北通金質會員時，已進行過電子信箱驗證，除可透過APP查詢外，亦會發送成案及結案通知信件。\n（3） 1999臺北市民當家熱線：經完成立案程序後，民眾可使用案件編號及密碼至本市陳情系統1999查詢案件內容及處理結果，案件編號及密碼提供方式說明如下：\n１、提供手機者，系統將於1日（24小時）內發送簡訊提供案件編號及密碼予民眾，結案後，系統也會再發送簡訊通知已結案。","u":"臺北市政府研究發展考核委員會","h":1588,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3968C30EA2953E2A","d":"2024-09-05","sid":"3968C30E"},{"q":"1999檢舉案件提供個人資料是否有洩密之可能? 撥打1999檢舉附近常出沒的幫派份子，他們會不會知道是我檢舉的？","a":"一、本府為保護檢舉人的個人資料，已採取嚴格控管措施，檢舉人資料一經登錄後，話務人員都無權查閱；檢舉人個資若有必要仍將提供給承辦機關調閱聯繫，惟有權限查閱者之查閱紀錄亦會由資訊系統完整保留，俾憑查究洩密責任，以確保民眾的權益。\n二、1999針對來電者資料予以保密，並採取嚴格控管措施，當案件移送權責機關辦理時，您的個人資料僅於必要時提供給該局處知悉，以俾於承辦機關確認檢舉人之真意及訴求。惟檢舉幫派份子一事，屬社會治安事件，建議以撥打110為先。（依據行政程序法第170條、行政院及所屬各機關處理人民陳情案件要點第18點、臺北市政府及所屬各機關處理人民陳情案件注意事項第17點）。","u":"臺北市政府研究發展考核委員會","h":1564,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BC1884EB8EEBFBA9","d":"2024-09-05","sid":"BC1884EB"},{"q":"臺北市政府創意提案競賽的提案人有何限制？評審作業如何進行？","a":"一、臺北市政府創意提案競賽之提案人須為市府各機關同仁。提案須組成2人以上，18人以下之團隊共同參加。其中主要提案人限1人且不得為機關首長，其他參與提案人人數應在1人至17人之間。\n二、評審作業分為初審及複審2階段，說明如下：\n(一)初審作業：各一級機關推薦的提案，先由府外專家學者進行書面審查後，召開初審會議評定入圍提案。\n(二)複審作業：由府外專家學者及府內委員於複審會議聽取入圍單位10分鐘簡報及進行詢答後，評定最終獲獎提案。","u":"臺北市政府研究發展考核委員會","h":1559,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=96A66D66651AD76E","d":"2016-06-06","sid":"96A66D66"},{"q":"對於各機關回復的人民陳情案件內容有疑義，可以向哪個單位反映？","a":"如針對機關回復內容有所疑義，請直接向該案件處理機關之承辦人員或研考人員反映。","u":"臺北市政府研究發展考核委員會","h":1521,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=35F9462D1076771B","d":"2016-06-06","sid":"35F9462D"},{"q":"我的手機來電顯示門號0972570072，是1999臺北市民當家熱線撥打的嗎？我回撥此門號結果電話由1999接聽，需要付費嗎?","a":"本府1999市民熱線外撥服務號碼為0972570072，該號碼為本府多個單位所共用之門號，且為節費電話設備並非免費門號，故無提供免付費服務。日後若您接獲來電顯示號碼為0972570072之電話，且曾於近日致電本府1999市民服務熱線尋求市政相關諮詢、陳情或派工等服務，如有回電需求，建議您可於臺北市境內可以市內電話、第一類電信月租型手機撥打「1999」，本府提供10分鐘免費通話服務；如您使用預付卡，因各家預付卡商品種類名稱繁多，建議您先與所屬電信業者確認撥打「1999」，是否有通話10分鐘免費優惠。另建議您亦可以台北通App撥打1999網路電話，無論發話地區，皆不需支付通話費。同時提醒您，1999市民熱線不會主動要求您提供金融資訊及個人帳號，或引導您進行ATM操作或轉帳行為。若您對於來電有疑慮，可來電1999查證或撥打165反詐騙專線以保障自身權益。","u":"臺北市政府研究發展考核委員會","h":1481,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E45DBEAE4C0385BE","d":"2024-09-05","sid":"E45DBEAE"},{"q":"1999手語視訊問答集","a":"一、1999手語視訊提供哪些服務？ 舉凡1999相關的服務，包括諮詢、陳情、派工等服務皆可以手語方式為聽（語）障朋友解說，另外手語服務人員還可協助聽（語）障朋友撥打市府各機關電話，代為詢問相關市政問題。\n二、1999手語視訊服務的服務時間？ 本府1999手語視訊服務時間為週一至週六9時至18時；文字服務時間為全年24小時不打烊。\n三、1999手語視訊服務要如何才能使用？民眾如何透過個人電腦連接1999手語視訊服務員？\n（一）透過本府各機關單位服務點（請參考臺北市政府研究發展考核委員會官網，業務資訊＞1999市民熱線＞手語視訊公共服務點）Teams設備連線之民眾，可於設備前直接連線，不需申請帳號，設備開放時間以設備所在地點上班服務時間內為限。\n（二）另外，自103年起，民眾可透過免費通訊軟體LINE，將1999手語視訊服務ID（taipeicity1999）加入聯絡人名單，經1999手語服務人員進一步確認使用者聽（語）障身分後，即可提供1999 LINE手語視訊服務。 （三）自114年5月1日起，民眾可透過免費通訊軟體Teams，搜尋「taipei1999_1@outlook.com」加入聯絡人即可聯繫1999手語視訊服務人員，經1999手語服務人員進一步確認使用者聽（語）障身分後，即可提供1999 Teams手語視訊服務。\n四、臺北市內有哪些地方可以使用公共的1999手語視訊服務？\n請參考臺北市政府研究發展考核委員會官網，業務資訊＞1999 市民熱線 ＞手語視訊公共服務點。\n五、使用LINE或Teams軟體時若遭遇問題時如何解決？ 只要通話者雙方都有LINE或Teams的帳號，並使用配有網路攝影機及足夠頻寬的電腦或行動裝置，就能隨時進行免費的LINE或Teams視訊通話，目前Teams軟體由微軟公司提供，而LINE軟體由LINE公司提供，可於該公司官網查詢民眾常問的問題，依其說明指引，尋求解決的方式。\n六、如何申請臺北市政府社會局及臺北市勞動力重建運用處提供之手語、聽打翻譯服務？\n您可透過以下連結直接於線上提出申請：\n(一)社會局-臺北市聽語障溝通服務方案[ 連結 ]\n","u":"臺北市政府研究發展考核委員會","h":1284,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F5CEE86CEA66A092","d":"2024-09-05","sid":"F5CEE86C"},{"q":"i-Voting制度的沿革","a":"i-Voting係於104年8月5日頒布「臺北市政府i-Voting網路投票作業注意事項」，系統於105年1月上線，由於面臨許多挑戰，如投票率低、1人多票易導致灌票，及i-Voting定位不清等問題，在經過滾動式修正，分別於106年3月20日、107年5月4日及112年8月23日及114年10月22日函頒修訂之「臺北市政府網路投票作業要點」，將i-Voting之定位重新設定，並新增提案補正及因應情勢變遷得終止提案之程序等規定 。","u":"臺北市政府研究發展考核委員會","h":1275,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FC58301C2B76E786","d":"2017-05-11","sid":"FC58301C"},{"q":"1999是市政府的什麼機關？1999臺北市民當家熱線提供的服務範圍有哪些？","a":"一、「1999臺北市民當家熱線」屬市政府電話服務整合式窗口，委由勞務廠商營運，並由本府研考會進行督導管理。\n二、1999市民熱線提供的服務包括諮詢服務（由話務人員提供一般性、告知性之簡易市政諮詢服務，如：勞資爭議；若非屬本市市政服務範圍，話務人員將協請民眾改撥適當電話洽詢，如：詢問中央健保署業務）、轉接服務（若民眾諮詢內容涉及行政、技術專業判斷或裁量，話務人員將轉接來電至業務單位或承辦人員，如：建照使照核發進度問題）、陳情服務（話務人員受理民眾以電話陳述有關本市行政興革之建議、行政法令查詢、行政違失之舉發或行政上權益之維護等具體陳情案件，如：占用防火巷並登錄陳情系統列管）、派工服務（話務人員受理民眾以電話方式請求本府各權責機關派工，並登錄派工系統列管，如：路樹處理）等服務類型。","u":"臺北市政府研究發展考核委員會","h":1273,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=55B67D9F0BA0BB8E","d":"2024-09-05","sid":"55B67D9F"},{"q":"半夜打1999，也會有人接聽嗎？公共電話能不能打1999？為何使用公用電話無法免費?","a":"一、本府1999市民熱線為24小時全年無休，竭誠為民眾提供市政相關服務。\n二、公共電話能撥打1999，但是需要付費，通話費1分鐘1元。因本市公共電話有多種型式，分布亦較為零散，在免付費設定作業上，較市話及行動電話設定費成本金額高，鑑於「1999臺北市民當家熱線」提供市政諮詢、派工、陳情、轉接等非緊急市政業務之服務，不同於110、119之緊急報案性質，故目前未開放公共電話撥打免費。","u":"臺北市政府研究發展考核委員會","h":1191,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D1A7933343212BC4","d":"2024-09-05","sid":"D1A79333"},{"q":"我在臺中撥打1999也可以嗎？人在外縣市撥打1999需要加02嗎？","a":"一、近年來各地方政府陸續開辦1999專線，因電信業者的通訊系統會判斷發話地點，所以在臺中市撥打1999，會連到臺中市1999，在臺中欲撥打臺北市1999，請撥02-27208889。\n二、因「1999」簡碼為國家通訊傳播委員會（NCC）統一律定，供各縣市政府使用之簡碼，在臺北市撥打等同於撥打市府總機27208889，如您在外縣市需要「1999臺北市民當家熱線」之服務，請撥打02-27208889。\n三、若使用台北通App撥打1999網路電話，無論身處何處，皆能尋求1999臺北市民當家熱線服務，而且不需支付通話費。","u":"臺北市政府研究發展考核委員會","h":1078,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88340C513A6C2C1E","d":"2024-09-05","sid":"88340C51"},{"q":"為何在臺北市以手機撥打1999卻是轉到新北市?","a":"「1999」簡碼為國家通訊傳播委員會，統一律定用以取代各地方政府原7~8碼便民專線之簡碼以方便民眾記憶及使用，在臺北市撥打1999等同於撥打市政府總機，因此縣市交界民眾使用市話或網路電話撥打1999，由於各縣市1999落地碼不同，並不會產生受話端錯誤之情形；至於使用手機撥打1999，因電信業者縣市交界地區基地臺設置位置，造成有部分通訊信號由新北市或臺北市之基地臺接收，因此會發生在臺北市撥打卻由新北市接收之情形。建議使用者如在縣市交界處使用手機，請改撥縣市政府總機，如臺北市政府總機為02-27208889、新北市政府總機為02-29603456。\n另外，本市自111年8月起，您只要使用台北通App撥打1999網路電話，無論發話地區，皆能尋求1999臺北市民當家熱線服務，而且不需支付通話費。","u":"臺北市政府研究發展考核委員會","h":1037,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0106A3DE7FEF1BB1","d":"2024-09-05","sid":"0106A3DE"},{"q":"i-Voting新制和舊制不同之處","a":"新制將i-Voting定義與流程更加明確化，除了詳列6階段各階段執行工作、非行政機關提案方式與管道，及提案範圍外，並新增提案/討論平臺、成立審查會議及納入外聘委員，使審查更為客觀中立。同時，亦強化議案主責機關應將投票結果後續執行進度與內容持續公布，以及宣傳，讓民眾了解提案內容及提高訊息知曉度和參與度。","u":"臺北市政府研究發展考核委員會","h":1029,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=50A82DE0002AF8D4","d":"2017-05-11","sid":"50A82DE0"},{"q":"民眾是否可申請調閱1999錄音檔案或語音轉文字檔案？能調閱的檔案離現在最久為幾年？申請方式、處理時間及處理結果取得方式為何？","a":"一、可以，但必須為本人通話內容才能申請，且1999所保有之錄音檔案及語音轉文字檔案為民眾進線由話務人員接聽服務者，如為撥打1999並自行輸入分機，或由話務人員轉出至機關接聽者，則無相關檔案可提供。\n二、自113年7月1日起，只能申請調閱自蒐集日5年內之錄音檔案；另自114年12月29日系統上線之日起，提供申請調閱自蒐集日5年內之語音轉文字檔案。上述檔案超過該5年者將定期刪除，無法提供申請調閱。\n三、民眾須以書面方式，可以線上或郵寄方式向本會申請，且須符合政府資訊公開法第10條要件，本會參考法務部「政府資訊申請書」格式，訂定「臺北市政府1999音檔申請書」。 （線上申請）請至「台北服務通」填寫並送出線上申請表及上傳相關文件。 （書面申請）請填妥「臺北市政府1999音檔申請書」[ 官網連結 ]後郵寄至本府研考會（110204臺北市信義區市府路1號11樓東南區，臺北市政府研究發展考核委員會收）。\n（一）申請人姓名、出生年月日、國民身分證統一號碼、設籍或通訊地址、聯絡電話；如為外國人申請，請註明立案證號或國籍、護照號碼及檢附相關證明文件。\n（二）申請人未滿18歲，如有法定代理人，請填寫其姓名、出生年月日、國民身分證統一號碼、設籍或通訊地址、聯絡電話。\n（三）申請之政府資訊內容要旨（請概述該通來電與1999話務人員對話之重點）及申請件數。\n（四）申請用途。\n（五）申請日期。\n四、另為確認係本人申請調閱其進線1999錄音檔案或語音轉文字檔案，以避免侵害個人隱私，須隨同申請書檢附本人國民身分證影本；外國人請附上居留證或護照影本。\n五、本府研考會受理後將依政府資訊公開法第12條規定於15日內以公文函復審核結果，必要時得酌予延長且不超過15日；經審核通過後，將以電子郵件方式傳送申請人，如需光碟郵寄者，請於寄件地址填上郵寄地址。\n六、另依政府資訊公開法第11條規定，申請文件如有缺漏，本府研考會將通知申請人於7日內補正，如不能補正或屆期不補正者，將駁回申請。\n七、提醒您，語音轉文字檔案為機器轉譯之原生文本檔案，未經人工校對，僅供參考，可調閱原始音檔，進一步比對。","u":"臺北市政府研究發展考核委員會","h":1017,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F8F01796E636F326","d":"2024-09-05","sid":"F8F01796"},{"q":"1999與110有什麼不同？1999與119有什麼不同？","a":"「1999臺北市民當家熱線」為民眾與臺北市政府間溝通平台，提供市政諮詢、派工、陳情、轉接等非緊急市政業務之服務。110是警察機關受理民眾緊急報案專線，若為治安暴力事件、刑民事案件、社會秩序、災害事件、交通事故及交通違規報案等之需求，建議優先撥打110求助。另外，119為消防機關救災救護專線，其服務範圍包括預防火災、搶救災害及緊急救護。民眾若為火災通報或緊急救護之需求，建議優先撥打119求助。","u":"臺北市政府研究發展考核委員會","h":836,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F2B1CAE69994D45D","d":"2024-09-05","sid":"F2B1CAE6"},{"q":"為何1999話務中心有10分鐘通話/轉接限制？","a":"一、為珍惜社會資源，避免通話時間過長而占用其他市民即時需要「1999」服務的機會，且根據本府1999話務中心統計，民眾撥打「1999」查詢市政資訊、要求派工或反映陳情案件的平均服務時間約在3分鐘，為考慮若干市民向1999陳情，需要較長的通話時間，且兼顧其他市民需要1999服務的權益，而合理將通話時間的上限設定為10分鐘。且為避免10分鐘系統自動斷線造成民眾困擾，若民眾尚有其他市政服務需求，話務人員將請民眾提供聯絡電話，俾於先處理其他線上等候民眾的電話後，再提供回撥1通服務。\n二、本會業已於系統進行電話分流設定，若民眾需較長時間與本府各機關同仁洽詢較細項之市政問題，可撥打市政總機02-27208889（使用者付費電話）並直撥分機號碼（不經「9」由話務人員轉接），即可不受前述通話時間限制。","u":"臺北市政府研究發展考核委員會","h":672,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=09AFA1965B7C9C23","d":"2024-09-05","sid":"09AFA196"}]},{"org":"動物園","total":42,"items":[{"q":"動物園內有提供場地租借服務嗎？","a":"臺北市立動物園場地租借申請辦法：","u":"臺北市立動物園","h":61751,"t":"動物保護","l":"https://www.zoo.gov.taipei/News_Content.aspx?n=69FD68712E5644A6&sms=5D69554CB93131CF&s=F3D4AD74B27A7D15","d":"2022-09-17","sid":"F3D4AD74"},{"q":"何謂動物的刻板行為？","a":"動物行為有某些表現，如重複一成不變的動作，這些表現出現頻率高且沒有明顯的功能目標，我們認知這可能是刻版行為。 這種行為尤其在圈養的動物中比較常見，動物在自然界中的天性逐漸消失或者不能完全表達，這時候就會出現刻板行為，如大象搖頭晃腦，虎的來回踱步，重複無目的性的行為。 主要原因是缺乏配合其各種自然習性之圈養環境與方法提供動物生理與心理的需求。野生動物圈養在動物園可以增加其避免在野外所受到的攻擊或較惡劣天候的影響，從而減少其身心之負擔，然而動物管理員每天定時飼養，同樣的食物，同樣的時間，同樣的食量。動物不能像在自然中一樣為了生存去做一些有功能性的事情(如覓食與繁衍)，這種特別規律的事情就會導致動物刻板行為的產生。 為了減少這些刻板行為，圈養場地會採取環境豐富化布置、食物供應變化、感官需求變化，甚至動物的族群結構與個體社群關係調整安排等等，都能降低刻板行為。","u":"臺北市立動物園","h":23399,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FD01254E9690D2B5","d":"2022-08-10","sid":"FD01254E"},{"q":"動物園內是否有提供免費WIFI無線網路？","a":"園內 Wi-Fi (Taipei Free熱點) 設置點：","u":"臺北市立動物園","h":13046,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=73AACE5DD2C7B1A3","d":"2022-09-29","sid":"73AACE5D"},{"q":"可以從貓空纜車動物園南站入園嗎？","a":"可以，本園動物園南站入口位於貓空纜車動物園南站外約步行10公尺，可使用電子票證(悠遊卡、一卡通、愛金卡)閘門感應扣款入園，亦可至自動售票機購票入園。\n本站售票皆 含單程車資 ，需搭乘接駁列車至鳥園車站始得參觀園區。\n溫馨提醒","u":"臺北市立動物園","h":10946,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=24200C9DDE1F0A98","d":"2022-10-10","sid":"24200C9D"},{"q":"為什麼動物園禁止寵物入園呢？","a":"為了保護您的寵物安全及園內動物健康，敬請來園遊客支持與配合，不要攜帶寵物入園，且勿將寵物放置於手提袋或背包裡攜帶寵物入園喔！","u":"臺北市立動物園","h":7857,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=47D85804070D7BE5","d":"2022-10-07","sid":"47D85804"},{"q":"動物園內飲水機位置在哪裡？有提供熱水嗎？","a":"園區 飲水機 冷溫水 設置點：\n另考量熱水使用安全及遇燙傷事件之緊急救護時效，經評估部分地點開放熱水服務，供應哺乳媽媽及所有需要的遊客。\n園區 飲水機 提供 熱水 設置點：","u":"臺北市立動物園","h":7583,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=694DDE4AB9F8FCC2","d":"2022-09-27","sid":"694DDE4A"},{"q":"動物園內哺乳室位置？有提供嬰幼兒特別服務嗎？","a":"園區 哺乳室 設置點：\n園區 尿布臺 設置點：\n娃娃車租借服務 ：","u":"臺北市立動物園","h":7420,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=12441AD29A65D7E4","d":"2022-09-30","sid":"12441AD2"},{"q":"為什麼動物園小黑蚊那麼多？有沒有預防措施？","a":"本園腹地廣大又屬山區，春夏是小黑蚊最活躍的時候。\n預防措施：\n【小黑蚊】閩南話俗稱「烏微仔」或「黑微仔」，也有人叫牠「小金剛」，但小黑蚊並不是蚊子，成蟲體長約1.5mm。","u":"臺北市立動物園","h":7097,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7CDF1E5E423DED02","d":"2022-08-29","sid":"7CDF1E5E"},{"q":"坐輪椅或推娃娃車搭乘遊客列車是否可以免排隊？","a":"基於安全考量，皆須依序排隊。於列車站排隊候車時，輪椅可由工作人員引導由出口進入(限1位坐輪椅+1位推輪椅的人) ，俾使用車尾無障礙設施，惟仍須依排隊先後，依序上車。","u":"臺北市立動物園","h":6526,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E35A8058FDF09B02","d":"2022-07-10","sid":"E35A8058"},{"q":"動物園內廣場噴泉展示時間為何？","a":"噴泉展示時間：\n歡迎前往觀賞並注意隨行小朋友及自身的安全","u":"臺北市立動物園","h":5810,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6C0AAFDE84600F50","d":"2022-10-07","sid":"6C0AAFDE"},{"q":"為什麼撿到的動物或家中寵物不可以送給動物園？","a":"動物園基於防疫不直接收容寵物(包含家禽)，依規定也不收容保育及非保育類的動物，惟在正常流程並經動物園評估可行後送至動物園，經檢疫合格後，於適當之展區展示。\n若發現野生動物，請主動通報相關單位，動物保護處將主動協調通知轄區消防局派員前往救援與暫時收容照顧。若為保育類野生動物，將俟動物生理健康狀態決定是否適宜野放，或後送至公民營野生動物收容中心進行長期收容。\n通報專線：\n洽詢單位：","u":"臺北市立動物園","h":5687,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=358C78A73CA79A25","d":"2022-08-24","sid":"358C78A7"},{"q":"動物園內是否設有無障礙廁所？","a":"園區 無障礙廁所 設置點：","u":"臺北市立動物園","h":5680,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B099D74329FBEB3E","d":"2022-07-31","sid":"B099D743"},{"q":"動物園全面禁菸嗎？","a":"本園為無菸公園示範區， 園區全面禁菸(含門外廣場) ，配合菸害防治法，違者最高可罰一萬。","u":"臺北市立動物園","h":5027,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5E0E934B317672E9","d":"2022-10-05","sid":"5E0E934B"},{"q":"動物園內有提供遊客緊急電話服務嗎？位置在哪裡？","a":"園區 緊急☎電話 設置點：\n供應有需要的遊客使用，只須拿起電話即可直接和遊客服務中心人員通話。","u":"臺北市立動物園","h":4307,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4618F871AA326EE1","d":"2022-09-30","sid":"4618F871"},{"q":"當我在動物園內拾得或遺失東西時，該怎麼辦？","a":"拾得時：\n遺失時：\n1個月內 遺失物資料查詢","u":"臺北市立動物園","h":4108,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=27605881D13436DC","d":"2022-09-15","sid":"27605881"},{"q":"動物園參觀門票有含保險費嗎？","a":"動物園參觀門票並沒有包含保險費用。 園內有 提供第三人公共意外責任險 (因園方設施導致受傷，憑相關醫療單據可與保險公司協商評估後給予理賠)。","u":"臺北市立動物園","h":3762,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9B5B4BA9426D3ED5","d":"2022-10-12","sid":"9B5B4BA9"},{"q":"動物園內是否有提供電動輪椅充電服務?","a":"園內 電動輪椅 臨時充電設置點：","u":"臺北市立動物園","h":3732,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A65CE75EAC1C3A64","d":"2022-07-08","sid":"A65CE75E"},{"q":"導盲犬可以進入動物園嗎？","a":"依 身心障礙者權益保障法第60條 之規定：「視覺功能障礙者由合格導盲犬陪同或導盲犬專業訓練人員於執行訓練時帶同導盲幼犬，得自由出入公共場所、公共建築物、營業場所、大眾運輸工具及及其他公共設施。」","u":"臺北市立動物園","h":3123,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=043D95D047072032","d":"2022-10-09","sid":"043D95D0"},{"q":"遊客列車是否有無障礙車廂？輪椅可否上車？","a":"列車的車尾，設有無障礙座位。 輪椅可以上車。 如有需求，請告知現場服務人員。","u":"臺北市立動物園","h":2949,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8C022E648808342C","d":"2022-07-16","sid":"8C022E64"},{"q":"為什麼在展示場常常看不到動物？","a":"野生動物具有隱蔽特性。 動物在其棲地都可能有天敵或捕食的對象，彼此都希望對方不要直接看到自己，因此會躲到隱蔽處如草樹叢、岩石壁、低窪區等。對陌生的物種或個體接近也比較敏感而躲藏在展示場不易發現的角落。 動物展示的時間與其實際生物活動時間有落差。 許多動物主要是晨昏或是夜間活動，因此在白天的展示場不易看見。許多媒體將動物每日較活躍的一小段時間剪輯成數秒或數分鐘的影片，比較下也是常讓一般公眾誤解不容易看到動物的原因之一。 動物需要休息，沒有必要的活動不易在日常生活中出現，除非有非必要的外力刺激。 動物活動會耗費其能量，為了其自身的利益(滿足生理能量所需、提昇壽命、繁衍後代等)，自然環境中還要備能逃避天敵或捕捉獵物，在一日的生活中大部分的時間都是在隱蔽處或利用保護色休息，不希望被打擾，因此而看不到動物。 有時因管理上的需求我們會暫時將動物隔離出展場而看不到動物。 例如某些個體需要在安靜的環境下準備配對繁殖或懷孕，或是年老需要加強保護治療的個體，會移到非展示區讓保育員或與獸醫能做更好的管理與醫療。 綜合上述因素再加上展示區大動物個體小且分散或屬獨居型特性的動物也較不易看到。","u":"臺北市立動物園","h":2462,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=62AA06363AF43DCA","d":"2022-08-25","sid":"62AA0636"},{"q":"動物園內是否有無障礙坡道，室內館動線輪椅是否暢通？","a":"動物園戶外區皆有無障礙坡道，室內館動線順暢也有電梯可使用。","u":"臺北市立動物園","h":2361,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9151847D90E3FFC6","d":"2022-07-23","sid":"9151847D"},{"q":"持有效期內的動物認養【動物褓姆】或【動物寶貝】卡如何入園？","a":"持本園核發有效期內之 動物認養卡 得 免票入園5次 ，請至諮詢服務窗口向服務人員出示有效期限內動物認養卡，由服務人員查驗及登記後，即立即協助入園。","u":"臺北市立動物園","h":2075,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5FA9F5133E2CCC22","d":"2022-10-11","sid":"5FA9F513"},{"q":"動物園內有提供ATM服務嗎？","a":"園內目前有ATM提款機設置， 有需求之遊客請至 遊客服務中心旁 提領。","u":"臺北市立動物園","h":1544,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=92562221EF9FC35D","d":"2022-09-01","sid":"92562221"},{"q":"動物園的老年動物照養方式？","a":"加強提供圈養動物的基本五大自由 免於饑渴的自由 免於不適 免於痛苦、傷害或疾病的自由 表達正常行為的自由 免於恐懼和痛苦 加強動物日常活動的觀察與紀錄 加強與獸醫的聯繫與健康檢查 適當的安排或驅使動物活動延緩肌少症的發生時間","u":"臺北市立動物園","h":852,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EF0CCAEDE0975ABA","d":"2022-08-21","sid":"EF0CCAED"},{"q":"為什麼常看到動物的身體有脫毛現象？","a":"換季時會有的現象 可能因蛋白質缺乏，不足以提供毛髮生長；或是有助於毛皮之營養素，維生素A、E、C、生物素、鋅、銅等缺乏；或是多元不飽和脂肪酸 Omega-3 (α-次亞麻油酸 ALA) 缺乏。 可能因刻板行為、年齡或病理問題 常需配合上述各種可能探討出問題的成因，做進一步的分析。","u":"臺北市立動物園","h":707,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8EB184E3FCCF9539","d":"2022-08-13","sid":"8EB184E3"}]},{"org":"原住民族事務委員會","total":29,"items":[{"q":"原住民家庭租屋補助要如何申請?有何資格限制?","a":"一、申請資格：本補助每年受理二次，自04月01日至04月30日止、08月01日至08月31日止，內容請詳見本會官網最新消息或向各區公所原住民服務員洽詢。\n二、申請方式：檢具以下資料，向本市十二區公所申請，應附申請表一份、切結書一份、全戶戶口名簿影本（含配偶）、財稅資料證明、房屋租賃契約書影本、申請人存摺封面影本、家庭內有25歲以下仍在學者，需檢附學生證影本、其他-臺北市低收入戶卡、失蹤報案單、在監服刑證明、優惠利率存款證明、合法房屋證明等。\n（一）本補助受理前會將受理資訊放置於本會網站，請您隨時注意，或請來電洽詢。\n（二）本項補助目的是為減輕原住民租用「住宅」之壓力，如承租目的是為營利（非供住宅）使用，則不在補助範圍內。\n（三）臺北市政府仍有其他租屋補助措施，仍得以擇優申請。\n（四）本會將定期提供稅捐稽徵單位申請補助之相關租賃資料，供其備查。\n聯絡電話:1999(外縣市02-27208889)轉分機2077\n單位：社會福利組\n聯絡人：嚴小姐","u":"臺北市政府原住民族事務委員會","h":10079,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0714FC733E0478C9","d":"2021-11-09","sid":"0714FC73"},{"q":"請問臺北市政府原民會針對原住民兒童相關托育補助有幾種？補助有何資格限制？","a":"一、補助類別\n(一) 針對學齡前（0至6歲）原住民兒童就托臺北市立案托育機構補助每學期4500元至4萬8000元不等之補助金額。\n(二) 針對學齡（6至12歲）原住民兒童就托私立立案兒童課後照顧服務中心提供每月3,500元至4,500元不等之補助金額。\n(三) 本會為保障本市原住民兒童之權益，並加強照顧本市原住民幼童，以及為使本市原住民家長可同時兼顧就業及育兒，補助平日課後留園費用補助標準，說明如下：\n1.公立幼兒園：每月最高補助1,000元，一學期最高補助4,500元，實際費用未達4,500元，則申請實際金額。\n2.私立幼兒園、非營利幼兒園、準公共幼兒園、托嬰中心及公共社區托育家園：每月最高補助1,000元，一學期最高補助6,000元，實際費用未達6,000元，則申請實際金額。\n二、補助對象：設籍並實際居住臺北市且就讀臺北市立案托育機構，為0-12歲具原住民身份之兒童。\n三、補助限制：\n(一) 兒童及父母其中一方設籍並實際居住本市。\n(二) 家庭收入每人每月平均未達本市當年度最低生活費標準2倍之限制規定，但未滿２歲者，不在此限。\n(三) 其他機關若與原民會辦理之補助重複者，同額補助則僅能擇一，其他則以差額補助之（如社會局及教育局辦理托育、就學補助）。\n小小叮嚀：臺北市政府原民會將針對該申請案件不定期實地訪視實際就托及實際居住情形。\n若查出未實際居住之事實，已請領該補助款者辦理追繳，尚未請領者一律駁回。\n聯絡電話:\n十二區公所原住民服務員\n或1999(外縣市27208889)轉2019\n單位:社會福利組\n聯絡人:王小姐","u":"臺北市政府原住民族事務委員會","h":7330,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F53A756CFCB07D01","d":"2023-10-19","sid":"F53A756C"},{"q":"請問臺北市市民在承租房子有什麼補助措施？","a":"臺北市政府辦理各項租屋補助措施中，除本會辦理之「都市原住民家庭租屋補助」外，尚有「原住民婦女扶助－房租補助」、社會局辦理之「低收入戶房租補助」、「身心障礙者賃房屋租金補助」，及都市發展局辦理之「整合住宅資源－租金補助」等等，您可依自身條件及需求擇優申請。 聯絡電話:1999(外縣市02-27208889)轉分機2077 單位：社會福利組 聯絡人：嚴小姐","u":"臺北市政府原住民族事務委員會","h":6728,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=60212558B8D6224A","d":"2021-11-09","sid":"60212558"},{"q":"設籍臺北市之原住民學生，可以申請何種原住民學生補助？","a":"※小小叮嚀:各項教育補助項目，於每學期開學後開始受理，如有疑問，可洽詢各就讀學校、各區公所原住民服務員或臺北市政府原住民事務委員會。\n※聯絡電話:1999（外縣市02-27208889）轉8339 汪小姐","u":"臺北市政府原住民族事務委員會","h":6019,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F9F03DF617FCAF4E","d":"2023-10-19","sid":"F9F03DF6"},{"q":"請問原住民單親婦女有什麼補助可以申請?","a":"一、依據「臺北市原住民婦女扶助自治條例」之規定，申請者需設籍臺北市四個月以上，年滿十六歲之原住民婦女，且已依其他法令規定扶助者不予辦理，另審查過程如有必要時，本會將派請工作人員訪視。\n二、本市原住民有下列情形之ㄧ，致生活困難者，得由本人或法定代理人，填具申請書並檢附相關證明文件，向本會提出申請。\n1. 夫死亡、失蹤、入獄服刑、或重大傷病者。\n2. 遭受家庭暴力者。\n3. 遭受性侵害者。\n4. 從事色情行業待轉業者。\n5. 未婚生子或離婚而自行撫育未成年子女者。\n6. 其他生活上發生重大變故者。\n三、扶助項目如下：\n1. 緊急生活補助。\n2. 訴訟及法律服務費用補助。\n3. 醫療費用補助。\n4. 心理治療費用。\n5. 生育補助（含生活補助）。\n6. 職業訓練及生活津貼。\n7. 收容安置及補助。\n8. 房租補助。\n四、本會辦理婦女第二專長訓練優先受訓。\n五、本會辦理原住民職業訓練專班優先受訓。\n六、本會辦理就業媒合服務優先推荐予求才廠商。\n七、優先承租原住民文化公寓(東湖C、E基地國宅)。\n八、優先進入公托或公幼、額滿國中優先入學、額滿國小優先入學。\n聯絡電話:1999(外縣市02-27208889)轉分機2017\n單位：社會福利組\n聯絡人：潘小姐","u":"臺北市政府原住民族事務委員會","h":5848,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C836B765CDC6157A","d":"2021-11-09","sid":"C836B765"},{"q":"請問家裡若突然發生變故（例如家人生重病、過世…等），可以申請急難救助嗎？","a":"一、依據臺北市政府原住民族事務委員會原住民急難關懷慰助金核發要點之申請要件：\n1.須設籍並實際居住本市之原住民，申請災害救助者不以此為限。\n2.遭遇急難事故，未獲本市社會救助者;或雖獲政府資源救助或照顧，但因族群或生活文化之特殊性，而影響其生活陷入困境者。\n3.其他特別要件詳如急難特別慰問金之附表。\n二、急難特別慰問金種類如下：\n1.生活救助：負擔家計者罹患長期疾病、失業、無一定雇主致收入不穩定或家庭成員發生重大變故，致生活陷入困境者。\n2.醫療補助：罹患嚴重傷病、住院三天以上，所需醫療費用非其本人或扶養義務人所能負擔者。\n3.死亡救助：戶內人口死亡，無力殮葬者；或協助本市原住民完成殮葬程序之人。\n4.災害救助：在本市內遭遇天然災害或其他由中央主管機關公告認定之重大災害者。\n聯絡電話:1999(外縣市02-27208889)轉分機2017\n單位：社會福利組\n聯絡人：潘小姐","u":"臺北市政府原住民族事務委員會","h":5165,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3EF68362CCCF35AE","d":"2021-11-09","sid":"3EF68362"},{"q":"原住民族合作社及事業體發展補助的規定有哪些？","a":"一、補助對象：\n(一)原住民族合作社：\n1、社址設於本市並向臺北市政府社會局(以下簡稱社會局)依法登記有案，原住民社員超過該社社員總人數80%之合作社且原住民社員所持有之股份超過總股份數50%。\n2、經營業務以合作社法第3條第1項第1款至第5款為限。\n(二)原住民族事業體：\n於本市依公司法、商業登記法或有限合夥法設立登記之公司、商業或有限合夥且實際營運，其代表人設籍本市且具原住民族身分者方能申請。\n二、補助項目：\n(一)營運基本設備費用。\n(二)房租費用。\n(三)業務研習經費。\n(四) 參與產業、學校或有關機構媒合及參與國內、外經貿交流活動、展覽或競賽費用(實體或線上)。\n三、補助額度：\n前項各款補助項目擇一補助，每原住民族合作社或原住民族事業體，當年度補助金額最高以新臺幣伍萬元為限。\n四、各款補助項目之補助期間，以受理申請當年度支用單據為限。\n五、本補助案申請單位檢具應檢附文件，透過「臺北市政府市民服務大平臺」向臺北市政府原住民族事務委員會 以下簡稱本會 提出申請，逾期提出申請者，當年度不予受理。\n※ 小小叮嚀:\n一、受補助者有下列情形之一者，得視情節輕重，撤銷或廢止原核定補助處分之全部或一部分，並命其返還已撥付之全部或一部分補助款：\n(一)以詐欺或其他不正方式申請補助或檢具之申請資料有虛偽、隱匿等不實情事。\n(二)未依補助款用途支用。\n(三)檢附不實文件辦理核銷或有虛報、浮報之不實情事。\n(四)同一補助案已獲其他政府機關同一性質補助款。\n(五)其他違反本須知規定之情事。\n二、本須知補助所需經費由本會當年度預算額度內支應，預算額度用罄時，不再受理補助申請，並於本會網站公告之。\n※ 聯絡電話:1999（外縣市02-27208889）分機2013\n單位：經濟建設組\n聯絡人:林小姐","u":"臺北市政府原住民族事務委員會","h":4576,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6C42B44284F88E2D","d":"2021-11-03","sid":"6C42B442"},{"q":"請問就托本市私立托兒童照顧服務中心(安親班) 申請托育補助時，必須檢附族語證明嗎？","a":"否。依據臺北市原住民托育補助要點，為保障本市原住民兒童就學權益，已取消檢附族語證明之申請文件。\n聯絡電話:1999(外縣市請撥02-27206001)轉2019\n單位:社會福利組\n聯絡人:王小姐","u":"臺北市政府原住民族事務委員會","h":4399,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8733BB2D3E0E0CD8","d":"2021-11-09","sid":"8733BB2D"},{"q":"請問北原會館之功能及如何前往該館？","a":"本會會館服務項目如下：\n一、第1樓右側服務中心為供交誼、座談之用。\n二、第2樓層之電腦教室為供電腦教學研習之用。\n三、第2樓層之會議室為供會議或座談會之用。\n四、第3樓層之學科教室為供學科研習或術科教學之用。\n五、第4樓層之舞蹈教室為供舞蹈教學訓練之用，另設有市立圖書館借還書工作站，提供社區居民圖書借閱服務。\n六、本會館除以上功能及服務外，目前也是本市原住民族部落大學校舍，提供本會推動民族教育及終身學習之據點。\n地址：臺北市南港區向陽路49號\n電話：02-27828740\n交通資訊：從捷運昆陽站下車，沿忠孝東路七段向東走，左轉向陽路，步行約5-10分鐘即可到達。\n會內聯絡電話02-27206001分機18或1999(02-27208889)轉2072 高小姐。","u":"臺北市政府原住民族事務委員會","h":4230,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8FD755ED0D668625","d":"2018-03-23","sid":"8FD755ED"},{"q":"要如何申請貸款利息補貼？","a":"（1）本項貸款利息補貼最長以六年為限。\n（2）利息補貼之核算標的及標準如下：\nA、核算標的係指第一階段應檢附文件所載貸款餘額證明文件之貸款餘額。\nB、第一年最高以新臺幣一百萬元為限。\nC、自第二年起以原民會核定補貼利息之貸款金額逐年遞減百分之十。但補貼期間之(或平均)貸款餘額，如小於前述金額者，以實際之(或平均)貸款餘額核算。\n（3）補貼利率：\nA、創業性貸款：每年之利息補貼計算基準按台北富邦銀行每年七月第一個營業日基準利率核算。\nB、一般性貸款：按前開基準利率五折核算。\n（4）貸款金額及還款年限未達前項規定者，依實際貸款金額及還款年限補貼；超過規定部不予補貼。\n4.申請程序：申請人備妥應檢附之文件，並透過「臺北市政府市民服務大平臺」向本會提出申請，或洽各區公所。\n5.作業程序：\n申請人申請貸款利息補貼第一階段獲核准後，應自行於每年九月起檢齊第二階段應備之資料於十月底前向原民會或各區公所申請貸款利息補貼，逾期申請，當年度不予受理，並視同放棄該年度補助。\n6.注意事項：\n（1）違反本項規定者，除不再補貼外，並應追繳已補貼之金額。\n（2）凡戶籍或營業稅籍遷出本市、未親自經營或未經原民會核准而變更營業項目或轉讓者，本會得不予補助。\n（3）\n小小叮嚀:\n1.申請本項補貼，須為貸款3年內之貸款。\n2.第2階段申請為每年9月1日至10月31日止，受理窗口為本市各區公所或本會。\n※ 聯絡電話:1999（外縣市02-27208889）分機2011\n單位：經濟建設組\n聯絡人:陳小姐","u":"臺北市政府原住民族事務委員會","h":4179,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A99E4DA1753C635E","d":"2021-11-03","sid":"A99E4DA1"},{"q":"原住民學生生活津貼要如何申請？有家庭收入之限制嗎？","a":"補助對象：設籍臺北市連續滿四個月以上，就讀國內公私立高中(職)以上學校之學生，其家庭收入按全年家人口平均分配，每人每月未超過本府公告之本市最近一年度最低生活費標準二倍之金額（未領有其他政府機關公營事業單位之生活津貼補助者）。補助金額：公私立高中(職)每名新台幣3,500元；公私立大專院校每名新台幣7,000元。申請時間：每年3月31日及9月30日前，向戶籍所在之區公所原住民服務員申請。\n※ 聯絡電話:1999（外縣市02-27208889）轉8339 林小姐","u":"臺北市政府原住民族事務委員會","h":4115,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D023FB4AF2100A7A","d":"2025-09-03","sid":"D023FB4A"},{"q":"如何洽詢原住民求職相關服務?","a":"一、本市就業服務處暨所屬各就業服務站可受理求職登記，各就業服務站地址如下：\n（一）艋舺就業服務站，地址：萬華區艋舺大道101號3樓，近捷運龍山寺站2號出口。\n（二）北投就業服務站，地址：北投區新市街30號5樓/北投區行政中心。\n（三）內湖就業服務站，地址：內湖區民權東路6段99號7樓/內湖區行政中心。\n（四）信義就業服務站，地址：臺北市信義區福德街86號8樓。\n（五）景美就業服務站，地址：文山區羅斯福路6段393號2樓，近景美捷運站1號出口。\n（六）南港東明青銀就業服務站，地址：南港區南港路2段60巷19號1樓及2樓，近捷運南港站1A號出口。\n求職相關最新資訊可逕至本市就服處網站查詢（網址：https://eso.gov.taipei/）或洽本市就業服務處（電話：02-23085231）。\n二、為配合「臺北市促進原住民就業自治條例」修法，本府各機關陸續將有職缺需進用原住民族人，本市族人若具有就（轉）業服務需求，歡迎可主動聯繫本會派駐本市各區公所原住民服務員，提供個人完整相關資訊，或填寫求職登記表並以電子郵件寄送，俾利本會後續進行就業媒合。如有任何就業問題亦可電洽本會承辦董先生，聯絡電話02-27208889/1999轉2012。\n各區公所聯繫方式如下：\n（一）士林區：02-2882-6200 分機6015， 施小姐，電子郵件： wd8295@gov.taipei 。\n（二）中山區：02-2503-1369 分機502，成小姐，電子郵件： 8a-wendy920515@gov.taipei 。\n（三）大安區：02-2351-1711 分機8215，溫小姐，電子郵件： 8a-sadomi@gov.taipei 。\n（四）松山區：02-8787-8787 分機828，宋高小姐，電子郵件：8a-makah@gov.taipei。\n（五）大同區：02-2597-5323 分機615，王小姐，電子郵件：8a-shiu7530@gov.taipei。\n（六）內湖區：02-2792-5828 分機268，呂小姐，電子郵件：8a-jung@gov.taipei。\n（七）南港區：02-27","u":"臺北市政府原住民族事務委員會","h":3984,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=383A47676B05D3E5","d":"2018-03-23","sid":"383A4767"},{"q":"要如何申請原住民法人機構或團體證明書？","a":"1.申請要件： (1)負責人是原住民身分。 (合作社負責人可例外) (2)原住民股東、社員、會員人數達80%以上。 2.應檢附證件： (1) 申請書(蓋大、小章)。 (2)公司登記證或成立登記證或立案證書。 (3)公司變更登記表。 (4)會員名冊、社員名冊、理監事、董監事名冊。 備註：本證明書自發證日起6個月內有效。 ※ 聯絡電話:1999（外縣市02-27208889）分機2013 單位：經濟建設組 聯絡人:林小姐","u":"臺北市政府原住民族事務委員會","h":3973,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C167837F037F4654","d":"2021-11-03","sid":"C167837F"},{"q":"要如何前往凱達格蘭文化館？","a":"凱達格蘭文化館地址為台北市北投區中山路3-1號，要前往凱達格蘭文化館交通方式：\n（一）公車：\n1.搭乘216、216(區間)、218、218(區間)、266於「新北投站」下車，往中山路步行約5分鐘即可到達。\n2.搭乘小22至「北投公園站」，往中山路步行約5分鐘即可到達。\n（二）捷運：搭乘捷運淡水線至「新北投站」，步行約5分鐘即可到達。\n※小小叮嚀: 新北投地區擁有豐富之觀光旅遊景點，欲前往者可多利用大眾運輸工具，可降低尋找停車位之困擾，亦可享有多元充實之知性之旅。\n聯絡電話：(02)2898-6500館務人員","u":"臺北市政府原住民族事務委員會","h":3840,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=ECA53DB4FE5B0E67","d":"2018-03-23","sid":"ECA53DB4"},{"q":"要如何申請本會職業訓練生活津貼差額補助？","a":"1.申請要件：\n(1)設籍本市滿四個月之原住民。\n(2)符合「就業促進津貼實施辦法」第十八條所定得發給職業訓練生活津貼者。\n(3)同年度內以補助一次為限。\n2.應檢附證件：\n(1)申請人存摺影本。\n(2)承訓單位課程表(須經承訓機構核章)。\n(3)經承訓機構核章之結業證書、合格結業相關證明或出席紀錄。\n(4)符合「就業促進津貼實施辦法」第二條所定之特定對象之申請人文件：\na.經中央勞動主管機關核准之申領職業訓練生活津貼補助函影本(請承訓機構協助提供)。\nb.受訓學員訓練生活津貼補助費印領清冊影本(請承訓機構協助提供)。\n3.補助標準：\n經審核符合補助資格者，按勞動部公告之基本工資百分之四十之金額發給補助，最高補助金額以新臺幣三萬元為限。\n4.作業程序：\n(1)申請人於職業訓練結訓之日起二個月內，備妥應檢附之文件，並透過「臺北市政府市民服務大平臺」向本會提出申請補助款，逾期不予受理。\n(2)經本會審核符合者，核撥補助款匯入申請人帳戶。\n(3)受訓期間未符合設籍本市滿四個月者，不予補助。\n(4)中途退訓者及受訓期間遷出本市者，自退訓及遷出之當月起，不予補助。\n※小小叮嚀:\n申請本項補助，須符合「就業促進津貼施行辦法」並已申領勞動部核定之職業訓練生活津貼(基本薪資60%)，方得向本會申請職業訓練生活津貼差額補助。\n聯絡電話：1999(外縣市請撥02-27208889)轉2013\n單位：經濟建設組\n聯絡人：朱小姐","u":"臺北市政府原住民族事務委員會","h":3708,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B70A99F89454061","d":"2021-11-03","sid":"0B70A99F"},{"q":"如何洽詢原住民求才相關服務?","a":"一、本市就業服務處暨所屬各就業服務站可受理求才登記，並不定期辦理徵才活動，各就業服務站地址如下：\n（一）艋舺就業服務站，地址：萬華區艋舺大道101號3樓，近捷運龍山寺站2號出口。\n（二）北投就業服務站，地址：北投區新市街30號5樓/北投區行政中心。\n（三）內湖就業服務站，地址：內湖區民權東路6段99號7樓/內湖區行政中心。\n（四）信義就業服務站，地址：臺北市信義區福德街86號8樓。\n（五）景美就業服務站，地址：文山區羅斯福路6段393號2樓，近景美捷運站1號出口。\n（六）南港東明青銀就業服務站，地址：南港區南港路2段60巷19號1樓及2樓，近捷運南港站1A號出口。\n求才相關最新資訊可逕至本市就服處網站查詢（網址：https://eso.gov.taipei/）或洽本市就業服務處（電話：02-23085231）。\n二、另可洽詢原住民族委員會基北宜區就業服務團隊，專線電話：0800-066995。","u":"臺北市政府原住民族事務委員會","h":3615,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=074BDC83D99C4F3B","d":"2018-03-23","sid":"074BDC83"},{"q":"凱達格蘭文化館開館時間為何？","a":"凱達格蘭文化館開館時間為週二至週日 09:00 - 17:00，週一及國定假日休館。\n※ 小小叮嚀：如不確定是否開館，可先電洽(02)2898-6500館務人員或1999（外縣市02-27208889）轉2080田先生洽詢。","u":"臺北市政府原住民族事務委員會","h":3593,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BDA0D9B7E31F65A4","d":"2018-03-23","sid":"BDA0D9B7"},{"q":"北原會館開館時間為何？","a":"北原會館開館時間：\n星期一至星期五：09:00-21:00。\n星期六、日：09:00-17:00。\n國定假日休館。\n※ 小小叮嚀:如不確定是否開館，可先電洽02-27828740 詢問館務人員。\n※ 會內聯絡電話02-27206001分機18或1999（外縣市02-27208889）轉2072 高小姐","u":"臺北市政府原住民族事務委員會","h":3469,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=456DF3C0B4BD703B","d":"2018-03-23","sid":"456DF3C0"},{"q":"設籍臺北市，因故未實際居住臺北市，可以申請原住民兒童托育補助?","a":"小小叮嚀:臺北市政府原民會將針對該申請案件不定期實地訪視實際就托及實際居住情形。\n依據臺北市政府原民會「臺北市原住民托育暨協力照顧補助」規定「1.申請要件（2）兒童及父母一方 (或監護人)必須設籍並實際居住本市。」，若查出未實際居住之事實，已請領該補助款者辦理追繳，尚未請領者一律駁回。\n聯絡電話:1999(外縣市請撥02-27206001)轉2019\n單位:社會福利組\n聯絡人:王小姐","u":"臺北市政府原住民族事務委員會","h":3305,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CDA23C8E31CA0B2F","d":"2021-11-09","sid":"CDA23C8E"},{"q":"設籍臺北市之原住民學生，就讀外縣市國中以上的學校，可以申請原住民學生交通補助費嗎？","a":"補助對象：設籍並實際居住本市，且就讀國中以上至大專院校之原住民在學學生，且未領有其他政府機關之相同補助者，其中所稱大專院校，係指就讀臺灣地區經教育部承認之二專、五專、二技、四技或大學之法定修業年限以內之學生（含夜間部）。不包含碩士班、博士班、空中大學（專科）、推廣部、進修補習學校、遠距教學、學分班及在職進修班學生。\n補助金額：就讀國中者，每人每學期補助新台幣500元；就讀本市高中、職以上者，每人每學期補助新臺幣1,000元；就讀外縣市高中職以上者，每人每學期補助新臺幣1,500元。\n申請時間：每年4月15日及10月15日前。\n申請窗口：就讀本市公私立高中職以下者向就讀學校申請，就讀公私立大專校院者或外縣市高中職者，則向戶籍所在區公所原住民服務員申請。\n注意事項：具有低收入戶身分之原住民學生，請逕向臺北市政府社會局辦理申請。\n※ 聯絡電話:1999（外縣市02-27208889）轉8339 汪小姐","u":"臺北市政府原住民族事務委員會","h":3042,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=35F98F0CC4211482","d":"2018-03-23","sid":"35F98F0C"},{"q":"要如何申請職業訓練學費及材料費補助？","a":"一、申請資格：\n（一）開課前已設籍本市滿四個月且非有正式學籍在學學生之原住民，高中職或大專學校應屆畢業學生除外。\n（二）參加下列任一機構舉辦之職業訓練或技術訓練相關課程或就業考試補習課程。但不包括各公私立大學開設之學分班課程：\n1.各級公私立學校、社區大學或推廣教育部。\n2.合法立案之民間訓練機構或補習教育機構。\n3.依章程得辦理職業訓練或技術教學之合法立案人民團體。\n二、應檢附文件\n（一）須載明政府機關核准立案字號及印花稅之繳費收據或統一發票。\n（二）經承訓機構核章之課程表、結業證書、合格結業相關證明，或出席紀錄，另函授或線上點名系統者，需自製出席紀錄。\n（三）金融機構存摺封面影本。\n三、申請方式：\n申請人於職業訓練結訓之日起二個月內，備妥應檢附之文件，並透過「臺北市政府市民服務大平臺」( https://service.gov.taipei/Department/BEAA )向本會提出申請補助款，逾期不予受理。\n四、注意事項：\n（一）本計畫所需經費，由本會年度預算支應。年度預算額度用罄時，本會將公告當年度停止受理補貼之申請。\n（二）經審核，申請人於受訓期間皆須設籍本市，未設籍本市（或遷出本市），不予補助。\n（三）本會得不定期向承訓單位查核申請者受訓情形及相關資料，如有不實情事者，本會得撤銷或廢止原核准之補助處分，並將追繳補助款。\n※ 聯絡電話:1999（外縣市02-27208889）分機2013\n單位：經濟建設組\n聯絡人:胡先生","u":"臺北市政府原住民族事務委員會","h":2996,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=90D3200CA3C457EA","d":"2021-11-03","sid":"90D3200C"},{"q":"請問我想上部落大學的族語課程(語言巢)，要去哪裡上課？條件及年齡？時間及地點？","a":"一、招生對象：不限身分、性別、年齡，歡迎對族語有興趣的在學學生及社會人士報名課程。\n二、本市原住民族部落大學「族語課程」（語言巢）目前有39班28位族語講師，分佈在各行政區。可密切關注本市部大網站公告的學期行事曆，並於上班時間來電報名。詳細課程內容及時間如下：部落大學（網址： https://www.tbc.cip.gov.tw/taipei/home ）。 亦可上本會「臺北市母語巢」網站（網址： https://taipei.pqwasan.org.tw/ ），了解更多本市族語學習資源及課程師資。\n三、您可以就想學的族語別及目前所住區域就近上課（目前多數課程採遠距教學進行），或選擇您喜歡的族語老師。課程時間大多在星期五、六、日，原則上依老師授課時段而排定（視授課老師而調整，如戶外教學、參與校內外族語比賽），歡迎來電部落大學02-2651-6365詢問，或親洽本會（臺北市信義區市府路1號西區5樓）\n教育文化組-劉先生\n電話：02-2720-6001分機28或1999轉分機2081\nE-mail： 8a-maitjar@gov.taipei","u":"臺北市政府原住民族事務委員會","h":2870,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1315FE817AD2E19A","d":"2023-10-19","sid":"1315FE81"},{"q":"經濟弱勢原住民家庭，若有購置房屋的需求，須具備什麼條件?","a":"申請經濟弱勢原住民家庭建購住宅補助應注意事項如下：\n一、 申請人資格：\n(1)年滿十八歲，具有行為能力之原住民。\n(2)設籍本市並實際居住四個月以上者。\n(3)申請人必項是房屋所有權人或具由原住民身分之配偶申請。\n二、申請人條件：\n(1)建購住宅未逾二年，且不曾接受政府其他住宅補助者。但輔助購屋貸款不在此限。\n(2)本人、配偶、申請人及其配偶同戶籍內之直系親屬、申請人同一戶籍共同生活之二親等旁系血親均無其他自有住宅。惟經查其另有房屋座落紀錄，房屋課稅現值，依持分面積比例計算在新臺幣十萬元以下者或原自用住宅遭火災或天然災害受損而無法居住者或個別持有面積未滿四十平方公尺之共有住宅，得視為無其他自有住宅。\n(3)房屋登記原因應以興建（第一次登記）、買賣（拍賣）取得；其用途登記須住宅、農舍或含「住」字樣，且確實自用居住者。\n(4)家庭總收入按全家人口平均分配，每人每月未超過本市當年度最低生活標準二倍者。\n(5)全家人口未超過一人時，存款本金及有價證券按面額計算之合計金額為新臺幣二百五十萬元以內者，每增加一人，曾增加新臺幣二十五萬元。\n(6)全家人口所有之土地或房屋未逾越合理之居住空間者，且不動產金額合計未超過一千二百三十七萬。\n(7)已獲其他重大災害重(修)建補助者，不得重複申請本要點之補助。\n(8)獲得補助之家庭，二年內不得將該房屋轉賣、讓渡、出租。經查確有前述情事或無居住事實者，應繳還該項補助款。\n(9)全家人口數應在二人以上，使得申請補助。但申請人無配偶或直系血親，且年滿五十歲之獨居個人，不在此限。\n聯絡電話:1999(外縣市02-27208889)轉分機2077\n單位：社會福利組\n聯絡人：嚴小姐","u":"臺北市政府原住民族事務委員會","h":2011,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=65ADBBBA2C4E8F7B","d":"2021-11-09","sid":"65ADBBBA"},{"q":"經濟弱勢原住民家庭，若購置房屋，有什麼補助?補助金額為?","a":"本會申請經濟弱勢原住民家庭建購補助補助金額：新臺幣30萬元整。\n申請方式：向本市12區公所原住民服務臺申請或經由網路台北服務通線上申請。\n檢具文件：\n(1)申請人戶口名簿（需註記原住民身分）。但本府原民會得經由戶政相關系統查詢或已有相關資料足以證明者除外。\n(2)全戶最新各類歸戶清單及全國財產稅總歸戶財產清單。\n(3)建購房屋之建物登記謄本。\n(4)未獲政府其他住宅補助切結書。\n(5)住宅門牌及室內居住照片。\n(6)領據收據及申請人金融機構之活期存款帳戶封面影本。\n(7)申請書。\n聯絡電話:1999(外縣市02-27208889)轉分機2077\n單位：社會福利組\n聯絡人：嚴小姐","u":"臺北市政府原住民族事務委員會","h":1175,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E791D57476A8C4D5","d":"2021-11-09","sid":"E791D574"},{"q":"要如何參加臺北市原住民族合唱團?","a":"一、招生對象：凡國小一年級以上對原住民族傳統曲謠、舞蹈有興趣、熱忱者。(基礎班:國小一年級至國小四年級、合唱班:國小五年級至高中三年級、古韻班:社會人士、長青樂齡)\n二、團訓時間：每週六下午2時至5時(基礎班、合唱班)、每周四下午7點至9時(古韻班)（公演及巡迴演出之集訓，視實際需求調整或增加上課時間）。\n三、團訓地點：北原會館（臺北市南港區向陽路49號－捷運昆陽站4號出口）。\n四、報名方式：填妥報名表以親送、郵寄、傳真等方式逕送本會（臺北市110信義區市府路1號西區5樓，臺北市政府原住民族事務委員會教育文化組張小姐），\n傳真：02-2720-5996\n單位：教育文化組\n聯絡人：張小姐\n聯絡電話：02-27206001 #30或1999(外縣市請撥02-27208889)轉2082","u":"臺北市政府原住民族事務委員會","h":997,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EA6B36841ED4E531","d":"2018-03-23","sid":"EA6B3684"}]},{"org":"主計處","total":27,"items":[{"q":"公務預算和基金預算有何不同？","a":"一、預算法第4條指出：基金係已定用途而已收入或尚未收入之現金或其他財產。基金分為普通基金與特種基金2類。即歲入供一般用途者為普通基金；而歲入供特殊用途者為特種基金。每一個普通基金都有收入及支出，均應編列預算，其按機關別所編的預算稱單位預算。公務預算只是「單位預算」的俗稱，在預算法中並無這個名詞。\n二、另每一個自治團體或為某一特定政事，或為照顧某一特定弱勢族群，或為基於受益者付費、使用者繳費原則，成立專款專用或使用者繳費之特種基金，其收支係編列附屬單位預算。基金預算只是「附屬單位預算」的俗稱，在預算法中並無這個名詞。","u":"臺北市政府主計處","h":19824,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DE4A9A3FD7C4D0AD","d":"2008-09-21","sid":"DE4A9A3F"},{"q":"何謂歲入、歲出？","a":"一、政府各機關一會計年度內為推行各項政務之一切支出計畫，即歲出預算，但不包括債務之償還。\n二、政府一會計年度內為支應上項支出計畫所籌措之收入，即歲入預算，但不包括債務之舉借及以前年度歲計賸餘之移用。","u":"臺北市政府主計處","h":17822,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=295BF0B7A8CB544A","d":"2008-09-12","sid":"295BF0B7"},{"q":"何謂概算、預算案及法定預算？","a":"一、各主管機關依其施政計畫初步估計之收支，稱概算。\n二、預算之未經立法程序者，稱預算案。\n三、預算案經立法程序而公布者，稱法定預算（臺北市議會三讀審議通過，並經市長發布）。","u":"臺北市政府主計處","h":15922,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A8E9E0A592CF078A","d":"2008-09-13","sid":"A8E9E0A5"},{"q":"何謂家庭所得5等分位差距倍數？","a":"家庭所得5等分位差距倍數係將全市家庭依每戶所得收入由小至大排序後，按戶數分為5等分，最高20%家庭所得除以最低20%家庭所得之倍數即為5等分位差距倍數，倍數愈大，表示所得分配愈不平均。","u":"臺北市政府主計處","h":15480,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2D272D3CB487B065","d":"2017-10-06","sid":"2D272D3C"},{"q":"有關特別費支用之最新規定為何？","a":"行政院業於95年12月29日以院授主忠字第0950007913號函訂定各級政府機關特別費之支用規定，包括使用範圍、報支手續及預算執行等，取消半數得以領據列報之規定，上開資料已登載於臺北市政府主計處網站（https://dbas.gov.taipei/）主計法規/法規彙編/主計法令彙編/會計/行政院函頒訂定各級政府機關特別費支用規定，歡迎您上網瀏覽參閱。","u":"臺北市政府主計處","h":15304,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=23D84A32C2E04815","d":"2008-09-18","sid":"23D84A32"},{"q":"何謂物價指數？何以現編物價指數所顯示的物價變動趨勢常與大眾的感受不同？","a":"一、物價指數代表各種商品或勞務之平均價格變動情況，用以衡量整體的消費物價水準。它隱含4種平均的概念，第1種為時間上的平均，意即上旬上漲幅度可能被下旬下跌幅度予以減弱；第2種為項目之間的平均，例如油價的上漲可能為通訊設備（如行動電話）跌價所抵消；第3種為通路之間的平均，諸如食用油因超市特價促銷之下跌幅度，可能為其他查價商家結束優惠活動而原價供應之上漲幅度予以綜合掉；第4種為權數的平均，亦即縱使水果(權數2.17％)與房租(權數25.68％)單項指數漲幅相同，但因所占指數權數不同，影響總指數上漲的幅度卻不盡相同；最後，經上開多重平均計算後，總指數的變動經常不如個別商品價格變動之敏感，而導致民眾親身感受略有差距。\n二、另外，一般大眾對於商品價格偏高與通貨膨脹觀念常有混淆，將高價位誤認為物價高漲。事實上，通貨膨脹係經濟學名詞，並無法定衡量指標，通常係指一般物價水準在某一時期內，連續性地以相當幅度上漲，因此常用消費者物價指數年增率來衡量，故其與絕對價格水準的高低無關，例如日本以物價昂貴聞名，卻也是物價平穩的國家。\n三、一般社會大眾常將生活成本與生活費用混淆；生活成本在經濟學定義係指一般消費者在兩個不同時期，為了維持相同滿足水準之支出變動，而生活費用之變化則包含消費數量、品質及價格的變動，即使物價不變，生活費用仍會因生活水準提升及所得增加而提高，是屬於消費支出的變動，與物價指數純粹觀察價格變動的觀念不盡相同，例如以往購買映像管電視，現在改買液晶電視；以前在國內從事休閒活動，現在轉往國外旅遊，消費內涵不同，支出雖增加，惟不能據此視為價格上漲。","u":"臺北市政府主計處","h":12512,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2E39BCCF4FCA0C1F","d":"2017-10-04","sid":"2E39BCCF"},{"q":"目前臺北市是否有辦理「人力資源調查」？其調查期間、對象及目的為何？如何取得調查結果？","a":"一、「人力資源調查」係由行政院主計總處統籌規劃設計，再委由各市縣政府辦理各該轄區之訪查作業，為按月辦理之調查。\n二、資料調查期間為該月含15日當天之一個星期（星期日至星期六），即資料標準週，訪查期間為標準週次日起6~10日內，以普通住戶與共同事業戶，戶內年滿15歲自由從事經濟活動之中華民國國籍民間人口為對象，但不包括武裝勞動力及監管人口。\n三、該調查係我國之指定統計調查，旨在按月蒐集全國家戶內15歲以上人口之就業、失業及非勞動力（如高齡、求學、料理家務等）狀況，以掌握全國及各市縣人力供應變動情形，並作為政府規劃人力政策之參考，調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。\n四、調查方式採面訪、電話訪問及網路填報等多元管道。\n五、該調查結果請逕至行政院主計總處網站（http://www.dgbas.gov.tw/）「政府統計」項下之「主計總處統計專區」項下之「其他專案調查」項下之「人力運用調查」項下之「統計分析」查詢。","u":"臺北市政府主計處","h":11691,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AAC067A1FEF5F10C","d":"2017-10-01","sid":"AAC067A1"},{"q":"近年臺北市總預算歲入、歲出執行情形及臺北市總預算附屬單位預算執行情形如何？","a":"民國99年度至114年度臺北市總決算、民國99年度至114年度臺北市總決算附屬單位決算及綜計表、97年度至115年度臺北市總預算暨附屬單位預算執行情形，登載於臺北市政府主計處網站(https://dbas.gov.taipei/)業務項目之「會計決算/總決算」、「會計決算/附屬單位決算」及「會計決算/預算執行」項下，歡迎上網查詢及下載。","u":"臺北市政府主計處","h":11678,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C657CDFBAE71E207","d":"2017-10-07","sid":"C657CDFB"},{"q":"何謂總決算？","a":"總決算係總預算執行結果之終結報告，臺北市政府主計處依會計法、決算法及總決算編製要點等規定，就各單位決算及市庫年度出納終結報告，加具總說明，彙編成臺北市總決算。","u":"臺北市政府主計處","h":11456,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9F7907F0C925DF6C","d":"2008-09-22","sid":"9F7907F0"},{"q":"何謂附屬單位預算？ 何謂附屬單位預算及綜計表？","a":"一、政府的預算，除了一般常見的單位預算外，還有一部分是屬於事業、作業或其他歲入供特殊用途之特種基金預算，而且它是以歲入、歲出之一部分編入總預算者，這種預算稱之為附屬單位預算，依它的性質又可以分為營業部分及非營業部分。\n二、另附屬單位預算及綜計表則係由臺北市政府各附屬單位預算彙計而成。","u":"臺北市政府主計處","h":10741,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5AF1242DCADC0982","d":"2008-09-19","sid":"5AF1242D"},{"q":"預算案如未於法定期限內（會計年度開始1個月前）完成審議，預算如何執行？","a":"依地方制度法第40條、預算法第96條準用第54條及臺北市地方總預算案未能依限完成之執行補充規定，總預算案之審議，如不能於法定期限內完成時，各機關預算（含公務預算及基金預算）之執行，依下列規定為之：\n（一）收入部分暫依上年度標準及實際發生數，覈實收入。\n（二）支出部分：\n1.新興資本支出及新增計畫，須俟本年度預算完成審議程序後始得動支。但依預算法第八十八條規定辦理或經民意機關同意者，不在此限。\n2.前目以外計畫得依已獲授權之原訂計畫或上年度執行數，覈實動支。\n（三）履行其他法定義務收支。\n（四）因應前三款收支調度需要之債務舉借，覈實辦理。","u":"臺北市政府主計處","h":10421,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B76CCF368FFDE462","d":"2008-09-16","sid":"B76CCF36"},{"q":"何謂追加預算？","a":"各機關於執行法定預算時，發現與實際需要有所出入，而非辦理經費流用及動支預備金所能容納時，得由臺北市政府提出追加預算。依照預算法第96條準用第79條規定，有下列情事之一時，臺北市政府得提出追加預算：\n（一）依法律增加業務或事業致增加經費時。\n（二）依法律增設新機關時。\n（三）所辦事業因重大事故經費超過法定預算時。\n（四）依有關法律應補列追加預算者。","u":"臺北市政府主計處","h":10247,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D22C62B49F5E767E","d":"2008-09-14","sid":"D22C62B4"},{"q":"目前臺北市編有哪些物價指數？如何取得指數資料？","a":"臺北市現編物價指數計有消費者物價指數和營造工程物價指數2種。上述資料處除可電洽1999臺北市民當家熱線（外縣市02-27208889）轉2054~2056、7633、7647~7656查詢外，亦可至臺北市政府主計處網站(https://dbas.gov.taipei/)「業務項目」項下「統計」之「物價統計」區查閱，另可至「統計資料庫查詢系統」之「物價統計資料庫」查閱。","u":"臺北市政府主計處","h":9766,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA60B437B691AC08","d":"2017-10-02","sid":"AA60B437"},{"q":"如何取得臺北市人口數等各項統計資料？","a":"有關臺北市人口數或其他各項統計資料，除可電洽1999臺北市民當家熱線（外縣市02-27208889）轉7624~32由專人協助查詢外，亦可至臺北市政府網站「市政資料館」的「統計資料」專區、臺北市政府主計處網站「業務項目」項下「統計」專區查閱各項統計資訊；可點選雙週發布的「市政統計通報」，按月更新且視覺化呈現的「臺北●123」，或點選「臺北市統計資料庫查詢系統」以統計圖表呈現為主，互動方式為輔之多元化查詢功能，便利各界下載或再加值使用所需要的資料。","u":"臺北市政府主計處","h":9504,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=80E10C65255E0877","d":"2008-09-24","sid":"80E10C65"},{"q":"消費者物價指數查價範圍為何？是否包括房地產、工資及股票價格在內？","a":"一、消費者物價指數用以衡量「一般家庭購買消費性商品或服務價格水準之變化」，舉凡食、衣、住、行、育、樂等消費性商品（如手機）與服務（如電話費）均包含在內。\n二、至於房地產、股票、債券（具投資或儲蓄性質）、健保費、所得稅（支出與受無對等報償關係）等，非以消費性為目的商品及服務均不包括在內；另房價雖不列入查價範圍，但住宅用房租及住宅修繕費用等消費性支出，則包括在內。\n三、雖房地產支出不計消費者物價查價範圍，但我國目前除國泰建設、信義房屋等民間房屋仲介業者有編布相關房地產及房價指數外，內政部亦分析大量的全國不動產實價登錄交易資料，按季公布全國及六都住宅價格指數(網址： [連結] )。","u":"臺北市政府主計處","h":9465,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BD0F8DA594572DBF","d":"2017-10-05","sid":"BD0F8DA5"},{"q":"何謂政府預算？","a":"一、政府預算是政府在一定期間內為推行政務、達成施政目標所制定的財務計畫，也就是綜合政府施政計畫的具體數據表現。\n二、政府無論從事建設，或對人民提供服務，均須事先擬訂計畫，並妥善籌措財源，以期順利推展，將國家整體資源作最佳運用。","u":"臺北市政府主計處","h":8445,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B612A93AF03BCF36","d":"2008-09-09","sid":"B612A93A"},{"q":"預算如何執行？","a":"總預算案經臺北市議會審議通過，並經市長發布完成法定預算程序後，由各機關依照法定預算數配合計畫實施時程，妥為分配預算（分配每月的執行金額），依臺北市地方總預算執行自治條例、臺北市各機關單位預算執行要點等規定切實執行，執行過程中，由各機關編製會計報告及財務收支情形詳確記錄，並送審計部臺北市審計處加以審核。","u":"臺北市政府主計處","h":8313,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=487E7791E7950265","d":"2008-09-15","sid":"487E7791"},{"q":"臺北市總決算之編審程序？","a":"一、臺北市政府主計處依行政院主計總處函定總決算作業手冊，並視需要增訂補充書表或增列必要資訊後彙編臺北市總決算編製作業手冊。\n二、審核各機關所送單位決算、各主管機關所送主管決算及各特別預算機關所送特別決算、年度會計報告。\n三、就各單位決算及市庫年度出納終結報告，加具總說明，彙編成臺北市總決算。\n四、另將各附屬單位決算，彙案編成綜計表，加具說明，隨同總決算，提報市政會議通過。\n五、臺北市總決算併附屬單位決算及綜計表函送審計部臺北市審計處審核。\n六、依據審計部臺北市審計處審核完竣後編造之最終審定數額表辦理決算公告。","u":"臺北市政府主計處","h":8088,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6A217A14CE5E36C6","d":"2008-09-23","sid":"6A217A14"},{"q":"何謂總預算？","a":"一個政府每一會計年度，就每一個機關單位預算之歲入與歲出彙總後連同政府債務之舉借與以前年度歲計賸餘之移用及債務之償還全部所編之預算，為總預算（中央、臺北市、新北市、高雄市等均各自為一個總預算）。","u":"臺北市政府主計處","h":7998,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8432840BBAE03D59","d":"2008-09-10","sid":"8432840B"},{"q":"臺北市政府主計處出版那些公務統計刊物？如何取得？","a":"一、出版統計刊物\n臺北市政府主計處對於各機關所報送之統計報表，均加以整理分析，為充實各界決策所需資訊，分別按年編製「臺北市統計年報」、按月編製「臺北市重要統計速報」，以充實決策資訊。\n二、取得管道\n配合政府e化及響應環保，前揭刊物均停印紙本，請逕至臺北市政府主計處網站（https://dbas.gov.taipei/）「業務項目」項下「統計」之「統計刊物」專區查閱、下載。","u":"臺北市政府主計處","h":7783,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8EE0A6CD7369922F","d":"2008-09-25","sid":"8EE0A6CD"},{"q":"臺北市總預算案之籌編程序？","a":"一、訂頒臺北市政府施政綱要及臺北市總預算編製注意事項（會計年度開始9個月前）。\n二、核定各主管機關歲出概算額度（會計年度開始8個月前）。\n三、各主管機關擬編概算（會計年度開始7個月前）。\n四、審查各主管機關概算及核定各主管機關預算額度（會計年度開始6個月前）。\n五、各主管機關在預算額度範圍內編製預算案送臺北市政府主計處彙編臺北市總預算案（會計年度開始5個月前）。\n六、總預算案提報市政會議通過後函送臺北市議會審議（會計年度開始5個月前完成）。","u":"臺北市政府主計處","h":7674,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D92DFE0BEB9B3942","d":"2008-09-11","sid":"D92DFE0B"},{"q":"如何取得臺北市與國內、國際都市比較之統計資料？","a":"臺北市與國內、國際都市比較資料，除可電洽1999臺北市民當家熱線（外縣市02-27208889）轉7624~32由專人協助查詢外，亦可至臺北市政府主計處網站（https://dbas.gov.taipei/）「業務項目」項下「統計」之「統計指標」專區，點選「臺北市與國際都市指標」來了解臺北市國際競爭力或點選「國內都市統計指標」透過行政院主計總處之「國內縣市重要統計指標」查詢臺北市在國內縣市之排名狀況。","u":"臺北市政府主計處","h":7616,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EA8FCC95B22870E5","d":"2008-09-26","sid":"EA8FCC95"},{"q":"如何查詢臺北市總預算附屬單位預算及綜計表之相關資料？","a":"一、可至臺北市政府主計處網站(https://dbas.gov.taipei)首頁/「業務項目」/「預算」項下之/「附屬單位預算」區查閱，網路資料從99年度至目前各該年度皆可查得。\n二、亦可至臺北市政府主計處、臺北市立圖書館或臺北市議會圖書館查閱書面資料（依各該單位保存年限之預算書）。","u":"臺北市政府主計處","h":7567,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=848E4473D8640EE3","d":"2008-09-20","sid":"848E4473"},{"q":"那裡可以取得臺北市總預算之相關資料？","a":"一、可至臺北市政府主計處網站(https://dbas.gov.taipei/)之「業務項目」/「預算」項下之「總預算」區查閱，網路資料從99年度至目前各該年度皆可查得。\n二、亦可至臺北市政府主計處、臺北市立圖書館或臺北市議會圖書館查閱書面資料（依各該單位保存年限之預算書）。","u":"臺北市政府主計處","h":7261,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=99F1E0E54F4C920F","d":"2008-09-17","sid":"99F1E0E5"},{"q":"目前臺北市政府主計處係辦理何種統計調查？其作業規範為何？因擔心個資外洩受訪者可否拒絕調查？如何辨別是真正的訪查員而非詐騙集團盜取個資？","a":"一、臺北市政府主計處所辦理之統計調查均為統計法規範之指定統計調查（係指編製政府重要統計或重大政策所需，經中央主計機關公布之調查），該等調查係由中央機關統籌規劃，再委由各市縣政府辦理各該轄區之調查業務，例如：消費者物價調查、家庭收支訪問調查、人力資源調查、受僱員工薪資調查等。\n二、臺北市政府主計處所執行之各項統計調查工作，均由該處訪查員進行訪查作業：\n１、作業方式：採面訪、留置填表及網路填報等多元管道，惟訪查作業絕不會以簡訊先行通知或尚未送交公函，即透過電話進行訪問調查。\n２、訪查員會事前致函，並配合親訪：按樣本名冊親赴各受訪廠商送交受訪廠商書函，或於家戶面調查前先郵寄致受查者函。\n３、聯絡訊息：前揭公函中，會列示辦公室聯絡電話(臺北市政府總機02-27208889或1999轉2054至2058、7633至7668，以及6線直撥電話，包括02-27203337、02-27203446、02 -27238699、02-27203155、02-27203416及02-27203118，共計47線)。\n４、臺北市政府主計處所執行之各項統計調查之相關訊息均已刊載於主計處網站「業務項目/統計/統計調查/臺北市政府主計處辦理之統計調查」，民眾可上網查詢確認。\n三、受訪者對於政府統計調查之配合義務及辦理統計調查者之保密義務\n１、受訪者之配合義務：依統計法第14、15條規定略以，指定統計調查之進行，任何人不得規避、妨礙或拒絕；統計調查之受查者無論為個人、住戶、事業單位、機關或團體，均應依限據實答復。民眾支持統計調查，政府才能透過正確統計資訊，引導施政方針，提升全民福祉。\n２、辦理統計調查者之保密義務：依據統計法第19條，統計調查取得之個別資料者，應予保密，除供統計目的之用外，不得作為其他用途；政府舉辦統計調查所指派的訪查員，因係代表政府執行公權力，均需受相關法令規範不得洩漏個別資料，恪守民眾提供的調查個別資料絕對保密。截至目前為止，政府各項統計調查從未發生資料外洩情事，敬請安心配合。\n３、拒絕調查之相關裁罰規定：依統計法第14條第3項及第23條規定，辦理基本國勢調查及指定統計調查之人員，","u":"臺北市政府主計處","h":1396,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BA6223811B16AE10","d":"2025-04-17","sid":"BA622381"}]},{"org":"天文科學教育館","total":26,"items":[{"q":"請問天文館有沒有提供學生參加公共服務學習的機會及其相關預約登記及服務時段？","a":"有，本館於星期例假日(含寒、暑假期間及國定假日)提供學生公共服務學習的機會，服務時段分上午4小時(09：00-13：00)、下午4小時(13：00-17：00)及全天8小時(09：00-17：00，中午午休1小時用餐)等3種時段供學生選擇登記，請同學事先線上預約登記，服務當天需攜帶學生證及公共服務卡準時至1樓服務臺報到。（ 報名連結 ）","u":"臺北市立天文科學教育館","h":75744,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=970395F672F4AAD4","d":"2013-05-17","sid":"970395F6"},{"q":"請問天文館有招募志工嗎？該如何應徵？","a":"有的。本館志工依工作性質共分為3個中隊，皆為不定期公開招募，招募前都會發布新聞稿，並於網站上公告，有興趣的民眾可自行上網查詢，亦可向各中隊志工督導留下聯絡方式，本館於志工招募時將主動通知。\n第一中隊督導 02-28314551分機516(主要工作內容：服務臺諮詢業務)\n分機302(主要工作內容：天文觀測支援、研究與圖書業務)\n第二中隊督導 02-28314551分機204(主要工作內容：天文推廣業務)\n第三中隊督導 02-28314551分機716(主要工作內容：展示場服務業務)","u":"臺北市立天文科學教育館","h":68509,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=48D117AD96553159","d":"2013-05-17","sid":"48D117AD"},{"q":"請問參加公共服務的學生服務時要穿制服嗎？","a":"不用穿著制服，但須攜帶學生證及公共服務卡。","u":"臺北市立天文科學教育館","h":40376,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=06DA01F976D61F95","d":"2013-05-17","sid":"06DA01F9"},{"q":"請問天文館有沒有停車場？收費的標準為何？","a":"有的。本館備有地下停車場，收費標準請參閱「來館交通資訊」之「 地下停車場資訊 」。","u":"臺北市立天文科學教育館","h":30413,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C772350A4C4BA561","d":"2013-05-17","sid":"C772350A"},{"q":"天文館開放時間?","a":"本館開放時間：\n1.展示場：9時至17時；週六延長至20時。\n2.宇宙劇場及立體劇場：首場9時，末場16時；週六加開場次至末場19時。\n3.宇宙探險：9時30分至16時。\n4.第二觀測室：10時至12時、14時至16時；週六增開19時至21時。\n(本館每週一休館，如遇國定假日則維持開放）","u":"臺北市立天文科學教育館","h":22417,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6BCE393BE5080BA5","d":"2013-05-17","sid":"6BCE393B"},{"q":"天文館收費標準?","a":"本館收費標準：\n1.展示場：普通票：40元、優待票：20元、臺北市民票：20元。\n2.宇宙劇場：普通票：100元、優待票：50元。\n3.立體劇場：普通票：100元、優待票：50元。\n4.宇宙探險：普通票：70元、 優待票：35元。\n5.團體達30人以上(限購買普通票者)，享有團體票優惠。\n票務預約專線：(02)28314551轉523","u":"臺北市立天文科學教育館","h":18420,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B102900CF2C249C3","d":"2013-08-07","sid":"B102900C"},{"q":"請問天文館內是否有提供用餐休息的場所及販售餐點？","a":"配合2樓休憩區整修封閉施工，施工期間臨時休憩區改至地下1樓，並有提供用餐休息場地及販售餐點。","u":"臺北市立天文科學教育館","h":16759,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D0B8D7D3386237FD","d":"2013-05-17","sid":"D0B8D7D3"},{"q":"請問天文館有沒有置放物品的置物箱或置物櫃？需要收費嗎？","a":"有的。本館於1樓大廳東側設有置物櫃，無需另外收費。","u":"臺北市立天文科學教育館","h":16715,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BD0A18F5C528DB89","d":"2013-05-17","sid":"BD0A18F5"},{"q":"請問參觀望遠鏡觀測室是否需要購票？","a":"本館望遠鏡觀測室為免費參觀，無需購票。\n開放時間:10時至12時、14時至16時(週一休館未開放)；週六增開19時至21時。","u":"臺北市立天文科學教育館","h":16371,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4E26E9B979258028","d":"2013-05-17","sid":"4E26E9B9"},{"q":"請問天文館的位置在那裡？如何去天文館？","a":"本館地址：臺北市士林區基河路363號\n詳細來館交通資訊","u":"臺北市立天文科學教育館","h":15648,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=397018B054108982","d":"2013-05-17","sid":"397018B0"},{"q":"請問天文館有沒有提供參觀學習單或導覽手冊？","a":"有的。本館學習單均放置於網站上，民眾可依需求自行 下載使用 ，參觀現場不提供紙本學習單。","u":"臺北市立天文科學教育館","h":14081,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E5F86E1EAB508E9F","d":"2013-05-17","sid":"E5F86E1E"},{"q":"請問天文館地下停車場有對車輛的高度限制嗎？","a":"有的。本館地下停車場限高2.1公尺。","u":"臺北市立天文科學教育館","h":13624,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=52436A4F0CCD804D","d":"2013-05-17","sid":"52436A4F"},{"q":"請問天文館有無提供嬰兒車或輪椅租借服務？需要收費嗎？","a":"本館備有嬰兒車及輪椅供民眾借用，請借用人持證件至1樓服務臺辦理借用登記，均無需收費。","u":"臺北市立天文科學教育館","h":13026,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E41709FE006B3CC5","d":"2013-05-17","sid":"E41709FE"},{"q":"請問天文館是否設有哺集乳室？","a":"有的，本館於1樓大廳警衛室左側設有哺集乳室。","u":"臺北市立天文科學教育館","h":12468,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8B5F67A4698AA2D7","d":"2014-01-14","sid":"8B5F67A4"},{"q":"請問在天文館購票是否可以使用信用卡或國民旅遊卡？","a":"本館可以使用信用卡，但無法使用國民旅遊卡購票。","u":"臺北市立天文科學教育館","h":12327,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=30DD3161BABEF4E9","d":"2013-05-17","sid":"30DD3161"},{"q":"請問有關於天文方面的問題，可以詢問天文館嗎？","a":"可以。天文專業問題請撥打 02-28314551 轉分機 302 洽詢。","u":"臺北市立天文科學教育館","h":12170,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=380DFC2B288BBAC0","d":"2013-05-17","sid":"380DFC2B"},{"q":"請問在天文館購票是否需自備零錢？","a":"本館自動售票機可收一般流通紙鈔及硬幣，且均有找零功能，所以無需自備零錢。","u":"臺北市立天文科學教育館","h":12154,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B8D1C1DECE956B9F","d":"2013-05-17","sid":"B8D1C1DE"},{"q":"請問在天文館內遺失物品該如何找尋？","a":"本館拾得物品，均統一送交1樓服務臺，請直接至1樓服務臺認領或登記協尋。如已離開館內，可於網站上「 失物招領 」區查詢或請撥打02-28314551轉分機509洽詢。","u":"臺北市立天文科學教育館","h":12117,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FA4561FEC9533E0A","d":"2013-05-17","sid":"FA4561FE"},{"q":"請問在天文館內有提供無線上網的服務嗎？","a":"有的。本館館內有提供Wi-Fi（Taipei Free）免費無線上網，請民眾自備筆記型電腦或其他上網裝置。","u":"臺北市立天文科學教育館","h":12102,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FAA1A74645669CFC","d":"2013-05-17","sid":"FAA1A746"},{"q":"請問天文館接受預約參觀嗎？應如何預約？","a":"若屬30人以上團體，請電洽本館票房進行預約，預約電話02-28314551分機523。","u":"臺北市立天文科學教育館","h":12023,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CB1FF8D604E8EA75","d":"2013-05-17","sid":"CB1FF8D6"},{"q":"請問天文館可以停放大型遊覽車嗎？","a":"可以。本館備有大型車停車場，可提供參觀團體免費停放大型遊覽車。","u":"臺北市立天文科學教育館","h":11669,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2BD6910483CF0DEC","d":"2013-05-17","sid":"2BD69104"},{"q":"請問天文館接受退票、或更換票券、或更換場次嗎？","a":"可以。請於票券尚未使用且未超過入場時間前，直接至本館1樓人工售票窗口辦理。","u":"臺北市立天文科學教育館","h":11152,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7639158B56B7B2C6","d":"2013-05-17","sid":"7639158B"},{"q":"請問天文館是否提供廣播尋人服務？","a":"有的。本館提供廣播尋人服務，如有需要，請向1樓服務台或大廳團體預約報到處洽詢。","u":"臺北市立天文科學教育館","h":9955,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=23A03FAB99FAF180","d":"2013-05-17","sid":"23A03FAB"},{"q":"請問天文館是否提供導覽解說服務？應如何預約？","a":"本館提供導覽解說預約，請參考 展示場導覽解說預約辦法 說明。另有提供平日及假日定時導覽服務，民眾可至展示場服務台現場登記。","u":"臺北市立天文科學教育館","h":3180,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8DAFE2ADB9CB9DC7","d":"2017-07-27","sid":"8DAFE2AD"},{"q":"請問可以攜帶寵物進入天文館嗎？","a":"不可以，入館參觀禁止攜帶寵物。","u":"臺北市立天文科學教育館","h":1410,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=616CAF723979D8A4","d":"2023-10-17","sid":"616CAF72"}]},{"org":"動產質借處","total":26,"items":[{"q":"臺北市動產質借處服務分處在哪裡？","a":"本處目前在臺北市地區設有6個營業分處，網站首頁/機關介紹/聯絡資訊，亦可查詢各分處路線圖及交通資訊。民眾如需服務，可就近逕向下列各營業分處洽辦：","u":"臺北市動產質借處業務組","h":30538,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=265A9557C9E355C1","d":"2020-05-04","sid":"265A9557"},{"q":"有哪些物品不得質借？","a":"下列物品不得質借：\n一、違禁物。\n二、有價證券及各種存款憑證。\n三、機關印信及其他政府機關管理之財物。\n四、軍警制服及其他附屬物品。\n五、政府核發之證照及私人身分證明文件。\n六、其他經政府明令禁止及管制買賣之物品。\n七、易於腐敗、變質、體積過大或其他不適於保存之物品。","u":"臺北市動產質借處業務組","h":26812,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2008B9B85234641C","d":"2018-01-25","sid":"2008B9B8"},{"q":"目前主要受理質借的物品為何？","a":"(一) 黃金：金飾、金幣、黃金條塊等，但成色不足之金牌片（包括刻有神像之金牌片）不予收質。\n(二) 白金：\n(1)白金飾品：具➀全國貴金屬監督委員會聯合標誌➁製造商➂成色等3項印戳，成色達Pt900(含)以上；或具成色印戳，無入石或其他附加物之實心白金飾品， 經淨水秤重法測其比重，計算之成色達Pt900(含)以上。\n(2)其他白金製品：成色達Pt999(含)以上之白金金幣、金條、金塊、金片。\n(三) 鑽石。\n(四) 其他：鑽飾、高級機械手錶、出廠日期四年(含)且行駛里程數二萬公里(含)以內，且無動產擔保設定之輕、重型機車、數位相機、數位攝影機、個人電腦等3C產品。","u":"臺北市動產質借處業務組","h":25736,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88939D8E8E15F8AB","d":"2018-01-25","sid":"88939D8E"},{"q":"質借利息計算方式為何？有無其他費用？如何收取?","a":"(一)計息方式：客戶在一個月內贖回者，無論日數多寡，概以一個月計息；屆滿一個月後之最初五日不計息；超過五日者，以半個月計息；超過十五日者，以一個月計息。前項第五日、第十五日適逢國定假日、例假日或其他休息日時，則順延至次一營業日。\n(二)除依核定之利率計算質借利息外，不收取其他費用。\n(三)質借利息一律於質借客戶申辦還款贖回或繳息展期時收取。\n(四)倘因天然災害等不可抗力因素（例：颱風）公告停止上班時，停班未達一日者，當日仍照常計息；全日停班者，當日不予計息。","u":"臺北市動產質借處業務組","h":24100,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B8BFBFE7F0CADB78","d":"2018-01-25","sid":"B8BFBFE7"},{"q":"臺北市動產質借處質借期限規定為多久？","a":"除了機車及電子類質借物品之質借期限為3個月外，其他物品如黃金、白金、鑽石等為6個月。","u":"臺北市動產質借處業務組","h":23322,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F81D0CF590059D95","d":"2018-01-25","sid":"F81D0CF5"},{"q":"目前黃金1兩質借金額多少錢？","a":"臺北市動產質借處黃金質借標準，以質借當時該處牌告黃金類質借標準為準，自115年4月15日起公告的標準為每臺兩可質借新臺幣93,000元。","u":"臺北市動產質借處業務組","h":22791,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3E286A666971B12E","d":"2018-01-25","sid":"3E286A66"},{"q":"每人的質借額度規定為何？","a":"每單質借金額不得超過新臺幣50萬元（單件除外），每一客戶累計質借總金額不得超過新臺幣300萬元（各營業分處合併累計）。","u":"臺北市動產質借處業務組","h":14056,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D27D0D63F35ADDF4","d":"2018-01-25","sid":"D27D0D63"},{"q":"逾期未贖質借物品之標售對象為何？","a":"凡中華民國國民年滿18歲，具完全行為能力之自然人，或依法設立登記之本國公司、行號、法人，均可參加投標；但本處員工不得參與標購。","u":"臺北市動產質借處業務組","h":13516,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3836E776AB8FE716","d":"2018-01-25","sid":"3836E776"},{"q":"質借期限屆滿時是否一定要贖回？","a":"質借物品於期限屆滿前可辦理展期(繳息換單)，各營業分處櫃臺人員會就質借物品之現行質借標準重新估價，核算應減少或可增加之質借本金並列印利息計算明細表與持單人核對，俟其繳清款項後重新開立質借單(換單)。","u":"臺北市動產質借處業務組","h":12295,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=12DA30BADD4CBEEC","d":"2018-01-25","sid":"12DA30BA"},{"q":"質借單（當票）遺失，應如何處理？","a":"質借單遺失，辦理掛失手續時，請客戶本人攜帶國民身分證或駕駛執照、護照、居留證等擇一證件，並檢附該證件正、反面影本一式乙份，洽原質借單位辦理。（證件正本驗畢交還，影本由本處留存）\n櫃檯人員經核對確認質借客戶身分後，將列印掛失聲明書交由客戶簽章；客戶於繳清本息後得取回原質借物品或可申辦繳息換票。\n但如辦妥掛失手續前，質借物品已被他人冒贖者，本處無法再予受理。\n【臨時掛失】\n1.如申辦掛失時未能提示有效之身分證件，或因故未能親自到處申辦，可先來電話告知辦理「臨時掛失」，經服務人員確認身分後，協助登記完成臨時掛失手續。\n2.「臨時掛失」屬暫時性措施；登記臨時掛失後二週內，客戶本人仍須持有效身分證件，臨櫃辦理掛失還款贖回或繳息展期各項相關手續，方屬有效。","u":"臺北市動產質借處業務組","h":12232,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9BFEA4539ED7A22B","d":"2018-01-25","sid":"9BFEA453"},{"q":"3C電子類產品可否質借？","a":"為求質借物品鑑價具客觀性、公正性，本處所受理之質借物品須能於二手市場普遍流通，且須具備客觀、穩定之二手市場行情。依上開原則，目前所受理大致有黃金、鑽石及高級機械手錶（勞力士錶等）等項目為主，至於3C電子類產品則以筆記型電腦、智慧型手機及數位相機等較為常見。\n3C電子類產品如具備功能完善、外觀品相良好、操作無礙、各項配件齊全，非過於老舊機種，且能正常使用者，本處即據以估價受理質借。惟因電子類產品汰舊換新速度極快，除質借期間為3個月外，若依二手市場行情估價，質借金額與新品價格會有落差。另外，質借物品之實際品相、功能及效用等仍需由本處櫃檯服務人員實地檢視物品狀況而定。","u":"臺北市動產質借處業務組","h":10568,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E023A14442A411FD","d":"2018-01-25","sid":"E023A144"},{"q":"辦理質借時，需備證件為何？質借客戶有無僅限於某些住居地區？","a":"本處辦理質借手續簡便，並未設限民眾之住居地條件，只要親持有效之國民身分證、駕駛執照、護照或居留證等證件，連同質借物品辦理質借放款。","u":"臺北市動產質借處業務組","h":10417,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5A3ABEA201BEE061","d":"2018-01-25","sid":"5A3ABEA2"},{"q":"若以機車辦理質借，其手續為何？","a":"出廠日期四年（含）且行駛里程數二萬公里（含）以內，且無動產擔保設定、禁止異動註記及欠稅紀錄者之輕、重型燃油機車及電動機車（使用Gogoro Network換電系統）。質借時，客戶應分別檢附下列文件：\n(1)燃油機車：領牌登記書、行車執照（須核對姓名及引擎號碼）、鑰匙、車主身分證正本及正反面影本1份。\n(2)電動機車（使用Gogoro Network換電系統）：領牌登記書、行車執照（須核對姓名及引擎號碼）、鑰匙、車主身分證正本及正反面影本1份與同意書（至質借分處填寫）。\n以上文件須連同機車及鑰匙一起留存營業分處。因受限於場所，目前由中山、士林及大同分處共3個分處受理機車質借，惟仍以能牽引至營業分處內為限。建議先以電話洽詢：\n中山分處　　電話：02-25116701\n士林分處　　電話：02-28819746\n大同分處       電話：02-25963402","u":"臺北市動產質借處業務組","h":10404,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DB50832E48CA4370","d":"2020-03-04","sid":"DB50832E"},{"q":"如何申請臺北市動產質借處之祝福金","a":"為鼓勵質借客戶本人及其子女奮發上進、肯定自我，依本處當年度法定預算編列情形發放祝福金，逕向本處各營業分處索取申請表洽辦。","u":"臺北市動產質借處業務組","h":10209,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=380F6CFE621E8920","d":"2020-02-17","sid":"380F6CFE"},{"q":"還款贖回的手續為何？","a":"(一) 在質借期限內者：憑質借單還款繳息取回原質借物品。 (二) 超過質借期限者：質借物品未公告變賣前，請客戶本人攜帶有效國民身分證或駕駛執照親自申請辦理，並在質借單簽名或蓋章後取回，客戶如因故不克前來辦理，得在質借單背面委託書上簽名或蓋章後，委由他人（受託人應攜帶國民身分證）前來代為辦理。","u":"臺北市動產質借處業務組","h":9891,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=521D2775E5F43EED","d":"2018-01-25","sid":"521D2775"},{"q":"房屋及土地可否質借？","a":"房屋及土地在法律上為「不動產」。依當舖業法相關規定，當舖業就持當人提供擔保借款之「動產」，貸與金錢行為，故動產質借處無法受理房屋及土地貸款業務。","u":"臺北市動產質借處業務組","h":9566,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BD657AA9D0162193","d":"2018-01-25","sid":"BD657AA9"},{"q":"可否以汽車質借？","a":"依當舖業法第3條規定略以：「質當：指持當人以動產為擔保，並交付於當舖業，向其借款、支付利息之行為。」故該處於受理民眾質借放款依法需留置質物。因汽車體積龐大，在臺北市尚未覓得大型且具安全性場所存放，故目前尚未開辦此項質物質借。","u":"臺北市動產質借處業務組","h":8894,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1B979B12DD6F826E","d":"2018-01-25","sid":"1B979B12"},{"q":"臺北市動產質借處之質借利率？","a":"自115年4月15日起，各身分別民眾適用之質借月利率如下：","u":"臺北市動產質借處業務組","h":8825,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=60612562FE0E9406","d":"2018-01-25","sid":"60612562"},{"q":"臺北市動產質借處之營業時間？","a":"營業時間為星期一至星期五，上午9:00～下午4:30，中午沒有休息，國定例假日依規定放假。","u":"臺北市動產質借處業務組","h":8718,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D28A826D8E92E7DD","d":"2018-01-25","sid":"D28A826D"},{"q":"受理黃金類質借物品為何？","a":"金飾、金幣、黃金條塊等成色足之金製物品均可收質，但成色不足之金牌片（包括刻有神像之金牌片）不予收質。","u":"臺北市動產質借處業務組","h":8383,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=822A2C232E2C21AD","d":"2018-01-25","sid":"822A2C23"},{"q":"何時辦理逾期未贖回質借物品的公開現場標售？","a":"本處對於逾期未贖回物品之處理，依流當情形不定期在總處辦理現場投標方式公開標售，並採價高者得標方式辦理。因本處流當比率低，流當品少，故須累積至相當數量始辦理現場投標方式標售，如有標售活動，於標售7日前將會在本處網站(http://op.gov.taipei/)登載標售公告；有需要獲悉該項訊息之民眾亦可向本處/總處/業務組承辦人員洽詢登錄行動電話，由本處於標售活動前發送簡訊通知。\n除透過公開現場標售方式，部分流當品並有利用本府「臺北惜物網」網站平台，不定期上架提供民眾競標。","u":"臺北市動產質借處業務組","h":7845,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=18DC01FECCCBDF38","d":"2018-01-25","sid":"18DC01FE"},{"q":"可否請親友代為繳納臺北市動產質借處的利息？","a":"質借單若未遺失可委託他人辦理，如已遺失則須質借人本人持身分證件正本及影本至原質借分處辦理掛失換票。\n若質借單之屆滿日期未逾期者，質借人可逕將質借單交給受託人至原質借分處申辦繳息換票。\n若質借單之屆滿日期已逾期者，質借人應先填妥質借單背面之委託書，委由受託人持質借單及受託人身分證件正本及影本，至原質借分處繳納利息申辦買回換票。","u":"臺北市動產質借處業務組","h":6822,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FCB5E5E3B98B0A7E","d":"2018-01-25","sid":"FCB5E5E3"},{"q":"年齡未滿18歲，可否辦理質借？","a":"依當舖業法第17條規定，當舖業不得收當無行為能力人及限制行為能力人之質當物。所以對酒醉、神態失常、無行為能力者或限制行為能力人，本處無法受理質借，但限制行為能力人倘經法定代理人同意者，不在此限。\n至法定代理人同意方式，需由持當人之法定代理人（父母雙方）攜帶身分證件陪同到場辦理質借。倘法定代理人無法同時到場，則一方到場，另一方須填寫授權書後，連同證件交由持當人辦理。","u":"臺北市動產質借處業務組","h":6606,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=192F2F44CC37B704","d":"2018-01-25","sid":"192F2F44"},{"q":"什麼是轉帳繳息？如何申請？如何繳款？","a":"轉帳繳息服務係提供質借客戶於質借單屆期(含逾期)時(電動機車除外)，得利用網路或實體ATM轉帳方式免臨櫃繳付利息或償還部份本金之便民措施。 質借客戶如欲申請轉帳繳息，為確保質物安全，所持質借單須事先臨櫃辦理「限本人親自取贖」，於詳閱並充分瞭解相關申辦流程之約定條款後，簽署並提交「約定申請書」辦理約定。「約定申請書」提交方式可採臨櫃、傳真、電子郵件或紙本郵寄回傳原質借分處。約定條款及約定申請書請向原質借分處索取或於本網站「線上服務-轉帳繳息申請」頁面下載。 質借單屆期(含逾期)時，繳息當日(15:30前)以電話通知原質借分處啟動轉帳繳息，本處會以簡訊及電子郵件通知繳款資訊，當日(23:59前)利用網路或實體ATM轉帳繳付本息(逾期無法繳付)，原質借分處於次一營業日確認款項入帳後，以簡訊及電子郵件發送新開立質借單相關資訊予客戶即完成。 於新開立之質借單屆期(含逾期)時，免再重新約定即可續採轉帳繳息服務。","u":"臺北市動產質借處業務組","h":2675,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9A84EF234584F3F2","d":"2021-11-10","sid":"9A84EF23"},{"q":"為何質借客戶（持當人）洽辦質借一定要按捺指紋？","a":"本處為臺北市立公營當鋪，並依當舖業法規定經營質借，依該法第15條明訂質借客戶（持當人）應按捺左手大拇指之三面清晰指紋後，本處始可收當。\n當舖業法　第15條 當舖業收當物品時，應查驗持當人之身分證件，並由持當人於當票副聯內捺指紋，始可收當。 前項所捺指紋，應為左手大拇指之三面清晰指紋，如殘缺左手大拇指時，應捺印左手或右手其他手指指紋，並註明所捺之手指指名。但無手指者，不在此限。","u":"臺北市動產質借處業務組","h":2549,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=337D8A76E1770EFD","d":"2018-10-26","sid":"337D8A76"}]},{"org":"藝文推廣處","total":24,"items":[{"q":"藝文推廣處親子劇場租金及座位數","a":"親子劇場座位共903席。\n查詢親子劇場租借費用:\n請參考「書表下載」>「臺北市藝文推廣處各場地使用收費基準」與「臺北市藝文推廣處各場地使用收費基準表」。\n任何關於親子劇場場地租金之疑問，歡迎電洽1999(外縣市請撥02-2720-8889)轉3350親子劇場。","u":"臺北市藝文推廣處","h":8645,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2C9BCF7A4A3212F4","d":"2020-05-27","sid":"2C9BCF7A"},{"q":"如何至藝文推廣處大稻埕戲苑？","a":"◎大稻埕戲苑地址：103012臺北市大同區迪化街一段21號8樓、9樓\n◎聯絡電話：(02)2556-9101\n建議您可搭乘: ◎捷運轉乘公車: 1.捷運北門站：3號出口，沿塔城街步行約10分鐘。 2.捷運西門站：轉乘9到「南京西路口」、206至「南京西路口(鈕扣街)」；或搭304重慶線、660到「延平一站(南京)」、12至「聯合醫院中興院區」(塔城街上)；或乘重慶幹線至「延平長安路口」(延平北路上)，步行約5分鐘可達。 3.捷運中山站:轉乘52、12、紅25至「聯合醫院中興院區(塔城)」，步行5分鐘可達。 4.捷運雙連站:轉乘民生幹線至「南京西路口(鈕釦街)」，步行5分鐘可達；亦可轉乘811至「朝陽公園(鈕扣街)」，步行約10分鐘。 5.捷運大橋頭站:轉乘9、274至「南京西路口」，或乘302至「聯合醫院中興院區」(塔城街上)，步行約5分鐘可達；或轉乘2、215、223、288、300、757、重慶幹線至「朝陽公園(鈕釦街)」，步行10分鐘。 ◎公車:搭乘46、282、288、306、622等車至「圓環」步行10-15分鐘；搭乘206、民生幹線等車至「南京西路口」，步行5-10分鐘。\n◎若您有停車需求，大稻埕戲苑附近停車場資訊如下： 1.永昌街側（靠近城隍廟）進入永樂市場停車場(迪化街一段21號B1，60元/時，全程以半小時計；限高2公尺；大型貨車建議停至附近大稻埕碼頭3號或5號水門堤外停車場。) 2.大稻埕公園地下停車場(歸綏街243號地下，198個車位）。 3.塔城公園地下停車場(塔城街11號地下，155個車位）。 4.市民大道(塔城段)停車場（西寧北路-塔城街，252個車位）。 5.朝陽公園地下停車場（重慶北路2段68號地下，244個車位）。","u":"臺北市藝文推廣處","h":6699,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E65ECC8B5594F959","d":"2020-06-12","sid":"E65ECC8B"},{"q":"如何至藝文推廣處親子劇場？","a":"地址：110204臺北市信義區市府路1號2樓 市府大樓中央區(例假日請由市府西大門進出)\n電話：(02)2720-8889\n傳真：(02)2345-6310\n捷運：板南線「捷運市政府站」2號出口接市府連通道。\n公車：270、270(區間)、28、281、311、612、647、651、678、 912、915、935、939、950、棕6、棕7、棕18、綠1、仁愛幹線、承德幹線。◎停車場資訊：\n1.府前廣場地下停車場(臺北市信義區松壽路1號地下室)\n費率：小型車計時30元(9-18)，夜間計時10元(18-9);機車計時10元(當日當次上限20元)。\n2.臺北101大樓停車場(市府路45號)\n費率:  小型車平日70元/時，假日100元/時，機車20元/時，停車未滿1小時以1小時計，逾1小時以上者，未滿半了時以半小時計費。\n3.松壽廣場地下停車場（松智路75號市府後門正對面）\n費率：計時：週一至週五(09:00-22:00)30元/時，(22:00-翌日09:00)10元/時，假日(09:00-22:00)40元/時，(22:00-翌日09:00)10元，全程半小時計費。\n4.新光三越信義新天地地下停車場：\n費率：小型車100元/時，機車20元/時，停車時數逾1小時以上，其超過之不滿1小時部分，不逾30分鐘，以半小時計算。\n5.市府轉運站停車場(台北市忠孝東路五段6號)\n費率：小型車平日50元/時、假日80元/時；機車10元/時，當日最高30元(隔日另計);全程以半小時計費。\n6.台灣聯通誠品信義停車場(地址：台北市信義區松高路11號)\n費率:  汽車100元/時，機車20元/時，停車逾1小時以上者，未滿半小時以半小時計費。","u":"臺北市藝文推廣處","h":6360,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5D4523320FA77A81","d":"2020-09-08","sid":"5D452332"},{"q":"請問藝文推廣處城市舞台租借費用?有多少座位？","a":"◎查詢城市舞台租借費用: 請逕上本處首頁「書表下載」區或「市民服務大平臺 」網站下載「臺北市藝文推廣處場地收費基準表」查閱收費標準。 ◎任何關於城市舞台場地租借費用之疑問，歡迎電洽02-2577-5931分機326展演活動課。\n◎城市舞台總座位數為1004席：一樓座位數568席；二樓座位數227席；三樓座位數209席。","u":"臺北市藝文推廣處","h":5490,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DDE8BFF53B4467F2","d":"2020-05-27","sid":"DDE8BFF5"},{"q":"如何至藝文推廣處文山劇場？","a":"◎文山劇場地址：116052臺北市文山區景文街32號\n◎聯絡電話：(02)2933-2199\n建議您可搭乘: ◎捷運：松山新店線「景美捷運站」一號出口左轉。 ◎公車：公車可搭乘至站名--文山二分局/景美捷運站/景美國中站者: 1.文山二分局--棕2、棕6、棕12、棕22、251、505、660、666、671、673、915、市民小5。 2.捷運景美--綠13、252、278、290、643、644、648、849、1551、1612、1728、9009、9012、松江新生幹線、基隆路幹線。 3.景美國中--棕2、棕12、284、251、253、660、666、673、915、復興幹線。","u":"臺北市藝文推廣處","h":4604,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C79CD31A78761103","d":"2020-09-08","sid":"C79CD31A"},{"q":"如何洽詢藝文推廣處親子劇場檔期?","a":"◎查詢檔期: 請來電1999(外縣市請撥02-2720-8889)轉3350親子劇場詢問。","u":"臺北市藝文推廣處","h":4445,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F60B6599707AB8AD","d":"2020-10-07","sid":"F60B6599"},{"q":"藝文推廣處城市舞台演出活動若為贈票，要至何處索票？","a":"每檔節目索票時間及資訊請詳本處每月出版之「藝文快訊」刊物。\n索票地點:本處城市舞台服務台。\n因票券有限，贈完為止，建議先電洽城市舞台服務台(02-2577-5931分機2101)詢問是否尚有票券(請於14:00後電洽)，以免耽誤您寶貴的時間。","u":"臺北市藝文推廣處","h":4175,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9486ACA74C5F70A6","d":"2020-10-07","sid":"9486ACA7"},{"q":"如何查詢藝文推廣處城市舞台當日演出節目內容及相關票務資訊？","a":"◎請參閱本處每月出版之「藝文快訊」刊物，或逕上本處網站「城市舞台合辦節目」專區查詢。","u":"臺北市藝文推廣處","h":4170,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=62A60C2006571A07","d":"2020-10-07","sid":"62A60C20"},{"q":"如何租用藝文推廣處藝文大樓展覽室？","a":"◎申請期間:每年1月及7月受理次年度展覽室使用申請。\n◎查詢檔期: 請逕上臺北市藝文推廣處網站「場地租用」>「總處藝文大樓(城市舞台) 」>「A、B、C展覽室」，或逕上「市民服務大平臺 」網站查詢。\n◎有關本處藝文大樓展覽場地之疑問，歡迎電洽02-2577-5931分機343藝文推廣課。","u":"臺北市藝文推廣處","h":3682,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8050B110CB72C680","d":"2020-10-07","sid":"8050B110"},{"q":"如何查詢藝文推廣處親子劇場演出節目名稱及相關票務資訊？","a":"◎可參閱本處每月出版之「藝文快訊」刊物或於本網站「藝文訊息」專區下載數位刊物查詢。","u":"臺北市藝文推廣處","h":3255,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C6075AA6AF9714D6","d":"2020-10-07","sid":"C6075AA6"},{"q":"如何查詢藝文推廣處藝文大樓展覽活動？","a":"◎請參閱本處每月出版之「藝文快訊」刊物或本處網站「藝文訊息」專區下載數位刊物查詢。\n◎其他相關資訊，歡迎電洽02-2577-5931分機343藝文推廣課。","u":"臺北市藝文推廣處","h":3116,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FD8E4C26C34E5AA0","d":"2020-10-07","sid":"FD8E4C26"},{"q":"藝文推廣處文山劇場彩排廳如何申請使用？","a":"◎收費標準及相關資訊:請逕上本處首頁「書表下載」區，或「市民服務大平臺 」網站下載「臺北市藝文推廣處場地收費基準表」查閱收費標準。\n◎有關文山劇場彩排廳檔期或其他之疑問，歡迎電洽02-2933-2199分機502文山劇場 (每週一公休) 。","u":"臺北市藝文推廣處","h":2869,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=ED7BA0F47BD382C4","d":"2020-10-07","sid":"ED7BA0F4"},{"q":"如何查詢藝文推廣處文山劇場演出節目名稱及票務資訊？","a":"◎歡迎您透過下列管道查詢文山劇場演出節目名稱及票務資訊:\n1.本處每月出版之「藝文快訊」刊物。\n2.本處網站「藝文訊息」專區下載數位刊物","u":"臺北市藝文推廣處","h":2282,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=28CC42BFBA449433","d":"2020-10-07","sid":"28CC42BF"},{"q":"如何至藝文推廣處藝文大樓及城市舞台？","a":"◎本處藝文大樓及城市舞台地址：105037臺北市松山區八德路三段25號\n◎藝文大樓聯絡電話：(02)2577-5931#100 ◎城市舞台聯絡電話：(02)2577-5931#2101\n建議您可搭乘: ◎捷運： 松山新店線「台北小巨蛋站」3號出口，沿北寧路步行5分鐘可抵達本處，右轉八德路三段步行5分鐘可抵達城市舞台。(請沿廣場旁旋轉樓梯下樓，即可達劇場入口) ◎公車： 1.「台視公司」 或 「美仁里」: 0東、202、203、205、257、276、278、605、605新台五、1061、1062、1191、9069。 2.「八德敦化路口」或「市立體育場」: 33、262、262區、275、275副、292、292副、556、630、688、902、903、905、905副、906、909、913、967、敦化幹線。","u":"臺北市藝文推廣處","h":2204,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2DC3B8A410BDE024","d":"2020-05-27","sid":"2DC3B8A4"},{"q":"藝文推廣處有哪些無障礙設施可提供身心障礙朋友使用？","a":"為方便來館之身心障礙民眾洽公、參與展覽、研習及觀賞節目，本處各場館皆設有無障礙設施，歡迎多加利用。\n◎藝文大樓 1、無障礙斜坡道(入口處) 2、無障礙廁所2間(位於2、4樓電梯旁) 3、愛心鈴1個(無障礙斜坡道旁) 4、電梯2部 5、1樓服務台提供輪椅借用服務 6、相關指示標誌\n◎城市舞台 1、無障礙輪椅平台9席(設置於2樓觀眾席) 2、無障礙廁所2間(1樓及3樓) 3、電梯2部(入口處及劇場內部) 4、無障礙斜坡道2座(藝文廣場) 5、1樓服務台提供輪椅借用服務 6、相關指示標誌\n◎文山劇場 1、B2劇場設有身心障礙席3席 2、無障礙廁所(於B2劇場、2、3、4樓各有1間) 3、無障礙斜坡及服務鈴(於1樓大門及側門皆設有) 4、電梯2部 5、1樓服務台提供輪椅借用服務 6、相關指示標誌\n◎親子劇場 1、無障礙輪椅席9席(第一排可拆卸) 2、無障礙廁所2間(市府大樓南區和北區各一) 3、無障礙坡道(劇場內兩側) 4、電梯2部(市府大樓南區和北區各一) 5、無障礙升降平台(舞台邊) 6、大廳提供輪椅借用服務 7、相關指示標誌\n◎大稻埕戲苑 1、無障礙購票窗口(位於9樓服務台) 2、無障礙廁所2間(8樓及9樓各1間) 3、輪椅席:9樓劇場觀眾席設有6席身障席(輪椅席)及6席身障陪同席;8樓曲藝場無固定座位，身障席(輪椅席)之配置及數量可視節目需求規劃安排 4、無障礙斜坡(位於永樂大樓1樓入口處) 5、提供輪椅借用服務(8、9樓服務台均可借用) 6、電梯6部(前後各3部) 7、無障礙停車位2個(永樂大樓) 8、相關指示標誌","u":"臺北市藝文推廣處","h":2000,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EB10383929867A23","d":"2020-06-11","sid":"EB103839"},{"q":"如何租借藝文推廣處大稻埕戲苑表演場地及查詢租借費用?","a":"◎大稻埕戲苑八樓曲藝場及九樓劇場場地租用採節目審查制，每年1月開放當年度7-12月檔期，每年7月開放次年1-6月檔期，零星空檔則逐案受理申請。請先來電查詢空檔後，自「市民服務大平臺」網站下載填寫申請書並檢附「大稻埕戲苑場地使用時段暨設備申請表」等相關演出資料，送藝文處大稻埕戲苑辦理。 ◎查詢租借費用:請逕上本處「書表下載」區下載「臺北市藝文推廣處場地收費基準表」查閱收費標準。\n◎任何關於大稻埕戲苑表演場地之疑問，歡迎電洽02-2556-9101 (每週一公休)。","u":"臺北市藝文推廣處","h":1170,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9F400AAF6A4BC5BB","d":"2020-10-07","sid":"9F400AAF"},{"q":"藝文推廣處大稻埕戲苑八樓曲藝場及九樓劇場共有多少觀眾席?","a":"◎大稻埕戲苑八樓曲藝場: 可容納 100-120席、無固定席位；身障席(輪椅席)之配置及數量可視節目需求規劃安排。\n◎大稻埕戲苑九樓劇場: 總座位數為506席，包含6席身障席(輪椅席)及6席身障陪同席。","u":"臺北市藝文推廣處","h":1165,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=25E0802FABF799D9","d":"2020-05-27","sid":"25E0802F"},{"q":"藝文推廣處大稻埕戲苑文化藝術研習班報名時間、開課時間、上課時數？","a":"文化藝術研習班每年分春、秋兩季，報名時間分別在每年一月、七月左右，建議您可於前年十二月底、當年六月底前來電大稻埕戲苑(02)2556-9101分機288洽詢或逕至「藝研班及藝文活動平台」網站參閱相關課程資訊。\n開課時間:分別於每年三月初、九月初起陸續開課。\n上課時數:每週一堂、每堂二小時，共計十五週。\n任何關於大稻埕戲苑文化藝術研習班之疑問，歡迎電洽02-25569101分機288(每週一公休)。","u":"臺北市藝文推廣處","h":1105,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9A5A36BA692EAC65","d":"2020-05-27","sid":"9A5A36BA"},{"q":"如何租借藝文推廣處大稻埕戲苑排練室?查詢租借費用?","a":"◎大稻埕戲苑設有排練室(共計四間)可供藝文團體租借排練使用。 ◎租借及檔期查詢:請電洽 02-2556-9101分機288陳小姐(每週一公休)。 ◎查詢租借費用:請逕上本處首頁「書表下載」區下載「臺北市藝文推廣處場地收費基準表」查閱收費標準。","u":"臺北市藝文推廣處","h":1003,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=35A82AB939500E56","d":"2020-10-07","sid":"35A82AB9"},{"q":"藝文推廣處大稻埕戲苑身心障礙朋友購票有優惠嗎？","a":"◎本處主合辦節目每場提供部分身心障礙席免費索取，其餘身障票五折優惠：\n1. 身心障礙人士及其必要之陪同人員(限一人)可於每月最後一個週三上午9:00開始，憑身心障礙證明正本(每場另須提供一份正反面影本存檔)至本處大稻埕戲苑八樓服務台免費索取次月票券。每人每月限領1場（含陪同席至多可領2張），索完為止；替人代領以1名為限，代領者請重新排隊。未索完票券則於週二至週日09:00~ 17:00開放索取。\n2. 各劇場每場節目提供之身心障礙席位與陪同席:\n九樓劇場6席 (含身心障礙席3席、陪同席3席)。\n曲藝場2席(含身心障礙席1席、陪同席1席)。\n3. 其餘節目請洽各主辦單位","u":"臺北市藝文推廣處","h":992,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7B77F01FF5A7DA09","d":"2020-10-07","sid":"7B77F01F"},{"q":"有關藝文推廣處「文化就在巷子裡-社區藝術巡禮」系列活動之相關問題，該詢問誰？","a":"◎相關活動訊息可參閱本處每月出版之「藝文快訊」刊物或本處網站「藝文訊息」專區下載數位刊物查詢。\n◎任何有關「文化就在巷子裡-社區藝術巡禮」系列活動之疑問，歡迎來電02-25775931分機347或348藝文推廣課洽詢。","u":"臺北市藝文推廣處","h":968,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3ADCEE244DABEB3","d":"2020-10-07","sid":"D3ADCEE2"},{"q":"藝文推廣處藝文大樓文化藝術研習班報名時間、開課時間、上課時數？","a":"◎文化藝術研習班每年分春、秋兩季，報名時間分別在每年一月、七月左右，建議您可於前年十二月底、六月底前來電(02)25775931#345藝文推廣課洽詢或逕至「藝研班及藝文活動平台」網站參閱相關課程資訊。\n◎開課時間:分別於三月、九月起陸續開課。 ◎上課時數:每週二小時，共計十五週。","u":"臺北市藝文推廣處","h":894,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE
