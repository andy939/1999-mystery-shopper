<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1999 秘密客抽測台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#e9edf3; --surface:#ffffff; --surface-2:#f4f7fa; --surface-3:#eaeff6;
  --ink:#131c26; --ink-2:#4a5866; --ink-3:#79879a;
  --line:#d6dee8; --line-2:#c3cede;
  --accent:#1f4b8f; --accent-2:#2f6ac0; --accent-soft:#e6ecf8;
  --good:#146b52; --good-soft:#e0f0ea;
  --warn:#9c5a11; --warn-soft:#f7ecd9;
  --shadow:0 1px 2px rgba(19,28,38,.06),0 6px 18px -14px rgba(19,28,38,.3);
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --sans:"Noto Sans TC","Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
  --btn-on:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d131a; --surface:#151e27; --surface-2:#1b2530; --surface-3:#222e3a;
    --ink:#e7edf4; --ink-2:#a8b5c2; --ink-3:#7a8896;
    --line:#293643; --line-2:#354655;
    --accent:#83abec; --accent-2:#a3c2f5; --accent-soft:#1a2942;
    --good:#5cb995; --good-soft:#14312a;
    --warn:#dfa658; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -18px rgba(0,0,0,.8);
    --btn-on:#0d131a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d131a; --surface:#151e27; --surface-2:#1b2530; --surface-3:#222e3a;
  --ink:#e7edf4; --ink-2:#a8b5c2; --ink-3:#7a8896;
  --line:#293643; --line-2:#354655;
  --accent:#83abec; --accent-2:#a3c2f5; --accent-soft:#1a2942;
  --good:#5cb995; --good-soft:#14312a;
  --warn:#dfa658; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -18px rgba(0,0,0,.8);
  --btn-on:#0d131a;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh;height:100dvh;gap:10px;padding:10px 12px 12px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:7px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font-size:17px;white-space:nowrap}
.top-meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.top-meta b{color:var(--ink);font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field > label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text]{background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;
  padding:4px 8px;font-size:12.5px}
select{min-width:132px}
select:hover,input:hover{border-color:var(--accent)}
.btn{background:var(--accent);color:var(--btn-on);border:1px solid var(--accent);border-radius:5px;
  padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.mini{padding:2px 8px;font-size:11.5px;font-family:var(--mono)}
.spacer{flex:1 1 auto}
.said{font-family:var(--mono);font-size:11px;color:var(--good);align-self:flex-end;padding-bottom:4px}

.board{display:grid;gap:10px;min-height:0;align-items:stretch}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.col > .head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;user-select:none;flex:none}
.col > .head h2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col > .head:hover{background:var(--surface-3)}
.step{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  border-radius:3px;padding:1px 5px;flex:none}
.count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex:none}
.caret{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
.col.fold > .head{flex-direction:column;height:100%;border-bottom:none;padding:10px 6px;gap:10px;
  justify-content:flex-start}
.col.fold > .head h2{writing-mode:vertical-rl;white-space:nowrap;overflow:visible}
.col.fold > .head .count,.col.fold > .head .step{display:none}
.col.fold > .body{display:none}

.pick{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  padding:6px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.pick:last-child{border-bottom:none}
.pick:hover{background:var(--surface-2)}
.pick[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pick .nm{flex:1 1 auto;min-width:0}
.pick .qty{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pick .q{font-size:12.5px;line-height:1.45;display:block}
.pick .sub{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px;font-family:var(--mono)}
.hot{color:var(--warn);font-family:var(--mono);font-size:9.5px;border:1px solid var(--warn);border-radius:3px;
  padding:0 3px;white-space:nowrap;flex:none}
.empty{padding:20px 14px;color:var(--ink-3);font-size:12.5px;text-align:center}

.sh-top{padding:9px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--surface)}
.sh-top h2{font-size:15.5px;line-height:1.4;margin-bottom:5px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;
  color:var(--ink-2);background:var(--surface-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

details.blk{border-bottom:1px solid var(--line)}
details.blk > summary{list-style:none;cursor:pointer;padding:7px 14px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
details.blk > summary::-webkit-details-marker{display:none}
details.blk > summary:hover{background:var(--surface-2)}
details.blk > summary .num{color:var(--accent);font-weight:600}
details.blk > summary .tail{margin-left:auto;color:var(--ink-3);text-transform:none;letter-spacing:0}
details.blk[open] > summary{background:var(--surface-2);border-bottom:1px solid var(--line)}
details.blk > summary .mk{color:var(--ink-3)}
details.blk[open] > summary .mk{color:var(--accent)}
.blkin{padding:10px 16px 14px;max-width:78ch}

/* 逐字稿 */
.line{display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;padding:4px 0}
.who{font-family:var(--mono);font-size:10px;color:var(--btn-on);background:var(--ink-2);border-radius:3px;
  height:18px;display:grid;place-items:center;margin-top:3px;letter-spacing:.06em}
.who.me{background:var(--accent)}
.who.gap{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2)}
.say{border-left:2px solid var(--line-2);padding-left:11px;font-size:13.5px;line-height:1.7}
.line.agent .say{border-left-color:var(--good);background:var(--good-soft);border-radius:0 5px 5px 0;
  padding:3px 10px 3px 11px}
.say em{font-style:normal;color:var(--warn);font-size:12px;font-family:var(--mono)}
.mark{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--good);border:1px solid var(--good);
  border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.cite{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.5;margin-top:1px}
.watch{background:var(--surface-2);border-left:2px solid var(--accent);border-radius:0 5px 5px 0;
  padding:8px 12px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.watch b{color:var(--ink)}
ul.prep{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

/* 追問卡 */
.probe{border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin-bottom:8px;background:var(--surface-2)}
.probe .n{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:600}
.probe .ask{font-size:14px;line-height:1.6;margin:2px 0 5px}
.probe .why,.probe .ans{font-size:12px;line-height:1.6;color:var(--ink-2);display:flex;gap:7px}
.probe .why b,.probe .ans b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);
  flex:none;padding-top:2px;text-transform:uppercase}
.probe .ans span{color:var(--ink)}
.probe .kind{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line-2);border-radius:3px;
  padding:0 4px;color:var(--ink-3)}
.refs{display:flex;flex-direction:column;gap:7px}
.ref{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  padding:7px 11px;background:var(--surface-2)}
.ref .rq{font-size:13px;line-height:1.5;font-weight:500}
.ref .rm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.6}
.ref .rm a{color:var(--accent)}
.badge{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:var(--btn-on);border-radius:3px;
  padding:0 5px;margin-right:6px;vertical-align:1px;font-weight:600}
.badge.alt2{background:transparent;color:var(--ink-3);border:1px solid var(--line-2)}
/* 永遠可見的 FAQ 來源列（腳本欄底部） */
.srcbar{flex:none;border-top:1px solid var(--line);background:var(--surface-2);padding:5px 12px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;
  overflow-x:auto;white-space:nowrap}
.srcbar .lb{color:var(--ink-2);font-weight:600;flex:none}
.srcbar a{color:var(--accent);text-decoration:none;border:1px solid var(--line-2);border-radius:4px;
  padding:1px 7px;max-width:26ch;overflow:hidden;text-overflow:ellipsis;flex:none}
.srcbar a:hover{background:var(--accent-soft);border-color:var(--accent);text-decoration:underline}
.srcbar a .rl{color:var(--ink-3);margin-right:4px}
.srcbar a.main{border-color:var(--accent)}

.alt{border-left:2px solid var(--line-2);padding:2px 0 2px 11px;margin-bottom:9px}
.alt .lv{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:600}
.alt p{margin:1px 0 0;font-size:13px;line-height:1.65}
.alt .obs{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.alt.cur{border-left-color:var(--accent);background:var(--accent-soft);border-radius:0 5px 5px 0;padding-right:9px}

ol.points{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
ol.points li{font-size:12.5px;line-height:1.6}
.src{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin:10px 0 0;line-height:1.5}
.src a{color:var(--accent)}
.hidden{display:none!important}

/* 矮螢幕（含 125%／150% 縮放）：壓縮頁首與控制列，維持單畫面三欄 */
@media (max-height:760px){
  .app{gap:7px;padding:7px 9px 9px}
  header.top{padding:4px 12px;gap:12px}
  h1{font-size:15px}
  .controls{padding:5px 12px;gap:5px 12px}
  .field > label{font-size:9px}
  select,input[type=text]{padding:2px 7px;font-size:12px}
  .btn{padding:3px 10px}
  .sh-top{padding:6px 12px}
  .sh-top h2{font-size:14.5px;margin-bottom:3px}
  .blkin{padding:8px 14px 10px}
  details.blk > summary{padding:5px 12px}
}
@media (max-height:620px){
  header.top .eyebrow{display:none}
  .tagrow{display:none}
}
/* 只有真正窄或極矮的視窗才退回堆疊，腳本排最前面 */
@media (max-width:860px),(max-height:420px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;display:block;padding:9px}
  header.top,.controls{margin-bottom:9px}
  .board{grid-template-columns:1fr!important}
  .col{margin-bottom:9px}
  #col-sheet{order:-1}
  .body{max-height:52vh}
  .col.fold > .head{flex-direction:row;height:auto;padding:7px 12px}
  .col.fold > .head h2{writing-mode:horizontal-tb}
}
@media print{
  html,body{overflow:visible;height:auto}
  .app{display:block;height:auto}
  header.top,.controls,.col.rail,#col-org,#col-topic{display:none!important}
  .board{display:block}
  .col{box-shadow:none;border-color:#999;break-inside:avoid;overflow:visible}
  .body{overflow:visible;max-height:none}
  .blkin{max-width:none}
}
</style>

<style>html{color-scheme:light dark}img{max-width:100%}</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <span class="eyebrow">1999 話務品質稽核</span>
    <h1>秘密客抽測台</h1>
  </div>
  <div class="top-meta">題庫 <b id="m-faq">—</b> 題 · 局處 <b id="m-org">—</b> · 更新 <b id="m-date">—</b></div>
</header>

<div class="controls">
  <div class="field"><label for="f-persona">秘密客身分</label><select id="f-persona"></select></div>
  <div class="field"><label for="f-level">情境難度</label><select id="f-level"></select></div>
  <div class="field"><label for="f-window">撥入時段</label><select id="f-window"></select></div>
  <div class="field"><label for="f-search">全題庫搜尋</label>
    <input type="text" id="f-search" placeholder="拖吊、特休、房屋稅…" style="width:150px"></div>
  <div class="field"><label>腳本區塊</label>
    <div style="display:flex;gap:4px">
      <button class="btn mini ghost" id="btn-expand">全展開</button>
      <button class="btn mini ghost" id="btn-collapse">全收合</button>
      <button class="btn mini ghost" id="btn-max">腳本最大化</button>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="said" id="said"></span>
  <button class="btn ghost" id="btn-copy">複製腳本</button>
  <button class="btn ghost" id="btn-print">列印／PDF</button>
  <button class="btn" id="btn-random">隨機抽一題</button>
</div>

<div class="board" id="board">
  <div class="col" id="col-org" data-fold="org">
    <div class="head"><span class="caret">▾</span><span class="step">1</span><h2>局處</h2>
      <span class="count" id="org-count"></span></div>
    <div class="body" id="org-list"></div>
  </div>

  <div class="col" id="col-topic" data-fold="topic">
    <div class="head"><span class="caret">▾</span><span class="step">2</span><h2>主題</h2>
      <span class="count" id="topic-count"></span></div>
    <div class="body" id="topic-list"></div>
  </div>

  <div class="col" id="col-sheet">
    <div class="sh-top">
      <div class="eyebrow" id="sh-org">—</div>
      <h2 id="sh-q">—</h2>
      <div class="tagrow" id="sh-chips"></div>
    </div>
    <div class="body" id="sh-body"></div>
    <div class="srcbar" id="src-bar"></div>
  </div>
</div>

<script type="application/json" id="faq-data">{"generated":"2026-09-04","source":"faq_export (4).xlsx","totalFaq":8317,"orgs":[{"org":"勞動局","total":652,"items":[{"q":"新修正之勞工特別休假日數有多少？","a":"勞工在同一雇主或事業單位，繼續工作滿一定期間者，應依下列規定給予特別休假：\n一、六個月以上一年未滿者，三日。\n二、一年以上二年未滿者，七日。\n三、二年以上三年未滿者，十日。\n四、三年以上五年未滿者，每年十四日。\n五、五年以上十年未滿者，每年十五日。\n六、十年以上者，每一年加給一日，加至三十日為止。\n例一：\n勞工甲105年2月1日到職，於105年8月1日仍在職，雖年資已滿6個月，惟依當時勞基法規定，尚無權請求特別休假。\n勞工甲如106年1月1日仍在職，因工作年資已滿6個月以上，即可依新修正之勞基法規定取得3天特別休假，但應於106年1月1日至106年1月31日間請休；到期後(106年1月31日)未休之日數，雇主應折發工資。\n勞工甲如106年2月1日仍在職，因年資已滿1年，爰自106年2月1日至107年1月31日，可另排定特別休假7天。\n例二：\n勞工乙103年10月1日到職，於105年10月1日仍在職，因年資已滿2年，依當時勞基法規定，取得7天特別休假(亦即自105年10月1日至106年9月30日，可排定特別休假7天)。\n勞工乙如106年1月1日仍在職，因工作年資2年餘，可依新修正之勞基法規定有10天的特休，所以，雇主應自106年1月1日起至106年9月30日，增給勞工乙第2年之特別休假3天。","u":"臺北市政府勞動局勞動基準科","h":2193462,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E7E256F86D1D733C","d":"2016-12-16","sid":"E7E256F8"},{"q":"離職要多久前辦理?","a":"1.勞工離職需依工作年資長短提前預告雇主。 (1)繼續工作3個月以上1年未滿者，於10日前預告之。 (2)繼續工作1年以上3年未滿者，於20日前預告之。 (3)繼續工作3年以上者，於30日前預告之。 2.勞動基準法第15條：「特定性定期契約期限逾3年者，於屆滿3年後，勞工得終止契約。但應於30日前預告雇主。不定期契約，勞工終止契約時，應準用第16條第1項規定期間預告雇主。」、第16條第1項規定略以：「...預告期間...：一、繼續工作3個月以上1年未滿者，於10日前預告之。二、繼續工作1年以上3年未滿者，於20日前預告之。三、繼續工作3年以上者，於30日前預告之。」。 聯絡科室：勞動基準科承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7017、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":1335721,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D1C889060F54ACC9","d":"2012-12-28","sid":"D1C88906"},{"q":"勞工婚假有幾日呢?何時可以開始請假？需要一次請完嗎?未休完可以折算工資嗎?","a":"勞工婚假8日，自結婚之日前10日起3個月內請休。但經雇主同意者，得於1年內請畢。尚無限制僅能一次請完，得由雙方約定之。未休完，能否折算工資，法無明文規定，應由勞資雙方協商辦理。 例如，勞工如於108年8月12日登記結婚，自108年8月2日起3個月內(即108年11月1日前)均可請休婚假，但經雇主同意者得於109年8月1日前請畢。如勞雇雙方之約定優於上述規定，即從其約定。 參考： 依勞工請假規則第2條規定：「勞工結婚者給予婚假八日，工資照給。」、復依勞動部104年10月7日發布勞動3字第1040130270號令釋，勞工之婚假可自結婚之日前10日起3個月內請休。但經雇主同意者，得於1年內請畢。 聯絡科室：勞動基準科承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":906176,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B5DDD7D62A791464","d":"2012-12-28","sid":"B5DDD7D6"},{"q":"喪假請假規定","a":"依勞工請假規則第三條規定：「勞工喪假依下列規定：一、父母、養父母、繼父母、配偶喪亡者，給予喪假八日，工資照給。二、祖父母、子女、配偶之父母、配偶之養父母或繼父母喪亡者，給予喪假六日，工資照給。三、曾祖父母、兄弟姊妹、配偶之祖父母喪亡者，給予喪假三日，工資照給。」 另喪假不含例假日，若勞工如因禮俗原因，得申請分次給假，勞資雙方應於勞動契約或工作規則清楚約定請假相關規定，使勞工知悉並有所依循，以避免爭議。","u":"臺北市政府勞動局勞動基準科","h":827780,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6A8B18F938AEDB3F","d":"2012-12-28","sid":"6A8B18F9"},{"q":"何謂公傷假？公傷假如何給薪？事業單位可否以勞工請公傷假超過一定期間，年終考核予以列為丙等？","a":"1.勞工因職業災害而致殘廢、傷害或疾病者，其治療、休養期間，給予公傷病假。\n2.勞工在醫療中不能工作時，雇主應按其原領工資數額予以補償。\n3.在公傷病假醫療休養期間不能工作，並非勞工不願工作，不應視為缺勤而影響其年終考核獎金之發給及晉薪之機會。\n參考：\n依勞工請假規則第6條：「勞工因職業災害而致殘廢、傷害或疾病者，其治療、休養期間，給予公傷病假。」、勞動基準法第59條第2款規定略以：「勞工在醫療中不能工作時，雇主應按其原領工資數額予以補償。」、同法施行細則第31條規定略以：「本法第59條第2款所稱原領工資，係指該勞工遭遇職業災害前1日正常工作時間所得之工資。其為計月者，以遭遇職業災害前最近1個月正常工作時間所得之工資除以30所得之金額，為其1日之工資。罹患職業病者依前項規定計算所得金額低於平均工資者，以平均工資為準。」、勞工請假規則第9條規定略以：「雇主不得因勞工請...公傷病假...，扣發全勤獎金。」、行政院勞工委員會（82）台勞動二字第 14508 號函釋：「勞工因職業災害治療休養，依勞工請假規則第六條規定，雇主應給予公傷病假，該假並無期間限制。在公傷病假醫療休養期間不能工作，並非勞工不願工作，不應視為缺勤而影響其年終考核獎金之發給及晉薪之機會。」\n聯絡科室：勞動基準科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":794842,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=ADAA02A1538EEA1D","d":"2012-12-28","sid":"ADAA02A1"},{"q":"休息日加班費如何計算？","a":"[107年3月1日起]\n1.依勞動基準法第24條規定，勞工於法定休息日出勤工作時，工作時間在2小時以內者，其工資按平日每小時工資額另再加給1又1/3以上，工作2小時再繼續工作者，按平日每小時工資額另再加給1又2/3以上。\n2.以勞工月薪36,000元，推算每日工資1,200元，平日每小時工資額為150元為例：\n（1）休息日工作1小時，應另再加給200元（計算方式：150x1又1/3=200），當月工資合計36,200元。)\n（2）休息日工作6小時，應另再加給1,400元（計算方式：150x1又1/3x2+150x1又2/3x4=1,400）當月工資合計37,400元。)\n（3）休息日工作10小時，應另再加給2,700元（計算方式：150x1又1/3x2+150x1又2/3x6+150x2又2/3x2=2,700）當月工資合計38,700元。)\"","u":"臺北市政府勞動局勞動基準科","h":592136,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=473FFB4AD8DF5CC2","d":"2016-12-16","sid":"473FFB4A"},{"q":"資遣費計算標準為何?","a":"資遣費如何計算，可利用勞動部「資遣費試算表」進行試算。(https://calc.mol.gov.tw/SeverancePay/)\n資遣費計算標準分為舊制、新制及新舊制混和：\n(1)舊制：94年7月1日以前在同一事業單位(適用勞動基準法)服務之勞工，選擇勞動基準法退休制度(俗稱舊制)的勞工資遣費計算：勞工工作年資滿1年應給與1個月平均工資之資遣費；未滿1年的部分(剩餘月數)，依比例計給之；未滿1個月者以1個月計（依據勞動基準法第17條規定）。\n(2)新制：94年7月1日以後在同一事業單位(適用勞動基準法)服務之勞工，選擇勞工退休金條例退休制度(俗稱新制)的勞工資遣費計算：按勞工工作年資，每滿1年發給二分之一個月的平均工資，未滿1年，按比例計算。最高以發給6個月平均工資為限（依據勞工退休金條例第12條規定）。\n(3)新舊混和：如果勞工在94年7月1日以前就服務適用勞動基準法的事業單位，而選擇新制(同時具有新、舊制年資)的勞工資遣費計算：上述(1)+(2)總和(即是舊制年資資遣費及新制年資資遣費分別依上開規定計算的總和)。","u":"臺北市政府勞動局勞動基準科","h":541297,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=558B0B1319334763","d":"2012-12-28","sid":"558B0B13"},{"q":"115年1月1日起，最低工資之調漲?","a":"勞動部發布，自115年1月1日起實施，每月最低工資調整為29,500元，每小時最低工資調整為196元。","u":"臺北市政府勞動局勞動基準科","h":518599,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=70464C835E4688A8","d":"2015-07-30","sid":"70464C83"},{"q":"女性受僱者分娩或流產或人工流產時可請幾天產假？薪資如何計算？","a":"一、雇主在女性受僱者分娩期間，應使其停止工作，給予產假八星期；妊娠三個月以上流產者，給予產假四星期；妊娠二個月以上未滿三個月流產者；給予產假一星期；未滿二個月流產者，給予產假五日(依性別平等工作法第15條規定)。\n二、依行政院勞工委員會91年10月22日勞動三字第0910055077號令函釋，勞動基準法第五十條及性別平等工作法所稱分娩及流產，依醫學上之定義，妊娠二十週以上產出胎兒為分娩，妊娠二十週以下產出胎兒為流產。另產假天數應依曆連續計算（遇例假日均包括在內，不另給假）。\n三、產假期間薪資以適用勞基法的勞工來說，產假天數八星期及四星期部分工資照給(工作未滿六個月者減半發給)，一星期及五日部份可不給薪，但不可影響全勤獎金、考績。","u":"臺北市政府勞動局就業安全科","h":427268,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A3908574ADFE1EE4","d":"2012-12-28","sid":"A3908574"},{"q":"如果申請育嬰留職停薪,復職後,年休假如何計算？","a":"一、勞工在同一雇主或事業單位，繼續工作滿一定期間者，應依下列規定給予特別休假（勞動基準法第38條）：一、六個月以上一年未滿者，三日。二、一年以上二年未滿者，七日。三、二年以上三年未滿者，十日。四、三年以上五年未滿者，每年十四日。五、五年以上十年未滿者，每年十五日。六、十年以上者，每一年加給一日，加至三十日為止。\n二、育嬰留職停薪期間，除勞雇雙方另有約定外，不計入工作年資計算（育嬰留職停薪實施辦法第4條規定）。\n三、若員工於育嬰留職停薪期滿復職後，申請育嬰留職停薪之當年度之特別休假天數未休畢，則於復職時之當年度可繼續行使特別休假權益。若於申請育嬰留職停薪前，當年度之特別休假已休畢，則復職後，尚需依勞動基準法第38條規定繼續在同一雇主或事業單位，繼續工作滿一定期間始得行使特別休假權益。\n四、有關育嬰留職停薪期間之工作年資，除勞雇雙方另有約定外，不計入工作年資。","u":"臺北市政府勞動局就業安全科","h":307486,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B463C360A22B1352","d":"2013-04-10","sid":"B463C360"},{"q":"勞工請假規則規定是否包含本人或配偶的外祖父母？","a":"勞工請假規則之祖父母係包含內外祖父母。\n民法對於親屬關係僅有親等之分，無內外之別，祖父母亦包含母之父母，即通稱之外祖父母。故勞工本人之外祖父母過世，則勞工依法可請喪假6日；勞工配偶之外祖父母過世，則勞工依法可請喪假3日。\n聯絡科室：勞動基準科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":282347,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1BF01728F8BDC217","d":"2012-12-28","sid":"1BF01728"},{"q":"勞工事假，一年不得超過幾日？工資給付？如一年超過14日公司如何處理？","a":"依勞工請假規則第7條規定：「勞工因有事故必須親自處理者，得請事假，一年內合計不得超過十四日。事假期間不給工資。」，超過14日者，依內政部(74)台內勞字第315047號函釋略以：「勞工全年事假日數超過本規則者，其超過部份得以特別休假抵充，如無特別休假或特別休假已休畢者，其處理原則事業單位可明定於工作規則中，報准後實施並公開揭示。」超過部分勞資雙方協商議定。","u":"臺北市政府勞動局勞動基準科","h":252216,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C7F1B09DBDDB54D5","d":"2012-12-28","sid":"C7F1B09D"},{"q":"平均工資如何計算？如果工作未滿6個月，又該如何計算？","a":"一、日平均工資：謂計算事由發生之當日前6個月內所得工資總額除以該期間之總日數所得之金額。工作未滿6個月者，謂工作期間所得工資總額除以工作期間之總日數所得之金額。\n二、月平均工資：事由發生前6個月工資除以6；或日平均工資乘以計算期間每月之平均日數。\n三、例如：某勞工工作未滿六個月，在職區間為108年1月1日至5月10日（勞動基準法施行細則第2條第1款規定「發生計算事由之當日」不列入計算）： (一)日平均工資：應自1月1日計算至5月9日所得工資總額除以4個月又9天總日數(31天+28天+31天+30天+9天)。 (二)月平均工資：1月1日至5月9日期間(跨越1月至5月)每月之平均日數為(31天+28天+31天+30天+31天)/5=30.2天，則該名勞工之月平均工資應為「(每日)平均工資」X30.2天。\n※參考：\n四、依本法第2條第4款計算平均工資時，下列各款期日或期間均不計入（勞動基準法施行細則第2條規定及勞動部歷年函令補充）：\n（一）發生計算事由之當日(依本府函詢勞動釋示係指「契約存續之末日」)。\n（二）因職業災害尚在醫療中者。\n（三）依本法第50條第2項減半發給工資者。\n（四）雇主因天災、事變或其他不可抗力而不能繼續其事業，致勞工未能工作者。\n（五）依勞工請假規則請普通傷病假者。\n（六）依性別平等工作法請生理假、產假、家庭照顧假或安胎休養，致減少工資者。\n（七）留職停薪者。\n（八）勞資協商無薪假(減班休息)期間(勞動部91.1.17勞動2字第0910002799號令)。\n（九）合法罷工期間(行政院勞工委員會(現勞動部)84.7.14臺勞資3字第124022號函)。\n（十）勞工曾於疫情期間，依嚴重特殊傳染性肺炎防治及紓困振興特別條例第三條規定請防疫隔離假、勞工依嚴重特殊傳染性肺炎中央流行疫情指揮中心所為之應變措施，請防疫照顧假。(勞動部109.3.30勞動條2字第1090130209號令)\n（十一）勞工曾於疫情期間，依嚴重特殊傳染性肺炎中央流行疫情指揮中心所為之應變措施，請疫苗接種假期間 (勞動部110.7.19勞動條2字第1100130753號令)。\n（十二）事業單位","u":"臺北市政府勞動局勞動基準科","h":218736,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=024AC00552729B45","d":"2013-04-17","sid":"024AC005"},{"q":"預告工資以何薪資條件做為計算基準(當月實領或應領薪資)？","a":"依據勞動基準法第16條規定，工作3個月以上未滿1年者應於10日前預告；工作1年以上3年未滿者應於20日前預告；工作3年以上者應於30日前預告。\n預告期間工資之給付標準，為「雇主應預告期間之日數乘以勞工一日工資」；該一日工資，為勞工契約終止前一日之正常工作時間所得之工資。其為計月者，為契約終止前最近一個月正常工作時間所得之工資除以三十所得之金額。但該金額低於平均工資者，以平均工資計給。（勞動部109年10月29日勞動關2字第1090128292A號令）","u":"臺北市政府勞動局勞動基準科","h":211701,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D25A3877CA42E31B","d":"2012-12-28","sid":"D25A3877"},{"q":"何謂結清年資？","a":"1.結清年資係指勞資雙方於勞動契約存續期間，雙方約定以不低於勞基法第55條及84條之2之給與標準，結清保留之舊制年資（勞工退休金條例第11條）。\n2.結清年資之條件：\n(1)該條例施行前已適用勞動基準法之勞工\n(2)該條例施行後仍服務於同一事業單位之勞工\n(3)該條例施行後選擇適用新制之勞工\n3.結清年資之計算標準：\n(1)比照退休金之計算方式，依照勞基法第55條計算，舊制年資未滿半年以半年計，滿半年以1年計，前面15年內1年給付2個基數，超過15年部分1年給付1個基數。\n(2)上述基數是指現在協議結清前半年之平均工資。（舉例：91年3月5日到職，94年7月1日改選新制，舊制年資3年3個月又25日，進位後變3.5年x 2個基數=7個基數，假設結清前半年平均工資如為4萬元，7個基數x 4萬元=結清費用需給付28萬元）。","u":"臺北市政府勞動局勞資關係科","h":199150,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2460F586A8AD87CE","d":"2016-01-28","sid":"2460F586"},{"q":"結婚何時生效？婚假應如何放？","a":"1.  我國自97年5月23日起採結婚登記生效之制度。\n參考：民法第982條：「結婚應以書面為之，有2人以上證人之簽名，並應由雙方當事人向戶政機關為結婚之登記。」\n2.  勞工結婚者給予婚假8日，工資照給（依勞工請假規則第2條規定）；勞工之婚假可自結婚之日前10日起3個月內請休。但經雇主同意者，得於1年內請畢，並自即日起生效。\n參考：\n婚假8天不包含例假日。原定婚假應自登記之日起「一次請足」之規定，影響勞工結婚禮俗儀式、宴客或是蜜月旅行之彈性安排；為符勞工實際需求，讓勞工對於婚假安排更為從容，雇主亦能對於勞工請休婚假期間之人力調配更具彈性，勞動部特於104年10月7日發布勞動3字第1040130270號令釋，放寬勞工請婚假期間規定。爾後，勞工之婚假可自結婚之日前10日起3個月內請休。但經雇主同意者，得於1年內請畢，並自即日起生效。\n聯絡科室：勞動基準科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":193766,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6A62B5EF76233449","d":"2013-02-23","sid":"6A62B5EF"},{"q":"何謂童工？","a":"勞動基準法中所稱的童工，是指「15歲以上未滿16歲之受僱從事工作者」。\n僱用童工雇主應置備其法定代理人同意書及其年齡證明文件。未滿16歲之青少年如徵得父母同意打工，則必須注意以下：童工每日之工作時間不得超過8小時，也不得於午後8時至翌晨6時之時間內以及例假日工作。","u":"臺北市政府勞動局勞動基準科","h":154174,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B1F8F507F570323","d":"2012-12-28","sid":"0B1F8F50"},{"q":"勞基法是否對員工年終獎金有相關規定？","a":"雇主依民俗發給勞工的年終獎金，屬於勞工福利，發放之條件及標準，可以由勞雇雙方在勞動契約中約定，或雇主於工作規則中訂定。\n勞基法有關獎金或紅利的規定是在第29條，這項規定只說明「企業如果年終結算有賺錢，應該給予員工獎金或紅利。」並未定義在法律規定範圍內。員工年終獎金的權利來源，端看各公司的工作規則或勞動契約的內容。年終獎金性質是受公司當年度盈餘獲利狀況，分配給員工，較屬勞基法第29條規定內容，應屬「獎勵」性質。\n聯絡科室：勞動基準科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7018、3325、3327、3349","u":"臺北市政府勞動局勞動基準科","h":149601,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C89ED2FE141B47BC","d":"2012-12-28","sid":"C89ED2FE"},{"q":"生理假請假規定？若雇主要求員工請生理假時需提出證明，若無法提出時，雇主是否可要求請其他假別？","a":"一、女性受僱者因生理日致工作有困難者，每月得請生理假一日，全年請假日數未逾三日，不併入病假計算，其餘日數併入病假計算，雇主不得拒絕，前項併入及不併入病假之生理假薪資，減半發給（性別工作平等法第14條及第21條規定）。\n二、為符合生理假維護女性受僱者身體健康之意旨，受僱者申請生理假時無須檢附相關證明文件，雇主不得要求勞工改請其他假別。","u":"臺北市政府勞動局就業安全科","h":148661,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3C24490F2CA77BDE","d":"2014-01-22","sid":"3C24490F"},{"q":"依勞基法第16條規定每週可有2天的謀職假，若未使用可折算工資嗎?→倘若勞工未請謀職假，工資該如何給付？","a":"勞工未謀職請假外出，雇主應依實際出勤狀況正常給薪。 如勞工於預告期間請謀職假者，其請假時數，每星期不得超過2日之工作時間，請假期間之工資照給。勞工若未請謀職假，即應正常出勤，雇主應依實際出勤狀況正常給薪，惟無生加給薪資問題。 聯絡科室：勞動基準科承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":147379,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B7ACD5F6E43EF4B","d":"2012-12-28","sid":"0B7ACD5F"},{"q":"勞工普通傷病假怎麼請？病假期間工資如何給付？","a":"一、查勞工請假規則第4條第1項規定:「一、未住院者，一年內合計不得超過30日。二、住院者，二年內合計不得超過一年。三、未住院傷病假與住院傷病假二年內合計不得超過一年。四、經醫師診斷，罹患癌症（含原位癌）採門診方式治療或懷孕期間需安胎休養者，其治療或休養期間，併入住院傷病假計算。」\n二、同條第3項規定:「普通傷病假一年內未超過30日部分，工資折半發給，其領有勞工保險普通傷病未達工資半數者，由雇主補足之。」\n聯絡科室：勞動基準科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7017、3325、3327、3349","u":"臺北市政府勞動局勞動基準科","h":142899,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3AFE42FAD98227F","d":"2012-12-28","sid":"D3AFE42F"},{"q":"雇主對於在職勞工應多久實施健康檢查？","a":"（一）一般健康檢查 ：\n1、新進員工任職前需實施「一般體格檢查」，在職勞工任職中要做「一般健康檢查」。\n2、一般健康檢查的實施頻率： 60歲以上者，每年檢查一次 ，40 歲以上未滿60 歲，2 年檢查一次，未滿40 歲者，3 年檢查一次\n(二)特殊健康檢查：於特殊環境工作之勞工，雇主需每年幫該勞工從事特別危害健康檢查。\n聯絡科室：職業安全衛生科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7021、7022、1414、7024、7507、1412","u":"臺北市政府勞動局職業安全衛生科","h":135074,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F53A77C86E5F76F1","d":"2012-12-28","sid":"F53A77C8"},{"q":"如何取得非自願離職證明？(就業保險法第5條、第11條、第23條、第25條第3、4、5項)","a":"1.被保險人為受僱勞工，自投保單位非自願性離職辦理退保，向投保單位申請離職證明書或定期契約證明文件，具有工作能力及繼續工作意願，向各地公立就業服務機構辦理求職登記。 2.離職證明書應載明申請人姓名、投保單位名稱及離職原因，且蓋有足資代表公司之章戳，若檢附定期契約證明文件應由勞僱雙方用印。倘若為因定期契約屆滿離職，應逾一個月未能就業，且離職前一年內，契約期間合計滿六個月以上者，視為非自願性離職。","u":"臺北市政府勞動局就業安全科","h":119901,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=735AD2B4CAB0C03F","d":"2012-12-28","sid":"735AD2B4"},{"q":"退休計算平均工資時，是否要含未休完的特休假薪資?","a":"有關退休計算平均工資時，是否要含未休完的特別休假薪資，應先視「原特別休假年度終結」時點是否在平均工資計算事由發生之當日前6個月之內而定，倘於期間內，勞工並未排定特別休假日數時，於「年度終結」雇主發給未休日數工資，係屬勞工全年度未休假而工作之報酬，其究有多少未休日數屬平均工資計算期間內，法無明文，可由勞雇雙方議定之。另，勞工於「契約終止」時仍未休完特別休假，雇主所發給特別休假未休日數之工資，因屬終止契約後所得，得不併入平均工資計算。\n參考：\n１．勞動部 107年4月11日勞動條2字第 1070130350 號函略以：「一、查勞動基準法（以下簡稱本法）第38條第4項規定：「勞工之特別休假，因年度終結或契約終止而未休之日數，雇主應發給工資。但年度終結未休之日數，經勞雇雙方協商遞延至次一年度實施者，於次一年度終結或契約終止仍未休之日數，雇主應發給工資。」。二、次查本法施行細則第 24 條之 1  第 2  項規定略以：「一、... （三）勞雇雙方依本法第38條第4項但書規定協商遞延至次一年度實施者，按原特別休假年度終結時應發給工資之基準計發。」。三、復查本法第2條第4款規定略以：「平均工資：謂計算事由發生之當日前6個月內所得工資總額除以該期間之總日數所得之金額。」。所稱「工資總額」，係指計算事由發生當日前6個月內因工作獲得之報酬總額。四、特別休假經勞資雙方協商遞延，於次一年度因年度終結或契約終止仍未休畢之日數，雇主依本法第38條第4項但書及本法施行細則第24條之1規定發給之特休遞延工資，因性質係屬勞工前一年度（原特別休假年度）未休假而工作之報酬，應否計入平均工資之計算，應先視「原特別休假年度終結」之時點，是否在平均工資計算事由發生之當日前6個月之內而定；倘於平均工資計算期間內，因屬「原特別休假年度」全年度未休假工作所得之報酬，其究有多少未休日數之工資應列入平均工資計算，法無明文，可由勞雇雙方議定之。至於「原特別休假年度終結」之時點，非於平均工資計算期間者，毋庸列計。」。\n２．勞動部106年7月12日勞動條2字第1060131476號函：「一、依勞動基準法（以下簡稱本法）第38條","u":"臺北市政府勞動局勞動基準科","h":114639,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F12824332AC34D2B","d":"2013-06-19","sid":"F1282433"},{"q":"資遣費計算是取離職前六個月的平均工資，但若前六個月有請事假，是否須排除於平均工資計算之外？","a":"事假應納入平均工資中計算，無須排除。\n參考：\n1.勞動基準法施行細則第2條：「依本法第2條第4款計算平均工資時，左列各款期間之工資日數均不列入計算。1、發生計算事由之當日。2、因職業災害尚在醫療中者。3、依本法第50條第2項減半發給工資者。4、雇主因天災、事變或其他不可抗力而不能繼續其事業，致勞工未能工作者。」\n2.行政院勞工委員會78年4月17日勞動2字第08899號函略以：「勞工請事假不發給工資期間，應否列入計算平均工資乙案，可參照內政部74年11月21日臺內勞字第357224號函辦理。『1、勞工請假規則第4條規定，勞工普通傷病假全年未超過30日部分，工資折半發給。上開工資折半發給期間應不列入計算平均工資。2、勞工因普通傷病假超過30日或因留職停薪致無法獲領工資期間，因該段期間勞工業經雇主同意不需提供勞務，雇主依法亦得不給付工資，該段期間不屬於工作期間，應不列入計算平均工資。』，故依其函釋意旨，除普通傷病假未超過30日領取折半工資、或超過30日普通傷病假及因留職停薪而未能領取工資期間，可不列入平均工資計算外，勞工向雇主請事假期間，仍應列入平均工資之計算。\n聯絡科室：勞動基準科承辦人\n聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9","u":"臺北市政府勞動局勞動基準科","h":112806,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4E87D99F601FEDA9","d":"2013-04-17","sid":"4E87D99F"}]},{"org":"社會局","total":628,"items":[{"q":"低收入戶如何分類?","a":"本市低收入戶共分5類，詳述如下：（115年）\n一.第0類，全戶均無收入。每人可領取20,744元生活扶助費；第三口（含）以上領15,317元。\n二.第1類，全戶平均每人每月總收入大於0元，小於等於2,807元。每人可領取15,317元生活扶助費。\n三.第2類，全戶平均每人每月總收入大於2,807元，小於等於9,263元。\n1.全戶可領取7,911元家庭生活扶助費。\n2.若家戶內有18歲以下兒童或青少年，每增加一口，該家戶增發8,289元兒童及少年生活補助費。\n3.如單列一口(即戶內僅有1低收入戶輔導人口)18歲以下之兒童或少年，則僅核發兒童或少年生活補助費，不得兼領家庭生活扶助費7,911元。\n四.第3類，全戶平均每人每月總收入大於9,263元，小於等於14,036元。若家戶內有18歲以下兒童或青少年，每增加一口，該家戶增發7,589元生活扶助費。\n五.第4類，全戶平均每人每月總收入大於14,036元，小於等於20,744元。若家戶內有18歲以下兒童或青少年，每增加一口，該家戶增發4,889元生活扶助費。\n附註:\n註1：家戶內如有兒童、少年、身心障礙者或65歲以上老人，另發給兒童少年生活補助費，身心障礙者生活補助費或老人生活補助費。\n註2：戶內同一輔導對象，若兼具老人、身心障礙者雙重身分、則低收入戶老人生活補助、身心障礙者生活補助，只能擇優領取，不得重覆。\n註3:  家戶內同一輔導對象、若為身心障礙者，且同時兼具兒童少年或學生等其中一種身分,除身心障礙者生活補助費外,可同時領取臺灣省公告金額之低收入戶兒童生活補助或就學生活補助費。\n註4：依社會救助法或其他法令每人每月所領取政府核發之救助金額，115年度最高至29,500元為限。","u":"臺北市政府社會局社會救助科","h":276692,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BAA030FB7C91B247","d":"2018-06-20","sid":"BAA030FB"},{"q":"申請低收入戶之洽辦單位、應備文件及資格為何？","a":"1.洽辦單位:戶籍所在地區公所社會課。\n2.應備文件:(1)申請表1份（可自本局網站下載， https://service.gov.taipei/Case/ApplyWay/201906230027 ）。(2)新式戶口名簿(含詳細記事)影本1份。(3)戶長郵局或市庫指定銀行(現為台北富邦銀行)存摺封面影本1份。(4)其他相關證明文件1份（如：身心障礙證明文件、診斷證明書、學生證、薪資證明、房屋所有權狀影本等）。\n3.資格:設籍並實際居住本市、最近1年出境累計未超過183日，且同時符合以下條件者：1、家庭總收入平均分配全家人口，每人每月在最低生活費標準以下（本市115年度為20,744元）。2、全家人口之存款（含股票投資）平均每人不超過新臺幣15萬元。3、全家人口之土地及房屋價值不超過新臺幣837萬元。","u":"臺北市政府社會局社會救助科","h":116625,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8336A7914A3243BF","d":"2018-06-20","sid":"8336A791"},{"q":"該如何查詢合法立案社會團體?","a":"1、依人民團體法第3條規定，本府社會局為本市立案社會團體的主管機關，如為全國性社團，其主管機關則為內政部合作及人民團體司。\n2、本府社會局業將本市立案之社會團體名冊登錄於社會局網站，網址：https://dosw.gov.taipei/人民團體服務項下/福利據點；一般民眾可依其團體屬性，直接進入團體類別(如經濟業務團體、醫療衛生團體、宗教團體......)查詢，如不知團體類別，請按全選，以關鍵字查詢。","u":"臺北市政府社會局人民團體科","h":91906,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CEA2C60692E92DA3","d":"2018-04-30","sid":"CEA2C606"},{"q":"敬老卡擴大使用範圍為何？","a":"可參閱社會局網站/相關服務/銀髮族服務/敬老優待/敬老悠遊卡相關優待\n敬老悠遊卡相關優待，請參閱此頁面","u":"臺北市政府社會局老人福利科","h":89869,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=28DAF6EF13124F7C","d":"2018-06-28","sid":"28DAF6EF"},{"q":"如果想查詢敬老悠遊卡每月免費點數或票卡內自行加值之金額該如何查詢(含欲查詢是否有扣款錯誤之情形)？","a":"1.可持卡至臺北捷運各站詢問處旁的自動查詢機、或置於本市各區公所之悠遊卡展期機可查詢該票卡最後6筆刷卡(含加值)紀錄。\n2.可逕至悠遊卡公司官方網站查詢3日前至1年內刷卡(及交易)紀錄，網址： https://ezweb.easycard.com.tw/search/CardSearch.php (路徑：悠遊卡記名設定>相關連結>記名卡查詢交易紀錄)項下查詢\n3.如欲查詢較早(最後6筆)以前的刷卡(及交易)紀錄，需致電悠遊卡股份有限公司客服專線查詢；電話(市話直撥)412-8880(手機及金馬地區請加02)。","u":"臺北市政府社會局老人福利科","h":85894,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=268DA12F3EB3A1B6","d":"2018-06-28","sid":"268DA12F"},{"q":"敬老悠遊卡有使用期限嗎?","a":"有使用期限。\n1.使用期限為半年(6個月)。\n2.展期地點（攜帶票卡辦理）\n(1)貼有「悠遊卡 」標誌之特約便利超商（7-11、全家、萊爾冨、OK）\n(2)臺北大眾捷運系統各捷運站之查詢機\n(3)臺北市各區公所、文山區便民工作站\n3.如票卡逾期未展期(超過6個月未展期)，亦可至上述展期地點辦理展期。\n提醒您：每張票卡有效期限為 6 個月，在票卡未逾期之期限內可就近 辦理展期，最長不要超過 6 個月，例如：1 月和 7 月各辦理 一次，若擔心會忘記，也可以每個月或每 2 個月（視個人方便）辦理，每次辦理後均可將使用期限往後延長 6 個月。","u":"臺北市政府社會局老人福利科","h":85249,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B691E13D9055D273","d":"2018-06-28","sid":"B691E13D"},{"q":"敬老悠遊卡遺失該怎麼辦？應備何文件重新辦理？","a":"請先打電話至412-8880(手機或金馬地區請撥:02-412-8880)辦理掛失，客服專線撥通話後→選擇國語服務「按1」→掛失「按1」、轉接專人接聽「按7」。\n重新申辦應備文件：\n申請補發票卡，得由持卡本人或委任代理人，備妥申請人國民身分證(外國人準備外僑永久居留證)、2吋彩色照片1張，55 歲以上原住民者需另備原住民身分證明文件。申請遺失補發需自費製卡費用100元，就近至本市任一區公所提出申請。\n委任代理人申請票卡者，請攜帶申請人國民身分證(外國人準備外僑永久居留證)、2吋彩色照片1張、印章，另提出委任書及代理人之身分證明文件。\n若原敬老悠遊卡內有儲值金，請攜帶申請人帳戶影本，併同辦理退款申請。","u":"臺北市政府社會局老人福利科","h":83032,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2F8806591C713B6F","d":"2018-06-28","sid":"2F880659"},{"q":"安養中心是什麼?要怎麼分?長照機構又是什麼?","a":"一、老人福利機構，依照老人福利法第34條及老人福利機構設立標準第2條將老人機構分為：\n(一)長期照顧機構(即一般所稱安養中心、養老院、養護所)分為下列三種類：\n1.長期照護型：以罹患長期慢性病，且需要醫護服務之老人為照顧對象\n2.養護型：以生活自理能力缺損需他人照顧之老人或需鼻胃管、胃造廔、導尿管護理服務需求之老人為照顧對象。\n3.失智照顧型：以神經科、精神科等專科醫師診斷為失智症中度以上、具行動能力，且需受照顧之老人為照顧對象。\n(二)安養機構：以需他人照顧或無扶養義務親屬或扶養義務親屬無扶養能力，且日常生活能自理之老人為照顧對象。\n(三)其他老人福利機構：提供老人其他福利服務。\n二、長期服務，依長期照顧服務法第9條及21條:長照機構依提供方式與其服務內容，分類如下：\n(一)居家式服務類：到宅提供服務。\n(二)社區式服務類：於社區設置一定場所及設施，提供日間照顧、家庭托顧、臨時住宿、團體家屋、小規模多機能及其他整合性等服務。但不包括機構住宿服務類。\n(三)機構住宿式服務類：以受照顧者入住之方式，提供全時照顧或夜間住宿等之服務。\n(四)綜合式服務類:提供上開兩種以上服務之長照機構。\n聯繫窗口如下：","u":"臺北市政府社會局老人福利科","h":82910,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FE1C946372823B5A","d":"2020-09-29","sid":"FE1C9463"},{"q":"育兒津貼申請條件中所指稅率未達20%大約是年收入多少錢？","a":"112及113年度綜合所得稅申報核定稅率未達20％（含12％、5％及未達申報額度等），也就是家庭綜合所得淨額在127萬元及133萬元以下者。\n※名詞補充說明：綜合所得淨額＝綜合所得總額-免稅額及扣除額。\n但 自 112年1月 起也已經取消稅率限制囉 ，直接向兒童戶籍地區公所申請即可。","u":"臺北市政府社會局婦女福利及兒童托育科","h":82342,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8B6F6A4535BE9132","d":"2018-06-11","sid":"8B6F6A45"},{"q":"何謂「川資救助」？","a":"一、申請資格\n非設籍本市市民流落本市，缺乏車資返鄉，經評估後得核發鐵路局或國光客運單程換票證1張，以供返回戶籍地。\n二、時效限制\n本項救助以每半年申請1次為限。\n三、洽辦單位\n本市火車站鄰近之中正區公所、萬華區公所、松山區公所及南港區公所社會課。（自107年1月1日起，內政部警政署鐵路警察局臺北分局臺北分駐所不再協助辦理假日及夜間川資救助。）\n夜間及假日可洽詢火車站鄰近之康定路派出所(萬華車站)、松山派出所(松山車站)、南港派出所(南港車站)以及忠孝西路派出所(臺北車站)。\n聯絡電話：\n中正區公所：02-23416721\n萬華區公所：02-23064468\n松山區公所：02-87878787\n南港區公所：02-27831343\n康定路派出所：02-23064226\n松山派出所：02-27670446\n南港派出所：02-27830476\n忠孝西路派出所：02-23142722","u":"臺北市政府社會局社會救助科","h":72711,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1E2C9ABD6AC99971","d":"2018-06-22","sid":"1E2C9ABD"},{"q":"常常聽到的「敬老津貼、敬老年金、老人年金」、「以前每個月領3,000元、3,500元」，係為「老年基本保證年金」，洽詢單位為何？如何請領？沒收到款項怎麼辦？","a":"常常聽到的「敬老津貼、敬老年金、老人年金」等，此項目為老年基本保證年金（原稱敬老福利生活津貼），非屬本府所發放之「重陽敬老禮金、重陽節禮金」，故相關請領資格、給付標準、審核撥款請逕洽勞動部勞工保險局，電話：（02）2396-1266分機2366。\n老年基本保證年金（原稱敬老福利生活津貼），國民年金開辦後，由勞動部勞工保險局改以國民年金老年基本保證年金名義繼續發放，按月發給老年基本保證年金。另國民年金法於100年12月21日修正公布增列第54條之1，自101年1月起給付金額由3,000元調整為3,500元；自105年1月起調整為3,628元，109年1月起為3,772元。（資料來源：勞動部勞工保險局網站 https://www.bli.gov.tw/ ）","u":"臺北市政府社會局老人福利科","h":67963,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=99378A8141E110CD","d":"2018-10-23","sid":"99378A81"},{"q":"我有申請育兒津貼，如果我的戶籍有異動，要如何申報?會影響我的補助資格嗎?","a":"(一) 於臺北市內遷移：\n1.戶籍異動後仍於同個行政區內：請於1個月內主動向該區公所申報，更正通訊地址，津貼將續發，不影響補助資格。\n2.臺北市行政區戶籍異動(○○區遷□□區)：請於1個月內主動向原申請(或遷入地)之區公所申報，津貼將續發，不影響補助資格。\n(二)已遷出臺北市：\n請於1個月內主動向原申請之區公所申報，臺北市撥款至遷出「當」月。自「次」月起，由遷入新戶籍地之核定機關撥付，如有撥款帳戶需更換或親屬關係變動之情形，請逕自向遷入新戶籍地確認。","u":"臺北市政府社會局婦女福利及兒童托育科","h":67000,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AAAF2A916123463C","d":"2018-06-21","sid":"AAAF2A91"},{"q":"托嬰中心腸病毒停課標準？","a":"一、 疾病管制署 公布全國發生腸病毒 A71型流行 ，托嬰中心停托隔離措施： 當托嬰中心內同一班在一週內有二名（含）以上幼童經醫師診斷為腸病毒感染（手足口病或疱疹性咽峽炎等）時，該班應停托七天。 二、無腸病毒 A71型流行 ，托嬰中心停托隔離措施：\n托嬰中心所在之行政區，若由疾病管制署公布檢出「腸病毒A71型陽性個案」或「年齡滿三個月（含）以上腸病毒感染併發重症個案（不含腸病毒D68型）」，當托嬰中心內同一班在一週內有二名（含）以上幼童經醫師診斷為腸病毒感染（手足口病或疱疹性咽峽炎等）時，該班應停托七天。 三、當托嬰中心內發生 腸病毒感染併發重症 通報個案， 且檢出腸病毒D68 型時：托嬰中心停托隔離措施 該個案就托之班應停托七天。\n四、托嬰中心內發生 腸病毒感染併發重症 通報個案，托嬰中心停托隔離措施：\n該個案就托之班在一週內有二名（含）以上幼童經醫師診斷為腸病毒感染（手足口病或疱疹性咽峽炎等）時，該班應停托七天。 五、如發現疑似傳染病個案，請機構務必於 發現時 48 小時 內至「 臺北市學校傳染病通報系統 」通報，請即時通報免遭本府衛生局裁罰。 六、另請各機構於兒童入中心時，量測體溫及檢查手足、口腔是否白點及破洞，如發現疑似有腸病毒病症狀，請依「臺北市托嬰中心腸病毒通報及停托作業規定」第3條規定請家長帶就托兒童就醫， 應停托至少7天且無感染症狀後始得復托 。同時應告知其他兒童家長提高警覺，及進行班級或全機構消毒工作，以防群聚感染。 七、若需瞭解腸病毒防疫相關知識可至本府衛生局(http://www.health.gov.tw/)／主題專區／疾病防治／腸病毒疫情資訊；或可撥打衛生福利部疾病管制署免付費疫情通報及諮詢專線1922或本府衛生局防疫專線02-23753782。","u":"臺北市政府社會局婦女福利及兒童托育科","h":62640,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0C05FCED9CFDE230","d":"2016-06-21","sid":"0C05FCED"},{"q":"申請特殊境遇家庭扶助應具備什麼條件？","a":"1.申請人需設籍並實際居住臺北市，115年度其家庭總收入平均每人每月未超過3萬9,960元，且家庭財產〈含存款本金、投資、獎金中獎所得及財產交易所得〉平均每人未超過62萬2,320元，不動產全戶不超過650萬元，並符合下列各款情形之一者：\n（1）65歲以下，其配偶死亡，或失蹤經向警察機關報案協尋未獲達6個月以上。\n（2）因配偶惡意遺棄或受配偶不堪同居之虐待，經判決離婚確定或已完成協議離婚。\n（3）家庭暴力受害。\n（4）未婚婦女，懷胎3個月以上至分娩2個月內。\n（5）因離婚、喪偶、未婚生子獨自扶養18歲以下子女或獨自扶養18歲以下父母無力扶養之孫子女，其無工作能力，或雖有工作能力，因遭遇重大傷病或照顧6歲以下子女致不能工作。\n（6）配偶處1年以上之徒刑或受拘束人身自由之保安處分1年以上，且在執行中。\n（7）經本局評估，因3個月內生活發生重大變故導致生活、經濟困難，且其重大變故非因個人責任、債務、非因自願性失業等事由。\n2.設籍及居住本市之例外：新住民與設籍本市市民辦理結婚登記，且實際居住臺北市者，於尚未取得本國國籍前，得不受設籍之限制；另申請人符合家庭暴力受害，得不受實際居住臺北市之限制。\n單位：社會局婦幼科\n聯絡人：陳小姐\n聯絡電話：1999轉1951","u":"臺北市政府社會局婦女福利及兒童托育科","h":59262,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F86046FC3A91FCAF","d":"2018-06-08","sid":"F86046FC"},{"q":"如何預約親子館空間預約及親子活動報名?","a":"一、本市各親子館的空間預約及親子活動報名:\n二、若需查詢各親子館及育兒友善園的介紹與活動資訊可至臺北育兒網(網址:為 https://welfare.gov.taipei/Kids/ )。","u":"臺北市政府社會局婦女福利及兒童托育科","h":52914,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=96EE31C0469377F4","d":"2018-06-05","sid":"96EE31C0"},{"q":"老人收容安置補助之申請資格、流程、應備文件、補助內容等相關規定為何？","a":"一、申請資格：\n1.設籍並實際居住本市滿1年以上，且年滿65歲之市民。\n2.具本市低收入戶、符合本市中低收入戶、領取中低收入老人生活津貼且具中、重度失能者。\n3.經安置或入住於本市、新北市、基隆市、宜蘭縣評鑑合格之機構住宿式服務類長期照顧服務機構或本市經評鑑(督考)為乙等以上，或經評鑑(督考)為乙等以上之老人長期照顧機構或護理之家（倘未先完成失能評估即入住新北市、基隆市、宜蘭縣安置機構者需達3個月以上)。\n二、申請流程：申請人先向本市長期照顧管理中心各區服務站申請失能評估，評估後再由申請人自行選擇入住上開規定之安置機構，(或入住後向本局提出申請書後，由本局轉介本市長期照顧管理中心各區服務站進行失能評估)並確認符合上開條件，再檢附申請資料向本局申請補助。\n三、應備文件：\n（一）申請表正本。\n（二）機構入住合約書。\n（三）入住滿3個月之繳款收據（入住臺北市之機構者，免附）。\n（四）本局低收入住機構合作契約書一式二份（本項為屬本市低收入戶0-2類且無家屬重度失能者需檢附）。\n（五）本市老人收容安置特別處遇評估及計畫書（本項為機構申請特別處遇費者需檢附）。\n四、補助內容：\n（一）低收入戶0-2類重度失能及中度失能補助分別為27,250元及15,750元（外縣市為22,000元及10,800元）；低收入戶3-4類重度失能及中度失能補助分別為23,000元及10,500元（外縣市為22,000及7,200元）。\n（二）中低收入重度失能及中度失能補助分別為22,000元及6,300元（外縣市為22,000元及4,320元）。\n五、洽辦資訊：\nhttps://dosw.gov.taipei/cp.aspx?n=2A069CBD089B5C1A","u":"臺北市政府社會局老人福利科","h":47273,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=89EA6FBF24B14229","d":"2018-05-22","sid":"89EA6FBF"},{"q":"每一位托育人員(保母)可收托幾名幼兒？","a":"依居家式托育服務提供者登記及管理辦法第7條規定：\n一、每一托育人員：\n（一）半日、日間、延長或臨時托育：至多四人，其中未滿二歲者至多二人。\n（二）全日或夜間托育：至多二人。\n二、二名以上托育人員：於同一處所共同托育至多四人，其中全日或夜間托育至多二人。\n前項兒童人數，應以托育人員托育服務時間實際照顧兒童數計算，並包括其未滿三歲之子女與受其監護者、未滿五歲之三親等內兒童及未滿十二歲之未收取托育費用之兒童；收托人數計算，如法規附表。\n托育人員提供到宅托育服務，第一項兒童人數以該住所或居所實際受照顧兒童之人數計算。\n第一項第二款之托育服務，應就收托之兒童分配主要照顧人。","u":"臺北市政府社會局婦女福利及兒童托育科","h":46369,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0AD88AFD9B427DF6","d":"2018-07-04","sid":"0AD88AFD"},{"q":"臺北市育兒津貼和衛福部社家署育有未滿二歲兒童育兒津貼有什麼不同？","a":"現行臺北市育兒津貼為配合行政院擴大實施育兒津貼之意旨，已轉成優先發放中央育兒津貼。 針對0至2歲優先申領「衛生福利部育有未滿2歲兒童育兒津貼」；2歲以上未滿學齡5歲兒童優先申領「教育部2歲以上未滿5歲幼兒育兒津貼」。 故兩者已無不同。","u":"臺北市政府社會局婦女福利及兒童托育科","h":44216,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=25461CE8838FF0E8","d":"2018-06-21","sid":"25461CE8"},{"q":"為什麼兒童育兒津貼滿2歲第一個月補助停掉?","a":"教育部2歲以上未滿學齡5歲幼兒育兒津貼自108年8月開辦，凡幼童年滿2歲第1個月起，育兒津貼補助改採「次月」入帳。故滿2歲第一個月會先暫停補助，等到教育部比對完就學名冊，即會於下個月發放款項。\n例如：兒童108年7月滿2歲，108年8月暫停補助，於108年9月入帳8月份補助款，10月份入帳9月份補助款，之後各月份請依此類推。","u":"臺北市政府社會局婦女福利及兒童托育科","h":43594,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4BFFD145B25A06F6","d":"2020-07-13","sid":"4BFFD145"},{"q":"低收入戶申請條件中，規定土地及房屋價值不得超過837萬元，若房子有貸款中，是否會扣除貸款額度？","a":"如名下房屋為銀行貸款所購得，依內政部91年2月5日函釋略以：「申請者不動產總值尚不能與貸款相互扣抵」，故不得扣除貸款額度。\n依據社會救助法第4條規定，低收入戶指經申請戶籍所在地直轄市、縣 （市） 主管機關審核認定，符合家庭總收入平均分配全家人口，每人每月在最低生活費以下（115年度為20,744元），且家庭財產未超過中央、直轄市主管機關公告之當年度一定金額者（包括動產、不動產，動產限制平均每人存款及投資不得超過15萬元，不動產限制全家人口之土地及房屋價值合計不得超過837萬元）。有關土地價值之計算，以公告土地現值為準據；房屋價值之計算，以評定標準價格為準據。","u":"臺北市政府社會局社會救助科","h":43434,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3B79E62102668445","d":"2018-06-20","sid":"3B79E621"},{"q":"社會局辦理之托育費用補助內容有那些？","a":"就托於臺北市12歲以下兒童，符合各補助資格要求者，有下列托育補助項目可供申請：\n一、臺北市－弱勢家庭兒童托育補助：\n(一)設籍本市12歲以下兒童，實際就托於本市保母或立案之私立幼托機構（托兒所、幼稚園及改制完成之幼兒園）、課後托育中心（含改制後之課後照顧中心），且符合以下資格之一者，可申請補助：\n1.本市列冊低收入戶。\n2.經本局委託安置於寄養家庭之學齡前兒童。\n3.經本局委託安置於兒童安置及教養機構之兒童。\n4.危機家庭經評估核定有托育需求之兒童。\n5.特殊境遇家庭未滿六歲子女或孫子女。\n6.經本局評估需緊急轉托之兒童（係指兒童托育之照顧者未適當照顧，經本局評估必須立即轉托者）。\n(二)補助金額：\n1.就托於保母者，學齡前兒童每人每月最高補助8,000元，學齡兒童每人每月最高補助4,000元整。\n2.就托於托嬰中心者，每人每月最高補助8,000元整。\n3.就托於幼兒園者（含緩讀生），每人每月最高補助6,000元；以特殊境遇家庭兒童身分申請者每人每月最高補助1,500元。(兒童就讀公立幼兒園、非營利幼兒園及準公共化幼兒園者，應優先申請教育部及本府教育局學費補助，本補助不予補助。)\n4.國小1至2年級兒童，每人每月最高補助4,500元。\n5.國小3至6年級兒童，每人每月最高補助3,500元。\n※ 兒童就讀公立幼兒園、非營利幼兒園及準公共化幼兒園者，應優先申請教育部及本府教育局學費補助，本補助不予補助；另兒童就讀私立幼兒園者應優先申領本府教育局「 2-4歲寶貝我愛你私幼教育扶助差額補助 」，至有差額者始予補助差額 。\n※ 就讀私立幼托園所符合請領「5歲幼兒就學補助」之大班生，另加額申領本府教育局「 2-4歲寶貝我愛你私幼教育扶助差額補助 」，致領取總額超過36,000元/學期以上，無需辦理該學期托育補助差額之申請及撥付。\n二、衛生福利部社會及家庭署－未滿2歲兒童托育公共化及準公共服務費用：本補助為衛生福利部社會及家庭署開辦，補助將未滿3歲幼兒送托參與準公共之保母、托嬰中心或社區公共托育家園照顧者。\n(一)申請資格：\n1.委託人為一般身分，或經直轄市、縣(市)政府依社會救助法","u":"臺北市政府社會局婦女福利及兒童托育科","h":43173,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9AE6236C0066DD59","d":"2017-11-20","sid":"9AE6236C"},{"q":"我想要捐贈金錢或物資給育幼院，請問可以捐給哪些單位？","a":"本市8家立案育幼院，可依您所在地域方便性或去電瞭解其需求後選擇捐贈：\n1、財團法人中華文化社會福利事業基金會台北兒童福利中心 (02)3765-2575(臺北市信義區忠孝東路5段295巷8號)。\n2、財團法人臺北市私立華興育幼院 (02)2833-0150(臺北市士林區仰德大道1段101號)。\n3、財團法人臺北市私立義光育幼院 (02)2304-5561(臺北市萬華區和平西路3段382巷11弄17號)。\n4、財團法人臺北市私立體惠育幼院 (02)2871-5276(臺北市北投區中和街399之8號)。\n5、財團法人臺北市基督教伯大尼兒少家庭基金會附設伯大尼兒少家園 (02)2939-6396(臺北市文山區保儀路129號)。\n6、財團法人基督教聖道兒少福利基金會附屬台北市私立聖道兒童之家 (02)2820-0002(臺北市北投區承德路7段388號)。\n7、財團法人忠義基金會附設臺北市私立忠義育幼院 (02)2930-9581(臺北市文山區景興路85巷12號)。\n8、財團法人台灣關愛基金會附設台北市私立關愛之子家園 (02)2651-9773(臺北市南港區南港路1段173號4樓)。","u":"臺北市政府社會局兒童及少年福利科","h":42145,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=296688C46F529263","d":"2018-06-12","sid":"296688C4"},{"q":"本市有哪些老人日間照顧中心(只收失智失能長者，週一至周五白天送至中心照顧)","a":"有關本市老人日間照顧中心(只收失智失能長者，週一至周五白天送至中心照顧)請參考附件檔案","u":"臺北市政府社會局老人福利科","h":40387,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A8CFC34CA2B34EE4","d":"2018-06-25","sid":"A8CFC34C"},{"q":"申請設立社會福利慈善基金會要向何單位申請？需準備文件、流程為何?","a":"一、可向臺北市政府社會局人民團體科提出申請。地址：臺北市信義區市府路1號東南區6樓，諮詢電話：1999（02-27208889)轉分機6956-6958\n二、申請辦理社會福利慈善基金會需準備文件及流程說明如下：\n申請本市社福慈善基金會，以主事務所設立於臺北市，業務以辦理社會福利及慈善事業為主要目的，且捐助財產之現金金額不得少於新臺幣1,000萬元整。需具備之申請文件如后：\n(一)申請書一式。\n(二)捐助章程；以遺囑捐助設立者，並應檢附其遺囑影本一式5份。\n(三)捐助財產清冊及其證明文件一式5份。\n(四)董事（監察人）名冊及其身分證明文件影本一式5份。\n(五)願任董事（監察人）同意書一式5份。\n(六)財團法人印信及董事（監察人）印鑑清冊一式5份。\n(七)基金會董(監)事之間三等親以內血親、姻親未超過全體董(監)事三分之一之切結書一式5份。\n(八)年度經費預算書、年度業務計畫及其說明書一式5份。\n(九)捐助人同意於財團法人獲准設立許可登記時，將捐助財產移轉為財團法人所有之承諾書一式5份。\n(十)事務所使用證明文件(房地產借《租》用同意書及產權證明文件)。\n(十一)其他主管機關規定之文件一式5份(捐助人(籌備會)會議紀錄、第1屆第1次董事會會議紀錄、基金會組織概況表、辦事細則、職員名冊、基金會董事五分之一以上從事社會福利業務相關經驗之證明文件、分事務所所在地為洗錢或資恐高風險國家或地區者，其防制洗錢及打擊資恐因應計畫等)。\n(十二)申請人委託代理者應具委任書。\n(十三)申請許可設立本市社會福利及慈善事業有關之財團法人基金會名稱除應冠財團法人臺北市外，可依屬性參考定名如下，以利識別：\n1.財團法人臺北市○○○社會福利基金會\n2.財團法人臺北市○○○慈善基金會\n3.財團法人臺北市○○○社會福利慈善基金會\n4.財團法人臺北市○○○（依服務群體屬性如：身心障礙、老人、婦女、兒童、青少年）社會福利基金會。\n另上開文件及申請流程亦可至社會局網頁(https://dosw.gov.taipei/)人民團體服務/基金會/申請許可設立社會福利及慈善事業有關之財團法人基金會項下參閱、下載。","u":"臺北市政府社會局人民團體科","h":38718,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=268856D9FC61A72F","d":"2019-05-17","sid":"268856D9"},{"q":"持有重大傷病證明卡者可否申請身心障礙證明？","a":"重大傷病證明係依據全民健康保險法規定由衛生福利部中央健康保險署核發，與身心障礙類別、等級之範圍不同，持有重大傷病證明卡者仍需經身心障礙者鑑定符合身心障礙等級，始能核發身心障礙證明。","u":"臺北市政府社會局身心障礙者福利科","h":38046,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B145DFC430493A09","d":"2018-06-25","sid":"B145DFC4"}]},{"org":"稅捐稽徵處","total":624,"items":[{"q":"如果没有收到稅單，能不能在便利商店補單繳納稅款？","a":"您可利用自然人/工商憑證或內政部行動自然人憑證之行動裝置至四大便利商店(統一、全家、萊爾富及OK）之多媒體事務機Kiosk查詢定期開徵（於開徵起日前5個日曆天至開徵迄日屆滿後3日24時止)及補徵之使用牌照稅(另包含試車牌、臨時車、新領車、重領車之繳款書)、房屋稅、地價稅及土地增值稅、契稅、印花稅、娛樂稅之稅目資訊，勾選列印繳納單(限稅額3萬元以下)並當日至店家櫃檯掃描條碼完成繳稅(使用牌照稅只需輸入納稅義務人身分證字號/統一編號及車牌號碼，即可列印繳款條碼於店家櫃檯完成繳稅) ，亦可於本處稅務全功能自動化服務機（Kiosk）以自然人/工商憑證、已註冊之健保卡補發當期房屋稅、地價稅及使用牌照稅稅單，民眾如需繳納證明請向本處所屬分處申請。","u":"臺北市稅捐稽徵處稅務管理科","h":47760,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8FFC44C7FBAC992D","d":"2017-07-17","sid":"8FFC44C7"},{"q":"我想查詢有沒有享用過一生一次的土地增值稅自用住宅用地稅率，可以向哪裡詢問？","a":"您可以攜帶身分證到稅捐處各轄區分處的全功能服務櫃檯申請，如果不是本人來申請，要請代理人攜帶土地所有權人的身分證影本（須切結與正本相符）、委託書和代理人的身分證，到全功能服務櫃檯填寫申請書，就可隨到隨辦了。您也可以透過財政部稅務入口網（https://www.etax.nat.gov.tw/etwmain/etw108w）線上申請。","u":"臺北市稅捐稽徵處財產稅科","h":47018,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B2246545B84380C9","d":"2020-04-21","sid":"B2246545"},{"q":"沒收到地價稅單，要如何補發？","a":"透過電話、郵寄、臨櫃、視訊，以身分證，向土地所轄稅捐稽徵處分處申請補發。\n若為開徵期間，除上開方式，亦可以自然人憑證或已註冊健保卡驗證身分，透過下列方式申請補發：\n1.線上申辦：至本處網站\\納稅資訊\\申辦與書表下載\\地價稅\\申請補發地價稅繳款書。\n2.線上查繳稅：至地方稅網路申報作業\\定期開徵查繳稅及電子傳送服務項下，查詢應納稅額線上繳稅。\n3.便利商店多媒體機補單：至統一、全家、萊爾富及OK等便利商店之多媒體資訊機，列印繳納單後至該店家櫃檯完成繳納。(限稅額每筆在新臺幣3萬元以下者)\n臺北市稅捐稽徵處各分處聯絡電話","u":"臺北市稅捐稽徵處財產稅科","h":44385,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=927DF9A4A0B66DD6","d":"2022-02-09","sid":"927DF9A4"},{"q":"如何申請財產歸戶證明及應備文件？","a":"一、本人申請查詢全國財產總歸戶應檢附之證明文件： 1.本人之身分證。(臨櫃申辦：查驗正本，並影印1份備查；郵寄申辦：檢附身分證影本，並具結「本影本與正本相符，如有不實願負法律責任」。) 2.申請書(簽名或蓋章)。 二、代理人申請查詢全國財產總歸戶應檢附之證明文件： 1.代理人身分證正本。(臨櫃申辦：查驗正本，並影印1份備查；郵寄申辦：檢附身分證影本。) 2.申請人身分證影本。 3.申請人如為繼承人，應檢附與被繼承人關係證明文件及被繼承人死亡證明文件。 4.上述證明文件為影本者，應具結「本影本與正本相符，如有不實願負法律責任」。 5.授權書(簽名或蓋章)。 6.申請書(簽名或蓋章)。 三、公司申請查詢全國財產總歸戶應檢附之證明文件？ 1.營利事業組織：中央或地方政府核發之核准函及設立或變更登記表或公司登記事項證明書(得以加註具結之影本代替正本)。 2.其他組織：主管機關核准成立之證照(得以加註具結之影本代替正本)。 3.申請書(簽名或蓋章)。","u":"臺北市稅捐稽徵處稅務管理科","h":39373,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7EB1D6C2AFAB0891","d":"2009-07-14","sid":"7EB1D6C2"},{"q":"如何申請更正房屋稅、地價稅及使用牌照稅繳款書寄送地址？","a":"（一）臨櫃申請：就近至稅捐處各分處申請更正地址，應備證件如下：\n1.納稅人本人申請，應檢附身分證正本。\n2.代理人申請者，應檢附代理人身分證正本、授權人身分證影本及委任書。\n（二）電話申請：電話申請變更繳款書寄送地址，並請傳真身分證影本至所在地的稅捐分處。\n（三）網路申請：本處網站建置「稅務視訊服務雲」提供納稅義務人上傳身分證影像檔申請更正地址。","u":"臺北市稅捐稽徵處企劃服務科","h":37809,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=30EC8CB060DAF1FC","d":"2020-01-08","sid":"30EC8CB0"},{"q":"沒有收到使用牌照稅單，怎麼辦？","a":"透過電話、郵寄、臨櫃、視訊，以身分證，向車籍所轄稅捐稽徵處分處申請補發，亦可至該機關派駐監理機關櫃檯申請補發。\n若為開徵期間，除上開方式，亦可以自然人憑證或已註冊健保卡驗證身分，透過下列方式申請補發：\n臺北市稅捐稽徵處各分處聯絡電話 https://tpctax.gov.taipei/Content_List.aspx?n=F4E1FC06E499E2A4","u":"臺北市稅捐稽徵處機會稅科","h":34587,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2C643038A6E319E7","d":"2008-06-23","sid":"2C643038"},{"q":"朋友為了小孩的學區或工作的關係，把戶籍寄放到我家，但並沒有搬來住，會不會影響我的地價稅自用住宅稅率？","a":"土地稅法規定，自用住宅用地指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或營業用之住宅用地。故朋友寄戶籍，如無租賃情形，僅係單純寄戶籍，且土地所有權人仍作自用住宅使用，可繼續按自用住宅用地稅率課徵地價稅。","u":"臺北市稅捐稽徵處財產稅科","h":32358,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=67117D61F0EF6EB8","d":"2008-06-23","sid":"67117D61"},{"q":"申請土地增值稅一生一次自用住宅優惠稅率有什麼條件？","a":"一 、土地及地上房屋是土地所有權人本人或其配偶、直系親屬所有，並且在該地上房屋辦竣戶籍登記。\n二 、在出售前1年內沒有作營業或出租之住宅用地。\n三 、一人一生以1次為限。\n四 、出售都市土地面積以300平方公尺或非都市土地以700平方公尺為限。\n五 、該筆土地地上建物之評定現值須達所占基地公告土地現值10%。但自用住宅建築工程完成滿1年以上者不在此限。\n註 ：出售前1年內未曾供營業或出租使用，應以下列基準日往前推算1年之期間計算：\n1. 出售土地於訂約之日起算30日內申報移轉者，以訂約日為準；逾30日始申報者，以申報日為準。\n2. 法院拍賣之土地，以法院拍定日為準。\n3. 法院判決移轉之土地，以向法院起訴日為準。\n4. 拆除改建中出售之土地，以核准拆除日為準。但提示實際拆除日期之證明文件者，可以實際拆除日為準。\n5. 自益信託塗銷登記，回復原所有權人後移轉者，其往前推算之期間，應包括自益信託期間。","u":"臺北市稅捐稽徵處財產稅科","h":30904,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=68BA203ED718D33C","d":"2008-06-23","sid":"68BA203E"},{"q":"債權人本人申請查調債務人全國財產、所得資料應檢附之證明文件？","a":"1.身分證明文件：\n(1)個人：身分證正、影本。\n(2)營利事業組織：中央或地方政府核發之核准函，及設立或變更登記表或公司登記事項證明書(得以加註具結之影本代替正本)。\n(3)其他組織：主管機關核准成立之證照(得以加註具結之影本代替正本)。\n2.司法機關之執行名義正、影本(下列證明文件具備1項即可)：\n(1)依強制執行法第4條第1項規定之執行名義(第5款除外)：\n①確定之終局判決(應再檢附判決確定證明書；或文末載有「本判決不得上訴」之判決；經法院裁定認可之大陸地區民事確定給付判決)。\n②假扣押、假處分、假執行之裁判及其他依民事訴訟法得為強制執行之裁判，債權人應於收受假扣押、假處分裁定書30日內申請。\n③依民事訴訟法成立之和解或調解。\n④依公證法規定得為強制執行之公證書。\n⑤其他依法律上之規定得為強制執行名義者：\nA.本票准予強制執行之裁定。\nB.確定之支付命令(需附確定證明書)。\nC.經法院核定之民事調解。\nD.仲裁人之判斷。\nE.確定訴訟費用額之裁定暨裁定確定證明書。\nF.刑事判決有關罰金、罰鍰、没收、没入及追繳之裁判得據以執行者。\n(2)合於上列各項執行名義所發給之債權憑證。\n(3)財政部有關函釋規定。\n3.債權人查調債務人課稅資料申請書(簽名或蓋章)。\n4.授權代理人或委任受任人，除上項1、2、3項證件外應加附：\n(1)代理人或受任人之身分證正、影本。\n(2)授權書或委任書。\n(3)上述證明文件正本查驗即還，影本應具結「本影本與正本相符，如有不實願負法律責任」備查。\n5.債權人查調債務人財產資料，按債務人每人各收費250元；債權人查調債務人所得資料，按債務人每人每一年度各收費250元。","u":"臺北市稅捐稽徵處稅務管理科","h":29758,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6BF716D9A57D4A18","d":"2014-11-19","sid":"6BF716D9"},{"q":"現行統一發票兌獎措施為何？","a":"(一)實體通路兌獎據點為第一銀行、彰化銀行、全國農業金庫、農(漁)會信用部、信用合作社、四大超商(7-11、全家、萊爾富、OK)、全聯及美廉社；郵局自107年12月29日起不再提供兌獎服務。\n(二) 24 小時統一發票兌獎 APP，提供即時兌領雲端發票及電子發票證明聯五、六獎中獎獎金服務。\n(三)統一發票兌獎作業24小時客服專線：4128282（手機請加02）。\n(四)「領獎收據」填寫內容簡化為中獎金額、中獎人及聯絡電話。","u":"臺北市稅捐稽徵處企劃服務科","h":25690,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A6E11CC5EBCD1B4D","d":"2019-02-21","sid":"A6E11CC5"},{"q":"地價稅按自用住宅用地優惠稅率課稅有那些條件？如何申請？","a":"(一)按自用住宅用地稅率課徵地價稅之條件如下：1.地上房屋為土地所有權人或其配偶、直系親屬所有。2.土地所有權人或其配偶、直系親屬在該地辦好戶籍登記。3.無出租或供營業用之情形。4.土地所有權人與其配偶及未成年之受扶養親屬以１處為限。(自112年1月1日起，滿18歲成年) 5. 如土地所有權人、配偶或未成年之受扶養親屬，另有土地供其他已成年之直系親屬設籍居住，則無一處限制。6.都市土地面積以300平方公尺(約90.75坪)為限，非都市土地面積以700平方公尺(約211.75坪)為限。 (二)應備證件：申請書、戶口名簿影本、建物所有權狀影本(申請書上已填註建號及納稅義務人本人、配偶、未成年子女之戶籍資料者免附) (三)申請期限：當年9月22日以前。逾期申請者，自次年起適用。 (四)申請方式：郵寄申辦、親自申辦(本處及所屬各分處)、傳真申辦、委託申辦、超商申請、網路申辦。","u":"臺北市稅捐稽徵處財產稅科","h":25186,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=74C04CB187FDD76F","d":"2008-06-23","sid":"74C04CB1"},{"q":"房子給本人（配偶）的父母或是兄弟姐妹住，都可以申請自用住宅用地稅率課徵地價稅？","a":"依土地稅法規定，申請按自用住宅用地稅率課徵地價稅者，須土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且房屋無出租或供營業使用情事。房子若給本人（配偶）的父母居住並設立戶籍，可以申請按自用住宅用地稅率課徵地價稅．若供兄弟姐妹居住並設立戶籍，則不可以按自用住宅用地稅率課徵地價稅。","u":"臺北市稅捐稽徵處財產稅科","h":25079,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A114602D92B3CA1D","d":"2008-06-23","sid":"A114602D"},{"q":"如何繳納已逾期之使用牌照稅？","a":"自112年11月1日起，使用牌照稅逾期應加徵滯納金案件，除可至代收稅款金融機構繳納外，於繳納期間屆滿之翌日起30日內，可透過財政部網路繳稅服務網（https://paytax.nat.gov.tw/），以信用卡、晶片金融卡、活期（儲蓄）存款帳戶繳納。但歸戶案件及加計利息分期繳納稅捐案件不適用。","u":"臺北市稅捐稽徵處機會稅科","h":20990,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1DDEE1ABB92C627D","d":"2009-05-14","sid":"1DDEE1AB"},{"q":"車輛所有人搬家，應如何申請變更使用牌照稅繳款書寄送地址？","a":"(一)可利用本處定期開徵寄發使用牌照稅繳款書所附之申請變更通訊地址資料，填妥後寄回本處，本處將自次期起寄送至新通訊地址。\n(二)以電話、傳真方式向本處所屬分處申請變更。相關聯絡資訊請至本處網站首頁/本處介紹/聯絡資訊/服務地址、電話及聯絡信箱一覽表項下參閱。\n(三)可至本處網站首頁/納稅資訊/申辦與書表下載/使用牌照稅/申請更正使用牌照稅繳款書身分證統一編號、送達地址項下辦理線上申請。","u":"臺北市稅捐稽徵處機會稅科","h":19182,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=07A6C784C81A1D6F","d":"2021-04-14","sid":"07A6C784"},{"q":"如何申請地方稅無違章欠稅證明?","a":"(一) 本人申請者應填寫申請書，個人檢附本人身分證，營利事業組織檢附中央或地方政府核發之核准函及設立或變更登記表或公司登記事項證明書。（臨櫃申辦，查驗正本即還；郵寄申辦，檢附國民身分證影本；網路申辦限用自然人憑證或工商憑證驗證；稅務視訊服務雲申辦，於螢幕前出示身分證正本及填寫申請書並簽名，若畫面不清楚則需拍照上傳。）\n(二) 如委託他人辦理，應另檢附委託書、受託人身分證等文件，上述文件如為影本，應具結「本影本與正本相符，如有不實願負法律責任」，並簽名或蓋章，就近向本處及所屬分處申請。","u":"臺北市稅捐稽徵處稅務管理科","h":17564,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E9D51ABBE83B7690","d":"2013-10-03","sid":"E9D51ABB"},{"q":"汽機車牌照稅可否分期繳納？","a":"一、稅捐稽徵法第26條規定，納稅義務人因天災、事變、不可抗力之事由或為經濟弱勢者，不能於法定期間內繳清稅捐者，得於規定納稅期間內，向稅捐稽徵機關申請延期或分期繳納，其延期或分期繳納之期間，不得逾三年。 (上開經濟弱勢者係納稅義務人為低收入戶者)\n二、稅款如未能依限繳納，經稅捐稽徵機關移送強制執行後，納稅義務人可依行政執行事件核准分期繳納執行金額實施要點之規定，向執行機關(法務部行政執行署所屬分署)申請分期繳納。","u":"臺北市稅捐稽徵處機會稅科","h":17016,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CCE781C56E262EE9","d":"2015-08-24","sid":"CCE781C5"},{"q":"支票上之平行線或禁止背書轉讓註記可否取消？","a":"可以，但金額須未達50萬元者，且以註銷其中1項為限，檢附支票正本、身分證明文件及申請書至總處或就近至原申請退稅分處辦理更正；若委託他人辦理應附委託書及受託人身分證。","u":"臺北市稅捐稽徵處稅務管理科","h":16581,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1AEFC36D554F7BC6","d":"2014-10-31","sid":"1AEFC36D"},{"q":"都市更新地方稅的優惠為何？","a":"稅目\n房屋稅、地價稅\n契稅、土地增值稅\n現行\n規定\n更新期間-\n土地無法使用者，免徵地價稅；仍可繼續使用者，減半徵收。房屋興建中，無需課徵房屋稅。\n更新後-\n地價稅及房屋稅減半徵收2年。更新前合法建築物所有權人取得更新後建築物，於房屋稅減半徵收2年期間內未移轉，延長其房屋稅減半徵收期間至喪失所有權止，但以10年為限。(延長減半徵收實施期限至118年1月31日)\n更新單元內之土地及建築物，原所有權人與實施者間因協議合建辦理產權移轉時，\n減徵土地增值稅及契稅40%。(實施期限至118年1月31日)\n地主依權利變換取得之土地及建築物，於更新後第1次移轉時，減徵土地增值稅及契稅40%。\n實施權利變換，地主以土地及建築物抵付權利變換負擔者，免徵土地增值稅及契稅。\n地主不願參加權利變換而領取現金補償者，減徵土地增值稅40%。\n實施權利變換應分配之土地未達最小分配面積單元，地主改領現金者，免徵土地增值稅。\n因協議不成或土地所有權人不願或不能參與分配，由實施者分配予合法建築物所有權人、地上權人、永佃權人或耕地三七五租約承租人之土地，視為土地所有權人獲配土地後無償移轉，其土地增值稅減徵40%並准予記存，於權利變換後再移轉時一併繳納。","u":"臺北市稅捐稽徵處財產稅科","h":14894,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DBE66D77920614D5","d":"2022-02-07","sid":"DBE66D77"},{"q":"沒錢繳稅是不是可以辦理分期或延期繳納稅款？","a":"（一）依據稅捐稽徵法第26條及納稅義務人申請延期或分期繳納稅捐辦法規定，納稅義務人因天災、事變、不可抗力之事由或為經濟弱勢者，不能於法定期間內繳清稅捐者，可以於規定納稅期間內，向稅捐稽徵機關申請延期或分期繳納。\n（二）依臺北市地價稅延期分期繳納辦法，納稅義務人(限自然人)應納地價稅額較前一次公告地價調整增加新臺幣1萬5,000元以上，可於每年地價稅繳納期限11月30日屆滿前，向本處各分處提出申請延期或分期繳納，但納稅義務人上1年度所得稅稅率適用最高級距則不能適用。\n（三）依據稅捐稽徵法第26條之1及納稅義務人申請加計利息分期繳納稅捐辦法規定，經稅捐稽徵機關查獲應補徵鉅額稅捐，個人在新臺幣100萬元以上，營利事業在新臺幣200萬元以上者可申請加計利息分期繳納。\n（四）符合臺北市分期繳納地方稅申請辦法，於應繳稅款之繳納期間屆滿日前1年內，因客觀事實發生財務困難，或補徵應繳稅款單筆或合計達新臺幣10萬元以上，無法如期繳清之使用牌照稅、房屋稅、地價稅及印花稅，可以申請分期繳納。\n（五）如欠稅已移送法務部行政執行署執行者，依行政執行法施行細則第27條規定，應向所轄行政執行分署申請分期繳納。","u":"臺北市稅捐稽徵處稅務管理科","h":13313,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DE7EC621F49426FC","d":"2015-02-17","sid":"DE7EC621"},{"q":"印花稅的繳納方式有幾種？","a":"印花稅的繳納方式有三種：\n1. 彙總繳納\n報經稽徵機關核准後，得以每 2 個月為 1 期，按期彙總繳納及申報，亦可申請網路申報。\n2. 開立繳款書\n申請人 可 自行至「地方稅網路申報作業」網站開立印花稅繳款書， 並使用晶片金融卡 、 信用卡 、 活期（儲蓄 ） 存款帳戶電子繳款方式繳納印花稅 ， 或 列印「印花稅應納稅額繳款書」 ， 再持向代收稅款之金融機構繳納，稅額 3 萬元以下案件可至便利商店繳納； 亦可到 稽徵機關開立印花稅繳款書。\n3. 購買印花稅票\n到郵局購買印花稅票貼用並銷花， 始完成繳納 。","u":"臺北市稅捐稽徵處機會稅科","h":12511,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B1DF891C5DF143D","d":"2008-06-23","sid":"5B1DF891"},{"q":"公告地價多久調整一次？","a":"平均地權條例第14條規定，公告地價調整頻率為每2年調整1次，本市已於113年及115年重新規定地價。","u":"臺北市稅捐稽徵處財產稅科","h":12412,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0209E264C7A61BCC","d":"2008-06-23","sid":"0209E264"},{"q":"退稅支票受款人已死亡，應如何辦理更正支票抬頭？","a":"退稅支票受款人已死亡，應由繼承人檢附被繼承人除戶資料或死亡證明書、繼承系統表、同意書、申請書、支票正本及申請人身分證明文件；若金額在20萬元以上者，另加附遺產稅繳清或免稅證明書等向所轄分處申請更正，經審核認定後，即辦理更正支票抬頭。","u":"臺北市稅捐稽徵處稅務管理科","h":11387,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A32347472941BD83","d":"2014-10-31","sid":"A3234747"},{"q":"什麼情況下，可以申請印花稅退稅？","a":"1.應納印花稅金額計算錯誤或適用法令錯誤，而溢繳印花稅。 2.重複繳納印花稅。 3.實作實算之承攬合約，其預繳納金額超過實際金額，而有溢繳印花稅時。 上述退稅，應自繳納之日起十年內提出具體證明，申請退稅。","u":"臺北市稅捐稽徵處機會稅科","h":11257,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5D334233CD9CA8FA","d":"2008-06-23","sid":"5D334233"},{"q":"印花稅數額不足一元的部分，要四捨五入計算嗎？","a":"全部捨去。","u":"臺北市稅捐稽徵處機會稅科","h":10307,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BEB4CAF2523726FE","d":"2008-06-23","sid":"BEB4CAF2"},{"q":"請問土地增值稅一生一屋自用住宅用地稅率適用條件為何？","a":"土地所有權人曾使用過土地增值稅一生一次自用住宅用地稅率後，再出售自用住宅用地符合下列規定時，可再適用土地增值稅一生一屋自用住宅用地稅率。\n一 、出售都市土地面積未超過150平方公尺部分或非都市土地面積未超過350平方公尺部分。\n二 、出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋。(自112年1月1日起，滿18歲成年)\n三 、出售前持有該土地6年以上。\n四 、土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿6年。\n五 、出售前5年內，無供營業使用或出租。\n註 ：出售前5年內未曾供營業或出租使用，應以下列基準日往前推算5年之期間計算：\n1. 出售土地於訂約之日起算30日內申報移轉者，以訂約日為準；逾30日始申報者，以申報日為準。\n2. 法院拍賣之土地，以法院拍定日為準。\n3. 法院判決移轉之土地，以向法院起訴日為準。\n4. 拆除改建中出售之土地，以核准拆除日為準。但提示實際拆除日期之證明文件者，可以實際拆除日為準。\n5. 自益信託塗銷登記，回復原所有權人後移轉者，其往前推算之期間，應包括自益信託期間。","u":"臺北市稅捐稽徵處財產稅科","h":10203,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6DADF0D21B4E736A","d":"2010-01-06","sid":"6DADF0D2"}]},{"org":"衛生局","total":458,"items":[{"q":"可以向衛生局檢舉哪些案件？如何檢舉？檢舉時的注意事項？可獲取檢舉獎金嗎？","a":"一、臺北市政府衛生局訂有「臺北市檢舉違反衛生管理法規案件獎勵辦法」，市民可直接於 衛生局網站 頁面上方之「陳情系統」檢舉。\n二、匿名或不以真實姓名檢舉或檢舉而無具體事證者，不予受理；通知補繳檢舉資料，未於通知函到達7日內補齊者，視為放棄。\n三、檢舉案如屬醫政、藥政、護政、藥品、醫療器材、醫療、食品、營養、化粧品、菸害防制等違反衛生法規案件，倘符合發放檢舉獎金要件，將依規定發予獎金。\n四、違規檢舉經衛生局行政調查處分確定，受處分人未提訴願，並完成罰緩繳交後，依規定可獲得處分金額實收數一定比例的檢舉獎金。詳細檢舉違反衛生案件獎勵辦法請至【本府法務局網站「 臺北市法規查詢系統 」>法規查詢>「臺北市檢舉違反衛生管理法規案件獎勵辦法」】詳閱。\n五、有下列情形之一者，不予發放檢舉獎金：\n(一)檢舉人為衛生局所屬人員及其配偶、前配偶、四親等內之血親或三親等內之姻親。\n(二)匿名或姓名不實。\n(三)無具體事證。\n(四)檢舉前，有關機關已發覺違反衛生管理法規之案件。\n(五)檢舉違反衛生管理法規之內容，係網際網路、資訊軟體之廣告、購物型錄。\n(六)檢舉第5條第1項以外之違反菸害防制法案件。\n(七)違反前條規定，經衛生局限期補正，屆期未補正。\n(八)其他經衛生局公告之事項。\n六、依規定核發之獎金，經通知檢舉人前來領取，逾3個月未領取者，視為放棄。","u":"臺北市政府衛生局食品藥物管理科","h":458056,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=79DFEF25192A39D4","d":"2020-01-01","sid":"79DFEF25"},{"q":"我有接種過COVID-19疫苗，哪裡可以查到紀錄？","a":"因「COVID-19疫苗接種紀錄卡」(小黃卡)已於113年10月1日起停止使用，民眾如查詢接種紀錄可在施打數天後於健保快易通APP健康存摺查詢。另如有開立預防接種紀錄之需求，可至十二區健康服務中心開立。","u":"臺北市政府衛生局疾病管制科","h":172572,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3D935449E87A92BE","d":"2026-07-02","sid":"3D935449"},{"q":"餐飲從業人員健康檢查項目？有無指定醫院及費用？","a":"一、食品從業人員的健康檢查除一般體檢外，尚應包括Ａ型肝炎抗體檢驗，手部皮膚病、出疹、膿瘡、外傷、傷寒或其他可能造成食品污染之疾病，其中，傷寒項目應採用糞便檢驗作為診斷，另A型肝炎之檢查，建議檢驗IgM及IgG二項，或至少檢驗一項，倘IgM測定結果為陰性者，表示未處發病期間；IgG測定結果為陽性者，代表已具有抗體，食品從業人員可從事食品接觸之工作。是以，如食品從業人員擇一項檢驗IgG，測定結果為陰性者，代表不具A型肝炎免疫力，應再檢驗IgM以確認是否可從事與食品接觸工作。\n二、健康檢查並未指定醫院，於臺北市立聯合醫院各院區或其他公私立醫療院所均可辦理，費用需自行負擔或由僱主負擔。","u":"臺北市政府衛生局食品藥物管理科","h":151639,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=836146E64404B6D7","d":"2020-01-01","sid":"836146E6"},{"q":"接種完COVID-19疫苗後，多久會有保護力？","a":"疫苗接種後一般約2週後開始產生保護力。","u":"臺北市政府衛生局疾病管制科","h":144008,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=525AA05E1DF0C19E","d":"2026-07-02","sid":"525AA05E"},{"q":"販賣口罩、矯正鏡片、隱形眼鏡專用保存盒需要申請證照？","a":"一、口罩分為醫療用及非醫療用，販賣非醫療用的口罩應符合商業登記相關規定；販賣醫療用的口罩應事先申請醫療器材商許可執照，繳費領照後方准營業。\n二、醫療用的口罩屬須辦理查驗登記之醫療器材，取得醫療器材許可證，始得上市。非醫療用的口罩，不可宣稱醫療用途。\n三、矯正鏡片(例如：近視、遠視、老花鏡片)自100年1月1日起列屬醫療器材管理，產品須領有醫療器材許可證，販賣矯正鏡片須領有醫療器材商許可執照。\n四、隱形眼鏡保存盒係用於保存隱形眼鏡之用，列屬醫療器材管理，產品須領有醫療器材許可證，販賣隱形眼鏡保存盒須領有醫療器材商許可執照。","u":"臺北市政府衛生局食品藥物管理科","h":66927,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E4487F65EAF8E58E","d":"2020-01-01","sid":"E4487F65"},{"q":"您知道「口罩」也是醫療器材嗎?醫用口罩規範為何？如何分辨醫療器材許可證字號？發現不良品或有不良反應時？","a":"1.選購醫用口罩時，要認明醫療器材許可證字號，若需查證醫療器材許可證字號，可至食藥署醫療器材許可證資料庫查詢(網址:https://lmspiq.fda.gov.tw/web/)。\n2.販售醫用口罩等醫療器材，須領有醫療器材商許可執照者，始得販售，一般民眾不可販售醫材。\n3.醫療器材許可證字號樣式：\n衛部（署）醫器製字第000000號\n衛部（署）醫器製壹字第000000號\n衛部（署）醫器輸字第000000號\n衛部（署）醫器陸輸字第000000號\n衛部（署）醫器輸壹字第000000號\n衛部（署）醫器陸輸壹字第000000號\n4.有發現不良品或有不良反應時，可至衛生福利部食品藥物管理署「藥品醫療器材食品化粧品上市後品質管理系統」(http://qms.fda.gov.tw/tcbw/index.jsp)進行不良醫療器材通報。","u":"臺北市政府衛生局食品藥物管理科","h":63612,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE62C3A0B84CF8FA","d":"2020-02-18","sid":"AE62C3A0"},{"q":"我需要服用口服抗病毒藥物，如何取得？","a":"為便利民眾領藥，本市已配撥COVID-19口服抗病毒藥物 Paxlovid至醫院、診所及藥局，醫師針對新冠檢驗陽性（家用/醫用快篩或PCR皆可）且為65歲以上或有重症風險因子者，經醫師評估治療效益與風險，充分告知病人後，即可憑處方箋在醫院、診所或指定藥局領藥，院所資訊可至「臺北市COVID-19口服抗病毒藥物合約機構名單」（ https://reurl.cc/ZWQEWM ）查詢。","u":"臺北市政府衛生局疾病管制科","h":53902,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F7D69F0A472D9E0C","d":"2022-11-10","sid":"F7D69F0A"},{"q":"若食品中有異物以及食品不衛生，該如何檢舉？應備哪些文件？","a":"一、為保障市民的消費權益及健康，如發現賣場等場所販售違規食品（如：食品中有異物、食品不衛生、標示違規或過期）您可：\n(一)打電話與本府衛生局聯絡（消費者服務專線：02-27208777或1999（外縣巿02-27208889)轉7105、7108、7076)。\n(二)請您提供詳細的購買資料，含：\n1.購買地點：商號、地址、該商品的陳列位置、商品名稱、有效日期、批號、購買憑證如統一發票等或相關照片。\n2.如發現產品有異物狀況，也請您具體描述並附上食品清楚照片，以便能及時掌握違規事證。\n二、如遇違規食品販售於本市商家，但食品之國內負責廠商或製造廠商地址非屬本市時，本局仍可協助函移案件至該廠商所轄衛生局辦理，惟因移轉公文時效較長，為加速行政作業流程，建請您逕向所轄管衛生局反映。","u":"臺北市政府衛生局食品藥物管理科","h":44972,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9059478B8E342C11","d":"2020-01-01","sid":"9059478B"},{"q":"申請藥商、醫療器材商、藥局許可執照應準備何種文件資料？","a":"民眾可透過連接「 台北服務通 」網站，利用關鍵字「販賣業藥商、醫療器材商籌設」、「販賣業藥商、醫療器材商、藥局設立及補換發登記」、「販賣業藥商、醫療器材商、藥局變更登記」、「販賣業藥商、醫療器材商、藥局停歇業登記」、「販賣業藥商、醫療器材商、藥局復業登記」快速查找要申辦的案件服務，應備證件、申請方式及表單下載。","u":"臺北市政府衛生局食品藥物管理科","h":41524,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BB93C03AE6BFF54A","d":"2020-01-01","sid":"BB93C03A"},{"q":"施打人類乳突病毒(HPV)疫苗後會有什麼副作用嗎?","a":"常見的副作用有注射部位的反應（疼痛、發紅、腫脹）、疲倦、頭痛、肌痛、發燒、胃腸道症狀（包括噁心、嘔吐、腹瀉及腹痛）、發癢/搔癢、皮疹、蕁麻疹、及關節痛。提醒您接種後如果出現不適症狀時，請儘速就醫詢問醫師專業意見。","u":"臺北市政府衛生局健康管理科","h":31327,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD98754046C9C736","d":"2021-11-15","sid":"CD987540"},{"q":"違規檢舉獎金，檢舉時要注意事項？可獲取多少檢舉獎金？","a":"有關民眾檢舉違反食品衛生案件獎勵辦法，依據臺北市檢舉違反衛生管理法規案件獎勵辦法（105年6月27日修正公布）檢舉人應以書面、言詞、電子郵件或其他方式記載：\n一、檢舉人之姓名、出生年月日、身分證統一編號及住址。檢舉人為法人者，其法人名稱、地址及其代表人姓名、地址、聯絡電話。\n二、領取檢舉獎金之意旨。\n三、違規廣告應檢附下列事項：\n〈一〉平面媒體（報章雜誌）廣告應檢附刊登之整版版面（報紙）、封面及廣告頁面（雜誌）。\n〈二〉電視廣告應檢附宣播違規廣告之錄影帶或光碟，並詳述宣播時間及媒體（包含有線電視系統名稱、頻道及電視臺名稱）。\n〈三〉廣播電臺廣告應檢附宣播違規廣告之錄音帶或光碟，並詳述宣播時間、廣播電臺名稱及頻率。\n〈四〉宣傳手冊或單張應檢附該手冊或單張，並詳述發放地點之地址及時間。\n四、涉嫌違反衛生管理法規之違法者姓名、場所名稱、產品名稱、廣告內容、地址、負責人姓名、時間及違法情節。但負責人姓名不明者，得免記載。\n五、匿名或不以真實姓名檢舉或檢舉而無具體事證者，不予受理。\n六、因檢舉而查獲違反本法規定者，依查獲案件所處罰鍰實收數一定比例核發獎金予檢舉人，予以獎勵。詳細檢舉違反衛生案件獎勵辦法請至【本府法務局網站「臺北市法規查詢系統」＞法規查詢＞「臺北市檢舉違反衛生管理法規案件獎勵辦法」】詳閱。","u":"臺北市政府衛生局食品藥物管理科","h":30673,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7CAD1E871B0EBB05","d":"2020-01-01","sid":"7CAD1E87"},{"q":"是不是要自殺才能打安心專線？","a":"不是，只要您有生活上或情緒上的困擾，均可撥打衛生福利部安心專線，以手機或市話直撥1925 (依舊愛我)，24小時免付費且全年無休，將由專人接聽，並提供適切的諮詢或轉介服務。\n本市市民亦可撥打本市自殺防治諮詢專線1999轉8858，將由專人提供自殺防治諮詢及適切協助。","u":"臺北市政府衛生局心理衛生科","h":29099,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C403096EBF48F37C","d":"2019-11-12","sid":"C403096E"},{"q":"第二類及外國技術人力「定期健康檢查」項目為何？","a":"第二類及外國技術人力定期健康檢查應包括：胸部X光肺結核檢查、漢生病檢查、腸內寄生蟲糞便檢查、身體檢查。 （外國技術人力來自中央衛生主管機關公告之特定國家、地區者，得免辦理漢生病檢查及腸內寄生蟲糞便檢查。）","u":"臺北市政府衛生局疾病管制科","h":28987,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=90B690A7D0DBAEA0","d":"2026-04-22","sid":"90B690A7"},{"q":"兒童牙齒塗氟的補助對象、方式及醫療院所?","a":"衛生福利部口腔健康司提供兒童牙齒塗氟預防保健服務，未滿6歲之學齡前兒童，每半年補助1次；未滿12歲之低收入戶、身心障礙、設籍原住民族 地區、偏遠及離島地區兒童，每3個月補助1次。\n家長可自行帶兒童持 兒童健康手冊 至全民健康保險特約醫療機構接受塗氟服務，或透過兒童牙齒塗氟保健社區巡迴服務，由牙醫師進入幼兒園協助兒童牙齒塗氟。","u":"臺北市政府衛生局健康管理科","h":28742,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=380B33EF33957A60","d":"2024-01-02","sid":"380B33EF"},{"q":"診所病歷要保存多久？","a":"（1）係依醫療法第70條規定：醫療機構之病歷，應指定適當場所及人員保管，並至少保存七年。但未成年者之病歷，至少應保存至其成年後七年；人體試驗之病歷，應永久保存。\n（2）醫療機構因故未能繼續開業，其病歷應交由承接者依規定保存；無承接者至少應繼續保存六個月以上，始得銷燬。\n（3）醫療機構對於逾保存期限得銷燬之病歷，其銷燬方式應確保病歷內容無洩漏之虞。","u":"臺北市政府衛生局醫事管理科","h":27422,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=195EA7D9EE8F3678","d":"2008-11-28","sid":"195EA7D9"},{"q":"哺（集）乳室之英文名稱為何？","a":"國外文獻資料對哺集乳室之英文名稱不一，有Breastfeeding Room、Nursery Room及Pumping Room等，考量Nursery Room之使用對象較廣，可能含括瓶餵及托兒，Pumping Room似侷限僅使用集乳器之婦女，故衛生福利部國民健康署建議哺（集）乳室英文名稱為「Breastfeeding Room」。","u":"臺北市政府衛生局健康管理科","h":25368,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EED5C6948E9DF7C3","d":"2021-06-07","sid":"EED5C694"},{"q":"請問衛生局製作「好孕胸章」之目的、索取對象及單位為何?","a":"一、製作目的：「好孕胸章」讓懷孕婦女朋友在搭乘大眾運輸工具時佩戴，提醒民眾能主動讓座。\n二、索取對象：提供本市懷孕初期婦女或有需要者佩戴使用。\n三、索取單位：本市57家產檢醫療院所婦產科門診隨發放孕婦手冊時主動提供，另可在衛生局、12區健康服務中心及41處捷運站（象山、大安、東門、中正紀念堂、台大醫院、台北車站、中山、雙連、民權西路、士林、石牌、竹圍、淡水、頂埔、亞東醫院、板橋、新埔、西門、忠孝新生、忠孝復興、市政府、南港展覽館、新店、七張、大坪林、台電大樓、古亭、北門、松江南京、南京復興、台北小巨蛋、松山、南勢角、景安、三重、頭前庄、迴龍、蘆洲、動物園、萬芳醫院、西湖）索取。\n四、索取單位可查詢衛生局網站(http://health.gov.taipei/主題專區/婦幼優生)","u":"臺北市政府衛生局健康管理科","h":25042,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5F6DFC00A8690EC7","d":"2022-07-20","sid":"5F6DFC00"},{"q":"請問老人健康檢查的項目有哪些？","a":"各套檢查（附早餐），項目包含：衛生福利部國民健康署補助之「成人預防保健服務」及「婦女子宮頸抹片檢查」，及健康史、身體評估及糞便潛血免疫分析 、檢查結果之保健諮詢及異常轉介、憂鬱症篩檢及認知功能評估 。\nA、B、C套方案檢查項目如下：\n（1）A套老人健康檢查項目：胸部X光、甲狀腺刺激素、維他命B12、葉酸 、鈉、鉀、鈣、血液常規檢查、尿液常規檢查。\n（2）B套老人健康檢查項目：腹部超音波、糖化血色素、白蛋白、球蛋白、尿液常規檢查。\n（3）C套老人健康檢查項目：DXA骨密度檢查(髖骨或腰椎)、肌少症篩檢(小腿圍)、肌少症體能表現評估或握力、鹼性磷酸酶(ALK-P)、尿素氮、鈣、血液常規檢查、白蛋白、球蛋白、尿液常規檢查。\n【113年度起老人健檢已取消B套餐腹部超音波需隔一年方可施作規定】","u":"臺北市政府衛生局健康管理科","h":24702,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2088CB89D54E858A","d":"2023-01-01","sid":"2088CB89"},{"q":"可以到臺北市哪些醫院接受肺癌篩檢-低劑量電腦斷層掃描(LDCT)檢查？","a":"1.民眾可向國泰醫療財團法人國泰綜合醫院、臺北市立萬芳醫院-委託臺北醫學大學辦理、醫療財團法人辜公亮基金會和信治癌中心醫院、中心診所醫療財團法人中心綜合醫院、博仁綜合醫院、臺北市立聯合醫院中興院區、臺北市立聯合醫院陽明院區、臺北市立聯合醫院仁愛院區、臺北市立聯合醫院忠孝院區、臺北市立聯合醫院和平婦幼院區、臺北榮民總醫院、三軍總醫院附設民眾診療服務處、新光醫療財團法人新光吳火獅紀念醫院、中國醫藥大學附設醫院臺北分院、臺北市立關渡醫院-委託臺北榮民總醫院經營、基督復臨安息日會醫療財團法人臺安醫院、臺北醫學大學附設醫院、國立臺灣大學醫學院附設醫院癌醫中心分院、中山醫療社團法人中山醫院、康寧醫療財團法人康寧醫院、振興醫療財團法人振興醫院、台灣基督長老教會馬偕醫療財團法人馬偕紀念醫院、西園醫療社團法人西園醫院、國立臺灣大學醫學院附設醫院、長庚醫療財團法人台北長庚紀念醫院、宏恩醫療財團法人宏恩綜合醫院、三軍總醫院松山分院附設民眾診療服務處、景美醫院等，以電話登記並經醫院資格審查後接受篩檢服務。\n2.最新辦理醫院及諮詢窗口可至以下網站查詢：https://reurl.cc/vdrDNy","u":"臺北市政府衛生局健康管理科","h":23098,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=891E031D0361FB67","d":"2022-07-20","sid":"891E031D"},{"q":"懷疑購買的中藥是否摻西藥要如何申請化驗？是否需繳費？","a":"一、本府衛生局受理免費檢驗之中藥製劑為：藥品是購自本市所轄合法中醫醫院(倘購自本轄中醫診所請逕洽本局檢驗科檢驗費用)；如為外縣市則將依權責函送當地縣市衛生局處理。\n二、受理檢驗之中藥製劑，包含：錠劑、丸劑、膠囊、散劑、顆粒劑等劑型，惟不包括水劑、液劑、中藥藥材或飲片。\n三、申請者需負舉證責任，申請人需攜帶：\n（一）國民身分證正本及正、反面影本1份（正本驗畢後發還）。\n（二）藥品來源證明文件（如掛號單、藥袋、說明書、收據或統一發 票、購買憑證等）。\n（三）足量之送驗藥品 1.錠、丸劑、膠囊劑型：40粒以上 ；2.散劑、顆粒劑或單一包裝服用量： 重量25公克以上。\n（四）攜至本府衛生局食品藥物管理科填寫申請書及切結書各1份 。產品檢驗地點為衛生局檢驗科(台北市北投區石牌路二段111號)。\n四、不需要繳費（本市合法中醫醫院），但須填購入來源切結書(不受理不法來源中藥檢驗)。","u":"臺北市政府衛生局食品藥物管理科","h":21374,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4DEA551E0C590721","d":"2020-01-01","sid":"4DEA551E"},{"q":"請問要接受社區心理諮商門診服務要如何掛號？","a":"一、社區心理諮商門診於12行政區的臺北市立聯合醫院附設院外門診部及本局社區心衛中心等13處，每週共提供36診次，由心理師提供1對1諮商服務，每次30分鐘，採取預約排診為主，您可依方便性就近預約使用，進一步門診及掛號的資訊可上心理衛生中心網站https://mental-health.gov.taipei/「門診表-社區心理諮商服務門診表」查詢，或逕至臺北市立聯合醫院網站(https://webreg.tpech.gov.tw/)之「院外門診部」掛號。\n二、各區門診部電話與地址如下：\n1.信義區門診部 8780-4152#2 大道路116號1樓\n2.文山區政大門診部 8237-7441或8237-7444 指南路2段117號\n3.中正區門診部 2321-0168(週二) 牯嶺街24號\n4.中山區門診部 2501-3363 松江路367號\n5.大安區門診部 2739-0997 辛亥路三段15號\n6.松山區門診部 2765-3147 八德路四段692號\n7.南港區門診部 2786-8756 南港路一段360號\n8.大同區門診部 2594-8971 昌吉街52號\n9.內湖區門診部 2790-8387 民權東路六段99號\n10.士林區門診部 2883-6268#14 中正路439號\n11.萬華區門診部 2339-5384 東園街152號\n12.北投區門診部 2891-2670#9 臺北市北投區公館路198號4樓\n13.社區心理衛生中心 3393-6779#10 金山南路一段5號(僅週二/週四下午/晚上)","u":"臺北市政府衛生局心理衛生科","h":19410,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FDE0DB0DD591B620","d":"2019-08-20","sid":"FDE0DB0D"},{"q":"輪狀病毒疫苗疫苗安全嗎？會有什麼副作用？","a":"目前市面核准上市之2種輪狀病毒疫苗皆符合我國衛生福利部食品藥物管理署查驗登記規定，且經我國藥政單位核准使用/進口；接種輪狀病毒疫苗可能造成副作用如下：","u":"臺北市政府衛生局疾病管制科","h":18313,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=029FB492C638D7F0","d":"2026-07-08","sid":"029FB492"},{"q":"護送就醫是什麼？強制住院的流程是什麼?","a":"1.護送就醫不等於強制住院， 精神衛生法規定，發現個案有傷害他人或自己之虞者 ， 應即護送前往就近適當醫療機構就醫。\n2.強制住院是經專科醫師診斷為嚴重病人且有傷害他人或自己之虞者，自己或有傷害之虞，需住院治療，但病人拒絕時， 由兩位醫師進行鑑定，並由衛生福利部精神疾病嚴重病人強制住院審查會，判定是否許可強制住院。","u":"臺北市政府衛生局心理衛生科","h":17943,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7E21EB0499479940","d":"2020-05-11","sid":"7E21EB04"},{"q":"游泳池之水質應符合哪些規定？","a":"1.氫離子指數（pH值）應保持6.5至8間。\n2.餘氯量應保持1.0ppm-3.0ppm間。\n3.總生菌數：池水在攝氏35±1°C培養48±3小時後，其每1公撮（mL）含量，應低於500 CFU。\n4.大腸桿菌群：每100公撮池水之含量，應低於（含）1 CFU或1.1 MPN。\n5.無色、無臭，不得有浮沬、苔藻滋生。\n6.不得有污水或工業廢水流入。\n註：臺北市政府衛生局114年1月2日北市衛疾字第11330456791號公告「臺北市營業衛生管理自治條例」所規範營業場所之有效消毒方法、衛生標示、從業人員健康檢查項目、浴室業（含溫泉浴池）與游泳業之水質微生物指標及送檢單位、浴室業與游泳業之水質酸鹼值及餘氯量」其中大腸桿菌群每100公撮池水之含量，應低於（含）1 CFU或1.1 MPN，並自114年3月1日起生效。","u":"臺北市政府衛生局疾病管制科","h":16727,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9F816E603486BE16","d":"2026-01-02","sid":"9F816E60"},{"q":"什麼是食品中毒？","a":"依美國疾病管制中心所採用之定義：\n二人或二人以上攝取相同之食物而發生相似之症狀，並且自可疑的食餘檢體及患者糞便、嘔吐物、血液等人體檢體，或者其它有關環境檢體（如：空氣、水、土壤）中分離出相同類型之致病原因，則稱為一件「食品中毒」。但如因攝食肉毒桿菌或因攝食食品造成急性食品中毒(如化學物質或天然毒素中毒等)，即使只有一人，也視為一件「食品中毒」。","u":"臺北市政府衛生局食品藥物管理科","h":16491,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=342E489FC718F50E","d":"2020-01-01","sid":"342E489F"}]},{"org":"環境保護局","total":421,"items":[{"q":"家戶巨大垃圾(大型廢棄物)如何收運？","a":"一、依環保局清運家戶巨大垃圾執行要點規定，家戶係指一般家庭及住戶，住家兼營商(事)業行為者與機構、學校、部隊及法人等均不在此列。一般家庭及住戶所產生之體積龐大廢棄家具(彈簧床墊、床組、手推車、腳踏車、 電動腳踏車、微型電動二輪車、電風扇、沙發、桌椅、櫥櫃、廢行李箱3只(含)以上)、家電用品(抽油煙機、瓦斯爐、大型飲水機、電視機、電冰箱、洗衣機、冷氣機、立燈、落地燈)、樹枝及個人自行修繕之非石材類廢棄物(由環保局清潔隊依實際收運數量、 是否為裝修業主修繕以及已預約清運案件數量判斷是否可收運)，於預定排出日期前至少一日來電環保局轄區清潔隊預約收運時間、地點後，由市民於雙方約定時間(考量市容整潔及晚間置放大型廢棄物/大型垃圾對交通影響較小，故各區清潔隊多請市民配合於夜間21時過後排出)將欲收運之大型廢棄物/大型垃圾置放於約定地點，且市民須配合於約定地點確實排出預約清運物品，勿參雜其他未預約物品於其中，俟翌日本局清潔車輛作業時免費清運，本局認定特殊情形者，得適時調整清運排出時間。(本局收運時間為每星期一至星期六，星期日沒有收運)\n二、各區里別清潔隊預約專線請參考下列12行政區大型廢棄物預約表。\n三、除了撥打各區里別清潔隊預約專線之外，民眾也可使用 「臺北市陳情系統」 管道進行大型廢棄物清運預約申請。登入後點選登錄案件/開始登錄案件/垃圾、噪音、汙染及資源回收/大型廢棄物清運（派工）填妥相關資料送出。待轄區清潔隊收到系統派送案件後，會以電話方式連絡申請人確認收運時間及地點，由市民於雙方約定時間(考量市容整潔及晚間置放大型廢棄物/大型垃圾對交通影響較小，故各區清潔隊多請市民配合於夜間21時過後排出)將欲收運之大型廢棄物/大型垃圾置放於約定地點，俟翌日本局清潔車輛作業時免費清運。","u":"臺北市政府環境保護局環境清潔管理科","h":1667695,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=402ACF2A9AD6B8EB","d":"2008-06-23","sid":"402ACF2A"},{"q":"請問專用垃圾袋售價及每包個數？","a":"一、目前本市販售之專用袋共有七種型號，102年2月28日前每公升售價為0.45元，102年3月1日起，每公升售價調降為每公升0.36元。\n二、每包個數及調降前、後之售價如下：\n3公升袋：每包20個，新售價21元(原售價27元)。\n5公升袋：每包20個，新售價36元(原售價45元)。\n14公升袋：每包20個，新售價100元(原售價126元)。\n25公升袋：每包20個，新售價180元(原售價225元)。\n33公升袋：每包20個，新售價237元(原售價297元)。\n76公升袋：每包10個，新售價273元(原售價342元)。\n120公升袋：每包5個，新售價216元(原售價270元)。\n三、另於107年1月1日推出3款環保兩用袋，型號分別為小、中及大型袋，售價分別為1元、2元及5元。","u":"臺北市政府環境保護局資源循環管理科","h":639703,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E38F3CB387CBCE76","d":"2020-07-07","sid":"E38F3CB3"},{"q":"如果有棉被、枕頭需要丟棄時，應如何處理?","a":"「棉被、枕頭」目前非環境部公告回收項目，需請市民朋友以一般廢棄物方式處理，使用專用垃圾袋盛裝後，交予本局垃圾車處理；惟如棉被體積過大無法裝入本市超大型專用垃圾袋（容量120公升），則以大型廢棄物電話預約1999市民當家熱線或直接與轄區清潔隊預約登記時間及地點 ，本局即依約定內容免費前往清運。","u":"臺北市政府環境保護局環境清潔管理科","h":303814,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE4EDDEAF8ED9C28","d":"2017-11-10","sid":"AE4EDDEA"},{"q":"車主如何自動報繳廢棄車輛及申請獎勵金","a":"請車輛所有人將廢棄車體交由合法回收業者進行回收，環境部車體回收與監理站車籍報廢辦理無先後順序，詳細步驟依序說明如下：\n一、辦理車體回收＋車籍報廢：\n（一）車體回收：老舊車輛若不再使用，可循「回收2步驟」回收廢棄車輛：\n第 1 步：您可透過 資源回收網 「車輛回收服務一站通」辦理，或洽環境部資源回收免付費專線「0800-085-717」（您幫我，清一清）查詢合法廢車回收商後約定時間及地點。回收車時，請提供車籍資料（如：行照或監理站車輛異動登記書）、車主身分證供現場核對（如為代理人，請再另外提供車主委託書正本交付回收商及提供代理人的身分證供回收商現場核對）。\n第 2 步：因收車全面e化作業，回收商拖車時會以平板電腦方式給車主簽名並確認資料，管制聯單會以簡訊或e-mail方式提供下載路徑。\n（二）車籍報廢：相關檢附證件及文件如下：\n1.取下(機車1面 / 汽車2面)車牌（車牌若有遺失請附警察機關之車牌失竊證明文件，汽車車牌若遺失一面 ，另一面亦應一併繳回）。\n2.連同車主的身分證正本(或軍人身分證或僑民居留證) 。\n3.印章(個人須簽名) 。\n4.行車執照正本（若辦理報廢非車主本人，則除上述應攜帶文件外，也要攜帶代理人本人之印章、身分證）。\n5.新領牌照登記書（即車籍原始資料，機車報廢登記免附）。\n6. 公司應繳驗公司、行號主管機關核准登記之公文（公司含登記表）或公司、行號主管機關核發之登記證明書，並應提具財稅機關編配之統一編號；其繳驗之證明文件為影本者，另繳驗該公司行號最近一期繳納營業稅證明文件影本。\n二、若僅辦理車體回收，須請車輛所有人自行至附近監理站辦理車籍報廢手續。\n三、申領獎勵金：車輛所有人經完成回收程序並完成車籍報廢後，可向環境部申請回收獎勵金，若交付車體時尚未辦理車籍報廢，請就近至監理站辦妥車籍報廢手續後，方可申領。\n（一）獎勵對象：以車輛出廠年度計算，汽車車齡達10年(含)以上，回收獎勵金1,000元，機車車齡達7年(含)以上，回收獎勵金300元；但所有人為政府機關、公立學校或公營事業者，不得申請。\n（二）申請期限：申請者應自廢機動車輛回收管制聯單所載回收日期","u":"臺北市政府環境保護局環境清潔管理科","h":237823,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D599B328F3A8A233","d":"2012-09-05","sid":"D599B328"},{"q":"市民如於週三、日垃圾停收日或平日來不及等候環保局垃圾車攜出垃圾及回收(廚餘)物，有無其他排出管道可以利用？","a":"環保局於全市12行政區設有限時定點垃圾、資源（廚餘）回收收受點可供民眾利用。各限時收受點位置及其服務時間詳情請至 環保局網站點選 臺北市限時定點垃圾、資源（廚餘）回收收受點/選擇離家較近的收受點，歡迎有需求的民眾多加利用","u":"臺北市政府環境保護局環境清潔管理科","h":232647,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9B8DE0E3981808A1","d":"2008-06-23","sid":"9B8DE0E3"},{"q":"請問廢棄的行李箱、安全帽、雨傘、獎盃(座)及長柄掃具要如何回收？","a":"如果您有3只（含）以上的行李箱需丟棄，可以大型廢棄物約定方式清運。\n2只（含）以下行李箱、安全帽、雨傘、獎盃(座)及長柄掃具可以免用專用垃圾袋，直接交給清潔隊回收。","u":"臺北市政府環境保護局資源循環管理科","h":194636,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E58586B9A3DF8B7A","d":"2017-08-15","sid":"E58586B9"},{"q":"亂丟煙蒂的罰款為多少？","a":"依廢棄物清理法第27條規定，在指定清除地區內嚴禁有隨地吐痰、檳榔汁、渣、拋棄紙屑、煙蒂、口香糖、瓜果或其皮、核、汁、渣或其他一般廢棄物。違反者依同法第50條規定可處新臺幣1,200元至6,000元罰鍰，其中拋棄菸蒂自112年8月15日起加重裁罰金額為3,600元以上6,000元以下罰鍰。","u":"臺北市政府環境保護局環保稽查大隊","h":182755,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1AE90AE5E62E2315","d":"2008-10-08","sid":"1AE90AE5"},{"q":"住家養狗叫聲，可以向哪一單位協助？","a":"1.犬隻吠叫製造之噪音係屬不具持續性或不易量測之聲音，依噪音管制法第6條：「製造不具持續性或不易量測而足以妨害他人生活安寧之聲音，由警察機關依有關法令處理之」。\n2.住家養狗噪音擾鄰係由警察機關依社會秩序維護法第72條第3款「製造噪音或深夜喧嘩，妨害公眾安寧者」之規定處新台幣6,000元以下罰鍰。\n3.另依動物保護法第5條第2項規定，飼主對於其管領之動物應提供妥善之照顧，如犬隻吠叫是因受虐而導致急迫吠叫情形，可以通報臺北市動物保護處（1959動物保護專線）調查處理。","u":"臺北市政府環境保護局空污噪音防制科","h":167197,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C85BDF95FDF2F5C9","d":"2008-12-29","sid":"C85BDF95"},{"q":"如何捐贈舊書給延慧書庫及捐書種類為何？","a":"捐贈舊書給延慧書庫方式： 1.居住於臺北市：\n2.非居住於臺北市：\n3.利用本局設置之29處捐書箱回收舊書，包括本局2個再生家具展示場、北市10個績優里辦公室、雙北市 15處捷運站（因安全及動線考量而適時移動，可到站後洽詢該站服務台）、部分百貨公司。 分布詳情請見環保局網站右側欄位之「延慧書庫」圖示（ 延慧書庫 ）\n捐書種類：\n主要收受之書籍有：(※包含已填寫解答或有註記筆跡等筆記皆可收受)\n不收受之書籍：(仍可以廢紙類交予資源回收車回收)","u":"臺北市政府環境保護局資源循環管理科","h":151566,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B13B344A9B51E125","d":"2016-09-20","sid":"B13B344A"},{"q":"廢日光燈管或廢玻璃容器如何回收？","a":"廢日光燈管或廢玻璃容器如何回收？\n一、廢玻璃容器為立體類的一般類回收物，請於星期二、四、六交由本局夜間清運線上資源回收車回收；日光燈泡（管）為其他類，請於星期一、二、四、五、六交由本局夜間清運線上資源回收車回收。\n二、民眾於攜出資源回收物時，應將日光燈泡（管）置入獨立的袋子或箱子(勿併入其他立體類回收物)；已破碎之廢玻璃容器、日光燈泡（管）應妥善包裝註明警語交付本局，避免回收時受傷。\n三、廢玻璃容器（如盛裝米酒、醬油、醬菜等）及日光燈泡（管），因其特性經碰撞後容易破碎，碎片容易造成割傷，將影響民眾及夜間清運線上資源回收作業人員之安全；日光燈泡（管）因內含微量汞及螢光粉等有害成分，如未妥善回收處理，其有害物質釋放到環境中，將對人體和生物產生間接、慢性傷害，長期甚至影響人體中樞神經系統功能。","u":"臺北市政府環境保護局資源循環管理科","h":141646,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=37625B7E10B981DC","d":"2013-08-12","sid":"37625B7E"},{"q":"附近營建工程噪音擾人安寧？","a":"1.營建工程係以「整體音量」進行管制，不論其噪音源為何，其整體音量不得超過「營建工程噪音管制標準」。\n2.另針對夜間及假日午間施工噪音問題，環保局已公告營建工程於本市各類噪音管制區平日晚上10時至翌日上午8時，及假日中午12時至下午2時、晚上6時至翌日上午8時不得使用動力機械或手持工具從事吊掛、裝載、卸料、搬運、敲擊、鑽孔、鋸切、釘合、打磨或其他施工致妨礙安寧之行為。一旦有妨礙安寧情形，不需量測噪音值即可取締違規行為，並處新臺幣3,000元以上3萬元以下罰鍰同時令其立即改善；如未遵行者，按次處罰。\n3.民眾若要陳情檢舉，可逕自撥打臺北市民當家熱線：1999，環保局將盡速派員前往現場稽查。","u":"臺北市政府環境保護局空污噪音防制科","h":121919,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=99BBC765E0BEC90E","d":"2008-12-29","sid":"99BBC765"},{"q":"無法配合環保局垃圾收運時間之民眾，應如何處理垃圾？","a":"本局考量無法配合垃圾車定點清運時間排出垃圾之民眾，於全市12行政區設有限時定點垃圾、資源（廚餘）回收收受點，大部分服務時間為每日6時至23時。民眾可至環 環保局網站點選 垃圾、資源(廚餘)回收限時收受點，選擇離住家較近的限時收受點排出，惟所投遞之垃圾包同樣需配合使用專用垃圾袋，否則環保局將予告發處罰。","u":"臺北市政府環境保護局環境清潔管理科","h":119806,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7D7997AA6B02FA0D","d":"2013-09-10","sid":"7D7997AA"},{"q":"三更半夜施工太吵怎麼辦？","a":"1.針對夜間營建工程噪音問題，除工地整體音量需符合「營建工程噪音管制標準」外，環保局已公告營建工程於本市各類噪音管制區平日晚上10時至翌日上午8時，及假日中午12時至下午2時、晚上6時至翌日上午8時，不得使用動力機械或手持工具從事吊掛、裝載、卸料、搬運、敲擊、鑽孔、鋸切、釘合、打磨或其他施工致妨礙安寧之行為。一旦有妨礙安寧情形，不需量測噪音值即可取締違規行為，並處新臺幣3,000元以上3萬元以下罰鍰同時令其立即改善；如未遵行者，按次處罰。\n2.另針對部分不受夜間及假日午間時段管制之營建工程，除危及公共安全、環境污染及影響民生用水、用電、用氣或通訊之搶救、搶修工程外，包括基樁（不含撞擊式打樁工程）、連續壁、地下結構物工程(含開挖作業)安全措施組立、巨積混凝土灌築及大型橋樑吊裝等屬連續性或必要工程 ，並經目的事業主管機關核准於夜間施工者；於白天實施特殊管制地區(如博愛特區、特勤道路等)，並經目的事業主管機關核准於夜間施工者；政府辦理國際性或全國性重要活動之營建工程，並經本府專案核准於夜間施工者，施工單位應於施工現場設置噪音防制設施（包含隔音布、消音屋、防振襯墊、隔音罩或其他具有減音功能之設施）及豎立夜間或午間施工告示牌，違反者，視為違反前項規定。\n3.民眾若要陳情檢舉，可逕自撥打臺北市民當家熱線：1999，環保局將盡速派員前往現場稽查。","u":"臺北市政府環境保護局空污噪音防制科","h":108196,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5428B050613907C1","d":"2008-12-29","sid":"5428B050"},{"q":"欲至福德坑環保復育園區體驗滑草該如何辦理及開放時間為何?","a":"福德坑環保復育園區滑草場係免費使用，開放時間為例假日(週六、日)09：00至12：00及13：00至16：30，天雨、颱風及春節期間停止開放，如遇天雨期間，『除因天氣預報臺北市降雨機率達70％，即確定停止開放外』，餘請先撥電話(02)8230-1969詢問園區值班人員場地是否因溼滑或泥濘而須暫停開放。福德坑環保復育園區地址：臺北市文山區木柵路5段151號(詳細指示請參考附件)","u":"臺北市政府環境保護局廢棄物處理場","h":91574,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B37C1D2B226FC4FD","d":"2011-10-04","sid":"B37C1D2B"},{"q":"如果發現有冷氣機滴水情形如何反應?環保局如何處理?","a":"冷氣機滴水情事業經行政院環保署依廢棄物清理法第27條11款公告為污染行為，民眾可將地點及容易發現之時間向1999通報，環保局將派員巡查，如確有滴水情形，將開立勸導單限期7日內改善，逾期未改善可依廢棄物清理法第27條第11款告發，並依第50條處以1200元至6000元之罰鍰。","u":"臺北市政府環境保護局環境清潔管理科","h":90139,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64C882C2672EEB9F","d":"2012-05-03","sid":"64C882C2"},{"q":"前往車行進行機車排氣定檢是否一定要帶行照？","a":"一、機車排氣檢驗需提供基本車籍資料，可由檢驗站軟體線上查詢環境部車籍資料庫，或由車主攜帶行照至檢驗站登錄，皆可執行排氣檢驗。\n二、惟為避免檢驗站網路連線異常暫時無法查詢車籍，或監理機關提供之車籍資料尚未即時更新，仍建議車主能夠攜帶行照到檢。","u":"臺北市政府環境保護局環保稽查大隊","h":87830,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=374A2D5684482707","d":"2017-07-13","sid":"374A2D56"},{"q":"接受機車排氣定期檢驗需要攜帶那些證件？","a":"各縣市環保局所委託認可之機車排氣檢驗站檢驗系統均已與環境部連線，前往進行排氣檢驗已無需攜帶行車執照。","u":"臺北市政府環境保護局空污噪音防制科","h":79208,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FE4744732DA1F779","d":"2008-06-23","sid":"FE474473"},{"q":"什麼時候要實施機車排氣定期檢驗？逾期未定檢罰多少錢？未繳罰鍰會怎麼樣？","a":"一、機車出廠滿5年即需依行照原發照月份前後1個月內實施定檢，逾期未定檢處新臺幣500元罰鍰。逾應檢驗日起6個月仍未實施定期檢驗者，經直轄市、縣（巿）主管機關通知限期改善，屆期未完成改善者，處新臺幣3,000元罰鍰。經直轄市、縣（巿）主管機關再通知限期改善，屆期仍未完成改善者，得移請公路監理機關註銷其牌照。\n二、另機車所有人違反空氣污染防制法且未繳納罰鍰時，依空氣污染防制法第84條規定，得移請公路監理機關配合停止其辦理車輛異動（如過戶或報廢等）。","u":"臺北市政府環境保護局環保稽查大隊","h":74105,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D5CAB448669D6431","d":"2008-06-27","sid":"D5CAB448"},{"q":"燃放爆竹及施放煙火製造噪音，有沒有法令可以管制?","a":"臺北市政府公告規定：\n一、 於晚上10時至上午8時這段時間不可施放專業爆竹煙火及會發出笛音或爆音之一般煙火並致妨礙安寧，惟於元旦、春節(農曆1月1日)、元宵節、端午節、中元節、中秋節、國慶日、除夕及政府辦理文化活動或國際交流，經本府專案核准之民俗節慶，不在此限制。\n二、 於學校、衛生醫療機構（診所除外）及文教區其周圍50公尺範內全日均不可施放專業爆竹煙火及會發出笛音或爆音之一般煙火並致妨礙安寧。但政府辦理文化活動或國際交流，且經本府專案核准者，不在此限。\n上述規定係本府依噪音管制法第8條公告不得從事致妨害他人生活環境安寧之行為，若違反公告規定，可處罰新臺幣3,000元至30,000元罰鍰。\n另有關公園及河濱公園禁止燃放一般爆竹煙火活動之管制規定，係水利處及公園處依臺北市公園管理自治條例進行管制。","u":"臺北市政府環境保護局環保稽查大隊","h":69039,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A577BE80F348E7AA","d":"2009-03-20","sid":"A577BE80"},{"q":"請問臺北市環保局何時提高亂丟垃圾罰款？","a":"依據廢棄物清理法第12條及第50條規定，違規排出或棄置垃圾包可處新臺幣1,200元以上6,000元以下罰鍰，一年內第1次罰鍰3,600元；第2次以上罰鍰6,000元。","u":"臺北市政府環境保護局環境清潔管理科","h":68116,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C
