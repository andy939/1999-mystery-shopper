<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1999 秘密客抽測台</title>
<style>
/* 版面與配色比照「常見問答爬蟲工作台」：白底黑字、深藍頂條、左側分區，一次只看一個分頁 */
:root{color-scheme:light;
      --bg:#f5f6f8;--card:#fff;--line:#e4e7eb;--ink:#1a1e24;--dim:#6b7280;
      --accent:#0cb5b5;--deep:#0a7f7f;--soft:#e6f7f7;--danger:#c0392b;--warn:#a8541c;
      --navy:#1d6fd6;--hover:#eef2f7}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",
     "Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
     display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4{margin:0}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--navy);outline-offset:1px}

/* 頂條 */
.topbar{flex:none;background:var(--navy);color:#fff;padding:10px 22px;display:flex;
        align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
h1{font-size:16px;color:#fff}
.topbar .meta{color:rgba(255,255,255,.85);font-size:12.5px;font-variant-numeric:tabular-nums}
.topbar .meta b{color:#fff}
.topbar .meta i{font-style:normal;color:rgba(255,255,255,.35);margin:0 6px}
.topbar .links{display:flex;gap:16px;white-space:nowrap}
.topbar a{color:#cfe3ff;text-decoration:none;font-size:13px}
.topbar a:hover{color:#fff;text-decoration:underline}

/* 左側分區＋右側內容，整個畫面固定高度，只有卡片內部捲動 */
.layout{flex:1;min-height:0;width:100%;max-width:1320px;margin:0 auto;padding:14px 16px;
        display:grid;grid-template-columns:164px minmax(0,1fr);gap:14px}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;
      align-self:start;max-height:100%;overflow:auto}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
      border:0;border-radius:7px;padding:5px 10px;margin:0;font:inherit;font-size:13.5px;line-height:1.5;
      font-weight:400;color:var(--ink);cursor:pointer}
.side button i{font-style:normal;width:18px;text-align:center;flex:0 0 auto}
.side button .k{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.side button:hover{background:var(--hover)}
.side button:disabled{opacity:.38;cursor:not-allowed;background:none;filter:none}
.side button.on{background:var(--navy);color:#fff;font-weight:600}
.side button.on .k{color:rgba(255,255,255,.8)}
.side .grp{font-size:11.5px;color:var(--dim);padding:6px 10px 1px;font-weight:600;letter-spacing:.05em}
.side button.fold{color:var(--dim);font-size:16px;padding:0 10px 2px;line-height:1}
.layout.fold{grid-template-columns:52px minmax(0,1fr)}
.layout.fold .side button span,.layout.fold .side .grp,.layout.fold .side .k,
.layout.fold .sidenote,.sidenote[hidden]{display:none}
.layout.fold .side button[data-page]{justify-content:center;padding:5px 4px}
.sidenote{font-size:12px;color:var(--dim);padding:8px 10px 2px;line-height:1.55;
      border-top:1px solid var(--line);margin-top:6px}
.sidenote b{color:var(--ink);font-weight:600}

main{min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px}
section[data-page]{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
section[hidden],.cur[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
      min-width:0}
.card h2{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.05em;margin:0 0 10px;
      display:flex;align-items:center;gap:8px}
.card h2 span{font-weight:400;letter-spacing:0}
.card h2 .tail{margin-left:auto}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow:auto}
.pager{flex:none;display:flex;gap:10px;justify-content:space-between;border-top:1px solid var(--line);
      padding-top:10px;margin-top:10px}
.pager button.ghost{background:var(--navy);color:#fff;border-color:transparent;font-weight:600}

/* 目前題目 */
.cur{flex:none;display:flex;gap:16px;align-items:flex-start}
.cur .main{flex:1;min-width:0}
.cur .org{font-size:12px;color:var(--dim)}
.cur h3{font-size:16px;line-height:1.45;margin:1px 0 6px}
.cur .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.badge{background:#eaf6f6;color:var(--deep);border-radius:99px;padding:1px 9px;font-size:11.5px;
      white-space:nowrap}
.badge.gray{background:#f1f3f5;color:#4b5563}
.badge.hot{background:#fdf0e8;color:var(--warn)}
button.badge{border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:400}
button.badge:hover{filter:brightness(.95)}

/* 表單元件 */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
select,input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
      background:#fff;color:var(--ink)}
button{background:var(--navy);color:#fff;border-color:transparent;cursor:pointer;font-weight:600;
      padding:8px 16px}
button:hover{filter:brightness(.93)}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line);font-weight:400}
button.sm{padding:5px 11px;font-size:13px}
button.tight{padding:8px 10px}
button:disabled{opacity:.45;cursor:default;filter:none}
.hint{color:var(--dim);font-size:12.5px}
/* 問號提示：滑過或聚焦才顯示說明，不占版面 */
.qm{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--dim);color:var(--dim);font-size:10.5px;font-weight:700;line-height:1;cursor:help;
  margin-left:3px;vertical-align:1px}
.qm:hover,.qm:focus{border-color:var(--navy);color:var(--navy);outline:none}
.qm::after{content:attr(data-tip);position:absolute;left:-8px;top:21px;z-index:20;width:340px;
  white-space:pre-line;background:#1f2937;color:#fff;font-size:12.5px;font-weight:400;line-height:1.6;
  text-align:left;padding:9px 12px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.qm:hover::after,.qm:focus::after{opacity:1;visibility:visible}
.said{color:var(--deep);font-size:12.5px;font-weight:600;align-self:center}

/* 選題：左局處、右題目，兩邊各自捲動 */
.faqgrid{flex:1;min-height:0;display:grid;grid-template-columns:172px minmax(0,1fr);gap:16px}
.orgs{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;
      min-height:0}
.orgs h4{margin:2px 6px 8px;font-size:12px;color:var(--dim);font-weight:600}
.orgs h4 span{font-weight:400}
.orgs input{width:100%;margin:0 0 6px}
#org-list{flex:1;min-height:0;overflow:auto}
.orgs button{display:flex;width:100%;justify-content:space-between;gap:8px;align-items:center;
      background:none;border:0;border-radius:6px;padding:6px 8px;font-size:13px;font-weight:400;
      color:var(--ink);text-align:left}
.orgs button:hover{background:var(--hover);filter:none}
.orgs button.on{background:var(--soft);color:var(--deep);font-weight:600}
.orgs button b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
.orgs button.on b{color:var(--deep)}
.topics{display:flex;flex-direction:column;min-height:0}
.topics .hint{margin:0 0 8px}
#topic-list{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px}
/* 題目清單：表格式，一題一列、欄間框線 */
.item,.thead{display:grid;grid-template-columns:minmax(0,1fr) 150px 72px 78px 100px;border-bottom:1px solid var(--line)}
.item>*,.thead>*{padding:7px 10px;min-width:0}
.item>*+*,.thead>*+*{border-left:1px solid var(--line)}
.thead{position:sticky;top:0;z-index:2;background:var(--card);font-size:11.5px;color:var(--dim);font-weight:600}
.item{cursor:pointer;font-size:12.5px;color:var(--dim)}
.item:hover{background:#fafbfc}
.item.on{background:var(--soft)}
.item h3{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink)}
.item h3 .badge{margin-left:6px;font-size:11px;vertical-align:1px}
.item .c{line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .c.num{text-align:right;font-variant-numeric:tabular-nums}
.item.open{cursor:default;background:var(--soft)}
.item.open h3{position:sticky;top:31px;z-index:1;background:var(--soft);cursor:pointer;font-size:14.5px}
.item.open .c{position:sticky;top:31px;background:var(--soft)}
.peek{grid-column:1/-1;border-left:0!important;padding:10px 14px 12px;background:var(--card);border-top:1px dashed var(--line)}
.peek .ans{font-size:13.5px;line-height:1.75;white-space:pre-wrap;cursor:text;user-select:text;color:var(--ink)}
.badge.ai{background:#e8f0fc;color:var(--navy)}
.aiq{margin-top:10px;padding:8px 10px;background:#f5f8fd;border-radius:6px;font-size:13px;line-height:1.7}
.aiq b{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.peek-acts{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
mark{background:#ffe9a8;border-radius:2px}
.empty{padding:30px 10px;color:var(--dim);text-align:center}

/* 撥號前準備 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.box h4{margin:0 0 7px;font-size:12px;color:var(--dim);font-weight:600}
.box p{margin:0;font-size:13.5px}
.box.warn{border-color:#f0d3bf;background:#fdf7f2}
.box.warn h4{color:var(--warn)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}

/* 對話 */
.legend{font-size:12.5px;color:var(--dim);margin:0 0 10px}
.legend b{color:var(--ink)}
.line{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:4px 0;max-width:900px}
.who{font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;
     height:22px;display:grid;place-items:center;margin-top:3px}
.line.agent .who{background:#9ca3af}
.say{font-size:14.5px;line-height:1.75;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.line:not(.agent) .say{background:var(--soft);border-color:#bfe7e7;font-weight:600}
.line.agent .say{color:#374151}
.say em{font-style:normal;color:var(--warn);font-size:12.5px;font-weight:400}
.mark{display:inline-block;font-size:11px;color:var(--deep);background:#fff;border:1px solid #bfe7e7;
      border-radius:99px;padding:0 8px;margin-left:6px;vertical-align:1px;font-weight:400;white-space:nowrap}
.cite{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:2px}
.watch{border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:0 8px 8px 0;
       padding:9px 13px;margin-top:12px;font-size:13px;max-width:900px}

/* 追問 */
.probe{border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:9px;max-width:900px}
.probe.done{opacity:.5}
.probe .top{display:flex;align-items:center;gap:8px}
.probe .n{font-weight:700;color:var(--deep);font-size:13px}
.probe .tick{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);
       margin-bottom:0;cursor:pointer}
.probe .tick input{width:17px;height:17px;accent-color:var(--accent);padding:0}
.probe .ask{font-size:15px;font-weight:600;line-height:1.6;margin:5px 0 6px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}

/* 情境變化 */
.alt{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:9px;max-width:900px}
.alt.cur2{border-color:var(--accent);background:var(--soft)}
.alt .lv{font-weight:700;font-size:13px}
.alt p{margin:4px 0 0;font-size:14px;line-height:1.7}
.alt .obs{font-size:12.5px;color:var(--dim)}

/* 標準答案、來源 */
ol.points{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;max-width:900px}
ol.points li{font-size:14px;line-height:1.7}
.src{font-size:12.5px;color:var(--dim);margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--card)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
.wrap{border:1px solid var(--line);border-radius:8px}

/* 智能客服測題 */
.cks{display:flex;flex-wrap:wrap;gap:4px 12px;padding-top:6px}
label.ck{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:13px;color:var(--ink);cursor:pointer}
label.ck input{padding:0;width:15px;height:15px;accent-color:var(--accent)}
.csbar{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);grid-template-areas:"n o l t" "a a a t";gap:10px 12px;align-items:start}
.csbar>div:nth-child(1){grid-area:n}.csbar>div:nth-child(2){grid-area:o}.csbar>div:nth-child(3){grid-area:l}.csbar>div:nth-child(4){grid-area:t}
.csbar>div>label:not(.ck){height:20px;display:flex;align-items:center;gap:4px;margin-bottom:4px}
#cs-n{-moz-appearance:textfield}#cs-n::-webkit-inner-spin-button,#cs-n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.csacts{grid-area:a;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.csacts .btns{display:flex;gap:10px}
.csacts .msg{display:flex;gap:10px;font-size:12.5px;margin-left:6px}
.csacts .cnt{color:var(--dim);white-space:nowrap}
.csbar .cks{gap:4px 6px}
.csbar label.ck{gap:2px;font-size:12.5px}
table.cs td{font-size:13px}
.csrow{cursor:pointer}
.csrow:hover td{background:#fafbfc}
.csrow.on td{background:var(--soft)}
table.cs th+th,table.cs td+td{border-left:1px solid var(--line)}
td.csq{width:30em;max-width:30em;font-weight:600;line-height:1.55}
td.csf{color:#374151;line-height:1.55;white-space:pre-line}
tr.csdet td{background:#fafbfc}
table.cs th{z-index:2}
table.cs.locked tr.csrow.on td{position:sticky;top:var(--thh,34px);z-index:1;box-shadow:0 1px 0 var(--line)}
table.cs.locked .csbody{max-height:none;overflow:visible}
.lockhint{margin-left:12px;font-weight:400;color:var(--navy)}
section[data-page="cs"]{gap:8px}
section[data-page="cs"]>.card.fill{padding:8px 10px}
.csans{padding:4px 2px 8px;max-width:980px}
.csans b{font-size:12px;color:var(--dim)}
.csav{color:var(--danger);font-size:12.5px;margin:3px 0}
.csbody{white-space:pre-wrap;font-size:13.5px;line-height:1.75;margin:6px 0;max-height:320px;overflow:auto;
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
.csans a{font-size:12.5px;margin-right:10px}
.qm::after{white-space:pre-line}

@media (max-width:900px){
  body{overflow:auto;display:block}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:flex;flex-wrap:wrap;gap:4px}
  .side button{width:auto}
  .side .grp,.side button.fold{display:none}
  .sidenote{width:100%}
  .faqgrid{grid-template-columns:minmax(0,1fr)}
  #org-list{max-height:180px}
  #topic-list{max-height:60vh}
  .cur{flex-direction:column}
  .cur .acts{justify-content:flex-start;max-width:none}
}
@media print{
  body{display:block;overflow:visible;background:#fff}
  .topbar,.side,.pager,.cur .acts,section[data-page="pick"]{display:none!important}
  .layout{display:block;padding:0}
  section[data-page]{margin-bottom:12px}
  .card{break-inside:auto;border-color:#999}
  .scroll{overflow:visible}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tt">
    <h1>1999 秘密客抽測台</h1>
    <span class="meta" id="ov">題庫載入中…</span>
  </div>
  <div class="links">
    <a href="mobile.html">手機版 ↗</a>
    <a href="1999%E7%A7%98%E5%AF%86%E5%AE%A2%E8%85%B3%E6%9C%AC%E5%8C%85.pdf" target="_blank" rel="noopener">腳本包 PDF ↗</a>
  </div>
</header>

<div class="layout" id="layout">
<aside class="side">
  <button class="fold" id="fold" title="收合／展開選單">‹</button>
  <button data-page="cs"><i>🧪</i><span>智能出題</span></button>
  <button data-page="pick"><i>🎯</i><span>秘密客出題</span></button>
  <button data-page="dlg"><i>💬</i><span>對話腳本</span><b class="k" id="k-dlg"></b></button>
  <button data-page="probe"><i>❓</i><span>追問清單</span><b class="k" id="k-probe"></b></button>
  <button data-page="key"><i>✅</i><span>標準答案</span><b class="k" id="k-key"></b></button>
  <button data-page="src"><i>📎</i><span>FAQ 來源</span><b class="k" id="k-src"></b></button>
  <div class="sidenote" id="sidenote">尚未選題</div>
</aside>

<main>
  <!-- 目前題目（每一頁都看得到） -->
  <div class="card cur" id="cur">
    <div class="main">
      <div class="org" id="cur-org">—</div>
      <h3 id="cur-q">題庫載入中…</h3>
      <div class="chips" id="cur-chips"></div>
    </div>
    <div class="acts">
      <span class="said" id="said"></span>
      <button class="ghost sm" id="btn-reroll" title="同一題換一套說法">換說法</button>
      <button class="ghost sm" id="btn-copy" title="只複製目前這一頁">複製本頁</button>
      <button class="ghost sm" id="btn-print" title="只列印目前這一頁，也可另存 PDF">列印本頁</button>
    </div>
  </div>

  <section data-page="pick" hidden>
    <div class="card" style="flex:none">
      <div class="row">
        <div><label for="f-persona">秘密客身分 <span class="qm" id="qm-persona" tabindex="0">?</span></label><select id="f-persona" style="width:166px"></select></div>
        <div><label for="f-level">情境難度 <span class="qm" id="qm-level" tabindex="0">?</span></label><select id="f-level" style="width:128px"></select></div>
        <div><label for="f-search">全題庫搜尋（空白分隔多個詞）</label>
          <input id="f-search" type="search" placeholder="拖吊、特休、房屋稅…" style="width:372px"></div>
        <button id="btn-make" class="tight" disabled title="先在下方點一題看內容，再按這裡產生對話腳本">📝 出題</button>
        <button class="ghost tight" id="btn-random-org" title="保留上面選的身分與難度，在左邊選中的局處內抽一題">🎲 本局</button>
        <button class="ghost tight" id="btn-random" title="題目、身分、難度全部隨機抽一題">🎲 隨機</button>
      </div>

    </div>
    <div class="card fill">
      <div class="faqgrid">
        <aside class="orgs">
          <h4>局處分類　<span id="org-count"></span></h4>
          <input id="orgq" placeholder="篩選局處…">
          <div id="org-list"></div>
        </aside>
        <div class="topics">
          <div class="hint" id="topic-count"></div>
          <div id="topic-list"></div>
        </div>
      </div>
    </div>

}
function trim(t,n){t=String(t).replace(/^[一二三四五六七八九十]、/,'').replace(/^（[^）]{1,4}）/,'')
  .replace(/^\(\d+\)/,'').trim();return t.length>n?t.slice(0,n)+'…':t}
/* 同局處、同主題的相鄰 FAQ（延伸追問的題源） */
function snip(s,rx,n){
  rx.lastIndex=0;
  var m=rx.exec(s);
  if(!m)return trim(s,n);
  var st=Math.max(0,m.index-40),en=Math.min(s.length,st+n);
  return (st>0?'…':'')+s.slice(st,en).trim()+(en<s.length?'…':'');
}
function relatedFor(item){
  var out=[],i,it;
  if(!S.org)return out;
  for(i=0;i<S.org.items.length;i++){
    it=S.org.items[i];
    if(it.q===item.q)continue;
    if(it.t===item.t)out.push(it);
    if(out.length>=3)break;
  }
  for(i=0;i<S.org.items.length&&out.length<3;i++){
    it=S.org.items[i];
    if(it.q===item.q||out.indexOf(it)>=0)continue;
    out.push(it);
  }
  return out;
}
function cite(f){
  return f.u+'〈'+(f.q.length>20?f.q.slice(0,20)+'…':f.q)+'〉'+(f.d?' '+f.d:'')+(f.sid?' #'+f.sid.slice(0,8):'');
}
/* 追問：命中規則 + 從標準答案挑出對應句當「正解」 */
function probesFor(item){
  var txt=item.q+' '+item.a,sn=sentences(item.a),hit=[],out=[],i,j;
  /* AI 題的條件判斷／錯誤前提／多意圖題排最前面，正解用它的應答要點 */
  var deep=shuffled(aiFor(item).filter(function(q){return q.lv==='L3'||q.lv==='L4'}));
  for(i=0;i<deep.length&&i<2;i++){var d=deep[i];
    out.push({q:d.q,why:(d.type||[]).join('、')+'：'+(d.note||''),kind:'AI 題',src:item,
      ans:(d.expect==='糾正'?'先更正民眾說法。':'')+(d.points||[]).join('；')+
        (d.avoid&&d.avoid.length?'（不應說：'+d.avoid.join('、')+'）':'')});}
  for(i=0;i<PROBES.length;i++){
    if(!PROBES[i][0].test(txt))continue;
    var ans='';
    for(j=0;j<sn.length;j++)if(PROBES[i][0].test(sn[j])){ans=snip(sn[j],PROBES[i][0],120);break}
    var q=PROBES[i][1].replace('信義區',pick(DISTRICTS));
    hit.push({q:q,why:PROBES[i][2],ans:ans,src:item,kind:'主題'});
  }
  /* 命中的題目洗牌後取 3–4 題，所以同一主題每次的追問組合不同 */
  hit=shuffled(hit);
  var take=Math.max(0,(hit.length>3?(3+Math.floor(RND()*2)):hit.length)-out.length);
  for(i=0;i<take;i++)out.push(hit[i]);
  if(out.length<3)out.push({q:'這件事如果我不方便自己來辦，還有沒有其他管道？',
    why:'替代管道是否主動提供',ans:'',src:item,kind:'主題'});
  var rel=relatedFor(item);
  for(i=0;i<rel.length&&i<2;i++){
    var rs=sentences(rel[i].a);
    out.push({q:'另外順便問一下，'+rel[i].q,why:'延伸題：同業務相鄰知識，測知識廣度與是否需再轉接',
      ans:rs.length?trim(rs[0],120):'',src:rel[i],kind:'延伸'});
  }
  var tails=shuffled(TAIL_PROBES);
  out.push({q:tails[0][0],why:tails[0][1],ans:'',src:null,kind:'服務行為'});
  if(RND()<0.6)out.push({q:tails[1][0],why:tails[1][1],ans:'',src:null,kind:'服務行為'});
  return out;
}
function crossOrgFor(item){
  var pool=[],i,j;
  for(i=0;i<ORGS.length;i++){
    if(ORGS[i].org===S.org.org)continue;
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].t===item.t){pool.push(ORGS[i].org);break}
  }
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:'區公所';
}
/* AI 題（cstest.json）與智能客服測題共用：sid → 對話型題目（不含 L0 關鍵詞） */
var AIQ=null;
function aiIndex(){
  if(AIQ)return AIQ;AIQ={};
  var b=CS.bank||[],i,j;
  for(i=0;i<b.length;i++){var q=b[i];if(q.lv==='L0'||!q.faqs)continue;
    for(j=0;j<q.faqs.length;j++)(AIQ[q.faqs[j]]=AIQ[q.faqs[j]]||[]).push(q);}
  return AIQ;
}
function aiFor(item){return item&&item.sid&&CS.bank?(aiIndex()[item.sid]||[]):[]}
function aiPick(list,lvs){
  for(var k=0;k<lvs.length;k++){var c=list.filter(function(q){return q.lv===lvs[k]});if(c.length)return pick(c)}
  return null;
}
/* 開場（依難度）：有 AI 題就用 AI 題的問法，沒有才用規則模板 */
function openingLines(item,level){
  var p=PERSONAS[S.persona],lines=[{who:'客',t:p.open}],ai=aiFor(item),a;
  if(level==='L1'){a=aiPick(ai,['L1','L2']);lines.push({who:'客',t:a?a.q:'我想請問：'+item.q});}

    a=aiPick(ai,['L2','L1']);

/* 完整正常對話模擬：專員台詞由標準答案組出 */
function dialogue(item,pr){
  var p=PERSONAS[S.persona],kp=keyPoints(item.a),L=[],i;
  if(!pr)pr=probesFor(item);
  L.push({who:'員',t:'您好，1999 臺北市民當家熱線，我是專員 ○○○，很高興為您服務。',
    mark:'開場：問候＋單位＋代號'});

  for(i=1;i<ol.length;i++)L.push({who:'客',t:ol[i].t});
  L.push({who:'員',t:fill(pick(VAR.confirm),{q:shortQ(item.q)})+pick(VAR.ask2),
    mark:'需求確認：複述＋補問條件'});

  for(i=0;i<used;i++)L.push({who:'員',t:leads[i%leads.length]+trim(kp[i],120),
    mark:i===0?'答詢：對照標準答案要點':'',cite:'本題 FAQ 要點 '+(i+1)+'／'+cite(item)});
  if(p.mid)L.push({who:'客',t:p.mid,mark:'插話：測不被激怒、能否把話題導回'});

    mark:pr[0].ans?'應答出這一段':'觀察：不確定時的處理',
    cite:pr[0].ans?cite(pr[0].src):''});

      mark:pr[1].ans?'應答出這一段':'觀察：轉介與回電承諾',
      cite:pr[1].ans?cite(pr[1].src):''});
  }
  L.push({who:'客',t:p.ack,mark:'測耐心／換句話說'});
  L.push({who:'員',t:pick(VAR.recap)+trim(kp[0],60)+
    (kp[1]?'；還有'+trim(kp[1],60):'')+'。',mark:'摘要複述'});
  if(kp.length>used)L.push({who:'員',t:pick(VAR.detail)+trim(kp[used],110),mark:'完整度'});
  L.push({who:'客',t:pick(VAR.understood)+'<em>（不要主動道謝，看專員是否自己問「還有其他需要嗎」）</em>'});
  L.push({who:'員',t:pick(VAR.ask3),mark:'結案確認'});
  L.push({who:'客',t:pick(VAR.noThanks)});
  L.push({who:'員',t:pick(VAR.bye)+'<em>（記錄是否等民眾先掛機）</em>',mark:'結束語'});
  return L;
}

/* 局處輸入框：完全相符用該局處；只打部分字且只對到一個局處也算；空白或對不到＝全部局處 */

function csMatch(q,o){
  if(o.lv.length&&o.lv.indexOf(q.lv)<0)return false;
  if(o.ty.length){var ok=false;for(var i=0;i<q.type.length;i++)if(o.ty.indexOf(q.type[i])>=0)ok=true;if(!ok)return false}
  if(o.org){
    var m=csSidMap(),hit=false;
    for(var j=0;j<q.faqs.length;j++)if(m[q.faqs[j]]&&m[q.faqs[j]].org.org===o.org)hit=true;
    if(!hit)return false;
  }
  return true;
}
function csShuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---- 規則模板補題 ---- */
function csColloquial(t){
  return String(t).replace(/^請問/,'').replace(/^【[^】]*】/,'').replace(/臺北市/g,'台北市')
    .replace(/如何/g,'要怎麼').replace(/為何/g,'是什麼').replace(/[？?\s]+$/,'')+'？';
}
function csPoints(a){
  var s=sentences(a),out=[],i,m;
  for(i=0;i<s.length&&out.length<3;i++){
    m=/[\d０-９一二三四五六七八九十百千萬]+\s*(元|日|天|週|星期|個月|月|年|歲|小時|分鐘|點|次|處|人|%|％)/.exec(s[i]);
    if(m){var st=Math.max(0,m.index-8);out.push(s[i].slice(st,Math.min(s[i].length,m.index+m[0].length+6)).trim())}
  }
  if(!out.length){var k=keyPoints(a);for(i=0;i<k.length&&i<2;i++)out.push(trim(k[i],26))}
  return out;
}
function csRuleOne(o,lvPick,tyPick){
  var pool=[],i,j;
  for(i=0;i<ORGS.length;i++){if(o.org&&ORGS[i].org!==o.org)continue;pool.push(ORGS[i])}
  if(tyPick==='無答案'||(!pool.length)){
    var x=CS_OUT[Math.floor(Math.random()*CS_OUT.length)];
    return {id:'R-OUT',src:'規則',q:x[0],lv:'L2',type:['無答案'],faqs:[],expect:'轉介',points:['轉介'],avoid:[],note:x[1]};
  }
  var wsum=0;for(i=0;i<pool.length;i++)wsum+=pool[i].total;
  var r=Math.random()*wsum,acc=0,org=pool[0];
  for(i=0;i<pool.length;i++){acc+=pool[i].total;if(r<=acc){org=pool[i];break}}
  var it=org.items[Math.floor(Math.random()*org.items.length)];
  var lv=lvPick,q,ty,faqs=[it.sid],d=DISTRICTS[Math.floor(Math.random()*DISTRICTS.length)];
  if(lv==='L1'){q=it.q;ty=['口語情境']}
  else if(lv==='L2'){q=['我想問一下，','不好意思，想請教一下，','欸我問一下喔，'][Math.floor(Math.random()*3)]+csColloquial(it.q);ty=['口語情境']}
  else if(lv==='L3'){
    var pr=null;for(j=0;j<PROBES.length;j++)if(PROBES[j][0].test(it.q+(it.a||''))){pr=PROBES[j][1].replace('信義區',d);break}
    q='我住'+d+'，'+csColloquial(it.q)+(pr?'另外'+pr:'');ty=['口語情境','條件判斷'];
  }else{
    var it2=null;for(j=0;j<20&&!it2;j++){var c=org.items[Math.floor(Math.random()*org.items.length)];if(c!==it&&c.t===it.t)it2=c}
    if(!it2)it2=org.items[(org.items.indexOf(it)+1)%org.items.length];
    q=csColloquial(it.q).replace(/？$/,'，')+'還有順便問一下，'+csColloquial(it2.q);ty=['多意圖'];faqs.push(it2.sid);
  }
  return {id:'R-'+it.sid.slice(0,6),src:'規則',q:q,lv:lv,type:ty,faqs:faqs,expect:'回答',points:null,avoid:[],note:'規則模板產生'};
}

/* ---- 產生 ---- */
function csGenerate(){
  csLoadBank(function(){
    var o=csOpts(),cand=[],i;
    if(o.org===null)return;
    for(i=0;i<CS.bank.length;i++){var q=CS.bank[i];
      if(q.src==='標竿'&&!o.bench)continue;
      if(csMatch(q,o))cand.push(q);}
    csShuffle(cand);   /* 人工標竿與 AI 題一起隨機抽，不再固定排前面（否則 20 題永遠是同一組標竿） */
    var set=cand.slice(0,o.n),need=o.n-set.length;
    if(need>0&&o.rule){
      /* 關鍵詞題（L0）要挑重點詞，交給 AI 題庫，不用規則臨時產生 */
      var lvs=(o.lv.length?o.lv:['L1','L2','L3','L4']).filter(function(x){return x!=='L0'}),tys=o.ty.length?o.ty:[''];
      if(!lvs.length)need=0;
      for(i=0;i<need;i++){
        var ty=tys[i%tys.length];
        if(ty&&['口語情境','多意圖','條件判斷','無答案'].indexOf(ty)<0)continue;  /* 錯誤前提等只有 AI 題庫出得好 */
        var lv=ty==='多意圖'?'L4':(ty==='條件判斷'?'L3':lvs[i%lvs.length]);
        set.push(csRuleOne(o,lv,ty));
      }
    }
    CS.set=set.map(function(q,k){var c={};for(var p in q)c[p]=q[p];c.no=k+1;return c});
    CS.focus=null;
    csFill(function(){csRender();
      var short=o.n-CS.set.length;
      flash('cs-said','產生 '+CS.set.length+' 題'+(short>0?'（符合條件的只有這些，可放寬條件或勾「規則補題」）':''));});
  });
}
/* 把每題對應 FAQ 的答案載進來（按局處分檔，只抓需要的） */
function csFill(cb){
  var m=csSidMap(),need=[],i,j,left;
  for(i=0;i<CS.set.length;i++)for(j=0;j<CS.set[i].faqs.length;j++){
    var x=m[CS.set[i].faqs[j]];if(x&&!x.org.loaded&&need.indexOf(x.org)<0)need.push(x.org)}
  left=need.length;
  function done(){
    for(i=0;i<CS.set.length;i++){var q=CS.set[i];q.refs=[];
      for(j=0;j<q.faqs.length;j++){var y=m[q.faqs[j]];if(y)q.refs.push({org:y.org.org,u:y.item.u,t:y.item.q,a:y.item.a||'',l:y.item.l,d:y.item.d})}
      if(!q.points){var all='';for(j=0;j<q.refs.length;j++)all+=q.refs[j].a+'。';q.points=csPoints(all)}
    }
    cb();
  }
  if(!left)return done();
  for(i=0;i<need.length;i++)ensureOrg(need[i],function(){if(--left===0)done()});
}
function csAnswerText(q){
  if(q.src==='標竿'&&q.ref_answer)return q.ref_answer;
  if(!q.refs||!q.refs.length)return '（題庫無此答案）';
  var CN=['(一)','(二)','(三)','(四)'];
  return q.refs.length>1?q.refs.map(function(r,i){return CN[i]+'\n'+r.a}).join('\n'):q.refs[0].a;
}
function csTitleText(q){
  if(q.src==='標竿'&&q.ref_title)return q.ref_title;
  if(!q.refs||!q.refs.length)return '—';
  var CN=['(一)','(二)','(三)','(四)'];
  return q.refs.length>1?q.refs.map(function(r,i){return CN[i]+r.t}).join('\n'):q.refs[0].t;
}
function csRender(){
  var h='',i;
  if(!CS.set.length){el('cs-list').innerHTML='<div class="empty">設定好條件後按「🎲 產生測試題」</div>';el('cs-count').textContent='';return}
  var f=CS.focus,cnt={};for(i=0;i<CS.set.length;i++)cnt[CS.set[i].lv]=(cnt[CS.set[i].lv]||0)+1;
  el('cs-count').textContent=CS.set.length+' 題 · '+['L0','L1','L2','L3','L4'].filter(function(k){return cnt[k]}).map(function(k){return k+' '+cnt[k]}).join('、');
  h='<div class="wrap"><table class="cs'+(f!=null?' locked':'')+'"><thead><tr><th>#</th><th>難度</th><th>題型</th><th>題目'+(f!=null?'<span class="lockhint">🔒 已鎖定這題，點題目列回到清單</span>':'')+'</th><th>對應 FAQ</th></tr></thead><tbody>';
  for(i=(f!=null?f:0);i<(f!=null?f+1:CS.set.length);i++){
    var q=CS.set[i];
    h+='<tr class="csrow'+(f===i?' on':'')+'" data-cs="'+i+'"><td class="num">'+q.no+'</td>'+
      '<td class="nw"><span class="badge">'+esc(q.lv)+'</span></td>'+
      '<td>'+q.type.map(function(t){return '<span class="badge gray">'+esc(t)+'</span>'}).join(' ')+
      '</td>'+
      '<td class="csq">'+esc(q.q)+'</td>'+
      '<td class="csf">'+esc(csTitleText(q))+'</td></tr>';
    if(f===i){
      h+='<tr class="csdet"><td></td><td colspan="4"><div class="csans"><b>標準答案</b>'+
        (q.avoid&&q.avoid.length?'<div class="csav">不應出現：'+q.avoid.map(esc).join('、')+'</div>':'')+
        (q.note?'<div class="hint">出題用意：'+esc(q.note)+'</div>':'')+
        '<div class="csbody">'+esc(csAnswerText(q))+'</div>'+
        (q.refs||[]).map(function(r){return r.l?'<a href="'+esc(r.l)+'" target="_blank" rel="noopener">'+esc(r.org)+'〈'+esc(r.t.slice(0,24))+'〉原始頁 ↗</a> ':''}).join('')+
        '</div></td></tr>';
    }
  }
  el('cs-list').innerHTML=h+'</tbody></table></div>';
  var th=el('cs-list').querySelector('thead');if(th)el('cs-list').style.setProperty('--thh',th.offsetHeight+'px');
}

/* ---- 匯出 Excel（SheetJS，按下才載入） ---- */
function csLoadXLSX(cb){
  if(window.XLSX)return cb();
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload=cb;s.onerror=function(){flash('cs-said','Excel 元件載入失敗，請檢查網路')};
  document.head.appendChild(s);
}
function csExport(){
  if(!CS.set.length){flash('cs-said','請先產生測試題');return}
  csLoadXLSX(function(){
    /* 前五欄與「FAQ系統調校之題目」相同，後面是補充欄 */
    var head=['序號','題目 ','FAQ知識編號','FAQ知識標題','FAQ知識答案','難度','題型','期望反應','應答要點','不應出現',
      '發布機關','原始頁連結','出題用意','題源','智能客服回答','是否正確','備註'];
    var rows=[head];
    for(var i=0;i<CS.set.length;i++){var q=CS.set[i];
      rows.push([q.no,q.q,q.ref_no||'',csTitleText(q),csAnswerText(q),q.lv,q.type.join('、'),
        q.expect+'：'+(CS_EXPECT[q.expect]||''),(q.points||[]).join('；'),(q.avoid||[]).join('；'),
        (q.refs||[]).map(function(r){return r.u}).join(' / '),(q.refs||[]).map(function(r){return r.l||''}).join('\n'),
        q.note||'',q.src,'','','']);
    }
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:5},{wch:48},{wch:10},{wch:32},{wch:60},{wch:5},{wch:14},{wch:16},{wch:30},{wch:20},
      {wch:22},{wch:30},{wch:24},{wch:6},{wch:48},{wch:9},{wch:16}];
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'工作表1');
    var d=new Date(),p=function(n){return (n<10?'0':'')+n};
    XLSX.writeFile(wb,'智能客服測試題_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.xlsx');
    flash('cs-said','已匯出 '+CS.set.length+' 題');
  });
}
function csCopy(){
  if(!CS.set.length){flash('cs-said','請先產生測試題');return}
  copy(CS.set.map(function(q){return q.no+'. '+q.q}).join('\n'),'已複製 '+CS.set.length+' 題題目（不含答案）');
}
function csInit(){
  var h='',i;
  for(i=0;i<ORGS.length;i++)h+='<option value="'+esc(ORGS[i].org)+'"></option>';
  el('cs-org-list').innerHTML=h;
  el('cs-ty').innerHTML=CS_TYPES.map(function(t){return '<label class="ck"><input type="checkbox" value="'+t+'"> '+t+'</label>'}).join('');
  el('cs-go').addEventListener('click',csGenerate);
  el('cs-xls').addEventListener('click',csExport);
  el('cs-copy').addEventListener('click',csCopy);
  el('cs-list').addEventListener('click',function(e){
    if(e.target.closest('a'))return;
    var r=e.target.closest('[data-cs]');if(!r)return;
    var k=+r.getAttribute('data-cs'),box=el('cs-list');
    if(CS.focus===k){CS.focus=null;csRender();box.scrollTop=CS.keep||0;}
    else{CS.keep=box.scrollTop;CS.focus=k;csRender();box.scrollTop=0;}});
  csRender();
}

/* ================= init ================= */
function fillSelect(id,obj,val){
  var s=el(id),h='',k;
  for(k in obj)h+='<option value="'+k+'">'+esc(obj[k].n)+'</option>';
  s.innerHTML=h;s.value=val;
}
function init(){
  el('ov').innerHTML='題庫 <b>'+num(DATA.totalFaq)+'</b> 題<i>|</i>局處 <b>'+ORGS.length+
    '</b> 個<i>|</i>資料更新 <b>'+esc(DATA.generated)+'</b><i>|</i>來源 '+esc(DATA.source);
  fillSelect('f-persona',PERSONAS,S.persona);
  fillSelect('f-level',LEVELS,S.level);
  drawPagers();
  csInit();
  var ui=lsGet(LSU,null),last=lsGet(LSL,null);
  if(ui&&ui.fold)setFold(true);
  if(last){
    if(last.persona&&PERSONAS[last.persona]){S.persona=last.persona;el('f-persona').value=S.persona}
    if(last.level&&LEVELS[last.level]){S.level=last.level;el('f-level').value=S.level}
  }
  goPage('cs');   /* 每次打開都先進選單最上面的「智能客服測題」 */
  /* 開網頁不自動出題：只打開上次瀏覽的局處，按「出題」才產生腳本 */
  S.browse=ALL;renderOrgs();renderTopics();syncSide();

  document.querySelector('.side').addEventListener('click',function(e){
    var b=e.target.closest('[data-page]');if(b)goPage(b.getAttribute('data-page'));});
  el('fold').addEventListener('click',function(){setFold(!S.fold)});
  document.querySelector('main').addEventListener('click',function(e){
    var g=e.target.closest('[data-go]');if(g){goPage(g.getAttribute('data-go'));return}
    if(e.target.closest('#chip-seed')){
      var v=window.prompt('輸入腳本編號可重現同一份腳本（1000–9999）：',S.seed);
      if(v===null)return;v=parseInt(v,10);if(!v||v<1)return;
      S.seed=v;rebuild();}
  });
  el('org-list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-org]');if(b)selectOrg(b.getAttribute('data-org'));});
  el('topic-list').addEventListener('click',function(e){
    var b=e.target.closest('[data-q]');if(!b)return;
    if(e.target.closest('a'))return;
    if(e.target.closest('.peek')&&!e.target.closest('button'))return;   /* 展開區可選取文字，不收合 */
    if(e.target.closest('[data-close]')){S.peek=null;renderTopics();return}
    peekItem(b.getAttribute('data-org'),b.getAttribute('data-q'));});
  el('p-probe').addEventListener('change',function(e){
    var k=e.target.getAttribute('data-ask');if(k===null)return;
    S.asked[k]=e.target.checked;e.target.closest('.probe').classList.toggle('done',e.target.checked);});
  el('f-persona').addEventListener('change',function(){S.persona=this.value;rebuild();remember()});
  el('f-level').addEventListener('change',function(){S.level=this.value;rebuild();remember()});
  showHint();
  var st=null;
  el('f-search').addEventListener('input',function(){clearTimeout(st);
    st=setTimeout(function(){renderOrgs();renderTopics()},150);});
  el('orgq').addEventListener('input',renderOrgs);
  el('btn-make').addEventListener('click',function(){
    if(!S.peek)return;
    var it=S.peek,org=null,i;
    for(i=0;i<ORGS.length&&!org;i++)if(ORGS[i].items.indexOf(it)>=0)org=ORGS[i];
    if(!org)return;
    S.seed=1000+Math.floor(Math.random()*9000);S.peek=null;
    selectItem(org.org,it.q,'dlg');});
  el('btn-random').addEventListener('click',function(){randomPick(false)});
  el('btn-random-org').addEventListener('click',function(){
    if(!S.browse&&!S.org){flash('said','請先選一個局處');return}randomPick(true);});
  el('btn-reroll').addEventListener('click',function(){
    S.seed=1000+Math.floor(Math.random()*9000);rebuild();flash('said','換了說法 · 腳本 #'+S.seed);});
  el('btn-copy').addEventListener('click',function(){copy(plainScript(),'本頁內容已複製')});
  el('btn-print').addEventListener('click',function(){window.print()});
  /* 鍵盤：Alt+1～5 切分頁 */
  document.addEventListener('keydown',function(e){
    if(!e.altKey)return;var n=parseInt(e.key,10);
    if(n>=1&&n<=PAGES.length){e.preventDefault();goPage(PAGES[n-1][0]);}});
}
function boot(){
  fetch('data/index.json').then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(meta){buildIndex(meta);init();
    csLoadBank(function(){AIQ=null;renderTopics();if(S.item)rebuild();});},function(){
    el('cur-q').textContent='題庫載入失敗，請確認網路後重新整理';
    el('ov').textContent='載入失敗';
  });
}
boot();
})();
</script>
