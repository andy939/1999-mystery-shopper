sms=87415A8B9CE81B16&s=11C6FE63C30AA574","d":"2009-05-12","sid":"11C6FE63"},{"q":"臺北市愛心悠遊卡相關FAQ","a":"Q1：愛心悠遊卡每月免費點數或票卡內自行加值之金額該如何查詢(含欲查詢是否有扣款錯誤之情形)？\nA1：\n1.持卡至臺北捷運各站詢問處旁的自動查詢機或於本市12區公所之悠遊卡展期機可查詢該票卡最後6筆刷卡(含加值)紀錄。\n2.持卡至7-11免費查詢該票卡最後6筆刷卡(含加值)紀錄，如需查詢較早(最後6筆)以前的刷卡(及交易)紀錄請至悠遊卡公司網站-悠遊卡歷史交易查詢(https://ezweb.easycard.com.tw/search/CardSearch.php)或電洽悠遊卡股份有限公司客服專線查詢；電話(市話直撥)412-8880(手機及金馬地區請加02)。\nQ2：愛心悠遊卡上車不能刷怎麼辦？\nA2：若愛心悠遊卡使用時發生問題，請持卡至區公所檢查，送修期間可先發與替代卡，票卡將後送製卡公司修復。\nQ3：愛心陪伴卡單獨使用有優待嗎?\nA3：愛心陪伴卡需緊接在愛心卡之後使用方享有半價優待，單獨使用以全票計費。\nQ4：愛心悠遊卡可以免費搭乘捷運嗎？\nA4：已於110年1月1日起，愛心卡優惠點數不分敬老註記與否皆擴大於臺北捷運使用(為原票價4折，且優先扣免費點數)\nQ5：愛心悠遊卡每月免費點數可以累計嗎？\nA5：自115年7月1起，每月免費優待600點(1點1元)不累計至次月，每月均重新起算。\nQ6：愛心悠遊卡有使用期限嗎?\nA6：\n1.使用期限為半年(6個月)。\n2.每半年（6個月）必須展期一次（帶身分證件、身心障礙手冊及悠遊卡）可至區公所、臺北捷運全線各站查詢機或有儲值服務之便利商店皆可展期。\n3.若逾半年未展期，即鎖卡，可至臺北捷運全線各站查詢機辦理自動逾期展期作業。\nQ7：愛心悠遊卡，遺失或損壞應備何文件重新辦理？\nA7：\n1.申請補發票卡，得由持卡本人或授權委託他人，備妥代理人之身分證、印章、委託書及申請人之身分證(愛心卡者需另備身心障礙手冊或證明，55歲以上原住民者需另備原住民身分證明文件)、兩吋彩色照片1張、印章與製卡費用100元(如補發愛心悠遊卡及愛心陪伴卡需200元)，至臺北市各區公所提出申請。\n2.票卡故障者需將票卡繳回，若屬自行損壞需另備製卡費用10","u":"臺北市公共運輸處綜合規劃科","h":52913,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EF90141C6AF495F7","d":"2025-02-24","sid":"EF90141C"},{"q":"申請個人計程車行，有何資格條件限制？如何申請？","a":"一、30歲以上，65歲以下，連續持有有效之執業登記證6年以 上(領有身心障礙手冊之計程車駕駛人不受限制） 。\n二、持有有效小型車職業駕駛執照。\n三、臺北市設有戶籍。\n四、未曾有犯重大刑事案件。\n五、最近三年內有道路交通管理處罰條例第六十一條第三項、第六十三條第一項應受記點處分及第六十八條第二項前段所列之違規行為。\n六、最近5年內無受吊扣駕駛執照處分。\n七、最近3年內無計程車乘客申訴紀錄。\n請親自攜帶下列證件到臺北市區監理所(八德路4段21號1樓計程車業務窗口，公共運輸處派駐臺北市區監理所櫃檯) 填寫申請個人車行表格：\n一、身分證正本及影本。\n二、職業駕駛執照正本及影本。\n三、計程車駕駛人執業登記證正本及影本。\n四、印章。\n五、領有身心障礙手冊之計程車駕駛人，請檢附正本及影本。\n六、檢附汽車駕駛人經歷證明書。","u":"臺北市公共運輸處一般運輸科","h":51122,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DA69765C983093EA","d":"2009-05-12","sid":"DA69765C"},{"q":"民眾搭乘計程車該如何維護自身權益？","a":"若乘客於搭車時，發生司機繞路、拒載或刑事等其他違警案件，可記下車牌號碼、駕駛執業登記證、發生時間、地點等相關資料，向當地警政機關申訴，經查證屬實，將根據案情，依道路交通管理處罰條例裁處。\n若乘客於搭車時，發生司機未依規定收費、超收車資或計費表不實及服務態度不佳等案件，可記下車牌號碼、駕駛執業登記證、發生時間、地點等相關資料，向公共運輸處申訴，經查證屬實，相關單位將根據案情，依度量衡法、公路法裁處。\n若乘客於搭車時，發生個人物品遺失情事，可記下車牌號碼、駕駛執業登記證、發生時間、地點等相關資料，向交通警察單位請求協助，相關電話如下：\n臺北市政府警察局交通警察大隊(日)23752100 (夜)23116409\n臺北市公共運輸處27592677\n新北市政府交通局8965-4555\n新北市政府警察局交通警察大隊22258205\n基隆市警察局24232151","u":"臺北市公共運輸處一般運輸科","h":41874,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BB32F7A39CF66C1D","d":"2013-01-14","sid":"BB32F7A3"},{"q":"我想要搭公車從A點到B點，請問怎麼坐？","a":"您可至「大臺北公車」網站(https://ebus.gov.taipei)查閱，請點選右上側「轉乘規劃」，鍵入起點及迄點後，即可得知相關公車路線、轉乘站位及時刻資訊，歡迎多加利用。","u":"臺北市公共運輸處大眾運輸科","h":36254,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=371B32D8EB888C56","d":"2013-01-14","sid":"371B32D8"},{"q":"公車停靠區除了停靠大眾公車外，還可停靠其他車種嗎？(如：校車、遊覽車)","a":"依「道路交通安全規則」第111條第1項第2款規定非公車不得於公車招呼站臨時停車。另由政府機關或民間機構以自用大客車或向公路汽車客運業、市區汽車客運業或遊覽車客運業者租用車輛，用以提供民眾免費接駁服務之路線，可依「臺北市辦理免費接駁路線申請設站審查作業要點」向公共運輸處申請。","u":"臺北市公共運輸處大眾運輸科","h":32879,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CF86E3D68B002F55","d":"2009-12-15","sid":"CF86E3D6"},{"q":"市府轉運站與周邊基地之連通方式為何？","a":"市府轉運站地下二層連結通道係連接捷運市政府站2號出口及統一國際大樓地下通道，自市府捷運站2號出站後，可經由市府轉運站地下二層連結通道、統一國際大樓地下通道一路通往市政府周邊；另可依指標由市府轉運站大樓地下2樓經「統一時代百貨美食生活館」及「統一國際大樓」抵達臺北市政府北側之地下連通道出入口，至1樓即可抵達市政大樓北區大門入口。","u":"臺北市公共運輸處綜合規劃科","h":32631,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1AD9F6F6A1C526E0","d":"2013-01-14","sid":"1AD9F6F6"},{"q":"搭乘公車時，可以攜帶寵物嗎？","a":"1.乘客攜帶小動物，應裝於寵物箱或小容器內，且包裝完固，無糞便、液體露出之虞，動物之頭尾及四肢均不得露出，每位乘客以攜帶1件為限且體積不得超過長55公分、寬45公分、高40公分。攜帶之小動物，應就近置放身邊妥慎照顧，不得放置於座位或行李架或車廂通道。但經公路主管機關核定之路線或班次得免裝寵物箱或小容器者，不在此限。另為防制禽流感疫情，禁止旅客攜帶鳥禽（如經濟動物雞、鴨、鵝、火雞、鵪鶉及鴕鳥等），惟小型寵物鳥不在此限，其裝載容器體積件數比照前項規定。 2.依據汽車運輸業管理規則第72條規定不宜隨客車運送之動物類，汽車客運業者可予拒絕運送，但視覺、聽覺、肢體功能障礙者攜帶之導盲犬、導聾犬、肢體輔助犬，或導盲犬、導聾犬、肢體輔助犬專業訓練人員於執行訓練時攜帶之幼犬不在此限。","u":"臺北市公共運輸處業務稽查科","h":32020,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=00A2A0339852BF9B","d":"2019-10-01","sid":"00A2A033"},{"q":"市府轉運站是否設置小客車臨時接駁區及計程車排班區？","a":"本案於地下1樓設有汽車臨時接駁區及計程車排班區。另導引標誌照片及平面示意圖請參照下方圖示(如圖1~2)","u":"臺北市公共運輸處綜合規劃科","h":31128,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=59CA45DEF8A3F930","d":"2013-01-14","sid":"59CA45DE"},{"q":"市府轉運站是否有設置汽車、機車及自行車停車場？","a":"市府轉運站設有收費停車場，共設置汽車595席、機車473席、自行車20席，自行車停放位置於站外的興雅路側，請多加利用。","u":"臺北市公共運輸處綜合規劃科","h":29705,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=84CC38439E57F64E","d":"2013-01-14","sid":"84CC3843"},{"q":"搭程計程車時，請司機開後車箱放置物品，是否有規定要付費？","a":"依據臺北市政府交通局96年10月18日北市交三字第09634119301號公告，無線電叫車及開行李廂皆不須加收服務費。","u":"臺北市公共運輸處一般運輸科","h":29379,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D96493237E1C14FE","d":"2010-01-05","sid":"D9649323"},{"q":"計程車招呼站之排班相關規定","a":"1.計程車招呼站於標誌牌面有說明計程車排班時間，並禁止駕駛離開。\n2.部分站位會加掛附牌說明排班時段外與國定假日開放一般車輛停放並依該路段公告費率收費。\n3.依據汽車運輸業管理規則第91條規定，「多元化計程車接受消費者提出之乘車需求以預約載客為限，不得巡迴攬客或於計程車招呼站排班候客」。","u":"臺北市公共運輸處一般運輸科","h":29097,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=72F2D556C7AEF6ED","d":"2009-05-12","sid":"72F2D556"},{"q":"本市如何提供公車間轉乘優惠？","a":"依據臺北市聯營公車轉乘優惠補貼作業要點第3點規定，公告指定享有轉乘優惠之本市聯營公車及大眾捷運系統，民眾使用經本處核准支付本市聯營公車及大眾捷運系統票價之電子票證，於轉乘優惠容許時間（一小時）內，為下列轉乘方式者，得依不同票種享有不同額度（半價）之優惠。\n一、經本處公告指定享有轉乘優惠之本市聯營公車，雙向轉乘本市聯營公車。\n二、經本處公告指定享有轉乘優惠之非本市聯營公車，單向轉乘本市聯營公車。\n三、非本市聯營公車單向轉乘經本處公告指定享有轉乘優惠之本市聯營公車。\n四、經本處公告指定享有轉乘優惠之大眾捷運系統，單向轉乘本市聯營公車。","u":"臺北市公共運輸處大眾運輸科","h":28166,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F62226B708551FBC","d":"2015-05-18","sid":"F62226B7"},{"q":"新一代學生悠遊卡如何享有學生票價優惠？","a":"1.新一代學生悠遊卡持卡人於北北基市區公車首次刷卡搭乘日起，享有20日學生票乘車優惠(逾期將自動轉為普通卡扣款)。\n2.請持卡人於購卡日起5日內提出記名申請，以便及早完成身分審核及記名作業，您可透過悠遊卡公司記名申請網頁、悠遊卡手機APP「Easy Wallet」或自備相關證明文件影本至悠遊卡客服中心領取記名申請書辦理申請。\n3.悠遊卡公司審核記名通過後，將通知持卡人至指定地點(四大超商(7-ELEVEN、全家便利商店、萊爾富、OK超商)、台北捷運各車站旅客詢問處、悠遊卡加值機或悠遊卡公司客服中心)，靠卡設定身分優惠效期，以繼續享有學生票價優惠。","u":"臺北市公共運輸處綜合規劃科","h":27037,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0A3AF7320D16C457","d":"2014-12-04","sid":"0A3AF732"},{"q":"可到哪裡購買新一代學生悠遊卡？","a":"自103年12月15日起，您可於四大超商(7-ELEVEN、全家便利商店、萊爾富、OK超商)、台北捷運各車站旅客詢問處及悠遊卡客服中心購買新一代學生悠遊卡。","u":"臺北市公共運輸處綜合規劃科","h":24161,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D85B6A82B6925759","d":"2014-12-04","sid":"D85B6A82"},{"q":"如何申請新增或遷移公車站牌及候車亭?","a":"請逕向臺北市公共運輸處申請，電話02-27274168。","u":"臺北市公共運輸處大眾運輸科","h":22696,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F34A3268EEDA3910","d":"2009-05-12","sid":"F34A3268"},{"q":"坐貓空纜車後，若再搭貓空遊園公車，是否需費用或有優惠?","a":"1.貓空遊園公車左線、右線，收費方式比照一般聯營公車採一段票計收。\n2.旅客使用悠遊卡搭貓纜轉搭遊園公車免費。\n3.欣欣客運貓空遊園公車另提供「續乘券」，民眾付費搭乘貓空遊園公車後，可於下車前主動向駕駛員索取續乘券1張，當日再次搭乘只要出示續乘券給駕駛員，就不用再次付費，若要再次搭乘，則於下車時再次索取續乘券1張，該續乘券亦僅限當日有效。","u":"臺北市公共運輸處大眾運輸科","h":19824,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C933A31AE0917430","d":"2009-05-13","sid":"C933A31A"}]},{"org":"聯合醫院","total":135,"items":[{"q":"請問如何申請診斷證明書，需要帶什麼證件？如果已申請過，還要再申請，是否需掛號請醫師開立？","a":"*限臺北市立聯合醫院就醫民眾\n*相關文件費用、受理時段、作業時間及各院區洽詢電話等資訊，請至臺北市立聯合醫院首頁→就醫指南→證明文件申請→診斷證明書及病歷複製本申請說明及注意事項查詢（ https://tpech.gov.taipei/News_Content.aspx?n=F3E85264F90187B0&s=6BD79411FD4B256A ）或可洽詢各院區業務窗口。\n一、首次申請：依據醫師法第11條：「醫師非親自診察，不得施行治療、開給方劑或交付診斷書。」開立診斷書，病人應親自就醫。\n*如病人本人因特殊狀況無法親自到院申請，代理人得持病人親自簽署之委託書到院辦理，原則上應由原診治醫師開立，若醫師離職或請假，則可掛「原就醫科別」之主治醫師依照原病歷記載開立。\n(一)門診病人：於門診掛號看診，由醫師診斷後開立。\n(二)急診病人：\n1.於急診就醫當時申請，由醫師診斷後開立。\n2.若離院當時未申請，日後需補開診斷證明書時，請親自至原就診院區掛號門診或急診申請，原則上應由原診治醫師開立，若醫師離職或請假，則可掛「原就醫科別」之主治醫師開立。【備註：依各院區醫師實際開診情形而調整。】\n(三)住院病人：\n1.住院治療期間請洽病房護理站辦理。\n2.若出院當時未申請，日後需補開診斷證明書時，請親自至原就診院區掛號門診申請，原則上應由原診治醫師開立，若醫師離職或請假，則可掛「原就醫科別」之主治醫師開立。\n二、已開立過：申請時無須掛號，請至各院區醫事課專責櫃檯辦理。\n三、首次申請出生證明書(英文)、死亡證明書(英文)：於本院出生者或曾於本院開立死亡證明書者，請先至各院區醫事課專責櫃檯辦理，核對應備證件俱全後，方可受理。申請日起 5個工作天，完成後由專人通知領取。\n四、網路申辦(限已開立過)：一般診斷證明書(中、英文)、死亡證明書(中、英文)、出生證明書(中、英文)、驗傷診斷證明書、死產及流產證明。\n五、申請資格及應備證件(供核對及影印留存)\n1.未成年者：(自112年1月1日起，依我國民法第12條規定，滿十八歲為成年。)\n2.法受監護宣告者：","u":"臺北市立聯合醫院","h":354453,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A9409E472DC8D891","d":"2017-03-01","sid":"A9409E47"},{"q":"請問體檢什麼時候可以做？","a":"星期一～星期五 (上午 09 ： 00 ～ 11 ： 00； 下午 13 ： 30 ～ 16 ： 00)，星期六 ( 上午 09 ： 00 ～ 11 ： 00)，請記得帶身分證及健保卡、兩張2吋照片。(汽、機車駕照體檢務必攜帶半年內近照一張)。 林中昆院區(林森)諮詢電話：2591-6681轉1290 忠孝院區諮詢電話：2786-1288轉8153 仁愛院區諮詢電話：2709-3600轉5205(星期二、四不提供居留及外勞體檢) 和平婦幼院區(和平)諮詢電話：2388-9595轉2217(平日下午延長到17:00) 和平婦幼院區(婦幼)諮詢電話：2391-6470轉1206(依照家醫科門診時間) 陽明院區諮詢電話：2835-3456轉5145 中興院區諮詢電話：2552-3234轉6246(依照家醫科體檢門診時間) 松德院區諮詢電話：2726-3141轉1140(只有基本體檢)\n「請留意各院區體檢診次開放時間皆有不同，建議民眾前往體檢時先於各院區掛號網頁查詢/去電確認當天是否有開診」","u":"臺北市立聯合醫院","h":331917,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6409AFC66EB6223B","d":"2017-03-31","sid":"6409AFC6"},{"q":"我想要接受匿名篩檢(愛滋及梅毒)抽血.其服務內容?","a":"〈愛滋病匿名篩檢諮詢服務〉提供日間及夜間匿名篩檢服務，篩檢項目為愛滋。採預約制，全程免費，地址為林中昆院區(台北市萬華區昆明街100號4樓)，電話：0979-306-875，預約專線服務時間為週一至週五上午08:00~12:00及下午13:00~17:00。\n〈當我們同在一起同志健康中心〉提供日間匿名篩檢服務，篩檢項目為愛滋、梅毒。採預約制，全程免費，地址為昆明防治中心(台北市萬華區昆明街100號5樓)，電話：02-2370-3738，預約專線服務時間為週一至週五09:00~12:00、13:00~17:00。","u":"臺北市立聯合醫院","h":250850,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4B5F940AB6A6F2F0","d":"2017-03-31","sid":"4B5F940A"},{"q":"聯醫各院區加護病房探病時間","a":"中興 ICU (MICU、SICU) 上午 11：00～11：30\n仁愛 ICU 上午 11：00～11：30\n陽明 ICU (CCU) 上午 11：00～11：30\n和平 ICU (AICU) 上午 11：00～11：30\n婦幼 ICU (小孩、成人) 上午 11：00～11：30\n忠孝 ICU 上午 11：00～11：30\n松德 ICU 上午 13：00～14：00","u":"臺北市立聯合醫院","h":137284,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3F51BABC880FA5D3","d":"2017-03-01","sid":"3F51BABC"},{"q":"報稅季節到了，醫院看診收據不見，可申請補發嗎?收費如何?","a":"*限臺北市立聯合醫院就診民眾\n可申請醫療費用證明，請攜帶身分證明文件(身分證、健保IC卡)，門診掛批櫃檯申請每次申請費用50元，若申請多份還是以次計算。","u":"臺北市立聯合醫院","h":115640,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3F442DCDC7F9E84A","d":"2017-03-31","sid":"3F442DCD"},{"q":"聯合醫院婚前健康檢查掛號資訊","a":"【中興院區】 ＊ 預約專線：2552-3234轉3127.3123 ＊ 地址：臺北市鄭州路145號 【仁愛院區】 ＊預約專線：2709-3600轉1061.1063 ＊地址：臺北市大安區仁愛路四段10號 【和平婦幼院區(和平)】 ＊預約掛號家庭醫學科門診時間 ＊諮詢專線：2388-9595轉2125 ＊地址：臺北市中華路二段33號 【和平婦幼院區(婦幼)】 ＊預約專線：2391-6470轉2551 ＊地址：臺北市福州街12號 【陽明院區】 ＊預約專線：2835-3456轉6919 ＊地址：臺北市雨聲街105號 【忠孝院區】 ＊預約專線：2786-1288轉6984 ＊地址：臺北市南港區同德路87號\n預約時間：週一至週五上午八點至下午五點","u":"臺北市立聯合醫院","h":99131,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AF3348411209F967","d":"2017-03-01","sid":"AF334841"},{"q":"身心障礙者鑑定申請流程相關資訊","a":"設籍於臺北市市民可向臺北市任一區公所社會課提出申請，填寫「臺北市身心障礙證明申請表」，由區公所發給「身心障礙者鑑定表」後，至指定之鑑定醫療機構辦理鑑定。經鑑定符合行政院衛生福利部所定「身心障礙等級」者，由區公所主動核發身心障礙證明。(若不方便親自至區公所辦理申請，可郵寄申請，請逕洽戶籍所在地區公所社會課)\n1. 初次鑑定：\n（1） 領表地點：臺北市任一區公所社會課，填具申請表後辦理領表程序。\n（2） 所需文件：\n★申請人國民身分證（含正反面影印本），如申請人未滿14歲尚未請領國民身分證者請檢附戶口名簿。\n★申請人印章。\n★申請人3個月內1吋半身照片3張。\n★如申請人無法親自前往公所社會課需委託他人辦理領表相關手續，請檢附以上文件及受託者身分證明文件及印章（或簽名）。\n2. 重新鑑定：\n身心障礙者因障礙情形改變時，依鑑定醫師之指定重新鑑定日期，申請重新鑑定，或是自行申請重新鑑定。\n（1） 領表地點：臺北市任一區公所社會課，填具申請表後辦理領表程序。\n（2） 所需文件：\n★申請人國民身分證（含正反面影印本），如申請人未滿14歲尚未請領國民身分證者請檢附戶口名簿。\n★申請人印章。\n★申請人3個月內1吋半身照片3張。\n★如申請人無法親自前往公所社會課需委託他人辦理領表相關手續，請檢附以上文件及受託者身分證明文件及印章（或簽名）。\n★未至重新鑑定期限而自行申請重新鑑定者，需檢附3個月內醫師診斷證明書。\n3. 到宅鑑定：\n全癱無法自行下床、需24小時使用呼吸器或維生設備、長期重度昏迷者、或有其他肢體行動特殊困難者無法自行至醫療機構辦理身心障礙者鑑定。\n（1） 辦理地點：申請人戶籍所在地公所社會課，由申請人親屬或是受託人填具身心障礙者到宅鑑定申請書。\n（2） 所需文件：\n★申請人國民身分證（含正反面影印本），如申請人未滿14歲尚未請領國民身分證者請檢附戶口名簿。\n★申請人印章。\n★申請人3個月內1吋半身照片3張。\n★受託人身分證明文件、印章。\n★公私立醫院診斷證明書，若無法取得診斷證明書者，請里長開具證明（身心障礙者到宅鑑定里長證明），惟如鑑定醫師對該鑑定之適法性有爭議或對該鑑定結果","u":"臺北市立聯合醫院","h":95032,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD424551F8CD7B54","d":"2017-03-02","sid":"CD424551"},{"q":"請問臺北市立聯合醫院各院區連絡地址、電話？","a":"臺北市立聯合醫院各院區電話代表號及地址及電話： 一、中興院區電話：25523234，地址：臺北市大同區鄭州路145號。 二、仁愛院區電話：27093600，地址：臺北市大安區仁愛路四段10號。 三、忠孝院區電話：27861288，地址：臺北市南港區同德路87號。 四、陽明院區電話：28353456，地址：臺北市士林區雨聲街105號。 五、松德院區電話：27263141，地址：臺北市信義區松德路309號。 六、和平婦幼院區電話(和平)：23889595，地址：臺北市中正區中華路二段33號。 和平婦幼院區電話(婦幼)：23916470，地址：臺北市中正區福州街12號 。 七、林森中醫昆明院區電話(中醫)：23887088，地址：臺北市萬華區昆明街100號。 林森中醫昆明院區電話(林森)：25916681，地址：臺北市中山區林森北路530號。 林森中醫昆明院區電話(昆明)：23703739，地址：臺北市萬華區昆明街100號3F。","u":"臺北市立聯合醫院","h":94480,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FB0F86FF28525604","d":"2017-03-31","sid":"FB0F86FF"},{"q":"兒童發展遲緩的評估","a":"兒童的發展，主要是神經肌肉系統，隨著年齡的增長及與環境間的互動，而產生身體及心智各方面功能增加、成熟的過程。這種發展包含了動作平衡、認知學習、語言溝通、生理發展、心理社會發展及生活自理等各個面向，在一生中持續進行，包括質與量的進步。每個兒童的發展里程碑因受遺傳、生理疾病、心理社會環境與學習等因素的影響，而有個別差異。但是如果小朋友在某些面向的發展，較同年齡孩子明顯落後（一般定義為比97.5％的其他同年齡兒童差），甚至退步（喪失已發展好的功能），即可能為發展遲緩。兒童是否有發展遲緩可由兒童的發展史、外觀和姿態，加上是否有異常的行為問題或不正常的軟性神經學徵兆加以判斷。\n由於適當的復健及教育，可能讓某些六歲以下發展落後的小朋友能趕上同儕或是減輕未來障礙的程度，一般而言，我們稱六歲以下有發展障礙的兒童為發展遲緩，六歲以上有全面性發展障礙的兒童則稱為智能障礙。根據文獻統計，發展遲緩兒童的發生率約為 5-10 %，其中大約九成為輕度或中度遲緩，重度遲緩約占一成。\n造成發展遲緩的原因有很多,它可能是某種疾病本身的一個表徵，如唐氏症或其他染色體異常兒童可能表現出動作、智能或語言發展遲緩；也有可能是環境因素所造成的，如家長教養方式偏差或受虐等。每一個發展遲緩兒童可能存在一個或多個病因，但也有三分之二發展遲緩兒童原因未明。病因性的診斷分類可作為長期治療方針的擬定，預後的判斷，遺傳諮詢及疾病預防的重要參考。在診斷分類中區分兒童是否有退化的現象是十分重要的一環。這些造成退化的神經疾病常常合併其他器官的問題，或是有家族史。\n發展遲緩是有可能因早期療育而進步的。早期發現，早期治療可減輕多數父母及社會的負擔。如何早期發現發展遲緩兒童，有賴於醫師及父母的警覺性。呼籲父母帶小朋友依兒童健康手冊，定期至小兒科醫師處做兒童健康檢查。另外，醫師在追蹤高危險群兒童(如早產、先天性畸形、曾罹患腦炎、腦膜炎、腦出血、水腦或腦缺氧兒等等)應提高警覺，因這些兒童日後發育過程中出現發展遲緩之機率比一般兒童高，所以更需經常做發展評估。","u":"臺北市立聯合醫院","h":87807,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C8DE0621DE672FA7","d":"2017-03-15","sid":"C8DE0621"},{"q":"請問愛滋病慢性病處方箋，在林中昆（昆明）院區領藥方式及時間？","a":"林中昆（昆明）院區\n領藥時間星期一～星期六(上午08:00～12:00)，星期一～星期五(下午13:30～17:00)，星期二及星期五(夜間17:30～21:00)。\n持慢性連續處方箋者僅需至批價櫃檯批價，再至藥局領藥即可。","u":"臺北市立聯合醫院","h":83664,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8F9EE382D9653F50","d":"2017-03-31","sid":"8F9EE382"},{"q":"外籍勞工健檢項目有哪一些？","a":"1.外籍勞工(入境檢及返鄉前)項目包括身高、體重、視力、血壓、體溫、身體理學檢查、梅毒(RPR)、糞便(stool)、胸部X光、德國麻疹抗體、麻疹、皮膚病漢生病檢查。 (懷孕測試及b型肝炎己取消)→若是定期檢查，不需驗德國麻疹、麻疹\n2.外籍老師體檢項目包括身高、體重、視力、血壓、體溫、身體理學檢查、梅毒(RPR)、胸部X 光、麻疹、德國麻疹抗體。\n3.居留體檢項目包括、梅毒(RPR)、德國麻疹抗體、麻疹、糞便(stool)(依居留或定居健康檢查項目表-免驗腸內寄生蟲糞便檢查之國家/地區表)、胸部X 光、皮膚病漢生病檢查—(依居留或定居健康檢查項目表-免驗漢生病檢查之國家/地區表)。\n以上 請參閱衛生福利部疾病管制署 http://www.cdc.gov.tw/rwd (路徑：首頁>國際旅遊與健康>外國人健檢)取得相關資訊。","u":"臺北市立聯合醫院","h":82916,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8FDE4A236EABFA92","d":"2017-03-01","sid":"8FDE4A23"},{"q":"初診可否預約掛號？初診掛號需持什麼證件？門診所需費用約多少？持殘障手冊、重大傷病卡是否可減免費用？","a":"1.所有院區皆可受理初診預約掛號，並於當日門診時先至櫃檯完成初診報到手續。(松德院區：兒童青少年心理衛生門診初診者在市立聯合醫院曾經有病歷號看診過，第一次至松德院區必須當天臨櫃掛號)\n2.初診掛號請攜帶健保卡及身份證明文件以供資料核對。\n3.一般門診：掛號費50+基本部分負擔240元(藥品部分負擔另計10-300元)\n4.持殘障手冊就醫：免收掛號費，基本部分負擔50元(藥品部分負擔20-200元)、持重大傷病卡就醫者，則只需繳交掛號費50元。","u":"臺北市立聯合醫院","h":79070,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=448D943C4EE55FA3","d":"2017-03-31","sid":"448D943C"},{"q":"自動掛號機掛號的號碼會不會比櫃檯的號碼後面?預約門診可預約幾天內？","a":"自動掛號機上午門診七點開始掛號，與客服中心、語音、網路、APP同步，臨櫃八點才開始;中午及下午時段為一點開始與臨櫃掛號時間相同。診間醫令預約掛號為90天；網路、語音、櫃檯、客服中心、自動掛號機、APP預掛期間為28天。","u":"臺北市立聯合醫院","h":76387,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A99AB8FCF72416DC","d":"2017-03-31","sid":"A99AB8FC"},{"q":"刺激寶寶感官發展的小幫手","a":"我們無時無刻都在不停接收外在環境給予我們的刺激，經由各種感覺的接受器，透過神經傳導，送到我們的大腦中來進行整合與思考，分辨出重要與不重要的刺激，解釋出各種刺激的對應方法，並且透過行動表現出來，再由外界回饋的反應形成經驗，為應付下次的刺激預作準備。在學齡前，幼兒的大腦正在快速的發育，各個神經元相互複雜的連結，形成一個緊密結合的神經網路，這也正是一個人心智成長的過程。而所謂的感覺統合（Sensory Integration），便是大腦組織整合四面八方所傳來的感覺訊息，為應付環境的狀況與需求，做出適應性反應的一個過程。\n幼兒種種外顯的行為表現，就是大腦與神經系統功能良好與否的判斷依據，當幼兒表現出來的行為，與同年齡一般兒童不太一樣，或是沒有依循著發展里程碑發展時，我們便會猜想，幼兒的大腦，發生了什麼問題。若是經由醫師詳細的檢查，排除了是大腦結構異常、缺氧傷害、感染、癲癇、代謝性疾病、智能不足、自閉症等等的問題，仍有發展遲緩的現象，原因常常就是因為感覺統合不良所導致。當然，若有大腦結構異常、缺氧傷害、感染、癲癇、代謝性疾病、智能不足、自閉症等等的問題，更是常常合併有感覺統合不良的問題。\n感官發展包括觸覺、聽覺、視覺、味覺、嗅覺、本體感覺等等，幼兒藉由各種感覺，來認識自己的身體和周遭的環境，學習適時扮演適當的角色，並且適當的與他人相處。當孩子在發展上出現問題時，旁人往往只會注意到他在外表所顯現出來的煩躁、哭鬧、吼叫、抗拒、丟東西、自傷或攻擊他人等情緒、行為，而不知道根本的原因出在哪裡。這時就需要專業的醫師來做專業的鑑別診斷，如果倒果為因或是判斷錯誤，往往使事情失去焦點，造成家庭紛爭，而問題將會持續，且變得越來越難解決。\n感覺統合不良的表現，如：（1）粗動作協調不良的孩子，行動笨拙，運動遲鈍，畏懼跨越障礙物或階梯，常跌倒受傷，或打碎物品，學習動作總是慢半拍，如丟球、踢球有困難，不會騎三輪腳踏車等；（2）口腔動作技巧欠佳的孩子，說話口齒不清，不喜歡言語表達；（3）手部精細動作不靈敏的孩子，生活自理常倚賴大人，不會使用剪刀，不會穿脫衣服及扣釦子，鞋子穿不好，字也寫得歪七扭八；（4）視知","u":"臺北市立聯合醫院","h":73378,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=310AA63E99389437","d":"2017-03-15","sid":"310AA63E"},{"q":"如何啟發幼兒智力發展：","a":"要循序漸進\n要根據每個孩子在每個不同發展階段所承受的能力而行，不可揠苗助長，實行高強度的刺激，或是高壓力的學習。這些做法都會使得孩子討厭學習，得到反效果。\n要啟發誘導\n要根據孩子好發問的特點，耐心地啟發誘導，引發孩子的學習興趣，激發孩子的學習熱情，切忌死記硬背，而是要想辦法鼓勵邏輯推理或是想像創造的能力。\n運用感官去體驗\n讓孩子的聽覺、視覺、嗅覺、味覺、觸覺以及運動本體感覺都參與對事物的認識活動，體驗各種不同的感覺，藉由各種感覺來認識自己的身體和周遭的環境。\n在遊戲中學習\n遊戲是孩子們的特殊學習方式，在遊戲中孩子可以不知不覺地記住許多事物並產生許多聯想，在遊戲中所獲得的體驗也是最易牢記的。\n主動學習\n引導孩子主動學習的積極性，不是填鴨地讓他們獲得知識，而是靈活地讓他們自己去尋找知識，使他們不僅有學習的興趣，還有良好的學習習慣。","u":"臺北市立聯合醫院","h":72794,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DE22C72D3E95C042","d":"2017-03-15","sid":"DE22C72D"},{"q":"有身心障礙證明者至臺北市立聯合醫院就醫時，是否需要掛號費？基本部分負擔？藥品費？","a":"持有身心障礙手冊者且為健保身份則免收掛號費；健保部分負擔及藥品費則比照健保規定收費，故需自行繳費。","u":"臺北市立聯合醫院","h":71905,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5C122D8982247492","d":"2017-03-31","sid":"5C122D89"},{"q":"我想要心理諮商如何安排？","a":"心理衛生中心暨健康服務中心諮商：有心理困擾或人際、社會、職場困擾，想和心理師或諮商師協談，請至十二區健康服務中心或心理衛生中心，皆有設諮商服務。\n聯合醫院精神科門診與心理衛生中心附設門診：聯合醫院各院區及政大、心理衛生中心皆有設精神科門診服務。","u":"臺北市立聯合醫院","h":71592,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3F04996C8DC61F9","d":"2017-03-31","sid":"D3F04996"},{"q":"如果不幸遭受性侵害時，要注意哪些事情？","a":"一、如果您不幸遭受 性侵害 時，請記得配合下列事項：\n(一)不要更換衣服或毀壞衣服。\n(二)不要沐浴沖洗、刷牙或上廁所以保留更多證物。\n(三)立刻到醫院接受驗傷及治療。\n(四)如疑似因飲用藥物或飲料而致受暴，到醫院後為爭取時效做檢驗以取得証明，應先告知醫師。\n(五)主動告知社工人員聯絡電話及地址，以便安排後續相關檢查及治療。\n二、在醫院期間醫護人員除了協助驗傷診療外，也為您安排了相關檢驗，因報告需等待一至二週，且有些疾病因為空窗期的關係無法立即被檢驗出來，建議您可參考下表時間再回醫院複診。\n提醒您！回醫院複診是很重要的！讓您能更清楚瞭解身體的狀況，進 一步接受治療，以降低傷害。\n時間\n檢驗項目\n急診當天\n一~二週後\n請至婦產科門診追蹤，瞭解檢驗報告結果\n四~六週後\n請至婦產科門診追蹤，驗孕、B肝檢查、HIV、梅毒 (預約精神科可於2週及4週)\n三個月後\n請至婦產科門診追蹤梅毒、HIV、淋病…等\n六個月後\n請至婦產科門診追踨B.C肝、梅毒、HIV\n三、若您有嚴重失眠、體重下降等生理反應或上述情形，需要就醫時，可就診精神科或來電本院區社會工作課，我們將依您的狀況和意願，提供您需要之協助。\n※諮詢電話：\n中興院區社會工作課02-25523234#3615、3620\n仁愛院區社會工作課02-27093600#3519、3521\n忠孝院區社會工作課02-27861288#1746、8156\n陽明院區社會工作課02-28353456#6291、5136\n和平院區社會工作課02-23889595#2023、2025\n婦幼院區社會工作課02-23916470#1910、2610\n松德院區社會工作科02-27263141#1141\n院本部社會工作室  02-25553000 #2179\n※門診預約\n(一)24小時預約掛號專線(02) 2555-3000（或1999＊888限北市）\n(二)24小時語音電話預約(02) 2181-1995\n(三)網路預約 [連結]\n婦幼院區社會工作課","u":"臺北市立聯合醫院","h":68292,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4F7C19748012900C","d":"2017-03-31","sid":"4F7C1974"},{"q":"請問抽血驗(梅毒及愛滋)可在哪些院區看抽血報告嗎?","a":"可在忠孝、仁愛、和平婦幼(和平院區)、陽明、中興、林中昆(昆明)院區抽血並看報告。","u":"臺北市立聯合醫院","h":68069,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=06D69E3E29FFC6C2","d":"2017-03-31","sid":"06D69E3E"},{"q":"自費健檢如何辦理？","a":"1、自費健檢依檢查項目分為多種價位不同之檢查套餐，讓受檢者依其需要挑選套餐\n2、受檢者需先來電預約時間，生理期請勿排檢，受檢當日請於上午８點到健檢中心報到\n3、注意事項 受檢者需空腹８小時，依其檢查項目分為半日及全日體檢，所有檢查將於一日內完成，所以將不提供單獨房間休息。所選定套餐的檢查項目將不提供更換項目，所以請受檢者事前妥善考慮。\n自費體檢(全身)請至各院區健診中心安排。\n中興院區 2552-3234#3123\n陽明院區 2835-3456#6919\n忠孝院區 2786-1288#6984\n仁愛院區 2709-3600#1063\n和平婦幼院區(和平) 2388-9595#2732\n和平婦幼院區(婦幼) 2391-6470#2551\n林森中醫昆明院區 2591-6681#1290","u":"臺北市立聯合醫院","h":66937,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=06D8D4B4846AD814","d":"2017-03-31","sid":"06D8D4B4"},{"q":"如何申請出生證明?","a":"*限臺北市立聯合醫院出生者\n*相關文件費用、受理時段、作業時間及各院區洽詢電話等資訊，請至臺北市立聯合醫院首頁→就醫指南→證明文件申請→診斷證明書及病歷複製本申請說明及注意事項查詢（ https://tpech.gov.taipei/News_Content.aspx?n=F3E85264F90187B0&s=6BD79411FD4B256A ）或可洽詢各院區業務窗口。\n一、中文出生證明\n(一) 首次申請：需備父母親身分證正本，其中缺一者請提供戶口謄本以茲證明，並至病房護理站辦理。\n(二) 已開立過申請：\n1. 本人申請：需備身分證正本或其他足以證明身分之文件正本(外籍人士須具備護照或居留證)，至各\n院醫事課專責櫃檯辦理。\n2. 法定代理人申請：需備出生者身分證正本或戶口名簿正本(未領有身分證之未成年者）、法定代理\n人身分證正本、與病人關係證明文件(戶口名簿、戶籍謄本或法院裁定書等正本)，至各院區醫事課\n專責櫃檯辦理。\n二、英文出生證明\n(一) 應備證件：\n1. 出生證明書(中文)正本\n2. 父母親及出生者身分證正本\n3. 戶口名簿正本或戶籍謄本正本\n4. 父母親及出生者護照正本\n*如無出生證明書(中文)正本者，請來電洽詢病歷室或請至戶政事務所辦理。\n*本項如由代理人申請，須備齊前述資料及委託同意書、代理人身分證正本\n(二) 作業時間：申請日起5個工作天，完成後由專人通知領取。\n(三) 申請地點：各院區醫事課專責櫃檯辦理。\n(四) 自行要求附加無正式證件之別名及綽號等皆無法受理。\n三、注意事項\n(一) 凡申請出生證明者，若產婦因個人因素或家庭因素，例如：雙方離異或改名等，應依法律規定辦理\n( 即先至戶政單位辦理完成後再至本院，需附戶籍謄本正本。)\n(二) 小孩之戶籍謄本英譯版，內須含出生年、月、日(由戶政單位認定發給)。\n(三) 代辦：代理人申請者除備妥應備證件外，必須帶代理人之身分證正本，及產婦委託同意書(生產者以\n外皆視同受託人)。\n(四) 代領：請攜帶代領者身分證件及繳費收據領取。","u":"臺北市立聯合醫院","h":66279,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A56BAECA0A1A2262","d":"2021-07-07","sid":"A56BAECA"},{"q":"我想具名抽血驗梅毒及愛滋，可預約掛號嗎?","a":"具名抽血驗梅毒及愛滋，可預約掛號方式如下：\n1.網路掛號：\nhttp://webreg.tpech.gov.tw/RegOnline1_1.aspx?ChaId=A105&tab=1&ZCode=SP&thidname=%u6606%u660E%u9662%u5340\n2.手機下載「北市聯醫掛號」APP\n3.電話掛號：02-2555-3000轉9或撥1999轉888。\n4.現場掛號：(含外籍人士)煩請親自攜帶身分證、健保卡、駕照或有效期內之護照及居留證等相關證件至林中昆(昆明)院區門診櫃台辦理(萬華區昆明街100號3樓)。\n5.性病及愛滋病諮詢電話：02-23703738。","u":"臺北市立聯合醫院","h":65221,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B40C014E2CA0C776","d":"2017-03-31","sid":"B40C014E"},{"q":"我要申請住院治療期間之病歷摘要，辦理保險公司住院醫療給付，請問如何辦理？","a":"*限臺北市立聯合醫院就醫民眾\n*相關文件費用、受理時段、作業時間及各院區洽詢電話等資訊，請至臺北市立聯合醫院首頁→就醫指南→證明文件申請→診斷證明書及病歷複製本申請說明及注意事項查詢（ https://tpech.gov.taipei/News_Content.aspx?n=F3E85264F90187B0&s=6BD79411FD4B256A ）或可洽詢各院區業務窗口。\n一、保險公司申請：\n(一)  國內保險公司病歷資料申請為對象，凡在中華民國境內有合法登記的保險公司、郵局或銀行附設的保險理賠部門皆可申請。\n(二) 請保險公司直接來函本院申請，並檢附病人病歷資料調閱授權書(保險公司專用)及相關證明文件資料。\n(三) 依據臺北市政府衛生局114年7月28日「臺北市立醫療院所醫療收費基準」函之修正規定辦理。本院自114年8月1日起，調整「保險公司病歷查詢費」為1,500元。\n二、民眾自行申請：請住院病人於出院後 5 個工作天，至各院區醫事課專責櫃檯申請出院病歷摘要影本。\n(一)  申請資格及應備證件(供核對及影印留存)：\n1. 本人申請：需備身分證或其他足以證明身分之文件正本 (如戶口名簿、有照片之健保卡等，外籍人士須具備護照或居留證)。\n2. 代理人申請：需備雙方身分證正本及病人委託同意書正本。\n(二)  費用：每份50元，第二份起比照病歷影印每頁4元  (雙面影印計2 頁)。","u":"臺北市立聯合醫院","h":64683,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=095C30E47C3EFA88","d":"2017-03-31","sid":"095C30E4"},{"q":"請問肺結核剛開始有什麼症狀？","a":"初期的肺結核大部分沒有明顯症狀，若有長期咳嗽（超過2～3周以上）、咳嗽有痰、胸痛、沒有食慾、全身倦怠、體重減輕、發燒等，若出現上述症狀時，需儘速就醫診治。","u":"臺北市立聯合醫院","h":64190,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=27DD7D889997305F","d":"2017-03-31","sid":"27DD7D88"},{"q":"請問愛滋病慢性病處方箋，可以到外面藥局領藥嗎？","a":"愛滋病慢性處方箋目前無法至外面健保藥局領藥，但是可至其他指定的人類免疫法醫事機構領取慢箋，僅限於處方箋上只有抗愛滋病毒藥物，不能有其他類藥物如高血壓或降血脂藥物。去其他指定醫事機構領取慢箋前，建議先打電話詢問是否備有處方箋內所有藥品，無缺藥情形再前往領藥。","u":"臺北市立聯合醫院","h":63688,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BCA68249AB8CAC96","d":"2017-03-31","sid":"BCA68249"}]},{"org":"交通局","total":132,"items":[{"q":"如果YouBike租賃站沒有車輛可租借或沒位置可以還車時該怎麼辦？","a":"YouBike全台北市已建置站點數眾多，多數站點步行150公尺即有其他站，民眾可下載YouBike App查詢周邊可借車輛及可還站點，如遇站點無位可還，也可透過YouBike APP「滿站增時」功能，提供額外15分鐘免費時間，以利等候車位或騎乘至鄰站還車。","u":"臺北市政府交通局運輸管理科","h":146792,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B41D82DC1C98D64E","d":"2024-02-28","sid":"B41D82DC"},{"q":"兒童是指幾歲孩童？可否乘坐汽車前座？","a":"1.兒童是指12歲以下之孩童。(兒童及少年福利與權益保障法第2條規定)。\n2.依道路交通安全規則規定，兒童是不能乘坐於汽車之前座，兒童應坐於小型車之後座。\n如欲瞭解小型車附載幼童安全乘坐實施及宣導辦法，請至全國法規資料庫(https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0040038)參閱。","u":"臺北市政府交通局","h":104055,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=779C0CFA95CB1282","d":"2012-01-31","sid":"779C0CFA"},{"q":"於YouBike微笑單車場站如何操作借車和還車？","a":"YouBike之借還方式分為「會員借車」及「單次借車」兩種方式：\n一、會員借車：已經成為YouBike會員者，可於車輛車上機使用「靠卡借車」或「掃碼借車」：\n（一）靠卡借車流程\n1. 按「啟動靠卡」鈕喚醒車機\n2. 將電子票證置於感應區靠卡\n3. 螢幕顯示「請取車 本車請還於 2.0 停車柱」後，雙手握住把手並往後拉出車輛。\n4. 還車時，請將車輪對準導引槽並推入車柱，待車輛固定於車柱上卡槽，且螢幕顯示「還車成功」訊息後須進行靠卡感應，靠卡後於車機顯示「扣款金額」及「卡片餘額」資訊方代表成功扣款，才算完成該次還車流程。\n（二）掃碼借車流程\n1. 按「啟動掃碼」鈕喚醒車機\n2. 使用YouBike 2.0 APP按下主畫面下方「掃碼借車」後對準車機螢幕，掃描QRcode或輸入螢幕顯示之驗證碼完成解鎖（若遇強光無法掃碼，請輸入驗證碼以解鎖）。\n3. 螢幕顯示「請取車」後，雙手握住把手並往後拉出車輛。\n4. 還車時，請將車輪對準導引槽並推入車柱，待車輛固定於車柱上卡槽，且螢幕顯示「還車成功」後即完成還車。\n二、單次租車：使用單次租車者可使用信用卡（VISA、MASTER或JCB）付費，使用方式請參考YouBike官方網站，網址https://www.youbike.com.tw/region/taipei/rent-way/single/。","u":"臺北市政府交通局","h":60609,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3F5414CCC4674D2F","d":"2012-10-01","sid":"3F5414CC"},{"q":"YouBike微笑單車由悠遊卡或一卡通扣款，若票卡金額不足怎麼辦？騎完YouBike轉乘其他運具(捷運、公車)還能享有轉乘優惠嗎？","a":"提醒您票卡餘額須大於或等於您該次租借交易使用費用，如餘額不足將導致扣款失敗，須請您至各捷運站、便利商店等處進行加值後，至任一YouBike2.0場站喚醒車輛車機進行補扣款後即可再次租借。考量 YouBike 前30分鐘已免費，公車、捷運雙向轉乘YouBike不再重複提供優惠。","u":"臺北市政府交通局運輸管理科","h":54540,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=09EEB91BBED32691","d":"2024-02-28","sid":"09EEB91B"},{"q":"我要如何查詢我的YouBike使用紀錄？","a":"使用者可透過登入YouBike APP之「會員專區」>「卡片管理」功能查詢最近的使用紀錄，亦可至捷運站之悠遊卡查詢機查詢。","u":"臺北市政府交通局運輸管理科","h":42481,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E6087520ADB78668","d":"2012-10-01","sid":"E6087520"},{"q":"外國人沒有手機，怎麼註冊使用YouBike？","a":"YouBike除了使用悠遊卡之外，如果是外地來的遊客，沒有悠遊卡時，可以利用信用卡（VISA、MASTER或JCB）單次租車。","u":"臺北市政府交通局","h":37975,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6982DC671AEA5A43","d":"2013-09-13","sid":"6982DC67"},{"q":"我要怎麼做才能開始租YouBike微笑單車？","a":"您必須將您的悠遊卡或一卡通透過YouBike官方網站或YouBike2.0 APP註冊程序開卡，使您具有YouBike會員身分，即可使用該票卡租借YouBike，一組手機門號可以辦理５張票卡登記。\n單次租車可使用信用卡（VISA、MASTER或JCB）付費，使用方式請參考YouBike官網，網址https://www.youbike.com.tw/region/main/rent-way/single/。","u":"臺北市政府交通局運輸管理科","h":37328,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1305072EEAF5F32A","d":"2022-12-05","sid":"1305072E"},{"q":"如周邊無YouBike場站如何臨時停車？如果車輛遭竊該怎麼辦？","a":"YouBike 2.0車輛隨車鎖與智慧車機結合，使用者鎖車時僅需將車頭右轉約15度對準鎖孔後插入隨車鎖插銷，即完成鎖車。解鎖時，僅需以租借車輛時之卡片靠卡感應或掃碼，待車輛解鎖後再拔出插銷，即完成解鎖。\n如車輛不幸遭竊，請使用者立即與最近之派出所報案，須取得報案證明，並撥打市民熱線1999轉5855、02-89788822（一般付費）協助。","u":"臺北市政府交通局運輸管理科","h":27047,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C78BA03AF10173A8","d":"2012-10-01","sid":"C78BA03A"},{"q":"小型車是指哪些車種？有哪些情況後座免繫安全帶？","a":"查汽車駕駛人及乘客繫安全帶實施及宣導辦法說明如下\n一、小型車係指自用、營業或租賃小客車、小貨車及小客貨兩用車（不包括救護車及幼童專用車）。\n二、依本辦法第5條規定，汽車駕駛人、前座乘客、小型車後座乘客或大型車乘載之四歲以上乘客有下列情形者，得不適用第3條之規定：\n(一)經醫療機構證明無法繫安全帶者。\n(二)營業小客車後座附載應依第3條第4款規定搭配使用幼童用座椅或學童用座椅（或增高型座墊）之兒童。\n(三)中華民國80年7月1日前登檢領照之小客車，或97年1月1日前製造出廠之小客貨兩用車，其車輛製造出廠時後座未裝置安全帶之後座乘客。\n如欲瞭解上述規定請至全國法規資料庫（https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0040037）參閱。","u":"臺北市政府交通局","h":25705,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=952922DF50D8916F","d":"2012-01-31","sid":"952922DF"},{"q":"悠遊卡適用於運輸交通工具之代墊機制為何？","a":"悠遊卡所有票卡種類(包括悠遊聯名卡、悠遊電信卡)均適用代墊機制，但僅限於搭乘大眾運輸交通工具可使用代墊乙次，以60元內為限，其餘小額消費或非大眾運輸交通工具皆無法代墊，說明如下：\n一、臺北捷運：可代墊乙次。\n二、段次公車：可代墊乙次，另當趟搭乘為兩段票，但第一段票已代墊過乙次，第二段票則無法再代墊扣款，持卡人需另以現金繳付當趟車資。\n三、臺鐵：可代墊乙次。\n四、高鐵：僅限悠遊聯名卡可代墊，如餘額不足支付該次應付票價時，系統將自動計算差額並以500元倍數為單位，完成最低金額自動加值，以利扣除應付票價。\n五、藍色公路(渡輪)：可代墊乙次，另長弘航業無代墊功能。\n六、除上述各運具，本市停車場、計程車及微笑單車不適用悠遊卡代墊功能，請持卡人使用相關服務時注意。\n另悠遊卡提供之代墊機制由悠遊卡公司不定期更新於該公司官方網站之「顧客服務」─「常見問題」專區(http://www.easycard.com.tw)，敬請悠遊卡持卡人至該網站查詢最新資訊。","u":"臺北市政府交通局運輸管理科","h":20366,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=13EFECFA47A9AB6F","d":"2017-11-17","sid":"13EFECFA"},{"q":"發現YouBike系統、車柱、車輛故障時該如何處理？會不會要求我負賠償責任？","a":"如您發現YouBike場站有系統、車柱、車輛故障等情事時，請依照通報流程撥打市民熱線1999轉5855、02-89788822（一般付費）或登入YouBike2.0 APP 使用「通報維修」功能進行通報，微笑單車公司將儘速前往處理。\n提醒您為確保您騎乘安全，租借車輛前可先檢查車輛狀況，如車輛是否可調整車輛高度、車頭是否歪斜、檢查胎壓及確認前後煞車功能，如檢查車輛有不良之狀況，請於5分鐘內歸還於同一租借場站，即不會收取費用且歸還成功後不受10分鐘內不得續借限制即可再租借車輛，並可協助將座墊反轉，以利現場人員即時將車輛載回處理。\n至於維護費用部分，非因不當使用而產生之耗損，由營運廠商自行負責維護，不會要求使用者賠償。","u":"臺北市政府交通局運輸管理科","h":18832,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0D6A16FD6FCCB4A3","d":"2012-10-22","sid":"0D6A16FD"},{"q":"要如何查詢YouBike微笑單車各站點位置？以及如何得知各站的車輛數、車位數？","a":"場站營運資訊可透過YouBike官方網站之站點資訊頁面及YouBike 2.0 、「台北通」或「臺北好行」APP查詢。","u":"臺北市政府交通局","h":18308,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6E64C35F473471D9","d":"2012-10-01","sid":"6E64C35F"},{"q":"1張卡片可以借用幾台YouBike車輛？","a":"目前1張悠遊卡或一卡通卡片只能借用1車，另1張信用卡亦僅能借用1車。","u":"臺北市政府交通局運輸管理科","h":17680,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69800479965DA2B7","d":"2012-10-01","sid":"69800479"},{"q":"仰德大道連續假日交通管制計畫內容為何","a":"一、管制目的：為紓解仰德大道連續假日及特殊狀況交通壅塞現象，以通行證方式管制小汽車之通行，建立仰德大道以大眾運輸為優先之轉運機能，並達到改善陽明山地區交通之目標。\n二、管制地點\n（一）上山管制點：2處管制點於「仰德大道、至誠路口」（即復興橋頭）及「至善路2段1巷口」，1處疏導點於「福林路、忠勇街」。\n（二）下山管制點：3處疏導點「格致路、菁山路口」、彈性管制點「格致路、凱旋路口」管制點「陽明路、中橫街口（ 陽明路一段43巷口） 」。\n三、管制日期及時段\n（一）上山管制點：每逢連續假日（含週休二日）之上午8時至下午3時。\n（二）下山管制點：每逢連續假日（含週休二日）之下午2時至下午6時。\n（三）若遇勞動節放假、氣候變化（如賞雪）、夜間觀星或突發狀況等，授權轄區分局得視實際交通狀況，彈性調整管制時間；\n（四）若遇補班日（如週六補班日），屬於一般上班日性質，原則不管制；若遇彈性放假為連續假日，則依上述管制方式。以上均以行政院人事總處公布之政府行政機關辦公日曆表為依據。\n四、管制對象：以自用小客車為管制對象，計程車、小貨車、大貨車、大客車、懸掛「身心障礙號牌（車牌）」或持有與車號相符且於有效期限內之「身心障礙者專用停車位識別證」之車輛、警備車、工程救險車及外交部禮賓車等執行任務車輛不予管制。\n五、管制方式：於上述管制時段內之管制點，由當地轄區警察派出所及警察分局派駐執勤員警負責針對過往車輛一一確認，持有通行證者始得放行。\n六、通行證發放標準：主要以陽明山地區之居民為第一優先核發對象，其餘因工作及公務等需求則依實際狀況酌予發給。參加婚喪喜慶等非長期例行活動者，憑請柬或訃文准予通行。\n七、配合措施\n（一）為提高大眾運輸工具便利性，逢假日彈性加密休閒公車班次。\n（二）本管制計畫主要係針對行經仰德大道之小汽車進行管制，因此亦可利用其他替代道路上下山。\n（三）陽明山地區停車場（花鐘前廣場、立體停車場及第二停車場）24小時開放停車，於0700~1900計時收費，其餘時間免費停車。\n（四）地區交通管制點\n1. 中興路花鐘至陽明書屋維持由花鐘往陽明書屋方向單行。\n2. 紗帽路、中橫街口（例假日","u":"臺北市政府交通局交通治理科","h":17553,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C810B2296441B1F7","d":"2023-03-24","sid":"C810B229"},{"q":"如何申請優良暨資深典範職業汽車駕駛人子女獎助學金","a":"本獎學金係由財團法人純青社會福利基金會提供，非市政編列預算。\n一、申請資格如下：\n1、當選過本市優良職業汽車駕駛人(包括計程車及公車)。\n2、當選人得依有關規定申請次年度優良職業汽車駕駛人獎學金，可申請三屆(例：112年度當選者可於 113年度開始申請，可連續申請113、114及115年度)。\n3、子女申請類別及成績規定：\n＊專一到專三申請類別為高中職，專四到專五申請類別為大專以上。\n＊若成績單上看不出是否還在學，請附上學生證及在學證明。\n＊成績單若是採用GPA方式，需附上GPA換算成績表，未附者不予受理。\n二、申請程序\n1、由本府交通局轉請本市各公(工)會、本市公共運輸處，分別通知轄區內近三屆當選優良職業汽車駕駛人提出申請。\n2、檢附申請表、當選優良職業汽車駕駛人證明影本、戶口名簿影本、 子女學生證(或當年畢業證書)，及申請學年度成績單之影本。身心障礙學生者加附身心障礙手冊影本。\n三、經本府交通局辦理初審後列冊送純青社會福利基金會複審。","u":"臺北市政府交通局交通安全科","h":16997,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=775D6FAD230BC21B","d":"2009-12-09","sid":"775D6FAD"},{"q":"車輛事故鑑定如何申請覆議?","a":"一、 覆議申請方式 (一) 已進入司法程序之案件：請向「司法機關」申請，由司法機關(含分局、簡易庭、檢察署、法院)囑託本局覆議，不受個人申請期限30日之限制。 (二) 未進入司法程序之案件(個人申請)： 1. 申請期限：收到鑑定意見書翌日起30日內申請，逾期不受理，若為紙本郵寄申請以郵戳為憑。 2. 個人申請方式： (1) 紙本郵寄申請：請填妥覆議申請表及鑑定意見書影本（含裁決所函公文影本），並隨案檢附郵政匯票掛號郵寄至「臺北市政府交通局」。 (2) 親臨申請：現場填寫覆議申請表、鑑定意見書影本（含裁決所函公文影本）及補充相關案件資料並現金繳納規費。 (3) 線上申請：請由「台北服務通-交通局-臺北市車輛行車事故覆議」申辦，於案件審核通過後通知申請人繳費。 二、 規費：新臺幣2,000元整。 三、 繳費方式： (一) 郵政匯票：請註明受款人：「臺北市政府交通局」。 (二) 現金：請親至臺北市政府交通局秘書室繳納。 (三) 線上繳費：限線上申請覆議案件，於審核通過後通知申請人繳費，繳費方式可透過網路ATM轉帳或Pay.taipei行動支付。 四、 覆議意見僅供當事人及司法機關審理參考，覆議以1次為限，以書面審查為原則，且不另通知當事人到會說明。 五、 臺北市政府交通局：地址：臺北市信義區市府路1號6樓北區；覆議會承辦人電話：02-27208889轉6892；傳真：02-27587640。","u":"臺北市政府交通局交通安全科","h":16289,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=269722A61AF09F44","d":"2008-07-18","sid":"269722A6"},{"q":"遺失或損壞YouBike車輛怎麼辦？","a":"一、YouBike公共自行車損壞或遺失如何處理？\n（一）請您立即電洽1999市民熱線轉5855、02-89788822（一般付費），由服務人員為您服務。並依「臺北市公共自行車租賃系統YouBike服務條款」 4.使用服務及騎乘注意事項之規定管理之。\n（二）公共自行車租出後，租借者應負保管之責，故如遺失係為租借者遺失車輛，應由租借者報案失竊，惟租借者不願報案時，營運單位將依照法務程序處理。\n（三）消費者報案後，如車輛確定遺失，應賠償公共自行車之營業損失費用，依服務條款第五條，每輛YouBike 2.0為新臺幣15,000元整。\n二、電子票卡（悠遊卡）被YouBike列為停用名單之卡片，是否會影響其他服務（如捷運或公車）？\n如因車輛未還、交易異常、卡片遺失或其他因素遭本服務列為停用名單之卡片，除無法用「臺北市公共自行車租賃系統」外，不影響該卡片（如悠遊卡）其他的使用功能，如該卡片如有其他功能，會員仍應自行向該功能權責單位辦理掛失作業。\n三、若YouBike公共自行車故障無法騎乘，該如何處理？\n如果您於騎乘中途自行車故障，或在使用前，該自行車已損壞，請您於就近租賃站還車，並將該自行車椅墊反轉180度後，改租其他車輛即可，YouBike巡站人員會將車輛攜回維修；更希望您立即電洽1999市民熱線轉5855、02-89788822（一般付費）主動通報問題車輛，以協助加快故障車輛處理。\n四、我不小心將車輛損壞了怎麼辦？\n（一）請您立即電洽1999市民熱線轉5855、02-89788822（一般付費），請服務人員協助處理，依「臺北市公共自行車租賃系統YouBike服務條款」 4.使用服務及騎乘注意事項之規定管理之。\n（二）公共自行車借出後，租借者應負保管之責(含相關零件設備)，如有車輛損害情況，租借者應主動聯繫營運單位協助處理車輛損害問題，並依損害狀況支付維修費用。\n（三）如車輛損害嚴重無法繼續使用需營運單位派員處理，則需另加計運送費如區域位於「台北市內」訂為每次新臺幣150元整，處理區域位於「新北市內」訂為每次新臺幣350元整，如位於「其他區域」，租借者應自行處理車輛載運至台北市內，","u":"臺北市政府交通局","h":16255,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2CC25F2699411268","d":"2022-12-05","sid":"2CC25F26"},{"q":"刷卡後未取出YouBike車輛，是否會扣錢？已經刷了卡，卻無法取出車輛，應如何辦理？","a":"一、如刷卡後30秒內未取車，車柱會將自行車重新上鎖，本次交易並將取消。建議您，若放棄租借使用，請先將車輛取出後按正常還車程序歸還，以確保自行車確實上鎖，避免衍生爭議，並請您留意車機螢幕資訊，於車機螢幕顯示「還車成功」訊息後須進行靠卡感應，扣該款次的使用費用0元，同時於車機顯示「扣款金額」及「卡片餘額」後方完成正常還車程序，並確認自行車為上鎖狀態再離開，避免車輛遭下一位使用者取走，衍生後續費用爭議及遺失車之爭議。\n二、如無法取出車輛，須請您注意YouBike 2.0車機顯示借車成功資訊方代表成功借車，如借車成功後仍無法取出可嘗試左右搖晃車輛龍頭讓車鎖鬆動，或更換其他車輛租借。\n三、如您於借車當下有進一步疑問，請洽1999市民熱線轉5855或02-89788822（一般付費）協助。","u":"臺北市政府交通局運輸管理科","h":15889,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1774E6B070FB6E5F","d":"2012-10-01","sid":"1774E6B0"},{"q":"優良暨資深典範職業汽車駕駛人相關問答集","a":"一、問：每年受理報名期間，是哪時候?\n答：每年預計5月1日至6月30日為報名期間，依當年度公告為主。\n二、問：有關優良職業汽車駕駛人遴選辦法及申請書表去那索取?\n答：屆時可至本局官網下載自行列印申請書及相關資料或向所屬之公、工會或本市公運處索取， 並於報名期間內逕向所屬之公、工會或臺北市公共運輸處報名 。\n三、問：優良職業汽車駕駛人選拔須具備那些條件?\n答：優良職業汽車駕駛人之獎勵對象應具中華民國國籍，並符合下列資格之一：\n（一）營業小客車駕駛人：須領有臺北市（以下簡稱本市）執業登記證，或領有非本市執業登記證而\n加入本市（個人、自備車輛）計程車駕駛員職業工會或本市汽車駕駛員職業工會之會員者。\n（二）本市市區汽車客運駕駛人：須所隸屬單位為本市公共汽車客運商業同業公會之會員。\n（三）申請參加優良職業汽車駕駛人遴選，應具備下列要件：\n1、最近2年內在本市或其他公路主管機關未曾當選優良或資深典範職業汽車駕駛人者。\n2、同一服務單位連續擔任駕駛人滿3年以上，或營業小客車駕駛人領有執業登記證在3年以上繼續執業，且無不良紀錄者。\n3、最近5年內未受有期徒刑以上之宣告者。\n4、最近3年內駕駛車輛無違規及肇事紀錄者。\n5、服務成績優良或有特殊事蹟，足資表揚者。\n（四）申請參加十年資深典範職業汽車駕駛人遴選，應具備下列要件：\n1、最近2年內在本市或其他公路主管機關未曾當選優良或資深典範職業汽車駕駛人者。\n2、在同一服務單位連續擔任駕駛人滿10年以上，或營業小客車駕駛人領有執業登記證在10年以上繼續執業，且無不良紀錄者。\n3、最近10年內未受有期徒刑以上之宣告者。\n4、最近10年內駕駛車輛無違規及肇事紀錄者。\n5、服務成績優良或有特殊事蹟，足資表揚者。\n首次參加資深典範職業汽車駕駛人遴選申請者，不受前項第一款之限制。\n（五） 申請參加十五年資深典範職業汽車駕駛人遴選，應具備下列要件：\n1、最近3年內在本市或其他公路主管機關未曾當選優良或資深典範職業汽車駕駛人者。\n2、在同一服務單位連續擔任駕駛人滿10年以上，或營業小客車駕駛人領有執業登記證在15年以上繼續執業，且無不良紀錄者。\n3、最近15","u":"臺北市政府交通局交通安全科","h":14464,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=22DCE9CB395F652F","d":"2008-02-27","sid":"22DCE9CB"},{"q":"未懸掛號牌車輛停放在自家門前或停車格位，尚無嚴重妨礙交通，為何仍遭執勤員警製單舉發、拖吊移置？本市處理未懸掛號牌堪用車輛之法源依據為何？","a":"（一）道路之規劃係供人車通行使用，民眾持有之車輛若長期不使用，應停放於私人或民營停車空間，路邊停車格或未劃設禁停紅黃線路段因屬道路空間，僅供車輛臨時停車使用。\n（二）為維護本市道路交通安全與暢通及道路空間公平使用，本府依道路交通管理處罰條例第5條規定：「為維護道路交通安全與暢通，公路或警察機關於必要時，得就某線道路或某線道路區段禁止停車」，發布命令禁止未懸掛號牌汽、機車車輛停放本市所有道路，並依「道路交通管理處罰條例」第56條第1項第9款規定掣單舉發並依同條例第56條第3項規定拖吊移置車輛（100年11月21日府交治字第10031515100號公告）。\n（三）未懸掛號牌車輛停放本市道路已違反前揭公告，經查報後即依法處理。建請車主應儘速依規定懸掛號牌或將車輛移置路外停車空間（私人土地）或租用民營停車場停放。","u":"臺北市政府交通局交通治理科","h":14281,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=13E4601E04D55086","d":"2023-03-24","sid":"13E4601E"},{"q":"如何申請仰德大道通行證及臨時放行條","a":"Q1：何時開放申請113-115年度仰德大道通行證？\nA：自112年12月6日（三）起開放申請。\nQ2： 哪些地區可以申請仰德大道通行證？\nA：\n士林區（限新安、陽明、永福、公館、平等、菁山、翠山、臨溪、岩山、芝山、溪山、東山里）。\n北投區（限湖山、湖田、泉源、中心里）。\n金山區 （限重和、兩湖、六股里）。\nQ3： 哪些人可以申請仰德大道通行證？\nA：\n在上述地區設籍之居民，且有自用小客車者。\n在上述地區擁有土地或建物者，且有自用小客車。\n在上述地區租屋居住者，且有自用小客車 （考量陽明山地區實施交通管制有效性，學生僅限行動不便者方得申請）。\n在上述地區設籍之公司或店家，且有公司或商業登記證明者。\n位處上述地區之機關或學校。\nQ4： 哪些車種可以申請仰德大道通行證？\nA：僅限自用小客車須申請，計程車、小貨車、大貨車、大客車、懸掛「身心障礙號牌（車牌）」車輛，及警備車、工程救險車、外交部禮賓車等執行任務車輛不予管制。\nQ5： 我有車子，但車主不是我本人怎麼辦？\nA：\n如車主是申請人之直系血親，則檢附身分證或戶籍證明文件之正反面影本，可連結雙方之身分關係即可。\n如是公司車輛，則檢附公司開立同意書（含該公司名稱、同意使用人姓名、車號、公司大小章）之正本以資證明。\n如是租賃車輛，則檢附租賃契約影本（含雙方簽章、租賃期間、車號）以資證明。\nQ6： 我不是中華民國國籍的人，但住在陽明山上怎麼申請？\nA：在Q2所述地區設籍之外國國籍民眾，且有自用小客車者，需準備以下資料申請：\n居留證影本。\n行車執照影本（車主非本人請參照Q5 ）。\n房屋租賃契約書影本（含雙方簽章、租賃期間、租賃地址）。\nQ7： 申請仰德大道通行證需要準備什麼資料？\nA：隨申請者身分不同，需要準備的資料也不同，依申請者身分之不同分述，如Q3、Q8~10。\nQ8： 在Q2所述地區設籍、擁有土地或建物或租屋居住之居民，且有自用小客車者須檢附什麼資料？\nA：\n身分證或戶籍證明文件之正反面影本。\n行車執照影本（車主非本人請參照Q5 ）。\n擁有土地、建物者檢附土地或建物之所有權狀，或申請時間1個月內核發之土地或建物謄本。\n租屋居","u":"臺北市政府交通局交通治理科","h":13560,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=15505097F7C68F10","d":"2023-03-24","sid":"15505097"},{"q":"YouBike微笑單車需要押金嗎？","a":"成為YouBike會員，租借無須支付押金。\n而單次租借者，因為申辦短期卡不需登入會員資料，所以系統是以信用卡持卡人身分作為擔保，故目前僅提供以信用卡申請押金授權。單次租借者使用信用卡付款進行租車時，系統將會從其帳戶（信用卡為開卡銀行）進行交易預授權3000元，若消費者遵守本服務使用行為，車輛並確實歸還後，授權期限（5天）到期後，系統將自動取消本次授權，並依據本次實際交易金額由各家銀行進行請款作業。消費者於當月信用卡帳單內將出現該次交易資料，若有任何問題，您可撥打1999市民熱線轉5855、02-89788822（一般付費）洽詢。","u":"臺北市政府交通局","h":13425,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8CC8AEA4D26E2C23","d":"2017-08-31","sid":"8CC8AEA4"},{"q":"YouBike微笑單車費率及交易異常退款問題","a":"一、會員的收費與費率問題相關費率變更請依據微笑單車公司官方網站公告之費率為主：會員持悠遊卡或一卡通租借YouBike，每次騎乘前30分鐘享有費率免費之優惠（自113年2月28日起實施）。使用時間逾30分鐘之收費方式如下：\n（一）騎乘逾30分鐘，但於4小時內還車，費率為每30分鐘10元。\n（二）騎乘逾4小時，但於8小時內還車，第4至8小時費率為每30分鐘20元。\n（三）騎乘逾8小時，於第8小時起將以每30分鐘40元計價。\n二、單次租車的收費與費率問題相關費率變更請依據本公司官方網站公告之費率為主：\n（一）騎乘4小時內，費率為每30分鐘10元。\n（二）騎乘逾4小時，但於8小時內還車，第4至8小時費率為每30分鐘20元。\n（三）騎乘逾8小時，於第8小時起將以每30分鐘40元計價。\n三、交易異常的處理方式\n（一）請立即電洽1999市民熱線轉5855、(一般付費) 02-89788822，由服務人員為您服務。\n（二）如有交易異常需退款，「臺北市公共自行車租賃系統YouBike服務條款」 （以下稱服務條款）之規定管理之。本辦法所稱「退款」係指因系統異常所產生的錯誤扣款或因車輛歸還不確實造成的爭議扣款狀況。租借者需至YouBike指定之服務中心進行退款作業，退款以現金方式退還租 借 者，並應配合營運單位填寫相關收款憑證。","u":"臺北市政府交通局運輸管理科","h":11946,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FE811D6C71890113","d":"2024-02-28","sid":"FE811D6C"},{"q":"YouBike有服務中心嗎？地點在哪裡？服務時間？","a":"本市YouBike目前有3處服務中心，地點與服務時間詳列如下：\n一、市府轉運站服務中心\n臺北市信義區忠孝東路五段6號1樓 (請由捷運市政府站2號出口往市府轉運站售票服務櫃台)\n服務時間：10:00－19:00\n休息時間：14:00－15:00，視現場狀況微調時間。每週三公休 。\n二、捷運忠孝新生服務中心（5號出口B1/須出站）\n臺北市中正區新生南路1段56巷（地下1F）\n服務時間：10:00－19:00\n休息時間：14:00－15:00，視現場狀況微調時間。每週日公休 。\n三、內湖服務中心\n臺北市內湖區成功路四段30巷46號\n服務時間：10:00－19:00\n休息時間：14:00－15:00，視現場狀況微調時間。 每週一、五公休\n另YouBike服務中心於國定假日及特殊活動之營運時間，詳見YouBike官方網站公告。","u":"臺北市政府交通局運輸管理科","h":10794,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3C1CFDD2043926AC","d":"2022-12-05","sid":"3C1CFDD2"},{"q":"機車考照練習場相關FAQ","a":"機車考照練習場相關FAQ\nQ1：請問臺北市有機車考照練習場嗎?\nA1：有的，地點位於臺北市士林區通河西街1段堤外平面停車場旁空地（百齡橋以南）及萬華區華中河濱公園華中橋堤外（二）停車場旁空地 松山區觀山河濱公園機車停車場旁空地 。\nQ2：請問機車考照練習場有開放時間嗎?\nA2：\n(1)考量維護治安及環境安寧，本練習場開放時間為每日早上6時至凌晨0時，不開放期間(凌晨0時至早上6時)請勿進入使用。\n(2)另有下列情形，即刻不提供練習使用，車輛所有人或使用人應盡速將車輛移離：\nQ3：是否有開放對象之限制?\nA3：民眾皆可使用，惟未有駕照者請由已有機車駕照之親友陪同前往，練習時並注意安全。\nQ4：練習場使用是否需付費?\nA4：本練習場為免費使用。\nQ5：是否參考監理所機車考照的場地設置?\nA5：本練習場係參照交通部公路總局制定之普通重型機車新式路考考驗科(項)目場地圖施作，另查本市士林監理站係因場地範圍限制考驗項目之順序，與本市考照練習場項目順序不同。","u":"臺北市政府交通局交通安全科","h":10376,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C6F8DDC7305A6892","d":"2021-05-05","sid":"C6F8DDC7"}]},{"org":"交通事件裁決所","total":130,"items":[{"q":"交通違規罰鍰是否可以分期繳納？應備文件？","a":"交通違規罰鍰如無法一次繳清，可臨櫃辦理分期繳納並當場開立裁決書及繳納第1期罰鍰，如受處分人未滿18歲者，須由法定代理人代為辦理。 應備文件： 受處分人為自然人: 請受處分人備妥身分證明文件及印章，受處分人如無法親自到案辦理，請檢附 委任書 、雙方身分證明文件及印章。 受處分人未滿18歲且法定代理人無法親自至本所辦理者，法定代理人應委任受任人(需年滿18歲)辦理，檢附 委任書 、受處分人、法定代理人與受任人本人之身分證明文件及印章。 受處分人為法人或非法人團體： 法定代理人身分證明文件及公司大小章，法定代理人無法親自至本所辦理者，請檢附 委任書 、雙方身分證 明文件及印章(含公司大小章)。 辦理分期繳納相關規定： 分期繳納每期以1個月計算，且總分期數不得逾18期，每期繳納罰鍰金額(除最後1期外)，不得低於新臺幣500元。核准後應即繳納第1期罰鍰金額。 分期繳納罰鍰期間因故無法按期繳納者，得於當期屆滿前，向本所申請延期繳納剩餘期數之罰鍰；申請延期繳納以1次為限，延期繳納期間並不得超過1個月。 如為酒後駕車應繳清後始得憑收據領回車輛，但初次違反規定且未發生交通事故者，於申請分期繳納第1期罰鍰金額後，得檢附繳納罰鍰收據領回車輛。 分期繳納期間，汽車所有人或駕駛人於繳納第1期罰鍰金額後，公路監理機關得先註記其申請除車輛過戶外之車輛停駛、復駛、繳交牌照、註銷牌照、換發牌照或駕駛執照。 受處分人經核准辦理分期，如有1期未按時繳納，或逾繳款截止日未全數繳清，視同全部到期，其尚未繳納之罰鍰，則依規定移送強制執行。 分期罰鍰繳納方式","u":"臺北市交通事件裁決所違規裁罰課","h":451580,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7168D1A386D290F3","d":"2016-05-02","sid":"7168D1A3"},{"q":"如何查詢違規紀錄？","a":"您可利用下列管道查詢 1.上監理服務網(可查詢違規紀錄及地點) ： https://www.mvdis.gov.tw/→點選【交通違規】→【交通罰鍰查詢及繳納】。 2.監理服務網App(可查詢違規紀錄)： 使用監理服務App（ios或Android系統）→【交通違規查詢繳納】。 3.電洽裁決所（02-23658270轉9話務中心），提供車號或身分證字號（或統一編號）我們將為您查詢，如有交通違規案件，並建議您儘速繳納結案。","u":"臺北市交通事件裁決所案件管理課","h":270363,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=20F3982D56F94B58","d":"2024-06-24","sid":"20F3982D"},{"q":"我已辦理交通違規分期繳納罰鍰，有哪些便利繳納管道？","a":"本所交通違規分期案件繳款方式，請參閱下方繳款管道列表：","u":"臺北市交通事件裁決所違規裁罰課","h":111059,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F4FFEA2E4D1033E1","d":"2021-05-10","sid":"F4FFEA2E"},{"q":"罰鍰重繳、溢繳、誤繳時如何辦理退款？繳款證明正本遺失時如何辦理？退款需要幾天辦理？","a":"一、退款方式： 金融帳戶轉帳退款。\n二、具備文件： 1.填妥本所退款領款通知( doc檔案 )/( odt檔案 )/( pdf檔案 )，並於領款通知之「領款收據」欄簽名或蓋章(如為法人須蓋公司大小章)。 2.存簿封面影本(帳戶姓名須與被通知人之姓名資料相符，如欲匯入他人帳戶，請勾選並填妥「領款收據」欄之本人同意匯入代領人帳戶資料需簽名或蓋章）。 3.原繳款證明正本(如為重複繳款者應有繳款證明正本2張)。\n三、 繳款證明正本遺失時如何辦理？ 請於退款領款通知「收據遺失切結書」欄位處具結，勾選繳款證明遺失，並於立書人簽章處簽章；如為法人，請蓋公司大小章。\n四、需辦理時間： 自接獲民眾申請之退款領款通知至辦妥轉帳退款，約需14個工作天。\n五、 另為縮短重複繳納退款時程，請多利用本所E化線上服務「 重複繳納罰鍰查詢 」，若確有重複繳納情事，可下載退款申請書( doc檔案 )/( odt檔案 )/( pdf檔案 )逕寄本所辦理退款。\n六、 亦可至本所網站首頁( https://www.judge.gov.taipei/ )上方點選「 e退款申請 」線上申辦，再依步驟填寫並上傳存簿封面(或金融卡帳號截圖)及原繳款證明，申請完成後，可在「 查詢退款進度 」頁面查詢辦理進度。","u":"臺北市交通事件裁決所違規申訴課","h":81402,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9BB4277910E598FD","d":"2016-09-08","sid":"9BB42779"},{"q":"如何領取被吊扣的駕照？可以申請寄回嗎？","a":"※臨櫃領回： 1.於吊扣期滿次日（遇假日順延至本所辦公日），並請於上班時間領取吊扣的駕照。 2.請攜帶吊扣執行單、身分證或身分證明文件正本，若委任他人領取請備妥 委任書 (請敘明理由、受任人及委任人簽名或蓋章)及受任人身分證明文件。 ※郵寄領回： 倘您無法至本所領回駕照，請填寫 駕照吊扣期滿代寄回申請書 ，並可利用傳真(電話：02-2365-0282)、e-mail：(tao_web@gov.taipei)或郵寄至本所(臺北市中正區羅斯福路4段92號7-8樓)辦理申請。亦可利用 台北服務通 線上提出申請，經本所核對資料無誤後再將駕照寄還。","u":"臺北市交通事件裁決所違規裁罰課","h":77177,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2BC04193CD119536","d":"2016-10-24","sid":"2BC04193"},{"q":"對違規通知單(紅單)舉發內容不服，如何陳述(申訴)？","a":"1.辦理方式為：\n‧親至應到案處所。\n‧網路： 台北服務通 。\n2.具備文件為：\n‧交通違規通知單影本或掃描檔。\n‧陳述書(敘明理由、姓名、車號、單號、聯絡電話及地址)。\n‧採證照片(正本、影本或掃描檔)。\n‧其他足資佐證資料。\n‧委託辦理另附委任書（若陳述(申訴)人非為受處分之當事人）。","u":"臺北市交通事件裁決所違規申訴課","h":67502,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1E1C57CE32140DF6","d":"2023-05-30","sid":"1E1C57CE"},{"q":"收到被民眾檢舉舉發的違規通知單，如果開單日期與檢舉日期超過7日，可申訴免罰嗎？","a":"依道路交通管理處罰條例第7條之1規定：「對於違反本條例之行為者，民眾得敘明違規事實或檢具違規證據資料，向公路主管或警察機關檢舉，經查證屬實者，應即舉發。但行為終了日起逾7日之檢舉，不予舉發。」，故民眾檢舉交通違規，自「違規行為終了日」到「檢舉日期」逾7日的檢舉不予舉發。與舉發機關開單日期無關。","u":"臺北市交通事件裁決所違規申訴課","h":67085,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7F79CB93DABB6B0D","d":"2018-04-13","sid":"7F79CB93"},{"q":"酒後駕車的處罰為何？","a":"一、酒後駕車基本處分:\n依新修正道路交通管理處罰條例第35條規定(108年7月1日起施行)，酒後駕車(酒精濃度0.15亳克以上)處罰鍰新臺幣1萬5,000元以上12萬元以下(10年內累犯加重裁罰)，並應吊扣（銷）駕照或記點，另應接受道路交通安全講習。\n二、酒精濃度0.25毫克以上(涉公共危險罪):\n三、酒駕肇事加重駕照處分:\n酒駕因而肇事致人受傷者，吊扣駕照2年至4年；因而肇事致人受重傷或死亡者，吊銷其駕照，並終身不得再考領。\n四、酒駕所持駕照與車種不符:\n另依條例第68條第2項規定「領有汽車駕駛執照之汽車駕駛人，除駕駛聯結車、大客車、大貨車外之非其駕駛執照種類之車輛，違反本條例及道路交通安全規則之規定，應受吊扣駕駛執照情形時，無因而肇事致人受傷或重傷者，記違規點數5點。但1年內違規點數共達6點以上或再次應受吊扣駕駛執照情形者，併依原違反本條例應受吊扣駕駛執照處分規定，吊扣其駕駛執照」。\n五、酒駕累犯及拒測:\n汽車駕駛人駕駛汽、機車，自108年7月1日起，於10年內酒精濃度超過規定標準2次，騎乘機車者處新臺幣9萬元罰鍰、駕駛汽車者處新臺幣12萬元；第3次者，按前次裁罰基準再加9萬元，之後以此類推。並吊銷駕駛執照，3年內不得考領駕駛執照。拒絕接受酒精檢測或不依指示停車接受檢測稽查，處新臺幣18萬元罰鍰，並吊銷駕駛執照，3年內不得考領駕駛執照；10年內第2次再犯者，每次加處新臺幣18萬元罰鍰，5年內不得考領駕駛執照，並均應當場移置保管該汽機車及施以道路交通安全講習，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n♦ 108年7月1日起酒後駕車需繳納交通違規罰鍰金額一覽表\n♦ 108年7月1日起酒後駕車累犯、拒絕接受酒測或不依指示停車接受檢測稽查裁罰一覽表\n六、汽機車吊扣牌照處分:\n汽機車所有人，明知汽機車駕駛人有條例第35條第1項各款情形，而不予禁止駕駛者，依第1項規定之罰鍰處罰，並吊扣該汽機車牌照2年。\n汽機車駕駛人有條例第35條第1項、第3項至第5項之情形之一，吊扣該汽機車牌照2年；因而肇事致人重傷或死亡，得沒入該車輛。","u":"臺北市交通事件裁決所違規裁罰課","h":63747,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E61C6C0D04993941","d":"2023-08-02","sid":"E61C6C0D"},{"q":"申訴罰單期間罰鍰金額是否會凍結？如申訴結果仍須繳納，是否會給予寬限期？","a":"申訴送件成功後，該筆違規申訴期間罰鍰金額會凍結，因此已提起申訴的案件，罰鍰無須先行繳納(已移送強制執行案件或車輛、駕駛執照需辦理相關異動者除外)，如您接到申訴回文或回電時，仍需要繳款，我們也給予繳款寬限期(依本所回復函內容所載日期為準)。倘已繳納，亦無須擔心，請俟收到裁決所寄送函文結果再行辦理後續事宜。","u":"臺北市交通事件裁決所違規申訴課","h":53479,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0E921520EB20DB12","d":"2017-03-28","sid":"0E921520"},{"q":"交通違規車輛須吊扣牌照，應到案處所為本所時，臨櫃應如何辦理(應備文件)?","a":"一、車主為自然人\n(一)車主本人辦理\n1.吊扣機車牌照：\n(1)普重(輕)型機車：攜帶號牌1面、行照1枚、身分證正本。\n(2)大型重型機車：攜帶號牌1面(黃牌)、號牌2面(紅牌)、行照1枚、身分證正本。\n2.吊扣汽車牌照：攜帶號牌2面、行照1枚、身分證正本。\n(二)車主委託他人辦理\n攜帶車輛號牌、行照、身分證 (受任人及車主)正本，並檢附 委任書 到案辦理。\n二、車主為法人\n(一)法定代理人(公司負責人)本人辦理\n1.吊扣機車牌照：\n(1)普重(輕)型機車：攜帶號牌1面、行照1枚、身分證正本。\n(2)大型重型機車：攜帶號牌1面(黃牌)、號牌2面(紅牌)、行照1枚、身分證正本。\n2.吊扣汽車牌照：攜帶號牌2面、行照1枚、身分證正本。\n(二)法人(公司)委託他人辦理\n攜帶車輛號牌、行照、受任人身分證正本及車主營業登記證明文件，並檢附 委任書 到案辦理。","u":"臺北市交通事件裁決所違規裁罰課","h":51737,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F411D0CF4359C06D","d":"2023-09-13","sid":"F411D0CF"},{"q":"我是車主，但不是實際駕駛人，如何於線上系統「e歸責申請」辦理將交通違規案件歸責給實際駕駛人？","a":"一、車主收到舉發通知單，如果違規當時車主並非實際駕駛人，可檢附相關證據及實際駕駛人駕照影本，於應到案日前向裁決所申請將違規歸責給實際駕駛人。\n二、申請條件：\n1.應到案日期前申請（過期即無法申請）。\n2.應到案處所為「臺北市交通事件裁決所」。\n三、至本所網站首頁點選「 e歸責申請 」，您可以依據以下身分選擇申請類型。申請完成後，畫面會顯示案件編號，系統並自動寄送e-mail顯示案件案號與案號密碼，後續可在「 進度查詢 」頁面查詢辦理進度。若「實際駕駛人」的駕籍非本市管轄，本所會將案件移轉至駕駛人之管轄機關，由該機關辦理歸責審核事宜。\n□車輛租賃業者/車行/大宗違規申請人\n再點選「短租車」\n備註：1.申辦件數10件以上依序號5.租賃公司(短租車)方式申請。\n2.非車主本人申請請附 委任書 。","u":"臺北市交通事件裁決所案件管理課","h":48393,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=55EA31502A778396","d":"2023-10-04","sid":"55EA3150"},{"q":"行車事故鑑定一般需多少時間?","a":"您申請的鑑定案件，受理申請後2個月內完成鑑定作業，如因特殊事故，得再延長2個月完成。而在申請後會召開鑑定會，邀請當事人出席說明案情。您可以參考鑑定意見書記載的肇事責任，進行後續和解、理賠、訴訟；若對鑑定意見書記載之肇事責任仍有疑義，也可以再提起覆議。","u":"臺北市交通事件裁決所肇事鑑定課","h":44493,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=58000124FA3624E5","d":"2026-04-29","sid":"58000124"},{"q":"大型重型機車(紅、黃牌)為何不可以停放於一般機車停車格？","a":"按道路交通管理處罰條例規定，大型重型機車，除本條例另有規定外，比照小型汽車適用其行駛及處罰規定，爰大型重型機車停放應比照小型車，不可停放於一般機車停車格。","u":"臺北市交通事件裁決所違規申訴課","h":40974,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4CAAE550A9EE1FC2","d":"2021-03-04","sid":"4CAAE550"},{"q":"罰鍰已經繳納了，為什麼又收到裁決書？","a":"1.請先確定您繳款的單據資料和收到的裁決書中的車號、證號及單號是否相同，如果不同，那麼可能收到的裁決書是另一件違規案件。 2.如果確定是同一件違規案件，則可能是您繳款的時間，剛好是我們製開裁決書後的寄送期間內，因為時間差的因素，以致於仍收到裁決書。 3.為確認罰單是否已繳納，建議您可利用下列管道查詢： (1)監理服務網（ https://www.mvdis.gov.tw ）。 (2)\"監理服務\"App（ios或Android系統）。 (3)電洽裁決所（02-23658270轉9話務中心），提供裁決書違規單號，我們將為您查詢。如已繳納，那麼這張裁決書就無需再處理了。","u":"臺北市交通事件裁決所積案催收課","h":39240,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EE5370CC5491F768","d":"2016-10-24","sid":"EE5370CC"},{"q":"請問陳述(申訴)多久會有結果？","a":"本所收到陳述(申訴)案件後如陳述事項需查證，隨即轉請原舉發機關查證，俟該機關回復後，並經綜合研判即回文答復；如為本市舉發案件最長為43天內回復，如為外縣市舉發案件，最長為57天內回復。","u":"臺北市交通事件裁決所違規申訴課","h":39056,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9C637D3A78703027","d":"2017-02-07","sid":"9C637D3A"},{"q":"對警方「初步分析研判表」有異議要如何處理?","a":"1.可以向交通警察大隊申訴(地址：100057臺北市中正區愛國西路26號，電話：02-23752100)。 2.可以向本所肇事鑑定課申請鑑定，重新分析肇事責任(地址：100046臺北市中正區羅斯福路4段92號7樓，電話：02-23658270分機818)。","u":"臺北市交通事件裁決所肇事鑑定課","h":30776,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7DF9E2D10778301D","d":"2016-04-27","sid":"7DF9E2D1"},{"q":"對陳述(申訴)結果不服怎麼辦？","a":"如不服陳述(申訴)結果時，得提起行政訴訟，請洽本所開立裁決書或上網透過 台北服務通 申請，以司法狀紙敘明理由並連同裁決書及其他足資佐證資料等，向高等行政法院地方行政訴訟庭提起行政訴訟，以資救濟。(其中撤銷訴訟之提起，應於裁決書送達後30日之不變期間內為之。)","u":"臺北市交通事件裁決所違規申訴課","h":30198,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=89135A7255C2339D","d":"2023-08-21","sid":"89135A72"},{"q":"如何申請鑑定?","a":"1. 申請方式： (1)「已進入司法程序者」(已提出告訴)：請將您的疑義寫出，並向「司法機關」聲請鑑定。 (2)「未進入司法程序者」(未提出告訴)：可以在事故發生後6個月內，向「本所」申請鑑定(請附身分證【或駕照】影本、警方「道路交通事故初步分析研判表」影本及規費3,000元)，詳如申請鑑定注意事項。 2. 注意事項： (1)鑑定申請表請至本所網站或至「 台北服務通 」下載，或至本所7樓20號櫃檯領取。 (2)鑑定需繳規費3,000元，可親至本所繳納或以匯款等方式繳納(詳情請電洽：02-23658270分機818)；透過台北服務通申請者，請依系統指定方式繳費。如申請鑑定後，因自行和解而撤銷鑑定者，可辦理退費。","u":"臺北市交通事件裁決所肇事鑑定課","h":28497,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=852EC0A8CE46C43F","d":"2016-11-08","sid":"852EC0A8"},{"q":"如何調閱民眾檢舉照片及警察逕行舉發照片？","a":"舉發機關 網址 QR-CODE 臺北市政府警察局 https://smsweb.tcpd.gov.tw/NewSmsWeb/#/photoLimit 新北市政府警察局 https://trspweb.ntpd.gov.tw/#/ 臺中市政府警察局 https://tcpbcase.police.taichung.gov.tw/TCHBCase/ 臺南市政府警察局 https://trafficserve.tnpd.gov.tw/#/ 高雄市政府警察局 https://kcpdcase.kcg.gov.tw/","u":"臺北市交通事件裁決所違規申訴課","h":23942,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=40D1D617D7492033","d":"2023-05-29","sid":"40D1D617"},{"q":"交通違規已移送強制執行或債憑如何辦理分期繳款？","a":"1. 已移送強制執行或再執行：請至受理該案件的行政執行分署辦理。 2. 已取得債權憑證：至裁決所辦理，應備文件詳見「 交通違規罰鍰是否可以分期繳納？應備文件？ 」","u":"臺北市交通事件裁決所積案催收課","h":23680,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FC659AE045D9F78F","d":"2022-03-08","sid":"FC659AE0"},{"q":"遭警攔下舉發，因一時害怕簽名，是否即已認定罰單，是否可陳述(申訴)？該如何採取保護措施？","a":"一、簽名僅係表示收取罰單，並非承認違規，對所舉發之違規如有不服，可提出陳述(申訴)。\n二、任何交通違規案件均可陳述(申訴)；可先蒐集有利自己之證據(如：以行車錄影或照相器材拍照取證)及提出理由，俾能陳述(申訴)時作為證明資料；如陳述(申訴)遭駁回，亦可舉證向管轄高等行政法院地方行政訴訟庭提起行政訴訟。","u":"臺北市交通事件裁決所違規申訴課","h":22346,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5D1319D25174B428","d":"2016-04-26","sid":"5D1319D2"},{"q":"違規通知單所指定的應到案日期恰好是假日，應如何處理？","a":"可順延至次一辦公日辦理繳款結案，視為未逾期。","u":"臺北市交通事件裁決所違規裁罰課","h":22298,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=30677293B7335F7E","d":"2021-05-03","sid":"30677293"},{"q":"民眾於臺北市撥打1999市民熱線陳述交通違規案件之罰單申訴，需提供那些資訊？","a":"1. 倘民眾只收受白色之逕行舉發標示單（俗稱：白單），尚須由舉發機關(開單單位)確認違規事實及車輛無誤後，始填製違規通知單(俗稱：紅單)，非屬臺北市交通事件裁決所權管，故由舉發機關(開單單位)受理申訴。 2. 倘民眾已收受違規通知單（俗稱：紅單），請提供下列資訊： (1)應到案處所（→此為優先判斷是否為「臺北市交通事件裁決所」管轄案件，如非屬該所權管，建議民眾逕向管轄處所辦理申訴，以減省公文行政作業時間。）。 (2)舉發機關（開單單位）。 (3)舉發單號。 (4)車牌號碼。 (5)車籍地（→逕行舉發案件係以車籍地判斷應到案處所，如為員警當場攔停舉發，則可能視情況為車輛車籍地或駕駛人駕籍地列管案件，需於公路監理資訊系統查詢始能確認）。 (6)違規時間（→非入案時間，因舉發機關辦理入案作業會有時間落差，故如公路監理資訊系統尚未入案，則逕由舉發機關受理申訴。）。 (7)違規地點（→肇事致人傷亡及酒駕案件係以此行為地判斷應到案處所）。 (8)違規事項。 (9)採證照片或其他佐證資料。 3. 另建議民眾如交通違規案件屬臺北市交通事件裁決所管轄者，也可至該所網站之「申請案件」連結至「 台北服務通 」網路申辦罰單申訴或自行下載「交通違規案件陳述書」 以郵寄方式辦理申訴。","u":"臺北市交通事件裁決所違規申訴課","h":22210,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AC4C7D1C0C3BA448","d":"2016-04-27","sid":"AC4C7D1C"},{"q":"吊扣駕照執行之起迄時間如何計算？","a":"1.吊扣駕照之執行以實際繳交駕照之日起算，於吊扣期滿後發還。\n2.例如：酒後駕車遭警舉發之違規案件，如應受駕照吊扣1年處分，自繳送日起算1年。\n（例：106.9.20繳送駕照，106.9.20~107.9.19執行駕照吊扣處分1年，於107.9.20發還）。","u":"臺北市交通事件裁決所違規裁罰課","h":21879,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=180329988AC28E19","d":"2017-09-13","sid":"18032998"},{"q":"民眾檢舉違規案不可以連續舉發？","a":"民眾檢舉同一輛車同一違規行為，其違規時間相隔超過6分鐘或行駛經過一個路口以上，是可以連續舉發。","u":"臺北市交通事件裁決所違規申訴課","h":21679,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=21B8C382FCF76F65","d":"2023-10-23","sid":"21B8C382"}]},{"org":"法務局","total":130,"items":[{"q":"網購下單後可以不取貨嗎?會不會被告?","a":"Q1.我不小心在一頁式詐騙網站訂貨，因此想取消訂單，我透過網站跟賣家連繫取消，沒想到賣家堅持要寄出商品，還揚言若不取貨，將會提告詐欺、背信及毀損，警告不得棄單。究竟網路購物後，可不可以不取貨呢? A1： 一般網路購物，消費者本有7日猶豫期，可於到貨前或取貨後7日內解約退貨，是正當的權利行使，不會構成犯罪:\n1.依消費者保護法（下稱消保法）第19條規定，一般網路購物，除生鮮食品、客製化商品等特殊商品外，消費者在收到商品後7日內可以通知業者解約退貨，無須說明理由及負擔任何費用或對價，所以收貨後認為不符合需要、不滿意商品等，縱然商品沒有瑕疵，消費者均可以在7日內通知業者解約。至於收到商品前，依消保法施行細則第18條，消費者也可以通知業者解約。既然收到商品前，消費者依法有取消訂單的權利，自然也無需付款取貨。\n2.實務上有些網購賣家會以「小心棄單將吃官司」等言詞、或傳「報案三聯單」的照片，迫使消費者屈於壓力取貨付款。事實上，若消費者只是單純下單後改變心意而解約退貨，乃是行使消保法第19條所賦予之權利，並不會構成犯罪。因此，消費者下單後如果發現是一頁式廣告詐騙、或找到更適合產品、或單純不想買了等因素，只要沒有購買意願，都可以通知賣家解約，無須屈從賣家言詞，勉強取貨付款，讓自己負擔遭詐騙的風險。如果是宅配到府，可以直接請貨運業者帶回；如果商品已經到超商，消費者可以不取貨。\n3.若非免運賣場，買家仍宜依約取貨付款：\n目前許多網購多以免運費作為行銷，但若下標時該賣場並無免運，而係約定由買方負擔寄貨運費，則當買家未取貨時，賣家可能就運費向買家提出民事求償。只是目前實務上超商或網購平台多提供未取件則免收運費之服務，或是賣家縱有運費支出但金額甚低，所以廠商通常不會大費周章為了幾十元運費提起訴訟，但仍提醒若非免運賣場，因買家有支付運費之義務，仍宜先依約取貨付款，以避免被廠商求償運費損失的可能。\nQ2.如果是客製化商品，我可以下訂後不取貨嗎? 如果不取貨，會有甚麼責任? A2： 客製化商品、生鮮產品等依規定之特殊商品，並無7日無條件退貨的權利，除非商品有瑕疵，否則應履行契約，也就是要取貨付款。\n1","u":"臺北市政府法務局","h":395741,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64DAAF2096231776","d":"2022-07-13","sid":"64DAAF20"},{"q":"何謂「公法人」？","a":"所謂的「公法人」，係依據公法規定成立之法人，我國現有之「公法人」如下： 1. 中華民國 2. 地方自治團體 3. 行政法人 說明： 按「法人」依其成立所依據之法規屬性，而有「公法人」與「私法人」之區別。換言之，依據公法設立者，為公法人；依據私法設立者，則為私法人。依此標準，由於我國實務上各類法人絕大多數係依據民法上社團法人或財團法人之規定成立，均定性為私法人，故依公法規定成立之公法人，實屬少見。","u":"臺北市政府法務局","h":63172,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=01A177715CE07EC3","d":"2013-08-02","sid":"01A17771"},{"q":"消費退換貨有無次數規定？","a":"一、退貨與換貨\n所謂『退貨』應係指交易雙方解除買賣契約，致賣方負擔返還價金之義務；買方則負有返還標的物之義務。\n又所謂『換貨』應係指於退貨後，賣方以應退還與買方之價金與買方就不同標的物另行成立一個買賣契約。故有複數契約關係存在。是以一般認為單純的『換貨』（非瑕疵品的修補與替換），其實包涵兩個以上的買賣關係。\n請務必注意，此所謂換貨須與因商品瑕疵，消費者依民法第364條規定請求另行交付無瑕疵之物所生之換貨不同，在此情況下如換得之物仍有瑕疵，則無換貨次數限制。\n二、一般買賣之退換貨\n一般而言，交易行為（買賣契約）一旦成立，除非商品（標的物）有嚴重的瑕疵，依民法第359條解除契約或減少價金，否則單純因為消費者不滿意商品的顏色、大小、外觀等非屬瑕疵之點，尚不足以請求業者退換商品。\n惟部份業者為服務消費者有更有利於民法上規定之約定（例如：一般買賣亦予消費者一定期間之無條件退換貨之約定），則消費者仍得據以向該業者主張。但此為特定業者之特別約定，消費者尚不可據以主張所有之一般消費行為均有其適用，合先敘明。\n有關消費者退換貨次數，法律上尚無相關規定。在一般買賣的情形，如果貨物有瑕疵，原則上消費者得依前揭民法規定請求退貨（解除契約，返還價金）或換貨（就應返還與消費者之價金與業者另行就其他標的物成立買賣契約），在此情形下如換得的貨物仍有瑕疵，此時依然可以再次主張退貨或換貨，並無次數之限制。\n惟前揭退貨若係因商品瑕疵，致消費者主張解除契約之情況，業者返還價金係業者之義務；惟是否與消費者就其他標的物另成立買賣契約，則繫諸於雙方，亦即若業者不欲與消費再成立契約，亦非法所不許。\n三、通訊交易或訪問交易之退換貨\n在通訊交易或訪問交易的情形，除了有前揭一般買賣規定之適用外，依消費者保護法第19條消費者在收受商品後7日內，倘非屬通訊交易有合理例外情事者，均得退回商品或以書面通知企業經營者解除買賣契約，而無須說明理由及負擔任何費用或價款。係消保法賦予消費者在此種特殊買賣下之特權。\n但亦如前述，雖消保法規定有無條件退貨（解除契約）之權利，但業者無與消費者另行成立買賣契約之義務，惟若業者尚與消費者成立其他通訊","u":"臺北市政府法務局","h":56478,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4EA2341D3F181797","d":"2013-08-08","sid":"4EA2341D"},{"q":"什麼是行政處分?","a":"所謂行政處分，就是行政機關就公法上具體事件所為的決定或其他公權力措施而對外直接發生法律上效果的單方行政行為。例如：建築執照核發、命拆除違建、戶籍登記、土地登記、命停止營業及環保、衛生等各類行政罰鍰。如果您對行政處分認為有違法或不當，損害您自身權利或利益，就可以在行政處分書送達次日起30日內提起訴願，來保障自身的合法權益。 此外，如行政機關對於您依法申請的案件，在法定期間內應作為而不作為，以致於損害到您的權利或利益的話，也可以提起訴願。 提醒您，如果您是希望請求確認行政機關所作的行政處分無效、確認公法上法律關係成立或不成立，或是請求公法上的給付等，是不可以提起訴願的，請您直接向高等行政法院提起行政訴訟。此外，因交通違規舉發案件，是向舉發機關或交通事件裁決所申訴，如不服申訴結果，得對裁決書再向地方法院行政訴訟庭提起行政訴訟，這類案件也是不可以提起訴願的。 現在各類的處分書後面都會註明救濟途徑，因此當您收到書面的行政處分時，請您多留意上面的說明，如此才能完整的保障您的權益。 （參考法條：訴願法第1條、第2條、第3條）","u":"臺北市政府法務局","h":27360,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9C0D94964968C5C3","d":"2013-08-08","sid":"9C0D9496"},{"q":"消費爭議申訴案件處理流程？","a":"本府消費者服務中心接獲申訴案件後，處理程序如下：(1)本府消費者服務中心於接受消費者所提書面申訴（第一次申訴）後，即依照臺北市消費者保護自治條例第31條規定，立即依申訴案件之性質移送各執行機關處理，各執行機關接受案件之移送後，將發文函請業者依消費者保護法第43條規定書面回覆或直接與申請人溝通協調。(2)若第一次申訴未獲妥適處理，申訴人可提起第二次申訴或申請調解，第二次申訴由消保官函請申訴人及業者到場開會協商。(3)若第二次申訴仍無法獲得妥適處理時，消費者可申請調解，而調解係由本府消費爭議調解委員會居中調解。","u":"臺北市政府法務局","h":22131,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2FC79D4880EE6B0A","d":"2013-08-08","sid":"2FC79D48"},{"q":"什麼是利害關係人?","a":"訴願法規定，自然人、法人、非法人團體或其他受行政處分之相對人及利害關係人均得提起訴願。其中利害關係人係指其權利或法律上利益因行政處分而受到影響的人，例如：因地政機關土地登記之行政處分而權利受到影響之第三人。 （參考法條：訴願法第1條、第2條、第3條、第18條）","u":"臺北市政府法務局","h":21232,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F49B980163110E0B","d":"2013-08-08","sid":"F49B9801"},{"q":"我可以訴願嗎?","a":"Q： 交通違規被開罰單如何訴願? A： 有關交通違規被開罰單的部分，依道路交通管理處罰條例規定，得於30日內向原舉發機關申訴，如對申訴結果仍然不服，得於接到裁決書之次日起30日內向管轄之地方法院行政訴訟庭提起行政訴訟，此乃法律所規定之特殊救濟途徑，此類案件如果提起訴願，在程序上即無法受理。 Q： 我跟市政府簽了1份採購契約，現在履約出了問題，可否提起訴願? A： 本府訴願審議委員會是針對人民不服具體行政處分，欲提起行政救濟時之受理機關，因此，您與市政府之間有關採購契約的糾紛，應該依事件性質，向本府採購申訴審議委員會提起申訴或申請履約爭議調解。 Q： 我有買賣預售屋的糾紛，可否提起訴願? A： 有關預售屋買賣糾紛，應循一般民事訴訟的程序解決，市政府有免費法律諮詢服務，另外，本局亦有消保官可為您處理相關問題，請撥打臺北市民當家熱線1999(外縣市請撥02-27208889)詢問相關資訊。 Q： 我在南港開小吃店，1位外籍朋友來店裡玩，當時客人很多，他主動幫我收碗盤，臺北市政府勞動局認為我非法聘僱外勞，罰了15萬元，我一直跟勞動局承辦人解釋，但他們不聽我的辯解，我要怎麼辦? A： 如果您認為勞動局承辦人員判斷不正確，致使所為之罰鍰處分違法或不當，您可依訴願法相關規定提起訴願，向市政府遞送訴願書。 Q： 對於衛生局的行政處分書都可以直接向訴願會提起訴願嗎？ A： 一般而言，對於衛生局的行政處分書如有不服，原則上可以直接提起訴願；但例外的是不服違反藥事法的處分書則不可以直接提起訴願，須於處分書送達後15日內先向衛生局提出異議申請復核，不服衛生局的復核處分，才可提起訴願。","u":"臺北市政府法務局","h":16014,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D67FD6B475E09FCF","d":"2013-08-08","sid":"D67FD6B4"},{"q":"不服訴願決定怎麼辦?","a":"訴願決定後還有什麼救濟途徑 一、提起行政訴訟： 目前行政救濟制度，分為訴願、行政訴訟2級。如果不服訴願之決定，或訴願機關於提起訴願後3個月內不為決定，或延長訴願決定期間逾2個月仍不為決定者，人民即得向行政法院提起行政訴訟，無須再經過訴願之程序，如不服高等行政法院或地方法院行政訴訟庭之裁判者，得向最高行政法院或高等行政法院上訴或抗告。易言之，增加法院以裁判者之立場，處理人民與機關間爭議之機會，係法治國家保障人民權利之重要表徵。 二、申請再審： 如果訴願決定後，未能依前項規定期限向行政法院提起行政訴訟，致使訴願決定「確定」，在舊訴願法是沒有辦法可以救濟的。但是，在新訴願法中有再審制度的設計，只要有下列情形之一者，得向原訴願決定機關聲請再審： (1) 適用法規顯有錯誤者。 (2) 決定理由與主文顯有矛盾者。 (3) 決定機關之組織不合法者。 (4) 依法令應迴避之委員參與決定者。 (5) 參與決定之委員關於該訴願違背職務，犯刑事上之罪者。 (6) 訴願之代理人，關於該訴願有刑事上應罰之行為，影響於決定者。 (7) 為決定基礎之證物，係偽造或變造者。 (8) 證人、鑑定人或通譯就為決定基礎之證言、鑑定為虛偽陳述者。 (9) 為決定基礎之民事、刑事或行政訴訟判決或行政處分已變更者。 (10) 發現未經斟酌之證物或得使用該證物者。 申請再審，原則上應自訴願決定「確定」時起算30日內為之。 （參考法條：訴願法第97條）","u":"臺北市政府法務局","h":15525,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4B6C59672A6ED0F0","d":"2013-08-08","sid":"4B6C5967"},{"q":"訴願程序進行相關問題","a":"Q： 我兩天前有送1份訴願書到法務局，為何還沒有結果？ A： 當您遞送訴願書至本局後，本局會先請原處分機關於20天內就您的案件提出答辯書，也就是請原處分機關說明作成處分之法令依據及理由，本局收到原處分機關之答辯理由書後，才能衡酌您的訴願理由及原處分機關的答辯理由，擬具審議書，經由本府訴願審議委員會作出適當的訴願決定。一般的訴願案件審理期間大約需要3個月的時間，必要時得依訴願法第85條規定延長2個月。另本局提供「手機簡訊通知訴願案件辦理進度」服務，如有需要，請於訴願書註明。 Q： 我的房屋被查報為違建，建管處要強制拆除，如果我提起訴願，可否先不要拆除房屋? A： 依訴願法第93條規定，原處分的執行，除法律另有規定外，不會因為您提起訴願而停止，因此原則上建管處仍會進行違建拆除作業，如果您認為有停止執行的必要，可依該規定向原處分機關或本府申請停止執行，再由原處分機關或本府審酌是否有訴願法第93條第2項所規定應停止執行之必要。 Q： 提起訴願須要用制式的訴願書嗎？ A： 提起訴願應以書面辦理，但並不一定要用制式訴願書，您只須將當事人的姓名、出生年月日、身分證統一編號、住址及不服的行政處分、訴願請求、訴願的事實及理由表達清楚即可。您也可以在本局網站下載空白訴願書來填寫。 Q： 訴願書要如何遞送？向什麼機關遞送？ A： 有關訴願書的遞送方式，您可以郵寄給本局或原處分機關；您也可以親自遞送到本局服務櫃檯或原處分機關。 Q： 我在105年3月1日收到環保局的罰單，最晚要在什麼時候提起訴願？ A： 依訴願法的規定，您要在收到罰單或處分書送達之次日起30日內以書面向環保局提起，所以您105年3月1日收到罰單，至遲要在105年3月31日前提起，而且是以機關收到的日期為準。如果您擔心郵寄時間無法掌握，亦可於本網站首頁 線上服務 / 線上申辦 / 訴願線上申請 / 點選「線上聲明訴願」，先行登錄您的資料，以確保您的權益。但是，提醒您聲明訴願後，仍應於30日內補送訴願書至本局，否則本局仍無法受理您的訴願案件。","u":"臺北市政府法務局","h":14491,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C1A56C5E6CA7A1A0","d":"2013-08-08","sid":"C1A56C5E"},{"q":"訴願決定的種類","a":"一、訴願不受理 訴願事件有下列各款情形之一者，應為不受理之決定︰ (一)訴願書不合法定程式不能補正或經通知補正逾期不補正者。 (二)提起訴願逾法定期間或未於第57條但書所定期間內補送訴願書者。 (三)訴願人不符合第18條之規定者。 (四)訴願人無訴願能力而未由法定代理人代為訴願行為，經通知補正逾期不補正者。 (五)地方自治團體、法人、非法人之團體，未由代表人或管理人為訴願行為，經通知補正逾期不補正者。 (六)行政處分已不存在者。 (七)對已決定或已撤回之訴願事件重行提起訴願者。 (八)對於非行政處分或其他依法不屬訴願救濟範圍內之事項提起訴願者。 （參考法條：訴願法第77條） 二、實體駁回 訴願主張若無理由，就會被訴願駁回。 （參考法條：訴願法第79條） 三、原處分撤銷 訴願主張若有理由，原處分將遭撤銷。共有4種情形： 單純撤銷：指訴願決定是原處分撤銷，不再命原處分機關另為處分。 諭示原處分機關另為處分：撤銷原處分，責由原處分機關另為處分時，表示尚有未查明事項，我們要求原處分機關詳查後重新為處分。原處分機關重核所作的新處分，有可能維持原處分，也有可能依本府決定另為處分。 諭示原處分機關另為處理：撤銷原處分，責由原處分機關另為處理時，表示原處分機關並無作成處分之權限，我們要求應由有權機關為處分。 自為改處：以本府名義自行改處分。此係為保護訴願人的權益，對事實已查明的案件，即逕為訴願決定，加以改處。例如：房屋若部分為營業用，部分為住家用，則依實際之比例課徵房屋稅，但就地價稅的課徵，稅捐稽徵處引用財政部的函釋，認為有別於房屋稅，應全部依一般稅率課徵。委員會則依實質課稅原則逕將地價稅也比照房屋稅，依使用比例直接改處；又如環保案件，視違規情節輕重，直接改處較低罰鍰。 （參考法條：訴願法第81條） 四、命速為處分 人民因中央或地方機關對其依法申請之案件，於法定期間內應作為而不作為，認為損害權利或利益，提起訴願後，經認為訴願主張有理由，指定相當期間，命應作為之機關速為一定之處分。 （參考法條：訴願法第82條）","u":"臺北市政府法務局","h":14113,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FB6B7CA5697C8A54","d":"2013-08-08","sid":"FB6B7CA5"},{"q":"國賠請求書格式為何？","a":"（一）自行填寫國家賠償請求書簽名或蓋章，並附上相關證據寄送給賠償義務機關，請求書內容應包含：\n１、請求權人之姓名、性別、出生年月日、出生地、身分證統一編號、職業、住所或居所。請求權人為法人或其他團體者，其名稱、主事務所或主營業所及代表人之姓名、性別、住所或居所。\n２、有代理人者，其姓名、性別、出生年月日、出生地、身分證統一編號、職業、住所或居所。\n３、請求賠償之事實及理由。\n４、請求損害賠償之金額或回復原狀之內容。\n５、賠償義務機關。\n６、年、月、日。\n(二）得參考本府法務局網站（legalaffairs.gov.taipei）首頁「國家賠償」點選「書表下載」後再點選「國家賠償請求書」，填寫完畢後下載檔案，印出紙本簽名或蓋章，連同相關證據寄送給賠償義務機關。","u":"臺北市政府法務局","h":12861,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3D90EB8664639CBD","d":"2013-08-02","sid":"3D90EB86"},{"q":"提起訴願後，原行政處分是否即停止執行?","a":"依訴願法第93條第1項規定，原行政處分之執行，除法律另有規定外，不因提起訴願而停止。因此，原則上，您提起訴願後，原行政處分並不因此而停止執行；但是，您可向原處分機關、本局申請停止執行，如果符合原行政處分之合法性顯有疑義或原行政處分之執行將發生難以回復之損害，且有急迫情事，並非為維護重大公共利益所必要等情形，即可停止執行。","u":"臺北市政府法務局","h":12623,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7586EA0E26B92DA5","d":"2013-08-08","sid":"7586EA0E"},{"q":"信用卡爭議款申請小撇步","a":"消費者若因申請爭議款與發卡機構發生疑義，可向中華民國銀行公會設置之信用卡單一申訴窗口（02-85962333）洽詢信用卡相關疑義，銀行公會將協助向發卡機構進行瞭解。","u":"臺北市政府法務局","h":11074,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A1635BD14EABFE02","d":"2022-07-22","sid":"A1635BD1"},{"q":"有關人民提起訴願相關流程過程？","a":"人民提起訴願案件相關流程 人民對行政處分不服時，依訴願法第58條及第59條規定（下列條文均為訴願法），得經由原行政處分機關向訴願管轄機關提起訴願或直接向訴願管轄機關提起訴願。如係經由原處分機關向訴願管轄機關提起訴願者，相關流程如下所述；如直接向訴願管轄機關提起訴願者，訴願管轄機關應將訴願書影本送交原處分機關依下流程進行審查： （一）原處分機關應先審查行政處分是否合法適當（第58條）並分別處理： 1、原處分不合法或不妥當（訴願有理由） 原處分機關應自行撤銷或變更處分，並向訴願管轄機關陳報。 2、原處分合法妥當（訴願無理由） 原處分機關認為訴願無理由時，應向訴願管轄機關進行檢卷答辯。 （二）訴願管轄機關 1、於訴願繫屬期間中，訴願人得申請下列程序： （1）申請閱卷（第49條） （2）申請陳述意見（訴願管轄機關得職權通知訴願人或關係人陳述意見）（第63條） （3）申請言詞辯論（訴願管轄機關得職權通知訴願人或關係人言詞辯論）（第65條） 2、訴願管轄機關承辦人撰寫審議書稿後，應提交委員會審查並由委員會作出訴願決定，訴願決定之態樣如下： （1）訴願不受理 （2）訴願駁回 （3）撤銷（含單純撤銷、撤另處、撤改處）","u":"臺北市政府法務局","h":11052,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FE29CC7523625FB9","d":"2013-08-08","sid":"FE29CC75"},{"q":"申請調解是否須付費？其收費標準為何？廠商如果繳費後，未得到滿意之答案，其費用可否退回？","a":"(一)申請調解依規定需要付費。\n(二)收費標準係依行政院公共工程委員會頒布之「採購履約爭議調解收費辦法」之規定辦理。\n(三)調解費用如以請求或確認金額為調解標的者，調解費如下：（採購履約爭議調解收費辦法第5條）\n1.金額未滿新臺幣200萬元者，新臺幣2萬元。\n2.金額在新臺幣200萬元以上，未滿500萬元者，新臺幣3萬元。\n3.金額在新臺幣500萬元以上，未滿1,000萬元者，新臺幣6萬元。\n4.金額在新臺幣1,000萬元以上，未滿3,000萬元者，新臺幣10萬元。\n5.金額在新臺幣3,000萬元以上，未滿5,000萬元者，新臺幣15萬元。\n6.金額在新臺幣5,000萬元以上，未滿1億元者，新臺幣20萬元。\n7.金額在新臺幣1億元以上，未滿3億元者，新臺幣35萬元。\n8.金額在新臺幣3億元以上，未滿5億元者，新臺幣60萬元。\n9.金額在新臺幣5億元以上者，新臺幣100萬元。\n(四)若非以請求或確認金額為調解標的者，調解費為新臺幣3萬元。但調解標的得直接以金額計算者，其調解費依前揭規定計算。（採購履約爭議調解收費辦法第6條）\n(五)調解申請不予受理者，免予收費。已繳費者，無息退還所繳調解費之全額。但已通知調解期日者，收取新臺幣5,000元（採購履約爭議調解收費辦法第10條）。\n(六)依採購履約爭議調解收費辦法第15條第2項規定，調解不成立時，調解費、鑑定費及其他必要費用由已繳費之當事人負擔。因此，倘廠商就調解事項未能得到滿意結果，恕不退回所繳之調解費。","u":"臺北市政府法務局","h":10939,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2BD29BF634A4EF2E","d":"2013-08-02","sid":"2BD29BF6"},{"q":"提起行政爭訟案件之流程為何？","a":"A：有關行政爭訟案件之流程如下圖：\n行政爭訟流程圖\n人民提起訴願，訴願管轄機關作成訴願決定後，訴願人若對訴願決定書不服時，應於收到訴願決定書二個月內提出行政訴訟，如未提出或提出行政訴訟時已逾二個月，則訴願決定即確定，此時若仍不服，得向訴願決定機關申請再審。又訴願人於收到訴願決定書後於二個月內提出行政訴訟，其救濟流程說明如下： （一）普通行政事件（通常訴訟程序） 1、第一審（事實審）：高等行政法院。 收受高等行政法院判決書後20日內可向最高行政法院提起上訴，逾期則判決確定。 2、第二審（法律審）：最高行政法院。 收到最高行政法院判決書後，判決確定。 （二）簡易行政事件（簡易訴訟程序） 1、第一審（事實審）：地方法院行政訴訟庭 收受地方法院判決書後20日內可向高等行政法院提起上訴，逾期則判決確定。 2、第二審（法律審）：高等行政法院 收到高等行政法院判決書後，判決確定。 ※註：行政訴訟法於100年11月23日修訂；101年9月6日施行。（行政訴訟改採三級二審新制）","u":"臺北市政府法務局","h":10730,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A34C74DDB372C6AF","d":"2013-08-08","sid":"A34C74DD"},{"q":"什麼是「公共設施」？","a":"公共設施，是指供公共使用的各種設施，例如道路、橋樑、水溝、下水道、公立學校校舍、醫療機構等是。這些設施必須已經開始供公共使用，如果僅是在施工建造中，而尚未完成以供公務或公眾使用，就不屬於這裡所說的「公共設施」。 所稱「公共設施」，係指直接供公之目的使用之道路、橋樑、港埠等，而阿里山小火車並非直接供公之目的使用之公共設施，而係基於私經濟目的使用之交通工具，與上開「公有公共設施」之要件不符。故蘇○琴女士之夫李○輝君之死亡亦不得以公有公共設施設置或管理有欠缺為由，請求國家賠償。（法務部92年04月22日發文字號：法律字第0920012472號；法務部公報第303期8-9 頁－阿里山小火車國家賠償事件） （參考條文：本法第3條）","u":"臺北市政府法務局","h":10559,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=772E1A9BB80D137A","d":"2013-07-31","sid":"772E1A9B"},{"q":"可否補充訴願理由？","a":"訴願案件原則上是採書面審查方式進行，如果您認為原處分機關的答辯書內容有不正確或需補充的地方，想要再加強或補充說明的話，您可以儘速檢附相關證據以書面方式補充訴願理由，逕送或掛號郵寄至本局併案審議。（參考法條：訴願法第1條、第2條、第3條、第18條）","u":"臺北市政府法務局","h":9295,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=22CFE426C501C17A","d":"2013-08-08","sid":"22CFE426"},{"q":"如何提起訴願?","a":"如您對於本府所屬各級機關所為之行政處分，認為違法或不當，致損害您的權利或利益，您可於處分書送達之次日起30日內向原行政處分機關或本局遞送訴願書。提起訴願應以書面辦理，但並不一定要用制式訴願書，您只須將您的姓名、出生年月日、身分證統一編號、住址、聯絡電話及不服之行政處分、訴願請求、訴願之事實及理由表達清楚，並請您於訴願書上簽名或蓋章即可。您也可於此網站首頁 線上服務 / 書表下載 / 訴願審議書表下載 \\ 下載空白訴願書填寫。如果您擔心郵寄時間無法掌握，亦可於本局網站首頁 線上服務 / 線上申辦 / 訴願線上申請 / 點選1.「線上聲明訴願」，先行登錄您的資料，表達不服行政處分之意思，之後要依法在30日內補正書面的訴願書。 （參考法條：訴願法第14條、第56條、第57條）","u":"臺北市政府法務局","h":9026,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=19F97768952714C4","d":"2013-08-08","sid":"19F97768"},{"q":"消費者向本府消費者服務中心申訴之方法？","a":"按行政院所頒佈之「消費爭議申訴案件處理要點」第2點規定，各地消費者服務中心受理申訴案件，原則以「書表」為之；換言之，申訴人必須以書面方式進行申訴；如申訴人親自前來申訴者，且有明確事證足認因特殊困難而無法以書面為之者，應詢問申訴人基本資料、申訴事由及意旨，並填載於申訴資料表後交由申訴人簽名或蓋章。\n此外，申訴人必須在書表上填寫姓名、聯絡電話、聯絡地址、消費爭議內容、企業經營者名稱、企業經營者所在地等資料，以方便本府消費者服務中心處理。","u":"臺北市政府法務局","h":8968,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F45F4E1FE72F061F","d":"2013-08-08","sid":"F45F4E1F"},{"q":"什麼是「行使公權力」？","a":"所謂行使公權力，係指公務員居於國家機關之地位，行使統治權作用之行為而言，並包括運用命令及強制等手段干預人民自由及權利之行為，以及提供給付、服務、救濟、照顧等方法，增進公共及社會成員之利益，以達成國家任務之行為。如國家機關立於私法主體之地位，從事一般行政之補助行為，如購置行政業務所需之物品或處理行政業務相關之物品，自與公權力之行使有間，不生國家賠償法適用之問題 （參考條文：本法第2條；最高法院80年度台上字第525號判決參照）","u":"臺北市政府法務局","h":8745,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BF1AC4A63CBB2C3B","d":"2013-07-31","sid":"BF1AC4A6"},{"q":"什麼是訴願?","a":"當您對臺北市政府所屬各級機關的「行政處分」不服，認為您的合法權益或利益受到損害時，您就可以依照訴願法第 58 條規定 ， 以書面的方式經由原行政處分機關向本局提起訴願。原行政處分機關會針對您所提的訴願理由，先行審查原行政處分的妥當性及合法性，如果認為您的訴願是有理由的，該機關得自行撤銷或變更原行政處分；如認為您的訴願無理由，該機關會將您的訴願案附具答辯書及卷證送本局，再由本府召開訴願審議委員會議，由委員們一起討論您的訴願案，並作出訴願決定，這種行政救濟程序就是訴願。 本府係以任務編組的型態，組成臺北市政府訴願審議委員會，對市政府所屬各級機關所作的行政處分行使監督權，審查有無違反「依法行政」的訴願審議機關。 訴願審議委員會在審理訴願個案時，如發現法令規定不符合時宜或市政府所屬各行政機關事權分工不明確，以致於損害人民合法權益時，除依法對於訴願個案予以審議外，基於全面性為民眾解決問題的考量，也會主動與各行政機關協調聯繫解決方法，期望能發揮訴願制度最大的功能。","u":"臺北市政府法務局","h":8650,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F73689659E08CAB9","d":"2013-08-08","sid":"F7368965"},{"q":"健身房倒閉怎麼辦?我預繳的費用可以追回嗎?分期的費用可以停扣嗎?","a":"Q1.我加入住家附近健身房，並一次預繳3年會籍費用，沒想到健身房突然歇業，負責人人間蒸發。我預繳的會籍費用要得回來嗎?(已預繳繳清會籍費用，想拿回錢)\nA1：依預繳方式不同，循各個管道主張權益：\n1.若消費者當時以「信用卡」刷卡預繳會籍費用，可向發卡銀行提出爭議款申請：\n(1)持卡消費者需自業者停止提供服務日起120個日曆天內（約4個月內），「且」需在交易清算日起540個日曆天內（約1年半內），就未提供服務範圍檢附具體事證(例如契約、會員卡、有使用期間之證明文件)向發卡銀行申請爭議款，請求退回尚未提供服務部分之金額。\n(2)惟計算上，因信用卡爭議處理僅能處理具對價關係價金部分，因此業者若原本提供額外贈品或服務，皆不可以作為求償內容，故若契約約定有贈送會籍期間，依「健身中心定型化契約範本」之簽約注意事項第2點，有關贈品部分將不列入爭議帳款之退款範圍。\n2.若消費者當時以「現金付款或轉帳匯款」繳納會籍費用，僅能向健身業者主張退款：\n(1)消費者可向法院聲請核發支付命令，向健身業者請求退款(詳參 司法院全球資訊網/業務總覽/民事/支付命令 ，及 便民服務/書狀範例/非訟/非訟支付命令 )(退款範圍可參閱下述(2))。健身業者若未於20日內向核發支付命令的法院提出異議，支付命令得為執行名義，消費者可以持支付命令向執行法院聲請強制執行；健身業者若對支付命令有異議，則支付命令於異議範圍內失其效力，消費者支付命令之聲請視為起訴或聲請調解，法院會命補繳裁判費或聲請費後，視其性質進入調解或訴訟程序，法院會訂庭期通知開庭。\n(2)消費者可主張之權利(倒閉業者應負之責任)：\n因可歸責業者事由致契約終止，依「健身中心定型化契約應記載及不得記載事項」之應記載事項第13點：「可歸責業者之事由致不能繼續履約者，消費者得終止契約，業者應依未到期時間比例(含所贈與之會籍期間)計算餘額退還予消費者，不得收取手續費用、違約金或任何名目費用。 前項退費，業者應準用第十點第二項第二款第三目所定方式計算違約金支付予消費者。」，亦即消費者得依未到期時間比例(含所贈與之會籍期間)請求退還餘額，業者除了不得另行收取手續","u":"臺北市政府法務局","h":8480,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=19A51E57F9CC6173","d":"2023-07-25","sid":"19A51E57"},{"q":"得受消費者保護法保護的對象範圍為何，亦即消費者保護法所指之「消費者」為何？是否只要因買賣契約產生爭議即有消費者保護法之適用？","a":"消費者保護法所指的「消費者」係，指以消費為目的而為交易、使用商品或接受服務者。另依行政院消費者保護處中華民國八十七年十一月五日台八十七消保法字第○一二五○號函之說明所示：民眾購買商品，如其目的主要供執行業務或投入生產使用，並非單純供最終消費使用者，核與消費者保護法第2條有關消費者及消費關係之定義未合，尚無消費者保護法之適用。換言之，若消費者購買商品之目的主要係供執行業務或投入生產使用，而非單純供最終消費使用者，則無消保法第2條之適用。","u":"臺北市政府法務局","h":8467,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1592B3F1572DAC5E","d":"2013-08-08","sid":"1592B3F1"},{"q":"如何申請閱卷？","a":"訴願程序中，依訴願法第49條規定，訴願人、參加人或訴願代理人得請求閱覽卷內文書，您可以書面或於本局網站首頁 / 線上服務 / 線上申辦 / 訴願線上申請 / 點選4.「線上申請調閱案卷(已向本府提起訴願者始得提出申請)」即可向本局提出申請。本局於收到申請後，會在10日內正式發文通知您於指定日期、時間到達指定處所進行閱卷。另外，依行政院及各級行政機關訴願文書使用收費標準第2條及第3條規定，閱卷使用費每2小時收取新臺幣20元；不足2小時，以2小時計算；重製或複製文書資料，依訴願文書重製或複製收費標準表收取費用。卷內資料依訴願法第51條、政府資訊公開法第18條等規定，如有不可供閱覽之理由將會封卷，標示不可供閱覽的法條依據，不提供閱覽。","u":"臺北市政府法務局","h":8175,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FFB0A552F18DE733","d":"2013-08-08","sid":"FFB0A552"}]},{"org":"勞動力重建運用處","total":128,"items":[{"q":"外籍移工的薪資所得稅該如何處理呢？","a":"1、居留未滿183天者(屬非居住者)，其應納稅額＝所得額×薪資所得扣繳率。自98年1月1日起，全月薪資給付總額在行政 院核定每月基本工資之1.5倍以下者，按照給付額扣繳6%；超過1.5倍者，按給付額扣繳18%（98年12月31日以前扣繳20%）。\n2、居留滿183天(屬居住者)且無其他所得者，應納稅額＝所得額－免稅額－扣除額＝所得淨額，再按級距稅率計算，若所得淨額 < 0，未達課稅標準得免辦 理個人綜合所得稅結算申報。\n3、移工來臺工作後，如一課稅年度在臺居留天數合計滿183天，應於次年5月1日起至5月31日止，辦理上年度綜合所得稅之結算申報；如該移工於年度結算申報期限開始前離境者，則應於離境前一週，辦理結算申報，稅捐單位於受理申報後，經核算有應退稅款者，至遲於次年4月底前核發退稅支票。\n4、雇主如為所得稅法規定之扣繳義務人，於給付工資時需依該移工的選擇，按全月薪資給付總額扣取6％或依薪資所得扣繳辦法規定扣繳；如雇主僅以個人身分聘用移工來臺從事家庭幫傭或家庭看護工之工作，並非所得稅法規定之扣繳義務人，不論該移工是「居住者」或「非居住者」，於給付工資時不應代扣稅款，但該移工仍須自行按勞動契約上每月約定工資計算所得稅額，依上開規定申報繳納個人所得稅。\n5、對於移工稅務申報，如仍有不清楚的地方，請逕洽詢財政部臺北市國稅局服務科外僑股，電話：(02)23113711轉1116、1118，地址：臺北市萬華區中華路1段2號。\n聯絡課室：臺北市勞動力重建運用處跨國勞動力諮詢課\n聯絡電話：(02)2338-1600分機4109  菲律賓籍分機：4208、4217；印尼籍分機：4205、4207、4213、4214、4215、4216、4219；越南籍分機：4201、4223；泰國籍分機：4221","u":"臺北市勞動力重建運用處","h":136790,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=750AF82746D6EF05","d":"2012-12-31","sid":"750AF827"},{"q":"雇主聘僱家庭看護工工作期間，如果遇到被照顧人往生時，如何安排辦理轉出及要注意哪些事項呢？","a":"由於被照顧人往生事實發生，雇主聘僱家庭看護工資格已經消滅，所以這時候雇主辦理轉出，以下事項要注意： 1、自被照顧人往生事實發生起30日內向勞動部辦理通報（申請同意轉出移工）。 2、接到勞動部核發廢聘許可函後，14日內至公立就業服務機構辦理家庭看護工轉換雇主，轉換期間有60日，若期間內仍然無法找到新雇主，則要為該家庭看護工辦理手續使其出國。 3、家庭看護工在等待轉換新雇主期間，不要指派其從事其他工作，否則即違反就業服務法第57條第1款規定會被處以新台幣15萬元以上75萬元以下罰鍰。 申請表格下載網址：https://reurl.cc/MkEm7X 申辦問題請洽勞動部勞動力發展署：(02)8995-6000","u":"臺北市勞動力重建運用處","h":53123,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F796E6D2367D17FC","d":"2019-10-29","sid":"F796E6D2"},{"q":"外籍學生應該要具備什麼證件才能合法工作？雇主如果要聘僱外籍學生從事工作，在進用程序上要注意什麼？","a":"1. 依就業服務法第50條第1項、雇主聘僱外國人許可及管理辦法規定，外籍學生在台灣打工及工作必須先申請並取得個人工作許可函，若未依規定申請並取得工作許可函，受僱為他人工作，將被處以新台幣3萬元以上，15萬元以下之罰金，又雇主聘僱未經合法申請工作許可之外國人，處新台幣15萬元以上75萬元以下罰鍰。申請資料及程序請參考外國人工作服務網(https://ezworktaiwan.wda.gov.tw/)，相關問題請洽勞動部勞動力發展署(電話：8995-6000)。\n2. 雇主如要聘僱外籍學生，一定要檢查該學生之居留證、學生證及工作許可函正本，核對證件上之基本資料、居留時間、居留事由、工作許可期限(許可期限最長為1年)，並拍照存證，另須注意外籍學生之工作時間除寒暑假外，每星期最長為20小時。\n聯絡課室：臺北市勞動力重建運用處跨國勞動力檢查課\n聯絡電話：(02)2338-1600分機4109","u":"臺北市勞動力重建運用處","h":43664,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A61654087A24FFFC","d":"2012-12-31","sid":"A6165408"},{"q":"檢舉非法外籍移工","a":"民眾如發現有人涉嫌違法使用或僱用非法外籍移工，可提供違法事證(確切工作時間、地點)逕向以下單位檢舉：\n1. 勞動部設置之免付費檢舉非法外籍移工熱線 0800-000-978\n2. 內政部移民署專勤隊 (02) 2239-6393(檢舉大陸籍人士)\n3. 臺北市政府警察局外事科 (02) 2381-7494\n4. 臺北市勞動力重建運用處 (02) 2338-1600\n5. 本市1999市民熱線\n聯絡課室：臺北市勞動力重建運用處跨國勞動力檢查課\n聯絡電話：(02)2338-1600分機4110","u":"臺北市勞動力重建運用處","h":34599,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=217D83824EEA9CBF","d":"2013-07-08","sid":"217D8382"},{"q":"大陸人士應如何申請工作證?","a":"1.大陸人士來台工作之相關問題，可洽詢行政院大陸委員會。\n大陸委員會電話:02-2397-5589\n大陸委員會網址:https://www.mac.gov.tw/\n2.大陸配偶可向移民署申請依親居留證(98年始不用再申請工作許可)\n移民署電話:02-2389-9983(臺北市服務站)\n移民署網址:http://www.immigration.gov.tw/mp.asp?mp=1\n聯絡課室：臺北市勞動力重建運用處跨國勞動力檢查課\n聯絡電話：(02)2338-1600分機4110","u":"臺北市勞動力重建運用處","h":33545,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AF90AE28E08DE110","d":"2013-08-09","sid":"AF90AE28"},{"q":"移工在臺居留期限最長可至幾年？","a":"產業類及家庭類移工，在臺累計工作年限最長為12年。另家庭看護工可向勞動部申請「累計工作期間延長至14年」之評點。 104年10月9日《就業服務法》第52條修正公布施行，放寬家庭看護工如經專業訓練或自力學習而有特殊表現，經評點達60點以上者，其在臺累計工作年限可由原12年延長至14年。 為使勞雇關係穩定且優秀的家庭看護工能繼續留臺工作，評點表分為「專業訓練」及「自力學習」兩大評點項目，其中，「自力學習」項又細分為：「語言能力」、「工作能力」及「服務表現」等3個小項目，同一評點項目具備2項以上資格條件者，擇較高點數者計點，加總各項目得分60點以上者為合格。 如外國人符合評點表規定達60點時，雇主即可檢附評點合格的證明文件及申請書，向該署跨國勞動力事務中心申請招募許可或聘僱許可： 申請表格：https://reurl.cc/EZdY0v。 連絡電話：(02)2380-1807。 地址：100臺北市中正區中華路1段39號10樓。","u":"臺北市勞動力重建運用處","h":27830,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=07999180FAAEC9F4","d":"2015-12-22","sid":"07999180"},{"q":"就業安定費計算方式及如何繳費？","a":"雇主應自其聘僱之外國人入境之翌日或接續聘僱日起，至聘僱許可屆滿日或廢止聘僱許可前一日止。 按聘僱外國人從事之行業別、人數及勞動部核定之就業安定費月繳數額，以每3個月為一期，計算該期應繳之就業安定費，於次期第2個月25日前，向該基金專戶繳納。雇主亦得不計利息提前繳納。 雇主聘僱外國人之當月日數未滿1個月者，其就業安定費依實際聘僱日數計算。 可採行動支付（台灣Pay、嗶嗶繳、Line Pay）或至「e-Bill全國繳費網」繳費，各繳費操作方式請參考說明：https://reurl.cc/2oqena 相關問題亦可洽勞動部勞動力發展署：(02)8995-6000。","u":"臺北市勞動力重建運用處","h":26607,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BE97CF5C138F05B0","d":"2012-12-31","sid":"BE97CF5C"},{"q":"雇主如果要聘僱外籍配偶從事工作，在進用程序上要注意什麼？外籍配偶應該要具備什麼證件才能合法工作？","a":"1.依就業服務法之規定，外國人與在中華民國境內設有戶籍之國民結婚且獲准居留者（即外籍配偶），不須申請工作許可，即可在臺從事工作，但雇主要聘僱外籍配偶前，一定要親自查驗該外籍配偶的居留證「正本」（要確定確實為該外籍配偶所有、證件上的照片為應徵者本人、居留仍在有效期限內）以及戶籍謄本正本（以確認其與本國人民結婚之真實性），一旦雇主僱用逃逸外勞、身分不明或他人申請之外國人，除影響國人之就業機會，也會遭受新臺幣15萬元至75萬元罰鍰之處分。\n2.為避免雇主受持偽造、變造、他人的居留證或工作許可函應徵之逃逸外勞欺騙，本處籲請雇主可電洽內政部移民署臺北市服務站（地址：本市中正區廣州街15號，電話：02-2389-9983）或上居留證查詢網(https://icinfo.immigration.gov.tw)。另外有關招募人才事宜也可向臺北市就業服務處（電話：2597-2222）或台北人力銀行（網址：www.okwork.gov.tw）諮詢。\n聯絡課室：臺北市勞動力重建運用處跨國勞動力檢查課\n聯絡電話：(02)2338-1600分機4110","u":"臺北市勞動力重建運用處","h":22580,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=49752A6F92534602","d":"2012-12-31","sid":"49752A6F"},{"q":"什麼是「1955勞工諮詢申訴專線」？","a":"1.為積極保障雇主及移工之權益，整合原有眾多保護專線以提升服務效率，勞動部自98年7月1日起開通「1955外籍移工24小時諮詢保護專線」，又為利一般民眾可透過單一號碼，諮詢勞動法令等，105年11月7日起更名為「1955勞工諮詢申訴專線」為全國性24小時單一申訴諮詢窗口，移工、雇主及一般民眾均可撥打。\n2.服務特色：全國性24小時單一諮詢申訴窗口、全年無休服務、雙語接聽（中文、英語、泰國語、印尼語、越南語）、免付費。\n3.服務內容：\n(1)勞動契約、工資、工時、職災及仲介等相關問題法令諮詢及法律扶助等服務。\n(2)受理勞資爭議、遭受不當對待或人身侵害等申訴服務。\n(4)為遭受人身侵害或人口販運或雇主轉介保護安置服務。\n(5)提供其他相關部門服務資訊。\n若有相關問題請洽勞動力發展署，聯絡電話：(02)8995-6000\n聯絡課室：臺北市勞動力重建運用跨國勞動力諮詢課\n聯絡電話：(02)2338-1600  菲律賓籍分機：4208、4217；印尼籍分機：4205、4207、4213、4214、4215、4216、4219；越南籍分機：4201、4223；泰國籍分機：4221","u":"臺北市勞動力重建運用處","h":16862,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=684672F7A2B25D48","d":"2012-12-31","sid":"684672F7"},{"q":"如果雇主原本申請外籍移工的原因消滅（如：被看護者死亡），有哪些事情需要辦理呢？","a":"雇主應在30日內向勞動部申請外籍移工轉換雇主，或者經外籍移工同意後，在期限內辦理手續安排出國。如果在登記轉換期間，就已經有新雇主願意承接，新雇主應於接續聘僱之日起3日內向各地勞政機關辦理接續聘僱通報，並於接續聘僱之日起15日內向勞動部勞動力發展署申請核發聘僱許可。\n民眾若有問題可洽詢：勞動力發展署\n聯絡電話：(02)8995-6000\n聯絡課室：臺北市勞動力重建運用處跨國勞動力諮詢課\n聯絡電話：(02)2338-1600  菲律賓籍分機：4208、4217；印尼籍分機：4205、4207、4213、4214、4215、4216、4219；越南籍分機：4201、4223；泰國籍分機：4221","u":"臺北市勞動力重建運用處","h":16034,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B129760B082135D2","d":"2012-12-31","sid":"B129760B"},{"q":"雇主可以讓聘僱的移工操作起重機或者堆高機嗎？","a":"雇主指派所聘僱「從事本法第四十六條第一項第十款所定製造工作」且「經訓練合格取得操作證照」之外國人，「間歇性」從事與製造業產品製造等體力工作有關之操作堆高機或起重機等工作，視為工作之延伸，並不違反就業服務法第五十七條第三款規定。 但雇主指派所聘僱外國人間歇性從事操作「荷重在一公噸以上之堆高機」、「吊升荷重在三公噸以上固定式起重機」及「吊升荷重在三公噸以上之移動式起重機」等設備者，該外國人必須為「該等職類之安全衛生教育訓練及技能檢定合格且取得技術士證」者，始得為之。 自108年7月1日起，移工得申請紙本學科試題母語輔助服務，詳情請洽勞動部勞動力發展署技能檢定中心：(04)2259-5700 轉432","u":"臺北市勞動力重建運用處","h":15951,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E4DDF1A8C59DCBF5","d":"2012-12-31","sid":"E4DDF1A8"},{"q":"移工的薪資計算是否適用最低工資法的規定？","a":"1. 家事移工的薪資由勞雇雙方自行協商約定，但不得低於新臺幣2萬元 (泰國籍簽約年度勞基法規定之基本薪資)。自111年8月10日起，新招募引進之移工或已在臺之移工期滿續聘或期滿轉換雇主重新簽訂勞動契約時，月薪調高至新臺幣2萬元。\n2.營造類、製造類、機構看護類及海洋漁撈類等移工，其薪資不得低於最低工資法所定的最低工資( 115年1月1日每月最低工資為29,500元，每小時最低工資為196元。 )。\n聯絡課室：臺北市勞動力重建運用處 跨國勞動力檢查課、跨國勞動力諮詢課\n聯絡電話：(02)2338-1600分機4109  菲律賓籍分機：4208、4217；印尼籍分機：4205、4207、4213、4214、4215、4216、4219；越南籍分機：4201、4223；泰國籍分機：4221","u":"臺北市勞動力重建運用處","h":15554,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=787A0F9E06A33323","d":"2012-12-31","sid":"787A0F9E"},{"q":"什麼是「直接聘僱」？政府可以給採直接聘僱方式的雇主什麼協助？","a":"「直接聘僱聯合服務中心」是勞動部所成立的單一服務窗口，協助採直接聘僱方式的雇主引進移工，並提供各國語言諮詢（中英、中泰、中越、中印）、查詢、代轉、代寄及以簡訊或email提醒雇主移工入國後辦理相關後續事宜等服務功能，且不收任何服務費用。\n現行重新招募同一看護工之家庭類雇主可選擇不透過仲介業者，以「直接聘僱」方式向勞動部申請移工，可不須支付仲介公司服務費，讓移工實領較高的薪資。\n直接聘僱聯合服務中心相關資訊：\n網址：https://dhsc.wda.gov.tw/\n服務電話：(02)6613-0811\n地址：臺北市中正區中華路一段39號15樓","u":"臺北市勞動力重建運用處","h":14996,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E29AF4659E89CFA8","d":"2012-12-31","sid":"E29AF465"},{"q":"移工是否有規定的工作時間呢？","a":"家庭類移工的工作時間，須依勞雇雙方所簽訂的勞動契約辦理。 營造類、製造類、機構看護類及海洋漁撈類等移工，因適用勞動基準法，勞工正常工作時間，每日不得超過八小時，每週不得超過四十小時，加班時數須依勞動基準法規定辦理。每日持續工作4小時，應有30分鐘休息。實行輪班制，或工作有連續性或緊急性者，雇主得在工作時間內另行調配休息時間。","u":"臺北市勞動力重建運用處","h":14806,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DCA61D69066E802F","d":"2013-03-15","sid":"DCA61D69"},{"q":"定額進用差額補助費如何計算及繳納？","a":"差額補助費的計算標準是依不足人數乘以每月基本工資計算；另繳納方式可持空白繳款單至台北富邦銀行及各分行繳納，又如果繳款單位附近並沒有台北富邦銀行，可以匯款的方式匯到台北富邦銀行公庫處。戶名：臺北市勞動力重建運用處身心障礙者就業基金專戶；帳號：108970+公（勞）保證號8碼（不足部分於證號前補0且不含英文碼），共計14碼，並載明繳款單位、所屬年月及應繳納金額，俾便本處辦理入帳事宜。\n聯絡課室：臺北市勞動力重建運用處身障管理課\n聯絡電話：(02)2338-1600分機5303、5306、5307","u":"臺北市勞動力重建運用處","h":14734,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=ABFD622D20E49C46","d":"2012-12-30","sid":"ABFD622D"},{"q":"雇主該在什麼時間繳納就業安定費呢？可以自行查詢就業安定費是否有溢繳或是欠繳嗎？","a":"雇主會在每年2、5、8、11月20日前，接到上一季應繳納就業安定費繳款單，應於次季第2個月25日前，向中央主管機關設置之就業安定基金專戶繳納。 雇主未依規定期限繳納就業安定費者，得寬限30日；於寬限期滿仍未繳納者，自寬限期滿之翌日起至完納前一日止，每逾期1日加徵其未繳就業安定費0.3%滯納金。但以其未繳之就業安定費30%為限。 雇主申請聘僱移工應於申請表填寫帳單地址，雇主如果搬離原留住所後，應儘速向勞動力發展署辦理就業安定費帳單地址變更。 就業安定基金相關資訊 勞動部勞動力發展署網站：https://reurl.cc/2oqena 連絡電話：(02)8995-6000","u":"臺北市勞動力重建運用處","h":14172,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E4381FE6A31D0642","d":"2018-01-30","sid":"E4381FE6"},{"q":"什麼叫支持性就業服務？","a":"依『身心障礙者權益保障法』第34條對於支持性就業服務定義為：各級勞工主管機關對於具有就業意願及就業能力，而不足以獨立在競爭性就業市場工作之身心障礙者，應依其工作能力，提供個別化就業安置、訓練及其他工作協助等支持性就業服務。\n聯絡課室：臺北市勞動力重建運用處一組\n聯絡電話：(02)2338-1600分機5515","u":"臺北市勞動力重建運用處","h":13957,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B52EC5E50B7CE71F","d":"2013-05-23","sid":"B52EC5E5"},{"q":"外籍移工的居住地址變更了，雇主應該通知哪些單位呢？","a":"1.外籍移工的住宿地址變更後，雇主要在7日內以書面通知外籍移工工作所在地及住宿地點之縣市政府勞政單位；並向變更後所在地之縣市移民署服務站(總署電話 2388-9393)辦理變更登記。雇主如果未辦理，會處以新臺幣6萬元以上30萬元以下的罰鍰，並廢止部分或全部的招募及聘僱許可；移民署則是會對外籍移工處以新臺幣2千元以上1萬元以下的罰鍰。\n2.向本處通報的文件格式可至本處網站下載（首頁：http://www.fd.gov.taipei/ > 業務服務 > 外籍移工服務 > 通報及申辦業務 > 住宿地變更）。\n聯絡課室：臺北市勞動力重建運用處跨國勞動力檢查課\n聯絡電話：(02)2338-1600分機4137、4138","u":"臺北市勞動力重建運用處","h":13476,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CDD667B291709B18","d":"2012-12-31","sid":"CDD667B2"},{"q":"雇主可以讓看護工從事打掃家裡的工作嗎？究竟家庭看護工的工作範圍為何？","a":"依勞動部函釋意旨，家庭看護工的工作範圍僅包括被看護人生活照料及與監護工作有關而不涉及營利性質之事項，籲請切勿使看護工從事許可以外之工作，如果要從事清潔、打掃僅限照顧被看護人所必須的工作，絕對不可讓看護工至小吃店面協助或到親戚朋友家打掃家裡等；若經查獲雇主使看護工從事許可外工作屬實則會被處以新臺幣3萬元以上15萬元以下罰鍰。","u":"臺北市勞動力重建運用處","h":13382,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E68BF63A77DBD295","d":"2012-12-31","sid":"E68BF63A"},{"q":"員工總人數達67人以上之公司若無進用身心障礙者勞工，會有罰則嗎？","a":"會，違反身權法第38條規定進用身心障礙者人數未達標準之單位，應定期向所在地勞工主管機關之身心障礙者就業基金繳納差額補助費（繳納金額＝差額人數＊每月基本工資計算）；另如接獲限期繳納核定書，未依期限完納者，將加徵滯納金（自期限屆滿之翌日起至完納前1日止，每逾1日加徵其未繳差額補助費百分之零點二滯納金。但以其未繳納之差額補助費1倍為限。）\n聯絡課室：臺北市勞動力重建運用處身障管理課\n聯絡電話：(02)2338-1600分機5303、5306、5307","u":"臺北市勞動力重建運用處","h":12074,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=74A53864393FF642","d":"2012-12-30","sid":"74A53864"},{"q":"什麼叫職業重建個案管理服務？","a":"依「身心障礙者職業重建服務專業人員遴用及培訓準則」第三條：職業重建個案管理員的職務內容為：辦理就業轉銜、職業重建諮詢、開案評估、擬定初步職業重建服務計畫、分派或連結適當服務、資源整合與獲取、服務追蹤及結案評定等。所以職業重建個案管理是提供身心障礙者在整個求職過程中從頭到尾完整服務的主要推手。 聯絡課室：臺北市勞動力重建運用處身障輔助課 聯絡電話：(02)2338-1600分機5501","u":"臺北市勞動力重建運用處","h":11699,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B1ACC030E5F75EA","d":"2013-05-23","sid":"0B1ACC03"},{"q":"外籍家庭看護工可以到醫院或者養護機構照顧被看護者嗎？","a":"雇主得免經勞動部許可，逕調派所聘僱之外國人隨被看護者至醫療院所照料該被看護者。 但調派外國人至醫院之1.護理之家、2.呼吸照顧病房、3.慢性病房，以及4.養護機構，則須向勞動部申請變更工作場所。 並且留意每次申請期限最長不能超過6個月，到期後也可以申請延期，惟3年之間累計申請時間不得超過18個月。 申辦相關問題請洽勞動部勞動力發展署：(02)8995-6000","u":"臺北市勞動力重建運用處","h":11458,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7D38B30CAEC0E31A","d":"2012-12-31","sid":"7D38B30C"},{"q":"外籍機構看護工可以幫病患抽痰嗎？","a":"機構看護工可以從事餵食、更衣、清潔身體、拍背、按摩、傷口分泌物簡易照顧等非專業醫療行為之照顧工作。或者是協助本國工作者，從事以照顧病患為目的之環境清潔、膳食料理、衣物洗滌等工作。\n不可指派看護工從事如打針、抽痰、導尿等侵入性治療具有專業性及危險性等醫療行為。\n另衛生福利部109年8月25日衛部醫字第 1091665312 號函釋說明二段略以（https://reurl.cc/xKdeKe）：按口腔內(懸壅垂之前)或人工氣道管內分泌物之清潔、抽吸或移除，未涉及醫療專業判斷，僅係個案身體照顧服務，非屬醫療業務之行為，得由非醫事人員執行。","u":"臺北市勞動力重建運用處","h":11272,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=260773583A6C20A7","d":"2012-12-31","sid":"26077358"},{"q":"移工在等待轉換雇主的期間，雇主仍然需要繳交就業安定費、給付薪資、負責安置等嗎？","a":"移工等待轉換雇主期間，安置責任仍由原雇主負責，並且要繳交就業安定費，如果有要求移工工作，也要給付薪資。但雇主經廢止聘僱許可後，自廢止聘僱許可日起，雇主即無須繳納該移工的就業安定費。 有關就業安定費計算問題請洽勞動部勞動力發展署：(02)8995-6000","u":"臺北市勞動力重建運用處","h":10870,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3360FA17CA03F8A0","d":"2012-12-31","sid":"3360FA17"},{"q":"雇主可以把移工調派到名下其他工廠嗎？","a":"一般製造業之移工可以到同一雇主其他工程或工廠進行工作契約範圍內的工作；但重大投資、特定製程及特殊時程製造業等引進之移工，須依「雇主指派所聘僱從事就業服務法第四十六條第一項第八款至第十款規定工作之外籍工作者變更工作場所認定基準」規定辦理始得調派。又營造業工程專案核定之移工應事先向勞動部申請許可始可調派。 申辦相關問題請洽勞動部勞動力發展署：(02)8995-6000","u":"臺北市勞動力重建運用處","h":10418,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=272C40836395257D","d":"2012-12-31","sid":"272C4083"}]},{"org":"建築管理工程處","total":120,"items":[{"q":"請問申請建築圖說（泛指原圖、縮影圖、結構圖、竣工圖及消防圖）需要檢附什麼資料？","a":"請至本府南區二樓建管處資訊室辦理，\n申請資格及相關證件請詳閱《市民複印建築執照原圖暨縮影圖申請說明》。\n若有疑問，請洽本室服務電話2725-8461，謝謝。\n申請書下載路徑:\n建管處首頁→建築執照檔案圖說複列印→檔案下載→複印建築執照原圖暨縮影圖申請書\n市民複印建築執照原圖暨縮影圖申請說明\n一、申請人資格：\n(一)建物所有權人。\n(二)起造人。\n(三)承租人。\n(四)公寓大廈管理委員會，須依公寓大廈管理條例規定最新報備完成者。\n(五)利害關係人(應備有司法單位證明文件指示須提供圖書複印)。\n二、檢附證件：\n1.複印建築執照原圖暨縮影圖 申請書 。\n2.身分證件：\n申請人（自然人）：身分證正反面影本及簽章。\n申請人為非自然人：\n(1)公司行號：變更登記表首頁(最後一次變更)或列印「全國商工行政服務入口網」之「商業登記基本資料」，及加蓋大小章。\n(2)法人團體：法人團體登記證書影本，及加蓋法人大小章。\n(3)承租人：應併附房屋租賃契約書影本。\n(4)公寓大廈管理委員會者：應附公寓大廈任期內變更主任委員核准(備查)公函影本、主任委員身分證影本、及加蓋管委會、主任委員印章。或已完成公寓大廈管理條例規定程序， 檢附區分所有權人會議紀錄(含主任委員選舉)之公寓大廈管理委員會。\n(5)利害關係人應檢附利害關係存在之相關行政機關或法律爭訟證明文件，且該證明文件指示須提供圖說複印。\n3. 委託他人申請者：請備委任書、代理人身分證正反面影本。\n4. 權利證件：申請書已填寫建物地址及地號經查所有權人身分無誤者(可免檢附建物登記簿謄本或建築改良物所有權狀影本)、買賣契約書影本(已達完稅階段-土地增值稅及契稅收據影本)、房屋稅單影本。\n領件流程：\n(1)已數位化圖資：收件、確認後，即可領件。\n(2)未 數位化圖資：需至府外檔案室調閱原卷，約須４個工作日（不含例假日） ，屆時請持領件憑單或通知函依約定時間至服務櫃台辦理領件事宜。\n原圖之複印係委外作業，為免疏漏誤失，需經領件人現場確認圖說後送印，並繳納費用。\n調閱公文檔案：工作天數請另行洽詢承辦人。","u":"臺北市建築管理工程處資訊室","h":239751,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=
