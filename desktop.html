809,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=68A1F5B96A48C4DE","d":"2023-08-17","sid":"68A1F5B9"},{"q":"翡翠水庫平時放水廣播及洩洪(或調節性放水)廣播的方式？","a":"為確保水庫下游河道警戒區安全，當翡翠水庫進行放水(或洩洪)前，均會進行放水廣播，使於河道中活動人員儘速離開，避免發生危險，放水廣播分平時放水及洩洪(調節性放水)2類型，分別說明如下:\n1.平時放水廣播：翡翠水庫放水前20分鐘開始廣播，廣播範圍從水庫下游至直潭壩上游河床警戒區域。\n2.洩洪(或調節性放水)廣播：翡翠水庫洩洪(或調節性放水)前2小時開始廣播，並同時發送細胞廣播簡訊，廣播範圍為水庫下游北勢溪及新店溪河床警戒區域。","u":"臺北翡翠水庫管理局","h":10425,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=52DA2978915D6850","d":"2024-03-25","sid":"52DA2978"},{"q":"如果發生強烈地震，大壩會不會潰壩？","a":"翡翠大壩具有極佳耐震能力，不致於發生潰壩。\n1.翡翠大壩耐震安全性高，於規劃設計時，即採取「大震不倒，中震可修，小震不壞」之原則，比照核能電廠的耐震標準設計翡翠大壩，可抵抗7級地震。 2.大壩遭受地震侵襲時，壩體內設置之警報型強震儀會同步自動啟動大壩安全監測系統，密集自動監測大壩結構變化行為，以利工程師評估大壩安全性，並依據「臺北翡翠水庫管理局地震緊急應變作業程序」之SOP進行相關安全檢查作業，確保地震後大壩安全無虞。 3.倘大壩確認有受損情形時，除依據「翡翠水庫緊急洩降計畫」進行洩降庫水，直到確保受損壩體之穩定安全外，並同步通報相關單位協助救災與修復。","u":"臺北翡翠水庫管理局","h":10153,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FAE1F3D046C80D2E","d":"2023-08-17","sid":"FAE1F3D0"},{"q":"烏來杜鵑有何珍貴之處？","a":"烏來杜鵑為臺灣特有種，因其葉似柳，又名柳葉杜鵑，牠是臺灣 15種杜鵑屬植物中分布最狹隘、族群數量最少的一支。1922年由英國植物學家Wilson在北勢溪河岸所發現，也就是在鸕鶿潭附近，73年水庫初期蓄水時唯一之生育地被淹沒，原本以為烏來杜鵑從此淹沒在水庫之下，所幸在民國77年8月20日被公告為法定珍貴稀有植物，十多年來在相關單位的努力復育之下，每年3月已可在翡翠水庫辦公區、壩區及上游原生地附近，看到烏來杜鵑壯觀的花海。\n水庫集水區在三十多年來的人為管制之下，保有豐富而多樣的生態環境，這也是翡翠水庫長期以來得以穩定供應潔淨水源的重要因素之一，相信在水庫開發與生態保育之間可以達成平衡，兩者共存共榮。","u":"臺北翡翠水庫管理局","h":8905,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B7AF7C7059D4D13B","d":"2023-08-17","sid":"B7AF7C70"},{"q":"翡翠樹蛙是如何命名的？","a":"翡翠樹蛙因在翡翠水庫附近發現而得名，為臺灣特有種保育類中大型樹蛙，分布在臺灣北部南、北勢溪流域、宜蘭等低海拔山區，例如新店廣興、烏來娃娃谷、宜蘭福山植物園，宜蘭礁溪等地。背部為翠綠色， 虹膜、過眼線及顳褶皆呈金黃色。繁殖季為每年3-11月，雄蛙5-6公分，雌蛙6-8公分，常在丘陵地的矮密樹叢及水容器、水溝附近出沒。雄蛙通常在水邊的植物體上鳴叫，叫聲是短促的「呱阿」。雌蛙受雄蛙叫聲吸引，主動接近雄蛙並在樹上形成配對及產卵。","u":"臺北翡翠水庫管理局","h":8567,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D70FAA2FDF6B9A9A","d":"2023-08-17","sid":"D70FAA2F"},{"q":"「蕨色翡翠」園區有何特色？","a":"臺灣是蕨類王國，翡翠水庫也擁有豐富的蕨類資源，經初步調查共有22科45屬110種。於民國96年由錫瑠綠化基金會協助規劃設置之「蕨色翡翠」園區，是臺灣水庫界首座蕨類戶外教室。園區規劃以演化順序為主軸，其中包括3億5千萬年前就有的古老蕨類，如全緣卷柏、松葉蕨等；還有2億多年前出現的中古蕨類，如瓶爾小草、觀音座蓮、粗齒紫萁、筆筒樹等；以及在1億多年前隨著開花植物悄悄現身的現代蕨類，如南洋山蘇花、東方狗脊蕨、過溝菜蕨等，具體而微地呈現臺灣蕨類世界的繽紛樣貌。蕨類植物雖多位於森林下層，仍具有防止土壤沖刷及涵養水源之功能。本局期透過蕨類生態導覽，讓參訪來賓親身體認生態保育與水資源保育之密切相關。","u":"臺北翡翠水庫管理局","h":8499,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FCB92074FFAD4ACC","d":"2023-08-17","sid":"FCB92074"},{"q":"翡翠大壩如何檢查，以確保大壩安全？","a":"大壩設有自動化監測儀器，每小時即時監測，搭配人工現場檢查，及每五年辦理大壩健康檢查，掌握大壩安全狀態。\n翡翠大壩在興建時就埋設各種監測儀器，所以現在每小時可利用精密儀器監視大壩的安全狀態，就好像醫生以心電圖、血壓計及斷層掃描機等對人體進行全身健康檢查一樣，並且定期或不定期進行現場目視檢查，及每五年依法規規定委託公正第三單位進行大壩整體安全檢查與評估，並報請中央經水庫安全評估小組邀請各學者專家複核通過，確認大壩耐震與安全，如此就可以完全掌握大壩的安全狀態。","u":"臺北翡翠水庫管理局","h":8164,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E0699E10B4E44B26","d":"2023-08-17","sid":"E0699E10"},{"q":"翡翠水庫可以使用遙控無人機或其他飛行器進行空拍嗎？","a":"翡翠水庫屬重要水資源設施，整座水庫及周邊區域經新北市政府公告劃設為遙控無人機禁止或限制飛行範圍，依《民用航空法》規定，未經主管機關許可，不得於該區域操作無人機或進行空拍，違規者，最高可處新臺幣15萬元罰鍰。建議於操作遙控無人機前，先藉由交通部民用航空局遙控無人機管理資訊系統（ https://drone.caa.gov.tw/ ）或下載「DRONE MAP 無人機行動服務 APP」進行空域查詢合法飛行範圍，以免誤觸法規。","u":"臺北翡翠水庫管理局","h":253,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7F7A780A5A2779F5","d":"2026-01-12","sid":"7F7A780A"}]},{"org":"住宅及都市更新中心","total":13,"items":[{"q":"如何承租社會住宅","a":"一、社會住宅申請方式：\n二、申請應備文件：\n三、若欲掌握社宅招租資訊及細節，建議可由下列方式獲得：","u":"臺北市住宅及都市更新中心","h":256,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=482470A3ABBBCDCC","d":"2026-06-22","sid":"482470A3"},{"q":"承租社會住宅資格為何？","a":"一、已成年之中華民國國民。（依臺北市社會住宅出租辦法112年10月27日修正發布）\n二、在臺北市（以下簡稱本市）設有戶籍，或未在本市設籍且在本市就學、就業。但以住宅法第4條所定特殊身分提出申請者須在本市設籍。\n三、家庭成員均無位於本市、新北市、基隆市或桃園市之自有住宅者。\n四、家庭成員均無承租位於本市、新北市、基隆市或桃園市之政府或民間興建之國民住宅、社會住宅，或借住平價住宅。\n五、家庭年所得低於公告受理申請當年度本市百分之五十分位點家庭之平均所得(115年為178萬元以下)，且所得總額平均分配全家人口，平均每人每月不超過本市最低生活費標準之三點五倍者(115年為每月7萬2,604元以下)。\n六、家庭成員之不動產應低於公告受理申請當年度本市中低收入戶家庭財產之不動產金額(115年為992萬元以下)。但原住民保留地及道路用地之土地價值，不予採計。","u":"臺北市住宅及都市更新中心","h":230,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=55E9BC31807BE184","d":"2026-06-23","sid":"55E9BC31"},{"q":"本市社會住宅租金繳納期限？逾期是否衍生違約金？","a":"有關本市社宅租賃契約訂定租金繳費期限為每月二十日，逾期不繳者，應依規定加收懲罰性違約金2%，且按月累計最高累計至20%。","u":"臺北市住宅及都市更新中心","h":176,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=22DCA7A8D3D75D28","d":"2026-06-23","sid":"22DCA7A8"},{"q":"如何查詢及繳納臺北市社會住宅租金及管理費？","a":"(一)智慧支付繳費者：\n(二)銀行扣款者：請於社宅雲「收繳查詢」功能確認當月應繳金額，並於每月20日前於約定之富邦銀行帳戶存足款項，由本中心於每月20日辦理扣款作業。","u":"臺北市住宅及都市更新中心","h":156,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FF3B405C66A169E4","d":"2026-06-23","sid":"FF3B405C"},{"q":"承租社會住宅如何辦理續約","a":"一、本市社會住宅一般戶租賃及續租期限合計不得超過6年，申請時以經濟或社會弱勢者身分戶申請且續租時仍符合相關資格者，得延長為12年。\n二、總租期未滿之承租戶，於租約屆滿前約三個月時，將以公文通知社會住宅承租人，如欲辦理續約請檢送「續約申請書、全戶戶籍謄本、配偶戶籍資料（如配偶與申請人或戶籍內直系親屬不同戶籍時，方須繳交；如尚未取得本國國民身分證之配偶，請另行檢附居留證影本）、近一年之綜合所得稅各類所得資料清單、全國財產稅總歸戶財產查詢清單及相關身分證明文件等資料」供審查，將依據當年度之所得、財產標準審查是否符合承租資格。\n三、於續約審查後，將再以公文通知審查結果及後續簽約公證時間、地點及租金等細節資訊。","u":"臺北市住宅及都市更新中心","h":150,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C009ED98C83D6873","d":"2026-06-23","sid":"C009ED98"},{"q":"本市社宅租金繳費方式","a":"有關本市社宅租金繳費方式為約定台北富邦銀行扣款及智慧支付平台(台北通APP平台)繳納等2種繳費方式，承租戶於簽約日時，可擇定承租後之租金繳費方式，另承租期間可因繳費習慣等因素，逕向臺北市住宅及都市更新中心申請變更。","u":"臺北市住宅及都市更新中心","h":134,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9CB13CD91E9F7F11","d":"2026-06-23","sid":"9CB13CD9"},{"q":"於資格符合之前提下，同一人得否同時提出二處社會住宅之租住申請？","a":"可重複申請，但擇一社區簽約入住後，喪失其他已申請之國(社)宅候租(補)資格。","u":"臺北市住宅及都市更新中心","h":80,"t":"殯葬民政","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F5215E4448F8435A","d":"2026-06-23","sid":"F5215E44"},{"q":"已承租本市一般出租國宅、中繼國宅、社會住宅，是否仍可提出申請其他社會住宅？","a":"本市出租國宅、中繼國宅及社會住宅之現住戶及候租戶，於其他社會住宅戶之申請原則如下：\n(一)基於資源不重複受領原則，社會住宅、出租國宅現住戶及其家庭成員不得申請其他社會住宅。但：\n(二)出租國宅、中繼國宅及社會住宅候租戶於資格符合下，得比照一般市民申請租住一處社會住宅，然基於「資源有效使用」原則，申請人於輪配至出租國宅、中繼住宅 、社會住宅，或中籤承租其他社會住宅時，應選定其一，放棄另一住宅之候租或承租資格。","u":"臺北市住宅及都市更新中心","h":69,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=73B2505EB4AC93A5","d":"2026-06-23","sid":"73B2505E"},{"q":"社宅管理方式為何？","a":"本市社會住宅住戶如有社區生活管理或報修問題，可逕洽社宅管理中心，或至「臺北市社會住宅管理服務雲」線上報修及反映(服務網址為https://citizen-scsp.thurc.org.taipei)，如未有台北通帳號，可至台北通官方網站申請即可登入使用。","u":"臺北市住宅及都市更新中心","h":66,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A5028FC5CE97B4CA","d":"2026-06-23","sid":"A5028FC5"},{"q":"如已申請租金補貼，可否承租社會住宅？","a":"申請人同時申請租金補貼及承租社會住宅，須預先填妥放棄租金補貼聲明書，並於簽訂本案住宅租賃契約時生效，自租賃期間起算日停止受領租金補貼並應返還之。","u":"臺北市住宅及都市更新中心","h":59,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CC49290B808D57FE","d":"2026-06-23","sid":"CC49290B"},{"q":"同一家庭夫妻可以有二人以上同時提出申請嗎？","a":"不可以。家庭成員以申請1戶為限，配偶分戶者亦同，重複申請者，僅受理先完成送件登錄之申請案，其後送件之申請案駁回。","u":"臺北市住宅及都市更新中心","h":54,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9EB5DC3BE69A2DFF","d":"2026-06-23","sid":"9EB5DC3B"},{"q":"社宅是否提供各類群體多元服務?","a":"住戶入住社會住宅後，即由本中心將各式規範、管理機制、社區生活機能服務及該區社會服務資源等資訊，彙整為住戶規約手冊，供住戶查詢、使用，住戶如有社會福利需求，均可向各社福資源單位洽詢。\n社會局也會辦理社區宣導，使住戶有更多機會瞭解社區社福資源。後續本中心與社會局將展開關懷弱勢住戶、視其需要提供各項社會福利服務，使弱勢住戶在遷居新環境後，亦能獲得良好適應、服務不中斷。","u":"臺北市住宅及都市更新中心","h":50,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69261EAED1D49D45","d":"2026-06-23","sid":"69261EAE"},{"q":"約定智慧支付繳費承租者，於繳費期限內至智慧支付網頁(台北通APP平台)操作繳費，如有系統異常導致繳費失敗情事，是否可申請免收違約金？","a":"(一)當月租金繳費期限內(每月一日至二十日期間)操作繳費，系統顯示繳費異常者(或是不諳智慧支付繳費操作方式者)，可於上班日電洽社宅帳務人員協助操作繳費，非上班日可先請社宅物管櫃台值班人員協助；社宅帳務人員聯絡電話02-2592-5116分機333~334、351~352、355~362。\n(二)當月租金繳費期限當日(每月二十日)操作繳費，卻因系統異常導致繳費失敗者，可保留操作繳費異常畫面，並於次一上班日洽詢社宅帳務承辦人員辦理補繳相關事宜，另查核系統異常原因如有非歸責承租戶之情事，將免收取違約金。","u":"臺北市住宅及都市更新中心","h":50,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=98D5156AB298D858","d":"2026-06-23","sid":"98D5156A"}]},{"org":"孔廟管理委員會","total":8,"items":[{"q":"請問如何向臺北孔廟申請預約導覽服務？定時導覽服務時間？","a":"一、預約導覽：\n(一)請於參訪日前7天申請預約導覽，洽詢電話：02-2592-3934 轉 22 分機，承辦人：黃小姐。\n(二)可至 台北服務通 申請預約導覽。\n(三)申請預約導覽語言：中、英、日、韓、德、西班牙及越南等，如其它語言須事先洽詢，本會保留修改導覽語言權利。\n二、開館時間定時導覽服務時間：\n(一)集合地點：遊客服務中心前。\n(二)定時導覽：上午10:30（大約40分鐘）、下午2:30、3:30 （大約40分鐘）。\n三、 最新活動訊息歡迎追蹤臺北孔廟FB、IG。","u":"臺北市孔廟管理委員會","h":7050,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3AE141FB16E90E0C","d":"2021-05-26","sid":"3AE141FB"},{"q":"請問臺北孔廟園區的開放時間？參觀需要門票嗎？如何到孔廟？紀念品販賣部及小義子漢服營業時間？","a":"一、園區開放時間：星期二至星期日（含國定假日） 08:30-21:00，星期一休園。\n二、民眾免費入園參觀。\n三、 臺北孔廟地址「103039臺北市大同區大龍街275號」， 到達方式：\n（一）自行開車：中山高速公路下重慶北路交流道（往臺北市區方向），循重慶北路3段南行，左轉哈密街，再右轉大龍街即可抵達。\n（二）捷運：搭乘捷運淡水線至圓山站，由2號出口沿庫倫街步行約500公尺（8至10分鐘），右轉大龍街即可到達。\n（三）公車：大龍峒保安宮站：2、41、215、246、288、669、811、紅33。酒泉街站：2、9、41、215、288、669、811、紅33。庫倫街站：2、9、41、215、246、288、669、811、紅33。\n四、臺北孔廟明倫堂1樓紀念品販賣部時間：09:00至18:00（星期一公休）。\n五、小義子漢服臺北孔廟店營業時間除配合臺北孔廟活動或特殊情形之外，原則10:00至18:00 （星期一公休） ，如有任何問題歡迎洽詢電話：(02)2592-3934分機13林小姐。\n六、歡迎加入臺北孔廟粉絲團、IG 。","u":"臺北市孔廟管理委員會","h":6226,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4A373EEBD86D5BF6","d":"2022-03-24","sid":"4A373EEB"},{"q":"臺北孔廟戶外場地如何租借?洽詢電話？","a":"一、臺北孔廟戶外場地租借請至 台北服務通 申請租借，請點相關連結。\n二、地址：103039臺北市大同區大龍街275號。\n三、 洽詢電話：(02)2592-3934分機13林小姐。\n四、最新活動訊息請追蹤 臺北孔廟FB 。","u":"臺北市孔廟管理委員會","h":4335,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2D9767B078A66650","d":"2020-07-15","sid":"2D9767B0"},{"q":"請問到臺北孔廟劇院觀賞影片需要預約嗎？如何預約？播映影片為何？","a":"一、臺北孔廟劇院影片觀賞需要預約，目前提供「團體預約（20人以上）」， 如屬個人影片觀賞請於孔子學堂觀賞影片 。\n二、請於到訪2週前預約，預約電話：(02)2592-3934分機22黃小姐。\n三、預約播映影片為《孔廟奇遇》影片18分鐘，《大成之美》影片15分鐘。\n四、影片簡介：\n（一）孔子學堂輪播影片：課堂中的孔子與弟子、孔廟奇遇。\n（二）儀門前電視輪播影片：臺北孔廟動畫導覽、雅樂舞淺談、大成之美。\n五、注意事項：劇院內禁止飲食、禁止吸菸、禁止嚼食口香糖，設備維護不易，請共同維護。\n六、最新活動訊息歡迎至臺北孔廟粉絲專頁查詢。","u":"臺北市孔廟管理委員會","h":4024,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DA5822FA602B700A","d":"2020-07-15","sid":"DA5822FA"},{"q":"請問臺北孔廟劇院場地是否可以租借?要多久以前提出申請?","a":"(一)租借臺北孔廟劇院請至 台北服務通 預約租借，網址請點相關連結。\n(二)除週一休館、因維護保養或颱風等因素不開放外，如預約劇院場地使用租借至少須於使用前14日提出申請，經本會同意後始得使用，聯絡電話：02-25923934分機22，承辦人：黃小姐。\n(三)最新活動訊息請上 臺北孔廟FB 查詢，請點相關連結。","u":"臺北市孔廟管理委員會","h":1078,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9B8BD6F4C09FD442","d":"2020-09-23","sid":"9B8BD6F4"},{"q":"請問「清臺北府文廟舊址碑」哪一年設置？設立位置？","a":"一、民國72年4月設置：由臺北市文獻委員會（現為臺北市立文獻館）於重慶南路一段分隔於人行道兩側，設立「清臺北府文廟舊址」碑與「清臺北府武廟舊址」碑，以見證文廟與武廟發展的歷史脈絡。\n二、「清臺北府文廟舊址碑設置於（原）臺北市立師範專科學校（現為臺北市立大學博愛校區）重慶南路一段人行道圍牆旁」，武廟碑設置於今法務部右側（臺北市中正區重慶南路一段126巷口） ；民國112年5月18日辦理現場會勘，翌日5月19日因臺北市立大學圍牆倒塌，導致「清臺北府文廟舊址碑」毀損，於113年6月舊址碑重立，為雙面碑文形式，並於113年9月5日辦理揭碑儀式，請參閱相關圖片。\n三、最新文化推廣活動及劇院講座等相關訊息歡迎追蹤臺北孔廟FB及IG。","u":"臺北市孔廟管理委員會","h":187,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E99FCD94327BAF42","d":"2026-03-18","sid":"E99FCD94"},{"q":"請問祭孔大典籌備期間孔廟園區及展間開放嗎？","a":"一、因應2576週年釋奠典禮綜合演練，9月5日、9月12日及9月19日孔廟園區「部分空間」將暫停開放，以現場公告為主。\n二、「六藝展間」因配合釋奠典禮相關作業，自9月2日起至10月4日止，暫停開放遊客參觀。\n三、如有任何問題歡迎洽詢，電話：(02)2592-3934。","u":"臺北市孔廟管理委員會","h":13,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=357B4240126E9673","d":"2026-08-29","sid":"357B4240"},{"q":"臺北孔廟「參禮證」開放索取時間？有限量嗎？","a":"一、參禮證開放索取時間：預計於9月10日（星期四）上午9點起發放，發完為止。\n二、參禮證「限量」發放，分為「9月27日釋奠習儀」及「9月28日釋奠典禮」2款。\n三、預計於9月8日記者會發布最新訊息歡迎上臺北孔廟粉絲專頁查詢，請點相關連結。\n四、洽詢 電話：(02)2592-3934分機13，臺北孔廟 地址：103039臺北市大同區大龍街275號 。","u":"臺北市孔廟管理委員會","h":4,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E163FA228E5AC740","d":"2026-09-03","sid":"E163FA22"}]},{"org":"都市計畫委員會","total":8,"items":[{"q":"問題六：都市計畫委員會受理陳情人意見後，如何處理？","a":"答：\n一、依都市計畫法或都市更新條例相關規定公開展覽之都市計畫案、更新地區之劃定或變更、及都市更新計畫之訂定或變更案：\n(一)公民或團體得於市府辦理公開展覽期間內，以書面提出意見。因此，公民或團體於公開展覽期間內所提書面意見，本會均會依法受理，並製作公民或團體意見綜理表，先交由申請單位進行研析，相關研析結果將併同陳情意見提供委員會審議，若逾公開展覽期間始提出意見，基於協助民眾立場，本會仍予受理至會議日前3個工作日 (以本會收文為準)。\n(二) 本會召開委員會議或專案小組會議，為利公民或團體瞭解案件審議情形，有提出書面意見並經納入綜理表之民眾，本會均以書面正式通知可於會議室旁之旁聽席旁聽，並可依「 臺北市都市計畫委員會會議注意事項 」，於案件第1次提委員會審議或第1次提專案小組討論時，就以納入綜理表之書面意見登記進場說明。案件審議完竣，本會亦會以書面告知。\n二、報告事項、研議事項及毋須公開展覽之審議事項：\n公民或團體所提書面意見逕提委員會參考，本會不另彙製綜理表。","u":"臺北市都市計畫委員會","h":3425,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F61FFC3AFD431EB3","d":"2017-12-07","sid":"F61FFC3A"},{"q":"問題一：都市計畫委員會主要的工作內容是什麼？","a":"答：\n臺北市政府依都市計畫法第74條及行政院「各級都市計畫委員會組織規程」，設臺北市都市計畫委員會，工作內容包括：\n一、關於都市計畫擬定變更之審議事項。\n二、關於舊市區更新計畫之審議事項。\n三、關於新市區建設計畫之審議事項。\n四、關於都市計畫申請或建議案件之審議事項。\n五、關於私人或團體投資辦理都市計畫事業之審議事項。\n六、現行都市計畫實際實施情形及實施都市計畫財務之研究建議。\n七、都市計畫現行法令之檢討建議。\n八、都市計畫公共設施用地取得及多目標使用之研究建議。\n九、其他有關都市計畫之交議及研究建議事項。","u":"臺北市都市計畫委員會","h":3156,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CFD405E042883AA8","d":"2017-12-12","sid":"CFD405E0"},{"q":"問題二：臺北市都市計畫委員會的委員是由哪些成員所組成？","a":"答：\n一、委員會依「各級都市計畫委員會組織規程｣規定，由市長指派副市長兼任主任委員。\n二、其餘委員由市長分別就下列人員派聘之:\n（一）主管業務機關首長或單位主管。\n（二）有關業務機關首長或單位主管或代表。\n（三）具有都市計畫、都市設計、景觀、建築或交通等專門學術經驗之專家。\n（四）熱心公益人士。","u":"臺北市都市計畫委員會","h":2584,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE2D4B20A06B2765","d":"2017-12-11","sid":"AE2D4B20"},{"q":"問題三：請問都市計畫委員會的委員多久改派聘1任，可以續任嗎？","a":"答： 委員會之委員依「各級都市計畫委員會組織規程」規定，任期為1年，期滿得續聘之。專家委員及熱心公益人士委員續聘以3次為限。","u":"臺北市都市計畫委員會","h":2009,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D37A2FC8529A21FF","d":"2017-12-10","sid":"D37A2FC8"},{"q":"問題五：公民團體若對市府公開展覽之都市計畫案有意見，應於何時提出？可透過何種方式提出？","a":"答：\n依據都市計畫法第19條之規定，市府提出都市計畫案件送本委員會審議前，應辦理公開展覽30天，此期間市府依法會辦理說明會，任何公民或團體對於計畫案如有相關意見或建議，均得於公開展覽期間，透過 臺北市陳情系統 提出意見，或填寫書面 意見表 郵寄或傳真至本會(臺北市信義區市府路1號10樓西北區臺北市都市計畫委員會，傳真02-2759-3013)，所有意見將一併提供委員會審議參考。","u":"臺北市都市計畫委員會","h":1803,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69C0231FA7BFDD99","d":"2017-12-08","sid":"69C0231F"},{"q":"問題七：如何得知都市計畫委員會的開會時間及會議資料？","a":"答：\n本會會議時間均公布於網頁首頁〈 連結 〉最新消息，會議資料同時登載於首頁/都市計畫委員會專區/都委會會議資料。","u":"臺北市都市計畫委員會","h":1699,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CEE0DAB4CC43C731","d":"2017-12-06","sid":"CEE0DAB4"},{"q":"問題八：一般民眾是否可以旁聽都市計畫委員會議進行？","a":"答： 委員會議及專案小組會議均開放旁聽，民眾可至旁聽席旁聽，亦可觀看網路直播（ https://www.youtube.com/c/臺北市都市計畫委員會 ）。","u":"臺北市都市計畫委員會","h":1639,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=07DD66B3700444AC","d":"2017-12-05","sid":"07DD66B3"},{"q":"問題四：都市計畫委員會收到都市計畫案件後，作業程序為何？","a":"答： 本會接獲市府所送計畫案後，先由幕僚人員初步分析案件內容、並受理公民或團體意見，俟市府公開展覽結束後，提請委員會議審議。案件並得視需要組成專案小組先予討論後，再續提委員會議審議。","u":"臺北市都市計畫委員會","h":1638,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=620E3815C23DE8D1","d":"2017-12-09","sid":"620E3815"}]},{"org":"國樂團","total":6,"items":[{"q":"如何加入附設樂團？","a":"目前本團有少年國樂團、青少年國樂團、青年國樂團、市民國樂團、教師國樂團、學院國樂團、合唱團等附設樂團，各團參加資格都有限定，每年不定期開放名額辦理甄選，歡迎上本團網站查詢 最新消息 。\nTEL：(02)2383-2170轉261吳小姐。","u":"臺北市立國樂團","h":2914,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=341480919BC17994","d":"2025-08-26","sid":"34148091"},{"q":"如何參加國樂研習營？","a":"1.國樂研習營於每年暑假期間舉辦。\n2.每年4、5月間公告相關報名資訊。\n3.歡迎上本團最新消息查詢。 https://www.tco.gov.taipei\n或電02-23832170*261 吳 小姐。","u":"臺北市立國樂團","h":1885,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B8F49FC5277E289","d":"2025-08-26","sid":"5B8F49FC"},{"q":"如何加入TCO樂友會?","a":"知音難尋，知己難覓，成長路上若能遇到志同道合的朋友，更是彌足珍貴。結合樂團團員、志工、校園大使、觀眾與特約商店的TCO樂友會，便是希望將這難得的緣份，更深切、緊密地聯繫在一起。\n為了能更廣、更深、更快地傳播與執行TCO發展國樂、培育國樂人才與關懷社會的理念，近年TCO不斷致力於擴大招募樂友的工作，除了在表演節目上求新求變，提供樂友關於國樂的多元想像，音樂會訊傳發、會員優先訂位、出版品折扣，甚至涵括飲食、住宿、旅遊、生活……的TCO特約商店折扣優惠，都讓「TCO樂友會」的同好們有了更密切交流的平台。臺北市立國樂團邀請您一起加入「TCO 樂友會」，與TCO一起攜手為臺灣的國樂發展與音樂文化環境努力。\n於本團音樂會現場購買本團任一項有聲或樂譜等出版品，並填妥資料，即可成為普通會員。相關樂友會諮詢，請洽02-23832170*252葉先生。\nTCO CLUB 熱情期待您的加入!!","u":"臺北市立國樂團","h":1731,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=28DE5662C038232F","d":"2025-08-26","sid":"28DE5662"},{"q":"如何購買臺北市立國樂團出版品？","a":"本團歷年分別出版有CD、DVD、書籍、樂譜及新絲路雜誌等各項出版品，詳細目錄請瀏覽本團 TCO商店 。\n欲購者請洽下列特約商店：五南文化廣場、百樂琴苑、國家書房(松江門市)、中國音樂書房、先進樂器行(臺北及高雄門市)、小雅音樂有限公司、長安樂器有限公司、百禾民族樂器有限公司、蕙風堂(和平店)、香港竹韻樂坊，詳細購買辦法請瀏覽本團 出版品購買辦法 網頁查詢。","u":"臺北市立國樂團","h":1402,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B88EECF6794DCAD7","d":"2025-08-26","sid":"B88EECF6"},{"q":"臺北市立國樂團文化就在巷子裡音樂會大約都在何時舉辦？地點都是在什麼地方？要如何得到相關資訊？","a":"臺北市立國樂團文化就在巷子裡音樂會每年3-6月及9-12月將巡迴全市十二個行政區演出36場，相關演出資訊請上本團網站查詢，所有演出均免費入場，歡迎市民闔家前來欣賞。本團網址 https://www.tco.gov.taipei/News.aspx?n=FD3568352DCE2DF4&sms=7E41DA7FC8DE07FF\n或電 02-23832170*261 吳 小姐","u":"臺北市立國樂團","h":1333,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0FFF20CCD4684CE9","d":"2025-08-26","sid":"0FFF20CC"},{"q":"臺北市立國樂團樂譜借閱服務？","a":"承辦單位\n臺北市立國樂團演奏組\n電話：02-2383-2170#223\n傳真：02-2311-9754\n檔案下載：\n樂譜借閱申請表(PDF檔)\n樂譜借閱授權同意書(PDF檔)\n(若有表格等任何疑問，請逕洽分機223 黃 小姐)\n臺北市立國樂團樂譜借閱服務說明\n1. 借閱資格：以學校、學術單位及社團為限。\n2. 借閱時間：每週（三）、（五）下午二至四時，遇國定假日及本團有演出活動當日恕不接受申請。\n3. 本項申請採預約制：借閱者請先至本團網站下載「樂譜借閱申請表」，填妥用印後傳真或電郵至本團，再以電話預約借閱時間。（學校單位可用課外活動組或訓導處等單位戳章）\n電話：02-23832170分機223 黃小姐\n傳真：02-23119754\n4. 每月借閱以三首樂曲為限。有版權限制之樂譜恕不提供借閱服務。\n5. 本團樂譜不得攜出，如有影印需求，得利用本團影印設備，並酌付影印工本費用，本團將開立收據。\n6. 借閱者來團辦理時，請攜帶「個人證件」及「樂譜借閱申請表」正本。\n7. 為尊重著作財產權，使用樂譜應依著作權法相關規定取得公開使用權，如有因不當使用該借閱樂譜而衍生出之著作權糾紛，概由借閱單位自行負責，與本團無關。相關著作權資料請洽詢：「MÜST社團法人中華音樂著作權仲介協會」（網址：www.must.org.tw；電話：02-2717-7557）。\n8. 借閱流程：","u":"臺北市立國樂團","h":1312,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B603B2BFB195A905","d":"2025-08-26","sid":"B603B2BF"}]},{"org":"浩然敬老院","total":5,"items":[{"q":"臺北市立浩然敬老院-申請入住","a":"Q1 ：「請問我們家的長輩可否申請入住浩然敬老院？」\nA. 依據 103 年 11 月 3 日修正公布生效之臺北市立浩然敬老院入出院管理自治條例，申請入院資格為：要設籍本市年滿六十五歲之低收入戶市民，無直系血親卑親屬且無自有住宅者。\nQ2: 「如何辦理才能進住浩然敬老院呢？」\nA. 凡有意進住浩然敬老院者，請先辦理「入院登記」。本院將依登記順序建立名冊，再依序通知登記者提交體格檢查表及填寫申請書，正式進入審查作業。審查結果符合入住條件者將通知入院。\nQ3: 「如何申請登記入住浩然敬老院？」\nA. 符合申請入院登記條件者得檢具申請表及應附文件，可採用臨櫃申辦、郵寄申辦及網路申辦（ 市民服務大平台 ），所需資料如下：\n一、申請人親自辦理：\n( 一 ) 入院登記申請表 1 份（可至 市民服務大平台 進行檔案下載） 。\n( 二 ) 身分證正反面影本 1 份。\n( 三 ) 當年度臺北市低收入戶相關證明文件影本 1 份。\n二、委託申辦：\n( 一 ) 入院登記申請表 1 份（可至 市民服務大平台 進行檔案下載） 。\n( 二 ) 委託書 1 份。\n( 三 ) 申請人身分證正反面影本 1 份。\n( 四 ) 申請人當年度臺北市低收入戶相關證明文件影本 1 份。\n( 五 ) 受委託人身分證正本（驗畢歸還）。\nQ4: 「申請人為榮民且領有榮民相關生活補助，是否符合申請進住條件？\nA. 申請人如為設籍本市年滿六十五歲之低收入戶市民，無直系血親卑親屬且無自有住宅者，可先辦理入院登記，依序等候審查。尚未入住前，可持續領取榮民相關生活補助；惟於入住後，基於福利不得重複領取之原則，須放棄領取榮民就養金，但長者的榮民身分不會消失。\nQ5: 「請問我們家的長輩申請後就可以直接入住嗎？」\nA. 凡是申請入院登記後，本院會依序進行審查。審查工作包括申請人體檢資料、查調戶籍、訪視、評估、住房安排等程序，因此，申請後仍需等候審查。\nQ6: 「申請入院登記後或是入住後，長輩還可以領低收入戶補助嗎？」\nA. 申請入院登記後，因為尚須等候審查，所以仍可領取低收入戶生活扶助費。經審核符合入院長者，入住後由本院提供食宿，並每","u":"臺北市立浩然敬老院","h":2099,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F794B7CBA79C0684","d":"2017-07-26","sid":"F794B7CB"},{"q":"臺北市立浩然敬老院-志工類(結盟團體、公共服務)","a":"Q1: 如何才能加入臺北市立浩然敬老院結盟團體？\nA. 歡迎各界善心公益慈善團體加入本院結盟團體行列，定期提供關懷訪視服務、辦理文康活動或宗教服務 … 等等，相關事宜請與本院社工組洽詢，洽詢電話： 2858-1081 分機 569 。\nQ2: 學生團體如何參與臺北市立浩然敬老院公共服務？\nA. 請欲到本院服務的學生團體，先電洽本院社工組安排公共服務時間，討論公共服務的內容 ( 如：關懷長者、清潔服務、表演、文書服務 …… 等 ) ，洽詢電話： 2858-1081 分機 569 。","u":"臺北市立浩然敬老院","h":965,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6CE28C939D3AA627","d":"2017-07-26","sid":"6CE28C93"},{"q":"臺北市立浩然敬老院-外捐","a":"Q1: 受理捐贈的部門為何？非上班時間可否捐贈？\nA. 外界捐贈之財物統一由社工組受理，服務時間為星期一至星期五9:00~17:00，例假日及國定假日休息。\nQ2: 捐贈的範圍為何？\nA. 捐贈範圍包含現金（包括現款或支票）、食品、物品（以適合老人使用為主，如尿布、輪椅，但衣物除外）。\nQ3: 如何捐贈？\nA. ①捐款可以親臨本院（請先來電確認）或透過郵政劃撥。本院外捐劃撥帳號為19167140，請於郵政劃撥單上註明聯絡方式及捐款用途。\n②捐物前建議來電詢問需求性。\nQ4: 捐贈款項時可以指定用途嗎？\nA. 本院外捐款項用途目前分為：\n一、福利服務金\n二、醫療服務金\n三、加菜金\n四、慰問金\n五、設施設備費\n六、節慶祭祀專款","u":"臺北市立浩然敬老院","h":751,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1F1563D20BC917A7","d":"2017-07-26","sid":"1F1563D2"},{"q":"臺北市立浩然敬老院-其他(場地租借)","a":"Q: 如何申請使用浩然敬老院活動場地？ A：需準備下列文件 一、 申請表 二、 活動計畫 ( 活動內容或活動企劃書 ) 三、 申請單位立案證書正本或自然人國民身分證正反面影本 ( 本人或委託人 ) 四、 視活動所需之其他證明文件","u":"臺北市立浩然敬老院","h":688,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7685B90863B97617","d":"2017-07-26","sid":"7685B908"},{"q":"臺北市立浩然敬老院-參訪","a":"Q1: 申請參訪臺北市立浩然敬老院有哪些規定？\nA.\n一、 申請對象：與本院業務相關之社會福利機構、公私立團體、學校，並有正式立案者為限。\n二、 申請單位於申請時，需隨申請表併附提出活動計畫或參訪目的所需之證明文件。\n三、 申請單位參訪本院時，不得擅自變更原申請參訪目的以外之參訪內容。\n四、 申請單位參訪本院時，若有損害公物或器材設備者，需負責修復或照價賠償。\n五、 申請單位應遵從帶領參訪人員之指示，勿隨意走動影響本院院民之安全及安寧。\nQ2: 如果想要到臺北市立浩然敬老院參訪，請問要如何申請？\nA. 請於預計參訪日之 1 個月以前提出申請。申請方式可以親洽、郵寄、網路方式辦理，本院於收受申請表及相關文件後，將於 6 天內回復申請結果。","u":"臺北市立浩然敬老院","h":623,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C04DF3FBCCF41C63","d":"2017-07-26","sid":"C04DF3FB"}]},{"org":"大同區公所","total":3,"items":[{"q":"後備軍人退伍令遺失如何補發？","a":"後備軍人補發退伍令\n一、請備妥下列證件，至區公所兵役課申請：\n(一)申請書1份。（兵役課櫃檯直接填寫）\n(二)本人身分證正本、私章。（如代辦須另備代辦人的身分證、私章及本人親筆簽名委託書）\n(三)補發時間約7至10個工作天（代轉臺北市後備指揮部補發），電話通知申請人回區公所兵役課領取。\n二、亦可逕赴臺北市後備指揮部（臺北市中正區博愛路172號）申請，當日補發。","u":"臺北市大同區公所","h":17995,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=14D7ED485040238E","d":"2026-08-27","sid":"14D7ED48"},{"q":"哪些事情可以在區公所調解委員會聲請調解？","a":"區公所調解業務\n一、調解範圍\n(一)一般民事事件均可調解，但以下民事事件不能要求調解：\n1.婚姻的無效或撤銷，請求認領、協議離婚等。\n2.違背強制或禁止的規定、公共秩序或善良風俗的事項，如買良為娼、設賭場等。\n3.假扣押、假處分、公示催告、宣告死亡及監護宣告等事項。\n4.民事事件已在第一審法院辯論終結者。\n5.聲請給付超過法定利率的利息者。\n6.關於租佃爭議事件。\n7.關於畸零地糾紛。\n8.其他法令規定有特別限制者。\n(二)刑事事件：以告訴乃論之刑事事件為限。\n二、聲請手續：\n(一)民事事件：由聲請人向對造人住居所（營業所或事務所）所在地之調解委員會以書面併相關證件資料提出聲請。\n(二)刑事事件：由聲請人向對造人住居所（營業所或事務所）所在地或犯罪地之調解委員會以書面併相關證件資料提出聲請。","u":"臺北市大同區公所","h":2590,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=718A165D892A3D99","d":"2026-08-27","sid":"718A165D"},{"q":"臺北市大同區公所服務時間","a":"各課室服務時間\n星期一至星期五（例假日除外） 上午 08:30～12:30 及 下午 13:30～17:30。\n社會課綜合受理櫃檯與兵役課櫃檯 中午 12:30～13:30 實施彈性上班。\n免費法律諮詢服務\n時間：星期一至星期五（例假日除外） 上午 09:30～11:30。\n地點：本行政中心4樓「調解委員會」。","u":"臺北市大同區公所","h":1480,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9071C5F1A6F6F353","d":"2026-08-27","sid":"9071C5F1"}]},{"org":"政風處","total":2,"items":[{"q":"請問我該如何查閱市府公務員財產申報資料？","a":"請您先到「臺北市政府-台北服務通」網站以網路申辦方式或至本府各政風機構現場提出查閱申請。","u":"臺北市政府政風處","h":12348,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A548C91C1C664925","d":"2026-07-01","sid":"A548C91C"},{"q":"請問市府對民眾檢舉公務員貪瀆不法行為有何獎勵、保護措施？","a":"一、行政院訂頒「獎勵保護檢舉貪污瀆職辦法」規定，凡舉發公務員貪瀆不法經法院判決有罪者，法務部將視法院判決情形發給檢舉獎金，金額最高可達新臺幣1,000萬元。\n二、臺北市政府為貫徹廉能政治，提升施政效能，亦訂有「臺北市政府檢舉貪污瀆職或不法案件獎勵要點」，鼓勵民眾勇於檢舉本府公務員貪污瀆職不法並符合罪刑法定科刑比例，查明本府公務員涉犯貪污瀆職或不法犯罪案件經檢察官緩起訴處分確定者，給與5 萬元獎金；經檢察官起訴時，可給每案10萬元獎金，後經第一審法院判決有罪者，可先依給獎標準發給獎金二分之一，並視法院判決刑度發給其餘獎金，給獎金額最高可達200 萬元。若民眾係檢舉採購廠商涉犯政府採購法案件，經檢察官起訴時，可給每案3萬元獎金，判決確定後再給與每案2萬元；經檢察官緩起訴處分確定者，則給與5,000元獎金 。\n三、民眾所檢舉案件如同時符合「獎勵保護檢舉貪污瀆職辦法」及「臺北市政府檢舉貪污瀆職或不法案件獎勵要點」規定，均可分別向法務部及臺北市政府申請領取獎金。受理檢舉之政風單位對於檢舉人之姓名、年齡、住所或居所、檢舉書、筆錄或其他相關資料，均嚴加保密。","u":"臺北市政府政風處","h":4387,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8D0404C0917DB68C","d":"2026-07-16","sid":"8D0404C0"}]},{"org":"美術館","total":2,"items":[{"q":"請問參觀臺北市立美術館票價及優待？","a":"該館票價及優待詳見美術館網站 參觀 > 參觀美術館 > 參觀票價 。","u":"臺北市立美術館","h":4554,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=393088D2EA1FA5C9","d":"2008-06-23","sid":"393088D2"},{"q":"請問臺北市立美術館的地址與交通資訊？","a":"地址：臺北市中山區（10461）中山北路三段181號。\n交通資訊：\n捷運：淡水線圓山站\n公車：臺北市立美術館站，公車路線：21、42、203、208、218、220、247、260、277、279、287、310、612、677、1717、2022、9006、紅2、中山幹線。","u":"臺北市立美術館","h":4247,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BE47F5DD071C2195","d":"2010-12-30","sid":"BE47F5DD"}]},{"org":"交響樂團","total":1,"items":[{"q":"臺北市立交響樂團常見問答集(FAQ)","a":"「育藝深遠」由臺北市政府文化局與教育局共同主辦，為全國第一個結合藝術資源及義務教育的藝術教育啟蒙方案，配合「藝術與人文」課程的規劃，讓文化藝術自然融入正式課程之中。 臺北市立交響樂團的育藝深遠音樂會專為臺北市國小五年級學生設計，透過「育藝深遠」音樂會，臺北市的每一位國小五年級學生皆能現場欣賞交響樂團的演出。自94學年度舉辦至今，近40萬名學生入場聆賞，獲得廣泛迴響。 北市交育藝深遠音樂會後常接獲各界回饋，老師普遍肯定本團節目安排，表示能讓學生更清楚地認識交響樂團音樂會，許多學生亦將心中對於音樂會內容的感動及喜愛與北市交分享，表達對此一活動的肯定與感謝；甚至透過媒體報導也有其他縣市的校方或家長主動來電詢問能否開放其他縣市的小孩參與這麼棒的音樂活動。\n臺北市立交響樂團為推廣音樂教育，並進一步擴大音樂CD出版品之流通與提升市民欣賞藝術之水準，因此出版CD，以服務愛樂朋友們。本團出版品透過政府出版品展售單位國家書店及五南書店流通展售，可於下列網址查詢實體門市及網站購買： https://www.tso.gov.taipei/Content_List.aspx?n=B54F9B5802CFDBC7 ；或於各大音樂線上平台收聽。\n臺北市立交響樂團附設團之招考，依團員及演出實際狀況不定期舉辦，請密切注意官網首頁「最新消息」之招考訊息。","u":"臺北市立交響樂團","h":36543,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=03966DDA1380F93C","d":"2026-06-25","sid":"03966DDA"}]},{"org":"家庭教育中心","total":1,"items":[{"q":"家庭教育中心常見問答","a":"問題1：有關家庭問題可向哪個單位尋求協助？\n您可致電全國家庭教育諮詢專線412-8185。\n此專線係由受過專業訓練的志工老師提供電話協談服務，陪伴民眾面對人生各發展階段中家庭議題，如個人困擾、親職教養、婚姻、性別、家庭角色與關係等問題，以增進自我了解，創造更適意的家庭生活。※全國家庭教育諮詢專線：市內電話直撥412-8185（手機請加02）\n服務時間：\n週一至週五  09時至12時; 14時至17時; 18時至21時\n星期六   09時至12時;14時至17時\n國定假日暫停服務\n(聯絡人：施小姐、連絡電話：25419690分機616）\n問題2：請問家庭教育中心經常性辦理的推廣活動有哪些？\n本中心經常性舉辦活動以家人關係與家庭生活為議題。\n主要辦理安排專題演講及活動討論，進行婚姻溝通、家庭經營、姻親關係、性別與資源、親職教養...等主題性講座。\n考量場地容納人數限制及預先準備，如欲參加活動，請先至本中心官網點選欲參加之活動、課程或講座並進行網路報名，本中心將於活動前寄發提醒通知。\n(聯絡人：行政櫃台、連絡電話：25419690分機612）\n問題3：家庭教育中心是否設置無障礙廁所、親子廁所或性別友善廁所?\n是。本棟建築B1至10樓均設有無障礙廁所， B2、B1、3、5、8及10樓設有親子廁所，1樓及6樓設有性別友善廁所，提供民眾使用。\n(聯絡人：行政櫃台、連絡電話：25419690分機612)\n問題4：請問家教中心是否有哺集乳室？\n是。為提供友善哺育環境，本棟大樓2樓、3樓設有哺集乳室，並於1樓服務臺設有母乳專用冰箱，提供民眾使用。\n(聯絡人：行政櫃台、連絡電話：25419690分機612)\n問題5：請問家庭教育中心停車場資訊?\n本棟大樓B3、B4設有停車位，並設有2個親子停車位，僅供乘載孕婦或育有6歲以下兒童之車輛使用，應將「孕婦或育有6歲以下兒童停車位識別證明」置於汽車前擋風玻璃明顯處，始得停放。\n停車場為24小時開放，人員服務時間自上午8時至晚上10時。\n臨停費用：以每半小時15元計費，未達半小時者以半小時計。\n(聯絡人：行政櫃台、連絡電話：25419690分機612","u":"臺北市家庭教育中心","h":1949,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CEDFF4497D1B71ED","d":"2024-06-17","sid":"CEDFF449"}]},{"org":"松山區公所","total":1,"items":[{"q":"臺北市松山區公所地址及電話","a":"臺北市松山區公所地址及電話\n地址：105212臺北市松山區八德路4段692號7-11樓\n電話：(02)87878787","u":"臺北市松山區公所","h":1180,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D4F95B552866670B","d":"2021-08-18","sid":"D4F95B55"}]},{"org":"貓空纜車","total":1,"items":[{"q":"貓空纜車常見問答","a":"持電子票證(悠遊卡、一卡通、愛金卡等)之旅客可直接於閘門感應票卡進站搭乘纜車，1張卡限1人使用。\n依系統運行速度，由纜車動物園站至貓空站，全程行駛時間約17分~37分(運行速度為5公尺/秒~2公尺/秒)。\n相關路線交通資訊， 請點閱 。\n相關景點介紹， 請點閱 。\n1. 動物園站地下停車場，停車費率表， 請點閱 2. 木柵機廠停車場，停車費率表， 請點閱 3. 動物園站堤外停車場，停車費率表， 請點閱\n當營運路線區域發生落雷時，系統將儘速停止營運，已載運之旅客，立即安排於安全的車站下車，全線車廂清車後系統暫停運轉；因雷雨持續時間不定，故停機後無法預知恢復營運的時間；若30分鐘內警戒區域內未再有落雷現象，系統將進行檢視確認無影響營運安全之狀況後，系統才會恢復營運。落雷期間滯留於山上各站之旅客，將啟動接駁公車疏散旅客下山。\n貓空纜車系統全長4.033公里，略呈7字型，為臺北市內第一條自動循環纜車系統，共設置4座供旅客上、下纜車的場站，依序為「動物園站」、「動物園南站」、「指南宮站」及「貓空站」，另2座轉角站為動力操控及路線彎折之用，不提供旅客上、下車服務。\n纜車車廂本身不具動力，係掛載於由動力系統驅動之纜索，以逆時針方向循環運轉。動力系統則配置於轉角2站月臺層上方之高架平臺上。\n貓空纜車系統工程規劃主辦機關為「臺北市政府交通局」，工程主辦機關為「臺北市政府工務局新建工程處」，專案管理及監造單位為「臺灣世曦工程顧問股份有限公司」，統包廠商為「春原營造股份有限公司」，纜車系統製造商為法商POMA，並由「臺北大眾捷運股份有限公司」負責營運管理。\n貓纜車廂可載重640公斤，一般車廂可載8名乘客，「貓纜之眼」水晶車廂因底部強化玻璃重兩百多公斤，最多只能載5人。貓纜之眼車廂地板，係由3層強化玻璃組成，總厚度約48mm，玻璃重量約213公斤，由原廠法國POMA系統車廂製造商SIGMA，指派技師來臺指導安裝，該透明地板皆通過歐洲CE安全認證，旅客可放心搭乘。\n纜車車廂內禁止飲食（不含白開水或礦泉水）、吸煙、嚼食口香糖或檳榔，以維護纜車系統清潔及沿線山林之環境。\n臺北貓空纜車於2010年3月","u":"貓空纜車","h":314626,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DD0CD899ACDC0A32","d":"2017-01-18","sid":"DD0CD899"}]}],"tags":["稅務","勞工權益","交通停車","社福補助","戶政兵役","環保清潔","醫療衛生","建管都更","水電瓦斯","動物保護","教育文化","消防安全","地政地價","工商營業","殯葬民政","公園工程","其他綜合"]}</script>

"use strict";

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(n){return Number(n||0).toLocaleString('en-US')}
function shortQ(q){q=String(q).replace(/^請問|^想問/,'');return q.length>26?q.slice(0,26)+'…':q}

/* ================= 內容產生 ================= */
function sentences(a){
  /* 不用 lookbehind，iOS 16.4 之前的 Safari 才不會語法錯誤 */
  var src=String(a||'').replace(/。/g,'。\n')
    .replace(/([一二三四五六七八九十]、)/g,'\n$1')
    .replace(/(（[一二三四五六七八九十\d]+）)/g,'\n$1')
    .replace(/(\(\d+\))/g,'\n$1');
  var raw=src.split(/\n+/);
  var out=[],seen={};
  for(var i=0;i<raw.length;i++){
    var t=raw[i].replace(/\s+/g,' ').trim().replace(/^[、,，。]+/,'');
    if(t.length<8||seen[t])continue;seen[t]=1;out.push(t);
  }
  if(!out.length&&String(a||'').trim())out.push(String(a).trim());
  return out;
}
function keyPoints(a){
  var s=sentences(a),out=[];
  for(var i=0;i<s.length&&out.length<8;i++)out.push(s[i].length>120?s[i].slice(0,120)+'…':s[i]);
  return out;
}
function trim(t,n){t=String(t).replace(/^[一二三四五六七八九十]、/,'').replace(/^（[^）]{1,4}）/,'')
  .replace(/^\(\d+\)/,'').trim();return t.length>n?t.slice(0,n)+'…':t}
/* 同局處、同主題的相鄰 FAQ（延伸追問的題源） */
function snip(s,rx,n){
  rx.lastIndex=0;
  var m=rx.exec(s);
  if(!m)return trim(s,n);
  var st=Math.max(0,m.index-40),en=Math.min(s.length,st+n);
  return (st>0?'…':'')+s.slice(st,en).trim()+(en<s.length?'…':'');
}
function relatedFor(item){
  var out=[],i,it;
  if(!S.org)return out;
  for(i=0;i<S.org.items.length;i++){
    it=S.org.items[i];
    if(it.q===item.q)continue;
    if(it.t===item.t)out.push(it);
    if(out.length>=3)break;
  }
  for(i=0;i<S.org.items.length&&out.length<3;i++){
    it=S.org.items[i];
    if(it.q===item.q||out.indexOf(it)>=0)continue;
    out.push(it);
  }
  return out;
}
function cite(f){
  return f.u+'〈'+(f.q.length>20?f.q.slice(0,20)+'…':f.q)+'〉'+(f.d?' '+f.d:'')+(f.sid?' #'+f.sid:'');
}
/* 追問：命中規則 + 從標準答案挑出對應句當「正解」 */
function probesFor(item){
  var txt=item.q+' '+item.a,sn=sentences(item.a),out=[],i,j;
  for(i=0;i<PROBES.length&&out.length<4;i++){
    if(!PROBES[i][0].test(txt))continue;
    var ans='';
    for(j=0;j<sn.length;j++)if(PROBES[i][0].test(sn[j])){ans=snip(sn[j],PROBES[i][0],120);break}
    out.push({q:PROBES[i][1],why:PROBES[i][2],ans:ans,src:item,kind:'主題'});
  }
  if(out.length<3)out.push({q:'這件事如果我不方便自己來辦，還有沒有其他管道？',
    why:'替代管道是否主動提供',ans:'',src:item,kind:'主題'});
  var rel=relatedFor(item);
  for(i=0;i<rel.length&&i<2;i++){
    var rs=sentences(rel[i].a);
    out.push({q:'另外順便問一下，'+rel[i].q,why:'延伸題：同業務相鄰知識，測知識廣度與是否需再轉接',
      ans:rs.length?trim(rs[0],120):'',src:rel[i],kind:'延伸'});
  }
  out.push({q:TAIL_PROBES[0][0],why:TAIL_PROBES[0][1],ans:'',src:null,kind:'服務行為'});
  out.push({q:TAIL_PROBES[1][0],why:TAIL_PROBES[1][1],ans:'',src:null,kind:'服務行為'});
  return out;
}
function crossOrgFor(item){
  var pool=[],i,j;
  for(i=0;i<ORGS.length;i++){
    if(ORGS[i].org===S.org.org)continue;
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].t===item.t){pool.push(ORGS[i].org);break}
  }
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:'區公所';
}
/* 開場（依難度） */
function openingLines(item,level){
  var p=PERSONAS[S.persona],lines=[{who:'客',t:p.open}];
  if(level==='L1'){lines.push({who:'客',t:'我想請問：'+item.q});}
  else if(level==='L2'){
    lines.push({who:'客',t:'就是…那個…我不太會講，跟「'+item.t+'」有關的事情。大概就是'+shortQ(item.q)+
      '這樣，<em>（停頓 2 秒，不要補充細節）</em>你聽得懂我的意思嗎？'});
  }else if(level==='L3'){
    lines.push({who:'客',t:'我上個禮拜就打過一次 1999 了，到現在還是沒人跟我講清楚。<em>（語氣不耐但不辱罵）</em>'});
    lines.push({who:'客',t:'我要問的是：'+item.q+' 這到底是誰在管？'});
  }else{
    lines.push({who:'客',t:'我有兩件事要問。第一，'+item.q});
    lines.push({who:'客',t:'第二，我聽說「'+crossOrgFor(item)+'」那邊也要辦，是真的嗎？'+
      '如果不是你們管的，麻煩幫我轉正確的單位。'});
    lines.push({who:'客',t:'還有，'+(CROSS_CENTRAL[item.t]||'這件事是不是要找中央？')+
      '，你們也可以查嗎？<em>（測知識邊界，不要提示答案）</em>'});
  }
  return lines;
}
/* 完整正常對話模擬：專員台詞由標準答案組出 */
function dialogue(item){
  var p=PERSONAS[S.persona],kp=keyPoints(item.a),pr=probesFor(item),L=[],i;
  L.push({who:'員',t:'您好，1999 臺北市民當家熱線，我是專員 ○○○，很高興為您服務。',
    mark:'開場：問候＋單位＋代號'});
  L.push({who:'客',t:p.open});
  var ol=openingLines(item,S.level);
  for(i=1;i<ol.length;i++)L.push({who:'客',t:ol[i].t});
  L.push({who:'員',t:'好的，我跟您確認一下，您是想問「'+shortQ(item.q)+
    '」這部分，對嗎？方便先跟您確認一下時間跟地點嗎？',mark:'需求確認：複述＋補問條件'});
  L.push({who:'客',t:'對，就是這個。'+p.back});
  var used=Math.min(kp.length,4);
  for(i=0;i<used;i++)L.push({who:'員',t:CONNECT[i]+trim(kp[i],120),
    mark:i===0?'答詢：對照標準答案要點':'',cite:'本題 FAQ 要點 '+(i+1)+'／'+cite(item)});
  L.push({who:'客',t:pr[0].q,mark:'追問 1'});
  L.push({who:'員',t:pr[0].ans?pr[0].ans:'（此題標準答案未載明，觀察專員是否誠實說明「須再確認並回電」，而非自行推測）',
    mark:pr[0].ans?'應答出這一段':'觀察：不確定時的處理',
    cite:pr[0].ans?cite(pr[0].src):''});
  if(pr[1]){
    L.push({who:'客',t:pr[1].q,mark:'追問 2'});
    L.push({who:'員',t:pr[1].ans?pr[1].ans:'（同上，觀察是否轉業管單位或承諾回電）',
      mark:pr[1].ans?'應答出這一段':'觀察：轉介與回電承諾',
      cite:pr[1].ans?cite(pr[1].src):''});
  }
  L.push({who:'客',t:p.ack,mark:'測耐心／換句話說'});
  L.push({who:'員',t:'沒問題，我再幫您整理一次重點：'+trim(kp[0],60)+
    (kp[1]?'；還有'+trim(kp[1],60):'')+'。',mark:'摘要複述'});
  if(kp.length>used)L.push({who:'員',t:'另外還有一項細節：'+trim(kp[used],110),mark:'完整度'});
  L.push({who:'客',t:'好，我大概懂了。<em>（不要主動道謝，看專員是否自己問「還有其他需要嗎」）</em>'});
  L.push({who:'員',t:'請問還有其他需要為您服務的地方嗎？',mark:'結案確認'});
  L.push({who:'客',t:'沒有了，謝謝。'});
  L.push({who:'員',t:'謝謝您的來電，祝您順心，再見。<em>（記錄是否等民眾先掛機）</em>',mark:'結束語'});
  return L;
}

/* ================= 清單 ================= */
function renderOrgs(filter){
  var host=el('org-list'),html='',list=ORGS,i;
  if(filter){list=[];for(i=0;i<ORGS.length;i++)if(ORGS[i].org.indexOf(filter)>=0)list.push(ORGS[i]);}
  for(i=0;i<list.length;i++){var o=list[i];
    html+='<button class="pick" data-org="'+esc(o.org)+'" aria-current="'+(S.org&&S.org.org===o.org)+
      '"><span class="nm">'+esc(o.org)+'</span><span class="qty">'+o.total+'</span></button>';}
  host.innerHTML=html||'<div class="empty">沒有符合的局處</div>';
  el('org-count').textContent=list.length;
}
function renderTopics(term){
  var host=el('topic-list'),items=[],html='',i,j;
  if(term){
    outer:for(i=0;i<ORGS.length;i++)for(j=0;j<ORGS[i].items.length;j++){
      var it=ORGS[i].items[j];
      if(it.q.indexOf(term)>=0||it.a.indexOf(term)>=0)items.push([ORGS[i],it]);
      if(items.length>=60)break outer;
    }
  }else if(S.org){for(i=0;i<S.org.items.length;i++)items.push([S.org,S.org.items[i]]);}
  for(i=0;i<items.length;i++){
    var org=items[i][0],item=items[i][1];
    html+='<button class="pick" data-org="'+esc(org.org)+'" data-q="'+esc(item.q)+'" aria-current="'+
      (S.item&&S.item.q===item.q)+'"><span class="nm"><span class="q">'+esc(item.q)+'</span>'+
      '<span class="sub">'+esc(item.t)+' · '+num(item.h)+(term?' · '+esc(org.org):'')+'</span></span>'+
      (item.h>=200000?'<span class="hot">熱</span>':'')+'</button>';
  }
  host.innerHTML=html||'<div class="empty">請先選局處，或用上方搜尋找題目</div>';
  el('topic-count').textContent=items.length||'';
}

/* ================= 腳本 ================= */
function blk(id,title,tail,inner){
  return '<details class="blk" data-blk="'+id+'"'+(S.openBlk[id]?' open':'')+'>'+
    '<summary><span class="mk">▸</span><span class="num">'+id+'</span>'+esc(title)+
    (tail?'<span class="tail">'+esc(tail)+'</span>':'')+'</summary><div class="blkin">'+inner+'</div></details>';
}
function lineHTML(o){
  var cls=o.who==='員'?'line agent':'line',who=o.who==='客'?'who me':(o.who==='員'?'who':'who gap');
  return '<div class="'+cls+'"><span class="'+who+'">'+o.who+'</span><div class="say">'+o.t+
    (o.mark?'<span class="mark">'+esc(o.mark)+'</span>':'')+
    (o.cite?'<span class="cite">↳ 依據：'+esc(o.cite)+'</span>':'')+'</div></div>';
}
function renderSheet(){
  if(!S.item){el('sh-body').innerHTML='<div class="empty">尚未選題</div>';return}
  var item=S.item,p=PERSONAS[S.persona],L=LEVELS[S.level],W=WINDOWS[S.win],i,s;
  el('sh-org').textContent=S.org.org+' ／ '+item.u;
  el('sh-q').textContent=item.q;
  el('sh-chips').innerHTML='<span class="chip on">'+esc(L.n)+'</span><span class="chip">'+esc(p.n)+
    '</span><span class="chip">'+esc(W.n)+'</span><span class="chip">'+esc(item.t)+
    '</span><span class="chip">點閱 '+num(item.h)+'</span>';

  var kp=keyPoints(item.a),pr=probesFor(item),dl=dialogue(item),h='';

  h+=blk('01','撥號前準備','4 項',
    '<ul class="prep"><li>時段 <b>'+esc(W.n)+'</b>：'+esc(W.hint)+'</li>'+
    '<li>身分 <b>'+esc(p.n)+'</b>：'+esc(p.tone)+'。全程維持設定，不要露出內部用語。</li>'+
    '<li>秒錶記三個時間點：撥通 → 語音選單結束 → 真人應答。</li>'+
    '<li>備一個假地址（用實際行政區即可），不提供真實個資；錄音與告知程序依貴中心稽核規定辦理。</li></ul>');

  s='<p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-2)">'+
    '藍色是<b>你要念的台詞</b>，綠色是<b>專員「正解版」應該講出來的內容</b>（由本題標準答案組成）——'+
    '照著對，落差就是缺口。</p>';
  for(i=0;i<dl.length;i++)s+=lineHTML(dl[i]);
  s+='<div class="watch"><b>本情境要測出什麼：</b>'+esc(L.test)+'<br><b>情境設計：</b>'+esc(L.design)+'</div>';
  h+=blk('02','完整對話模擬（正常情境）',dl.length+' 句',s);

  s='';
  for(i=0;i<pr.length;i++){
    s+='<div class="probe"><span class="n">追問 '+(i+1)+'</span> <span class="kind">'+esc(pr[i].kind)+'</span>'+
      '<p class="ask">「'+esc(pr[i].q)+'」</p>'+
      '<p class="why"><b>測什麼</b><span>'+esc(pr[i].why)+'</span></p>'+
      (pr[i].ans?'<p class="ans"><b>正解應含</b><span>'+esc(pr[i].ans)+'</span></p>':
       '<p class="ans"><b>正解應含</b><span>標準答案未載明——聽專員是否誠實說「幫您確認後回電」，'+
       '而不是自行推測或請您自己去問。</span></p>')+
      (pr[i].src?'<p class="ans"><b>依據 FAQ</b><span>'+esc(cite(pr[i].src))+'</span></p>':
       '<p class="ans"><b>依據 FAQ</b><span>無（純服務行為觀察題）</span></p>')+'</div>';
  }
  h+=blk('03','追問清單（依序問，每題等對方講完）',pr.length+' 題',s);

  s='<p style="margin:0 0 9px;font-size:12.5px;color:var(--ink-2)">同一題可換情境再撥一次，'+
    '測不同能力。目前選的是 <b>'+esc(L.n)+'</b>。</p>';
  var keys=['L1','L2','L3','L4'];
  for(i=0;i<keys.length;i++){
    var lv=keys[i],ol=openingLines(item,lv),t='';
    for(var j=1;j<ol.length;j++)t+=(j>1?'<br>':'')+ol[j].t;
    s+='<div class="alt'+(lv===S.level?' cur':'')+'"><span class="lv">'+esc(LEVELS[lv].n)+'</span>'+
      '<p>'+t+'</p><p class="obs">→ '+esc(LEVELS[lv].test)+'</p></div>';
  }
  h+=blk('04','情境變化（換難度的開場替換句）','4 級',s);

  s='<ol class="points">';
  for(i=0;i<kp.length;i++)s+='<li>'+esc(kp[i])+'</li>';
  s+='</ol><p class="src">來源：'+esc(cite(item))+
    (item.l?' · <a href="'+esc(item.l)+'" target="_blank" rel="noopener">原始問答頁</a>':'')+'</p>';
  h+=blk('05','標準答案全要點（對照用）',kp.length+' 點',s);

  var rel=relatedFor(item),refs=[{f:item,use:'主問句、對話模擬中專員的答覆內容、追問 1–'+
    (pr.length>2?'2':'1')+' 的正解、標準答案要點'}];
  for(i=0;i<rel.length&&i<2;i++)refs.push({f:rel[i],use:'延伸追問（測同業務相鄰知識與轉接判斷）'});
  for(i=2;i<rel.length;i++)refs.push({f:rel[i],use:'備用題（同局處相鄰題，可換題再撥一次）'});
  s='<p style="margin:0 0 9px;font-size:12.5px;color:var(--ink-2)">本腳本每一句專員台詞都來自下列 FAQ，'+
    '沒有自行編寫的答案。稽核時如專員說法與這些條目不同，即為落差。</p><div class="refs">';
  for(i=0;i<refs.length;i++){
    var f=refs[i].f;
    s+='<div class="ref"><div class="rq">'+(i===0?'<span class="badge">主題</span>':
      '<span class="badge alt2">參考</span>')+esc(f.q)+'</div>'+
      '<div class="rm">'+esc(f.u)+' · 發布 '+esc(f.d||'—')+' · 點閱 '+num(f.h)+
      (f.sid?' · ID '+esc(f.sid):'')+'</div>'+
      '<div class="rm">用途：'+esc(refs[i].use)+'</div>'+
      (f.l?'<div class="rm"><a href="'+esc(f.l)+'" target="_blank" rel="noopener">開啟市府原始問答頁</a></div>':'')+
      '</div>';
  }
  s+='</div><p class="src">題庫檔：'+esc(DATA.source)+'（'+esc(DATA.generated)+' 匯出，共 '+
    num(DATA.totalFaq)+' 題）</p>';
  h+=blk('06','參考 FAQ 來源（可點連結核對原文）',refs.length+' 則',s);

  el('sh-body').innerHTML=h;
  el('sh-body').scrollTop=0;

  /* 永遠可見的來源列 */
  s='<span class="lb">參考 FAQ 來源</span>';
  for(i=0;i<refs.length;i++){
    var rf=refs[i].f,role=i===0?'主題':(i<3?'延伸':'備用');
    s+=rf.l?('<a class="'+(i===0?'main':'')+'" href="'+esc(rf.l)+'" target="_blank" rel="noopener" title="'+
      esc(rf.q+'｜'+rf.u+'｜發布 '+(rf.d||'—')+'｜點閱 '+num(rf.h)+'｜ID '+rf.sid+'｜用途：'+refs[i].use)+
      '"><span class="rl">'+role+'</span>'+esc(rf.q)+'</a>'):
      ('<span title="'+esc(rf.q)+'">'+role+'（無連結）</span>');
  }
  s+='<span style="flex:none">· 題庫 '+esc(DATA.source)+' '+esc(DATA.generated)+'</span>';
  el('src-bar').innerHTML=s;
}
function onToggle(e){
  var d=e.target;
  if(d&&d.tagName==='DETAILS'&&d.getAttribute('data-blk')){
    S.openBlk[d.getAttribute('data-blk')]=d.open;saveUI();
  }
}
function setAllBlk(open){
  var ds=el('sh-body').querySelectorAll('details.blk'),i;
  for(i=0;i<ds.length;i++){ds[i].open=open;S.openBlk[ds[i].getAttribute('data-blk')]=open}
  saveUI();
}

/* ================= 複製／列印 ================= */
function unem(t){return String(t).replace(/<em>/g,'').replace(/<\/em>/g,'')}
function plainScript(){
  if(!S.item)return '';
  var item=S.item,p=PERSONAS[S.persona],L=LEVELS[S.level],W=WINDOWS[S.win],i;
  var out=['1999 秘密客測試腳本','局處：'+S.org.org+'（'+item.u+'）','題目：'+item.q,
    '情境：'+L.n+'｜身分：'+p.n+'｜時段：'+W.n,'',
    '【撥號前準備】','・'+W.hint,'・身分設定：'+p.tone,'・記錄撥通、語音選單結束、真人應答三個時間點',
    '・準備假地址，不提供真實個資','',
    '【完整對話模擬（正常情境）】※「員」為由標準答案組成的正解版，用來比對落差'];
  var dl=dialogue(item);
  for(i=0;i<dl.length;i++){
    out.push(dl[i].who+'：'+unem(dl[i].t)+(dl[i].mark?'　〔'+dl[i].mark+'〕':''));
    if(dl[i].cite)out.push('      ↳ 依據：'+dl[i].cite);
  }
  out.push('','要測出什麼：'+L.test,'情境設計：'+L.design,'','【追問清單】');
  var pr=probesFor(item);
  for(i=0;i<pr.length;i++){
    out.push((i+1)+'. 「'+pr[i].q+'」（'+pr[i].kind+'）');
    out.push('   測什麼：'+pr[i].why);
    out.push('   正解應含：'+(pr[i].ans||'標準答案未載明——聽專員是否誠實說「確認後回電」'));
    out.push('   依據 FAQ：'+(pr[i].src?cite(pr[i].src):'無（純服務行為觀察題）'));
  }
  out.push('','【情境變化：換難度的開場替換句】');
  var keys=['L1','L2','L3','L4'];
  for(i=0;i<keys.length;i++){
    var ol=openingLines(item,keys[i]);
    out.push('◆ '+LEVELS[keys[i]].n+'（'+LEVELS[keys[i]].test+'）');
    for(var j=1;j<ol.length;j++)out.push('   客：'+unem(ol[j].t));
  }
  out.push('','【標準答案全要點（對照用）】');
  var kp=keyPoints(item.a);
  for(i=0;i<kp.length;i++)out.push((i+1)+'. '+kp[i]);
  out.push('','【本腳本參考的 FAQ 出處】');
  out.push('・主題：'+cite(item)+(item.l?'\n  '+item.l:''));
  var rel=relatedFor(item);
  for(i=0;i<rel.length;i++)
    out.push('・'+(i<2?'延伸追問':'備用題')+'：'+cite(rel[i])+(rel[i].l?'\n  '+rel[i].l:''));
  out.push('','題庫檔：'+DATA.source+'（'+DATA.generated+' 匯出，共 '+DATA.totalFaq+' 題）');
  return out.join('\n');
}
function copy(text,msg){
  function done(){flash('said',msg)}
  function fb(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){flash('said','複製失敗')}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fb);
  else fb();
}
function flash(id,msg){var e=el(id);if(!e)return;e.textContent=msg;setTimeout(function(){e.textContent=''},2600)}

/* ================= 版面 ================= */
function layout(){
  el('board').style.gridTemplateColumns=[S.fold.org?'32px':'164px',
    S.fold.topic?'32px':'240px','minmax(380px,1fr)'].join(' ');
  var mb=el('btn-max');
  if(mb)mb.textContent=(S.fold.org&&S.fold.topic)?'還原選單':'腳本最大化';
  var cs=[['col-org','org'],['col-topic','topic']],i;
  for(i=0;i<cs.length;i++){
    var c=el(cs[i][0]);
    c.classList.toggle('fold',S.fold[cs[i][1]]);
    c.classList.toggle('rail',S.fold[cs[i][1]]);
    var ct=c.querySelector('.caret');if(ct)ct.textContent=S.fold[cs[i][1]]?'▸':'▾';
  }
}
function saveUI(){lsSet(LSU,{fold:S.fold,openBlk:S.openBlk})}
function remember(){lsSet(LSL,{org:S.org?S.org.org:null,q:S.item?S.item.q:null,
  persona:S.persona,level:S.level,win:S.win})}

/* ================= 選題 ================= */
function selectOrg(name){
  for(var i=0;i<ORGS.length;i++)if(ORGS[i].org===name){S.org=ORGS[i];break}
  S.item=S.org.items[0];
  renderOrgs(null);renderTopics('');renderSheet();remember();
}
function selectItem(orgName,q){
  var found=null,i,j;
  for(i=0;i<ORGS.length;i++)if(ORGS[i].org===orgName){
    S.org=ORGS[i];
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].q===q){found=ORGS[i].items[j];break}
    break;
  }
  if(!S.org)S.org=ORGS[0];
  S.item=found||S.org.items[0];
  renderOrgs(null);renderTopics(el('f-search').value.trim());renderSheet();remember();
}
function randomPick(){
  var wsum=0,i;
  for(i=0;i<ORGS.length;i++)wsum+=ORGS[i].total;
  var r=Math.random()*wsum,acc=0,org=ORGS[0];
  for(i=0;i<ORGS.length;i++){acc+=ORGS[i].total;if(r<=acc){org=ORGS[i];break}}
  var it=org.items[Math.floor(Math.random()*Math.min(org.items.length,12))];
  var lv=['L1','L1','L1','L2','L2','L2','L2','L3','L3','L4'],
      pk=Object.keys(PERSONAS),wk=Object.keys(WINDOWS);
  S.level=lv[Math.floor(Math.random()*lv.length)];
  S.persona=pk[Math.floor(Math.random()*pk.length)];
  S.win=wk[Math.floor(Math.random()*wk.length)];
  el('f-level').value=S.level;el('f-persona').value=S.persona;el('f-window').value=S.win;
  el('f-search').value='';
  selectItem(org.org,it.q);
  flash('said','抽出：'+org.org+' · '+S.level);
}

/* ================= init ================= */
function fillSelect(id,obj,val){
  var s=el(id),h='',k;
  for(k in obj)h+='<option value="'+k+'">'+esc(obj[k].n)+'</option>';
  s.innerHTML=h;s.value=val;
}
function init(){
  el('m-faq').textContent=num(DATA.totalFaq);
  el('m-org').textContent=ORGS.length;
  el('m-date').textContent=DATA.generated;
  fillSelect('f-persona',PERSONAS,S.persona);
  fillSelect('f-level',LEVELS,S.level);
  fillSelect('f-window',WINDOWS,S.win);

  var ui=lsGet(LSU,null);
  if(ui){if(ui.fold)S.fold=ui.fold;if(ui.openBlk)S.openBlk=ui.openBlk}
  var last=lsGet(LSL,null);
  if(last){
    if(last.persona&&PERSONAS[last.persona]){S.persona=last.persona;el('f-persona').value=S.persona}
    if(last.level&&LEVELS[last.level]){S.level=last.level;el('f-level').value=S.level}
    if(last.win&&WINDOWS[last.win]){S.win=last.win;el('f-window').value=S.win}
  }
  layout();
  if(last&&last.org)selectItem(last.org,last.q);else selectOrg(ORGS[0].org);

  el('org-list').addEventListener('click',function(e){
    var b=e.target.closest('[data-org]');if(b)selectOrg(b.getAttribute('data-org'));});
  el('topic-list').addEventListener('click',function(e){
    var b=e.target.closest('[data-q]');if(b)selectItem(b.getAttribute('data-org'),b.getAttribute('data-q'));});
  el('sh-body').addEventListener('toggle',onToggle,true);
  el('f-persona').addEventListener('change',function(){S.persona=this.value;renderSheet();remember()});
  el('f-level').addEventListener('change',function(){S.level=this.value;renderSheet();remember()});
  el('f-window').addEventListener('change',function(){S.win=this.value;renderSheet();remember()});
  el('f-search').addEventListener('input',function(){
    var v=this.value.trim();renderOrgs(v&&v.length<5?v:null);renderTopics(v);});
  el('btn-random').addEventListener('click',randomPick);
  el('btn-expand').addEventListener('click',function(){setAllBlk(true)});
  el('btn-collapse').addEventListener('click',function(){setAllBlk(false)});
  el('btn-max').addEventListener('click',function(){
    var on=!(S.fold.org&&S.fold.topic);
    S.fold.org=on;S.fold.topic=on;layout();saveUI();});
  el('btn-copy').addEventListener('click',function(){copy(plainScript(),'整份腳本已複製')});
  el('btn-print').addEventListener('click',function(){setAllBlk(true);window.print()});

  var heads=document.querySelectorAll('.col[data-fold] > .head'),i;
  for(i=0;i<heads.length;i++)heads[i].addEventListener('click',function(){
    var k=this.parentNode.getAttribute('data-fold');S.fold[k]=!S.fold[k];layout();saveUI();});
}
init();
})();
</script>
