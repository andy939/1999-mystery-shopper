<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1999 秘密客抽測台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#e9edf3; --surface:#ffffff; --surface-2:#f4f7fa; --surface-3:#eaeff6;
  --ink:#131c26; --ink-2:#4a5866; --ink-3:#79879a;
  --line:#d6dee8; --line-2:#c3cede;
  --accent:#1f4b8f; --accent-2:#2f6ac0; --accent-soft:#e6ecf8;
  --good:#146b52; --good-soft:#e0f0ea;
  --warn:#9c5a11; --warn-soft:#f7ecd9;
  --shadow:0 1px 2px rgba(19,28,38,.06),0 6px 18px -14px rgba(19,28,38,.3);
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --sans:"Noto Sans TC","Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
  --btn-on:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d131a; --surface:#151e27; --surface-2:#1b2530; --surface-3:#222e3a;
    --ink:#e7edf4; --ink-2:#a8b5c2; --ink-3:#7a8896;
    --line:#293643; --line-2:#354655;
    --accent:#83abec; --accent-2:#a3c2f5; --accent-soft:#1a2942;
    --good:#5cb995; --good-soft:#14312a;
    --warn:#dfa658; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -18px rgba(0,0,0,.8);
    --btn-on:#0d131a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d131a; --surface:#151e27; --surface-2:#1b2530; --surface-3:#222e3a;
  --ink:#e7edf4; --ink-2:#a8b5c2; --ink-3:#7a8896;
  --line:#293643; --line-2:#354655;
  --accent:#83abec; --accent-2:#a3c2f5; --accent-soft:#1a2942;
  --good:#5cb995; --good-soft:#14312a;
  --warn:#dfa658; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -18px rgba(0,0,0,.8);
  --btn-on:#0d131a;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh;height:100dvh;gap:10px;padding:10px 12px 12px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:7px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font-size:17px;white-space:nowrap}
.top-meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.top-meta b{color:var(--ink);font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field > label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text]{background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;
  padding:4px 8px;font-size:12.5px}
select{min-width:132px}
select:hover,input:hover{border-color:var(--accent)}
.btn{background:var(--accent);color:var(--btn-on);border:1px solid var(--accent);border-radius:5px;
  padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.mini{padding:2px 8px;font-size:11.5px;font-family:var(--mono)}
.spacer{flex:1 1 auto}
.said{font-family:var(--mono);font-size:11px;color:var(--good);align-self:flex-end;padding-bottom:4px}

.board{display:grid;gap:10px;min-height:0;align-items:stretch}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.col > .head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;user-select:none;flex:none}
.col > .head h2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col > .head:hover{background:var(--surface-3)}
.step{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  border-radius:3px;padding:1px 5px;flex:none}
.count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex:none}
.caret{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
.col.fold > .head{flex-direction:column;height:100%;border-bottom:none;padding:10px 6px;gap:10px;
  justify-content:flex-start}
.col.fold > .head h2{writing-mode:vertical-rl;white-space:nowrap;overflow:visible}
.col.fold > .head .count,.col.fold > .head .step{display:none}
.col.fold > .body{display:none}

.pick{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  padding:6px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.pick:last-child{border-bottom:none}
.pick:hover{background:var(--surface-2)}
.pick[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pick .nm{flex:1 1 auto;min-width:0}
.pick .qty{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pick .q{font-size:12.5px;line-height:1.45;display:block}
.pick .sub{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px;font-family:var(--mono)}
.hot{color:var(--warn);font-family:var(--mono);font-size:9.5px;border:1px solid var(--warn);border-radius:3px;
  padding:0 3px;white-space:nowrap;flex:none}
.empty{padding:20px 14px;color:var(--ink-3);font-size:12.5px;text-align:center}

.sh-top{padding:9px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--surface)}
.sh-top h2{font-size:15.5px;line-height:1.4;margin-bottom:5px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;
  color:var(--ink-2);background:var(--surface-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

details.blk{border-bottom:1px solid var(--line)}
details.blk > summary{list-style:none;cursor:pointer;padding:7px 14px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
details.blk > summary::-webkit-details-marker{display:none}
details.blk > summary:hover{background:var(--surface-2)}
details.blk > summary .num{color:var(--accent);font-weight:600}
details.blk > summary .tail{margin-left:auto;color:var(--ink-3);text-transform:none;letter-spacing:0}
details.blk[open] > summary{background:var(--surface-2);border-bottom:1px solid var(--line)}
details.blk > summary .mk{color:var(--ink-3)}
details.blk[open] > summary .mk{color:var(--accent)}
.blkin{padding:10px 16px 14px;max-width:78ch}

/* 逐字稿 */
.line{display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;padding:4px 0}
.who{font-family:var(--mono);font-size:10px;color:var(--btn-on);background:var(--ink-2);border-radius:3px;
  height:18px;display:grid;place-items:center;margin-top:3px;letter-spacing:.06em}
.who.me{background:var(--accent)}
.who.gap{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2)}
.say{border-left:2px solid var(--line-2);padding-left:11px;font-size:13.5px;line-height:1.7}
.line.agent .say{border-left-color:var(--good);background:var(--good-soft);border-radius:0 5px 5px 0;
  padding:3px 10px 3px 11px}
.say em{font-style:normal;color:var(--warn);font-size:12px;font-family:var(--mono)}
.mark{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--good);border:1px solid var(--good);
  border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.cite{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.5;margin-top:1px}
.watch{background:var(--surface-2);border-left:2px solid var(--accent);border-radius:0 5px 5px 0;
  padding:8px 12px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.watch b{color:var(--ink)}
ul.prep{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

/* 追問卡 */
.probe{border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin-bottom:8px;background:var(--surface-2)}
.probe .n{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:600}
.probe .ask{font-size:14px;line-height:1.6;margin:2px 0 5px}
.probe .why,.probe .ans{font-size:12px;line-height:1.6;color:var(--ink-2);display:flex;gap:7px}
.probe .why b,.probe .ans b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);
  flex:none;padding-top:2px;text-transform:uppercase}
.probe .ans span{color:var(--ink)}
.probe .kind{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line-2);border-radius:3px;
  padding:0 4px;color:var(--ink-3)}
.refs{display:flex;flex-direction:column;gap:7px}
.ref{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  padding:7px 11px;background:var(--surface-2)}
.ref .rq{font-size:13px;line-height:1.5;font-weight:500}
.ref .rm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.6}
.ref .rm a{color:var(--accent)}
.badge{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:var(--btn-on);border-radius:3px;
  padding:0 5px;margin-right:6px;vertical-align:1px;font-weight:600}
.badge.alt2{background:transparent;color:var(--ink-3);border:1px solid var(--line-2)}
/* 永遠可見的 FAQ 來源列（腳本欄底部） */
.srcbar{flex:none;border-top:1px solid var(--line);background:var(--surface-2);padding:5px 12px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;
  overflow-x:auto;white-space:nowrap}
.srcbar .lb{color:var(--ink-2);font-weight:600;flex:none}
.srcbar a{color:var(--accent);text-decoration:none;border:1px solid var(--line-2);border-radius:4px;
  padding:1px 7px;max-width:26ch;overflow:hidden;text-overflow:ellipsis;flex:none}
.srcbar a:hover{background:var(--accent-soft);border-color:var(--accent);text-decoration:underline}
.srcbar a .rl{color:var(--ink-3);margin-right:4px}
.srcbar a.main{border-color:var(--accent)}

.alt{border-left:2px solid var(--line-2);padding:2px 0 2px 11px;margin-bottom:9px}
.alt .lv{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:600}
.alt p{margin:1px 0 0;font-size:13px;line-height:1.65}
.alt .obs{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.alt.cur{border-left-color:var(--accent);background:var(--accent-soft);border-radius:0 5px 5px 0;padding-right:9px}

ol.points{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
ol.points li{font-size:12.5px;line-height:1.6}
.src{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin:10px 0 0;line-height:1.5}
.src a{color:var(--accent)}
.hidden{display:none!important}

/* 矮螢幕（含 125%／150% 縮放）：壓縮頁首與控制列，維持單畫面三欄 */
@media (max-height:760px){
  .app{gap:7px;padding:7px 9px 9px}
  header.top{padding:4px 12px;gap:12px}
  h1{font-size:15px}
  .controls{padding:5px 12px;gap:5px 12px}
  .field > label{font-size:9px}
  select,input[type=text]{padding:2px 7px;font-size:12px}
  .btn{padding:3px 10px}
  .sh-top{padding:6px 12px}
  .sh-top h2{font-size:14.5px;margin-bottom:3px}
  .blkin{padding:8px 14px 10px}
  details.blk > summary{padding:5px 12px}
}
@media (max-height:620px){
  header.top .eyebrow{display:none}
  .tagrow{display:none}
}
/* 只有真正窄或極矮的視窗才退回堆疊，腳本排最前面 */
@media (max-width:860px),(max-height:420px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;display:block;padding:9px}
  header.top,.controls{margin-bottom:9px}
  .board{grid-template-columns:1fr!important}
  .col{margin-bottom:9px}
  #col-sheet{order:-1}
  .body{max-height:52vh}
  .col.fold > .head{flex-direction:row;height:auto;padding:7px 12px}
  .col.fold > .head h2{writing-mode:horizontal-tb}
}
@media print{
  html,body{overflow:visible;height:auto}
  .app{display:block;height:auto}
  header.top,.controls,.col.rail,#col-org,#col-topic{display:none!important}
  .board{display:block}
  .col{box-shadow:none;border-color:#999;break-inside:avoid;overflow:visible}
  .body{overflow:visible;max-height:none}
  .blkin{max-width:none}
}
</style>

<style>html{color-scheme:light dark}img{max-width:100%}</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <span class="eyebrow">1999 話務品質稽核</span>
    <h1>秘密客抽測台</h1>
  </div>
  <div class="top-meta">題庫 <b id="m-faq">—</b> 題 · 局處 <b id="m-org">—</b> · 更新 <b id="m-date">—</b></div>
</header>

<div class="controls">
  <div class="field"><label for="f-persona">秘密客身分</label><select id="f-persona"></select></div>
  <div class="field"><label for="f-level">情境難度</label><select id="f-level"></select></div>
  <div class="field"><label for="f-window">撥入時段</label><select id="f-window"></select></div>
  <div class="field"><label for="f-search">全題庫搜尋</label>
    <input type="text" id="f-search" placeholder="拖吊、特休、房屋稅…" style="width:150px"></div>
  <div class="field"><label>腳本區塊</label>
    <div style="display:flex;gap:4px">
      <button class="btn mini ghost" id="btn-expand">全展開</button>
      <button class="btn mini ghost" id="btn-collapse">全收合</button>
      <button class="btn mini ghost" id="btn-max">腳本最大化</button>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="said" id="said"></span>
  <button class="btn ghost" id="btn-copy">複製腳本</button>
  <button class="btn ghost" id="btn-print">列印／PDF</button>
  <button class="btn" id="btn-random">隨機抽一題</button>
</div>

<div class="board" id="board">
  <div class="col" id="col-org" data-fold="org">
    <div class="head"><span class="caret">▾</span><span class="step">1</span><h2>局處</h2>
      <span class="count" id="org-count"></span></div>
    <div class="body" id="org-list"></div>
  </div>

  <div class="col" id="col-topic" data-fold="topic">
    <div class="head"><span class="caret">▾</span><span class="step">2</span><h2>主題</h2>
      <span class="count" id="topic-count"></span></div>
    <div class="body" id="topic-list"></div>
  </div>

  <div class="col" id="col-sheet">
    <div class="sh-top">
      <div class="eyebrow" id="sh-org">—</div>
      <h2 id="sh-q">—</h2>
      <div class="tagrow" id="sh-chips"></div>
    </div>
    <div class="body" id="sh-body"></div>
    <div class="srcbar" id="src-bar"></div>
  </div>
</div>
</div>

<script>
(function(){
"use strict";
var DATA={generated:'',source:'',totalFaq:0};
var ORGS=[],UNITS=[],LINK='';
function buildIndex(meta){
  DATA={generated:meta.generated,source:meta.source,totalFaq:meta.n};
  UNITS=meta.units;LINK=meta.linkPrefix;
  ORGS=[];
  for(var i=0;i<meta.orgs.length;i++){
    var o=meta.orgs[i],its=[];
    for(var j=0;j<o.items.length;j++){
      var r=o.items[j];
      its.push({q:r[0],u:UNITS[r[1]],d:r[2],h:r[3],sid:r[4],t:r[5],l:r[4]?LINK+r[4]:'',a:null});
    }
    ORGS.push({org:o.o,file:o.f,total:its.length,items:its,loaded:false});
  }
}
/* 答覆按局處分檔，選到才抓，抓過就留在記憶體 */
function ensureOrg(org,cb){
  if(!org)return cb();
  if(org.loaded)return cb();
  if(org._loading){org._q=org._q||[];org._q.push(cb);return}
  org._loading=true;org._q=[cb];
  fetch('data/'+org.file+'.json').then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(arr){
    for(var i=0;i<org.items.length;i++)org.items[i].a=arr[i]||'';
    org.loaded=true;org._loading=false;
    var q=org._q;org._q=null;
    for(var k=0;k<q.length;k++)q[k]();
  },function(){
    org._loading=false;
    for(var i=0;i<org.items.length;i++)if(org.items[i].a===null)org.items[i].a='';
    var q=org._q||[];org._q=null;
    for(var k=0;k<q.length;k++)q[k]();
    if(typeof toast==='function')toast('答覆載入失敗，請檢查網路後重新整理');
    else if(typeof flash==='function')flash('said','答覆載入失敗');
  });
}
/* ================= 設定 ================= */
var PERSONAS={
  citizen:{n:'一般市民',tone:'語速平穩、用詞平實，不主動透露自己懂法規',
    open:'您好，我想請問一個問題。',ack:'好，我了解了。',back:'嗯…好。'},
  senior:{n:'年長者（65+）',tone:'語速慢、會重複問、要求對方講慢一點',
    open:'小姐（先生）你好，我年紀大了，你可以講慢一點嗎？我要問一件事。',
    ack:'喔…你講的我聽了一半，可以再說一次嗎？',back:'嗯…你等一下，我拿筆抄。'},
  newcomer:{n:'新住民／口音較重',tone:'國語不流利、用短句、聽到專有名詞就說聽不懂',
    open:'你好…我中文不太好，我想問一個事情，可以嗎？',
    ack:'那個詞我不懂，可以講簡單一點嗎？',back:'好…你說。'},
  business:{n:'店家業者',tone:'語速快、要求法規依據與書面文件',
    open:'你好，我是開店做生意的，我要問規定，麻煩告訴我是依哪個法規。',
    ack:'那法規名稱跟條號給我一下。',back:'嗯，你繼續。'},
  worker:{n:'上班族（時間有限）',tone:'開場說只能講兩分鐘、要求最快方式、不想跑臨櫃',
    open:'你好，我在上班只能講兩分鐘，麻煩幫我用最快的方式講重點。',

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(n){return Number(n||0).toLocaleString('en-US')}
function shortQ(q){q=String(q).replace(/^請問|^想問/,'');return q.length>26?q.slice(0,26)+'…':q}

/* ================= 內容產生 ================= */
function sentences(a){
  /* 不用 lookbehind，iOS 16.4 之前的 Safari 才不會語法錯誤 */
  var src=String(a||'').replace(/。/g,'。\n')
    .replace(/([一二三四五六七八九十]、)/g,'\n$1')
    .replace(/(（[一二三四五六七八九十\d]+）)/g,'\n$1')
    .replace(/(\(\d+\))/g,'\n$1');
  var raw=src.split(/\n+/);
  var out=[],seen={};
  for(var i=0;i<raw.length;i++){
    var t=raw[i].replace(/\s+/g,' ').trim().replace(/^[、,，。]+/,'');
    if(t.length<8||seen[t])continue;seen[t]=1;out.push(t);
  }
  if(!out.length&&String(a||'').trim())out.push(String(a).trim());
  return out;
}
function keyPoints(a){
  var s=sentences(a),out=[];
  for(var i=0;i<s.length&&out.length<8;i++)out.push(s[i].length>120?s[i].slice(0,120)+'…':s[i]);
  return out;
}
function trim(t,n){t=String(t).replace(/^[一二三四五六七八九十]、/,'').replace(/^（[^）]{1,4}）/,'')
  .replace(/^\(\d+\)/,'').trim();return t.length>n?t.slice(0,n)+'…':t}
/* 同局處、同主題的相鄰 FAQ（延伸追問的題源） */
function snip(s,rx,n){
  rx.lastIndex=0;
  var m=rx.exec(s);
  if(!m)return trim(s,n);
  var st=Math.max(0,m.index-40),en=Math.min(s.length,st+n);
  return (st>0?'…':'')+s.slice(st,en).trim()+(en<s.length?'…':'');
}
function relatedFor(item){
  var out=[],i,it;
  if(!S.org)return out;
  for(i=0;i<S.org.items.length;i++){
    it=S.org.items[i];
    if(it.q===item.q)continue;
    if(it.t===item.t)out.push(it);
    if(out.length>=3)break;
  }
  for(i=0;i<S.org.items.length&&out.length<3;i++){
    it=S.org.items[i];
    if(it.q===item.q||out.indexOf(it)>=0)continue;
    out.push(it);
  }
  return out;
}
function cite(f){
  return f.u+'〈'+(f.q.length>20?f.q.slice(0,20)+'…':f.q)+'〉'+(f.d?' '+f.d:'')+(f.sid?' #'+f.sid.slice(0,8):'');
}
/* 追問：命中規則 + 從標準答案挑出對應句當「正解」 */
function probesFor(item){
  var txt=item.q+' '+item.a,sn=sentences(item.a),out=[],i,j;
  for(i=0;i<PROBES.length&&out.length<4;i++){
    if(!PROBES[i][0].test(txt))continue;
    var ans='';
    for(j=0;j<sn.length;j++)if(PROBES[i][0].test(sn[j])){ans=snip(sn[j],PROBES[i][0],120);break}
    out.push({q:PROBES[i][1],why:PROBES[i][2],ans:ans,src:item,kind:'主題'});
  }
  if(out.length<3)out.push({q:'這件事如果我不方便自己來辦，還有沒有其他管道？',
    why:'替代管道是否主動提供',ans:'',src:item,kind:'主題'});
  var rel=relatedFor(item);
  for(i=0;i<rel.length&&i<2;i++){
    var rs=sentences(rel[i].a);
    out.push({q:'另外順便問一下，'+rel[i].q,why:'延伸題：同業務相鄰知識，測知識廣度與是否需再轉接',
      ans:rs.length?trim(rs[0],120):'',src:rel[i],kind:'延伸'});
  }
  out.push({q:TAIL_PROBES[0][0],why:TAIL_PROBES[0][1],ans:'',src:null,kind:'服務行為'});
  out.push({q:TAIL_PROBES[1][0],why:TAIL_PROBES[1][1],ans:'',src:null,kind:'服務行為'});
  return out;
}
function crossOrgFor(item){
  var pool=[],i,j;
  for(i=0;i<ORGS.length;i++){
    if(ORGS[i].org===S.org.org)continue;
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].t===item.t){pool.push(ORGS[i].org);break}
  }
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:'區公所';
}
/* 開場（依難度） */
function openingLines(item,level){
  var p=PERSONAS[S.persona],lines=[{who:'客',t:p.open}];

      '這樣，<em>（停頓 2 秒，不要補充細節）</em>你聽得懂我的意思嗎？'});
  }else if(level==='L3'){
    lines.push({who:'客',t:'我上個禮拜就打過一次 1999 了，到現在還是沒人跟我講清楚。<em>（語氣不耐但不辱罵）</em>'});
    lines.push({who:'客',t:'我要問的是：'+item.q+' 這到底是誰在管？'});
  }else{
    lines.push({who:'客',t:'我有兩件事要問。第一，'+item.q});
    lines.push({who:'客',t:'第二，我聽說「'+crossOrgFor(item)+'」那邊也要辦，是真的嗎？'+
      '如果不是你們管的，麻煩幫我轉正確的單位。'});
    lines.push({who:'客',t:'還有，'+(CROSS_CENTRAL[item.t]||'這件事是不是要找中央？')+
      '，你們也可以查嗎？<em>（測知識邊界，不要提示答案）</em>'});
  }
  return lines;
}
/* 完整正常對話模擬：專員台詞由標準答案組出 */
function dialogue(item){
  var p=PERSONAS[S.persona],kp=keyPoints(item.a),pr=probesFor(item),L=[],i;
  L.push({who:'員',t:'您好，1999 臺北市民當家熱線，我是專員 ○○○，很高興為您服務。',
    mark:'開場：問候＋單位＋代號'});
  L.push({who:'客',t:p.open});
  var ol=openingLines(item,S.level);
  for(i=1;i<ol.length;i++)L.push({who:'客',t:ol[i].t});
  L.push({who:'員',t:'好的，我跟您確認一下，您是想問「'+shortQ(item.q)+
    '」這部分，對嗎？方便先跟您確認一下時間跟地點嗎？',mark:'需求確認：複述＋補問條件'});
  L.push({who:'客',t:'對，就是這個。'+p.back});
  var used=Math.min(kp.length,4);
  for(i=0;i<used;i++)L.push({who:'員',t:CONNECT[i]+trim(kp[i],120),
    mark:i===0?'答詢：對照標準答案要點':'',cite:'本題 FAQ 要點 '+(i+1)+'／'+cite(item)});
  L.push({who:'客',t:pr[0].q,mark:'追問 1'});
  L.push({who:'員',t:pr[0].ans?pr[0].ans:'（此題標準答案未載明，觀察專員是否誠實說明「須再確認並回電」，而非自行推測）',
    mark:pr[0].ans?'應答出這一段':'觀察：不確定時的處理',
    cite:pr[0].ans?cite(pr[0].src):''});
  if(pr[1]){
    L.push({who:'客',t:pr[1].q,mark:'追問 2'});
    L.push({who:'員',t:pr[1].ans?pr[1].ans:'（同上，觀察是否轉業管單位或承諾回電）',
      mark:pr[1].ans?'應答出這一段':'觀察：轉介與回電承諾',
      cite:pr[1].ans?cite(pr[1].src):''});
  }
  L.push({who:'客',t:p.ack,mark:'測耐心／換句話說'});
  L.push({who:'員',t:'沒問題，我再幫您整理一次重點：'+trim(kp[0],60)+
    (kp[1]?'；還有'+trim(kp[1],60):'')+'。',mark:'摘要複述'});
  if(kp.length>used)L.push({who:'員',t:'另外還有一項細節：'+trim(kp[used],110),mark:'完整度'});
  L.push({who:'客',t:'好，我大概懂了。<em>（不要主動道謝，看專員是否自己問「還有其他需要嗎」）</em>'});
  L.push({who:'員',t:'請問還有其他需要為您服務的地方嗎？',mark:'結案確認'});
  L.push({who:'客',t:'沒有了，謝謝。'});
  L.push({who:'員',t:'謝謝您的來電，祝您順心，再見。<em>（記錄是否等民眾先掛機）</em>',mark:'結束語'});
  return L;
}

  s='<p style="margin:0 0 9px;font-size:12.5px;color:var(--ink-2)">同一題可換情境再撥一次，'+
    '測不同能力。目前選的是 <b>'+esc(L.n)+'</b>。</p>';
  var keys=['L1','L2','L3','L4'];
  for(i=0;i<keys.length;i++){
    var lv=keys[i],ol=openingLines(item,lv),t='';
    for(var j=1;j<ol.length;j++)t+=(j>1?'<br>':'')+ol[j].t;
    s+='<div class="alt'+(lv===S.level?' cur':'')+'"><span class="lv">'+esc(LEVELS[lv].n)+'</span>'+
      '<p>'+t+'</p><p class="obs">→ '+esc(LEVELS[lv].test)+'</p></div>';
  }
  h+=blk('04','情境變化（換難度的開場替換句）','4 級',s);

  s='<ol class="points">';
  for(i=0;i<kp.length;i++)s+='<li>'+esc(kp[i])+'</li>';
  s+='</ol><p class="src">來源：'+esc(cite(item))+
    (item.l?' · <a href="'+esc(item.l)+'" target="_blank" rel="noopener">原始問答頁</a>':'')+'</p>';
  h+=blk('05','標準答案全要點（對照用）',kp.length+' 點',s);

  var rel=relatedFor(item),refs=[{f:item,use:'主問句、對話模擬中專員的答覆內容、追問 1–'+
    (pr.length>2?'2':'1')+' 的正解、標準答案要點'}];
  for(i=0;i<rel.length&&i<2;i++)refs.push({f:rel[i],use:'延伸追問（測同業務相鄰知識與轉接判斷）'});
  for(i=2;i<rel.length;i++)refs.push({f:rel[i],use:'備用題（同局處相鄰題，可換題再撥一次）'});
  s='<p style="margin:0 0 9px;font-size:12.5px;color:var(--ink-2)">本腳本每一句專員台詞都來自下列 FAQ，'+
    '沒有自行編寫的答案。稽核時如專員說法與這些條目不同，即為落差。</p><div class="refs">';
  for(i=0;i<refs.length;i++){
    var f=refs[i].f;
    s+='<div class="ref"><div class="rq">'+(i===0?'<span class="badge">主題</span>':
      '<span class="badge alt2">參考</span>')+esc(f.q)+'</div>'+
      '<div class="rm">'+esc(f.u)+' · 發布 '+esc(f.d||'—')+' · 點閱 '+num(f.h)+
      (f.sid?' · ID '+esc(f.sid.slice(0,8)):'')+'</div>'+
      '<div class="rm">用途：'+esc(refs[i].use)+'</div>'+
      (f.l?'<div class="rm"><a href="'+esc(f.l)+'" target="_blank" rel="noopener">開啟市府原始問答頁</a></div>':'')+
      '</div>';
  }
  s+='</div><p class="src">題庫檔：'+esc(DATA.source)+'（'+esc(DATA.generated)+' 匯出，共 '+
    num(DATA.totalFaq)+' 題）</p>';
  h+=blk('06','參考 FAQ 來源（可點連結核對原文）',refs.length+' 則',s);

  el('sh-body').innerHTML=h;
  el('sh-body').scrollTop=0;

  /* 永遠可見的來源列 */
  s='<span class="lb">參考 FAQ 來源</span>';
  for(i=0;i<refs.length;i++){
    var rf=refs[i].f,role=i===0?'主題':(i<3?'延伸':'備用');
    s+=rf.l?('<a class="'+(i===0?'main':'')+'" href="'+esc(rf.l)+'" target="_blank" rel="noopener" title="'+
      esc(rf.q+'｜'+rf.u+'｜發布 '+(rf.d||'—')+'｜點閱 '+num(rf.h)+'｜ID '+rf.sid+'｜用途：'+refs[i].use)+
      '"><span class="rl">'+role+'</span>'+esc(rf.q)+'</a>'):
      ('<span title="'+esc(rf.q)+'">'+role+'（無連結）</span>');
  }
  s+='<span style="flex:none">· 題庫 '+esc(DATA.source)+' '+esc(DATA.generated)+'</span>';
  el('src-bar').innerHTML=s;
}
function onToggle(e){
  var d=e.target;
  if(d&&d.tagName==='DETAILS'&&d.getAttribute('data-blk')){
    S.openBlk[d.getAttribute('data-blk')]=d.open;saveUI();
  }
}
function setAllBlk(open){
  var ds=el('sh-body').querySelectorAll('details.blk'),i;
  for(i=0;i<ds.length;i++){ds[i].open=open;S.openBlk[ds[i].getAttribute('data-blk')]=open}
  saveUI();
}

/* ================= 複製／列印 ================= */
function unem(t){return String(t).replace(/<em>/g,'').replace(/<\/em>/g,'')}
function plainScript(){
  if(!S.item)return '';
  var item=S.item,p=PERSONAS[S.persona],L=LEVELS[S.level],W=WINDOWS[S.win],i;
  var out=['1999 秘密客測試腳本','局處：'+S.org.org+'（'+item.u+'）','題目：'+item.q,
    '情境：'+L.n+'｜身分：'+p.n+'｜時段：'+W.n,'',
    '【撥號前準備】','・'+W.hint,'・身分設定：'+p.tone,'・記錄撥通、語音選單結束、真人應答三個時間點',
    '・準備假地址，不提供真實個資','',
    '【完整對話模擬（正常情境）】※「員」為由標準答案組成的正解版，用來比對落差'];
  var dl=dialogue(item);
  for(i=0;i<dl.length;i++){
    out.push(dl[i].who+'：'+unem(dl[i].t)+(dl[i].mark?'　〔'+dl[i].mark+'〕':''));
    if(dl[i].cite)out.push('      ↳ 依據：'+dl[i].cite);
  }
  out.push('','要測出什麼：'+L.test,'情境設計：'+L.design,'','【追問清單】');
  var pr=probesFor(item);
  for(i=0;i<pr.length;i++){
    out.push((i+1)+'. 「'+pr[i].q+'」（'+pr[i].kind+'）');
    out.push('   測什麼：'+pr[i].why);
    out.push('   正解應含：'+(pr[i].ans||'標準答案未載明——聽專員是否誠實說「確認後回電」'));
    out.push('   依據 FAQ：'+(pr[i].src?cite(pr[i].src):'無（純服務行為觀察題）'));
  }
  out.push('','【情境變化：換難度的開場替換句】');
  var keys=['L1','L2','L3','L4'];
  for(i=0;i<keys.length;i++){
    var ol=openingLines(item,keys[i]);
    out.push('◆ '+LEVELS[keys[i]].n+'（'+LEVELS[keys[i]].test+'）');
    for(var j=1;j<ol.length;j++)out.push('   客：'+unem(ol[j].t));
  }
  out.push('','【標準答案全要點（對照用）】');
  var kp=keyPoints(item.a);
  for(i=0;i<kp.length;i++)out.push((i+1)+'. '+kp[i]);
  out.push('','【本腳本參考的 FAQ 出處】');
  out.push('・主題：'+cite(item)+(item.l?'\n  '+item.l:''));
  var rel=relatedFor(item);
  for(i=0;i<rel.length;i++)
    out.push('・'+(i<2?'延伸追問':'備用題')+'：'+cite(rel[i])+(rel[i].l?'\n  '+rel[i].l:''));
  out.push('','題庫檔：'+DATA.source+'（'+DATA.generated+' 匯出，共 '+DATA.totalFaq+' 題）');
  return out.join('\n');
}
function copy(text,msg){
  function done(){flash('said',msg)}
  function fb(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){flash('said','複製失敗')}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fb);
  else fb();
}
function flash(id,msg){var e=el(id);if(!e)return;e.textContent=msg;setTimeout(function(){e.textContent=''},2600)}

/* ================= 版面 ================= */
function layout(){
  el('board').style.gridTemplateColumns=[S.fold.org?'32px':'164px',
    S.fold.topic?'32px':'240px','minmax(380px,1fr)'].join(' ');
  var mb=el('btn-max');
  if(mb)mb.textContent=(S.fold.org&&S.fold.topic)?'還原選單':'腳本最大化';
  var cs=[['col-org','org'],['col-topic','topic']],i;
  for(i=0;i<cs.length;i++){
    var c=el(cs[i][0]);
    c.classList.toggle('fold',S.fold[cs[i][1]]);
    c.classList.toggle('rail',S.fold[cs[i][1]]);
    var ct=c.querySelector('.caret');if(ct)ct.textContent=S.fold[cs[i][1]]?'▸':'▾';
  }
}
function saveUI(){lsSet(LSU,{fold:S.fold,openBlk:S.openBlk})}
function remember(){lsSet(LSL,{org:S.org?S.org.org:null,q:S.item?S.item.q:null,
  persona:S.persona,level:S.level,win:S.win})}

/* ================= 選題 ================= */
function selectOrg(name){
  for(var i=0;i<ORGS.length;i++)if(ORGS[i].org===name){S.org=ORGS[i];break}
  renderOrgs(null);renderTopics('');
  ensureOrg(S.org,function(){S.item=S.org.items[0];
    renderTopics(el('f-search').value.trim());renderSheet();remember()});
}
function selectItem(orgName,q){
  var found=null,i,j;
  for(i=0;i<ORGS.length;i++)if(ORGS[i].org===orgName){
    S.org=ORGS[i];
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].q===q){found=ORGS[i].items[j];break}
    break;
  }
  if(!S.org)S.org=ORGS[0];
  var want=found||S.org.items[0];
  renderOrgs(null);
  ensureOrg(S.org,function(){S.item=want;
    renderTopics(el('f-search').value.trim());renderSheet();remember()});
}
function randomPick(){
  var wsum=0,i;
  for(i=0;i<ORGS.length;i++)wsum+=ORGS[i].total;
  var r=Math.random()*wsum,acc=0,org=ORGS[0];
  for(i=0;i<ORGS.length;i++){acc+=ORGS[i].total;if(r<=acc){org=ORGS[i];break}}
  var it=org.items[Math.floor(Math.random()*org.items.length)];
  var lv=['L1','L1','L1','L2','L2','L2','L2','L3','L3','L4'],
      pk=Object.keys(PERSONAS),wk=Object.keys(WINDOWS);
  S.level=lv[Math.floor(Math.random()*lv.length)];
  S.persona=pk[Math.floor(Math.random()*pk.length)];
  S.win=wk[Math.floor(Math.random()*wk.length)];
  el('f-level').value=S.level;el('f-persona').value=S.persona;el('f-window').value=S.win;
  el('f-search').value='';
  selectItem(org.org,it.q);
  flash('said','抽出：'+org.org+' · '+S.level);
}

/* ================= init ================= */
function fillSelect(id,obj,val){
  var s=el(id),h='',k;
  for(k in obj)h+='<option value="'+k+'">'+esc(obj[k].n)+'</option>';
  s.innerHTML=h;s.value=val;
}
function init(){
  el('m-faq').textContent=num(DATA.totalFaq);
  el('m-org').textContent=ORGS.length;
  el('m-date').textContent=DATA.generated;
  fillSelect('f-persona',PERSONAS,S.persona);
  fillSelect('f-level',LEVELS,S.level);
  fillSelect('f-window',WINDOWS,S.win);

  var ui=lsGet(LSU,null);
  if(ui){if(ui.fold)S.fold=ui.fold;if(ui.openBlk)S.openBlk=ui.openBlk}
  var last=lsGet(LSL,null);
  if(last){
    if(last.persona&&PERSONAS[last.persona]){S.persona=last.persona;el('f-persona').value=S.persona}
    if(last.level&&LEVELS[last.level]){S.level=last.level;el('f-level').value=S.level}
    if(last.win&&WINDOWS[last.win]){S.win=last.win;el('f-window').value=S.win}
  }
  layout();
  if(last&&last.org)selectItem(last.org,last.q);else selectOrg(ORGS[0].org);

  el('org-list').addEventListener('click',function(e){
    var b=e.target.closest('[data-org]');if(b)selectOrg(b.getAttribute('data-org'));});
  el('topic-list').addEventListener('click',function(e){
    var b=e.target.closest('[data-q]');if(b)selectItem(b.getAttribute('data-org'),b.getAttribute('data-q'));});
  el('sh-body').addEventListener('toggle',onToggle,true);
  el('f-persona').addEventListener('change',function(){S.persona=this.value;renderSheet();remember()});
  el('f-level').addEventListener('change',function(){S.level=this.value;renderSheet();remember()});
  el('f-window').addEventListener('change',function(){S.win=this.value;renderSheet();remember()});
  el('f-search').addEventListener('input',function(){
    var v=this.value.trim();renderOrgs(v&&v.length<5?v:null);renderTopics(v);});
  el('btn-random').addEventListener('click',randomPick);
  el('btn-expand').addEventListener('click',function(){setAllBlk(true)});
  el('btn-collapse').addEventListener('click',function(){setAllBlk(false)});
  el('btn-max').addEventListener('click',function(){
    var on=!(S.fold.org&&S.fold.topic);
    S.fold.org=on;S.fold.topic=on;layout();saveUI();});
  el('btn-copy').addEventListener('click',function(){copy(plainScript(),'整份腳本已複製')});
  el('btn-print').addEventListener('click',function(){setAllBlk(true);window.print()});

  var heads=document.querySelectorAll('.col[data-fold] > .head'),i;
  for(i=0;i<heads.length;i++)heads[i].addEventListener('click',function(){
    var k=this.parentNode.getAttribute('data-fold');S.fold[k]=!S.fold[k];layout();saveUI();});
}
function boot(){
  fetch('data/index.json').then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(meta){
    buildIndex(meta);
    init();
  },function(){
    var t=document.querySelector('.bar h1')||document.querySelector('.sh-top h2');
    if(t)t.textContent='題庫載入失敗，請確認網路後重新整理';
  });
}
boot();
})();
</script>
