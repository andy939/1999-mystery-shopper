828&sms=87415A8B9CE81B16&s=387942FA8BF1E217","d":"2008-06-23","sid":"387942FA"},{"q":"如何申請田園城市有機肥料？領取地點在哪?","a":"臺北市民可於每季開放申請期間，將以新聞稿及臉書通知，並透過「 田園銀行網路平台 」線上申請，每季每人限領取1份，滿額為止。 領取地點：如附件 申請及發放時間可密切關注 臺北市環保局Facebook粉絲專頁 或 田園城市Facebook粉絲專頁 。 如有相關問題請洽臺北市民當家熱線免付費服務電話1999轉7291。","u":"臺北市政府環境保護局廢棄物處理管理科","h":64343,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8ECA639A903AA5B8","d":"2021-02-04","sid":"8ECA639A"},{"q":"家戶欲丟棄廢棄機油及液態油漆，該如何處理？","a":"家戶產生之廢潤滑油應以容器盛裝蓋緊，並標示油品後交由機車行、汽車維修廠及加油站等所設置之廢潤滑油回收站或於周一、二、四、五、六清運日，按本局定時、定點時地免費交清潔隊進行回收。\n另有關廢棄液態油漆，請民眾將廢棄油漆倒出用報紙包覆後，用專用垃圾袋盛裝，循一般廢棄物交付線上垃圾車，油漆罐則交由本局資源回收車回收。","u":"臺北市政府環境保護局環境清潔管理科","h":63875,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D592DA69D718FD3F","d":"2021-02-25","sid":"D592DA69"},{"q":"「室內空氣品質管理法」所指之室內空氣污染物有哪些?目前標準為何?","a":"(一)室內空氣污染物係指室內空氣中常態逸散，經長期性暴露足以直接或間接妨害國民健康或生活環境之物質。包括二氧化碳、一氧化碳、甲醛、總揮發性有機化合物、細菌、真菌、粒徑小於等於十微米之懸浮微粒（PM10）、粒徑小於等於二.五微米之懸浮微粒（PM2.5）、臭氧等9種。\n(二)依據環保署101年11月23日公告之「室內空氣品質標準」，9項室內空氣品質如下：二氧化碳(CO2)為1000ppm（八小時平均）、一氧化碳(CO)為9ppm（八小時平均）、甲醛(HCHO)為0.08ppm（一小時平均）、總揮發性有機化合物(TVOC，包含：十二種揮發性有機物之總和)為0.56ppm（一小時平均）、細菌為1500 CFU/m3（菌落數/立方公尺）（最高值）、真菌為1000CFU/m3（菌落數/立方公尺）（最高值）（但真菌濃度室內外比值小於等於1.3者不在此限）、PM10為75 μg/m3（二十四小時平均）、PM2.5為35μg/m3（二十四小時平均）、臭氧（O3）為0.06ppm（八小時平均）。","u":"臺北市政府環境保護局空污噪音防制科","h":62153,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C6AC8143DC6A4257","d":"2012-11-23","sid":"C6AC8143"},{"q":"機車多久要接受排氣定期檢驗及檢驗時間？","a":"出廠滿5年以上之機車，應每年實施排氣定期檢驗1次，每年檢驗時間為行車執照之原發照月份前、後1個月（共3個月時間） 。","u":"臺北市政府環境保護局空污噪音防制科","h":60091,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=02300EA625FA51F8","d":"2008-06-23","sid":"02300EA6"},{"q":"環境保護局廢棄物處理場內設置之「回饋設施山豬窟游泳池館」開放時間？","a":"一、 場館開放日為每星期二至星期日，每週一及國定假日為休館日【元旦(1月1日)、和平紀念日(2月28日)及雙十節(10月10日)除外】；如星期一遇國定假日，該日及次日均停止開放，農曆春節期間假期之開放時間另行公告。\n二、開放時間： 溫水游泳池及附屬設施：\n第一場次，售票時間05：20~07：00，進場時間05：30，停泳時間07：20 ，清場時間07：30 第二場次，售票時間08：20~10：30，進場時間08：30，停泳時間11：15 ，清場時間11：30 第三場次，售票時間13：20~15：30，進場時間13：30，停泳時間16：15 ，清場時間16：30 第四場次，售票時間17：50~20：00，進場時間18：00，停泳時間20：40 ，清場時間21：00\n健身房及舞蹈室： 第一場次08：30~11：30 第二場次13：30~16：30 第三場次18：00~21：00\n山豬窟游泳池館電話：(02)2654-7412、2654-8933","u":"臺北市政府環境保護局廢棄物處理場","h":57670,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3953D24D45FF8CEA","d":"2008-10-24","sid":"3953D24D"}]},{"org":"產業發展局","total":364,"items":[{"q":"請問電器承裝業分為幾等？應具備那些資格？","a":"電器承裝業分甲專、甲、乙、丙三級，其設立登記應具備資格及承裝工程範圍如下：\n一、甲專級： (一)資本額：新臺幣一千萬元以上資本額及合法固定營業場所。 (二)從業人員資格：\n(三)具有符合下列規格之設備：\n二、甲級： (一)資本額：新臺幣二百萬元以上資本額及合法固定營業場所。 (二)從業人員資格：\n(三)承裝工程範圍：承裝所有電業供電設備及用戶用電設備裝設維修工程。\n三、乙級： (一)資本額：新臺幣一百萬元以上及合法固定營業場所。 (二)從業人員：\n(三)承裝範圍：承裝電業低壓供電設備及用戶低壓用電設備裝設維修工程。\n四、丙級：\n(一)資本額：新臺幣五十萬元以上及合法固定營業場所。 (二)從業人員： 具有下列資格以上者1名(電機技師；丙級以上之室內配線、工業配線、配電線路裝修、配電電纜裝修、變壓器裝修、變電設備裝修或用電設備檢驗職類技術士；依法考驗合格取得證書之甲種或乙種電匠)。 (三)承裝工程範圍：承裝低壓電燈用戶用電設備裝設維修工程。","u":"臺北市政府產業發展局公用事業科","h":91465,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D7AABD1A90DE2C2B","d":"2011-03-09","sid":"D7AABD1A"},{"q":"請問天然瓦斯基本費規定？","a":"經濟部能源局為促進天然瓦斯價格制度合理化(使用者付費)及能源有效利用，自95年1月1日起取消基本度，改採基本費，用戶繳交之天然瓦斯費用為每月定額之基本費加上按實際使用度數計收之從量費。基本費之設計，係考量用戶申請使用天然瓦斯後，瓦斯公司需投入每個用戶服務作業成本以及表外管汰換作業成本，該等費用不會因用戶有無使用，或使用天然瓦斯之多寡而有所改變，亦不因天然瓦斯售價之漲跌而有不同，亦即基本費係反映用戶端之固定成本，避免該等成本轉嫁其他用戶負擔，故經濟部核定之基本費並無扣抵度數。 經濟部核定之基本費為全國一致，多數用戶使用之5燈以下機械表基本費為每月60元，5燈以下微電腦瓦斯表基本費為每月100元。 案例說明：位於信義區，設置微電腦瓦斯表之一般家庭用戶1家4口，本期(2個月)天然瓦斯共使用40度，應付費用計算如下： 基本費=每月100元* 2個月 = 200元 從量費=40度*每度10.01元 = 400元 本期應繳費用合計為200+400= 600元","u":"臺北市政府產業發展局公用事業科","h":79743,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CC5AA133BE1CAAF1","d":"2013-06-04","sid":"CC5AA133"},{"q":"建國花市地址及營業時間為何？","a":"地址：信義路與仁愛路間建國高架橋下橋段\n營業時間：週六：早上 9 : 00 到下午 6 : 30 / 週日：早上 9 : 00 到下午 6 : 00\n建國假日花市網址： https://www.fafa.org.tw/\n承辦人：臺北市政府產業發展局農業發展科 陳南柏\n洽詢電話：1999(外縣市02-27208889)轉6603，將有專人為您服務","u":"臺北市政府產業發展局農業發展科","h":63940,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D15EE7E1249BCB51","d":"2023-12-30","sid":"D15EE7E1"},{"q":"請問天然瓦斯費繳費及違約金規定？","a":"目前本市4家瓦斯公司繳費管道有至瓦斯公司或服務所臨櫃繳納、委託銀行、郵局自動轉帳扣繳及超商代收等多元化繳費管道，繳費期限為14天。至於寬限期、違約金收取標準及最低加計金額依主管機關核定瓦斯公司營業章程規定計算如下： (1)家庭用戶：逾期在七日以內者，免收違約金；逾七日起至第十四日止依應繳天然氣費加收百分之一之違約金；逾十四日者，依應繳天然氣費加收百分之二之違約金；應繳天然氣費達二期（含當期）以上且經催收程序仍未繳納完畢者，依應繳天然氣費加收百分之四之違約金，至繳納完畢為止。加收違約金之金額未滿一元者按一元計。 (2)商業及服務業用戶：逾期在二日以內者，免收違約金；逾二日起至第十四日止依應繳天然氣費加收百分之一之違約金；逾十四日者，依應繳天然氣費加收百分之二之違約金；應繳天然氣費達二期（含當期）以上且經催收程序仍未繳納完畢者，依應繳天然氣費加收百分之四之違約金，至繳納完畢為止。加收違約金之金額未滿五元者按五元計。 因應都會工作忙碌生活型態及保障消費權益，用戶可辦理瓦斯費委託金融機構扣繳轉帳，對無法辦理扣繳轉帳而因正當理由致延遲繳費時，可逕洽轄區瓦斯公司衡酌彈性處理。本市4家瓦斯公司聯繫電話如下： 大台北區瓦斯股份有限公司：27684999 陽明山瓦斯股份有限公司：28948686 欣欣天然氣股份有限公司：29217811 欣湖天然氣股份有限公司：27913491","u":"臺北市政府產業發展局公用事業科","h":45502,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2A0A0F9AED2BEDEC","d":"2013-06-04","sid":"2A0A0F9A"},{"q":"請問申請裝置天然瓦斯之費用及規定？","a":"用戶申請瓦斯裝置新設或變更，依經濟部100年8月1日以經能字第10004604570號令訂定發布「公用天然氣事業用戶管線設備裝置計費準則」規定，本市4家瓦斯公司得向申裝用戶收取天然瓦斯管線裝置費包括裝表通氣費（5燈以下家庭用戶200元、商業用戶、服務業用戶500元）、估價設計費（5燈以下家庭用戶100元、商業用戶、服務業用戶500元）、表內管審圖費（260元）（僅向公用天然氣導管承裝業者收取）、表內管檢驗費（260元）（僅向公用天然氣導管承裝業者收取）、本支管補助費及表內、外管工料費等，其中表內、外管工料費則依據經濟部核定之裝置業務收費作業手冊辦理，計費方式依裝置工程需求之管線長度、管件數量、施工方法、選用材料、管線設備等計算之。 至於本支管補助費部分，需同時符合下列規定，並經天然氣事業與用戶書面約定者，本支管之敷設費用，得由用戶自行負擔部分之裝置成本。 (1)申請裝設之所在地區尚無既設之本支管。 (2)本支管敷設成本經合理估計於耐用年限內無法經由從量費回收。 (3)應備本支管補助費之計費方式與金額，以書面方式交付管線裝置申請人或用戶確認。 另外裝設之位置與管線經過地，申請人應先取得所有權人或其他利害關係人之同意，瓦斯公司始得施作。","u":"臺北市政府產業發展局公用事業科","h":38561,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4E967EB719A3A5D1","d":"2013-06-04","sid":"4E967EB7"},{"q":"節能標章產品何處購買？","a":"節能標章是「經濟部能源局」所推動的認證制度，產品標示有標章(其中心形及手的圖案意指用心節約、實踐省油省氣省電，紅色火苗代表可燃油氣，電源插座代表生活用電，倡導國人響應節能從生活中的點滴做起)即為節能標章產品。\n最新節能標章產品及相關資訊查詢，可至 經濟部能源局節能標章網站 查詢，以保障自身權益。","u":"臺北市政府產業發展局公用事業科","h":36705,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D855C4431CDB17E7","d":"2008-09-22","sid":"D855C443"},{"q":"請問擔任電氣技術人員之資格為何？","a":"一、初級電氣技術人員： (一)乙種電匠考驗合格。 (二)室內配線、工業配線、配電線路裝修、變壓器裝修或變電設備裝修職類或用電設備檢驗職類丙級技術士技能檢定合格。 (三)具有高級電氣技術人員或中級電氣技術人員任用資格。 二、中級電氣技術人員： (一)甲種電匠考驗合格。 (二)室內配線、工業配線、配電線路裝修、變壓器裝修或變電設備裝修職類或用電設備檢驗職類乙級技術士技能檢定合格。 (三)具有高級電氣技術人員任用資格。 三、高級電氣技術人員： (一)具有電機技師資格。 (二)室內配線、工業配線、配電線路裝修、變壓器裝修職類或用電設備檢驗職類甲級技術士技能檢定合格等。","u":"臺北市政府產業發展局公用事業科","h":34623,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2C573AC30BEE7260","d":"2011-03-09","sid":"2C573AC3"},{"q":"瓦斯公司如何抄表？","a":"瓦斯公司於每月或隔月依規定日期派員至用戶處所查抄計量表度數，並據以計算用戶該次應繳天然瓦斯費。另瓦斯公司依用戶性質分為家庭、商業及服務業用戶，家庭用戶每2個月抄表1次，商業及服務業用戶每1個月抄表1次，其抄表方式說明如下：","u":"臺北市政府產業發展局公用事業科","h":32015,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=10959BC665C646FF","d":"2013-06-04","sid":"10959BC6"},{"q":"美國USDA的有機認證標準與臺灣CAS Organic的有機認證標準是否相同？","a":"否，在臺灣的有機農產品中的有機成分必須在95%以上才可以標示臺灣的CAS Organic標章，而美國的USDA標章依照產品的有機成分比例不同，分成四種不同的標示方式：\n1.有機成分比例100%：可貼上以綠白色為主的USDA有機標章，另在外包裝上可加註「100% organic」\n2.有機成分比例95%以上：可貼上以綠白色為主的USDA有機標章，在外包裝僅可標明為「organic」的產品，並不能標榜為純有機產品。\n3.有機成分比例70%~95%：可註明「由有機XXX製造(XXX為農產品名稱，如小麥、葡萄、……，原文為Made with……)」，外包裝不得貼上USDA有機標章。\n4.有機成分低於70%：只能於成份部份標示有機，品名及外包裝均不得標示有機及使用USDA標章。\n目前臺灣的有機農產品，有機成份須佔95%以上，因此有機成份70~95%美國USDA有機認證的農產品在臺灣是不得以有機名義販售的，亦不得於包裝上標示任何有機文字宣稱。","u":"臺北市政府產業發展局農業發展科","h":30378,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9EDE7BC866024EFC","d":"2012-02-03","sid":"9EDE7BC8"},{"q":"【青年創業融資貸款】當申請本貸款後，若開店未滿5年就停業，是否能延長貸款償還期限？那利息又該如何計算?","a":"(一)自114年1月1日起，臺北市青年創業融資貸款由臺北市政府青年局受理申請；若欲了解青年創業融資貸款相關資訊的市民朋友們，請洽青年局官網( https://reurl.cc/ZZ44eV )或青年局窗口諮詢電話：02-2395-8567。\n(二)於113年12月31日前已向臺北市政府產業發展局提出申請之案件，仍請洽產業發展局原承辦窗口辦理及查詢相關事宜，爰依申請當時之「臺北市青年創業融資貸款實施要點」說明如下：\n1.本貸款之貸款年限是由本貸款審查小組進行審查後核定，故事業結束營業後，仍應依原核定年限還款；若未按時繳款，承貸金融機構-玉山銀行或台北富邦銀行將採取訴訟程序向貸款人追繳未還款項。\n2.依臺北市青年創業融資貸款實施要點第19點規定，貸款人於貸款期間內所經營事業結束營業後，未於事實發生起三日內，以書面通知產業局，未來即使恢復營業，亦不再補貼利息。停業後之利息及還款方式請洽承貸金融機構-玉山銀行或台北富邦銀行。","u":"臺北市政府產業發展局科技產業服務中心","h":25282,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=40F93BB3794E0B2B","d":"2016-01-14","sid":"40F93BB3"},{"q":"如何申請建國假日花市攤位?","a":"請您至建國假日花市網站 http://www.fafa.org.tw 點選「花主播」/「花市公告」/「花市推廣攤位申請表」下載申請書表。","u":"臺北市政府產業發展局農業發展科","h":24416,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=62718050D7DE6EE7","d":"2011-03-22","sid":"62718050"},{"q":"請問供應本市天然瓦斯之業者及供應轄區？","a":"瓦斯公司聯絡資訊\n大台北瓦斯公司 │ 電話：(02)2768-4999 免付費電話:0800-005-134\n(營業區域:台北市之松山、信義、大安、大同、萬華、中正、中山等七個行政區及士林區之福華、明勝二里)\n陽明山瓦斯公司 │ 電話：(02)2895-9797  免付費電話:0800-076-789\n(營業區域:台北市之士林(不含明勝里)、北投等區)\n欣湖瓦斯公司     │ 電話：(02)2794-3218~19 免付費電話:0800-023-491\n(營業區域:台北市之內湖、南港等區)\n欣欣瓦斯公司     │ 電話：(02)2921-7811  免付費電話:0800-002-099\n(營業區域:台北市之文山區)","u":"臺北市政府產業發展局公用事業科","h":24407,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6412412F0F1D9070","d":"2013-06-04","sid":"6412412F"},{"q":"請問瓦斯漏氣如何通報搶修？","a":"為爭取時效，請逕洽轄區瓦斯公司派員處理，本市4家瓦斯公司24小時搶修電話如下： 大台北區瓦斯公司（中正、大安、信義、松山、中山、萬華、大同區）：2767-6552、2768-4999轉119-120。 陽明山瓦斯公司（士林、北投區）：2895-9797、2894-8686轉9。 欣湖天然氣公司（內湖、南港區）：2794-3218、2794-3219。 欣欣天然氣公司（文山區）：2922-6666、2921-7811轉276、277。","u":"臺北市政府產業發展局公用事業科","h":23768,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E263A16F62A13975","d":"2013-06-04","sid":"E263A16F"},{"q":"為什麼「能源管理法」及「臺北市工商業節能減碳輔導管理自治條例」中，室內冷氣平均溫度須保持在26℃以上？是指須設定於26℃，還是只要室內溫度維持在26℃即可？","a":"(一)參酌經濟部能源研究報告，得到90%以上人員可接受且達到節約能源之目的，舒適之空調溫度最高可設定在攝氏26至27度左右。如設定低於攝氏25度，長時間生活下會使人體排汗功能降低，影響新陳代謝；另依據能源局的空調與溫度耗能關係研究，夏季空調每調高1℃，可節省空調用電6%。 (二)26℃係指室內冷氣「維持」溫度，非冷氣「設定」溫度。 (三)要維持室內均溫26℃以上，首先要確認溫度感測器擺放位置是否正確，例如：感測器擺設位置不佳，週邊受熱源干擾；或是室內空調區域大，如百貨、量販賣場等挑高較高的空間，溫度感測元件很放置到人員活動空間的高度，因此傳輸距離太長，難以精確控制溫度，其他如感溫器的精確度或是已損壞等，均會造成冷氣壓縮機不正常連續運轉，導致室內溫度過低。建議改善的方式，首先要校正感溫器的溫度設定與室內溫度是否一致，如果難以校正，則目前較常見的作法是在賣場區(人員活動區域)擺設一般簡易型水銀溫度計(很多業者都這麼做，而本計畫發送溫度卡給商家，也是為了給店家做為室內人員活動區域之溫度參考)，藉以調校冷氣出風的\"設定\"溫度與室內實際溫度之差異。","u":"臺北市政府產業發展局公用事業科","h":23299,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D564A640DDBC5DF3","d":"2010-06-02","sid":"D564A640"},{"q":"請問瓦斯管線裝置是否需由瓦斯公司施工？","a":"依經濟部同意備查之瓦斯公司營業章程規定，用戶使用天然氣之管線裝置工程，表外管應由瓦斯公司負責施工，表內管及緊急遮斷設備裝置得由瓦斯公司或公用天然氣導管承裝業者辦理之。用戶委託公用天然氣導管承裝業者辦理表內管之裝設或變更工程，應依下列程序為之： (1)檢具設計圖及工程材料規格送瓦斯公司認可後，始得施工。 (2)完工後，檢附管線竣工平面圖及立體示意圖，通知瓦斯公司進行檢查。 (3)經檢查確定安全無虞，發給合格證明後，始得供氣。 合格之公用天然氣導管承裝業者名單可至經濟部能源局「 合格公用天然氣導管承裝業資料查詢系統 」查詢。","u":"臺北市政府產業發展局公用事業科","h":22147,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D007A0AC7A8925AF","d":"2013-06-04","sid":"D007A0AC"},{"q":"【青年創業融資貸款】本貸款如事業經營良好，可否提前清償?","a":"(一)自114年1月1日起，臺北市青年創業融資貸款由臺北市政府青年局受理申請；若欲了解青年創業融資貸款相關資訊的市民朋友們，請洽青年局官網( https://reurl.cc/ZZ44eV )或青年局窗口諮詢電話：02-2395-8567。\n(二)於113年12月31日前已向臺北市政府產業發展局提出申請之案件，仍請洽產業發展局原承辦窗口辦理及查詢相關事宜，爰依申請當時之「臺北市青年創業融資貸款實施要點」說明如下：\n可以。貸款人如申貸後如營運良好、資金充裕，得視個別情況向承貸金融機構提出提前還款，以減輕債務負擔。如有送保並可就提前清償之貸款金額請承貸金融機構代為申請退還信用保證手續費。","u":"臺北市政府產業發展局科技產業服務中心","h":20881,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A4327B4E4C104D4A","d":"2016-01-14","sid":"A4327B4E"},{"q":"【青年創業融資貸款】請問本貸款經核准後，要如何按月攤還貸款？","a":"(一)自114年1月1日起，臺北市青年創業融資貸款由臺北市政府青年局受理申請；若欲了解青年創業融資貸款相關資訊的市民朋友們，請洽青年局官網( https://reurl.cc/ZZ44eV )或青年局窗口諮詢電話：02-2395-8567。\n(二)於113年12月31日前已向臺北市政府產業發展局提出申請之案件，仍請洽產業發展局原承辦窗口辦理及查詢相關事宜，爰依申請當時之「臺北市青年創業融資貸款實施要點」說明如下：\n申辦青創貸款，於收到產業局之核定通知書後，持相關資料向申貸時選擇之承貸金融機構-玉山銀行或台北富邦銀行開立「個人帳戶」，亦可做為每月還款扣繳使用。","u":"臺北市政府產業發展局科技產業服務中心","h":20564,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=78CA8C1CEE027BC6","d":"2016-01-14","sid":"78CA8C1C"},{"q":"【青年創業融資貸款】請問本貸款經審查通過獲發核定通知書，向銀行申請貸款的期限為何？","a":"(一)自114年1月1日起，臺北市青年創業融資貸款由臺北市政府青年局受理申請；若欲了解青年創業融資貸款相關資訊的市民朋友們，請洽青年局官網( https://reurl.cc/ZZ44eV )或青年局窗口諮詢電話：02-2395-8567。\n(二)於113年12月31日前已向臺北市政府產業發展局提出申請之案件，仍請洽產業發展局原承辦窗口辦理及查詢相關事宜，爰依申請當時之「臺北市青年創業融資貸款實施要點」說明如下：\n申請人應於核定通知書送達之次日起三個月內，依原申請時填寫之承貸金融機構-玉山銀行或台北富邦銀行辦理貸款，逾期未辦理者，核定通知書失其效力。","u":"臺北市政府產業發展局科技產業服務中心","h":20237,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=373C0A909AA458B8","d":"2016-01-14","sid":"373C0A90"},{"q":"【青年創業融資貸款】請問本貸款的還款期限是多久? 利息是多少？","a":"(一)自114年1月1日起，臺北市青年創業融資貸款由臺北市政府青年局受理申請；若欲了解青年創業融資貸款相關資訊的市民朋友們，請洽青年局官網( https://reurl.cc/ZZ44eV )或青年局窗口諮詢電話：02-2395-8567。\n(二)於113年12月31日前已向臺北市政府產業發展局提出申請之案件，仍請洽產業發展局原承辦窗口辦理及查詢相關事宜，爰依申請當時之「臺北市青年創業融資貸款實施要點」說明如下：\n1.本貸款分無擔保貸款及擔保貸款，其本金寬限期限最長皆為3年，前項無擔保貸款期限最長為5年，擔保貸款期限最長為7年。\n但仍需視每位申請人之個別情況由審查小組決定最後的核貸金額及還款期限。\n2.本貸款利率，按中華郵政股份有限公司二年期定期儲金機動利率加0.555%機動計息為上限，實際利率由產業局與承貸金融機構議定後公告之。貸款期間如無實施要點第19點情形者，利息由產業局全額補貼。","u":"臺北市政府產業發展局科技產業服務中心","h":19933,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E0DE2C7D0A88B69B","d":"2016-01-14","sid":"E0DE2C7D"},{"q":"何謂白熾燈？為何要汰換白熾燈？","a":"(一)白熾燈為透過通電，利用電阻把鎢絲加熱至白熾，用來發光的燈。由於發電會產生大量熱能，夏天室內使用更增加冷氣耗用量，故全球先進國家皆推動汰換，以減緩地球暖化效應。 (二)採用LED燈泡，較傳統白熾燈省電約88％以上，一般的白熾燈泡平均使用壽命約1,000小時，而LED約為10,000-30,000小時，發熱量LED約為白熾燈泡之1/3，且LED發光效率可達50-130流明/瓦，約為白熾燈2.5-10倍。","u":"臺北市政府產業發展局公用事業科","h":19929,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DD90C65626A56A70","d":"2011-03-31","sid":"DD90C656"},{"q":"請問自來水管承裝商所稱技術員、技工之資格為何？若有更名時應如何？","a":"所稱技術員、技工，應具備下列資格之一﹕ 一、技術員﹕ (一)高等考試或相當於高等考試環境（衛生）工程、土木、建築、機械、化工、電機、工業工程、水利工程類科考試及格，或自來水管配管乙級以上技術士檢定合格，並從事自來水工程工作一年以上，具有證明文件者。 (二)專科以上學校環境（衛生）工程、土木、建築、機械、化工、電機、工業工程、水利工程科系畢業，或其他性質相近科系畢業，並從事自來水工程工作二年以上，具有證明文件者。 (三)普通考試或相當於普通考試土木、建築、機械、化工、電機、工業工程、水利工程類科考試及格，並從事自來水工程工作四年以上，具有證明文件者。 (四)高級工業職業學校土木、建築、機械、化工、電機、工業工程、水利工程、配管科畢業，或其他性質相近學科畢業，並從事自來水工程工作五年以上，具有證明文件者。 (五)具技工資格，並從事自來水工程工作五年以上，且於主管機關登錄有案者。 (六)依「自來水管承裝商管理辦法」第5條第3項規定，資格(二)及(四)自中華民國一百零九年一月一日起停止適用。但已依技術員資格，受僱擔任技術員且於主管機關登錄有案達一年以上者，不在此限。 二、技工﹕經自來水管承裝技工考驗合格領有證書者，或依技術士技能檢定及發證辦法經技能檢定合格取得自來水管配管丙級以上技術士證者。 前項第一款所列工作經歷之計算應以其提出之考試及格證書或畢業證書所載考試及格或畢業以後之經歷核計之。 以上具有資格之人員所附之「自來水管技工考驗合格證書」若有更名請先至經濟部水利署辦理更名， 洽詢電話 02-89415062。","u":"臺北市政府產業發展局公用事業科","h":18752,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3F43E8F431257919","d":"2013-05-30","sid":"3F43E8F4"},{"q":"請問如何申請設置加油站？","a":"加油站之設置須經四項申請程序：土地用地許可、籌建許可、建築執照及使用執照、經營許可執照四個階段\n相關書表及申請須知請上 台北服務通 查詢下載或洽詢電話:1999#6611(或27208889#6611)本局公用事業科。","u":"臺北市政府產業發展局公用事業科","h":18324,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BCB956360CAA997B","d":"2013-05-30","sid":"BCB95636"},{"q":"請問電器承裝業展延應如何辦理？","a":"承裝業登記執照有效期限為五年，承裝業應於登記期限屆滿前三個月內，向地方主管機關申請展延，並換領登記執照；逾期未申請展延或展延審查不合格者，原登記執照於登記期限屆滿失其效力。辦理展延應檢附申請書、最近一期完稅證明及當年度公會會員證書等文件向本局辦理。相關申請書表及申請須知請至 臺北市政府-市民服務大平臺 查詢下載。","u":"臺北市政府產業發展局公用事業科","h":18119,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7F38E574F39A84BD","d":"2011-05-20","sid":"7F38E574"},{"q":"臺北市執行能源管理法第八條「指定能源用戶應遵行之節約能源規定」用戶有哪些？","a":"依經濟部103年8月1日公告能源管理法第八條「指定能源用戶應遵行之節約能源規定」之業者計20類： (一)觀光旅館：指經營國際觀光旅館或一般觀光旅館，對旅客提供住宿及相關服務之業者。 (二)百貨公司：指在同一場所從事多種商品分部門零售之百貨公司業者。 (三)零售式量販店：指在同一場所從事多種商品量販零售之業者。 (四)超級市場：指從事提供家庭日常用品、食品分部門零售，及生鮮與組合料理食品為主之業者。 (五)便利商店：指提供便利性商品，如速食品、飲料、日常用品或其他相關服務性商品等，為滿足顧客即刻所需之業者。 (六)化粧品零售店：指從事清潔用、保養用、彩粧用化粧品、香水或其他相關商品經營零售之業者。 (七) 電器零售店：指提供各種電器用品及器材零售之業者，並包括電子設備、照明設備、電力設備、家電用品、器材或其他相關商品之零售通路。 (八)銀行：依銀行法之規定，經營銀行業務之機構。 (九)證券商：依證券交易法之規定，經營證券業務之機構。 (十)郵局：依郵政法之規定，經營遞送郵件、集郵及其相關商品等業務之機構。 (十一)大眾運輸場站及轉運站：依發展大眾運輸條例，具有固定路（航）線、固定班（航）次、固定場站及固定費率，提供旅客運送服務之公共運輸場站及轉運站。 (十二)餐館：指從事中西各式餐食供應，並提供得於點餐後在現場立即食用、餐食外帶或外送之業者。 (十三)服飾品零售店：指從事男用、女用、兒童或嬰兒用等各種服飾品零售之業者。 (十四)美容美髮店：指從事化粧、臉部美容、美指、剪髮、理髮、燙髮或美髮造型設計之業者。 (十五)書籍文具零售店：指從事書籍或文具等零售之業者。 (十六)眼鏡零售店：指從事非處方用眼鏡及其零件等零售之業者。 (十七)鞋類零售店：指從事皮革、橡膠、塑膠或其他材料製成之鞋類及其配件零售之業者。。 (十八) 鐘錶零售店：指從事鐘錶及其零件等零售之業者。 (十九) 一般旅館：指觀光旅館業以外，對旅客提供住宿、休息及其他經中央主管機關核定相關業務之業者 (二十)汽、機車零件配備零售店：指從事汽、機車零件、配備或用品零售之業者。","u":"臺北市政府產業發展局公用事業科","h":17996,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=84D2A4A66A15A46D","d":"2016-05-05","sid":"84D2A4A6"},{"q":"什麼是產銷履歷？","a":"農產品產銷履歷制度＝臺灣良好農業規範實施及驗證＋履歷追溯體系。\n為了因應近年來層出不窮的農產品安全事件，以及落實永續農業的精神，目前在國際上被強調的農產品管制制度，主要有良好農業規範（Good Agriculture Practice，簡稱GAP）的實施及驗證，以及建立履歷追溯體系（Traceability，食品產銷所有流程可追溯、追蹤制度）兩種作法，前者旨在降低生產過程及產品之風險(包括食品安全、農業環境永續、從業人員健康等風險)，後者目的除在賦予產銷流程中所有參與者明確責任，尚可作為一旦食品安全事件發生時，快速釐清責任並及時從市場中移除問題產品，降低該等事件對消費者的危害，也避免因為消費者的不安造成符合規範的生產者蒙受損失。\n依據「農產品生產及驗證管理法」所推動的自願性農產品產銷履歷制度，即結合上述兩大國際農產品管制制度，同時採取臺灣良好農業規範（Taiwan Good Agriculture Practice，簡稱TGAP）的實施與驗證，以及建立履歷追溯體系。簡言之，購買使用產銷履歷農產品標章的產銷履歷農產品，不只可以從「產銷履歷農產品資訊網」( https://taft.moa.gov.tw/sp-resume-list-1.html?Today=Today )查詢到農民的生產紀錄，也代表驗證機構已經為您親赴農民的生產現場，去確認農民所記是否符合所做、所做是否符合規範，並針對產品行抽驗，而每一批產品的相關紀錄也在驗證機構的監控下，嚴格審視，一有問題就會馬上處置，因此可以有效降低履歷資料造假的風險，並且有效管控生產過程不傷害環境、產品不傷害人體。\n資料來源：產銷履歷農產品資訊網 ( https://taft.moa.gov.tw/sp-resume-list-1.html?Today=Today )","u":"臺北市政府產業發展局農業發展科","h":17584,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=38DE6F82CFA89BD7","d":"2011-04-01","sid":"38DE6F82"}]},{"org":"地政局","total":348,"items":[{"q":"臺北市各地政事務所及便民工作站之地址、電話及受理業務時間為何?","a":"一、各地政事務所地址及電話如下：\n本市6個地政事務所服務時間：週一至週五上午8時30分至下午5時，中午照常辦公。\n(一) 臺北市松山地政事務所：\n地址：臺北市信義區莊敬路391巷11弄2號\n電話：(02)2723-0711\n(二) 臺北市大安地政事務所：\n地址：臺北市大安區信義路4段335巷6號\n電話：(02)2754-8900\n(三) 臺北市中山地政事務所：\n地址：臺北市中山區松江路357巷1號\n電話：(02)2502-2881\n(四) 臺北市古亭地政事務所：\n地址：臺北市文山區萬隆街47之12號2至4樓\n電話：(02)2935-5369\n(五) 臺北市建成地政事務所：\n地址：臺北市萬華區和平西路3段120號7至9樓\n電話：(02)2306-2122\n(六) 臺北市士林地政事務所：\n地址：臺北市士林區中正路439號5至7樓\n電話：(02)2881-2483\n二、各便民工作站地址、電話及受理業務時間如下：\n(一) 市府便民工作站：\n地址：臺北市信義區市府路1號1樓北區聯合服務中心62至64號櫃檯\n電話：(02)2720-8889轉1025\n上午8時30分至下午5時30分〈中午照常辦公〉\n(二) 內湖工作站：\n地址：臺北市內湖區民權東路六段99號1樓\n電話：(02) 8792-5739\n上午8時30分至下午4時30分〈中午照常辦公〉\n(三) 北投工作站：\n地址：臺北市北投區立功街9號11樓\n電話：(02) 2892-0873\n上午8時30分至下午4時30分〈中午照常辦公〉\n(四) 南港工作站：\n地址：臺北市南港區南港路一段360號2樓13號櫃檯\n電話：(02) 2653-9361\n上午8時30分至下午4時30分〈中午照常辦公〉\n(五) 大安工作站：\n地址：臺北市大安區新生南路二段86號3樓\n電話：(02) 2358-4251\n上午8時30分至下午4時30分〈中午照常辦公〉\n(六) 文山工作站：\n地址：臺北市文山區木柵路三段220號4樓\n電話：(02) 2939-7860\n上午9時至下午5時〈中午照常辦公〉\n(七) 大同工作站：\n地址：臺北市大同區昌吉街57號4樓6號櫃檯\n","u":"臺北市政府地政局土地登記科","h":221361,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=72746DAAFA596B0B","d":"2008-05-26","sid":"72746DAA"},{"q":"繼承登記如何辦理？應檢附那些文件?要到哪裡辦？可以郵寄申請嗎？或是一定要找地政士（代書）辦理？最遲應何時辦理？逾期辦理有無處罰規定？","a":"一、\n辦理繼承登記時，應先向被繼承人戶籍所在地的國稅局申報遺產稅，繳清稅款後取得遺產稅繳納（免稅）或同意移轉證明書，並至不動產所在稅捐稽徵機關加蓋無欠繳稅費章戳後，檢附登記申請書、登記清冊、繼承系統表、載有被繼承人死亡記事之戶籍謄本、繼承人現在的戶籍謄本(但地政事務所能以電腦處理達成查詢者免附)、土地、建物所有權狀、遺產稅繳清（免稅）證明書或同意移轉證明書及其他相關證明文件，向不動產所在之地政事務所申辦(臺北市轄區之不動產繼承登記可向臺北市任一地政事務所申辦)；如有拋棄繼承者，並應加附拋棄書及印鑑證明(繼承開始在74.6.5以後，拋棄繼承應檢附法院准予備查之文件，免附印鑑證明)；如有協議分割繼承者，並應加附協議書正副本（正本需按不動產權利價值千分之一貼印花）及全部繼承人印鑑證明。申請人可以親自或委託他人辦理，但是不受理以郵寄方式申辦。\n二、\n上述登記申請書及登記清冊書表，可向本市各地政事務所服務台免費索取，或上\n台北服務通\n下載。\n三、\n地政士法已於90年10月24日公布並於91年4月24日起施行，以前所稱的「代書」，現在已改稱為「地政士」，但是必須要領有開業執照而且有加入地政士公會的地政士才可以執業。所以，如果因無法親自辦理繼承登記而需委託地政士辦理的話，一定要找有開業執照且有加入公會的地政士。想知道地政士是否領有開業執照及是否加入公會，可上本局網站服務園地中查詢服務項下的\n合法不動產服務業者查詢\n。\n四、\n繼承登記應於被繼承人死亡之日起6個月內辦理，但如有不可歸責於聲請人之事由者，其期間可予扣除（例如：向國稅局申報遺產稅，國稅局受理之期間）。聲請逾期者，每逾1個月得處應納登記費額1倍之罰鍰，最高可罰至登記費之20倍。","u":"臺北市政府地政局土地登記科","h":108586,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C2FA10201DAC5E88","d":"2008-05-26","sid":"C2FA1020"},{"q":"在臺北市地籍謄本如何申請？有哪些申請管道？可以通訊申請或傳真申請嗎？傳真號碼為何？費用如何計收？","a":"一、只要知曉欲申請之土地、建物之段、小段、地建號，申請人持國民身分證等證件向本市任一地政事務所或地政便民工作站臨櫃申請，或逕向中華電信股份有限公司申請帳號，自行上網下載列印登記謄本。 二、目前申請謄本有下列管道： (一) 臨櫃申請：可至本市任一地政事務所或地政便民工作站申請紙張謄本。 (二) 網路申請：可至【 網路申領電子謄本網站 】或【 北北桃地政資訊網路e點通 】申請。 (三) 通信申請：將謄本申請書、足額規費及郵資一併寄送至本市任一地政事務所申請，並在信封正面左上角書明「通信申請地籍謄本及相關資料」字樣（第一類及第三類登記謄本及地價謄本不受理通信申請）。 (四) 傳真申請：將謄本申請書傳真本市任一地政事務所申請，領件時再行繳費（第三類登記謄本不受理傳真申請）。 三、本市各地政事務所受理傳真申請謄本服務之傳真號碼如下： 臺北市松山地政事務所：(02)2723-8597 臺北市古亭地政事務所：(02)2932-8922 臺北市建成地政事務所：(02)2306-2865 臺北市士林地政事務所：(02)2883-3611 臺北市中山地政事務所：(02)2516-0524 臺北市大安地政事務所：(02)2702-4410 四、登記謄本、地價謄本、地籍圖謄本、建物測量成果圖謄本等電腦列印每張20元，登記（簿）謄本人工影印每張10元，地籍圖謄本人工影印每張15元、人工描繪每筆40元、電腦列印每張20元。","u":"臺北市政府地政局土地登記科","h":106519,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7E95213464305681","d":"2008-05-26","sid":"7E952134"},{"q":"抵押權塗銷如何辦理登記？應備哪些文件？","a":"三、針對常見的金融機構抵押權設定、變更及塗銷登記，內政部提供「抵押權線上申辦系統入口網」線上申辦服務，需使用自然人憑證或工商憑證登入。透過線上檢視登記申請資料確認無誤後，以該憑證進行電子簽章。地政事務所接收系統申請案件並依程序辦理收件後，申請人(代理人)得於系統查詢案件辦理情形。","u":"臺北市政府地政局土地登記科","h":81134,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=04FC7239EABCAE14","d":"2020-09-01","sid":"04FC7239"},{"q":"何謂土地、建物登記謄本？與土地、建物所有權狀有何不同？","a":"土地登記及地價電子資料謄本分為三類： 第一類：顯示登記名義人全部登記資料。 第二類：隱匿登記名義人之出生日期、部分姓名、部分統一編號、債務人及債務額比例、設定義務人及其他依法令規定需隱匿之資料。但限制登記、非自然人之姓名及統一編號，不隱匿。 第三類：隱匿登記名義人之統一編號、出生日期之資料。","u":"臺北市政府地政局土地登記科","h":76754,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6075F278D5DA6973","d":"2009-04-13","sid":"6075F278"},{"q":"親人過世時，誰是繼承人？","a":"一、依照民法第1138條規定，遺產繼承人，除配偶外，依下列順序定之：（一）直系血親卑親屬（二）父母（三）兄弟姊妹（四）祖父母。第（一）順序之繼承人，以親等近者為先，配偶有相互繼承遺產之權，其應繼分則依同法第1144條定之。\n二、「司法院釋字第七四八號解釋施行法」第23條規定，相同性別之二人，為經營共同生活之目的，成立具有親密性及排他性之永久結合關係者，雙方當事人有相互繼承之權利，互為法定繼承人，準用民法繼承編關於繼承人之規定。","u":"臺北市政府地政局土地登記科","h":71086,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=204D070EFC15904C","d":"2011-01-20","sid":"204D070E"},{"q":"未辦繼承登記不動產列冊管理之目的為何？期限多長？何時會移請國有財產署標售？標售所得價款之處理方式為何？","a":"一、列冊管理之目的，依土地法第73條之1之立法意旨乃是為督促繼承人儘速辦理繼承登記，以使地籍資料與實際相合，兼以保障繼承人法定取得之權益。逾期未辦理繼承登記而執行列冊管理，甚或移送國有財產署標售只是一種手段，係基於維護土地資源使地籍資料完整並促進土地合理利用及有關土地政策之推展。\n二、列冊管理之期限，依土地法第73條之1第2項規定為15年，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請國有財產署公開標售。繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過5年者，於標售後以5年為限。\n三、標售所得價款之處理方式，依土地法第73條之1第4項規定，標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾10年無繼承人申請提領該價款者，歸屬國庫。","u":"臺北市政府地政局土地登記科","h":64109,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A3235049244AD858","d":"2008-06-11","sid":"A3235049"},{"q":"被繼承人所遺之不動產，多久沒辦理繼承登記，才會被地政機關列冊管理？又被列冊管理是不是需要繳交費用？","a":"依土地法第73條之1規定，土地或建築改良物，自繼承開始之日起逾1年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於3個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理，但有不可歸責於聲請人之事由，其期間應予扣除。以前土地法規定，被政府代管的不動產，是要繳交代管費的，但是土地法第73條之1於民國89年1月26日修正公布後，由原來「代管」修正為「列冊管理」，而且不再收取列冊管理費用。又位於本市的不動產在土地法89年修正前已經被代管者，已執行代管之期間併入列冊管理期間計算，而且到現在還沒有辦理繼承登記者，也不用再繳交代管費用。","u":"臺北市政府地政局土地登記科","h":62273,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3037B25B62944AC","d":"2008-05-26","sid":"D3037B25"},{"q":"如何查詢登記有案之地政士？","a":"本市開業地政士資料可進入本府地政局網站（ https://land.gov.taipei ），點選「線上查詢> 合法不動產服務業者查詢 」，或進入內政部地政司全球資訊網（ https://im.land.moi.gov.tw/ ），點選「地政士資訊系統＞地政士開業資料」進行查詢開業登記之地政士。","u":"臺北市政府地政局土地登記科","h":61893,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA33ABF57BBF68C7","d":"2014-05-11","sid":"AA33ABF5"},{"q":"申請地籍謄本之申請人有無資格限制？","a":"一、 任何人均可申請地價謄本、地籍圖謄本、建物測量成果圖謄本及人工登記簿謄本，無資格限制。\n二、 登記及地價謄本分為三類：第一類謄本（顯示登記名義人全部登記資料）限由所有權人、他項權利人本人或其繼承人、管理人、代理人申請；第二類謄本（隱匿登記名義人之出生日期、部分姓名、部分統一編號、債務人及債務額比例、設定義務人及其他依法令規定需隱匿之資料，但限制登記、非自然人之姓名及統一編號，不隱匿。）無限制申請人資格，任何人均可申請；第三類謄本(隱匿登記名義人之統一編號、出生日期之資料)限由登記名義人、具有法律上通知義務或權利義務得喪變更關係之利害關係人始得申請。","u":"臺北市政府地政局土地登記科","h":59946,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6945C7AF5BDAD729","d":"2008-05-26","sid":"6945C7AF"},{"q":"如果繼承人因遺產分配始終無法達成協議或被繼承人之權狀尋覓不著或其他原因無法檢附，致擔憂該遺產可能被地政機關列冊管理，有無解決辦法？","a":"如果繼承人對於遺產分配一直無法達成協議或無法檢附被繼承人權狀，致遲未聲請繼承登記，擔憂被地政機關列冊管理或將來辦理繼承登記時需繳罰鍰，可先依土地登記規則第120條規定，由部分繼承人檢附辦理繼承登記應備文件及切結無法檢附被繼承人之所有權狀之事由，向地政事務所申請繼承登記為全體繼承人公同共有。該被繼承人之權狀，登記機關於登記完畢時將公告註銷，俟全體繼承人達成協議後，再向地政事務所申辦遺產分割登記事宜。繼承登記應檢附的文件您可以逕上 台北服務通 查詢。","u":"臺北市政府地政局土地登記科","h":59870,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=33D4280BE00B9A8F","d":"2008-05-26","sid":"33D4280B"},{"q":"如何辦理土地拋棄繼承，應備何文件？","a":"按民法第1174條規定，繼承人應於知悉其得繼承之時起3個月內，檢附被繼承人死亡證明書、除戶戶籍謄本、繼承人戶籍謄本、繼承系統表、印鑑證明、繼承權拋棄通知書收據等，具狀向被繼承人住所地之地方法院聲明拋棄繼承權。","u":"臺北市政府地政局土地登記科","h":59339,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=42E0AB1C959BF610","d":"2009-10-27","sid":"42E0AB1C"},{"q":"日據時期之「假登記」得否依地籍清理條例第30條規定申請塗銷登記？","a":"日據時期之「假登記」性質與現行預告登記相似，故非屬地籍清理條例適用範圍。","u":"臺北市政府地政局土地登記科","h":58756,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0BCC10CD61871C51","d":"2010-06-15","sid":"0BCC10CD"},{"q":"如何查詢物價指數？","a":"本府地政局網站首頁＞服務園地＞試算服務＞「土地增值稅試算」功能裏有提供「消費者物價總指數」的服務，該物價指數資料，係先連結至財政部稅務入口網再連結至行政院主計處網站的「各年月為基期之消費者物價總指數-稅務專用」，其中民國48年迄今之資料檔，民眾可以視需要自行下載使用，或可直接至行政院 主計總處網站 查詢。","u":"臺北市政府地政局地價科","h":57450,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B10B858B36673551","d":"2010-02-23","sid":"B10B858B"},{"q":"地籍清理條例規定清理之「限制登記」所指為何？","a":"應清理之「限制登記」係指34年10月24日以前之查封、假扣押、假處分登記。","u":"臺北市政府地政局土地登記科","h":57106,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E2DC03E2BF1DA3BA","d":"2010-06-15","sid":"E2DC03E2"},{"q":"未辦繼承登記不動產列冊管理之依據為何？未辦繼承登記不動產資訊有公告嗎？是不是繳清遺產稅就不會被列冊管理？","a":"一、未辦繼承登記不動產辦理列冊管理作業係依據土地法第73條之1規定，土地或建物所有權人死亡後，繼承人超過1年沒有辦理繼承登記，經地政機關查明後，應公告繼承人於3個月內 聲 請登記，並以書面通知繼承人；逾期未聲請繼承登記者，得由地政機關予以列冊管理。但有不可歸責於聲請人之事由，其期間應予扣除。\n二、本市各地政事務所每年4月1日至6月30日公告當年度未辦繼承登記不動產資訊，在土地所在地登記機關布告欄、土地所在地鄉（鎮、市、區）公所布告欄、被繼承人原戶籍所在地鄉（鎮、市、區）公所布告欄及被繼承人原戶籍所在地村、里辦公處布告欄皆可查看該公告內容。\n三、縱使已經繳清遺產稅，如果自繼承開始之日起逾1年仍未向地政事務所辦理繼承登記的話，還是會被列冊管理。","u":"臺北市政府地政局土地登記科","h":56373,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4DF804F29A383D24","d":"2008-05-26","sid":"4DF804F2"},{"q":"何謂「限制登記」？限制登記有哪幾種？","a":"依土地登記規則第136條規定，土地法第78條第8款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記。限制登記，包括預告登記、查封、假扣押、假處分或破產登記，及其他依法律所為禁止處分之登記。","u":"臺北市政府地政局土地登記科","h":56016,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=620476540E6DC406","d":"2011-08-12","sid":"62047654"},{"q":"公告土地現值與公告地價之作用分別為何？","a":"公告土地現值 於每年1月1日公告，作為土地移轉及設定典權時，申報土地現值的參考，並作為主管機關審核土地移轉現值之依據。 公告地價 ，係政府每2年重新規定地價時，參考當年期土地現值、前一期公告地價、地方財政需要、社會經濟狀況及民眾負擔能力按法定程序評估，於1月1日公告，作為土地所有權人申報地價後據以課徵地價稅。","u":"臺北市政府地政局地價科","h":55666,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CB8DB571207425B0","d":"2010-02-23","sid":"CB8DB571"},{"q":"如何辦理不動產買賣所有權移轉登記？應檢附哪些文件？有無時間限制？所有權人如在國外，欲出售國內不動產，應檢附何種身分證明文件？","a":"一、 辦理程序：訂立契約→申報土地增值稅、契稅→繳清稅款→申請買賣登記。\n(一) 由承買人與出賣人共同訂立土地及建築改良物所有權買賣移轉契約書（公契，一式2份）並蓋妥雙方印章。其中1份契約書貼印花稅票（稅額為買賣價款總金額千分之一）。\n(二) 向稅捐稽徵機關申報土地增值稅、契稅，於繳清稅款後，至地政事務所申請買賣登記。如有欠繳地價稅、房屋稅者須繳清欠稅款並至稅捐機關辦理查欠稅費手續。\n二、 至地政事務所辦理買賣所有權移轉登記時，應檢附下列文件：\n(一) 土地登記申請書。\n(二) 義務人印鑑證明。\n(三) 土地、建物所有權狀。\n(四) 土地及建築改良物所有權買賣移轉契約書正、副本（貼印花的是正本）。\n(五) 土地增值稅、契稅繳款書或免稅證明書第2聯（黏貼於副本上）。\n(六) 買賣雙方的身分證明文件（如身分證影本、戶口名簿影本或戶籍謄本擇一檢附，但地政事務所能以電腦處理達成查詢者免附）。\n(七) 其他依法令規定應檢附之文件經申請案件受理機關載明要求加以補齊者。\n三、 買賣雙方簽約後，應於1個月內向地政事務所辦理所有權移轉登記，雙方權益方可獲得保障，並避免被處逾期登記費罰鍰。\n四、 所有權人如在國外，應檢附下列身分證明文件：\n(一) 授權書：由所有權人親自向旅居當地我國駐外館處申請授權書簽證，授權國內親友辦理買賣登記，授權書內容應將不動產標的、權利範圍及授權事項填寫清楚。\n(二) 出賣人身分證明文件：除檢附國內親友（即被授權人）身分證明文件、印鑑證明外，仍應檢附所有權人（即授權人）身分證明文件（原在臺之戶籍謄本、除戶戶籍謄本、國民身分證影本、戶口名簿影本，或以護照、旅居當地之身分證、居民證、駕照等影本擇一皆可）。","u":"臺北市政府地政局土地登記科","h":55618,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=40FF7E7EAB6B04B5","d":"2008-05-26","sid":"40FF7E7E"},{"q":"實施建築管理前沒有使用執照之建物如何辦理建物所有權第一次登記？又辦理建物所有權第一次登記時，如何判斷是否為實施建築管理之建物？","a":"一、 實施建築管理前建造之建物，無使用執照者，應提出主管建築機關或鄉（鎮、市、區）公所之證明文件或實施建築管理前有關該建物之下列文件之一： (一)曾於該建物設籍之戶籍證明文件。 (二)門牌編釘證明。 (三)繳納房屋稅憑證或稅籍證明。 (四)繳納水費憑證。 (五)繳納電費憑證。 (六)未實施建築管理地區建物完工證明書。 (七)地形圖、都市計畫現況圖、都市計畫禁建圖、航照圖或政府機關測繪地圖。 (八)其他足資證明之文件。 二、 本市實施建築管理時間如下: (一) 舊市區：民國45年5月4日。 (二) 景美、木柵區：民國58年4月28日。 (三) 南港、內湖區：民國58年8月22日。 (四) 士林、北投區：民國59年7月4日。","u":"臺北市政府地政局土地登記科","h":54313,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88182BE54FBEC674","d":"2009-11-26","sid":"88182BE5"},{"q":"地政機關列冊管理的不動產，會事先通知繼承人或公告週知嗎？公告期限為何？繼承人在法定期間內已申報遺產稅，因國稅局遲未核定，而地政事務所已通知催辦繼承登記及要列冊管理，該怎麼辦？已經被列冊管理的不動產還可申辦繼承登記嗎？","a":"一、 地政事務所接獲稅捐稽徵機關函送逾繼承原因發生日期1年之未辦繼承登記不動產歸戶資料（於每年12月底前送土地建物所在地之地政事務所）或地政機關因管理地籍、規定地價、補償地價等作業所發現或人民提供之土地權利人死亡資料，經核對地籍資料並使用戶役政系統查詢或函請戶政事務所協助查明，經查實後，於每年4月1日辦理公告，並通知繼承人於3個月內聲請繼承登記，逾期未聲請者，則予列冊管理，公告期間為3個月；已知繼承人及其住址者，同時以書面雙掛號通知繼承人。\n二、 如繼承人已於法定期間內申報遺產稅，惟國稅局遲未核定，繼承人可檢附已向國稅局申報遺產稅的證明文件，並以書面敘明因不可歸責於繼承人之事由向地政事務所申請暫緩列冊管理。\n三、 未辦繼承登記之不動產，在列冊管理15年期間內仍可隨時向地政事務所申辦繼承登記。","u":"臺北市政府地政局土地登記科","h":53961,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4AC55209842AA155","d":"2008-05-26","sid":"4AC55209"},{"q":"僅知道房屋門牌，可否查詢地、建號及申請謄本？","a":"只要知道正確門牌資料，可先申請以建物門牌查詢地段建號及該建物坐落地號，得知地號及建號後，再申請地籍謄本；該查詢費用為每筆（棟）新臺幣20元，申請地籍謄本費用另計。","u":"臺北市政府地政局土地登記科","h":51824,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=33D9764D35EB308D","d":"2008-11-12","sid":"33D9764D"},{"q":"贈與登記如何辦理？應檢附那些文件？","a":"一、\t由贈與人與受贈人共同訂立土地及建物所有權贈與移轉契約書（公契，一式2份）並蓋妥雙方印章。其中1份土地及建物契約書貼印花稅票（稅額為贈與價款總金額千分之一）。\n二、\t先向本市稅捐稽徵處申報土地增值稅、契稅，再到贈與人戶籍所在地的國稅局申報贈與稅，於繳清稅款後，至地政事務所申請贈與登記。如有欠繳地價稅、房屋稅者須繳清欠稅款並至稅捐機關辦理查欠手續。\n三、\t至地政事務所辦理贈與登記，應檢附下列文件：\n(一)\t土地登記申請書。\n(二)\t土地及建物所有權贈與移轉契約正、副本（貼印花的是正本）。\n(三)\t土地增值稅、契稅繳款書或免稅證明書第2聯（黏貼於副本上）及贈與稅繳清（免稅）證明書正、影本。\n(四)\t受贈人與贈與人之身分證明文件(如身分證影本、戶口名簿影本或戶籍謄本擇一檢附，但地政事務所能以電腦處理達成查詢者免附)。\n(五)\t贈與人的印鑑證明（贈與人未能持國民身分證正本親自至地政事務所核對身分者，應檢附原因發生日期前1年以後核發之印鑑證明）。\n(六)\t土地、建物所有權狀。\n(七)\t其他依法令規定應檢附之文件經申請案件受理機關載明要求加以補齊者。","u":"臺北市政府地政局土地登記科","h":51772,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A8C893AF682CCA47","d":"2008-05-26","sid":"A8C893AF"},{"q":"已經被地政機關列冊管理的不動產，如果一直沒有辦理繼承登記的話，會怎麼樣？","a":"未辦繼承登記之不動產經地政機關列冊管理滿15年仍未辦理繼承登記者，則移送財政部國有財產署公開標售，標售所得價款儲存於專戶，繼承人得依法定應繼分領取，逾10年無繼承人申領該價款者，歸屬國庫。","u":"臺北市政府地政局土地登記科","h":51686,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A96A217CDF7B991B","d":"2008-05-26","sid":"A96A217C"},{"q":"哪些文件必需由不動產經紀人簽章？","a":"應由經紀業指派經紀人簽章文件如下：\n一、不動產出租、出售委託契約書。（經營代銷業務不適用）\n二、不動產承租、承購要約書。（經營代銷業務不適用）\n三、定金收據。\n四、不動產廣告稿。\n五、不動產說明書。\n六、不動產租賃、買賣契約書。","u":"臺北市政府地政局地權及不動產交易科","h":51414,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7C3C151107F607F5","d":"2023-05-12","sid":"7C3C1511"}]},{"org":"工務局","total":323,"items":[{"q":"臺北市河濱公園開放烤肉的場地有那些？","a":"前年因疫情考量，本處發佈公告自110年9月15日起即禁止平時及中秋節期間在臺北市河濱公園進行烤肉、野炊活動迄今，因疫情已宣布解封，故再次開放。\n另外，針對目前河濱公園內開放烤肉、野炊的場地，考量近2年來因疫情影響均暫停開放烤肉尚無影響民眾中秋賞月之活動，且本市已訂定「臺北市淨零排放管理自治條例」，為消除溫室氣體排放，已訂下減碳目標，基於中秋節聚集民眾烤肉，除造成大量垃圾影響環境亦提高排碳量，故擬取消中秋節多數增加開放之烤肉、野炊區。\n調整後河濱公園平常開放烤肉、野炊的場地仍有4處，中秋節的特別時段則僅加開1處，各時段開放地點如下：\n平時開放場地：\n大佳河濱公園：10號門旁高速公路橋下廣場。\n華中河濱公園：華中橋下自行車道北側橋孔指定區。\n道南河濱公園：左岸恆光橋越堤坡道下圓形廣場。\n成美右岸河濱公園：麥帥一橋下施工中，改至下游200公尺處之麥帥二橋下。\n中秋節增加開放地點：大佳河濱公園：大直橋下指定區。(開放時間：中秋連續假期前一日17時起至中秋連續假期結束日24時止)\n本處再次呼籲民眾，未來河濱公園內從事烤肉、野炊則應遵守規定僅能在河濱公園指定的區域和時段，本處將會派員加強巡邏，若發現民眾違規燃放爆竹煙火，巡查人員將會直接取締，另外在未開放的地點和時間烤肉、野炊，巡查人員將會依「臺北市公園管理自治條例」直接取締，按違規次數及情節開罰每次新臺幣2,400元至6,000元。\n烤肉、野炊指定區的範圍(圖示)及開放時間，可上本處官網查詢 [ 連結 ] ，民眾若有發現違規烤肉或野炊之情事，也可協助撥打檢舉專線臺北市民當家熱線1999反映。","u":"臺北市政府工務局水利工程處河川管理科","h":257265,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3660D355B90076D","d":"2008-08-28","sid":"D3660D35"},{"q":"臺北市河濱自行車租借站服務：一、服務地點？二、服務時間？三、租借辦法？四、租借費率？五、租借資訊洽詢方式？","a":"[最新訊息請至「臺北市河濱自行車租借站」網站查詢 http://www.ukan.com.tw]\n一、臺北市河濱自行車租借服務地點：\n1.關渡租借站(0977-320525)：知行路，關渡宮北側，關渡碼頭旁。\n2.大稻埕租借站(0977-320523)：民生西路底，大稻埕疏散門進入，大稻埕碼頭南側。\n3.大佳租借站(0977-320521)：位於台北市中山區濱江街基隆河九號水門前進100公尺，白色薄膜旁的彩色貨櫃屋。\n4.美堤租借站(0977-320524)：美堤疏散門(敬業三路底)進入後左轉，土坡曲道賽場旁。\n5.景福租借站(0977-320522)：自來水園區公館水岸廣場上(思源街底)，永福橋旁。\n6.木柵租借站(0977-320526)：新光路二段，動物園前方道南河濱公園廣場上(假日營業)。\n7.觀山租借站(0977-320528)：塔悠路轉入塔悠疏散門，往高速公路橋方向，高速公路橋下方。\n8.馬場町租借站(0977-320-527)：青年路底，進入新一疏散門後左轉。\n9.彩虹租借站(0977-320531)：開車經越堤坡道(新湖二路與堤頂大道交會口臨河側附近)轉入河濱公園，位於麥帥一橋右岸下方；步行由彩虹橋或行善路橋前往麥帥一橋右岸(假日營業)。\n二、臺北市河濱自行車租借站服務時間(請依現場公告為主)：\n站 別\n營業時間\n關渡站\n全日站\n*租車服務時間\n夏令：4月～10月\n平日 8:00-12:00，14:00-20:00 (平日午休：12:00-14:00)\n假日 8:00-20:00 (假日無午休)\n冬令：11月～3月\n平日：9:00-12:00，14:00-19:00 (平日午休:12:00-14:00)\n假日：8:00-19:00 (假日無午休)\n大稻埕站\n大佳站\n美堤站\n景福站\n木柵站\n觀山站\n馬場町站\n彩虹站 木柵站\n假日站\n*租車服務時間\n夏令：4月～10月\n假日：8:00-19:00 (假日無午休)\n冬令：11月～3月\n假日：8:00-18:00 (假日無午休)\n三、臺北市河濱自行車租借辦法(請依現場公告為主)：\n1.「原地借還」：請提供押證(身","u":"臺北市政府工務局水利工程處河川管理科","h":82687,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=277CE43C18B19300","d":"2008-06-23","sid":"277CE43C"},{"q":"花卉試驗中心開放時間？如何去陽明山花卉試驗中心？","a":"1.花卉試驗中心開放時間：每日08：00－17：00。 2.提醒想要上山參觀的民眾，請大家多使用大眾運輸工具上山。民眾平日前往花卉試驗中心可以搭乘公車260、303、681、紅5、小15公車及皇家客運金山線(1717線)等，假日另有休閒公車109、111等，搭乘至山仔后派出所站下車，往下山方向步行約3分鐘即可到達。 1999臺北市民當家熱線（外縣市02-27208889）","u":"臺北市政府工務局公園路燈工程管理處","h":28055,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=120E106E635FAFDB","d":"2018-12-06","sid":"120E106E"},{"q":"詢問「希望噴泉」噴水時間？","a":"大佳河濱公園「希望噴泉」，噴水時間：12月1日至3月31日每日上午10時至下午4時15分，每2小時於雙數點噴水1次，每次噴水15分鐘，4月1日至11月30日每日上午10時至下午5時15分，每1小時噴水1次，每次噴水15分鐘，另工務局水利處亦將考量於連續節日或陰雨視情況彈性調整增加或減少噴水次數；或視缺水狀況停止噴水。請民眾勿入水池，亦請勿攜狗進入池內嬉戲，以維水池清潔及安全。\n因大佳河濱公園再造工程施工中，噴泉預計於116年重新啟用，敬請期待。\n備註： 〇標記為大佳噴泉運轉時程。 ■標記為大佳噴泉運轉+燈光投射展示時間 假日、冬季天候不佳或視水情影響時，工務局水利處得視情況增加、減少噴水或停止噴水並調整燈光次數。","u":"臺北市政府工務局水利工程處河川管理科","h":23679,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=84B45E0B827A21F2","d":"2008-07-11","sid":"84B45E0B"},{"q":"當初施做污水下水道用戶接管時，未將地下室原有化糞池廢除，現在如何處理？","a":"已接用污水下水道的用戶，如果發現地下室原有化糞池尚未廢除，但目前接管方式是由壓力管出口銜接，應自費委由專業廠商進行地下室內部污水管線改管，將原本排到地面下或地下室化糞池的糞管，改以重力流銜接至公共污水下水道，化糞池就可以廢除；若地下室有污排水需求（如廁所、洗手台或無法修改既有污水管線以重力流銜接公共污水下水道），一樣先將地面層以上的污水管線改以重力流銜接至公共污水下水道，再將既有化糞池改設為污水坑銜接地下室廁所後，以抽水馬達排放至公共污水下水道，請務必事先通知衛工處協助外部出水口銜接到公共污水下水道系統的作業，提醒市民千萬不可私自銜接，以免違反下水道法而受罰。 本府目前針對88年2月13日以前取得建照之建築物，其既有化糞池或既有污水處理設施廢除或改設污水坑者有部分費用補助，可至官網「公告資訊」→「宣導事項」查詢補助資格、流程及金額等，並下載申請表單申請補助，亦可透過臺北市政府台北服務通（ https://service.taipei/search-item?codeKind=Organization&classificationCode=df3b8fad-4952-41cb-a6cb-c855b745d749 ），由首頁∕機關∕工務局∕衛工處項下「建築物既有化糞池廢除或改設為污水坑補助」申辦，如需進一步資訊可電洽衛工處營管科（02-25973183分機106），提醒市民務必於室內改管施工前向衛工處申請補助，經現場勘查通過後始得施工，若改管完成始提出申請者，一律不予補助。","u":"臺北市政府工務局衛生下水道工程處營運管理科","h":23597,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B496B9D08A717FAF","d":"2009-08-06","sid":"B496B9D0"},{"q":"河濱公園攤販全都是違法設置嗎？是否可有合法申請於河濱公園設攤場地？","a":"目前工務局水利處委外經營之營業項目包含輕食、咖啡、飲料、自行車配件等相關用品及其他工務局水利處核准項目，目前合法廠商有3家，營業地點分別位於延平、大佳、美堤、成美左岸及河雙21號等5座河濱公園，均在營業區地點以旗幟或張貼紙牌或立廣告帆布等方式及備核可文件影本，於現場之電箱或行動車或攤位前標示之。其他違規攤販將予以取締。\n委託經營管理案或公有土地提供使用招標案等相關招標資訊，可在工務局水利處網站及行政院公共工程委員會電子採購網內查詢。","u":"臺北市政府工務局水利工程處河川管理科","h":23273,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BF6C4A6BA55CB4E3","d":"2008-10-29","sid":"BF6C4A6B"},{"q":"為什麼我家水費單上有「污水下水道使用費」？跟水費金額幾乎一樣多，怎麼算的？","a":"一、依「臺北市污水下水道使用費徵收自治條例」第3條「接用本市污水下水道系統之用戶，應依本自治條例規定繳納使用費。」，因此若水費單上有污水下水道使用費，代表家戶污水已接入公共污水下水道。\n二、依「臺北市污水下水道使用費徵收自治條例」第6條第2項「前項使用費單價由管理機關依公式計算，報經市政府核准後公告之」，115～117年度污水下水道使用費單價經本府114年10月27日公告為一般用戶及事業用戶每度（立方公尺）新臺幣5元。","u":"臺北市政府工務局衛生下水道工程處營運管理科","h":22198,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C0C38CDC75DF98E3","d":"2009-12-10","sid":"C0C38CDC"},{"q":"如何申請碧山、貴子坑露營場？","a":"露營場採線上預約申請使用制，其申請時間、方式等相關規定請詳本處線上申請網址。\n露營場線上申請\n承辦單位：大地工程處森林遊憩科\n承辦人：周以馨  洽詢電話：02-27593001轉3321。","u":"臺北市政府工務局大地工程處","h":21658,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A4B50930C72CB35D","d":"2010-03-18","sid":"A4B50930"},{"q":"請問衛生紙可以直接丟入馬桶中嗎？","a":"一、紙類產品有衛生紙、面紙、紙巾等，因用途不同，紙漿之成分也不相同，衛生紙屬短纖維產品遇水較易快速分散，可直接丟入馬桶，不致阻塞馬桶，但面紙、濕式紙巾、不織布及拋棄式尿布等屬長纖維並有添加劑，容易阻塞排水管路，因此不能丟入馬桶。\n二、尚未接用污水下水道之住戶，馬桶排水經由污水處理設施（或化糞池）處理後排放至雨水側溝，處理後之污泥仍留在處理設施中，需由住戶定期抽除，衛生紙直接丟入馬桶中會增加污泥量，提高定期抽除水肥的頻率。\n三、已接用污水下水道之用戶，仍應養成良好使用習慣，衛生紙分辨可丟入馬桶標示，勿將衛生紙外之其他面紙類、衛生棉、濕式紙巾、不織布及拋棄式尿布、破布、竹片、木條及雜物等投入馬桶，以免造成馬桶阻塞，此外，若是建築物污水管線坡度配置不良或管徑過小，均有可能堵塞污水管線，造成使用的困擾。","u":"臺北市政府工務局衛生下水道工程處營運管理科","h":21458,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=75D44B1E2CA0E89C","d":"2009-06-19","sid":"75D44B1E"},{"q":"檢舉河濱公園施放風箏、遙控飛機、攤販及打高爾夫球等問題？","a":"本市河濱公園業經公告適用「臺北市公園管理自治條例」相關規定，茲就較常接獲民眾反映檢舉之違規使用行為暨處理方式說明如下，工務局水利處呼籲市民同胞發揮公德心及自律精神、遵守入園規定，以共同維護遊憩安全及品質。\n一、違規施放風箏、遙控飛機等\n1.本市河濱公園範圍內未禁止施放風箏，惟基於飛安之考量，涉及飛航管制區範圍禁止放風箏、遙控飛機等相關資訊可至交通部民用航空局網站(https://www.caa.gov.tw/index.aspx?Lang=1)，點選「航空安全」，再點選「機場四周禁止或限制事項」項下查詢確認。\n2. 交通部民用航空局「交通部民用航空局對機場四周禁止施放有礙飛航安全物體實施要點」第2點規定機場四周禁止施放有礙飛航安全物體之距離範圍，施放時應遵守前開規定，另河濱公園部分區域臨近住宅、道路、電塔及高架橋，又為民眾經常休閒遊憩場域，為考量失控墜落等安全顧慮，應擇空曠之適當地點施放，並時常確認周邊民眾安全。\n3.平日工務局水利處派有河川巡防人員進行巡查勸導勿於管制區內從事上述行為，如有不聽勸導者則予以蒐證移送航空主管機關裁罰；民眾如有發現，亦可直接撥打航警局臺北分局（27136049；87702665）及交通部民用航空局航務組（8770-3442）派員取締開單告發。\n二、違規攤販\n1.依臺北市公園管理自治條例第13條第1項第12款規定，河濱公園內未經許可禁止販賣、出租等行為，違者依第17條規定視違規行為處新臺幣1,200元以上6,000元以下罰緩。\n2.平日工務局水利處派有河川巡防人員經常不定時至公園巡查取締，必要時將會同轄區派出所加強取締及開單告發裁罰。\n三、違規打高爾夫球\n1.依臺北市公園管理自治條例第13條第8款規定，河濱公園內不得在非指定場所從事高爾夫球活動，違者依第15條第1款規定視違規情節第1次處新臺幣3,000元以上5,000元以下罰緩，第2次處新臺幣5,000元以上7,000元以下罰緩，第3次處新臺幣7,000元以上1萬元以下罰緩。河濱公園內草坪係為營造河濱自然景觀以提昇環境及休憩活動品質，雖維護品質良好，但因未設有相關安全防護設施，因此仍不宜開放","u":"臺北市政府工務局水利工程處河川管理科","h":21070,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AED0FF7DB306AC50","d":"2008-07-11","sid":"AED0FF7D"},{"q":"市府目前辦理道路改善工程是否有別於以往的施作方式?方式為何?","a":"臺北市目前辦理道路改善工程，有別於過去順著既有路面高低起伏重鋪面層，而是徹底進行面層下方的路基改善及人手孔的調整，比照快速道路舖面施工方式，於新舖瀝青混凝土作業前，依據設計高程及排水坡度先進行測量，並裝設高程控制線作為舖築基準進行鋪設，所以重鋪後之路面較以往施作方式更為平順，可以說不僅「換膚」更兼具「拉皮」效果。","u":"臺北市政府工務局新建工程處工務科","h":20056,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0D950AD7837A4A07","d":"2017-11-28","sid":"0D950AD7"},{"q":"如何索取河濱自行車道路網圖?","a":"索取「臺北市河濱自行車道導覽圖」\n1.自行前來索取：\n(1)上班時間直接到市政大樓(臺北市信義區市府路1號)7樓東南區水利工程處河川管理科索取\"臺北市河濱自行車道\"導覽摺頁。\n(2)各臺北旅遊服務中心及臺北市河濱自行車租借站均可索取，建議請先電洽確認是否摺頁數量足夠。前述詳細地點可至「臺北旅遊網」(https://www.travel.taipei/)首頁>旅遊諮詢>旅客服務>旅遊服務中心及工務局水利處網站(https://heo.gov.taipei/)首頁>生態河川 幸福水岸>河濱公園設施與服務>我們提供的服務>自行車租借查詢。\n2.附回郵信封方式索取：將回郵信封寄到「臺北市信義區市府路1號7樓東南區 工務局水利工程處河川管理科」收，註明\"索取臺北市河濱自行車道導覽摺頁\"及索取\"份數\" (回郵郵資:1份11元，2-3份16元，4-5份32元，信封:比平信信封略大)。\n3.如需大量索取或有其他疑問，請洽臺北市民當家熱線1999(外縣市02-27208889)轉2693。","u":"臺北市政府工務局水利工程處河川管理科","h":19992,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=62A405C60A67C94E","d":"2008-06-23","sid":"62A405C6"},{"q":"碧山、貴子坑露營場可以生火烤肉嗎？","a":"為避免火星散逸及餘火殘留，影響森林安全，碧山及貴子坑露營場僅開放使用瓦斯炊事爐具。如屬團體包場之專案申請並有提出炭火使用計畫及切結者，不在此限。詳細規定請參考露營場地使用須知。 臺北市露營場地線上申請網址：\n碧山露營場網址：\nhttps://gisweb.gov.taipei/TPCamp/Default.aspx\n貴子坑露營場網址：\nhttps://gisweb.gov.taipei/TPCamp/Default.aspx\n承辦單位：大地工程處森林遊憩科 承辦人： 周以馨 洽詢電話：02-27593001轉3321","u":"臺北市政府工務局大地工程處","h":19333,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CE1021AC30741CED","d":"2011-04-21","sid":"CE1021AC"},{"q":"因天然災害造成的損害(例如被颱風吹倒的路樹砸傷)是否能申請國賠？","a":"一、因屬人力無法抗拒之天然災害所致，非公務員執行職務行使公權力或公有公共設施設置或管理有欠缺，並無因果關係依國家賠償法不予賠償。\n二、若請求權人對拒絕賠償之決定不服，可依國家賠償法第十一條第一項規定，向法院提起損害賠償之訴，並請留意國家賠償法第八條有關賠償請求權二年時效期間之規定。\n1999臺北市民當家熱線（外縣市02-27208889）","u":"臺北市政府工務局公園路燈工程管理處","h":19291,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8496ECA12C67B92C","d":"2026-08-18","sid":"8496ECA1"},{"q":"臺北市河濱公園平時及節慶期間開放燃放鞭炮、施放一般爆竹煙火的場地有那些？","a":"依本府110年6月16日府工水字第1106034257號令修正「臺北市河濱公園開放特別活動管理要點」，自110年7月1日起臺北市河濱公園禁止燃放一般爆竹煙火活動，違者將依「臺北市公園管理自治條例」，按違規次數及情節開罰每次新臺幣2,400元至6,000元。","u":"臺北市政府工務局水利工程處河川管理科","h":18920,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FA2ACE884209BEAE","d":"2008-08-28","sid":"FA2ACE88"},{"q":"於本市河濱公園、堤外高灘地辦理活動等事宜，如何申請？","a":"1.在河濱公園堤外高灘地範圍內舉辦活動或需搭設舞臺、帳篷等設施：\n(1)於堤外高灘地由本市體育局維護管理之運動場範圍內舉辦活動，請向本市體育局申請場地使用，若需搭設舞臺、帳篷等設施，並請向工務局水利處申請許可及向臺北市建築管理工程處申請搭設許可。\n(2)於堤外高灘地之停車場範圍內舉辦活動，請向交通局停管處申請場地使用，若需搭設舞臺、帳篷等設施，並請向工務局水利處申請許可及向臺北市建築管理工程處申請搭設許可。。\n(3)其餘於河濱公園之範圍內舉辦活動，請向工務局水利處申請場地使用，若需搭設舞臺、帳篷等設施，並請向工務局水利處申請許可及向臺北市建築管理工程處申請搭設許可。\n(4)前述活動的舉辦，如有需搭設舞臺(含背板、頂蓋等) 等臨時建築物者，為維護公共安全，則另須依「臺北市展演用臨時性建築物管理辦法」向臺北市建築管理工程處申辦。\n(5)前述活動的舉辦，如有需搭設高度超過6公尺以上之帳篷者，為維護公共安全，亦另須依「臺北市展演用臨時性建築物管理辦法」向臺北市建築管理工程處申辦。\n2. 在河川水面上舉辦活動(如獨木舟、輕艇等)，請依「水域遊憩活動管理辦法」向本市主管機關觀光傳播局申辦，若需於河川水面上設置設施物(如浮動碼頭、浮球、欄索等)，請向觀光傳播局申請活動核可後，再向工務局水利處依水利法申請許可。\n3. 前述各項有須向工務局水利處申請者，請立即線上申請，申請路徑如下，工務局水利工程處(https://heo.gov.taipei)便民服務>市民服務大平臺>臺北市河濱公園場地使用申請(營利性及非營利性活動)>網路申辦>立即線上申辦，登入台北通，填寫線上表單後並附上相關附件。\n4.以上活動經管理機關核准使用場地者，所搭設之舞臺、帳篷等設施物，遇中央氣象局發布海上陸上颱風警報或超大豪雨特報，其警戒範圍包含臺北地區時，自警報或特報發布後四小時內，應自行將活動設施撤離行水區，如未依規定撤離，將依水利法第93條之3規定處罰。","u":"臺北市政府工務局水利工程處河川管理科","h":18168,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6DBFFF0C5DB87147","d":"2008-06-23","sid":"6DBFFF0C"},{"q":"市府花這麼多錢進行道路更新維護，為何只有修補坑洞?","a":"本府辦理路面維護，在進行銑刨老舊瀝青混凝土（即AC）及更新鋪面之前，將會先封閉局部車道，進行路基不良加固改善及人手孔調降等前置作業，所以造成外觀看起來像是修補坑洞，但卻是徹底改善道路「體質」的根本之道，如此可使道路重新鋪設瀝青混凝土後更平、更耐用。","u":"臺北市政府工務局新建工程處工務科","h":17841,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=37CB513EF5DFD24B","d":"2017-11-28","sid":"37CB513E"},{"q":"臺北市政府施工工地，民眾騎車發生事故，如何處理？","a":"1.若屬工地施工時發生事故，應先行將傷者送醫、報警，並依事件狀況尋緊急通報系統通報，並由工務所人員趕赴現場拍照後慰問傷者，並協助善後，必要時協助民眾提出賠償申請。 2.若非施工時發生之事故，應於接獲通報或陳情後，先釐清權責歸屬，視個案狀況派員慰問、勘查拍照，如有必要協助民眾提出賠償申請。","u":"臺北市政府工務局新建工程處工務科","h":17602,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FB9A20728C632C50","d":"2017-11-28","sid":"FB9A2072"},{"q":"如何申請工程設計參考圖？","a":"A：本府工務局頒布之工程設計參考圖，內容包含一般說明、道路工程、水利工程、公園工程、污水下水道工程及大地工程等6大類，相關資料可由工務局全球資訊網首頁/工程技術資訊服務平台網址（ https://eisop.gov.taipei/ ）查詢，民眾不須另行申請，即可自行上網查詢與下載各項資料。","u":"臺北市政府工務局土木建築科","h":17389,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=28F2401C9D6A1084","d":"2009-10-22","sid":"28F2401C"},{"q":"山坡地開發利用，何種情形必須擬具水土保持計畫？","a":"依據水土保持法，於山坡地從事開發建築、修建道路、農業整坡、設置公園、墳墓、遊憩用地、運動場地以及其他開挖整地等行為，皆須擬具水土保持計畫，經目的事業主管機關核轉大地工程處審查","u":"臺北市政府工務局大地工程處","h":17310,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A23EF8CCAEABFC40","d":"2010-03-18","sid":"A23EF8CC"},{"q":"申請基地非位於住二山限區，基地開發前是否須擬具水土保持計畫？","a":"一、住二山限區係依都市計畫規定劃定，與基地開發是否需擬具水土保持計畫無絕對關係。基地如位於本府現行公告本市山坡地範圍，才須擬具水土保持計畫送審。（聯絡電話：2759-1109）。\n二、前揭山坡地範圍，可於大地工程處處網首頁「山坡地資訊整合系統」進入分頁，點選「山坡地範圍查詢」以圖臺方式查詢；或於大地工程處處網首頁「山坡地保育利用資訊查詢系統」進入分頁，輸入地段號即可進行查詢，如有證明文件需求可利用本頁面輸出PDF檔案。","u":"臺北市政府工務局大地工程處","h":17065,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BD5E4E616F65AA9F","d":"2010-03-18","sid":"BD5E4E61"},{"q":"位於路旁的共同管道入口內有警鈴響起，該與何單位聯絡？(假日及平日)","a":"請與新工處轄管共同管道委外廠商所屬總監控中心聯絡，該總監控中心即刻派遣所屬機電人員前往處理。\n基隆河監控中心聯絡電話：(02)-23613541\n新工處共管科聯絡電話：1999(或2720-8889)轉8051。","u":"臺北市政府工務局新建工程處共同管道科","h":16434,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9CF6A7E317B60F42","d":"2025-12-31","sid":"9CF6A7E3"},{"q":"人民辦理慈善公益活動應如何申請使用道路集會處所之同意？","a":"辦理慈善公益活動應依「臺北市使用道路舉辦臨時活動管理辦法」向本府交通局或文化局申請，不適用集會遊行法規定。","u":"臺北市政府工務局新建工程處工程配合科","h":16105,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=60128C5BC00276F7","d":"2017-04-07","sid":"60128C5B"},{"q":"淡水河及基隆河河邊可以垂釣嗎？","a":"釣魚場地：除濕地、碼頭（含救難碼頭）及其上下游各20公尺範圍內，與野雁保護區、自然公園（保留區)、各河系丁壩及消波塊不開放外，其餘地點開放。","u":"臺北市政府工務局水利工程處河川管理科","h":15803,"t":"公園工程","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4BB88C43DAE92484","d":"2008-11-26","sid":"4BB88C43"},{"q":"迪化污水處理廠附設休閒運動公園－汽車停車場收費額度為何？經營公司聯絡電話？","a":"一、收費額度分為（僅供參考，收費額度以現場公告為主）：\n(一)平日8至20時為每半小時10元，時段上限為100元；平日20時至翌日8時為每半小時10元，時段上限為100元。\n(二)假日及國定假日8至20時為每半小時10元，時段上限為300元；假日及國定假日20時至翌日8時為每半小時10元，時段上限為100元。\n(三)汽車全日月票每月4,800元、里民月票優惠價3,840元（重慶里、保安里）、在地里月票優惠價3,360元（老師里、臨江里）。\n二、經營公司聯絡電話：停車場為本府交通局臺北市停車管理工程處管理，並由和雲行動服務股份有限公司經營，其停車場客服專線0809-050-550。","u":"臺北市政府工務局衛生下水道工程處","h":15586,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B145087522D3C200","d":"2010-06-07","sid":"B1450875"}]},{"org":"教育局","total":308,"items":[{"q":"【戶籍】國中學區遷移是否有時間限制?","a":"本局並無規定須設籍於某一國中學區內達一定時間始可就讀該校，惟該校若為額滿國中，則依設籍時間先後分發入學。依據 「臺北市公立國民中學及高級中學附設國中部新生分發及入學辦法」第6條規定:國民中學經教育局核定公告為額滿學校時，其新生分發入學原則如下：\n一、學生與其父母或法定監護人共同設籍於額滿國民中學學區內，持有下列證明文件之一，並提供當年度一月一日至入學資格審查日前之水費及電費收據及當年度五月份之戶籍謄本正本足以證明居住事實者，依設籍先後優先分發入學：\n（一）入學前一年十二月三十一日前設籍於額滿國民中學學區內，學生之二親等內直系血親或法定監護人於同日前持有同址坐落學區內房屋所有權狀證明(以登記日期為準)。\n（二）連續租屋且居住於學區六年以上，並經公證之房屋租賃證明。\n二、依前款規定分發後，國民中學仍有缺額時，則依設籍先後分發至額滿為止，排序方式如下：\n(一)父母或法定監護人與學生共同設籍者。\n(二)父或母與學生共同設籍者。\n三、其餘未分發之學生，應改分發至鄰近國民中學就讀。\n(如有問題請電洽中教科02-2720-8889或1999分機6360)","u":"臺北市政府教育局中等教育科","h":137782,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=09446456DBA6BB54","d":"2014-03-19","sid":"09446456"},{"q":"【轉學】國、高中轉學，是否可以任意中途辦理轉學？或需以學期為基準？","a":"高中：\n1.依據「高級中等學校學生學籍管理辦法」第15條規定，學校辦理學生轉科（學程）或轉學，應於開學前完成。因此，只能在寒暑假參加轉學考轉學，學期中無法轉學。\n2.本市公立高中職於每年暑假辦理聯合轉學考，私立高中職於每年寒暑假各校獨立辦理轉學考。若有轉學之需求，可逕上本局網站查詢本市公立高中聯合轉學考資訊或上國教署建置的「高級中等學校公告轉學資訊網」(http://210.59.13.247/transfer/)查詢本市公私立學校轉學考資訊。\n國中：依據「臺北市公立國民中學學生轉學處理要點」第3點規定學生申請轉學時間不限制，但學期超過三分之二時，得勸其俟學期結束後申請轉學，以利學生學業及學校行政作業；如學生因故不回原國民中學就讀，欲轉入本市國民中學應協助其辦妥轉入手續。 同要點第6點規定略以本市額滿國民中學學期中一律不得招收轉學生，如因學生轉出或其他原因而出現缺額時，應等寒暑假期間方能受理學生轉入。綜合上述本市公立國民中學除額滿學校以外，各校得隨時受理學生辦理轉學事宜。","u":"臺北市政府教育局中等教育科","h":135291,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5BC992DCC28E7EA7","d":"2015-02-02","sid":"5BC992DC"},{"q":"【防疫停課標準】流感停課標準","a":"(一)教職員工/學（幼）生如出現疑似流感症狀應務必配戴口罩，加強手部衛生。\n(二)教職員工如發現疑似罹患流感學（幼）生，應讓其戴上口罩，留置於單獨空間，保持空氣流通，並聯繫家長或協助儘速返家休息及就醫。\n(三)落實「生病不上課、不上班」原則：請感染流感者佩戴口罩，適當休息、補充水分及依醫師指示接受治療，並 建議在家休息5日 ； 如5日內 實有到校之需求，須退燒至少滿24小時 才能返回上課， 並配合佩戴口罩直至相關症狀（咳嗽、肌肉酸痛、流鼻水、喉嚨痛）解除滿24小時為止。\n(四) 如住宿生罹病，除就醫外，於宿舍中應與健康學生分別安置，提供適當照護，直至退燒後至少24小時。\n(五)停課措施： 原則不停課 。\n(六)倘學校為避免疫情擴大，且經評估確切有停課之必要，得由學校召集當事班級之教師、家長或家長代表成立防疫小組，必要時得邀集專家或衛生單位人員，研議防疫措施，並決定是否採取停課措施及日數；停課之決定，應經停課班級半數家長同意，且應同時討論採取混成教學或其他補課方式。\n聯繫電話：\n教保機構：1999分機1434\n國小以上：1999分機6395","u":"臺北市政府教育局體育及衛生保健科","h":131500,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FFA702D1522921BF","d":"2023-02-08","sid":"FFA702D1"},{"q":"【新生入學】國小新生入學通知單何時收到？如尚未收到入學通知單應向哪個單位接洽？","a":"家長在學生入學當年度5月20日前會接到教育局寄發的「學齡兒童入學通知單」，請於當年度5月下旬至6月上旬新生報到期間至學校辦理報到。如為「額滿學校」的新生，逾期未報到者視同棄權，由學校逕行辦理改分發； 倘家長因戶籍遷徙未收到通知單或無法至原學區學校報到，請逕與戶籍所在地（新戶籍）之區公所民政課聯絡辦理入學事宜。\n聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":76065,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=77549CBEB6E0F8A7","d":"2016-03-18","sid":"77549CBE"},{"q":"【學生保健補助】請問臺北市女生生理用品可至哪裡兌換？如何兌換？","a":"一、補助對象：本市 公私立國小高年級（五、六年級） 女性學生 、國中女性學生及 高中職一年級女性學生。\n二、補助方式： 國中女性學生自111年3月起、國小高年級女性學生自112年3月起、 高中職一年級女性學生自 113年8月起 ，每月由酷課雲（酷課APP）系統定期派發2張生理用品兌換券至學生酷課雲帳號，由學生登入帳號即可領用。家長之帳號完成親子綁定，可代孩子兌領。\n三、兌換方式：\n（一）手機酷課APP：登入手機酷課APP後，出示手機條碼兌換。\n（二）網頁版酷課雲：登入電腦酷課雲網頁，列印兌換券兌換。\n（三）超商機台：至超商輸入行動條碼序號，列印小白單兌換。\n四、 兌換地點：自112年3月1日起，全國統一超商、全家便利商店及萊爾富便利商店均可兌換。\n五、 兌換期限：每期兌換期限共有2個月。例如：8月券兌換期限為8月1日至9月30日止。\n六、寒暑假注意事項：本補助案係透過學校校務行政系統識別補助對象，因各校校務行政系統轉換學期或升年級的系統作業時間不一，若寒暑假於酷課雲APP未見兌換券，請耐心等待，俟學校系統作業完成後即可看到。\n七、可兌換品項如附件。 如有疑問請逕洽1999轉1255","u":"臺北市政府教育局體育及衛生保健科","h":73008,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E4D3275682A4BDF3","d":"2023-02-08","sid":"E4D32756"},{"q":"【國小轉學】臺北市國小轉學應如何辦理(分兩種外縣市轉本市及同一市區)?","a":"一、本市學生因家庭戶口遷移，得持戶口證明文件申請轉學。 二、為照顧身心障礙學童，其兄弟姊妹之轉入得由父、母或監護人向教育局提出申請，經核定後得免遷戶籍就讀同一所國民小學。 三、學生轉學依下列程序辦理： （一）學生與父、母或監護人必須先辦妥戶籍遷移，以遷移後之戶籍為轉出入之依據。 （二）學生之父、母或監護人先向原就讀學校申請轉出，持臺北市國民小學學生轉學證明申請書(附件1)至欲轉入學校申請，學校檢查其戶籍資料確屬該校學區無誤後，准其辦理轉入，並以回報單通知原就讀學校。 四、依據「 臺北市公立國民小學新生分發及入學辦法 」及「 臺北市公立國民小學學生轉學注意事項 」，及臺北市教育局108年2月27日北市教國字第1083019012號函規定，辦理轉學作業時請配合下列事項： (一)學生家長「雙方」(或其他指定監護人)須親自到場辦理，且繳驗身分證件，並於申請書簽名；若無法親自到場辦理者，除仍須檢附身分證件外，另須出具委託書。 (若父母均無法到場，須出示2張身分證件及委託書) (二)請備妥轉學佐證文件(依不同轉學原因提供相對應文件證明或不拘形式之入學通知)，以備查驗。 (三)轉學作業代辦委託書如附件檔\n聯絡電話：1999分機6373 臺北市公立國民小學新生分發及入學辦法","u":"臺北市政府教育局國小教育科","h":63644,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=57B53F5B6D6810EC","d":"2019-07-05","sid":"57B53F5B"},{"q":"【數位學生證】數位學生證遺失或毀損該怎麼辦?補卡流程為何?","a":"(一)學生可直接向就讀學校申請學生證掛失及申請補發，亦可透過數位學生證服務整合入口網<申請掛失，若為人為因素毀損需負擔補卡費用113元。\n(二)學校向教育局申請補發後，約5個工作天天完成製卡，完成製卡後可至教育局領取學生證，再轉交予學生。\n********************************************************************************\n數位學生證相關問題之諮詢電話：\n1.數位學生證服務整合入口網：\n2.教育局製卡中心(製卡、補卡、判讀相關問題)：\n3.悠遊卡公司學校掛失專線 (鎖卡、退費、掛失相關問題 )：\n4.政策相關或公文問題：\n請洽業管機關臺北市政府教育局資訊教育科 吳先生\n若尚有其他疑問，可至數位學生證服務整合入口網了解更多相關資訊。","u":"臺北市政府教育局資訊教育科","h":63106,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F9AFD51838E2CF4B","d":"2023-08-01","sid":"F9AFD518"},{"q":"【防疫停課標準】腸病毒停課標準","a":"一、確診個案：\n如發現學（幼）童有疑似感染腸病毒之案例時，應立即對該生進行適當之處置，並通知家長送醫就診，且為防範學（幼）童交互傳染擴大流行，經診斷為腸病毒（含醫師確診及疑似）， 應請學生請假至少7天 ，以降低疾病傳播機會。\n二、停課標準：\n（一） 教保機構 內遇下列情形之一者，發現個案之班級 應 採停課措施：\n1.衛生福利部疾病管制署(以下簡稱疾管署)公布發生腸病毒A71型流行疫情期間，同一班級在一週內有二名以上幼童經醫師診斷為腸病毒感染（手足口病或疱疹性咽峽炎等）時，該班級應停課七天。\n2.無腸病毒A71型流行疫情時，所在行政區經疾管署公布檢出「腸病毒A71型陽性個案」或「年齡滿三個月（含）以上腸病毒感染併發重症個案（不含腸病毒D68型）」，同一班級在一週內有二名以上幼童經醫師診斷為腸病毒感染（手足口病或疱疹性咽峽炎等）時，該班級應停課七天。\n3.發生腸病毒感染併發重症通報個案，且個案檢出腸病毒D68型時，該個案就讀之班級應停課七天。\n4.發生腸病毒感染併發重症通報個案，同一班級在一週內有二名以上幼童經醫師診斷為腸病毒感染（手足口病或疱疹性咽峽炎等）時，該班級應停課七天。\n（二） 學校 原則上無須停課 ，但於疾管署公布腸病毒A71型流行疫情期間，為避免疫情蔓延，若一週內同一班級有二名以上學生，經醫師臨床診斷為腸病毒感染時（含疑似），得由學校召集當事班級之教師、家長或家長代表成立防疫小組，必要時得邀集專家或衛生單位人員，研議防疫措施，並決定是否採取停課措施及日數；停課之決定，應經停課班級半數家長同意，且應同時討論採取混成教學或其他補課方式。\n（三） 短期補習班及兒童課後照顧服務中心 依招收對象適用第一款及第二款停課標準，學校或教保機構舉辦之各項課後活動或課後延長照顧，亦同。\n三、連絡電話：\n教保機構：1999分機1434　顧小姐\n國小以上：1999分機6395　陳小姐","u":"臺北市政府教育局體育及衛生保健科","h":55727,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3C3BB4641126384E","d":"2023-02-08","sid":"3C3BB464"},{"q":"【資優生】本市國小設有一般智能及國中、高中設有學術性向資優班學校？","a":"一、國小：承辦聯絡電話：1999轉3154 蕭小姐\n敦化、民生、民權、光復、三興、博愛、龍安、大安、幸安、仁愛、銘傳、中山、長安、吉林、永安、螢橋、萬大、西門、日新、太平、永樂、大同、胡適、興隆、志清、木柵、北投、逸仙、文化、石牌、關渡、士林、士東、百齡、碧湖、西湖、麗湖、東門、國語實小、市大實小、福星、明湖、南港。\n二、國中：承辦連絡電話：1999轉6343 趙先生\n三、高中學術性向：1999轉1202 盧先生\n人文社會：建中(112學年度起停招)、中山女中\n語文：景美、師大附中\n英語：西松\n數理：建中、北一女、成功、中山女、麗山、永春、大直、政大附中、師大附中","u":"臺北市政府教育局特殊教育科","h":53482,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2868D5C44E7CAB5E","d":"2022-02-08","sid":"2868D5C4"},{"q":"【補習班】有關臺北市補習班是否登記合法立案，如何查詢？","a":"可至臺北市補習班資訊管理系統查詢。 包括補習班行政區、補習班名稱、補習班地址、聯絡電話等項目，民眾只需透過「關鍵字」搜尋功能，亦即行政區、班名、住址，即能清楚顯示所欲查詢之補習班是否立案。連絡電話:1999分機1375、1376、6425、6428 。","u":"臺北市政府教育局終身教育科","h":49888,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F5445DEE63A4CFEA","d":"2024-04-09","sid":"F5445DEE"},{"q":"【新生入學】小朋友幾歲的時候可以進入小學就讀？","a":"小朋友在當年度9月1日（含9月1日當天）滿6足歲，即屬於當年度9月應入小學就讀之學童。 114學年度一年級新生為107年9月2日至108年9月1日（含9月1日當天）出生者。\n聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":48504,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FA1935FD9C7CC6E6","d":"2016-03-08","sid":"FA1935FD"},{"q":"【公幼招生】幼托整合後有哪些公立「幼兒園」可招收2-5歲幼兒？","a":"1.本市公立幼兒園包含：公立國民小學附設幼兒園、市立幼兒園及國立大學附設實驗國民小學附設幼兒園（政大實幼、國北實幼）。\n2.本市公立幼兒園招生，於每年5月下旬、6月上旬統一招生，凡設籍本市（原住民、經社政主管機關安置及教職員工子女，得免設籍本市） ，或居留本市之外籍、華裔2-5歲幼兒，可於招生登記時間，逕上 臺北市招生e點通網站 登記報名，該招生相關資訊，歡迎至本局網站首頁 〉最新消息 〉幼兒園查詢或本局學前教育資源網查詢（每年1月下旬公告） 。\n3.民眾倘仍有疑問，請逕洽本局承辦人1999轉6381或各公立幼兒園詢問。","u":"臺北市政府教育局學前教育科","h":47665,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=50D5E56B981149AB","d":"2019-02-20","sid":"50D5E56B"},{"q":"【轉學】國中生如何辦理轉學進入臺北市學校？臺北市國中轉學應如何辦理?","a":"1.凡申請轉入本市國民中學者應設籍本市，由家長填具申請書並附轉學證明書、成績證明書、學籍紀錄表、入學回覆信函（以上資料由轉出國民中學提供）及戶口名簿向擬轉入國民中學申請，擬轉入國民中學檢查其戶籍確屬該校學區無誤後，准其辦理轉入﹔學生申請轉學時間不限制。\n2.倘欲轉入之國中業經本局公告額滿，則填發額滿國民中學轉介單交予家長，改分發至鄰近國中就讀。\n(如有問題請電洽中教科02-2720-8889或1999分機6360)","u":"臺北市政府教育局中等教育科","h":47037,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D0FF5816E89E580E","d":"2024-04-08","sid":"D0FF5816"},{"q":"【新生入學】小朋友符合哪些條件，可以「優先」分發至「額滿學校」？","a":"小朋友必須「完全符合」下列3項條件，才可以優先分發「額滿學校」，不符合其中一項，都不能優先分發︰\n1.小朋友、爸爸及媽媽三人（或小朋友跟監護人）要在當年度3月20日前，共同設籍在「額滿學校」學區內同一戶籍。\n2.小朋友實際住在「額滿學校」學區內，而不是寄居。\n3.具備下列其中一項證明文件︰\n(1)小朋友的父母、祖父母或外祖父母（或監護人）持有的學區內同址房屋所有權狀證明，且房屋所有權狀證明是在小朋友入學前一年12月31日前取得。\n(2)小朋友的父母、祖父母或外祖父母（或監護人）持有的學區內連續居住3年以上，經公證的房屋租賃契約證明（連續三年之計算方式為當前度前三年之3月20日前迄今）。並提供當年度1月1日至入學資格審查日前（約4月中旬），足以證明居住事實之水費及電費收據。\n另外下列情形之小朋友，亦屬於可以優先分發入學之對象︰\n1.小朋友的母親符合「臺北市原住民婦女扶助自治條例」第三條規定，且經臺北市政府原住民族事務委員會核發證明文件，並有居住事實者。\n2.小朋友的父母或法定監護人持有本市社會局核發當年度低收入戶第○、一或二類證明，並有居住事實者。\n符合上述情形之小朋友，請於額滿審查期間持證明文件至學校辦理審查作業。\n聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":44500,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4850C3D90E8D6BC7","d":"2016-03-23","sid":"4850C3D9"},{"q":"【財團法人】財團法人有那些事項必須向法院辦理變更登記及其流程為何？","a":"一、變更董事（包括任期屆滿或任期中補選聘）\n二、變更財產總額\n三、變更會址\n召開董事會議\n向本局申請驗印\n向地方法院申請變更\n法院發給變更後法人登記證書\n四、修正捐助章程\n召開董事會議\n向本局申請驗印\n向地方法院聲請民事裁定後，再申請變更登記\n法院發給裁定書及變更後法人登記證書\n以上資訊為臺北市政府教育局所提供，相關問題可電洽02-27208889分機6422及6426，倘非本局所轄基金會請逕洽主管機關，倘為法院登記相關業務請逕洽轄管地方法院。","u":"臺北市政府教育局終身教育科","h":43656,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BDAF3C1C321E0866","d":"2017-05-04","sid":"BDAF3C1C"},{"q":"【課後延長照顧】公立幼兒園上課時段？是否有延托時間？費用為何？","a":"一、本市公立幼兒園教保活動課程時間為上午8時至下午4時。\n二、本市公立幼兒園為協助雙薪家庭父母安心就業，並使幼兒於課後獲得妥善照顧，只要幼兒有課後延長照顧服務需求，幼兒園均會辦理 ，時間為下午4時至6時30分。\n三、幼兒每學期應繳金額之計算標準：依《教育部國民及學前教育署補助公立幼兒園辦理延長照顧服務作業要點》規定辦理相關收費，其收費標準如下：\n1. 課後延長照顧服務：採每月參加者，每小時新臺幣（以下同）三十五元，半小時二十元；經濟需要協助幼兒，免收費。 2. 寒、暑假加托服務：採每月參加者，每月二千元；採部分日數參加者，每日一百二十元；經濟需要協助幼兒，免收費。 3. 幼兒臨時參加者，其課後延長照顧服務，每小時以五十元計，半小時以三十元計，寒、暑假加托服務，每日以二百四十元計。","u":"臺北市政府教育局學前教育科","h":42672,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EA2EF6649CC6E101","d":"2023-06-21","sid":"EA2EF664"},{"q":"【新生入學】何謂「居住事實」？","a":"「居住事實」證明必須檢附自有房屋所有權狀、法院或經法院授權民間公證單位開之公證租賃證明、家長之水電費及電話費收據證明…等相關居住證明文件。\n聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":41265,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C94AA648027524DE","d":"2016-03-18","sid":"C94AA648"},{"q":"【新生入學】何謂「大學區學校」？如何申請？要遷戶籍嗎？","a":"（1）教育局 基於推動教育實驗方案、 充分運用教育資源 或考量相關政策等因素 ，得公告指定 特定學校 為大學區制學校。 （2）115學年度大學區學校包括：中山區大佳國小、士林區陽明山國小、士林區雨聲國小、士林區平等國小、士林區雙溪國小、北投區湖山國小、北投區桃源國小、北投區大屯國小、大安區公館國小，不受原劃訂學區之限制。 （3）設籍於臺北市之學童向得前項學校 申請 就讀， 學校將以該校訂定之錄取原則排序，並公告錄取名單。各校之錄取原則應以 原劃定學區之學生為優先。\n聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":37720,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=967B23BD3A61808D","d":"2016-03-08","sid":"967B23BD"},{"q":"【學力鑑定】如何取得高職同等學力？","a":"需參加 自學進修技術性高級中等學校畢業程度學力鑑定考試 ，報名資格︰ 1. 取得丙級技術士證或相當於丙級技術士證之資格，具有3年以上之工作經驗。 2. 取得乙級以上技術士證或相當於乙級技術士證之資格後，具有1年以上之工作經驗。 3. 考試科目：國文、英文、生活領域(計算機概論、生涯規劃、法律與生活)。 4. 相關資訊：每年10月辦理一次，出題以現行技術型高級中等學校近3個學年之部定必修課程為範圍，採現場及通訊報名，相關報名事宜可於每年8月中旬電洽本局終身教育科(1999轉1375)或松山家商(27261118轉201、202或220)。","u":"臺北市政府教育局終身教育科","h":36648,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0CB779D247321238","d":"2024-04-09","sid":"0CB779D2"},{"q":"【藝術才能班】本市設有藝術才能班(音樂、美術、舞蹈、戲劇)學校","a":"國小：（一）音樂班：敦化國小、古亭國小、福星國小。（二）美術班：民族國小、建安國小、東園國小、天母國小(113學年度新設)。（三）舞蹈班：東門國小、永樂國小。承辦聯絡電話 1999轉3154 國中：（一）音樂班：仁愛國中、南門國中、國立師大附中（國中部）、建成國中。（二）美術班：金華國中、五常國中、古亭國中、百齡高中（國中部）。（三）舞蹈班：北安國中、雙園國中。承辦連絡電話：1999轉6343 高中：（一）音樂班：中正高中、復興高中、國立師大附中（高中部）。（二）美術班：中正高中、復興高中、明倫高中、國立師大附中（高中部）。（三）舞蹈班：中正高中、復興高中。(四)戲劇班：復興高中，承辦聯絡電話：1999轉1202","u":"臺北市政府教育局特殊教育科","h":36534,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4E0F5B2B92800CF4","d":"2022-02-08","sid":"4E0F5B2B"},{"q":"【國小轉學】外籍小孩或大陸地區小孩要轉回臺北市學校就學國小需如何辦理?應具備哪些文件?","a":"依教育部訂頒「 外國學生來臺就學辦法 」，應檢送外僑（外籍）國小適齡兒童入學申請書及外僑(外籍)居留證影本，依學童居留證之地址逕向其學區學校申請辦理轉入學。\n另大陸籍學童來臺就學應檢附護照、居留證及成績證明文件逕向所屬學區之學校申請就讀；惟依新修訂之「 臺灣地區與大陸地區人民關係條例 」(兩岸人民關係條例)，已開放大陸配偶前婚姻子女及大陸專業人士申請同行來臺之未滿十八歲子女，均得申請就讀與其學歷相銜接之國民中、小學，學童若未能取得居留證者，得視情個案情形開放以學童大陸地區人民多次入出境證辦理就學。聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":34840,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CAA403836478BEC9","d":"2013-05-13","sid":"CAA40383"},{"q":"【特教生就學】什麼是「分散式資源班」？","a":"安置於學校普通班就讀之特殊教育學生，大部分時間在普通班級上課學習，但依其能力與狀況安排部分時間到特殊教育班(即分散式資源班)接受彈性化、個別化的課程教學及特殊教育相關服務，協助學生在普通班就讀能順利融合與學習。如民眾有相關問題，請洽教育局特殊教育科，電話：02-27208889轉6344(高中)或6345(國中)或6346(國小)。","u":"臺北市政府教育局特殊教育科","h":32249,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=845D011DC82E5CD8","d":"2018-05-14","sid":"845D011D"},{"q":"【補習班】補習班退費規定？目前是否有修正規定？","a":"「 臺北市短期補習班管理規則 」業經臺北市政府108年4月30日臺北市政府(108)法府綜字第1086015055號令修正發布實施，有關補習班退費規定第9條修正如後，補習班學生繳納費用後離班者，應依下列規定退費：（計算方式以雙方約定費用為準）\n補習及進修教育法\n※修業期間逾六個月以上一年以下者，應分為二期；逾一年者，應分為三期，每期不得逾六個月。收費超過分期規定者，該期部分適用前項規定退費，其餘所收費用應全額退還。\n倘有相關問題請電洽1999分機1375、1376、6425、6428","u":"臺北市政府教育局終身教育科","h":30964,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E1365C359348DE9E","d":"2024-04-09","sid":"E1365C35"},{"q":"【轉學】國、高中休學規定如何？什麼情況學生學校可以要求學生轉學？","a":"1.國中﹕並無休學。學生倘有搬遷事實，得申請轉學。\n2.高中︰學生因故得向學校申請休學，經輔導並審查通過者，發給休學證明書。另尚無學校要求學生轉學相關規定。\n如有問題請電洽中教科02-2720-8889或1999，國中分機6360、 高中02-27208889#1260。","u":"臺北市政府教育局中等教育科","h":30176,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1D1BE5D8251CD42F","d":"2012-02-01","sid":"1D1BE5D8"},{"q":"【新生入學】如果小朋友的學區是「額滿學校」，跟一般學校在分發上有什麼不同嗎？","a":"「額滿學校」因可容納新生人數有限，分發方式與一般學校不同，分發前會先辦理「額滿學校」優先分發資格審查： （1）學校被宣布為「額滿學校」，表示學區內的新生人數已經超過學校可以容納的人數，為維護教師教學及學生學習品質，學校只能收到額滿為止。因此「額滿學校」必須先確認小朋友有沒有實際住在學區內，才依小朋友的優先分發條件及設籍先後，依序分發。 （2）由於「額滿學校」可容納的人數有限，必須確保實際居住於學區內小朋友的就學權益。因此，教育局訂定優先分發的規定，並於每年4月第4週，辦理「額滿學校」優先分發資格審查。 （3）為維護有實際居住事實小朋友的就學權益，凡是以「寄居」身分設籍在額滿學校學區內，沒有居住事實的小朋友，都無法分發至「額滿學校」就讀。\n聯絡電話：1999分機6373","u":"臺北市政府教育局國小教育科","h":30088,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64F241649D204636","d":"2016-03-23","sid":"64F24164"}]},{"org":"商業處","total":218,"items":[{"q":"營利事業登記證廢止原因及時間為何？廢證後商業登記證明文件為何?","a":"1.廢止營利事業統一發證制度之肇因為監察院87年6月8日（87）院台財字第872200287號函建議行政院：「建議採行『登記與管理分離』原則及廢除營利事業統一發證制度，消除保護交易安全登記制度遭利用作為管理工具之現象」。行政院於98年3月12日院臺經字第0980006249D號令核定：營利事業統一發證制度之施行期限至98年4月12日止，即自98年4月13日起營利事業登記證不再作為證明文件，而以「商業登記證明文件」取代之。\n2.所謂商業登記證明文件則指：登記機關核准商業登記之核准函、商業登記抄本、「全國商工行政服務入口網」（網址： https://gcis.nat.gov.tw ）商工登記資料之商業登記資料查詢網站之「商業登記基本資料」、或依商業登記法第25條規定請求商業所在地主管機關就已登記事項發給之證明書。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6491或6485洽詢。","u":"臺北市商業處","h":265674,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=692E25D39DD7D944","d":"2016-04-25","sid":"692E25D3"},{"q":"停業、解散、撤銷差別為何？","a":"1.停業：公司暫停營業1個月以上者，應於停止營業前或停止營業之日起15日內申請停業登記，每次最長不得超過1年，並於復業前或復業後15日內申請復業登記（如依加值型及非加值型營業稅法規定申報核備者，不在此限）。\n2.解散：公司之解散，在有限公司經全體股東同意；股份有限公司經股東會決議（由代表已發行股份總數三分之二以上股東出席，以出席股東表決權過半數同意行之），公司解散後即應依公司法第24條規定辦理清算，且向主管機關申請解散登記，並經核准，既告確定，不得申請恢復原登記。\n3.撤銷：公司設立登記資本額涉虛偽不實或登記文件涉及偽、變造，經法院裁判確定後由檢察機關通知中央主管機關撤銷登記。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":229771,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=962053ADC22E0555","d":"2008-06-25","sid":"962053AD"},{"q":"如何查詢公司營業項目代碼及申辦公司名稱及所營事業預查？","a":"查詢公司營業項目代碼請至「公司行號及有限合夥營業項目代碼表檢索系統」直接輸入網址： https://gcis.nat.gov.tw/cod/ ，鍵入查詢條件即可。又公司名稱及所營事業預查申請應向經濟部中部辦公室辦理或至公司與商業及有限合夥一站式線上申請作業(網址： https://onestop.nat.gov.tw/oss/welcome/Welcome/index.do )，表單及相關訊息請參考「全國商工行政服務入口網」（ https://gcis.nat.gov.tw/mainNew/index.jsp ）點選主要業務/公司與有限合夥名稱預查/公司預查申辦業務說明。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":116291,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BC3158FEA81BB4D3","d":"2009-05-01","sid":"BC3158FE"},{"q":"如何申請公司英文證明書?","a":"公司登記基本資料英文證明項目有限公司為：公司名稱加中文名稱、資本總額NT$、董事或董事長姓名、公司所在地、設立日期、所營事業、統一編號；股份有限公司為：公司名稱加中文名稱、資本總額NT$、分為幾股、每股金額NT$、實收資本額NT$、董事長姓名、公司所在地、設立日期、所營事業、統一編號，申請時應檢附申請書並加蓋原留之公司及負責人印章、公司登記基本資料英文譯本一份（申請人可以利用臺北市商業處網站（網址： https://www.tcooc.gov.taipei/ ）公司及商業登記→公司登記主題網→公司影印/抄錄/證明書及查閱→應備文件下載(所營事業使用單位不需要時可省略，若需要時請逐項翻譯)，向商業處辦理。除書面外，併請儲存以電子檔提供或E-mail本處登記服務科(電子信箱：cx_tcooc2@gov.taipei)，1份英文證明書規費600元(同次申請相同證明書第2份起每份100元)。櫃檯服務時間： 週一至週五8：30至17：30（中午不休息，號碼機17:15關閉），17:00後不受理隨到隨辦 。如仍有疑問可於上班時間：上午8時30分至下午17時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":103966,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F761A254338ADA8B","d":"2009-07-27","sid":"F761A254"},{"q":"如何成立個人工作室，應備文件？流程？","a":"個人出資成立工作室，得依公司法第98條規定由一人以上股東所組成。 成立有限公司，另依同法第7條規定，設立登記之資本額，應先經會計師查核簽證，出具資本繳足之查核報告書辦理；亦可依商業登記法成立獨資事業經營該工作室，惟商業資本額如達新臺幣25萬元以上，請檢附資本證明文件（存摺或對帳單或存款證明影本），以上2種組織型態均屬1人投資之事業，可依個人需求選擇適合之組織型態申請登記。\n（一）獨資事業：負責人應先以臨櫃、郵寄或於公司與商業及有限合夥一站式作業系統（網址： https://onestop.nat.gov.tw ）線上申請方式辦理商業名稱及所營事業預查，經核准保留後，依商業登記法暨商業登記申請辦法相關規定備齊申請書表（可至本處 商業登記主題網 點選申請項目，提供申請須知、填寫範例及表格下載），以臨櫃、郵寄或於公司與商業及有限合夥一站式作業系統線上申請方式辦理。\n（二）有限公司：應先向經濟部商業發展署-南投辦公區以臨櫃、郵寄或於公司與商業及有限合夥一站式作業系統（網址： https://onestop.nat.gov.tw ）線上申請方式辦理公司名稱及所營事業預查，經核准保留後，依公司法暨公司登記辦法相關規定備齊申請書表（可至本處 公司登記主題網 選申辦項目，提供申請須知、填寫範例及表格下載），以臨櫃、郵寄或於公司與商業及有限合夥一站式作業系統線上申請方式辦理。\n(三)公司或商號於登記前，請先至營業場所預先查詢系統( https://reurl.cc/yyGaRO )查詢，其登記所在地(營業場所)應符合都計、建管法令規定，並隨案附送回復表。\n如仍有疑問，可於上班時間：上午8時30分至下午17時30分利用臺北市商業處為民服務電話：02-27208889/1999轉6491或6485洽詢。","u":"臺北市商業處","h":102485,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8D63979C534B3F1E","d":"2008-12-11","sid":"8D63979C"},{"q":"擔任董事、監察人、股東有何資格限制?","a":"一、公司股東係具有法人或自然人身分，有限公司由1人以上股東所組成，其董事就有行為能力之股東中選任之；股份有限公司應有2人以上為發起人，無行為能力人或限制行為能力人，不得為發起人，其董事、監察人之選任由股東會就有行為能力之人選任之(依民法規定滿18歲為成年人，即有行為能力之人，另未成年人已結婚者，亦為有行為能力之人)。\n二、又依公司法第30條規定， 有下列情事之一者，不得充經理人，其已充任者，當然解任：\n(公司法第108條有限公司董事及第192條、第216條股份有限公司董事、監察人之委任準用之)\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":98318,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=89A157313882E4E6","d":"2008-06-25","sid":"89A15731"},{"q":"有限公司負責人變更(改推董事)應備證件及如何填寫？","a":"依公司法第108條規定，有限公司改推董事，應經3分之2股東之同意，就有行為能力之股東中選任之，如涉及董事出資轉讓則依公司法第111條規定，需經其他股東表決權3分之2以上之同意並修正公司章程，申請人可以利用臺北市商業處網站（網址： https://tcooc-co.gov.taipei/ ）「業務資訊」（或公司登記主題網）項下之「公司登記」點選申請項目，逐項提供「申請須知」、「填寫範例」及「表格下載」，查詢申請事項之作業規範、書表填寫方式及空白表單下載。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":89376,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4C96E38B286D9CE0","d":"2008-10-01","sid":"4C96E38B"},{"q":"公司辦理印鑑變更登記，需準備什麼文件？","a":"公司（或負責人）印章變更，申請書蓋具新公司及負責人印章，並檢附印鑑對照表（或遺失切結書）及登記表1式2份，申請辦理公司（或負責人）印鑑變更報備（免規費）。 如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":70447,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9027BC0D9C208E87","d":"2020-01-06","sid":"9027BC0D"},{"q":"公司登記地址與實際地址不合時，此行為會有罰則嗎？","a":"民法第29條規定：「法人以其主事務所之所在地為住所。」又公司法第3條第1項規定：「公司以其本公司所在地為住所。」公司及商業登記之所在地係為法律關係之中心地域，舉凡債務之清償、訴訟之管轄及書狀之送達均以所在地為依據，尚非為營業行為之發生地。是以公司之住所為公司法律關係之準據點，亦為公司業務中樞，故公司主事務所之所在地，自應以一處為限。公司另於不同地點營業，應否辦理分公司登記，則應視其是否具備公司法第3條所稱分公司之性質而斷，如該地點之營業確具分公司性質者，自宜辦理分公司登記，如非屬分公司性質者，則無需辦理分公司登記，俾符實際。至其違規營業行為罰鍰部分，應視是否違反營業稅法、建管、消防、衛生等相關法令，由各權責機關依法辦理。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":68861,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=100EDD0CB8093900","d":"2008-10-03","sid":"100EDD0C"},{"q":"工商憑證如何申請？","a":"1.進入經濟部工商憑證管理中心（https://moeaca.nat.gov.tw/other/index.html）填寫申請書資料，上傳憑證申請資料(繳交費用新臺幣420元)，繳費後於「IC卡申請進度查詢」中確認是否為”已經有申請資料，等待正式申請文件(公文)”，若繳費10分鐘後仍未出現前述狀態請連絡客服人員（412-1166）。\n2.列印申請書並蓋用印鑑（應蓋用與原登記公司印鑑及負責人印鑑）。\n3.申請書郵寄或親臨公司所屬登記機關送件申請。\n4.核准後由憑證管理中心簽發憑證並印製IC卡郵寄(以公司登記所在地的地址寄送)。\n5.憑證IC卡進行開卡(憑證簽發180天內開卡)。(主辦單位：經濟部；執行單位：中華電信股份有限公司；客服電話：4121166)\n如仍有疑問可於上班時間：經濟部工商憑證管理中心4121166，直接撥打毋需加撥區碼(六碼地區請撥 41-1166)，行動電話請加撥02。或利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。上午8時30分至下午5時30分（中午不休息）。","u":"臺北市商業處","h":64511,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F72CA7CB2C5D8655","d":"2008-06-25","sid":"F72CA7CB"},{"q":"申請設立公司的負責人有無年齡上的限制？及其他消極資格限制？","a":"一、依公司法規定有限公司之董事係就有行為能力之股東選任之，股份有限公司之董事由股東會就有行為能力之人選任之。又依民法規定滿18歲為成年人，即有行為能力之人，另未成年人已結婚者，亦為有行為能力之人。(110.01.13  公布修正民法之第12條條文滿18歲為成年。自中華民國112年1月1日施行。)\n二、又依公司法第30條規定，有下列情事之一者，不得充經理人，其已充任者，當然解任：\n(公司法第108條有限公司董事及第192條、第216條股份有限公司董事、監察人之委任準用之)\n1.曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行、尚未執行完畢，或執行完畢、緩刑期滿或赦免後未逾五年。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":59338,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2E1BBBFC9415196D","d":"2009-06-03","sid":"2E1BBBFC"},{"q":"公司和商業有何不同？","a":"公司係指依公司法規定組織登記成立之社團法人，股東就其出資額負責（無限公司除外）；而商業登記法所稱之商業，也就是一般所指的商號（行號），是指以營利為目的之獨資或合夥經營事業，負責人或合夥人負無限責任。而公司與商號雖然均是以營利為目的，二者除了名稱不同之外，所依據之法源、組成分子之責任負擔亦不相同。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6491或6485洽詢。","u":"臺北市商業處","h":54147,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3E30224FA879F428","d":"2009-04-14","sid":"3E30224F"},{"q":"請問在自己家裡做手工食品，是否一定要有商業登記才可以在市面或網路販售？","a":"按商業登記法第4條規定：「商業除第5條規定外，非經商業所在地主管機關登記，不得成立。」第5條規定：「下列各款小規模商業，得免依本法申請登記：1、攤販。2、家庭農、林、漁、牧業者。3、家庭手工業者。4、民宿經營者。5、每月銷售額未達營業稅起徵點者。」即獨資、合夥事業若非前述得免辦理登記者，於開業前應依商業登記法規定申辦商業登記，若未合法登記即行營業，主管機關可依商業登記法第31條規定予以處分。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6491或6485洽詢。","u":"臺北市商業處","h":53053,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3767A289B41FEB1","d":"2009-04-14","sid":"D3767A28"},{"q":"擔任商號負責人有無資格限制？如為外籍人士(外國人、華僑或大陸地區人民)應檢附何文件申辦？","a":"一、自然人始得經營商業並擔任負責人 1. 商業登記法第8條第1項第6款及第7款之立法意旨，係指自然人始得經營商業，又依公司法第13條第1項之規定，公司不得為合夥事業之合夥人，是以政府法人及公司法人自不得投資經營商號。另政府機關、社會團體及社團法人均不得為獨資、合夥事業之商業負責人或合夥人，自無商業登記法之適用。（經濟部89年9月18日經商字第89218645號函）、（經濟部92年11月12日經商字第09202436830號函）、（經濟部92年12月25日經商字第09202442630號函)。 2. 限制行為能力（未成年人）擔任負責人時，應檢附法定代理人之同意書【商業登記法第11條；法定代理人依民法第1086條規定父母為其未成年子女之法定代理人、第1098條規定監護人為受監護人之法定代理人】。 二、外籍人士應檢附之文件 外國人、華僑或大陸地區人民投資獨資或合夥商業，並為商業之負責人或合夥人，應分別依「外國人投資條例」、「華僑回國投資條例」、「大陸地區人民來臺投資許可辦法」之規定，檢附經濟部投資審議司核發之核准或許可文件影本1份及下列文件之一辦理： 1.在台居留證影本。 2.駐外單位簽證之國籍證明書，並載明住居所。 3.該國政府機關出具之文件，無須經我國駐外單位簽證(如：護照影本、日本之戶籍證明)。 4.本人出具聲明書(包括國籍、身分證明等)，經該國駐中華民國境內機構簽證(如美國在台協會)，或經我外交部駐外單位簽證，或經我法院公證。 上述官方之證明文件未記載申請人地址，可由申請人自行加註住居所地址並簽名或蓋章(由本人簽名或蓋章，或蓋商號及負責人章)。(98.7.3經審字第09802085680號令及經濟部99.4.12經商字第09902321840號函)。 如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6491或6485洽詢。","u":"臺北市商業處","h":49951,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D72F6DCA136680EF","d":"2009-04-14","sid":"D72F6DCA"},{"q":"可否申請變更登記表的英文版?","a":"英文證明書係就公司登記資料現況核發之證明書，並無「英文版抄錄變更登記表」申請項目，「如何申請公司英文證明書」相關答覆內容請另查詢FAQ題庫。如仍有疑問可於上班時間：上午8時30分至下午5時30分（下午17時後不受理隨到隨辦案件）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":49687,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=85559C98CA56B162","d":"2009-09-10","sid":"85559C98"},{"q":"公務人員能否擔任公司股東或公司之董事或監察人？","a":"一、公務員服務法第14條規定：「公務員不得經營商業。前項經營商業，包括依公司法擔任公司發起人或公司負責人、依商業登記法擔任商業負責人，或依其他法令擔任以營利為目的之事業負責人、董事、監察人或相類似職務。但經公股股權管理機關（構）指派代表公股或遴薦兼任政府直接或間接投資事業之董事、監察人或相類似職務，並經服務機關（構）事先核准或機關（構）首長經上級機關（構）事先核准者，不受前項規定之限制。公務員就（到）職前擔任前項職務或經營事業須辦理解任登記者，至遲應於就（到）職時提出書面辭職，於三個月內完成解任登記，並向服務機關（構）繳交有關證明文件。但有特殊情形未能依限完成解任登記，並經服務機關（構）同意或機關（構）首長經上級機關（構）同意者，得延長之；其延長期間，以三個月為限，惟於完成解任登記前，不得參與經營及支領報酬。公務員所任職務對營利事業有直接監督或管理權限者，不得取得該營利事業之股份或出資額。公務員就（到）職前已持有前項營利事業之股份或出資額，應於就（到）職後三個月內全部轉讓或信託予信託業；就（到）職後因其他法律原因當然取得者，亦同。」\n二、87年7月15日「研商公司、商業登記主管受理公司、商業登記時，有無必要審查公務員違反公務員服務法第13條之規定情事」會議決議：為因應戶籍法修正刪除身分證職業欄之記載，及配合政府再造簡化書表作業，不再配合審查有無公務員違反公務員服務法規定情事。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":49056,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9E5934082B5F8192","d":"2008-12-11","sid":"9E593408"},{"q":"公司或負責人印章遺失如何辦理？","a":"公司（或負責人）印章遺失，由代表公司負責人切結聲明，備妥申請書、印鑑遺失切結書及登記表一式2份，申請辦理公司（或負責人）印鑑變更報備（免規費）。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":46709,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=464739C8562E00D3","d":"2008-10-01","sid":"464739C8"},{"q":"股東會議需幾人以上出席，才能開股東會議?","a":"依公司法第174條所規定，股份有限公司股東會表決權係以股份數為據，並非以股東人數為據，股東不過為股份之行使人而已，故如一股東持有過半數以上之股份，即已超過召開股東會所需股數時，由其一人出席股東會作成之決議，應屬有效。股東會決議以股東持有過半數以上之股份出席及過半數同意，為普通決議，另股東會決議以股東持有股份三分之二以上出席過半數同意，為特別決議，股東會如需經特別決議，公司法均明文規定之，例如第156條之1、第159條、第185條、第240條、第241條、第277條、第356條之13等；如未明定，經普通決議即可。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":43092,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7DD43FF8A9F75129","d":"2009-07-27","sid":"7DD43FF8"},{"q":"登記服務櫃檯受理隨到隨辦案件類別？","a":"為民服務綜合櫃檯全面提供商業登記申請案件及公司登記速件案件隨到隨辦服務 公司登記案件隨到隨辦服務項目說明如下：","u":"臺北市商業處","h":40013,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7A2FC1C8A9CDD1A5","d":"2010-10-19","sid":"7A2FC1C8"},{"q":"商業設立或增資其資本額證明文件為何？","a":"一、商業申請設立或資本額增加變更登記時，資本額達新臺幣25萬元（含）以上者，始須檢附資本額證明文件，其資本額證明文件為存摺或銀行對帳單或查詢單等，毋庸檢附會計師查核簽證之相關文件。\n二、商業之資本應存入以商業名義開立之帳戶，至於商業未核准登記前得以商業籌備處之名義為之。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6491或6485洽詢。","u":"臺北市商業處","h":39229,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A95C5558BBD42368","d":"2009-04-14","sid":"A95C5558"},{"q":"一個營業地址最多可設置幾家公司行號？","a":"有關總公司與分公司設在同一地址，及同一地址申請二個以上同業務性質之公司、商業登記，查公司法、商業登記法尚無禁止之規定。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":39157,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE45E2F593CC14B5","d":"2009-06-03","sid":"AE45E2F5"},{"q":"董事會以視訊方式開會，開會地點無任一董事出席，是否可行？簽到簿應如何簽署？","a":"董事以視訊方式參與董事會，視為親自出席，開會地點並無任一董事出席，允屬可行，另毋須於董事會簽到簿簽名，僅記載視訊會議即可。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":39074,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B90051CAFB4EE012","d":"2009-05-01","sid":"B90051CA"},{"q":"八大行業各業之定義說明","a":"一、舞廳業： 指提供場所，備有舞伴供不特定人跳舞之營利事業。 二、舞場業： 指提供場所，不備舞伴供不特定人跳舞之營利事業。 三、酒家業： 指提供場所，供應酒、菜、或其他飲食物，並備有陪侍服務之營利事業。 四、酒吧業： 指提供場所，備有服務生陪侍，供應酒類、飲料之營利事業。 五、特種咖啡茶室業： 指提供場所，備有服務生陪侍，供應飲料之營利事業。 六、視聽歌唱業: 指提供伴唱視聽設備，供人歌唱之營利事業。但不包括該設備內置於可移動式獨立空間，無人服務且由消費者以自助付費使用者。 七、夜店業: 指提供酒精類飲料與音樂，及提供演奏或表演等服務，並備有聲光、座位及舞池等設施，且主要營業時間為夜間至次日凌晨之營利事業。 八、三溫暖業: 指提供冷、熱水池、蒸烤設備，供人沐浴之營利事業。","u":"臺北市商業處","h":38041,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0556B1B5495EE9A9","d":"2020-05-26","sid":"0556B1B5"},{"q":"股份有限公司董事、監察人選任及續任相關事宜","a":"一、公司法第195條及第217條規定股份有限公司董事、監察人任期不得逾三年。但得連選連任。任期屆滿而不及改選時，延長其執行職務至改選董事、監察人就任時為止。\n二、股東會選任董事、監察人之決議依公司法第174條規定，應有代表已發行股份總數過半數股東之出席，以出席股東表決權過半數之同意行之，並依公司法第198條規定，每一股份有與應選出董事人數相同之選舉權，得集中選舉一人，或分配選舉數人，由所得選票代表選舉權較多者，當選為董事，監察人選任亦同。\n如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":37458,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3E64326A4D7650DC","d":"2008-10-03","sid":"3E64326A"},{"q":"公司變更登記規費？","a":"如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：02-27208889/1999轉6485或6491洽詢。","u":"臺北市商業處","h":36461,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=36B7FF64AA258E47","d":"2008-06-25","sid":"36B7FF64"}]},{"org":"自來水事業處","total":216,"items":[{"q":"自105年3月1日起水費應繳總金額如何計算?","a":"應繳總金額＝用水費＋基本費＋水源保育與回饋費＋代徵污水下水道使用費（接用污水下水道系統用戶）＋加壓設備維護管理費（本處接管集合社區及配合市辦山坡地重劃之自來水用戶）。\n說明： 1.市政用水照5折計收。 2.臨時用水加50%計收。 3.表內單價依照加值型及非加值型營業水法之規定內含5%營業稅。 4.水費金額計算至元為止，元以下按四捨五入計算。\n點我查看105年3月1日以前水費應繳總金額如何計算?","u":"臺北自來水事業處業務科","h":390872,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=451916B5DE7ECE31","d":"2016-05-20","sid":"451916B5"},{"q":"用戶家中發現無(缺)水怎麼辦？","a":"如何查詢自來水處施工停水消息?\n1.請連結本處網站停水通知網頁，可依停水日期及地址查詢本處停水狀況。\n2.若因施工需辦理停水，施工前會於停水區域張貼停水公告並通知里長，若為重大範圍停水，會將停水訊息於傳播及新聞媒體播放刊載。\n檢查家戶用水設備\n如您無法先自行檢查，請電87335678洽水處客服人員，說明無水情況及詳細住址、電話，經北水處確認後，派員或委請承商於1小時內至府上檢查。 無水原因 若屬本處責任，由北水處聯絡承商赴現場儘速處理， 如係內部設備損壞，請自行僱工修復 。","u":"臺北自來水事業處供水科","h":268095,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6BB97802C3749DFC","d":"2019-12-02","sid":"6BB97802"},{"q":"住家的自來水是怎麼來的？是否可得知家中的自來水使用哪一個水源？由哪一個自來水場所供應？","a":"1.自來水產生的過程是先經由取水口汲取原水，再藉由原水幹管輸送至淨水場，原水經過混凝、沉澱、過濾、消毒等淨水處理程序成為清水，再經加壓站及輸配管線送至用戶住家。臺北自來水事業處為因應原水濁度隨時變化的挑戰，自行研發自動化加藥系統控制，並訂定較國家標準更嚴格的內控標準，管理淨水流程作業，不斷精益求精。自原水取水、整個淨水流程，到輸配水管網的水質，均以水質電腦監視系統24小時連續嚴密監測，隨時掌握水質狀況。因此，水質安全穩定、衛生可口。\n2.臺北地區自來水水源約97.5%來自新店溪水源（包括南勢溪及北勢溪之翡翠水庫）；另約有2.5%分布在陽明山區及士林內雙溪，負責供應高地區民眾飲用。\n3.供應自來水的淨水場有長興、公館、直潭、雙溪及陽明等5個場。至於家中自來水的水源及供應的淨水場如下:\n(1)臺北市大同區、中山區、松山區、內湖區、南港區、文山區（木柵）、北投區（不含陽明山及行義路地區）、士林區（不含至善路一帶）、新北市新店區、中和區、永和區、三重區、汐止區（橫科里、宜興里、忠山里、北山里、東勢里、環河里、福山里）－水源為新店溪；淨水場為直潭淨水場。\n(2)臺北市中正區、萬華區、文山區（景美）－水源為新店溪；淨水場為公館淨水場。\n(3)臺北市大安區、信義區－水源為新店溪；淨水場為長興淨水場。\n(4)臺北市士林區至善路一帶－水源為內雙溪；淨水場為雙溪淨水場。\n(5)臺北市陽明山、北投行義路地區－水源為大坑溪；淨水場為陽明淨水場","u":"臺北自來水事業處淨水科","h":136114,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A712467D62D5A01E","d":"2009-12-02","sid":"A712467D"},{"q":"水費逾期未繳，違約金如何計算﹖多久會被停水﹖","a":"用戶應繳水費逾繳費期限者，如逾繳費期限七日內繳費者，免計遲延違約金；自逾繳費期限第八日起至第十四日繳費者，按應繳水費百分之一加收違約金；逾繳費期限第十五日起繳費者，按應繳水費百分之二加收違約金。但違約金未滿新台幣五元者，以新台幣五元計。（自102年4月1日實施）（營業章程第29條）\n※上述應繳水費，指用戶當期基本費及用水費，另加計（扣除）追收（退還）水費金額。\n自來水事業得對「欠繳應付各項費用逾期二個月，經限期催繳仍不繳付者」停止供水。（營業章程第33條第1項第4款）","u":"臺北自來水事業處業務科","h":134501,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=390A62646B82B92A","d":"2013-04-01","sid":"390A6264"},{"q":"收到中獎通知卻找不到繳費憑證，該如何領獎？","a":"為維護實際繳費人的兌獎權益，用戶遺失中獎當期載有載具識別資訊之繳費憑證，得在帳單期別之統一發票領獎期限內，攜帶中獎通知單、身分證明文件及下列佐證資料，向本處各營業據點申請補發載具資訊證明，據以領獎（如不克臨櫃申辦，可採郵寄方式辦理）。","u":"臺北自來水事業處業務科","h":108809,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E76C69D32B7FD054","d":"2017-05-24","sid":"E76C69D3"},{"q":"本處各水費代收（繳）機構（全國之分支機構及超商）?","a":"臨櫃代收機構如下(用戶親自至代收機構櫃台繳水費)：\n※逾繳費期限代收截止日內仍可至代收單位繳費，違約金併下期水費計算收取。\n非臨櫃代收機構如下（用戶至下列銀行自設之網頁或其他非臨櫃方式繳交水費，此繳費方式非即時銷帳）：\n合作金庫銀行、臺灣銀行、台北富邦銀行、玉山商業銀行、臺灣中小企業銀行、元大商業銀行、台新國際商業銀行、台中商業銀行、華泰商業銀行、陽信商業銀行。\n※ 逾繳費期限代收截止日內 仍可至代收單位繳費，違約金併下期水費計算收取。\n第三方支付(台北智慧支付平台_pay.taipei含網路刷信用卡)代收支付業者如下：\nApple Pay、悠遊付、橘子支付、Pi拍錢包、街口支付 、歐付寶 、ezPay簡單付、Fubon+台北富邦行動銀行、台北通APP銀行帳戶支付、遠傳心生活、票交所嗶嗶繳、iPASS MONEY、停車大聲公、車麻吉、icash Pay、 全支付、OPEN錢包 、全盈支付、永豐大咖繳費網、元大行動APP、國泰世華銀行企網銀。\n(可使用台北通APP或業者APP掃描水單 QR code繳費，已上線業者為悠遊付、街口支付、歐付寶、iPASS Money、橘子支付、ezPay簡單付、停車大聲公、 全支付、遠傳心生活，其餘業者掃描功能將陸續上線)。\n※逾繳費期限仍可至代收單位繳費，違約金併下期水費計算收取。\n存款帳戶代繳金融機構如下：\n臺灣銀行、土地銀行、合作金庫、第一商業銀行、華南銀行、彰化銀行、日商瑞穗銀行、美國銀行、 花旗(台灣)商業銀行(112年8月12日起停止個金帳號)、 上海儲蓄銀行、台北富邦銀行、國泰世華銀行、高雄銀行、兆豐國際商業銀行、台灣中小企業銀行、渣打國際商業銀行、台中商業銀行、京城商業銀行、美商摩根大通銀行、滙豐(台灣 )銀行、瑞興商業銀行(原大台北商銀)、華泰商業銀行、台灣新光商業銀行、台北市第五信用合作社、陽信商業銀行、板信商業銀行、基隆第一信用合作社、基隆第二信用合作社、淡水第一信用合用社、三信商業銀行、中華郵政公司、聯邦銀行、遠東國際商業銀行、元大商業銀行、永豐商業銀行、玉山銀行、凱基商業銀行、星展銀行、台新銀行、安泰商業銀行、中國","u":"臺北自來水事業處業務科","h":107923,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=027EDA0533C5B639","d":"2010-10-14","sid":"027EDA05"},{"q":"一般建築物如何申請接水（自來水及水表申請）？應備文件？","a":"※ 一般申請方式處理期限：當天掛表：小件5天、中件8天、大件11天、專 案：個案簽辦（口徑超過75毫米或超過50只水表者應專案簽報辦理。）。\n※ 網路申請方式處理期限：當天掛表：小件6天、中件9天、大件11天、專 案：個案簽辦（口徑超過75毫米或超過50只水表者應專案簽報辦理。）。\n※ 處理時間不包含申請路證和配合裝表事項。","u":"臺北自來水事業處技術科","h":95804,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D6A7350FEDEFD82E","d":"2010-12-31","sid":"D6A7350F"},{"q":"如何申請軍眷用水優待?","a":"（二）申辦手續：\n（三）法規依據：","u":"臺北自來水事業處業務科","h":92194,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7CFFE7EDC22DA9C3","d":"2012-05-16","sid":"7CFFE7ED"},{"q":"如何申請過戶（名義變更）﹖","a":"（一）應備證件：\n（二）申辦手續：\n（三）備註：\n※處理期限：一般申請方式1小時;網路申請方式1天。","u":"臺北自來水事業處業務科","h":88913,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5937E138CE0CE791","d":"2010-12-31","sid":"5937E138"},{"q":"如何辦理委託金融機構或郵局帳戶代繳?需多久時間開始代繳水費?","a":"1、 一般用戶：\n(1) 臨櫃申辦：請攜帶近期水費單、印章及存摺向已開戶郵局或金融機構辦理委託代繳；辦理後14天內將可建檔成功，下期水費即可從帳號代繳。\n(2) 線上申辦：登入 您的水管家 ，線上辦理金融帳戶代扣繳，目前支援 006合作金庫/012台北富邦銀行/048王道銀行/807永豐銀行/823將來銀行 ，共5家金融機構，辦理後 即時生效， 詳細說明請參閱 線上代扣繳問答 。\n2、公司行號：\n請攜帶 近期水費單 、 負責人身分證 、 開戶私章 及 存摺 向郵局或金融機構辦理委託代繳；辦理後 14天內 將可建檔成功，下期水費即可從帳號代繳。\n3、 本處客服中心及各營業分處櫃檯亦有代辦服務；惟本處係將用戶申辦資料代轉至各代繳行庫，因需寄交各行庫後，轉送各分行申辦， 約耗時1個月至45天 始可建檔成功。\n4、 代繳戶成功扣繳水費，開立之電子發票4獎、5獎、6獎及雲端發票專屬仟元與百元獎(現行增開為2仟元及5百元)之獎金，將自動匯入原扣款帳戶中。 如您不同意小額獎金直接匯入原扣款帳戶，請向本處各服務據點提出申請。\n※辦理金融代繳用戶名不需要變更為用水人。 ※申請代繳時請務必確認約定水號之正確性。\n※申辦後若水費帳單已計費 ，當期仍須自行繳費。 ※申請代繳後並 申辦電子帳單 ，每期水費優惠3元。","u":"臺北自來水事業處業務科","h":78974,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D12954AC3D5BB9DB","d":"2009-09-28","sid":"D12954AC"},{"q":"統一發票開獎後如何得知是否中獎?如果中獎要如何兌領獎金?","a":"統一發票開獎後，本處會主動寄發中獎通知，本處網站亦提供電子發票查詢功能，用戶可隨時上網輸入已繳費憑證上之載具號碼查詢電子發票號碼及是否中獎。 自然人用戶中獎時，獎金兌領方式如下：","u":"臺北自來水事業處業務科","h":69613,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=15EA2EE107718E3C","d":"2015-12-15","sid":"15EA2EE1"},{"q":"未收到水費通知單，怎麼辦?","a":"臨櫃繳費：請至本處客服中心或各營業分處櫃檯，告知水號、表號或用水地址即可繳費。 電話申辦補發：繳費期限內，請來電本處客服中心或各營業分處申請補發水費通知單，持補發之水費通知單，至各代收單位繳付。 網路線上繳費：請至本處網站首頁/ 查詢水費，輸入水號查詢應繳金額後前往繳費，可選擇(1) pay.taipei智慧支付(含信用卡刷卡繳費)繳費 (2) e-bill全國繳費網線上繳費 。 免持單至多媒體事務機（ibon、FamiPort、life-ET、ok-go）以水號查詢列印繳費單，繳費後超商發給繳款證明，繳費資料即時傳送本處銷帳。 除了親自繳費外，建議您可以申辦委託金融機構、郵局轉帳代繳或信用卡定期代繳水費（詳細代繳銀行名單請至常見問答/收費類/ 本處各水費代收(繳)機構查詢 ），免除每期持單繳費的手續，讓您繳交水費更便利。","u":"臺北自來水事業處業務科","h":69083,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A7423DFBE745AF05","d":"2010-10-12","sid":"A7423DFB"},{"q":"如何申請將繳交水費之電子發票歸戶到個人手機條碼？","a":"1.至超商【統一、全家、萊爾富、OK、美廉社】持水費通知單繳費或以多媒體事務機列印繳費單繳費，皆可於繳費前出示「手機條碼」供店家掃描，本處銷帳完成後，發票將自動儲存至「手機條碼」。\n以多媒體事務機列印繳費單繳費並使用「手機條碼」儲存發票，本處不再寄發繳費憑證，發票號碼請於本處銷帳完成2工作日後至「財政部電子發票整合服務平台」或「財政部統一發票兌獎APP」查詢。\n發票已儲存至手機條碼如中獎，由財政部通知中獎，本處不再寄發「中獎通知單」，如有領獎問題，請洽「財政部電子發票整合服務平台」客服專線：0800-521-988。\n2.於智慧支付平台(網路刷信用卡)及第三方支付業者端設定「手機條碼」後，每次使用該第三方支付繳交本處水費，待本處銷帳並開立電子發票，該期水費發票將自動儲存至用戶於業者端設定之「手機條碼」。\n上線業者：智慧支付平台(網路刷信用卡)、橘子支付、Pi拍錢包、街口支付、歐付寶、簡單付、停車大聲公、全支付、遠傳心生活、iPASS MONEY、icash Pay、嗶嗶繳、元大行動APP、永豐銀行大咖繳費網、悠遊付、全盈支付、車麻吉、Fubon+台北富邦行動銀行 ，其中透過智慧支付平台或台北通跳轉悠遊付繳費 ，因悠遊付系統限制，本處未收到「手機條碼」資訊，故無法將發票存入。\n發票已儲存至手機條碼，本處不再寄發繳費憑證，發票號碼請於本處銷帳完成48小時後至「財政部電子發票整合服務平台」或「財政部統一發票兌獎APP」查詢。\n發票已儲存至手機條碼如中獎，由財政部通知中獎，本處不再寄發「中獎通知單」，如有領獎問題，請洽「財政部電子發票整合服務平台」客服專線：0800-521-988。\n3.其他方式繳費，可於本處於網站建置發票查詢/歸戶專區，供用戶繳費後，得依繳費通知單或已繳費憑證所載之載具號碼查詢電子發票相關資訊及申請歸戶事宜。\n申請歸戶前請先確認在電子發票整合服務平台已完成自然人憑證註冊或已完成申請手機條碼，再到本處發票查詢/歸戶專區進行發票歸戶，連結到電子發票整合服務平台，選擇將已繳費憑證之載具號碼歸戶到共通性載具。\n但因水、電、瓦斯等公用事業係供應至固定處所，先使用後付費","u":"臺北自來水事業處業務科","h":66396,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1FA71F854B5F6F71","d":"2015-12-15","sid":"1FA71F85"},{"q":"用戶常見水質問題","a":"外觀現象\n水質問題研判\n原因說明\n改善對策\n氣泡\n開啟水龍頭自來水白濁如乳狀\n以透明玻璃杯盛裝自來水，用筷子快速攪拌，乳白狀即迅速消失，則純為氣泡，請安心飲用。\n直接用水 ：常發生於停復水作業或增壓操作時，管內殘留或累積之空氣在高壓情況下溶入水中所致；若氣泡出現在水壓偏低時，則係馬達直接抽水吸入空氣而造成。 大樓間接用水 ：常發生於高樓建物之中低樓層用戶，因水塔至水龍頭間管線因故放空，復水時，管內殘留或累積之空氣被高壓水柱溶入水中被帶出所致。\n1.直接用水出現氣泡現象通常不會持續太久，防範之道為供水管網增設排氣設備或適時利用消防栓排氣。\n2.大樓間接用水出現氣泡，隔一段時間後會自動消失。\n出現 泡沫\n以筷子快速攪拌後泡沫反而增加，可能為清潔劑污染，請暫停飲用，留樣並通知水處協助處理。\n消防系統與自來水管線間之逆止閥故障，消防用水倒流污染而出現泡沫。亦有少數個案係水池水塔人孔未蓋妥，遭刻意倒入清潔劑而污染。\n1.自行清洗水池水塔，並加強消防逆止閥功能檢修。 2.將水池水塔人孔蓋上鎖。\n雜質\n出現懸浮物或沉澱物\n煮沸後自來水出現懸浮物或沉澱物，係礦物質因加熱析出或沉澱之現象，水質無礙健康。\n開飲機墊圈老化碎裂亦會懸浮於水面。\n更換開飲機墊圈。\n淨水器濾材(活性碳)漏出而出現沉澱物(黑色)\n過濾器濾心破損導致濾料流失\n更換過濾器濾心。\n粉紅色 斑痕\n常發生於新衛浴設備之浴室易積水處或馬桶水流痕跡，水質經檢測安全無虞。\n浴室潮濕致黴菌孳生。\n加強浴室通風或以漂水擦洗。\n水濁水黃\n出現 水濁\n施工、馬達直接抽水或剛清洗過水池水塔等，皆可能導致水濁。請暫停飲用，留樣並通知水處協助處理。\n1.施工期間用戶未關閉表前止水栓及抽水機，持續負壓進水，而造成水濁。 2.外單位施工不慎挖破給水管，而導致無預警水質污染。 3.水處調整水壓，閥栓操作攪動管垢而導致水黃。 4.用戶水池、水塔久未清洗，進水時攪動池底沉澱物。 5.用戶屋內給水管 件 (鑄鐵管)老舊生銹造成水黃。\n1.施工停水期間關閉進(抽)水，減壓供水期間降低進(抽)水流速，維持正壓進水。 2.確定進水水質恢復清澈無異味後，將水池水塔","u":"臺北自來水事業處水質科","h":65904,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9C73073369EEFCEB","d":"2013-06-04","sid":"9C730733"},{"q":"為什麼要收污水下水道使用費？收取之法源依據為何？如何計算？","a":"1. 污水下水道就是用來收集家庭產生的污水，包括廁所、浴室、廚房及洗地等使用後的髒水，以及工廠、餐廳等場所排出的污水。這些污水都經由地下埋設的污水管線流到污水處理廠，經處理廠將污水處理到符合國家放流標準再排放，以達到不污染河川水質的目標；污水下水道使用費就是為處理這些污水所需的費用（包含下水道建設、設施營運及維護)。 2. 本處分別受臺北市政府及新北市政府委託代徵污水下水道使用費： (1) 臺北市係由下水道管理機關臺北市政府工務局衛生下水道工程處（以下簡稱衛工處），依據「下水道法」及「臺北市污水下水道使用費徵收自治條例」規定，按照下水道接管進度檢送名冊，委託本處隨水費依每月用水量代徵；其單價由衛工處依前揭自治條例所訂公式及污水下水道用戶種類分別計算，報經市政府核准後公告，目前一般用戶及事業用戶均為每度用水代徵5元。 (2) 新北市係由下水道管理機關新北市政府水利局（以下簡稱水利局），依據「下水道法」及「新北市污水下水道使用費徵收自治條例」規定，按照下水道接管進度檢送名冊，委託本處隨水費依每月用水量代徵；其單價由水利局依前揭自治條例所訂公式及污水下水道用戶種類分別計算，報經市政府
