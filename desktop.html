EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A1736C1D6ABD7660","d":"2012-02-14","sid":"A1736C1D"},{"q":"請問室內裝修施工時間為何?","a":"一、施工期限：\n依據「臺北市建築物室內裝修審核及查驗作業事項準則」第八條規定，室內裝修圖說經審查人員審核合格並於申請圖說簽章後，轉送都發局發給許可文件及施工許可證後，限期於六個月內按核定圖說施工完竣並申請竣工查驗。申請人因故未能於六個月內完工時，得於期限屆滿前向都發局申請展延六個月，並以一次為限。但情況特殊，經都發局核可者，不在此限。\n二、施工時間：\n本府環境保護局網路資訊說明其規定：營建工程係以「整體音量」管制，不論其噪音源為何，其整體音量不得超過「營建工程噪音管制標準」。而針對三更半夜施工噪音問題，環境保護局已公告，於本市各類噪音管制區住宅及公寓大廈平日晚上十時至翌日上午八時，及假日中午十二時至下午二時、晚上六時至翌日上午八時，不得使用動力機械或手持工具從事敲擊、鑽孔、鋸切、釘合、打磨或其他產生裝修工程噪音致妨礙安寧之行為。若經環保局環保稽查大隊稽查確有違反前述規定，將依法予以掣單舉發並限期改善。另因該管制標準依不同噪音管制類區及時段而有所不同，詳細資料請逕行參閱環境部(https://www.moenv.gov.tw/)網站、環保法規頁面。","u":"臺北市建築管理工程處使用科","h":141416,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B47B131D580036A3","d":"2026-08-28","sid":"B47B131D"},{"q":"建築工地可以施工之時間為何?","a":"一、按107年1月9日修正發布之「臺北市建築工程施工時段管制辦法」規定，下列工項除施工作業之材料及機具運載等前置作業得於上午6時至8時進行外，平日不得於下午10時至翌日上午8時施工；例假日不得於上午八時前、中午12時至下午2時或下午6時後之時段施工。但本府工程主辦機關報本府核定自行管制者，不在此限。\n(一)連續壁施工作業。\n(二)打樁及樁基礎施工作業。\n(三)地下室安全措施組立作業（含開挖作業）。\n(四)鋼結構組立作業。\n(五)混凝土澆置作業。\n(六)建築物拆除工程及岩石、混凝土、磚牆等破碎作業。\n(七)吊車之裝卸作業。\n二、另如施工噪音音量過大，或於上開管制時段使用動力機械或手持工具從事吊掛、裝載、卸料、搬運、敲擊、鑽孔、鋸切、釘合、打磨或其他施工致妨礙安寧之行為，可撥打本府市民熱線1999或電洽環保局檢舉。\n三、相關法規可上臺北市法規查詢系統(https://laws.gov.taipei/Law/)，或臺北市建築管理工程處(https://cmo.gov.taipei/)，或臺北市政府環境保護局(https://www.dep.gov.taipei/)網站查詢。","u":"臺北市建築管理工程處施工科","h":117908,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=111AC461DB8571F7","d":"2016-08-03","sid":"111AC461"},{"q":"我想檢舉違建應該怎麼辦？會為我保密嗎？","a":"可透過臺北市陳情系統檢舉 ( https://1999.gov.taipei/Front/main ) ；另針對市民具名之檢舉資料本處將依本府相關保密規定辦理。","u":"臺北市建築管理工程處違建查報隊","h":41524,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=389819055F614C6E","d":"2012-02-14","sid":"38981905"},{"q":"請問鐵窗突出的尺寸為何，才不會被當成違建?","a":"依「臺北市違章建築處理規則」第9條規定：「建築物依法留設之窗口、陽臺，裝設透空率在百分之七十以上之欄柵式防盜窗，其突出外牆或陽臺欄杆之外緣未超過十公分、面臨道路或基地內通路，且留設至少一處有效開口者，應拍照列管。\n本規則民國一百年四月三日施行前已領有建造執照之建築物，裝設透空率在百分之七十以上之欄柵式防盜窗，其淨深未超過六十公分、面臨道路或基地內通路，且留設至少一處有效開口者，應拍照列管。\n前二項有效開口為淨高一百二十公分以上、淨寬七十五公分以上或內切直徑一百公分以上之開口或圓孔。」，設置鐵窗應參照上述規定辦理。","u":"臺北市建築管理工程處違建查報隊","h":32734,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CEEAFE983FBC7237","d":"2012-02-14","sid":"CEEAFE98"},{"q":"什麼是防火巷，其意義及法令依據為何？","a":"依據憲法第143條第1項規定：「中華民國領土內之土地屬於國民全體。人民依法取得之土地所有權，應受法律之保障與限制。私有土地應照價納稅，政府並得照價收買。... 」另土地法第10條第1項：「中華民國領域內之土地，屬於中華民國人民全體，其經人民依法取得所有權者，為私有土地。 」據此，防火巷亦屬法定空地之部分，應屬土地區分所有權人所有，其管理維護應由各區分所有權人管理之，惟其使用不得違反公寓大廈管理條例第16條規定。","u":"臺北市建築管理工程處公寓大廈科","h":30238,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=44AD690DDC571152","d":"2013-10-24","sid":"44AD690D"},{"q":"若民眾自行要把空屋拆除(非違章建築)，是否要申請拆除許可，及應備文件?","a":"一、依建築法第78條「建築物之拆除應先請領拆除執照。但左列各款之建築物，無第83條規定情形者不在此限：一、第十六條規定之建築物及雜項工作物。二、因實施都市計畫或拓闢道路等經主管建築機關通知限期拆除之建築物。三、傾頹或朽壞有危險之虞必須立即拆除之建築物。四、違反本法或基於本法所發布之命令規定，經主管建築機關通知限期拆除或由主管建築機關強制拆除之建築物。」及第83條（古蹟之修繕）「經指定為古蹟之古建築物、遺址及其他文化遺跡，地方政府或其所有人應予管理維護，其修復應報經古蹟主管機關許可後，始得為之。」\n二、另依同法第16條「建築物及雜項工作物造價在一定金額以下或規模在一定標準以下者，得免由建築師設計，或監造或營造業承造。前項造價金額或規模標準，由直轄市、縣（市）政府於建築管理規則中定之。」；及臺北市建築管理自治條例第10條「起造人申請建築執照時，得免由建築師設計及簽章之工程如下：一、選用內政部或市政府訂定之各種標準建築圖樣及說明書者。二、非供公眾使用之平房，其總樓地板面積在六十平方公尺以下且簷高在三．五公尺以下者。三、雜項工作物中，圍牆及駁崁（不含山坡地整地及擋土工程）高度在二公尺以下；水塔、廣告塔（臺）及煙囪，高度在三公尺以下者。前項第二款及第三款之建造執照或雜項執照之施工，得免由建築師監造及營造業承造。」；符合上開規定者免辦理建築執照（免辦理拆照）。\n三、另有關辦理拆除執照須檢附文件如下\n1.申請書2份。\n2.審查表3份。\n3.監拆報告書。\n4.建築師委託書。\n5.建物拆除同意書(如有抵押設定者，另檢附抵押權人之拆除同意書)。\n6.建物部分拆除剩餘部分結構安全無虞證明(含安全支撐或補強計畫)。\n7.建物登記謄本(建號全部，3個月內有效)或其他相關證明文件(無產權登記者檢附水電單、房屋稅單或其他)。\n8.建物測量成果圖(拆除位置須確認時檢附)。\n9.拆除切結書（無產權登記時檢附，並加附房屋稅單、水電單或其他）。\n10.共同壁協議書(無共同壁者免附)。\n11.建築物地籍套繪圖。\n12.現況相片。\n13.其他相關資料(如建物部分拆除依公寓大廈管理條例檢討之文件…)。\n14.拆除","u":"臺北市建築管理工程處建照科","h":30187,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9E0B19481598BC01","d":"2020-03-28","sid":"9E0B1948"},{"q":"室內裝修申辦程序為何？住宅裝修是否有簡便的申辦措施？","a":"建築物之室內裝修，除應委託內政部登記許可的室內裝修從業者「設計」及「施工」外，尚應分別向台北市建築師公會（2377-3011）申請「圖說審核」及「竣工勘驗」。另外，供住宅使用或一定規模以下之建築物（即10層以下及地下各層樓地板面積未達300㎡；11層以上樓地板面積未達100㎡者）室內裝修，得檢附經依法登記開業之建築師或室內裝修業專業設計技術人員簽章負責之室內裝修圖說向審查機構申報施工，經核給施工期限及「施工許可證」後，即可進行施工。工程完竣後，再檢附申請書、建築物權利證明文件及經營造業專任工程人員或室內裝修業專業施工技術人員竣工查驗合格簽章負責之檢查表，向審查機構申請審查許可，經審核其申請文件齊全後，即核轉市政府都市發展局發給「室內裝修合格證明」。","u":"臺北市建築管理工程處使用科","h":24177,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8F7BB0C7AB557FD3","d":"2026-08-28","sid":"8F7BB0C7"},{"q":"如何申請公寓大廈組織報備？","a":"依公寓大廈管理報備事項處理原則，須由公寓大廈管理委員會主任委員或管理負責人檢齊該處理原則第五點規定應備文件向本府報備。報備所須之書表資料請上本處網站下載( 首頁>科室業務>公寓大廈科>公寓大廈報備>檔案下載 )，或至市民服務大平台網站下載 ( 市民服務大平台> 依機關分類> 都發局> 公寓大廈組織申請報備> 書表下載。)","u":"臺北市建築管理工程處公寓大廈科","h":22717,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A25D6E7D62CEAA30","d":"2011-11-28","sid":"A25D6E7D"},{"q":"請問陽台補登該如何申請？","a":"陽台補登『線上申請』，建請申請人逕上台北服務通網站線上申請，亦可由網站下載「申請書」表格，填妥基本資料（包括申請人姓名、申請補登地點、聯絡電話及通訊處），以郵寄方式申請，或是親自至本處總收文室紙本掛號。\n附註:上網申請後若您收到E-mail或線上查詢結果通知領件時,請檢附下列證件至本處建照管理科領件。","u":"臺北市建築管理工程處建照科","h":22258,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E5EC570FE5FB5113","d":"2020-03-28","sid":"E5EC570F"},{"q":"可於哪裡查詢到房屋是否為海砂屋?","a":"查詢步驟如下:臺北市建築管理工程處網站→建管業務綜合查詢→宣導專區→「海砂屋專區」→「列管清冊及相關法令專區」→「臺北市高氯離子混凝土建築物列管清冊」即可查到列管案件地址。","u":"臺北市建築管理工程處使用科","h":21867,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B345AF5CDFAEA12","d":"2011-11-28","sid":"5B345AF5"},{"q":"何處可查詢工地、道路及室內裝修施工時間的法規?","a":"一、按107年1月9日修正發布之「臺北市建築工程施工時段管制辦法」規定，下列工項除施工作業之材料及機具運載等前置作業得於上午6時至8時進行外，平日不得於下午10時至翌日上午8時施工；例假日不得於上午八時前、中午12時至下午2時或下午6時後之時段施工。但本府工程主辦機關報本府核定自行管制者，不在此限。\n(一)連續壁施工作業。\n(二)打樁及樁基礎施工作業。\n(三)地下室安全措施組立作業（含開挖作業）。\n(四)鋼結構組立作業。\n(五)混凝土澆置作業。\n(六)建築物拆除工程及岩石、混凝土、磚牆等破碎作業。\n(七)吊車之裝卸作業。\n二、另如施工噪音音量過大，可撥打本府市民熱線1999或電洽環保局檢舉。\n三、相關法規可上臺北市法規查詢系統(https://laws.gov.taipei/Law/)，或臺北市建築管理工程處(https://cmo.gov.taipei/)，或臺北市政府環境保護局(https://www.dep.gov.taipei/)網站查詢。","u":"臺北市建築管理工程處施工科","h":21075,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0FE6EA4BF8A417F0","d":"2016-08-03","sid":"0FE6EA4B"},{"q":"請問建管處資訊室櫃台服務時間？中午有休息嗎？","a":"收件\n抽取號碼牌時間\n上午 08：30 – 下午 04：30\n並憑號碼牌依序服務至完成為止。\n領件\n一、請依 ‹與承辦人約定時間› 準時前來。\n二、請逕洽櫃台或承辦人，勿抽號碼牌，以免久候。","u":"臺北市建築管理工程處資訊室","h":20420,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1FFF92FBBFE6BFF3","d":"2012-04-11","sid":"1FFF92FB"},{"q":"我想買房子，但是建築執照上用途為「一般事務所」，可以變更為住宅嗎？","a":"一般事務所變更成住宅使用，應辦理變更使用執照，但假如該樓層高度超過3.6公尺，則依法無法變更成住宅使用。","u":"臺北市建築管理工程處建照科","h":20271,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1B927B26EC143CF1","d":"2020-03-28","sid":"1B927B26"},{"q":"請問違建檢舉案件，如何知道有無被查報？","a":"請逕至建管處網站，進入「違建查報查詢」即可查得（網址為https://tccmoapply.dba.tcg.gov.tw/tccmoapply/squQuery.jsp）。","u":"臺北市建築管理工程處違建查報隊","h":19460,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E7EF08E1078EED75","d":"2012-02-14","sid":"E7EF08E1"},{"q":"使用執照(存根)影本如何申請？","a":"一、申請使用執照(存根)影本， 不需檢附任何身份證件。\n請攜帶建築物相關地址、地段號，直接至建管處資訊室臨櫃申請，當場即可領件，每張工本費20元，蓋有本處核發印章。\n二、亦可至本處 執照存根查詢系統 ，自行查詢使用執照號碼後，免費列印該執照(存根)影本。","u":"臺北市建築管理工程處資訊室","h":19397,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8F6477B6F75B6670","d":"2012-02-14","sid":"8F6477B6"},{"q":"如何申請防空避難處所?","a":"1.防空避難設備之附建標準應符合《建築技術規則》建築設計施工編第141條規定，另按同規則同編第142條第6款規定「供防空避難設備使用之樓層樓地板面積達到200平方公尺者，以兼作停車空間為限；未達200平方公尺者，得兼作他種用途使用，其使用限制由直轄市、縣（市）政府定之。」\n2.另依91年3月13日台內營字第0910004132號函說明2：「......是公寓大廈管理條例公布施行前，領有使用執照之防空避難設備，得否申請作為臨時使用、營業使用乙節，應依本條例第16條第2項，不得供營業使用規定辦理；至其公寓大廈防空避難設備於本條例公布施行前，業經核准臨時使用、營業使用有案，申請變更使用者，除依內政部86年4月17日台內營字第8672620號函釋規定，按建築法第七十三條執行要點（現已改為建築物使用類組及變更使用辦法）之規定，其營業項目在同一類組範圍內變更或作較輕度營業使用，得免辦理變更並免經區分所有權人會議決議之同意外，並依照有關規定辦理。」。\n3.另建築物防空避難室超出法定應附建面積之部分，尚可依本市土地使用分區管制規則、建築法及相關法規，委託本市開業建築師向本市建築管理工程處申請辦理變更使用執照，並經核准後方能作其他用途使用。","u":"臺北市建築管理工程處建照科","h":18521,"t":"消防安全","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9A78778CD493C269","d":"2020-03-28","sid":"9A78778C"},{"q":"既存違建向自來水、台電公司申請接水接電，是否需要建管處的公文才可以","a":"建管處為解決本市未領得使用執照之既有建築物(含83年12月31日以前之違章建築)接水接電，依105年9月21日修正發布「臺北市未領得使用執照既有建築物申請接水接電處理要點」，檢附下列文件提出申請：\n(1)申請書\n(2)切結書\n(3)該建築物門牌編釘證明書\n(4)申請人設籍於該門牌地址之證明\n(5)83年12月31日前即已存在相關佐證\n(6)建物平面圖說，並標示申請範圍及住宅生活機能位置。\n上述(1)(2)(6)項資料，可逕上建管處網站(申請案件/違建處理科[辦理未領得使用執照既有建物居家用戶申請接水接電作業])中下載填寫。","u":"臺北市建築管理工程處違建處理科","h":18300,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E423C76AE26CAB5F","d":"2012-02-14","sid":"E423C76A"},{"q":"請問如何申請合法房屋證明?","a":"(一)應依臺北市建築管理自治條例第35條規定，委託開業建築師檢討辦理。各區認定時間點如下：\n1.舊市區，民國三十四年十月二十五日\n2. 景美、木柵區，民國五十八年四月二十八日\n3.南港、內湖區，民國五十八年八月二十二日\n4.士林、北投區，民國五十九年七月四日。\n(二)應備文件：\n1.申請書。\n2.土地登記謄本（地號全部，三個月有效）。\n3.地籍圖謄本（三個月有效）。\n4.土地使用權同意書。\n5.建築物所有權相關證明文件。\n6.都市計畫發布實施前建造完成證明。（應檢附載明建物完成日期之建築物改良登記簿謄本、課稅始期證明、接水、接電日期證明、第一次水電費收據、載有該建築物資料之土地現況調查清冊或卡片之本、戶口遷入證明、地形圖、都市計畫現況圖、都市計畫禁建圖、航測圖或政府機關測繪地圖）。\n7.建築師委託書。\n8.建築師簽證表及結構安全證明書。\n9.合法房屋切結書。\n10.現況相片。\n11.各層平面及立面圖、面積計算表（由申請人、建築師簽證）。\n12.建築物地籍套繪圖（含現況及擬興建部分，比例1/500）。\n13.其他必要檢附資料(個案性)。","u":"臺北市建築管理工程處建照科","h":18291,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=000B3C7833849908","d":"2020-03-28","sid":"000B3C78"},{"q":"如何申請建物完工證明書，應備文件？","a":"一、查建築法中尚無「建物完工證明書」之法定名詞，惟建物工程完竣後應辦之各項有關執照或許可項目有（1）建築使用執照、（2）建築物變更使用執照申請竣工查驗、（3）建築物室內裝修竣工查驗等，其應備文件如下：\n（一）建築使用執照應備文件：\n1.使用執照申請書1份。\n2.使用執照審查表2份。\n3.基地綠化明細表。\n4.建造(雜項)執照正本。\n5.工務局水利處核發之道路管線申挖修復證明。\n6.工務局衛工處核可用戶接管申請竣工備查證明(戳章加蓋於執照正本背面)、廢(污)水排放許可證(無者免附)。\n7.施工中如有損壞公共設施列管在案者，應檢附該公共設施主管機關之修復證明(施工中未發生損壞公共設施未經查報列管者免附)。\n8.門牌編訂影本(每四戶黏貼1張附卷)。\n9.竣工彩色照片應包括建築物各向立面全景、屋頂突出物、屋頂、道路環境全景、騎樓、露台、防火間隔、停車空間、機械停車設備及出入通路、電梯設備、綠化工程、放大門牌、建築物標示牌、共同天線、避雷針、挑空、停車空間告示牌及消防設備等。\n10.昇降設備(含汽車昇降機)竣工檢查合格證明文件。\n11.併案辦理變更設計申請書(無者免附)。\n12.併案辦理修改竣工圖申請書(無者免附)。\n13.屋頂版品管資料。\n14.其他必要之證件(承造人不違建切結書、各項管線確實己裝妥完畢切結書、帷幕牆大片石材施工技術安全證明書、共同天線切結書、避雷設備、安全防火門證明、機械停車設備合格證明文件、公寓大廈公共管理基金切結書及管理基金專戶存摺影本、公寓大廈規約影本(由起造人核章)、挑空部分不加蓋違建切結書、開放空間管理基金切結書及規約)(無者免附)。\n15.竣工圖說(包括地籍圖、現況圖、配置圖、面積計算表、各層平面圖、綠化平面圖、各向立面圖及消防設備函圖)。\n16.監造人竣工勘驗檢查報告表、承造人及營造業專任工程人員竣工勘驗檢查報告表。\n17.空氣污染防制費繳款收據。\n18.使用執照注意事項附表1份。\n19.消防設備竣工核准函及會勘。\n20.無障礙設施會勘紀錄。\n（二）建築物變更使用執照申請竣工查驗應備文件：\n1.申請書1份。（變更使竣工申請書、概要表、使用說明書、","u":"臺北市建築管理工程處施工科","h":16306,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3F118B6E2F6AED57","d":"2011-11-28","sid":"3F118B6E"},{"q":"何種用途或規模的建築物室內裝修應申請審查許可？","a":"「供公眾使用建築物」及內政部指定的「非供公眾使用建築物」室內裝修必須申請審查許可。除一般營業或消費場所外，本市6層以上建築物均屬供公眾使用建築物，其中任一樓層室內裝修，均應申請審查許可。另外，樓高5層以下的集合住宅或辦公廳舍，若有增設廁所或浴室，或涉及增設2間以上之居室造成分間牆之變更，或一戶同樓層分間為6間以上使用單元或設置10個以上床位之居室者，仍應申請室內裝修審查許可。","u":"臺北市建築管理工程處使用科","h":15525,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=143E5A61B0A7CA6F","d":"2026-08-28","sid":"143E5A61"},{"q":"營造業淨值申報應如何辦理？","a":"申請人如依規定於每年6月1日起至7月31日止申請營造業淨值申報，應檢附「營造業申報淨登記函」等相關文件表格。\n上述所需表格及申請須知，申請人可從「臺北市建築管理工程處」網站，點選網頁左邊/申請案件 >\n台北服務通網站\n>【臺北市建築管理工程處】 服務列表>點選【綜合(專業)營造業設立登記(含變更)】 【土木包工業設立登記(含變更)】>【書表下載】即有相關表格，憑以檢附辦理。                                                                                                                                            (網址:https://dba.gov.taipei/default.aspx)\n另依內政部中華民國111年5月24日台內營字第1110809094號函明示: 「為因應嚴重特殊傳染性肺炎(COVID-19)疫情影響及配合防疫政策，有關本部權管營造業淨值及承攬總額申報期限原為每年6月1日至7月31日，本(111)年得展延至本年9月30日申報，請查照轉知並配合辦理。」。","u":"臺北市建築管理工程處營建科","h":15127,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=506B84268CDBB177","d":"2026-09-01","sid":"506B8426"},{"q":"營造業業績登記如何辦理？","a":"(網址:https://dba.gov.taipei/default.aspx)","u":"臺北市建築管理工程處營建科","h":14265,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D41A33836263D023","d":"2026-09-01","sid":"D41A3383"},{"q":"申請建築師事務所設立(含變更)及越區執業等事項，如何辦理？","a":"(網址:https://dba.gov.taipei/default.aspx)","u":"臺北市建築管理工程處營建科","h":13268,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=33A5A61F3C6B775F","d":"2026-09-01","sid":"33A5A61F"},{"q":"辦活動的臨時棚架是不是違建呢？需要申請嗎？","a":"依「臺北市展演用臨時性建築物管理辦法」規定，各機關、學校、依法登記或立案之團體及法人在辦理展演、集會遊行或相關活動時，若有搭建舞台或攤棚等臨時性建築物之需求，應先向道路主管機關或土地所有權人取得路權或土地同意書後，再依法備妥相關文件向本處申請核准後才可以搭建，且該展演用臨時性建築物應於使用期限屆滿前自行拆除（或辦理展期）。如未依規定申請擅自搭建者，則以違建處理。\n另有關展演用臨時性建築物申請作業，本市建管處網站業已提供線上申請之便民服務（網址：\nhttps://cmo.gov.taipei/，臨時展演/相關服務連結/台北服務通），請多加利用。","u":"臺北市建築管理工程處違建查報隊","h":12962,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=81CB647182AC655C","d":"2012-02-14","sid":"81CB6471"}]},{"org":"警察局","total":107,"items":[{"q":"紅線違規停車罰鍰費用為多少？","a":"依「道路交通管理處罰條例」第56條規定，違規停車處汽車駕駛人新臺幣600元以上1,200元以下罰鍰。","u":"臺北市政府警察局交通警察大隊","h":692295,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=81B2D4F835250672","d":"2021-11-23","sid":"81B2D4F8"},{"q":"酒測值多少會被取締？罰鍰多少？","a":"1. 依照「道路交通安全規則」第114條規定：飲用酒類或其他類似物後其吐氣所含酒精濃度達每公升0.15毫克或血液中酒精濃度達0.03%者，即違反111年3月31日施行新修正「道路交通管理處罰條例」第35條規定，機車駕駛人處新臺幣1.5萬元以上9萬元以下罰鍰，汽車駕駛人處新臺幣3萬元以上12萬元以下罰鍰，並均當場移置保管該汽機車、吊扣其駕駛執照1年至2年及吊扣該汽機車牌照二年。\n2. 吐氣所含酒精濃度達每公升0.25毫克或血液中酒精濃度達0.05%以上者，即違反「刑法」第185條之3不能安全駕駛罪，處三年以下有期徒刑，得併科30萬元以下罰金。","u":"臺北市政府警察局交通警察大隊","h":487922,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F718C388EA969AB8","d":"2021-11-23","sid":"F718C388"},{"q":"LINE帳號被盜用怎麼辦？","a":"一、發現Line帳號遭盜用時，應立即至Line軟體中其他→設定→我的帳號，取消勾選允許自其他裝置登入，並變更密碼。\n二、如密碼已遭歹徒變更時，請至Line公司網站（https://contact.line.me/）填寫「問題反應表」，經確認該帳號遭盜用，Line公司會於24小時內與用戶聯繫，並視個案情況協助用戶處理。\n三、提醒告知親友不要理會以及提供任何資料給遭冒用帳號。","u":"臺北市政府警察局刑事警察大隊","h":362867,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3A3A4DA0C75B17CD","d":"2015-07-09","sid":"3A3A4DA0"},{"q":"申請警察刑事紀錄證明(俗稱良民證)需要具備哪些文件？到哪裡申請？","a":"一、應備證件\n(一) 申請書1份。\n(二) 應備證明文件：\n1、本國人：新式國民身分證正本或戶口名簿正本（持戶口名簿辦理者須另出示有相片之證件；正本驗畢歸還）。\n2、大陸港澳地區居民：中華民國臺灣地區居留證或內政部移民署核發之其他相關證件正本（正本驗畢歸還）。\n3、外國人：護照或外僑居留證正本（正本驗畢歸還）。\n4、需加註英文姓名者，請另檢附護照基本資料頁正本或影本。\n5、非本人申請者，除上述應備證明文件外，請另檢附申請人印章或經申請人簽名或蓋章之委託書1份（申請書上備有委託書欄位）及受委託人身分證明文件正本。\n6、申請人未滿18歲者，除上述應備證明文件外，應另檢附法定代理人同意書及其身分證正本或由其法定代理人代為申請。\n(三) 證書費：\n1、國內申請：每份新臺幣100元，同一次申請2份以上，自第2份起每份收費新臺幣20元，或至郵局購買匯票，戶名為臺北市政府警察局。\n2、國外郵寄申請者：每份美金7元現鈔（香港、澳門地區，請檢附美金6元現鈔），同一次申請2份以上者，自第2份起每份收費美金1元（證明書之內容均應相同）。\n二、申辦方式\n(一) 網路申辦：( 警察刑事紀錄證明書申請 )\n1、Mydata驗證，刷卡繳費後郵寄取件 （建議方式） 。\n2、 Mydata驗證，刷卡繳費後 臨櫃取件。\n(二) 臨櫃申辦：攜帶應備文件至臺北市政府警察局外事科服務中心（臺北市中正區延平南路96號；捷運西門站5號出口步行約3分鐘）及各分局申辦。\n(三) 郵寄申辦：\n1、國內申辦：以掛號信件連同申請書、證書費及證件正本寄至臺北市政府警察局，並附填妥收件人姓名、地址及電話之回郵掛號信封1只。\n2、國外申辦：\n(1)經我國駐外館處驗證或認證之護照影本，或經相關公證單位驗證、公證或認證之相關身分證明文件（如護照、外僑居留證等）影本，連同申請書及證書費，以掛號信件寄至本局，並填妥收件人姓名、地址及電話之掛號信封1只（免附回郵郵資）。\n(2)本局英文地址：\nForeign Affairs Division, Taipei City Police Department\nNo.96, YanPing S. R","u":"臺北市政府警察局","h":337911,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0D64A4A5F7FB7E63","d":"2026-07-20","sid":"0D64A4A5"},{"q":"檢舉交通違規有沒有檢舉獎金?","a":"一、依據「道路交通管理處罰條例」第91條規定：「下列機構或人員，應予獎勵；其辦法由交通部、內政部會同有關機關定之：一、對促進交通安全著有成效之學校、大眾傳播業或公、私汽車駕駛人訓練機構。二、檢舉汽車肇事或協助救護汽車肇事受傷者之人員。三、優良駕駛人。四、檢舉違反第四十三條第一項第一款至第四款規定行為經查證屬實之人員」，爰除檢舉肇事逃逸及第43條第1項第1款至第4款外，其餘尚無發放檢舉獎勵之法源依據。\n二、臺北市政府警察局目前僅針對道路交通事故肇事逃逸案件，經檢舉人依規定提出檢舉因而偵破者，發給獎勵金外，其餘檢舉交通違規案件並無提供獎金。","u":"臺北市政府警察局交通警察大隊","h":295431,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA2DE645B7A1AB0E","d":"2019-07-19","sid":"AA2DE645"},{"q":"假日停在黃線為何被拖吊？","a":"一、依據「道路交通標誌標線號誌設置規則」第168條第3項規定：「本標線（黃線）禁止時間為每日上午7時至晚間8時，如有延長或縮短之必要時，應以標誌及附牌標示之。」\n二、目前臺北市假日黃線開放停車路段已於交通管制工程處網站上公告（網址為： https://www.bote.gov.taipei/ ），網站上亦清楚標示（本表僅供參考，實際仍以現場標誌牌所示範圍為準），故除了現場有設置「假日除外」標誌牌面之路段外，其它路段均屬一般黃線，均依「道路交通標誌標線號誌設置規則」第168條規定處理。","u":"臺北市政府警察局交通警察大隊","h":266885,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E8D8997FF18B7413","d":"2021-11-23","sid":"E8D8997F"},{"q":"遺失身分證，需向警察局報案嗎？","a":"1.國民身分證遺失，不須到警察局報案。\n2.自103年7月1日起，補領國民身分證得親自至任一戶政事務所辦理。","u":"臺北市政府警察局刑事警察大隊","h":257506,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=56EABE508A5471CA","d":"2014-05-28","sid":"56EABE50"},{"q":"家庭暴力保護令之種類及聲請方式？","a":"（一）何謂保護令？保護令有哪些類別？\n保護令可以保護家暴被害人免於再被傷害，它可以命令加害人離開住居所、離開被害人的生活環境，保護被害人的安全，還有其他多項的保障。『保護令』分為三種類別：\n1、通常保護令\n(1)聲請人及程序：被害人、檢察官、警察機關、主管機關以書面為之。\n(2)核發程序：需經審理程序。\n(3)效期：有效期限為二年以下，自核發時起生效。失效前得聲請法院撤銷、變更或延長之。有效期間之延長，每次為二年以下。\n2、暫時保護令\n(1)聲請人及程序：被害人、檢察官、警察機關、直轄市、縣(市)主管機關以書面為之。\n(2)核發程序：得不經審理程序。\n(3)效期：自核發時起生效，於法院審理終結核發通常保護令或駁回聲請時失其效力。\n3、緊急保護令\n(1)聲請人及程序：檢察官、警察機關、直轄市、縣(市)主管機關以書面、言詞、電信傳真或其他科技於日夜間或休息為之。\n(2)核發程序：依警察人員到庭或電話之陳述，認被害人有急迫危險者，於4小時內以書面核發保護令。\n(3)效期：自核發時起生效，於法院審理終結核發通常保護令或駁回聲請時失其效力。\n（二）當事人自己如何聲請保護令？\n1、蒐證：由於民事保護令是期待法院限制他人的行動與權益，因此蒐集證據仍是重要的關鍵。可以做為證據的資料包括：\n(1)受（處）理家庭暴力暨兒少保護案件調查紀錄（通報）表、家庭暴力案件現場處理調查表。\n(2)驗傷診斷證明書。\n(3)其他相關證據(證人、錄音、或某些求助證明等)。\n2、填寫民事(暫時)保護令聲請書狀：（保護令聲請，應以書面為之）\n(1)當事人只要聲請暫時保護令，法院會在核發後，自動為當事人進行通常保護令的聲請程序。\n(2)不一定要使用制式書狀，只要書面資料記載了家庭暴力防治法施行細則第五條所列之事項即可。\n(3)檢具證據與聲請書狀，至法院聲請：當事人可至自己住居所、相對人住居所及暴力發生地等處法院聲請，或至各縣市家庭暴力暨性侵害防治中心、警察單位皆可以協助聲請保護令。","u":"臺北市政府警察局婦幼警察隊","h":164473,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EB98B85C93F9D134","d":"2026-06-01","sid":"EB98B85C"},{"q":"民眾拾得遺失物交存派出所及後續相關作業程序","a":"（一）民眾在拾得遺失物，交存派出所時流程如下：\n（二）若受理派出所不知失主致無法通知認領，將陳報分局處理。分局於清點拾得之遺失物後無訛後，將掛號管制並簽報登錄拾得遺失物處理系統網路上公告認領，副本發拾得民眾、有關機關及保管單位。\n（三）拾得遺失物依價值，500元以下民眾可向警察機關登記並開立收據後自行保管物品，若一個月內無接獲警察機關來電則取得物品所有權稱「簡易招領」可節省社會成本，價值500元以上公告6個月後，若無失主領回，該物之所有權由拾得民眾取得，將通知拾得民眾前來領取。","u":"臺北市政府警察局刑事警察大隊","h":160105,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E7A350BB315C61ED","d":"2015-01-08","sid":"E7A350BB"},{"q":"警察刑事紀錄證明（俗稱良民證）內會記載些什麼內容？每個人都可以領到良民證嗎？犯罪前科紀錄都會註明在良民證上嗎？","a":"一、記載內容：\n依據《警察刑事紀錄證明核發條例》（以下簡稱該條例）第3條規定，「警察刑事紀錄證明，係指警察機關依司法或軍法機關判決確定、執行之刑事案件資料所作成之紀錄證明。」故其記載內容僅限上述判決確定之刑事案件資料，並不包含民事案件紀錄及行政處分（如欠稅、交通違規罰單等）紀錄。\n二、不予核發情形：\n不論本國人及外國人均可以申辦警察刑事紀錄證明，但申請人有下列情形之一者，將不予核發警察刑事紀錄證明（該條例第8條）：\n(一)    受通緝尚未撤銷者。\n(二)    判決確定之刑事案件尚未執行或執行中者。\n三、犯罪紀錄不記載情況：\n除刑事案件仍在審理中或尚未判決確定情形不記載外，依據該條例第6條規定，下列各款刑事案件紀錄，亦不予記載：\n(一)    合於少年事件處理法第八十三條之一第一項規定者。\n(二)    受緩刑之宣告，未經撤銷者。\n(三)    受拘役、罰金之宣告者。\n(四)    受免刑之判決者。\n(五)    經免除其刑之執行者。\n(六)    法律已廢除其刑罰者。\n(七)    經易科罰金或依刑法第四十一條第二項之規定易服社會勞動執行完畢，五年內未再受有期徒刑以上刑之宣告者。","u":"臺北市政府警察局","h":154824,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A026F31AC99F468A","d":"2017-08-03","sid":"A026F31A"},{"q":"寄存通知單（罰單）到案日已過期怎麼辦呢？","a":"您收到到寄存通知單（罰單）到案日已過期不用緊張，依110年3月1日施行「違反道路交通管理事件統一裁罰基準及理細則」第15條第2項規定，前項通知單應載明受通知人收受通知單時應到案日期不足三十日或已逾應到案日期者，得於送達生效日後三十日內到案。即在您收受舉發單後30日內繳款，您可以採用下列方式繳款： （1）親自至到案處所或各地監理機關繳款結案。 （2）到郵局買匯票(罰單所列金額)，連同罰單掛號郵寄至應到案處所。 （3）可以到萊爾富、7-11、全家超商列印違規資料，櫃檯繳費結案。 （4）上監理服務網站 www.mvdis.gov.tw ，利用網路繳費。 （5）利用中華電信語音查詢412-1111轉168 使用信用卡或金融卡繳款。 （6）車籍是臺北者，可以到台北富邦銀行，櫃檯繳費結案 。","u":"臺北市政府警察局交通警察大隊","h":115039,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C2BAFCDE7A59F40C","d":"2021-11-23","sid":"C2BAFCDE"},{"q":"酒駕拒測罰則為何？","a":"（一）111年3月31日施行新修正道路交通管理處罰條例第35條第4項及第5項：\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照及施以道路交通安全講習；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。二、拒絕接受第一項測試之檢定。三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品及其相類似之管制藥品。四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品及其相類似之管制藥品。\n本條例中華民國一百零八年三月二十六日修正條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照及施以道路交通安全講習，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n（二）另內政部警政署業於109年4月21日頒訂「取締酒駕拒測處理作業程序」，駕駛人拒測時，如依客觀事實顯示駕駛人有車行不穩、語無倫次或其他異常行為，足認有不能安全駕駛之情形，執勤員警應依規定陳請檢察官依職權核發鑑定許可書，將其送往受委託之醫療機構強制抽血，並依違反「刑法第185條之3」規定移送法辦。\n（三）刑法第185條之3：\n駕駛動力交通工具而有下列情形之一者，處三年以下有期徒刑，得併科三十萬元以下罰金：一、吐氣所含酒精濃度達每公升0.25毫克或血液中酒精濃度達0.05%以上。二、有前款以外之其他情事足認服用酒類或其他相類之物，致不能安全駕駛。","u":"臺北市政府警察局交通警察大隊","h":101726,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A6FCEF9F2C66D02B","d":"2021-11-23","sid":"A6FCEF9F"},{"q":"「1999臺北市民當家熱線」派工回歸警察局110專線受理相關問題_行政","a":"一、人與動物噪音處理：\n一、警察機關受理噪音檢舉案件常見類型、法源依據及處理原則？\n常見有飼養犬隻吠叫、兒童樓板跑跳、吹（彈）奏樂器、汽機車防盜器及深夜喧嘩等行為產生之噪音。\n1、處理原則：\n（1）有公寓大廈管理委員會：員警受理民眾報案後，員警會先予以約制、勸導，若勸導不聽，有公寓大廈管理委員會，應優先請管委會或管理負責人予以制止或按規約處理，經制止而不遵從者，依「公寓大廈管理條例」第16條，報請本市建築管理處裁處。\n（2）無公寓大廈管理委員會，依據社會秩序維護法第72條處理：\n員警獲報有妨害安寧情事前往處理，依據司法院刑事廳81年3月27日廳刑一字第329號函復臺灣高等法院釋以：「妨害安寧常為鄰居報警，處理警員身歷其境，噪音確實傳於戶外，又經鄰居證實難以忍受者，始可認其為妨害公眾安寧。」, 除依規定對被檢舉人以書面作成勸導外，並應對被檢舉處所之鄰居實施訪查，如經住戶2戶以上具名指證(製作筆錄)，並經員警調查確有妨害安寧情事，始得以社維法移送法辦。\n2、警察機關處理噪音案件之法律依據：\n（1）社會秩序維護法第72條：有左列各款行為之一者，處新臺幣一萬元以下罰鍰：\nA、於公共場所或公眾得出入之場所，酗酒滋事、謾罵喧鬧，不聽禁止者。\nB、 製造噪音或深夜喧嘩，妨害公眾安寧，不聽禁止者。\nC、 無正當理由，擅吹警笛或擅發其他警號者。\n（2）違反社會秩序維護法案件處理辦法。\nA、第11條：本法第72條第2款所稱噪音，係指噪音管制法令規定之管制標準以外，不具持續性或不易量測而足以妨害他人生活安寧之聲音。\nB、第30條：違反本法行為之事實，應依證據認定之。前項行為經警察人員當場發現者，其書面報告得為證據。行為人或嫌疑人之自白，非出於不正方法，且經調查與事實相符者，得為證據。\n二、請問汽車防盜器製造的噪音，是否有法可管？\n汽車防盜器製造的噪音，屬不具持續性或不易量測而足以妨害他人生活安寧之聲音者，由警察局依社會秩序維護法第72條第2款辦理。請逕向當地警察機關反映，民眾若要陳情檢舉可撥110電話報案。\n三、鄰居製造噪音影響生活安寧？\n對於住家產生的噪音，如防盜器、兒童嬉笑聲、鄰居進出門","u":"臺北市政府警察局","h":100321,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4AD4D665ABEA3284","d":"2017-08-03","sid":"4AD4D665"},{"q":"深夜0-6時可否於紅線路段停車，警方執法標準為何？","a":"一、依據「道路交通管理處罰條例」第56條第1項規定：「汽車駕駛人停車時，有下列情形之一者，處新臺幣600以上1,200元以下罰鍰：一、在禁止臨時停車處所停車。」。\n二、惟依據「違反道路交通管理事件統一裁罰基準及處理細則」第12條第1項規定「行為人有下列情形之一，而未嚴重危害交通安全、秩序，且情節輕微，以不舉發為適當者，交通勤務警察或依法令執行交通稽查任務人員得對其施以勸導，免予舉發……六、深夜時段（零至六時）停車，有本條例第56條第1項之情形。但於身心障礙專用停車位違規停車或停車顯有妨礙消防安全之虞，或妨礙其他人車通行經人檢舉者，不在此限。」\n三、深夜時段(0-6時)違規停車，除有本條例第56條第1項於身心障礙專用停車位違規停車、停車顯有妨礙消防安全之虞，或妨礙其他人車通行經人檢舉者及違反本條例第56條第2項併排停車等4種情形，員警依法應予製單舉發外，其餘因未嚴重危害交通安全、秩序或發生交通事故，以不舉發為適當者，得施予勸導。\n四、員警執行勸導勤務時，應先斟酌個案事實、違反情節及行為人之陳述，對得施以勸導之對象，應當場告知其違規事實，指導其法令規定與正確之駕駛或通行方法，並勸告其避免再次違反。施以勸導時，應選擇於無礙交通之處實施，並作成書面紀錄，請其簽名。","u":"臺北市政府警察局交通警察大隊","h":94092,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E93F77D7F9CB194A","d":"2021-11-23","sid":"E93F77D7"},{"q":"腳踏車是否可以騎上人行道?民眾欲檢舉，檢舉流程為何？","a":"一、依道路交通管理處罰條例等相關法規，本市自行車行駛人行道(不含騎樓)，係採「原則禁止、例外開放」；人行道係專供行人通行之用，除非在不妨礙行人通行及行車安全無虞之情況下，主管機關得於人行道設有標誌及標線之路段(行人與自行車共道)，例外開放自行車行駛外，其餘人行道禁止騎乘自行車，且在人車共道之路段自行車亦須禮讓行人優先通行；倘於未設有前述標誌之人行道行駛，係違反「道路交通管理處罰條例」(下稱處罰條例)第74條第5款規定，可處駕駛人新臺幣300元以上1200元以下罰鍰。\n二、為改善本市自行車違規行駛亂象，本局針對「自行車行駛騎樓」及「自行車行駛於人車分道（人行道上劃設自行車道）之人行空間」列為優先取締執法項目，其餘違規行為若未嚴重危害安全秩序者，依「違反道路交通管理事件統一裁罰基準及處理細則」第12條規定得施予勸導。\n三、依據111年4月30日施行新修正「道路交通管理處罰條例」第7條之1規定，自行車相關違規非民眾得檢舉之項目，故民眾如欲檢舉自行車違規，須當場向員警檢舉，由員警依違規事實，引用處罰條例予以舉發。","u":"臺北市政府警察局交通警察大隊","h":91603,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE73992648139986","d":"2021-11-23","sid":"AE739926"},{"q":"紅線禁止停車有無時間規定？暨車輛停放在紅線外側，是否屬違規行為？","a":"一、 依據「道路交通標誌標線號誌設置規則」第169條規定：「禁止臨時停車線，用以指示禁止臨時停車路段，以劃設於道路緣石正面或頂面為原則，無緣石之道路得標繪於路面上，距路面邊緣以30公分為度。……本標線禁止時間為全日24小時，如有縮短之必要時，應以標誌及附牌標示之。」暨「道路交通安全規則」第112條第1項第1款規定：「汽車在禁止臨時停車處所不得停車。」。\n二、 內政部警政署90年8月21日警署交字第175315號函、92年10月21日警署交字第0920149705號函釋，依「道路交通管理處罰條例」第56條第1項第4款規定：「在設有禁止停車標誌、標線之處所停車者。」按其意旨車輛停放在劃有禁止停車線之路段時，其違規事實即已存在；另繪設禁止(臨時)停車標線，其禁停路段並無左右內外之分。是以，無論車輛停放位置係禁停標線內側或外側之道路範圍，或其車體之前(後)懸部分，占用禁停標線長度多少，倘確有在設有禁止停車標線處所停車之事實，應無執法爭議。","u":"臺北市政府警察局交通警察大隊","h":90106,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AA838AF077D5CAAD","d":"2021-11-23","sid":"AA838AF0"},{"q":"民眾在計程車(含多元化計程車)上遺失物品該如何協尋？","a":"一、臺北市政府警察局交通警察大隊服務內容及流程：\n1.申請方式：電話申請或親自到場(可委託他人辦理)。\n2.承辦單位：交通警察大隊綜合組。\n3.連絡電話：02-23116409(24小時)，該專線下班時間亦可撥打，並會自動轉接勤務指揮中心協助。\n4.辦理流程：\n(1)受理乘客乘坐計程車遺失財物之電話或親自報案。\n(2)填寫受理報案紀錄表。\n(3)以乘客提供之線索查詢駕駛人姓名、車號或車行名稱。\n(4)連絡駕駛人或車行協尋失物。\n(5)如有尋獲則代連絡歸還手續並具領結案，未尋獲將查處情形回復當事人。\n如仍有疑問，上班時間請撥電話 (02)23116409，由專人為您服務。\n二、警政署警廣交通網廣播協尋：\n1.上網登錄協尋，網址： https://www.pbs.gov.tw/cht/index.php?code=list&ids=64 (路徑為『中華民國內政部警政署警察廣播電臺』→便民服務→協尋招領服務→協尋遺失物)\n2.廣播協尋：\n答：北部地區民眾可撥打02-23880066失物協尋專線，向電臺服務中心查尋及登錄遺失物品，經電臺查核登錄系統後於節目中廣播協尋。","u":"臺北市政府警察局交通警察大隊","h":86441,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FECB21683500B453","d":"2021-11-23","sid":"FECB2168"},{"q":"現行酒後駕車標準及罰則為何？","a":"（一）道路交通安全規則第114條：\n汽車駕駛人有下列情形之一者，不得駕車：二、飲用酒類或其他類似物後其吐氣所含酒精濃度達每公升0.15毫克或血液中酒精濃度達0.03%。\n（二）111年3月31日施行新修正道路交通管理處罰條例第35條：\n1.汽機車駕駛人，駕駛汽車經測試檢定有酒精濃度超過規定標準者，機車駕駛人處新臺幣1.5萬元以上9萬元以下罰鍰，汽車駕駛人處新臺幣3萬元以上12萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照1年至2年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照2年至4年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n2.本條例中華民國一百零八年三月二十六日修正條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照及施以道路交通安全講習，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n3. 汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照及施以道路交通安全講習；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試之檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品及其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品及其相類似之管制藥品。\n4. 本條例中華民國一百零八年三月二十六日修正條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照及施以道路交通安全講習，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n（三）刑法第185","u":"臺北市政府警察局交通警察大隊","h":80033,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CC011904C6F29778","d":"2021-11-23","sid":"CC011904"},{"q":"如有家屬失蹤，應如何報案？警察單位處理程序如何？","a":"一、民眾報案程序：\n（一）如有家屬失蹤時，其直系血親尊親屬、法定代理人、監護人、配偶、直系血親卑親屬及民法第一千一百二十三條家長、家屬或親屬，均可立即檢具相關證明文件，向警察機關報案請求協尋。\n（二）失蹤人有下列特殊情形時，警察機關亦得依特定單位、人員之報案實施查尋及遵循相關規定事項：\n1、在臺無親屬者，依相關權責單位人員或居住地之村（里）、鄰長之報案辦理。\n2、緊急案件（如山難或其他意外災難）依其同行人員之報案辦理；事後應與其家長（法定代理人）、家屬或親屬聯繫確認。\n3、社政機關或其委託公、私立社福安置機構所安置之保護個案（含法院裁定管束收容），依該管機關（構）之報案辦理，並視個案性質由權責單位依相關規定處理。\n4、家屬委由公、私立社福安置機構照顧之個案，依家屬或安置機構之報案辦理。安置機構報案時，應檢附家屬聯繫資料。\n（三）報案人如能提供失蹤人之照片，由警察單位上網張貼，將更有利於協尋。\n（四）報案人於報案後，可至內政部警政署全球資訊網/便民服務/查尋失蹤人口、身分不明者資料網頁查閱。\n二、警察單位處理程序：\n（一）應即核對報案人及失蹤人身分證明文件，並至受理報案輸入軟體輸登失蹤人之基本資料、發生經過及其他有關線索，於訪談筆錄製作完成後，列印受（處）理案件證明單（以下簡稱證明單）二份。一份連同訪談筆錄陳送分局防治（戶口業務）單位，一份交報案人收執。\n（二）員警應主動徵詢報案人意願並載明於筆錄之事項如下：\n1、是否同意相片建檔，同意者，可使用其所提供之相片；無相片可提供時，可使用經刪除個人基本資料之國民身分證相片影像檔；未依相關規定辦理者，依警察機關加強戶政資訊稽核實施計畫規定懲處。\n2、是否同意警察機關提供媒體網路公開協尋。\n3、是否同意提供衛生福利部及其所屬擇定之失蹤協尋單位公開協尋。\n（三）受理完成後，調閱相關資料或以查訪民眾等方式查尋失蹤人行蹤。\n（四）失蹤人口查尋案件涉及刑事案件時，應立即陳（通）報刑事單位處理。\n（五）經查明失蹤者確已出境，惟未滿二年且設籍在臺時，應委婉告知報案人；報案人堅持報案時，仍應受理，並視失蹤者實際出境地區，陳報警察局函請外交部、大","u":"臺北市政府警察局","h":79228,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=598355A03E8790C9","d":"2022-05-17","sid":"598355A0"},{"q":"那些交通違規行為可以勸導？","a":"依據違反道路交通管理事件統一裁罰基準及處理細則第十二條規定：行為人有下列情形之一，而未嚴重危害交通安全、秩序，且情節輕微，以不舉發為適當者，交通勤務警察或依法令執行交通稽查任務人員得對其施以勸導，免予舉發：\n一、有本條例第14條第2項第2款、第25條第2項、第31條第5項、第31條之1第3項、第41條、第44條第1項第1款、第3款至第7款、第52條、第69條第2項、第73條第1項第1款至第3款、第5款、第74條第1項、第76條第1項、第2項、第81條、第82條第1項第1款或第84條之情形。\n二、駕駛四輪以上汽車於號誌燈號變換之際，因未能依號誌指示及時停止，致前懸部分伸越在機車停等區內，惟前輪尚未進入該停等區內。\n三、駕駛汽車於號誌燈號變換之際，因未能依號誌指示及時停止，致前懸部分伸越停止線，惟前輪尚未超越該停止線。\n四、駕駛大型車輛在多車道右轉彎，因車輛本身、道路或交通狀況等限制，如於外側車道顯無法安全完成，致未能先駛入外側車道。\n五、駕駛汽車因上、下客、貨，致有本條例第55條之情形，惟尚無妨礙其他人、車通行。\n六、深夜時段（零至六時）停車，有本條例第56條第1項之情形。但於身心障礙專用停車位違規停車或停車顯有妨礙消防安全之虞，或妨礙其他人車通行經人檢舉者，不在此限。\n七、駕駛汽車因交通管制設施設置不明確或受他物遮蔽，致違反該設施之指示。\n八、駕駛汽車在交通管制設施變換之處所，致無法即時依變換後之設施指示行駛。\n九、駕駛汽車隨行於大型車輛後方，因視線受阻，致無法即時依標誌、標線、號誌之指示行駛。\n十、駕駛汽車因緊急救護傷患或接送身心障礙者上、下車，致違反本條例規定。\n十一、駕駛汽車行車速度超過規定之最高時速未逾十公里。\n十二、駕駛汽車或慢車經測試檢定，其吐氣所含酒精濃度超過規定之標準值未逾每公升0.02毫克。\n十三、駕駛汽車裝載貨物超過核定之總重量或總聯結重量，未逾百分之十。\n十四、駕駛汽車因閃避突發之意外狀況，致違反本條例規定。\n十五、因客觀具體事實，致違反本條例規定係出於不得已之行為。\n十六、其他經交通部及內政部會商核定之情形。\n行為人發生交通事故有前項規定行為，除","u":"臺北市政府警察局交通警察大隊","h":76449,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CC8AFCE61BE1FEDF","d":"2021-11-23","sid":"CC8AFCE6"},{"q":"如何檢舉臺北市政府警察局員警違法或失職？","a":"（一）\n反映臺北市政府警察局員警「違法違紀」或「態度不佳」，請聯繫督察室市民專線：(02)2331-9433 ；傳真：(02)2331-9442\n或透過「 臺北市陳情系統 」，臺北市民當家熱線1999、外縣市(02)2720-8889，即時錄案。\n（二）\n反映臺北市政府警察局員警涉及「貪瀆」、「洩密」，請聯繫政風室檢舉專線：(02)2388-7110，政風室信箱 TCPD-iab@gov.taipei\n或透過「 臺北市陳情系統 」，臺北市民當家熱線1999、外縣市(02)2720-8889，即時錄案。","u":"臺北市政府警察局","h":75541,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6F62FF0BBC901D61","d":"2011-10-13","sid":"6F62FF0B"},{"q":"配戴安全帽相關法律規定為何？","a":"配戴安全帽相關法律規定為何？\n一、依「道路交通安全規則」第88條第2項規定：機車駕駛人及附載座人應依下列規定配戴安全帽：\n(一)安全帽應為乘坐機車用之安全帽，經經濟部標準檢驗局檢驗合格，並於帽體貼有商品檢驗標識。\n(二)帽體及相關配件必須齊全，並無毀損、鬆脫或變更之情事。\n(三)配帶時安全帽應正面朝前及位置正確，於顎下繫緊扣環，安全帽並應適合頭形，穩固戴在頭上，不致上下左右晃動，且不可遮蔽視線。\n二、依「道路交通安全規則」第115條之7規定：微型電動二輪車駕駛人應依下列規定配戴安全帽：\n(一)安全帽應為乘坐機車用或自行車用之安全帽，經經濟部標準檢驗局檢驗合格，並於帽體貼有商品檢驗標識。\n(二)帽體及相關配件必須齊全，並無毀損、鬆脫或變更之情事。\n(三)配戴時安全帽應正面朝前及位置正確，於顎下繫緊扣環，安全帽並應適合頭形，穩固戴在頭上，不致上下左右晃動，且不可遮蔽視線。\n三、按「道路交通管理處罰條例」第31條第6項規定：「機車駕駛人或附載座人未依規定戴安全帽者，處駕駛人新臺幣500元罰鍰。」第 73 條第4項規定：「微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣300元罰鍰。」\n四「高速公路及快速公路交通管制規則」第20條規定，大型重型機車行駛於快速公路，除該規則另有規定外，應比照小型車行駛規定。駕駛人及附載座人均應依「道路交通安全規則」第88條第2項規定配戴安全帽，且其安全帽應為全面式或露臉式，違者依「道路交通管理處罰條例」第33條第3項規定，處駕駛人新臺幣600以上1,200元以下罰鍰。","u":"臺北市政府警察局交通警察大隊","h":56414,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A67AF6C7917E0BF5","d":"2021-11-23","sid":"A67AF6C7"},{"q":"請問我如何使用網頁「手機門號查詢」功能呢?","a":"查詢之服務網路平臺連結程序：\n請連結至警察局網頁https://police.gov.taipei/\n一、進入後點選「為民服務」→「拾得手機整合資訊平台專區」 →「內政部警政署拾得遺失物網路公告區」→ 「拾得物招領網路公告」→ 「電信門號」欄位輸入手機門號 → 輸入驗證碼 → 「查詢」→  即顯示查詢結果。\n二、「北市警政APP」:請先行下載「北市警政APP」即進入後點選「便民查詢」→ 「遺失物招領公告」→ 「拾得物招領網路公告」 → 「電信門號」欄位輸入手機門號 → 輸入驗證碼 → 「查詢」→  即顯示查詢結果。\n（※目前本系統建檔係以向本市轄內派出所報案，且同意警方公布手機門號為限，並未含括全國所有「失竊、被盜（搶）、遺失」手機之資料，查詢結果僅係供民眾參考之用）。","u":"臺北市政府警察局刑事警察大隊","h":50181,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=77A9A693F5251FBE","d":"2012-10-31","sid":"77A9A693"},{"q":"我的家人失蹤了而且有自殺傾向怎麼辦?","a":"（一）本國目前查尋之失蹤人口，指在臺設有戶籍，並有下列情形之一且行方不明者：\n1、隨父（母）或親屬離家。\n2、離家出走。\n3、意外災難（例如海、空、山等災難）。\n4、迷途走失。\n5、上下學未歸。\n6、智能障礙走失。\n7、精神疾病走失。\n8、失智症走失。\n9、天然災難（例如水、火、風、震等災難）。\n10、其他原因失蹤。\n（二）如有家屬失蹤，應如何報案？\n1、如有家屬失蹤時，其直系血親尊親屬、法定代理人、監護人、配偶、直系血親卑親屬及民法第一千一百二十三條家長、家屬或親屬，均可立即檢具相關證明文件（報案人身分證、戶口名簿、失蹤人照片），前往警察機關報案請求協尋。\n2、失蹤人有下列特殊情形時，警察機關亦得依特定單位、人員之報案實施查尋及遵循相關規定事項：\n（1）在臺無親屬者，依相關權責單位人員或居住地之村（里）、鄰長之報案辦理。\n（2）緊急案件（如山難或其他意外災難）依其同行人員之報案辦理；事後應與其家長（法定代理人）、家屬或親屬聯繫確認。\n（3）社政機關或其委託公、私立社福安置機構所安置之保護個案（含法院裁定管束收容），依該管機關（構）之報案辦理，並視個案性質由權責單位依相關規定處理。\n（4）家屬委由公、私立社福安置機構照顧之個案，依家屬或安置機構之報案辦理。安置機構報案時，應檢附家屬聯繫資料。\n3、警察機關對於失蹤人口報案，應不分本轄或他轄立即受理，不得拒絕或推諉。但經查明有下列情形，不在此限：\n（1）因案通緝者。\n（2）入監服刑或因案羈押者。\n（3）出境滿二年未有入境紀錄，且戶籍已遷出國外者。\n（4）死亡或已受法院死亡宣告者。\n（5）為詐領社會福利補助、保險或其他事由者。\n（6）其他法律規定不得受理者。\n4、報案人於報案後，可至內政部警政署全球資訊網/便民服務/查尋失蹤人口、身分不明者資料網頁查閱。\n（三）失蹤人有下列情形之ㄧ，受理時應實施緊急查尋：\n1、罹患重病者（以全民健康保險法所定之重大傷病為範圍）。\n2、有自殺之虞者。\n3、有被誘拐脅迫之虞者。\n4、未滿七歲者（家屬擅自帶離除外）。\n5、七歲以上未滿十二歲且領有身心障礙證明者（家屬擅自帶離除外）。\n6、其他重大急","u":"臺北市政府警察局","h":48659,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3629BF91ECDDE046","d":"2020-11-11","sid":"3629BF91"},{"q":"發現仿冒品、盜版品該向哪個單位檢舉？","a":"發現仿冒品、盜版品可撥打檢舉專線0800-016-597，向內政部警政署刑事警察局智慧財產權偵查大隊檢舉，或逕向當地派出所報案，或撥打110檢舉，警方將派員前往查處。","u":"臺北市政府警察局刑事警察大隊","h":48304,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E08994CC0602188A","d":"2014-05-28","sid":"E08994CC"}]},{"org":"捷運工程局","total":106,"items":[{"q":"機電設計>台北捷運系統之車廂尺寸為何？","a":"(1)高運量電聯車部分：車廂尺寸為：23.5公尺(長度) X 3.2公尺(寬度) X 3.6公尺(高度)， 除部分支線係以3節車廂營運外，其它主線列車均以六節車廂營運，6車列車總長度為141公尺，3車列車總長度為70.5公尺。\n(2)中運量電聯車部分：原木柵線馬特拉車廂尺寸為：13.78公尺(長度) X 2.56公尺(寬度) X 3.53公尺(高度)， 每列車以四節車廂營運，列車總長度為55.12公尺。文湖線龐巴迪車廂尺寸為：13.78公尺(長度) X 2.54公尺(寬度) X 3.53公尺(高度)， 每列車以四節車廂營運，列車總長度為55.12公尺。(機設處)","u":"臺北市政府捷運工程局","h":25396,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64BA8365B018394B","d":"2023-11-02","sid":"64BA8365"},{"q":"機電設計>台北都會區大眾捷運系統路網中，各路線所採購之列車數為何？","a":"淡水線(CT301標)共採購22列六車列車(132輛)。\n新店線(CH321標)共採購11列六車列車(66輛)。\n南港線(CN331標)共採購17列六車列車(102輛)。\n中和線(CC361標)共採購8列六車列車(48輛)。\n原木柵線(CC350標)共採購51對(102輛)電聯車。\n文湖線(CB370標)共採購101對(202輛)電聯車。\n土城線(CP341標)共採購6列六車列車(36輛)。\n新莊線(CK371標)共採購20列六車列車(120輛)。\n蘆洲線(CL601標)共採購4列六車列車(24輛)。\n南港線東延段(CE631標)共採購4列六車列車(24輛)。\n新店線小碧潭站(CH321A標)共採購3列三車列車(9輛)。\n信義線(CR381標)共採購13列六車列車(78輛)。\n松山線(CG391標)共採購10列六車列車(60輛)。\n臺北捷運公司(TAA001標)增購24列六車列車(144輛)。\n土城線延伸頂埔段(CD311A標)增購1列六車列車(6輛)。\n環狀線第一階段(CF610標)共採購17列四車列車(68輛)。(機設處)","u":"臺北市政府捷運工程局","h":19718,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C8602F8588914E91","d":"2008-07-08","sid":"C8602F85"},{"q":"工程管理>捷運在建工程(施工中)各線預定完工年期？","a":"1.萬大-中和-樹林線第一期:116年。\n2.環狀線-北環段及南環段:120年。\n3.環狀線-東環段:123年。\n捷運各線雖受一例一休、疫情、缺工缺料等大環境影響，惟本局仍依預定完工期程加速辦理。另工程完工後，需依「大眾捷運系統履勘作業要點」，完成相關營運要件後，經市府初勘、交通部履勘通過後，再由臺北市政府正式對外宣布營運通車日期。(工務管理處)","u":"臺北市政府捷運工程局","h":19610,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5154D7C19D53C545","d":"2022-08-29","sid":"5154D7C1"},{"q":"拆遷補償>臺北市合法建物之拆遷補償費如何計算，標準為何？","a":"臺北市合法房屋之拆遷補償費係依據「臺北市舉辦公共工程拆遷補償自治條例」第7、9條辦理，合法建築物拆遷補償費，按重建價格補償，以拆除面積乘重建單價計算，室外附屬雜項工作物按其構造計算。\n(一)拆除面積：已辦建物登記者，照登記面積計算，其未登記者，依建築物各層外牆以內面積計算， 未達66平方公尺者一律以66平方公尺計算；面積計算未滿1平方公尺之尾數，以1平方公尺計算。\n(二)重建單價：依照房屋結構（分為1.鋼筋混凝土造2.加強磚造、加強混凝土空心磚造3.磚造、石造、木造4.鐵造、鐵皮造5.土造6.竹造等6種）、樓層數（平房至18樓，分9級）及建築裝修等級（依外牆、內牆、天花板、地板、門窗等5項，分為上、中、下3級）評定。(綜規處)","u":"臺北市政府捷運工程局","h":19602,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A67BEC936891C7F1","d":"2018-02-01","sid":"A67BEC93"},{"q":"路網規劃>台北捷運系統為我們帶來的好處。","a":"捷運系統能為社會創造多方面的效益，大體而言，捷運系統的效益為：\n(一)國家與社會效益：\n1.提高國際政經地位。\n2.提昇交通運輸與科技。\n3.為我國技術水準及經濟成長之展示櫥窗。\n(二)運輸效益：\n1.減少道路交通擁擠，提高運輸效率。\n2.具有大量載客疏導交通的能力。\n3.改善都市交通秩序與停車問題。\n4.改善運輸工具的結構。\n5.整合都會區整體運輸機能。\n(三)經濟及發展效期：\n1.使用者效益高。\n2.交通安全效益高。\n3.營運成本低。\n4.提供就業機會，促使就業市場的人力能充分利用。\n(四)環境的效益：\n1.減少空氣污染。\n2.提供乘客舒適的乘載環境。\n3.提高都市生活品質。\n(五)都市與土地均衡發展：\n1.均衡都市發展與土地使用。\n2.促進土地發展並提高土地之使用性。\n3.改善都市發展結構。\n4.帶動新市區之發展及建設。\n(六)擴大都市活動空間分散人口壓力：\n1.改善居住環境及習慣，均衡都市與郊區人口，提高生活品質。\n2.擴大都市活動範圍，疏散都市中心區人口壓力。\n3.帶動衛星市鎮的發展。(綜規處)","u":"臺北市政府捷運工程局","h":17171,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1EAD9C583E0DEADC","d":"2018-04-17","sid":"1EAD9C58"},{"q":"拆遷補償>人口搬遷補助費之請領依據及標準如何？有否人口數之限制？由誰代表領取？","a":"(一)依「臺北市舉辦公共工程拆遷補償自治條例」第12條規定：拆遷公告二個月前在該址設有戶籍並有居住事實之現住人口應發給遷移費及「臺北市舉辦公共工程拆遷補償自治條例施行細則」第9條規定：建築物全部拆除者，於限期內自行遷移並遷出戶籍後，發給人口遷移費。建築物部分拆除者，於就地整建或門面修復，且於期限內，免遷出戶籍，自行暫時搬遷後，發給人口暫行遷移費。 (二)發給標準：以戶為單位，建築物全部拆除人口遷移費2人以下者12萬元，每多1人增加4萬元，6人以上者28萬元為上限。建築物部分拆除人口暫行遷移費2人以下者9.6萬元，每多1人增加3.2萬元，6人以上者22.4萬元為上限。 (三)發給時由戶長代表領取。 (綜規處)","u":"臺北市政府捷運工程局","h":15065,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D070CC1BA3146006","d":"2018-02-01","sid":"D070CC1B"},{"q":"聯合開發>什麼叫做土地開發？","a":"土地聯合開發與民間的合建類似，就是透過變更都市計畫程序，由劃定為「捷運開發區」範圍內之土地所有人提供土地，並由主管機關（臺北市政府）依程序徵求投資人（建商）出資興建聯合開發建物，且利用土地所有人部分土地興建捷運設施，但捷運設施所使用之空間，則不計入容積。另為鼓勵民眾參與土地聯合開發，對其提供土地興建捷運設施，得以提高允建容積方式辦理（含捷運土地開發獎勵與都市計畫獎勵），如此一來，土地所有人除享有原有可建樓地板面積（即不影響其原有權益）外，還可與政府共同分享獎勵樓地板面積。亦即土地開發為政府興建捷運系統，除一般徵收外的另一種土地取得方式，可有效利用土地資源、促進都市發展、改善地區環境與景觀。土地所有人參與聯合開發，其土地不必被徵收，且可分享土地有效利用及改善生活環境之效益，並獲取開發利潤，至於投資人則經由此一投資開發案而獲取合理利潤，因此實為三贏之作法。(開發處)","u":"臺北市政府捷運工程局","h":14582,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E5C12371AC09FE84","d":"2010-05-05","sid":"E5C12371"},{"q":"機電設計>請問捷運第三軌電力使用750V直流電供應電聯車，而電聯車車上設備係採用直流電源或交流電源？","a":"電聯車上電源規劃分別有推進系統及輔助電力系統。推進系統係採用變頻變壓方式提供給三相交流牽引馬達；輔助電力系統則係採用靜態換流器提供三相380V交流電源予電聯車上之空調機、空壓機、散熱風扇與車廂內插座所需之單相110V交流電源，以及採用電池充電器提供110V直流電源予列車所有低壓設備所需之電力(如車輛照明、列車監控、車載通訊、號誌設備…等)。(機設處)","u":"臺北市政府捷運工程局","h":14382,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B5139061AB63009C","d":"2008-07-10","sid":"B5139061"},{"q":"機電設計>請說明捷運文湖線列車與舊有木柵線列車之差異性？","a":"台北捷運文湖線龐巴迪列車為全自動無人駕駛之中運量電聯車，能與原木柵線既有設施相容，每列車有4節車廂(由兩組對車聯掛編成)，營運上採用「一車到底」之方式營運，乘客無需中途換車，該列車與原木柵線馬特拉列車均可行駛於文湖線全線各車站。文湖線龐巴迪車廂之設計特性如下：\n(1)原木柵線舊車廂座椅為縱橫混合式配置，文湖線新車廂改採縱向式配置。且車廂內部設有行李層架，以因應松山機場站旅客攜帶航空行李之空間需求。\n(2)車廂天花板安裝有LED站名顯示器(與原木柵線類似)，且車門上方增設「閃燈式電子路線圖」，以提供更完善之站名資訊服務。\n(3)車廂內設置CCTV閉路電視系統及火警偵測器以增進營運安全。\n(4)車輛外觀顏色與原木柵線車輛類似但車頭造型較為流線，內裝顏色則與原木柵線車廂不同(採用藍色座椅、灰色地板、米白色內牆及天花板等)。(機設處)","u":"臺北市政府捷運工程局","h":13961,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=32884705CA42476A","d":"2008-07-11","sid":"32884705"},{"q":"機電設計>捷運閉路電視(CCTV)系統如何朝數位化發展?","a":"捷運閉路電視(CCTV)系統設計，透過數位化以數位錄影機 (DVR)及磁碟陣列(RAID5)取代VCR(類比卡式錄影機) ，數位影像可大量錄影，監視畫面可以16分割、9分割、4分割顯示，運用圖形化使用者介面，可快速地搜尋歷史影像資料，並可由TCP/IP、Intranet/Internet網路作遠端即時監控。文湖線電聯車上CCTV系統應用無線電傳輸技術( 5.8G頻段，802.11a標準)，將文湖線列車內旅客狀況影像運用JPEG壓縮技術以GE(Gigabit Ethernet)以太網路為主幹，傳輸回行控中心監控。從環狀線開始，CCTV系統規劃則採用IP攝影機取代類比攝影機，系統從終端、傳輸、錄影、監控全面數位化。(機設處)","u":"臺北市政府捷運工程局","h":13625,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BD300F82EF0B9C7E","d":"2008-08-20","sid":"BD300F82"},{"q":"機電設計>台北捷運新購之高運量列車有那些設計特色？","a":"捷運局為強化服務品質並增進行車安全，近年新購之新莊線、蘆洲線高運量電聯車有如下之設計特性：\n(1)列車頭尾(第1,6節)車廂規劃為腳踏車專用車廂並設置多功能行李支架。\n(2)車廂內部增設CCTV閉路電視系統及火警偵煙器，以增進營運安全。\n(3)車門上方安裝LED站名顯示器，以提供旅客站名資訊服務。\n(4)車側安裝LED目的地顯示器，以利乘客辨識列車行駛路線。\n(5)車廂內裝使用低煙難燃材料(如FRP等)，以兼顧輕量與防火安全性。\n(6)車廂滅火器數量由2具增加為4具。\n(7)車側設置可同時開啟同側4組車門之開關，以增進逃生安全性。\n(8)駕駛室設置列車監控資訊電腦系統，以利司機員掌控列車操作及設備故障訊息。\n此外，更新款之信義/松山線電聯車在新蘆線電聯車既有設計基礎上更進一步強化其設計品質，增加如下新設計：\n(1)車型流線化並設置車頭裙板以增進車輛之美觀性。\n(2)車廂扶手多元化，設置環型水平扶手、弧型車門扶手及3叉式車門立柱以增加扶手可及性。\n(3)車廂設置LCD彩色液晶顯示器(每車6具)。\n(4)車廂CCTV閉路電視攝影機數量增加為每車4具，並於駕駛室增設1具CCTV攝影機。\n(5)車廂滅火器採嵌入式設計以增加通道淨空。\n(6)每一車組各節車廂間之車間走道內部護板採一體式設計以增加安全與美觀性。(機設處)","u":"臺北市政府捷運工程局","h":13544,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=338693B009FA99D5","d":"2008-07-11","sid":"338693B0"},{"q":"路網規劃Q01>何謂L型路網，對旅客有何好處？","a":"A01：為讓搭乘臺北捷運乘客有更多的轉乘路徑選擇，臺北捷運規劃棕線、紅線、綠線、橘線、藍線等5條路線，採數個L型路線環環相扣，使得L型的紅線、綠線與橘線相互之間都有二次交會，乘客可以選擇適宜轉乘車站換乘路線，除了橘線(中和新蘆線)往來棕線(文湖線)外，其餘各路線最多1次轉乘，都可以跨路線到達目的地。在環狀線通車後，轉乘路徑將有更多選擇。(綜規處)","u":"臺北市政府捷運工程局","h":13288,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4D158FBF99A32107","d":"2019-01-19","sid":"4D158FBF"},{"q":"機電設計>捷運系統之電力供應方式如何供應給電聯車使用？","a":"捷運系統自設161kV/22kV主變電站自台電變電所引接161kV交流高壓電源，經主變電站變壓器降壓為22kV電力後，由牽引電力輸電網路配送至各牽引動力配電室，再經由牽引動力配電室內之變壓器降壓至約589V交流電，經三相全波整流器整流成750V DC，透過高速直流軌道饋線斷路器饋電至導電軌系統，電聯車再以車上集電靴從導電軌引接直流電力使用。(機設處)","u":"臺北市政府捷運工程局","h":12965,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8479A791E9FB60C0","d":"2008-07-10","sid":"8479A791"},{"q":"拆遷補償>捷運徵收私有土地之補償標準及依據為何？","a":"捷運徵收私有土地之補償費法令依據為「土地徵收條例」及「大眾捷運法」其相關條文節錄如下請參考。1.土地徵收條例第3條：國家因公益需要，興辦「交通事業」，得徵收私有土地；徵收之範圍以其事業所必須者為限。2.土地徵收條例第30條：被徵收之土地，應按照徵收當期之市價補償其地價。3.大眾捷運法第6條：大眾捷運系統需用之土地，得依法徵收之。 註：依101年1月4日修正公布之土地徵收條例第30條規定：「被徵收之土地，應按照徵收當期之市價補償其地價。在都市計畫區內之公共設施保留地，應按毗鄰非公共設施保留地之平均市價補償其地價。前項市價，由直轄市、縣（市）主管機關提交地價評議委員會評定之。各直轄市、縣（市）主管機關應經常調查轄區地價動態，每六個月提交地價評議委員會評定被徵收土地市價變動幅度，作為調整徵收補償地價之依據。前三項查估市價之地價調查估計程序、方法及應遵行事項等辦法，由中央主管機關定之。」。依上開規定：被徵收之土地應按「市價」辦理補償，並由行政院核定自101年9月1日起施行。(綜規處)","u":"臺北市政府捷運工程局","h":12715,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5C8087E36FA199D6","d":"2018-01-05","sid":"5C8087E3"},{"q":"機電設計>台北捷運環狀線(第一階段)南機廠之維修規模等級為何?","a":"環狀線(第一階段)南機廠為五級全功能機廠，能夠滿足17列車最高等級之必要維修；主要設備包括列車頂舉設備、列車檢修軌(更換機油,各項靜態檢測,底盤下設備檢修,空調測試)、滑動供電、車輪地下鏇削車床系統、輪軸工場設備、電聯車各子維修工場、機械/電機工場、焊接與NDE檢測工場、倉儲系統、搬運電動車輛、空壓系統、列車清洗設備、轉向架/底盤沖洗設備、各式起重機具、軌道特種車輛、復軌/救援設備、工具機與手工具等等；並具訓練新進員工設施及提供環狀線64列電聯車駐車與調度功能需求。(機設處)","u":"臺北市政府捷運工程局","h":12559,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FBD0781738364C02","d":"2008-07-11","sid":"FBD07817"},{"q":"機電設計>捷運之主變電站附近地區據說電磁波會影響人體健康，請說明。","a":"捷運引接自台灣電力公司之電力頻率為60赫茲，為因應用電需求，變壓器為現代文明必要之電力輸配電設備，而相關變壓器等設備所伴生的低頻電磁場係屬非熱效應之物理環境能量，其能量極低，並不像一般所稱輻射線具有高能量。故不會對人體產生暴露累積的效應，而目前各國的研究，現階段均無法證明此等電力設備之電磁場會對健康產生不良的影響。另外， 磁場會隨距離快速衰減，其在民眾生活空間之磁場已甚低，一般家庭電器在近距離使用時所產生的磁場值往往遠超過在變電所、輸電線鄰近處所量測到的磁場值。在已發表的文獻中，目前沒有可確信證據支持暴露在家電器具、電力線等之極低頻磁場會產生健康危害。截至目前為止，世界各國對磁場限制之標準不一，本局將遵循我國環保署於民國九十年元月十二日公告「非游離輻射環境建議值」，推估電力設施磁場建議值為八三三毫高斯，作為磁場暴露的根據。(資料來源參考台電公司網站Q and A)。(機設處)","u":"臺北市政府捷運工程局","h":12378,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CA6B2D210F66F96D","d":"2008-07-10","sid":"CA6B2D21"},{"q":"機電設施>環狀線全線之路線與型式為何?","a":"環狀線係採鋼軌鋼輪全自動無人駕駛中運量系統，全線共分為「環狀線第一階段」、「南環段與北環段」、「東環段」，三個階段逐次興建。\n（一）環狀線第一階段已通車營運：路線自新店大坪林站以地下沿新店民權路過中正路後出土，續以高架沿中和景平路、中山路、板南路、板橋板新路、縣民大道至板橋火車站、文化路、民生路、新莊思源路、終於五工路（自新店線大坪林站交會站起至新莊新北產業園區段），共15.4公里，14車站(地下1站，高架13站) 及1座機廠。\n（二）後續發展：接續第一階段路線，其餘部分尚包括北環段＋南環段＋東環段形成全環路線，北環段、南環段及東環段皆已進入興建中。\n（1）北環段：銜接第一階段路線自新北產業園區五工路由高架轉入地下方式續沿五權路、高速公路南側、四維路、蘆洲集賢路，循重陽橋進入臺北市區後，沿著士林社子、中正路、至善路至大直北安路南側於劍南路站銜接東環段，並與文湖線劍南路站交會轉乘，共14.93公里， 12車站及1座地下機廠。\n（2）南環段：文湖線動物園站起，採地下方式沿新光路穿越山區接秀明路二段，經政治大學校內四維道，穿越景美溪後行經木新路再接木柵路、穿越景美溪進入新北市區，沿新店榮工廠地周邊地區工業區旁之防汛道路，續西行於民權路與第一階段路線大坪林站銜接，並可轉乘新店線，共5.73公里，6車站（地下6站，不包括Y6大坪林站）。\n（3）東環段：經敬業三路、沿樂群二路後轉進瑞光路，於瑞光公宅後，西轉進陽光街321巷東側坡地，通過國1後進入舊宗路，經成美橋、南港路至松山新店線松山站(松山車站)，後經松山路行經板南線永春站、沿松德路後轉松德路168巷經興雅國中與博愛國小後，轉至松仁路抵達淡水信義線象山站，再續往南行，路線略平行於信義快速道路，通過國3甲萬芳交流道後穿越景美溪至新光路下方與環狀線南環段動物園站銜接，約13.25公里，10車站及1座地下機廠（地下10站）。","u":"臺北市政府捷運工程局機電系統工程處","h":12087,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5283528B7AF0EECA","d":"2026-01-16","sid":"5283528B"},{"q":"機電設計>整體路網月台門政策變遷？","a":"捷運路網系統分有司機員駕駛之高運量系統，及無司機員駕駛之中運量系統。而中運量系統文湖線因為無司機員駕駛，為考量系統整體運作安全，故皆設置月台門。另高運量系統因為有司機員駕駛，先期路網之車站（如淡水、新店線等）考量月台如有緊急狀況，司機員可立即判斷處理來操控列車，故未設置月台門，後因考量月台視覺、旅客舒適及時代潮流，因此於後期路網之車站（如新莊、蘆洲線、信義線、松山線等）皆設置月台門，以加強旅客之服務。(機設處)","u":"臺北市政府捷運工程局","h":11969,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=081193FA0DC235CA","d":"2008-08-13","sid":"081193FA"},{"q":"機電設計>文湖線行車監控系統(CBTC)更新之前木柵線有何具體改進？","a":"文湖線行車監控系統採用了世界最新一代號誌CBTC無人駕駛系統，該系統使用無線電通訊並以軟體取代部分硬體設施之建置，故不論軌旁或號誌設備房之設備皆減少許多，因此可在不影響營運之狀況下完成號誌系統之更新。使營運公司之操作及維修保養上亦將更為簡易。(機設處)","u":"臺北市政府捷運工程局","h":11724,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=588C92E55C98ED52","d":"2010-05-03","sid":"588C92E5"},{"q":"機電設計>台北捷運新莊線蘆洲線機廠之維修規模等級為何？","a":"(1)新莊機廠：負責新莊線列車三級維修及支援松山線列車維修。\n(2)蘆洲機廠：負責蘆洲線列車準五級維修及支援信義線列車維修，本機廠配備有測試軌。(機設處)","u":"臺北市政府捷運工程局","h":11579,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A65DFDD37AA3190E","d":"2008-07-11","sid":"A65DFDD3"},{"q":"機電設計>捷運號誌系統之主要組成為何？","a":"台北捷運號誌系統一般稱為自動列車控制系統，此系統主要包含自動列車操作系統，自動列車保護系統，及自動列車監督系統等3個子系統。(機設處)","u":"臺北市政府捷運工程局","h":11503,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7855A32C4393E55F","d":"2008-07-15","sid":"7855A32C"},{"q":"機電設計>捷運通訊傳輸系統為何使用光纖？","a":"通訊傳輸系統使用光纖，主要是提高傳輸頻寬及速度、減少軌旁管線配置空間、減少軌旁管線維修成本，亦可避免車載設備及軌旁電力電纜對信號所產生的電磁干擾。(機設處)","u":"臺北市政府捷運工程局","h":11453,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8667FD31EA45D1A9","d":"2008-07-15","sid":"8667FD31"},{"q":"機電設計>請說明台北捷運路網採用何種無線電系統？","a":"台北捷運無線電系統原規設為傳統之類比式無線電系統。目前無線電系統之發展已邁向數位式無線電系統，由於數位式無線電系統訊號品質更佳，可傳輸語音及數據訊號，並具加密及保密功能，運用更有彈性，所以臺北捷運系統開始全面轉換為數位式TETRA無線電系統。(機設處)","u":"臺北市政府捷運工程局","h":11450,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C1ECD305CF4046F9","d":"2008-08-20","sid":"C1ECD305"},{"q":"機電設計>內湖線經過松山機場，車站收費閘門有無針對航空旅客大件行李通行的特別考量？","a":"1、在松山機場站全站採安裝加寬型收費閘門(走道寬70公分，一般閘門走道寬50cm)設置，且本站增設三組無障礙閘門﹙走道寬110cm﹚，可滿足機場旅客需求。\n2、在捷運各站均有加寬型閘門及無障礙閘門，可服務攜帶行李的旅客。(機設處)","u":"臺北市政府捷運工程局","h":11421,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F7FAFA19CEFB2378","d":"2008-08-20","sid":"F7FAFA19"},{"q":"路網規劃>為何捷運路線最小曲率半徑要定為200公尺","a":"臺北捷運高運量系統捷運列車係由六節電聯車車箱組成，每節電聯車車箱長23.5公尺，車廂間可以互通，行駛時，因每節車廂為固定之直線，無法隨曲線變化，不同之轉彎半徑會造成車廂不同之偏移量，當轉彎半徑小於 200公尺時，列車在轉彎時將因車廂侵入維修空間及撞擊懸掛管線之狀況而影響行車安全，故將最小轉彎半徑限制在200公尺。(綜規處)","u":"臺北市政府捷運工程局","h":11368,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FAD954DEB5C83302","d":"2018-04-17","sid":"FAD954DE"}]},{"org":"兵役局","total":98,"items":[{"q":"●兵役體檢：「已經完成徵兵檢查役男，何時會收到體格檢查表？」","a":"除了還須再安排進一步專科檢查之案件外，檢查醫院會於役男完成徵兵檢查後2週內將檢查結果送回戶籍地直轄市、縣（市）政府召開徵兵檢查會判定體位，完成體位判等後，戶籍地直轄市、縣（市）政府即隨將體格檢查表函送鄉（鎮、市、區）公所派員送達役男或其家屬簽收，整體作業流程約計1至1個半月左右。 如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":181489,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=574A8193A82D6096","d":"2020-03-23","sid":"574A8193"},{"q":"●兵役體檢：體位區分標準 -「役男如何知道自身健康狀況的變化是否已達改判體位標準？」","a":"如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":152597,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EC58275C4DF65EBC","d":"2020-03-20","sid":"EC58275C"},{"q":"●全民健保：「入營服役後役男之（全民健康保險）如何辦理？費用如何負擔？」","a":"一、義務役常備官(士)兵及替代役役男 自90年2月1日起已納入全民健康保險對象，入營後，健保費分別由國防部、內政部編列預算於役男入伍當月開始負擔；退伍(役)、結訓當月健保費由役男自行負擔。役男入營前配合事項如下：\n（一）應徵入營者 ，應於入營前持徵集令影本向原投保單位辦理健保「轉出」（轉出日期為入營前1日），原健保卡不必繳回繼續使用；入營後，由收訓單位統一辦理健保「轉入」。\n（二）入營前 ，若尚未加入全民健康保險或有中斷投保者，請儘速至戶籍地區公所健保單位補辦投保及轉出手續。\n二、退伍（役）、結訓後 ，自行於任職單位或區公所辦理全民健保「轉入」手續(轉入日期為退伍（役）、結訓當日；退伍（役）、結訓一年內無工作者亦可以眷屬身分轉入配偶或父母任職單位)。 三、徵服補充兵役者，因係短期服役（12天），無須辦理「轉出」手續，保費自行負擔。\n如有任何疑問，請洽兵役局權益編管科，聯絡人：江亞憓，聯絡電話：23654361分機322，臺北市1999網路服務。","u":"臺北市政府兵役局","h":130505,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3287A3B420F3A36B","d":"2020-03-23","sid":"3287A3B4"},{"q":"●兵籍調查：什麼是「役男」？徵兵及齡是幾歲？還有「兵役年齡」究竟要怎麼計算？","a":"1.按兵役法令規定，凡是年齡屆19歲之年1月1日起到36歲之年12月31日止之男子，依法都應接受徵兵處理，稱為「役齡男子」，簡稱「役男」。\n2.徵兵及齡男子，為年齡屆19歲之年1月1日起之男子，其計算方式係以國曆年度減去出生年次，其數目如為19，即已到達法定接受徵兵處理的兵役年齡，也就是徵兵及齡。\n3.如以民國115年為例：民國115年－96年次＝19歲，因此，自115年1月1日起，95年次出生的役男，不論出生月日（註：在同一年度出生者，不論其出生月日，都屬相同兵役年齡。）其兵役年齡都是19歲，96年次出生的役男，其兵役年齡均為19歲，以此類推。\n如有任何疑問，請洽兵調體檢科，聯絡人：賴識先，聯絡電話：23654361分機113，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":129126,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B4AB9550B09780D2","d":"2017-06-23","sid":"B4AB9550"},{"q":"●役男出境：「國內在學或未在學役男，可否短期出國觀光？應如何辦理？須準備之證件？出國可以多長的時間？」","a":"國內在學或未在學役男，只要是未被限制出境，皆可依役男出境處理辦法第4條第1項第7款規定申請短期出境。(不含同條第1至6款奉派出國表演比賽或當交換學生及出境就學等情形）\n(一)受理對象： 年齡屆19歲之年1月1日起至36歲之年12月31日止，具中華民國國籍尚未履行兵役義務之男子。\n(二)受理時間： 請於出境日前1個月內上網提出申請。 (例：王男欲於114年1月1日出國觀光，其應於113年12月1日(含)以後提出申請。)\n(三)申請方式： 一律採線上申請。所填資料經電腦查對檔案資料，無兵役管制者立即回覆核准，並請列印(或拍照存檔)役男出境核准通知單，持憑通關出境。\n(四)出境期限： 經核准出境者，每次出境最長時間不得超過4個月。\n如有任何疑問，請洽兵調體檢科，聯絡人：林孟儒，聯絡電話：23654361分機112，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":110584,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C7F84E611AEB327A","d":"2015-07-13","sid":"C7F84E61"},{"q":"●兵役體檢：身高體重重測 -「參加徵兵檢查後，身高體重發生變化，不符合常備役體位標準時，可否申請複檢？」","a":"（一）依徵兵規則及體位區分標準相關規定，身高、體重2項入營前均以役男徵兵檢查時之實際測量為認定標準，除役男於接獲徵集令後，得依規定申請複檢外，其餘時間均不受理役男申請複檢。\n（二）本市於送達徵集令時，均併附「申請複檢說明通知單」及「身高體重體位區分標準表」供役男參考，若役男自行對照後，身體質量指數（BMI值）或身高達到改判體位標準，請檢具醫事機構開立達改判體位標準之「診斷證明書」向戶籍地區公所提出申請，並按通知單指定日期及地點參加身高體重重新測量（重測），重測結果將送請本府徵兵檢查會重新判定體位。 如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":74891,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C4513B190B8CC41B","d":"2020-03-23","sid":"C4513B19"},{"q":"●替代役申請：「如何申請替代役？」","a":"1.申請一般替代役：\n（1）宗教因素申請服替代役： 因信仰宗教達2年以上，且其心理狀態已不適服常備兵役者，於徵集入營前逕向戶籍地區公所申請。\n（2）家庭因素申請服替代役：\n因家庭因素申請服替代役，指役男之家庭狀況合於下列情形之一者：\n一、役男家屬均屬六十五歲以上、未滿十五歲、患有身心障礙、重大傷病或十五歲以上未滿十八歲經主管教育行政機關立案之學校證明就學中。\n二、役男育有子女或配偶懷孕。\n三、役男家屬患有中度以上身心障礙。\n四、役男父母、配偶或兄弟姊妹服兵役期間，因死亡或身心障礙，有撫卹事實。\n五、役男家庭依社會救助法核列為低收入戶。但僅役男本人或其家屬中僅年滿十八歲之兄弟姊妹核列為低收入戶，不適用之。\n2.申請研發替代役：\n尚未履行兵役義務(含82年次以前及83年次以後出生)役男，經徵兵檢查為常備役體位或82年次以前出生替代役體位，並具備國內或符合教育部採認規定之國外大學校院碩士以上學歷之役齡男子，每年依內政部年度研發替代役役男報名暨用人單位甄選作業實施計畫，於報名期間至內政部役政署「研發及產業訓儲替代役資訊管理系統」進行帳號申請、登錄報名資料、上傳證明文件電子檔並線上送出後，完成報名作業。\n如有任何疑問，請洽徵集勤務科，聯絡人：李麗珍，聯絡電話：23654361分機220，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":70247,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0CB5B54E4D0F4B0F","d":"2020-03-25","sid":"0CB5B54E"},{"q":"●兵役體檢：申請複檢 -「徵兵檢查時未發現的病情或檢查後體位發生變化？應如何處理？」","a":"按身體健康情形本身最為明瞭，本市役男如患有傷病，而於徵兵檢查時未主動提出，致檢查醫師無法以目視、聽診或觸診等方式予以當場診斷或發覺者；或完成檢查後因受傷等故，致體位發生變化，不合常備役或替代役服役標準時，可依徵兵規則第14條規定，檢具醫療機構出具達改判體位標準之診斷證明書，向戶籍地區公所申請複檢，由公所轉報本府審核；不准予複檢者，則將另行敘明理由並通知役男：\n（一）公費複檢：填具申請書，經審核准予複檢者，即洽送指定之複檢醫院複檢；並由臺北市政府徵兵檢查會（以下簡稱本府徵兵檢查會）依複檢結果判定體位。\n（二）自費複檢：填具申請書，經審核准予複檢者，由役男至選定之複檢醫院複檢；並由複檢醫院將兵役用診斷證明書逕送本府徵兵檢查會，依複檢結果判定體位。役男經准予自費複檢後逾1個月仍未進入複檢程序者，依體位區分標準第6條規定維持原判定體位。\n如有任何疑問，請洽兵調體檢科，聯絡人：陳俐敏、洪于茹，聯絡電話：23654361分機125、126，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":67779,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9CD5D8EDF74782ED","d":"2020-03-23","sid":"9CD5D8ED"},{"q":"●兵役體檢：體位判定 -「徵兵檢查時，對役男體位判定有幾種？」","a":"徵兵檢查之目的，在檢定役男身體健康狀況，判定體位等級，以確定其兵役義務。現行體位區分標準第2條規定，役齡男子經徵兵檢查後，其體位區分如下： （一）常備役體位。 （二）替代役體位。 （三）免役體位。\n因手術或受傷等原因，尚須接受治療，判定「體位未定」者，依體位區分標準第5條規定，應於屆滿6個月或1年後再複檢1次，始予判定體位；核判免役體位者，免服兵役。\n如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":60903,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6EE8BB1177E299D5","d":"2020-03-23","sid":"6EE8BB11"},{"q":"●兵役體檢：「役男體檢項目為何？」","a":"如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":59806,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3D59E9D9C2F114AD","d":"2020-03-23","sid":"3D59E9D9"},{"q":"●兵員徵集：「補充兵的訓期多久？什麼情況下可以折抵補充兵役軍事訓練？」","a":"1.依現行規定，補充兵役須接受為期12天之軍事訓練，但曾受軍訓課程、大專集訓及常備兵在營日期，均不得折抵補充兵役訓期。\n2.按兵役法施行法第17條之規定，應徵服補充兵役，而有下列情形之一者，由國防部發給證明書： （1）在入營前曾受軍事訓練，或已修得相當於補充兵應有之軍職專長，經國防部所屬權責單位檢定合格。 （2）兵役法第20條之1第2項規定之已訓補充兵。\n3.另依補充兵役役男軍事訓練及檢定作業要點第3點：下列人員得檢具證明文件向戶籍地鄉（鎮、市、區）區公所申請，由戶籍地直轄市、縣（市）政府列冊並檢附證明文件，函送戶籍地直轄市、縣（市）後備指揮部（服務中心）辦理檢定，合格者層報地區後備指揮部發給補充兵證明書，免予徵集入營施以軍事訓練： （1）曾受各軍事學校新生入伍訓練結訓，持有退學或開除學籍通知書者。 （2）曾受預備軍官、預備士官基礎教育，不分軍種兵科，訓練時間滿該訓練梯次8週（56天）以上，持有退訓證明書者。 （3）曾受常備兵新兵入伍訓練結訓，持有停役令者。 （4）曾受第一階段常備兵役軍事訓練結訓，持入伍訓練結訓證書者。 （5）替代役役男軍事基礎訓練結訓，持施訓單位結訓證明文件者。\n如有任何疑問，請電洽徵集勤務科：23654361分機213，聯絡人：周淑慧，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":56259,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F6EA85F97DFBCAAB","d":"2013-05-28","sid":"F6EA85F9"},{"q":"●兵役體檢：「什麼時候會接到徵兵檢查通知?在哪家醫院檢查？」","a":"如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":55539,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7A3D5B740E5E4FB7","d":"2020-03-23","sid":"7A3D5B74"},{"q":"●役男抽籤：「役男如何參加軍種抽籤？而抽籤後何時可入營服役？」","a":"一、按抽籤通知書指定之日期、時間與地點，攜帶該通知書、國民身分證及私章等前往抽籤。未能到場者，得委託有行為能力之家屬代抽。役男未到場，亦未委託家屬代抽者，由主持人依規定代抽（法定代抽）。\n二、抽籤後未在學者，按（1）出生年次（2）抽籤時間（3）抽中之軍種、籤號順序入營 。大概入營時間可向戶籍地區公所查詢。\n如有任何疑問，請電洽徵集勤務科：23654361分機213，聯絡人：周淑慧，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":47639,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=54C19454FF153111","d":"2013-05-28","sid":"54C19454"},{"q":"●僑民服役：「具有雙重國籍是否還要服役？」","a":"依我國憲法第20條及兵役法第1、3及32條規定，凡具有中華民國國籍並曾在臺設有戶籍之役齡男子皆有服兵役之義務。但並非具有雙重國籍即當然為「僑民」，如不具僑民身分，即屬一般役男。僑民役男仍有履行兵役之義務，惟考量僑民長期旅居國外，政府為免僑民役男一旦返國處理事務須立即接受徵兵處理，乃給予返國定居者有一段適應期(屆期183日才徵兵處理)。\n如有任何疑問，請洽兵調體檢科，聯絡人：劉育宜，聯絡電話：23654361分機111，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":47444,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C6D15A025E512B93","d":"2013-05-28","sid":"C6D15A02"},{"q":"●兵役體檢：「役男因故無法按排定日程參加徵兵檢查怎麼辦？」","a":"役男如因考試等故無法按排定日程參加徵兵檢查者，得洽戶籍地鄉（鎮、市、區）公所役政單位聯繫，另行安排其他檢查日期。 如有任何疑問，請洽兵調體檢科，聯絡人：李坤育，聯絡電話：23654361分機123，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":46864,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=35AE3D9B75983830","d":"2020-03-23","sid":"35AE3D9B"},{"q":"●兵員徵集：「應屆畢業役男如何申請優先入營或延緩入營？」","a":"一、常備兵入營順序係依據「徵兵規則」第 5 條規定，以出生年次之 先後，與其役別、軍種主要兵科及抽籤號次徵集之，並由戶役政資訊系統依前揭規定自動選員辦理。\n二、每年為配合國軍新兵訓練容量，並利役男生涯規劃，內政部役政司規劃辦理「應屆畢業役男入營時程申請措施」，請應屆畢業須服常備兵役軍事訓練役男按個人生涯規劃，於申請期限內登入內政部役政司全球資訊網站首頁 (https://dca.moi.gov.tw/default.aspx) ／ 主題單元／「役男入營時程申請系統」提出申請。\n三、網路申請日期如下:\n(一)第一時段:優先入營\n網路申請期間:每年的5月中旬至6月中旬（以內政部役政司「役男入營時程申請系統」實際開放申請期間為準）。\n(二)第二時段:未申請優先或延緩入營\n無須申請，待申請「優先入營」役男徵集完畢後，即接續徵集。\n(三)第三時段 :延緩入營\n1.網路申請期間:每年7月初至11月底（以內政部役政司「役男入營時程申請系統」實際開放申請期間為準）。\n2.第一時段「優先入營」及第二時段「未申請優先或延緩入營」役男徵集完畢後，即接續徵集。\n四、實際入營月份會因各時段申請人數多寡及軍種兵科訓練流路不同 而定。戶籍地鄉（鎮、市、區）公所將依「優先入營」、「未申請優先或延緩入營」及「延緩入營」時段依序徵集，且每一時段仍將按役男出生年次（83、84…………93）、抽籤日期及軍種兵科籤號先後順序分批安排役男於1年內入營服役。\n以上如有任何疑問，請電洽徵集勤務科:2365-4361 分機 212，聯絡人: 李明勳，臺北市民當家熱線:1999。","u":"臺北市政府兵役局","h":36992,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4D45C93AAEC82EF6","d":"2026-03-06","sid":"4D45C93A"},{"q":"●歸鄉報到：「依法退伍、停役離營軍人是否要辦理歸鄉報到？」","a":"自108年1月1日起，結訓、停訓離營之後備軍人(含補充兵)，不需再赴區公所辦理報到，以國防部與內政部間之資訊系統傳輸方式完成離營通報作業。\n如有任何疑問，請洽兵役局權益編管科，聯絡人：許玉鈴，聯絡電話：23654361分機312，或撥臺北市民當家熱線：1999轉接。\n如需\"求職服務\"或\"就業情報\"，請直接洽詢臺北市就業服務處，服務專線：25972222。","u":"臺北市政府兵役局","h":36218,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5E14DB5A9122C3FA","d":"2020-03-20","sid":"5E14DB5A"},{"q":"●兵籍調查：什麼是兵籍調查？開始申辦時間？如何辦理？","a":"1.兵籍調查是辦理役男徵兵處理的首要程序，主要目的是在建立役男個人及家屬基本資料、目前就學或升學意願、健康情形、民間專長以及聯絡方式等等，以作為將來辦理後續徵兵檢查、抽籤及徵集入營的依據。\n2.當年次役男(民國115年為96年次19歲役男，以此類推)統一辦理兵籍調查的時間是在役男屆18歲之年的10月(由戶籍地區公所寄發兵籍調查通知書)至19歲之年3月。辦理方式除可利用線上(系統開放時間約1個月，請多加利用)申報方式辦理外，亦可採用臨櫃、傳真、電子郵件、郵寄等方式。\n如有任何疑問，請洽兵調體檢科，聯絡人：賴識先，聯絡電話：23654361分機113，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":32968,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0D1467FA3ADFDDA4","d":"2020-03-19","sid":"0D1467FA"},{"q":"●兵役體檢：書面審查判等條件 -「已領有身心障礙或重大傷病證明役男可否不參加徵兵檢查，直接以書面資料核判體位？」","a":"（一）依照現行規定，領有身心障礙或重大傷病證明符合「身心障礙或重大傷病與體位區分標準免役體位判等對照表」規定之役男，可由戶籍地鄉（鎮、市、區）公所檢附原鑑定資料，經直轄市、縣（市）政府徵兵檢查會「書面審查」後，送請中央役男體位審查會審議判定體位，亦即上述役男得免再赴檢查醫院體檢，以資便民並簡化作業。\n（二）至於未符前述對照表規定，而因身心障礙行動不便，無法到檢查醫院受檢之役男，也可以提出申請，由戶籍地直轄市、縣（市）政府徵兵檢查會會同體格檢查組及醫事人員赴其住（或醫療、院）所實施檢查，並依規定判定體位。\n如有任何疑問，請洽兵調體檢科，聯絡人：林宛珊，聯絡電話：23654361分機122，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":22447,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4A2633608F8E0CFE","d":"2020-03-23","sid":"4A263360"},{"q":"●國外就學：「開立在學證明應注意事項」","a":"一、在學證明內容應包括： (一)學生姓名英文拼音應與護照上姓名拼音相同。 (二)學生出生年月日。 (三)修習高中以上正式學歷課程內容。 二、我國男子役齡前出境不需申請核准年滿18歲當年12月31日以前出國，因未屆役齡，不需申請許可（以民國108年為例，90年以後出生者，108年12月31日前出國不受限制）。 三、在學證明應注意事項： （一）在學證明均需檢附入國之日起算前3個月內，經駐外館處驗證修習高中以上學歷學校(含語文學校)之在學證明正本，送由移民署各縣市服務站收繳(驗畢後退還正本，收繳影本)。 （二）經駐外館處驗證之在學證明正本，如非為入國之日起算三個月內開具、需再檢附同一學校之下列文件之一(均不必再驗證): (１)上學期成績單或修課之學分證明。 (２)尚未逾繳費截止日期之繳費通知單。（指即將開學的那一學期）。 (３)逾繳費截止日期之當（下）學期（年）繳費通知單及匯款單。. (４)入國之日起算前三個月內由學校開立之在學證明。 四、在國外學歷承接階段期間（如：在國外高中畢業已取得下一學程之入學許可），仍須符合就學最高年齡，大學以下學歷者至二十四歲，研究所碩士班至二十七歲，博士班至三十歲。但大學學制超過四年者，每增加一年，得延長就學最高年齡一歲，畢業後接續就讀碩士班、博士班者，均得順延就學最高年齡，其順延博士班就讀最高年齡，以三十三歲為限。 五、移民署出境就學諮詢專線 有關役齡男子出境國外(或大陸地區）就學規定疑義，內政部移民署設有諮詢專線，電話為886-2-23883929；傳真號碼為886-2-23899036。出境就學役男，可先將在學證明等相關資料，利用時間先行傳真移民署，俟國內上班時間再以電話專線聯繫。倘告知符合規定後，再將文件送轄區我駐外館處驗證，以節省信件往返時間及減少返國後無法再出國的困擾。\n如有任何疑問，請洽兵調體檢科，聯絡人：林孟儒，聯絡電話：23654361分機112，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":21542,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6BE5FF3BBDE76600","d":"2015-07-13","sid":"6BE5FF3B"},{"q":"●役男出境：「役男有那些原因，不能申請出境？」","a":"(一)依役男出境處理辦法第9條規定，役男有下列情形之一者，限制其出境：\n1.已列入梯次徵集對象者。\n2.經通知徵兵體檢處理者。（經完成徵兵體檢處理者，解除其限制）\n3.歸國僑民，依歸化我國國籍者及歸國僑民服役辦法規定，依法應履行兵役義務者。\n4.依兵役法及其他法規應管制出境者。\n(二)依役男出境處理辦法第14條規定：在臺原有戶籍兼有雙重國籍之役男，應持中華民國護照入境；其持外國護照入境，依法仍應徵兵處理者，應限制出境至履行兵役義務時止。\n如有任何疑問，請洽兵調體檢科，聯絡人：林孟儒，聯絡電話：23654361分機112，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":19951,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C917DE4A858E863C","d":"2020-03-20","sid":"C917DE4A"},{"q":"●僑民服役：「持外國護照入境之僑民役男，是否不受中華民國相關之兵役法令約束？」","a":"依現行「歸化我國國籍者及歸國僑民服役辦法」第7條第1項規定：持外國護照入境之歸國僑民，具有役齡男子身分者，適用本辦法有關歸國僑民之規定。另依「役男出境處理辦法」第14條規定：在臺原有戶籍兼有雙重國籍之役男，應持中華民國護照入出境；其持外國護照入境，依法仍應徵兵處理者，應限制其出境至履行兵役義務時止（須依法補行徵兵處理，並履行完成兵役義務後，始得解除其限制)\n如有任何疑問，請洽兵調體檢科，聯絡人：劉育宜，聯絡電話：23654361分機111，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":19220,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BB1A348B12F5E214","d":"2015-06-08","sid":"BB1A348B"},{"q":"●僑民服役：「如何取得僑民身分及應如何認定？」","a":"一、 有關我國之僑民身分，應經申請取得，並非具有雙重國籍即當然為「僑民」，如不具僑民身分，即屬一般役男身分。僑民身分之申請取得，可向僑務委員會申請「役政用華僑身分證明書」證明。凡持有「役政用華僑身分證明書」之役齡男子，即為僑民役男。\n二、 役男如於修法前持有「僑居身分加簽之中華民國護照」，入境後須向僑務委員會重新申請「役政用華僑身分證明書」(駐外館處不受理是項業務)。\n如有任何疑問，請洽兵調體檢科，聯絡人：劉育宜，聯絡電話：23654361分機111，臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":19074,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=19757922D1CBAB29","d":"2013-05-28","sid":"19757922"},{"q":"●軍人保險：「義務役役男服役期間有無意外保險？內容如何？」","a":"一、兵役局為照顧役男入營輸送當天之安全保障，向保險公司投保「臺北市徵集役男入營輸送期間團體保險」，每人保險金額為新臺幣200萬元。 二、義務役常備官、士、兵意外事故發生，依軍人保險條例，由國防部主管，分死亡、殘廢二種給付；給付金額係按作戰、因公、病故或意外等原因及年資、階級予以核算保險基數而定。 三、另一種是國防部投保「國軍官兵團體意外保險」，分為執行公務死亡者最高理賠金額新臺幣350萬元，非執行公務死亡者理賠金額新臺幣200萬元。 四、替代役役男則依替代役實施條例，享有「替代役役男一般保險」及「替代役役男團體意外保險」，其主管單位為內政部，其保險內容及給付與「軍人保險」及「國軍官兵團體意外保險」相同。 如有任何疑問，請洽兵役局權益編管科，聯絡人：羅巧瑞，聯絡電話：23654361分機321，臺北市民當家熱線：1999、國防部後備司令部留守業務處保險組02-27867350、內政部役政署權益組保險科0800-491022。","u":"臺北市政府兵役局","h":17666,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8A36D524A2E155A4","d":"2013-05-28","sid":"8A36D524"},{"q":"●替代役管理：「替代役役男之身分定位為何？」","a":"一、替代役役男於訓練及服役期間，不具有軍人身分。\n二、服替代役役男於完成訓練後，依其所服替代役類別之法令規定，執行勤務時，其身分符合刑法第10條所稱公務員之規定。\n三、替代役役男之違法犯紀，依替代役實施條例之罰則及其他法律如刑法、民法及行政程序法處理。 如有任何疑問，請電洽替代役中心：23649747，承辦人:余文。或臺北市民當家熱線：1999。","u":"臺北市政府兵役局","h":17217,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=80324DC435DBF987","d":"2013-05-28","sid":"80324DC4"}]},{"org":"圖書館","total":95,"items":[{"q":"書到期前，可以續借嗎?","a":"圖書資料於到期前，您可自行透過本館「館藏查詢系統」登入「個人書房」，點選「我的借閱/借閱紀錄」於要續借的圖書資料，點擊【續借】，或勾選要續借的圖書資料，點擊【批次續借】，即可完成續借。相關原則說明如下：","u":"臺北市立圖書館","h":139061,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=46BF67F71926B9CB","d":"2012-01-13","sid":"46BF67F7"},{"q":"圖書資料借閱逾期時，會如何處罰?","a":"若借閱人逾期，該閱覽證依每冊（件）逾期天數累計停借（權），惟每張個人借閱證停借上限為九十日，家庭圖書證停借上限為一百二十日；另借閱人可依累計之逾期天數折算違約金，逾期一天折算一元，借閱證可憑閱讀存摺點數十點折算逾期日數一日。讀者可選擇停借或違約金折換逾期天數。如有相關問題，歡迎您來電洽詢27552823轉2104。","u":"臺北市立圖書館","h":94170,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=86AD20839933F0C8","d":"2012-01-13","sid":"86AD2083"},{"q":"圖書館借閱證有分哪幾類？","a":"市圖借閱證可分為個人借閱證及家庭圖書證，分為以下幾種類型：\n1. 個人借閱證：\n中華民國國民持國民身分證、駕駛執照、身心障礙證明（或手冊）、戶口名簿或3個月內有效之戶籍謄本，擇一證件正本；到館親自辦理者如未滿12歲可持戶口名簿影本或3個月內有效之戶籍謄本辦理。大陸人士及外籍人士持入出境許可證、護照或居留證正本。自108年7月1日起配合市府政策，本館不再發放實體個人借閱證，讀者可自備悠遊卡或一卡通辦理，或使用台北通APP及「iRead臺北市立圖書館」APP之行動借閱證等，適用本館總館、分館及民眾閱覽室及智慧圖書館。\n2. 家庭圖書證：\n臺北市市民持戶口名簿或三個月內有效之全戶戶籍謄本，擇一證件正本申請，分為一般條碼借閱證及RFID晶片借閱證2種型式。\n3. 行動借閱證：\n當讀者未攜帶個人借閱證或家庭借閱證時，可自行利用手機下載「iREAD臺北市立圖書館」或「台北通APP」（台北通APP限個人借閱證），點選行動借閱證。適用本館總館、分館及民眾閱覽室及智慧圖書館。（智慧圖書館門禁需使用悠遊卡或一卡通感應方能進入）。","u":"臺北市立圖書館","h":64774,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4902CF581634C02D","d":"2012-01-13","sid":"4902CF58"},{"q":"預約後，發現有段期間可能會出國無法領取預約書該怎麼辦？","a":"讀者如有特定期間無法領取預約書(例如：出國期間)，本館可針對讀者已預約而尚未到館的圖書資料，做「暫停預約」處理，即此段時間有預約書可分配時，系統會先分配給下一個預約順位讀者，在暫停日期過後，則恢復正常的預約分配。如需設定，請於該期間前以電話方式聯繫取書館辦理。","u":"臺北市立圖書館","h":49603,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=65D1D7A1CB2D4AD1","d":"2018-08-31","sid":"65D1D7A1"},{"q":"圖書一定要在原借書館歸還嗎？","a":"不一定。本館任一閱覽單位皆可受理歸還，請您就近歸還，但全自動借書站不提供視聽資料及圖書附件之歸還。","u":"臺北市立圖書館","h":48652,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DC115A94B9DE2CAB","d":"2012-01-13","sid":"DC115A94"},{"q":"借閱證證號和密碼為何?","a":"個人借閱證證號為身分證字號，家庭借閱證證號為FA+家庭戶號；密碼共4碼，預設值為個人出生日期的月日(如3月9日為0309)。","u":"臺北市立圖書館","h":42694,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E445B0584BB8AE4D","d":"2012-01-13","sid":"E445B058"},{"q":"請問借閱證的借閱冊數及借期？","a":"一、 外借圖書資料，每張個人借閱證以25冊為限，每張家庭圖書證以40冊為限，每冊借期30日，得續借3次。另可再借閱7冊熱門館藏，每冊借期14日，不得續借。 二、外借視聽資料，每張個人借閱證或家庭借閱證均以7件為限，每件借期14日，得續借3次。","u":"臺北市立圖書館","h":39332,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=930491EFE66FAA04","d":"2012-01-13","sid":"930491EF"},{"q":"圖書館的開放時間為何?","a":"1. 本館各閱覽單位(總館、分館暨民眾閱覽室)開放時間如下：週二至週六為8時30分至21時；週日、週一為9時至17時。 2. 智慧圖書館、FastBook全自動借書站及借還書工作站開放時間依設置地點而定。 3. 啟明分館、柳鄉兒童圖書館及親子美育數位圖書館開放時間：週一至週日9時至17時。 4. 申請借閱證 、 規費繳納及臨櫃借、還書在閉館前30分鐘停止受理。 5. 經政府公告之放假日為休館日；每月第1個星期四為圖書整理清潔日，不對外開放","u":"臺北市立圖書館","h":35494,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BABB6E89C1E9CD3F","d":"2012-01-13","sid":"BABB6E89"},{"q":"如何進行線上辦證","a":"1.申請資格： 凡中華民國國民、大陸人士、外籍人士皆可利用本館館藏查詢系統申請辦理個人借閱證，另臺北市市民可線上申辦家庭借閱證，網路線上申辦僅限新辦借閱證，不包含換發及補發。 2. 申請方式： (1)點選本館館藏查詢系統右上方「網路辦證」之連結。 (2)閱讀辦證個人資料維護聲明->同意後，勾選確認 (3)選擇辦證類型(個人證或家庭證)，閱讀上方注意事項，並輸入辦證之必填欄位資訊及驗證碼，確認資料後即可點選送出。 (4)線上申辦成功後，讀者可於本館服務時間內持有效證件，至所屬任一有館員服務的閱覽單位服務臺領取借閱證，所需證件如下： A. 辦理個人借閱證： a. 中華民國國民：國民身分證、駕駛執照、身心障礙證明(或手冊)、戶口名簿或三個月內有效之戶籍謄本，擇一證件正本；未滿十二歲者可持戶口名簿影本或三個月內有效之戶籍謄本辦理。 b. 大陸人士：入出境許可證或居留證正本。 c. 外籍人士：護照或居留證正本。 d. 辦理悠遊卡借閱證者需自備悠遊卡。受理之悠遊卡種類有：普通卡、優待卡、學生卡、敬老卡、愛心卡、愛心陪伴卡、數位學生證及悠遊信用卡。 e. 請勿重複辦證，個人借閱證每人限辦1張，限本人使用。 B. 辦理家庭圖書證： a. 設籍臺北市之戶口名簿正本或三個月內有效之全戶戶籍謄本。 b. 家庭圖書證每戶限辦1張，限同一戶之市民方可使用。 c. 悠遊卡借閱證不受理家庭證之申請 3.注意事項： (1)線上申辦借閱證僅限新辦，申請前請先確認是否已辦過本館借閱證；如須補發或換發，則須至本館任一閱覽單位臨櫃辦理。 (2)讀者於線上辦證後，即可使用本館部分電子資源，若需外借圖書或進行線上預約，則必須持證件到館領取實體借閱證後才可使用相關服務。 (3)「線上辦證待審核」借閱證使用期限為6年，逾有效期限者，無法登入、使用本館各項電子資源。 (4)持個人借閱證之本國籍民眾可使用線上展延功能辦理（非本國籍讀者、家庭圖書證須臨櫃辦理），展延次數無上限，每次延長期限為6年，惟每次展延均須進行電子郵件驗證，相關說明請參考[ 連結 ]","u":"臺北市立圖書館","h":25502,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3042D939FA6A98F3","d":"2013-12-03","sid":"3042D939"},{"q":"何謂家庭圖書證？如何申請？","a":"家庭圖書證限設籍臺北市之家戶（申請人必須為該家戶），攜帶戶口名簿正本或三個月內有效之全戶戶籍謄本，親至北市圖任一閱覽單位辦理。每戶限辦1張，不限戶長本人使用，只要同戶之讀者皆可使用。 ＊讀者資料若有變更，請向本館辦理更正手續。 ＊申辦家庭圖書證者，除戶口名簿之戶號，其餘基本資料均請依戶長資料填寫。","u":"臺北市立圖書館","h":24763,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=675D90DBA3710EAB","d":"2012-01-13","sid":"675D90DB"},{"q":"如何辦理圖書預約?","a":"圖書在架上或外借中皆可辦理預約。讀者可自行透過本館「館藏查詢系統」搜尋您要預約的圖書，點選其中1本後，點擊【預約】按鈕，再登入證號及密碼，選擇取書館別，即可完成申請。每張借閱證之預約冊數，以7冊（件）為限(含圖書資料及視聽資料）。圖書運送至取書館後，系統會以您所選擇通知方式（email、手機簡訊、電話、無需通知）告知取書事宜。","u":"臺北市立圖書館","h":23697,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8C060DD144025289","d":"2012-01-13","sid":"8C060DD1"},{"q":"預約未取相關罰則?","a":"預約請於本館通知之 最後取書期限前 到館取書，若逾期未取，且半年內累計達3冊（件）者，自最後取書日之次日起，停止預約權利90日。停權期間未取書再達3冊（件）者，以最後停權日之次日起，再加計停止預約權利90日。","u":"臺北市立圖書館","h":23645,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9D6D9806497655D7","d":"2012-01-13","sid":"9D6D9806"},{"q":"圖書資料遺失或毀損，該如何賠償?","a":"資料若遺失或毀損的話，請自購相同或較新版本之圖書或視聽資料；期刊、報紙以相同名稱、刊期及日期者為限，並向本館辦理賠償。如無法購得，依該資料定價賠償。","u":"臺北市立圖書館","h":21437,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5C13DE8CB1694B9C","d":"2012-01-13","sid":"5C13DE8C"},{"q":"什麼是圖書到期LINE通知？通知項目包含哪些？我要如何接收通知？","a":"考量現代人使用手機網路通訊軟體較一般電話、簡訊或EMAIL頻繁，本館結合市府官方LINE帳號推出個人化通知服務，提供 「借閱資料即將到期」、「逾期催還」及「預約書到館通知」 3項通知服務。\n讀者若要透過LINE接收以上3項通知，需要先加入市府官方LINE帳號，並訂閱「圖書到期通知」此一項目，輸入本館借閱證帳號、密碼，方能接收通知。\n※此項服務是透過市府官方LINE帳號發送通知（市府平常也會發送一些官方訊息，並非僅提供本館通知使用），故若要順利接收通知，請保持此帳號狀態為「開啟提醒」，且不要封鎖，才能正常接收通知。若自行將此帳號設定為封鎖或「關閉提醒」，可能無法順利接收或遺漏通知。\n（二）進入「聊天」，於對話框內點選下方「選單」，選擇「更多市民資訊」後進入下層選單再點選「訂閱市政」，將自動跳轉至市政訊息訂閱項目頁面，找到「圖書到期通知」服務後點選進入。\n（三） 自動轉入登入頁面，請輸入本館借閱證帳號密碼，並於下方「預約書到館通知服務」之下拉式選單選擇「取消預約書email、簡訊或電話通知」或「保留預約書email、簡訊或電話通知」，點選「訂閱」。若選擇「取消預約書email、簡訊或電話通知」，則讀者原於本館網站設定之預約書到館通知將不再發送，改由市府LINE訊息作為唯一通知管道。\n（四） 確認訂閱內容是否正確，無誤則點選「確認」。\n（五） 回到市政訊息訂閱項目頁面，若「圖書到期通知」圖示上顯示「已訂閱」，則訂閱成功，若無則重新操作一次。","u":"臺北市立圖書館","h":20999,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E1402EBB7240B1C8","d":"2020-10-19","sid":"E1402EBB"},{"q":"請問圖書館是否有提供無線上網服務？","a":"本館目前提供無線上網服務如下：\n配合市府政策，本館目前提供Taipei-Free無線上網服務，相關操作及無線上網熱點資訊可至官網（ https://wifi.taipei/ ）查詢。","u":"臺北市立圖書館","h":20675,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5A458722619E52DE","d":"2012-01-13","sid":"5A458722"},{"q":"圖書館是否有舉辦換書活動？","a":"1.臺北市立圖書館「好書交享閱」活動，為一長期性活動，總館及四區分館(三民、文山、萬華、天母)於開放時間受理市民收書，並於每月最後一週週日上午10時至下午4時在總館地下2樓進行圖書交換活動（上午9時即開放收書，10時始依號碼牌上標示起訖時間入出場進行換書）。\n2.有關活動內容收書及換書規則，請參閱市圖首頁/推薦服務/讀者服務/推廣活動/好書交享閱，若您還有其他問題，歡迎您利用電話洽詢（02-27091605）或親至櫃檯詢問，以便本館立即為您說明。","u":"臺北市立圖書館","h":19841,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8CEC14951979055C","d":"2012-01-13","sid":"8CEC1495"},{"q":"預約取書期限是多久？","a":"您可於本館「館藏查詢系統」輸入證號、密碼及驗證碼，登入「個人書房」，點選「我的預約」，即可查詢預約書的排序順位或調出時間，當預約書運送到取書館後保留5天（FASTBOOK全自動借書站及士林、稻香自助取書櫃僅3天）取書時間，且國定假日與休館日不列入計算。","u":"臺北市立圖書館","h":19652,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E6E12596C41D59EC","d":"2018-08-31","sid":"E6E12596"},{"q":"兒童室的開放時間為何?","a":"1. 本館各閱覽單位(總館除外)設置之兒童室，開放時間如下：週二至週六為8時30分至21時；週日、週一為9時至17時。\n2. 總館設置之兒童室，開放時間如下：週二至週六為9時至18時；週日、週一為9時至17時。\n3. 申請借閱證、規費繳納及臨櫃借、還書在閉館前30分鐘停止受理。\n4. 經政府公告之放假日為休館日；每月第1個星期四為圖書整理清潔日，不對外開放。","u":"臺北市立圖書館","h":19494,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CD973C724F01A363","d":"2012-01-13","sid":"CD973C72"},{"q":"借閱證遺失時應如何辦理?","a":"請立即向本館辦理掛失登記，並可至各閱覽單位申請補發借閱證，申請時應持身分證明文件正本及重新填寫相關辦證表單臨櫃辦理。個人借閱證需自備悠遊卡或一卡通補發，或改用手機行動借閱證。家庭圖書證補發需繳付工本費50元整，如改用行動借閱證則免收工本費。","u":"臺北市立圖書館","h":18594,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BEC034F15CD73F51","d":"2012-01-13","sid":"BEC034F1"},{"q":"借閱證使用期限到期，該如何處理？","a":"一、當個人借閱證或家庭圖書證使用期限到期時，可持以下證件及原借閱證臨櫃辦理更新使用期限：\n另為便利讀者24小時即時於網站自行延長借閱證期限，凡持有個人借閱證之本國籍民眾，可透過本館「館藏查詢系統」輸入證號及密碼，登入「個人書房」點選「修改個人資料」，選擇「延長有效期限」辦理，惟為確保資料正確性，如有姓名更換、戶籍地址異動、遺失或補發個人借閱證、借閱證有效期限超過10年等任一情形時，則仍需親至各閱覽單位辦理。線上延長限使用1次，延長期限為6年，使用後須臨櫃展延借閱證期限，始得再次使用「線上延長借閱證期限」功能，（意即「線上展延」→「臨櫃展延」→「線上展延」→「臨櫃展延」可循環使用）。\n二、「線上辦證待審核」借閱證有效期限過期：","u":"臺北市立圖書館","h":18127,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6F50A5BF0DABCEE0","d":"2018-08-31","sid":"6F50A5BF"},{"q":"什麼是台北通（前身台北卡）？要如何申請？","a":"台北通為臺北市政府整合市府各機關各式卡證，以達到一卡可取用多項市府服務之便民措施，並享有集兌點活動與場館優惠等各項優惠。至今已整合數位學生證、敬老服務、圖書借閱證等8項卡證服務。\n凡持有借閱證之讀者欲加入台北通，可由本館館藏查詢系統中登入個人書房，自行點選「與台北通結合」方能申請，或持相關身分證明文件臨櫃由館員協助辦理。\n台北通詳細說明可參閱官方網站 https://id.taipei/tpcd/login ，或可撥打1999轉8585逕洽臺北市政府資訊局。","u":"臺北市立圖書館","h":18100,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=41535D1853BF99A1","d":"2020-02-10","sid":"41535D18"},{"q":"辦理借閱證需要帶什麼證件?","a":"1. 辦理「個人借閱證」請攜帶身分證、駕駛執照、身心障礙證明（或手冊）、戶口名簿正本或三個月內有效之戶籍謄本；大陸人士請攜帶入出境許可證或居留證正本；外籍人士請攜帶護照或居留證正本。\n2. 辦理「家庭圖書證」(限設籍臺北市市民)請攜帶戶口名簿正本辦理或三個月內有效之全戶戶籍謄本。","u":"臺北市立圖書館","h":17914,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7ED950E930594A18","d":"2012-01-13","sid":"7ED950E9"},{"q":"我還沒有臺北、新北或基隆市圖書館的借閱證，是否可以申辦一證通用嗎？","a":"可以，尚未辦理本館借閱證讀者，可利用本館網站「網路辦證」申辦借閱證並勾選「結合新北市立借閱證」或「結合基隆市公共圖書館」。線上申辦後，請先攜帶身分證明文件及悠遊卡(或一卡通)至本館完成借閱證錄製作業，再攜帶身分證明文件以及本館借閱證（悠遊卡或一卡通）至欲結合的圖書館其所屬據點啟用一證通用服務。","u":"臺北市立圖書館","h":17346,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FF1646DA2E9EA096","d":"2018-08-31","sid":"FF1646DA"},{"q":"如何查詢圖書資料的預約狀態？","a":"請您進入本館館藏查詢系統，在右上角點選「登入」，輸入「借閱證號」、「密碼」及「驗證碼」登入後，再點選右上角您的姓名，再點選「我的借閱」或「我的預約」，即可查看您的借閱及預約資訊，其中「目前情況欄」會顯示該筆預約排隊的位置，當該筆預約顯示「調出日期：OOOO/OO/OO（年/月/日）」時，表示該筆預約圖書資料即將運送到您指定的取書館；當該筆預約到館後，則會顯示「取書期限：OOOO/OO/OO（年/月/日）」，則請您於取書期限內到館取書。","u":"臺北市立圖書館","h":16140,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8898B71EFE2D2F20","d":"2012-01-13","sid":"8898B71E"},{"q":"如果想借其他分館的書，一定要到那個分館借嗎？","a":"不一定。本館提供有預約服務，請自行透過本館「館藏查詢系統」搜尋您要預約的圖書，點選其中1本後，點擊【預約】按鈕，再輸入證號及密碼，選擇取書館別，即可完成申請。每張借閱證之預約冊數，以7冊（件）為限(含圖書資料及視聽資料）。圖書運送至取書館後，系統會以您所選擇通知方式（email、手機簡訊、電話、無需通知）告知取書事宜。","u":"臺北市立圖書館","h":15722,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=36B42FA098E11342","d":"2012-01-13","sid":"36B42FA0"}]},{"org":"體育局","total":94,"items":[{"q":"健身房常見消費爭議","a":"Q1：若消費者在110年12月31日前簽訂的合約，應適用新規範還是舊規範呢？\nA1：適用於舊規範，本次修訂之「健身中心定型化契約應記載及不得記載事項」自111年1月1日起施行適用，若是消費者於110年12月31日前與業者所簽訂之合約，則適用於舊規範。\nQ2：健身中心契約期間為10年，但有約定使用期間為2年，業者告知消費者2年後就可以無條件解約。但2年後消費者誤以為契約已經結束，但仍被業者繼續扣款，消費者該怎麼辦？\nA2：\n1. 消費者如果與業者之契約內有「約定使用期間」，於該契約約定使用期間屆滿後終止契約，業者不得收取手續費用、違約金或任何名目費用之期間。\n2. 若約定使用期間屆滿，消費者不終止契約，因整份契約期間為10年，倘業者有做到「約定使用期間」屆滿前1個月的通知，消費者可以無條件終止契約；如果消費者沒有向業者完成終止契約程序，則本契約繼續有效，業者確實可以繼續扣款。\n3.實際上，定型化契約中只有規定契約須載明起、迄時間，因此消費者在簽約前要再三確認是簽幾年約及相關費用，以確保自身權益。\n※提醒：消費者簽約完成後記得向業者拿取契約，並於簽訂契約時確認契約到期日，以免產生爭議。\nQ3：消費者請假，業者可以扣款嗎？\nA3：消費者如果是因為以下之法定事由，業者應該要在7個工作日內，幫消費者辦理暫停會籍，而且暫停期間不得扣款：\n1. 出國逾1個月。\n2. 傷害、疾病或身體不適致不宜運動。\n3. 懷孕、育嬰、侍親之需要。\n4. 服兵役致難以履約。\n5. 職務異動或遷居致難以履約。\n6. 其他事由致難以履約。\nQ4：消費者如果受傷導致不大適合運動，可以跟業者終止契約嗎？會被收取違約金嗎？\nA4：會，消費者因受傷而要求終止契約，一般而言會被收取違約金，但在契約期限內消費者符合以下所有條件，才不會被收取違約金：當消費者因「傷害、疾病或身體不適致不宜運動」向業者暫停會籍，並且因此暫停會籍滿6個月後，經醫師開立診斷證明於之後6個月內不能運動者。\nQ5：育嬰及侍親要如何定義證明？\nA5：\n1. 育嬰定義可以參考性別工作平等法第16條。\n2.侍親定義是本人或配偶之直系血親尊親屬老邁（65","u":"臺北市政府體育局","h":77332,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88C83B96BABC5CB3","d":"2014-04-14","sid":"88C83B96"},{"q":"本市各運動中心營業時間為何？","a":"運動中心開放時間為每日早上6時至晚間10時，過年期間除除夕、大年初一不營業外，初二至初五將彈性調整營業時間，初六以後恢復正常營業，各運動中心過年期間營業訊息可參照運動中心公告資料。\n各運動中心網站：如欲查詢各運動中心相關資訊，可至本局網站場館訊息/場館簡介中點選相關連結至各運動中心網站。","u":"臺北市政府體育局","h":41562,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69D2F20662915969","d":"2010-10-11","sid":"69D2F206"},{"q":"本市各運動中心提供老人哪些優惠？","a":"本市各運動中心提供65歲以上老人(55歲以上原住民)每日早上8時至10時免費使用游泳池、健身房及部分運動設施，其餘時段游泳池及健身房則享有半價優惠。另外自99年11月1日起增加每周一至周五下午2時至4時游泳池及健身房公益時段(寒假、暑假及國定假日暫停下午公益時段優惠)。","u":"臺北市政府體育局","h":29762,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E21A373E3FEF4F63","d":"2011-04-17","sid":"E21A373E"},{"q":"運動中心是否可以進行私人教學?","a":"1.不可以，考量非屬中心之教練，各中心無法確認確認教練資格、教學能力、品質等，除恐損及受教者權益外，若發生受傷意外、運動傷害或是影響其他民眾安全的情事，其責任歸屬將無法釐清，爰運動中心原則不開放私人教學，惟目前運動中心依其場地特性尚開放部分運動項目，並訂定相關場地使用規範及租用管理規則，供民眾申請及進行管理事宜。\n2.有關親人指導教學部分，基於親子陪伴確有助於運動發展，亦有助於增進親子間感情，所以在合宜範圍內仍允許親子教學行為，但因私人教學與親子間教學有時不易認定，因此現場人員巡場時如果發現過於專業的教學行為時，均先以口頭柔性勸導，但能證明確為親子關係則不在此限。為避免誤認為私人教學，建議可先行向運動中心同仁及教練說明情況並請該中心適時給予協助。","u":"臺北市政府體育局","h":24113,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=20D74B268C796285","d":"2011-04-17","sid":"20D74B26"},{"q":"本市各運動中心提供身心障礙者哪些優惠？","a":"1.凡持有身心障礙手冊/證明之身心障礙者及1位必要陪同者，可不限時段免費至運動中心使用包含但不限游泳池及健身房相關設施。依據身心障礙保障法第59條身心障礙者進入收費之公營或公設民營風景區、康樂場所或文教設施，憑身心障礙證明應予免費；其為民營者，應予半價優待。身心障礙者經需求評估結果，認需人陪伴者，其必要陪伴者以一人為限，得享有前項之優待措施，建議陪同者應具有輔助身心障礙者運動的能力，並負起維護安全的責任，以提供身心障礙者必要的協助。\n2.停車免收4小時費用，得依臺北市停車管理工程處身心障礙者停車優惠規範（汽車）辦理。\n3.依據內政部社會司99年8月13日台內社字第0990159258號函，公辦民營場館鑑於受託經營自負盈虧，優惠措施不包括球場租金、活動課程行為。","u":"臺北市政府體育局","h":22798,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=66F4A4DFEC07BE9C","d":"2010-10-11","sid":"66F4A4DF"},{"q":"本市12區運動中心配有50公尺游泳池的有哪幾處？","a":"1.本市12區運動中心配有50公尺游泳池者計有：北投運動中心、中正運動中心、大同運動中心、松山運動中心及大安運動中心等5處。\n2.如欲查詢各運動中心相關資訊，可至本局網站場館訊息/場館簡介中點選相關連結至各運動中心網站。","u":"臺北市政府體育局","h":20216,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=94DE76746B8A716C","d":"2011-06-08","sid":"94DE7674"},{"q":"颱風天運動中心是否開放？","a":"1.否，基於民眾安全，當行政院人事行政總處或臺北市政府宣佈臺北市停止上班上課時，各運動中心之各項設施設備即停止對外開放，課程也隨之暫停，民眾可利用網站及電話查詢。\n2.如欲查詢各運動中心相關資訊，可至本局網站場館訊息/場館簡介中點選相關連結至各運動中心網站。","u":"臺北市政府體育局","h":20075,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BAADC8D5E9BA46E3","d":"2011-04-15","sid":"BAADC8D5"},{"q":"運動中心游泳池的清場時間為何？","a":"本市各中心統一清場時間為上午10時至10時30分，下午清場時段則由各中心依據場地使用情形及場地規模自行訂定。","u":"臺北市政府體育局","h":18951,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AFD526D332670F52","d":"2011-04-17","sid":"AFD526D3"},{"q":"進入運動中心健身房一定要帶毛巾嗎？","a":"要，為讓每一位民眾都能在乾淨清潔的運動環境中使用各類器材，達到運動效果，所以規範請民眾攜帶毛巾進場使用健身器材，適時擦拭汗水，維護個人衛生及預防汗漬滴到機器上，同時也保護自己與他人使用各器材的安全性。","u":"臺北市政府體育局","h":18636,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BFDCFABAB74EF180","d":"2011-04-17","sid":"BFDCFABA"},{"q":"請問運動中心溫水游泳池（即大池）的水溫控制在幾度？","a":"運動中心游泳池水溫控制於攝氏28至30度上下，因游泳時體溫會升高，在高水溫下活動，對於運動量稍微大一點的人會因為體溫突然過高而產生不適（類似發燒、中暑的狀況），為符合一般民眾的需求，且因應季節及天候變化，調整加溫設備溫度，目前運動中心游泳池均控制於攝氏28至30度上下，以提供舒適良好的運動環境。","u":"臺北市政府體育局","h":16837,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5FD3EEBD5B3FCB14","d":"2012-02-23","sid":"5FD3EEBD"},{"q":"使用運動中心的置物櫃是否要付費？","a":"是，置物櫃的設置為受託營運廠商為便利民眾而自行添置，經查至今民眾使用損壞率偏高，考量使用者付費及例行維護維修費用，酌予收取10元至20元以作因應。如果有貴重物品，可使用付費型的置物櫃；如有不用上鎖的物品，可放置於開放式的置物櫃中。運動中心為公共場所，民眾可依需求選擇付費型或開放式的置物櫃，以保障個人物品安全，避免其他民眾誤拿。","u":"臺北市政府體育局","h":15700,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5C65F49D0DD622D0","d":"2011-04-17","sid":"5C65F49D"},{"q":"請問進入運動中心健身房是否能穿牛仔褲呢？","a":"不建議，於運動中心健身房運動時依規定應穿著運動服裝及運動鞋，主要目的在於讓運動者活動時肢體能充分得到舒展，以達到健身效果。且運動服裝多具有吸溼排汗功能，對於大量運動時產生之體熱與汗水吸附也有幫助。\n因牛仔褲較無彈性且材質厚，活動時恐讓運動者無法完全做好標準動作及有效散發體熱，減低健身效果且易造成運動傷害，所以，於健身房活動時應著適當運動服裝較為適當。","u":"臺北市政府體育局","h":15244,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E2CADD319C1E6C90","d":"2012-02-23","sid":"E2CADD31"},{"q":"松山運動中心50公尺深水游泳池測驗費共多少錢？","a":"1.測驗費共200元，其中包含測驗、保險與證照製作，並贈送當次入場，通過測驗者可憑該繳費收據折抵月(季)卡費用，日後也可出示證照後於松山運動中心5米深水池使用。\n2.未通過測試者，贈送當次入場。","u":"臺北市政府體育局","h":13924,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4795F3CBD4DCACBC","d":"2011-04-17","sid":"4795F3CB"},{"q":"運動中心有哪些里民及區民優惠？","a":"1.各區運動中心受託營運廠商考量其地域、消費對象及營運狀況，訂定行銷策略及提供各種優惠回饋市民，各區並不相同，入場購票前請先以電話或於現場洽詢櫃檯售票人員，另外也可上各運動中心網站查詢。\n2.如欲查詢各運動中心相關資訊，可至本局網站場館訊息/場館簡介中點選相關連結至各運動中心網站。","u":"臺北市政府體育局","h":13268,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7AB89BFF26195296","d":"2011-04-17","sid":"7AB89BFF"},{"q":"家長如果不游泳，只陪同小孩進入運動中心游泳池是否也要購票進入？","a":"1.要，民眾進入運動中心游泳池無論是否入池使用，營運單位都負有公共意外責任，即使未參與活動仍有空調、保險、清潔費等基本成本，所以如果家長要陪同小孩進入運動中心游泳池仍要購票。\n2.各運動中心票價於規範標準內，考量管理因素有所不同，建議可於入場購票前先以電話詢問或現場洽詢櫃檯售票人員","u":"臺北市政府體育局","h":11502,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E61A9710E5671473","d":"2011-04-17","sid":"E61A9710"},{"q":"請問運動中心游泳池的淋浴間、更衣室是否可穿室內拖鞋？","a":"不可以，考量游泳池週邊整潔與安全，各運動中心皆禁止民眾穿拖鞋進入游泳池。另有關淋浴間、更衣室等區域，則因各運動中心場地規劃動線不同，所以規範稍有差異，若市民朋友有其他需求建議可洽詢現場服務人員或值班經理。","u":"臺北市政府體育局","h":11297,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8B9BA2FEDE2E2F1D","d":"2012-02-21","sid":"8B9BA2FE"},{"q":"到信義運動中心運動時可以將車輛停放在哪裡呢","a":"建議民眾可多加利用周邊三張里公園停車場或信義廣場公有停車場，或請多加利用大眾交通運輸工具至信義運動中心。","u":"臺北市政府體育局","h":11147,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B8000E66752D78FD","d":"2018-02-26","sid":"B8000E66"},{"q":"為什麼運動中心要委外管理？","a":"本市就運動中心之規劃採委外經營方式辦理，考量經營運動中心需運用專業人才，再加上為表達市府支持推動體育運動發展之決心，將運動中心委外不僅能夠增加體育專才之就業市場、創造就業機會、帶動經濟成長，另委外營運階段交由民間負責，還可節省政府在營運階段需要支出的業務費及人事費等，對紓解政府的財政壓力有很大的貢獻，除此之外公共建設交給民間經營，因為營運成本由民間團體自付，對於提升營運績效有正面效益，同時藉由民間經營創意也可賦予閒置空間全新的生命，使人民可享受更好的服務品質，也可以避免政府可能經營效率不彰之浪費，落實人民為最大贏家之遠景。","u":"臺北市政府體育局","h":10668,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F8C9B73A5AB7E5FE","d":"2011-04-15","sid":"F8C9B73A"},{"q":"月票、季票、回數票等票券是否能在各運動中心通行流用？","a":"不能，本市各運動中心目前是以委外方式委託民間廠商經營管理，且並未由單一廠商統一經營管理。由於其財務管理及營業收入各自獨立，各運動中心針對其區域性差異、營運成本及行銷對象所推出之月票、季票、回數票等票券之優惠方案各自不同，因此目前尚無法實行全市運動中心各種票券通行方案。","u":"臺北市政府體育局","h":10079,"t":"工商營業","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=98D0DA1C310EB80D","d":"2010-11-05","sid":"98D0DA1C"},{"q":"使用運動中心的吹風機是否要付費？","a":"是，部分運動中心為滿足各民眾需求與便利性，設置投幣式吹風機。市民朋友亦可自行攜帶吹風機或洽中心櫃台詢問是否有免費吹風機借用。","u":"臺北市政府體育局","h":9984,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EAEEDCB779ED3157","d":"2012-02-21","sid":"EAEEDCB7"},{"q":"運動中心游泳池如何維持水質？","a":"本市12區運動中心游泳池於每2小時檢測池水中有效餘氯量及酸鹼值，並隨時監控數值符合標準範圍，保持24小時循環過濾消毒。各池皆安裝水質偵測與加藥設備，採自動偵測水質酸鹼值及有效餘氯量，隨時以自動加藥方式來維持水質最佳狀態。除市府衛生局定期前往抽測水質狀況外，本局也定期及不定期派員稽查，以督促營運廠商提供最佳運動環境，維護市民健康。","u":"臺北市政府體育局","h":9714,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4EA73E08A449C6E6","d":"2011-04-17","sid":"4EA73E08"},{"q":"松山運動中心50公尺深水游泳池使用費為何高於25公尺一般溫水游泳池？","a":"考量深水游泳池容積為一般溫水游泳池的8倍，維護成本有所不同，經過衡量耗水量、散熱系統、過濾系統等綜合性成本，酌收150元/次以因應相關成本需求，且使用深水游泳池的民眾仍可使用一般溫水游泳池之各項設備。","u":"臺北市政府體育局","h":9651,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1CCBC185AD315012","d":"2011-04-17","sid":"1CCBC185"},{"q":"我有健身中心消費爭議請問我該向誰申訴？","a":"您可以向下列機關提出申訴：\n1.臺北市政府法務局消費者服務中心，電話：2720-8889分機6169或7812，地址：11008臺北市信義區市府路1號1樓東區。\n2.行政院消費者保護會(https://cpc.ey.gov.tw/)，可於「首頁」→「申訴調解」→「線上申訴」→「線上申請」直接提出申請，填妥相關基本資料及其事由等，承辦機關會盡快協助處理。 3.消費者保護諮詢專線：1950","u":"臺北市政府體育局","h":9479,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=515B41C79D11D64A","d":"2010-10-11","sid":"515B41C7"},{"q":"運動中心停車場是否可使用悠遊卡付費？","a":"可以，有關各區運動中心停車場使用悠遊卡付費制度，除信義運動中心無停車場外其餘已全數完成。","u":"臺北市政府體育局","h":9097,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D021542D8AEB75DE","d":"2010-11-05","sid":"D021542D"},{"q":"為何須通過測驗才能使用松山運動中心50公尺深水游泳池？","a":"考量松山運動中心50公尺深水游泳池深度(5米)超過一般正常人身高，為保護使用者本身及其他泳客安全，避免不熟悉深水環境泳客因緊張或其他因素，造成危險或意外事件，所以須經過測驗，確認使用者體能與反應合格後才能使用。","u":"臺北市政府體育局","h":9067,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6AFAD9C5C7E057BD","d":"2011-04-17","sid":"6AFAD9C5"}]},{"org":"都市更新處","total":91,"items":[{"q":"我家想都更，但自身或鄰居對都市更新概念不了解，該怎麼辦？","a":"為使市民對於都市更新法令更加瞭解，維護市民參與更新權益與提升更新意願， 經15 人以上連署 本處即委請民間專業團體代表出席說明及 辦理法令說明會 ，配合民眾時間，至鄰里鄰近學校、活動中心或里辦公處等公開場合，說明都市更新法令。申請表格可至本網站之便捷服務 > 都更停看聽 > 「臺北市都市更新參與注意事項」 下載「民眾申請臺北市都市更新處辦理都市更新說明會申請表」。","u":"臺北市都市更新處","h":14669,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5A91194B8A2C3DCE","d":"2020-07-15","sid":"5A91194B"},{"q":"目前臺北市辦理之公辦都更，其辦理類型有哪幾種？","a":"依地區特性因地制宜實施公辦都市更新，適性推動及協助規劃最適方案，達到改善居住環境品質、補足地區生活機能、充實公益設施等目標， 為臺北帶來再生的能量，提升城市競爭力。\nP-公地活化型(Public Property)\nR-整宅輔導型(Resettlement Housing)\nO-自助人助型(Organization)","u":"臺北市都市更新處","h":10789,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=96605FAA45D496E6","d":"2023-03-20","sid":"96605FAA"},{"q":"要多大的空間才能增設電梯呢?","a":"通常老舊公寓增設電梯，大致可區分為３人座、６人座、８人座。以最小3人座的電梯而言，昇降機道（供昇降機廂運行之垂直空間）淨尺寸需要 150cm×150cm ，且需要挖設深度約1.2~1.5m的機坑，故必須衡酌個案建築基地的實際條件而斷。\n建議請專業建築師前往評估及申請使用執照竣工圖輔助為準。初步判斷原則，法定空地 寬度至少需超過260CM、深度至少需190CM ，增設的可行性較高","u":"臺北市都市更新處","h":6350,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2FF40981410167D9","d":"2024-04-08","sid":"2FF40981"},{"q":"協議合建、權利變換及多數協議合建、少數權利變換等三種實施方式有何不同?","a":"1.實施方式主要差異如下：\n實施方式\n協議合建實施方式\n權利變換實施方式\n同意比率\n須取得所有權人100%同意\n須符合都市更新條例第37條規定\n分配\n依所有權人與實施者雙方合意之私權契約內容進行權利價值分配，審議會沒有審議的權責。\n1.由估價師查估更新前後權利價值，而估價結果及成本提列都需經由審議會把關並審酌合理性，以保障地主的權益。\n2. 更新後權利變換關係人(所有權人、實施者、出資者)再按照各自所提供之土地或建物的「更新前分配比率」或「出資額度(即更新成本/共同負擔)」，分配「更新後的房地」。\n容積獎勵\n若事業計畫報核已達100%同意，可額外申請法定容積5%之容積獎勵。\n無特殊規定。\n稅賦減免\n土地增值稅及契約部分，需經主管機關同意才能減徵40%。\n土地增值稅及契約部分，得視情形申請免徵或減徵40%。\n審議程序\n1.僅審議都市更新事業計畫書\n2.共識度高且無爭議，審議期程較快\n需審議都市更新事業計畫書、權利變換計畫書及估價報告書。\n申請建照\n需取得100%土地使用及建物拆除同意書\n得以實施者名義申請\n2.多數協議合建、少數權利變換方式實施：依都市更新條例第44條規定，私有土地面積及合法建築物面積超過80%同意者，得就達成協議部分以協議合建方式實施，剩餘未同意戶部分則採權利變換方式實施。\n3.至於上述哪一種實施方式對於地主較有利實屬個人主觀意見，仍須視地主需求而定。","u":"臺北市都市更新處","h":4929,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=41DEF6A07691554C","d":"2025-10-09","sid":"41DEF6A0"},{"q":"都市更新容積獎勵的上限為何?哪種計算方式最有利?","a":"依都市更新條例第65條規定，獎勵後之建築容積不得超過下列規定：","u":"臺北市都市更新處","h":4444,"t":"其他綜合","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E3DD3B4B49541FBA","d":"2025-10-09","sid":"E3DD3B4B"},{"q":"我不同意都更，未來會被強拆嗎?","a":"1.所有權人可於都市更新審議期間透過公聽會、聽證或提供書面陳情意見至臺北市都市更新處表達陳情意見，市府會責請實施者本於真誠磋商精神持續與所有權人積極溝通協調。\n2.權利變換計畫核定發布實施後，雙方若仍無法達成共識，且所有權人於預定拆遷日後仍未配合辦理搬遷作業，實施者可依都市更新條例第57條規定，於領得拆除執照後，通知所有權人、管理人或使用人限期30日內自行拆除或遷移，若逾期未拆除或遷移，實施者應本於真誠磋商精神召開2次以上協調會，若仍協調不成，則可依「 臺北市政府都市更新實施者申請代為拆除或遷移土地改良物實施辦法 」規定向市府提出代為拆除申請。\n3.當市府受理代為拆除申請後，將由公部門介入協調並召開2次以上協調會，若仍協調不成，應提請臺北市都市更新及爭議處理審議會，評估是否續行協調或執行代為拆除或遷移之決定。","u":"臺北市都市更新處","h":3975,"t":"建管都更","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B737436A33AD3C3C","d":"2025-10-10","sid":"B737436A"},{"q":"拆遷安置費(租金補貼)和土地改良物拆遷補償費是什麼？費用如何計算?","a":"項目 拆遷補償費 拆遷安置費 定義 因重建而拆除或遷移之土地改良物，應補償其價值或建築物之殘餘價值。 因重建而拆除或遷移之合法建築物，至更新後建築物完成再行遷回，實施者補貼所有權人更新期間之租金即為拆遷安置費。 提列標的 合法建築物 合法建築物 其他改良物： 1.合法建築物之增建（如：頂樓加蓋、1樓外推） 2.非占有他人土地之舊違章建物（多屬未辦理保存登記者） 3.其他土地改良物(違章建物) 核算基礎 建物登記謄本面積、實際測量面積 建物登記謄本面積 提列金額 實際發放金額應為扣除預估代為拆除及遷移費用後之
