核准後公告，目前每度用水代徵5元；中低收入戶每度用水代徵1.5元；低收入戶免徵。 3. 計算方式： 污水下水道使用費＝總用水度數（實際用水度數+分攤總表差額）* 代徵費用 4. 若您尚有其他下水道相關問題，請依用水地址洽相關單位查詢： (1) 臺北市用戶請洽詢衛工處（地址：臺北市大同區酒泉街235號　電話：02-25973183分機113、115、188）或參考 該處網站 ，如欲查詢貴戶是否已接管，請至 污水下水道使用費收費地區查詢 。 (2) 新北市用戶請洽詢水利局永和營運中心（地址：新北市永和區保順路 8 號　電話：0800-230-001）或參考 該局網站 ，如欲查詢貴戶是否已接管，請至 污水下水道用戶接管查詢網頁查詢 。","u":"臺北自來水事業處業務科","h":63841,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=40AF1BFE3E71E9D4","d":"2011-08-10","sid":"40AF1BFE"},{"q":"水池水塔之清洗頻率與標準清洗程序為何？","a":"1) 水池水塔應每年至少清洗一次，本處為擴大為民服務，每年辦理「清洗水池水塔專業訓練」，目前推薦之「 優良水池水塔清洗廠商 」供用戶選擇參考，經專業訓練人員從事清洗作業，同時檢查用水設備狀況作適時改善，可以有效防範及處理水質污染問題，使得清洗品質更有保障，確保用水安全。\n2) 本處編有「水池水塔清洗作業流程」，提供推薦水池水塔清洗業者，作為執行業務之依循，其中標準之水池水塔清洗7步驟：\n（1）清洗前規劃：先規劃最省水的作業方式，並以抽水機迅速排除積水。\n（2）設備檢查：仔細檢查平日不易查看的用水設備。\n（3）高壓清洗：使用高壓洗淨機清洗，維持良好清洗效果。\n（4）殘水處理：使用殘水處理機抽除池底殘水。\n（5）清洗後消毒：以高濃度氯溶液噴霧消毒，充分消毒後，再徹底沖洗乾淨。\n（6）水質檢驗：完成沖洗及排水後，才開始進水；進水完成後，再進行洗淨後之水質檢驗。\n（7）提供清洗紀錄：提供用戶清洗照片、設備檢查記錄及水質檢驗報告，清洗作業至此全部完成。","u":"臺北自來水事業處技術科","h":55705,"t":"環保清潔","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=064501F319C22AC8","d":"2009-09-25","sid":"064501F3"},{"q":"各口徑基本費計算基準？","a":"各口徑基本費之計算：\n以 口徑 13mm原計每戶每月基本費34元為基礎，乘上各水表口徑對應之「管徑等似值比」。\n各口徑管徑等似值比與基本費比較表\n備註： 口徑 13mm 基本費原計每戶每月34元，經予減半，以17元計收。\n管徑等似值舉例說明：\n以水表口徑13mm及100mm為例，假設在相同水壓及摩擦係數下，需裝設107支 口徑 13mm 水管的總水流量，才相當於1支 口徑 100mm水管的水流量。\n口徑 100mm每戶每月基本費\n＝ 口徑 13mm原計每戶每月基本費 × 管徑等似值比\n＝34元 × 107\n＝3,638","u":"臺北自來水事業處財務科","h":54755,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C187A8BF7D08628A","d":"2009-09-28","sid":"C187A8BF"},{"q":"臺北市及新北市的自來水費可跨區互繳嗎?","a":"本處供水區域為臺北市、新北市三重區、新店區、永和區、中和區及汐止區7個里（橫科、宜興、忠山、北山、東勢、環河、福山）等大臺北地區，轄區以外則為台灣自來水公司供水區域。\n本處於臺北市內設有6個服務據點（東區、西區、南區、北區、陽明營業分處及客服中心），均可跨區受理本處轄區用戶繳交水費；惟如為台灣自來水公司轄區內新北市用戶，則尚無法於本處服務據點跨區互繳水費。","u":"臺北自來水事業處業務科","h":52247,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A81036E13C39E55B","d":"2010-12-25","sid":"A81036E1"},{"q":"台灣自來水公司專線1910跟臺北自來水事業處服務的地方有何不同?","a":"臺北自來水事業處設立客服專線02-87335678，並結合市府1999市民當家熱線，全年無休24小時由專人線上接聽，提供諮詢服務、受理申訴抱怨及追蹤處理情形，並調查客戶滿意度；同時提供報修漏水、無水服務、水費查詢、補發水單及販售零售水等服務，用戶一通電話服務到底。 本處供水區域為臺北市全部、新北市新店、永和、中和部分、三重部分及汐止區7個里（橫科、宜興、忠山、北山、東勢、環河、福山）等大臺北地區。轄區以外則為台灣自來水公司供水區域，服務專線1910。","u":"臺北自來水事業處業務科","h":51995,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D521E7A0AD42E40C","d":"2011-01-31","sid":"D521E7A0"},{"q":"水表每8年換裝乙次之依據及如何確認換裝人員之真偽？","a":"1.換裝依據：\n(1)為使水表計量準確，維護用戶權益，依據經濟部公佈「水量計檢定檢查技術規範」，水量計之檢定合格有效期限為8年，對於逾有效期限之水表，本處委請承商免費到府為用戶換裝水表。除依規定每8年辦理水表定期汰換外，另配合經濟部標準檢驗局每年度水量計抽查作業，辦理水表換裝。\n(2)為提升用戶服務品質及維運管理效能，並達成降低管網及用戶漏水損耗等目標，本處採劃區方式推動智慧水表建置，並配合水表檢定合格有效期限辦理屆齡智慧水表汰換，委請承商免費到府辦理智慧水表換裝作業。\n2.如何確認換裝人員之真偽：\n(1)本處委請承商於更換水表前3日，將「換裝水表通知單」張貼於預定施工用戶門口明顯處或投遞至用戶信箱，以為事先通知。 (2)承商施工人員於更換水表時，需佩帶本處核發之工作證及著制式服裝，可要求其出示該證明文件。 (3)電洽本處24小時客服專線02-87335678查詢。\n本處115年度換表工程廠商及監工人員名單\n02- 26824608\n南區營業分處轄區\n(臺北市中山、中正、文山、松山、信義區等)\n楊博皓\n陳睦捷\n本處113年智慧水表營運測試2.0服務採購案廠商及監工人員名單\n廠商名稱\n廠商電話\n監工人員\n監工人員電話\n負責區域\n施作範圍參考\n(依實際施作為主)\n中華電信\n股份有限公司\n企業客戶分公司\n02-87447098\n邱繼慶\n02-87703055\n東區營業分處轄區\n(中山劃區)\n王若恩\n02-83695126\n南區營業分處轄區\n(大安劃區)\n弓銓企業\n股份有限公司\n06-5050207\n梁文馨\n02-21004135\n北區營業分處轄區\n(大同、中山劃區)\n吳德村\n02-28882121\n陽明營業分處轄區\n(士林劃區)","u":"臺北自來水事業處業務科","h":50857,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AEB4908838338EC3","d":"2012-03-12","sid":"AEB49088"},{"q":"水費突增原因及如何申請複查?","a":"1)水費突增可能因素：\n(1)水表問題：故障快轉、錯裝。\n(2)抄表問題：抄表員抄錯或用戶自抄錯誤、或連續鎖門提高推定度數。\n(3)漏水：用戶表後用水設備(含水池、水塔、水栓、馬桶等用水設備)漏水。\n(4)竊水。\n2)申請複查方式：\n利用電話、信函、E-mail或洽所屬\n轄區營業分處\n。","u":"臺北自來水事業處業務科","h":50539,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B4E980116DF054A7","d":"2009-12-02","sid":"B4E98011"},{"q":"地熱谷的地址及相關訊息。","a":"1.位址：北投區中山路與溫泉路之間窪地(臺北市北投區中山路30號之10)，搭捷運淡水線至新北投站後往新北投公園左側走約15分鐘路程。\n2.開放時間及門票：每週二至週日上午9時至下午5時免費開放民眾瀏覽休憩(夏季時間自每年5月15日至9月14日止，延至下午6時關園)，農曆除夕、大年初一及週一關園進行清潔維護(週一如為政府行政機關辦公日曆表之放假日，則園區維持開放)。 3.如工程施作或其他原因需要，依公告停止開放。","u":"臺北自來水事業處陽明營業分處","h":49321,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CA22DFCC722E6905","d":"2009-09-28","sid":"CA22DFCC"},{"q":"如何自抄水表﹖如用戶無法配合抄表時，如何計量？","a":"1）電話自報度數：請告知地址、水號、自抄水表度數並留下聯絡電話和姓名。\n2）網路自報度數：您可在本處抄表員到府抄表前4天、抄表當日或抄表後1天中午12時前，上網輸入水號、指針即可完成（為確保水費計費正確，網路自報度數限於前述期間內辦理，若您利用網路自報度數出現「非自報度數期限」，係因輸入時間不在抄表期間內所致，系統並將告知正確的自報度數期限，感謝您的配合）。\n※自抄水表，請在抄表前4日或抄表當日、後一日中午12時前撥所屬營業分處電話：\n電話\nE-mail自報度數\n(02)8770-3382~6 twd025@water.gov.taipei\n(02)3343-1672 twd026@water.gov.taipei\n(02)8369-5118 twd027@water.gov.taipei\n(02)2100-4128 twd028@water.gov.taipei\n(02)2888-2121~2 twd029@water.gov.taipei\n3）因用戶之事由致不能抄表時，用戶可自抄水表或由本處暫照上期用水度數計算，於下期抄表時結算之。 4）如連續2次無法抄表時，本處得以書面或電話通知約期候抄，屆時仍無法抄表時，本處得按水表口徑流量推計，並於抄見時結算。","u":"臺北自來水事業處業務科","h":48436,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5108E97118AC1EF1","d":"2008-09-26","sid":"5108E971"},{"q":"本處水費可透過那些網路方式繳費?","a":"1、台北智慧支付平台pay.taipei線上繳費(第三方支付代收)： 1)使用 智慧支付平台網站 或 台北通APP 線上繳費： 用戶選取北水處水費，輸入水號查詢待繳水費後，再選擇支付業者，將導向選定之支付業者付費畫面進行繳費，除刷信用卡繳費(可免登入)及銀行帳戶支付(先登入台北通，首次付款請先設定銀行帳戶並透過網銀身分驗證)外，用戶須另行申請業者端會員，再依業者提供的支付方式進行付款，繳費後即時銷帳。 2)使用各支付業者之網頁或APP直接連線繳費： 搜尋各支付業者網頁或APP，加入會員後，選取臺北自來水費，即可透過輸入水號查詢待繳費用繳費。 3)掃描水單QR code繳費 (自108年11月1日新寄送水單啟用)： ①用戶使用行動裝置任意或台北通APP掃描器掃描水單繳費QRcode，即可自動帶入水號查詢待繳費用繳費。 ②用戶使用合作支付業者APP選擇「掃描條碼功能」，即可自動帶入水號查詢待繳水費繳費。\n5)繳費後即時銷帳，用戶免付代收手續費。\n2、台灣Pay 線上繳費： 1)使用台灣行動支付APP掃描水單QR Code： 用戶登入台灣行動支付APP，選擇 -繳費/自來水費/臺北自來水費，輸入水號 查詢最新水費 ，或選擇「掃碼收付」功能掃描水單台灣Pay QR code， 自動帶入水號查詢最新水費，用戶 再選定於台灣Pay設定之金融卡繳費 。 【台灣行動支付APP開辦銀行詳細名單】 2)使用台灣Pay合作之行動銀行APP掃描水單QR Code： 用戶使用個人已申請網銀功能之行動銀行APP掃描水單台灣Pay QR Code，自動帶入水號查詢最新水費後，再以該網銀帳戶繳費，目前開辦金融機構計17家( 已上線銀行為土地銀行、合作金庫、第一銀行、彰化銀行、兆豐銀行、三信商銀、臺灣銀行、王道銀行、臺灣企銀、永豐銀行、高雄銀行、台中二信、農金資、陽信銀行、台北富邦、玉山銀行、華南銀行 ，其餘行動銀行APP掃描水單台灣Pay QR code功能將陸續上線)。 4)繳費後即時銷帳，用戶免付代收手續費。\n3、本處網站線上繳費 ：\n用戶連上本處網站 網路繳費 專區，選擇北水處線上繳費服務 ，輸","u":"臺北自來水事業處業務科","h":44400,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A9C50423ADD1E925","d":"2009-09-28","sid":"A9C50423"},{"q":"如何取消委託金融機構或郵局代繳?","a":"中止委託代繳可依下列方式辦理：\n1) 請用戶攜帶近期水費繳費憑證、印章、身分證向原約定水費代繳之金融機構辦理中止委託代繳，辦理成功後，金融機構將於14日內，將資料傳送本處刪除帳號並中止下期水費送扣。\n2)如為 006合作金庫/012台北富邦銀行/048王道銀行/807永豐銀行/823將來銀行， 五家金融機構之存戶，可透過 登入您的水管家 線上即時取消金融帳戶代扣繳。( 線上異動金融帳戶代扣繳說明 )\n2) 將水號、用水住址、銀行代繳帳號、姓名、聯絡電話，以電話或傳真方式向各轄區服務櫃檯敘明中止代繳亦可；惟此方式僅本處刪除用戶帳號資料水費不送扣，用戶仍與銀行存在約定關係，為維用戶權益仍請抽空向原申請金融機構辦理中止委託。 ( 本處各轄區服務電話及據點 )","u":"臺北自來水事業處業務科","h":40712,"t":"水電瓦斯","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8B2393ACBAD2A79B","d":"2009-09-28","sid":"8B2393AC"}]},{"org":"停車管理工程處","total":214,"items":[{"q":"停車繳費通知單、停車費催繳及追繳通知單過期，(臺北市/外縣市)民眾無法至臺北市指定定點繳納，是否有其他繳費方式？","a":"一、在催繳通知單寄發以前：\n(一)可利用手機下載App (「Pi拍錢包」、「歐付寶」、「街口支付」、「悠遊付」、「橘子支付」、「台北富邦銀行」、「元大銀行」、「永豐銀行」、「車麻吉」、「停車大聲公」、「嗶嗶繳」、「ipass Money」、「蝦皮購物」、「icash Pay」、「Apple Pay」、 「 全支付pxpay plus」、「全盈+Pay」、台北通綁定銀行帳戶 )，註冊會員後綁定信用卡、銀行帳戶或儲值帳戶，掃描停車單（包括催、追繳）第2段條碼，或輸入車號查詢，並依指示操作，如果能夠查詢到該筆停車單，即可繳費。亦可透過「台北通」app或本處「停車查詢一站式服務網站」停車單查詢功能，使用本國發行之信用卡(不含簽帳金融卡)，輸入信用卡資料完成支付，惟發卡銀行須為參加「電子化繳費稅處理平台」之發卡機構。(繳費期限為催追繳單寄發前3天)\n(二)可至本處自營公有立體或地下停車場繳納 （ 繳費地點 ）。\n(三)停管處服務臺(地點：台北市信義區松德路300號1樓、服務時間為周一至周五上午8時30分至17時30分)。客服專線服務電話：2726-9600、服務時間為周一至周五上午8時30分至下午17時30分。\n(四)臺北市交通事件裁決所(台北市羅斯福路4段92號7樓) 駐點收費櫃台，服務時間：週一至週五上午8時30分至下午17時30分，11時30分至12時暫停服務)\n二、停車繳費單截止日期內，除上述四種方法外，還可運用下列方式繳費：\n(一)可至全國各地統一超商、全家超商、萊爾富超商、OK Mart超商、美廉社及雙北市之中油所屬加油站臨櫃繳費。\n(二)匯票，於繳費截止日期內，以郵戳日期為憑。至郵局購買與停車費等值郵政匯票，匯票抬頭為『臺北市停車管理工程處』，郵寄至「臺北市停車管理工程處」（11086臺北市信義區松德路300號5樓）辦理繳納，另ATM或信用卡轉帳無法受理繳費。\n三、收到停管處寄發之催繳通知單(依監理處登記之行照地址寄發)之後：\n(一)須加收郵寄工本費，於催繳期限內至全國各地 統一超商、全家超商、萊爾富超商、OK Mart超商 、美廉社、 雙北市之中油所屬加油站 及停","u":"臺北市停車管理工程處","h":654715,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3CD650476D746191","d":"2009-06-10","sid":"3CD65047"},{"q":"車輛遭違規拖吊如何查詢？如何領車？","a":"一、除可透過違規停車現場地面書寫之保管場電話、名稱、車號及利用1999市民當家熱線（外縣市：02-27208889）查詢車輛移置保管地點外，亦可透過「 臺北市交通大隊車輛拖吊查詢系統 」輸入車號查詢，將回復告知車輛保管場名稱、地址、聯絡電話等資訊。\n二、領車時應請民眾辦妥下列事項：\n（一）出示行車執照、駕駛執照或其他證明文件。\n（二）若無行車執照時，須提示車輛原始證明（出廠及檢驗證明）或足以證明該車輛來源之具體可信資料，並填寫切結書。\n（三）繳納移置費及保管費\n（四）保管場人員於收取移置費及保管費後，應開立經核章之「臺北市政府交通局妨礙道路交通車輛移置及保管費違規罰鍰收據」交付領車人。","u":"臺北市停車管理工程處","h":409243,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AE7761FBF56F7B66","d":"2019-09-18","sid":"AE7761FB"},{"q":"逆向停車如何認定，由誰取締，處罰多少錢？","a":"按「汽車除行駛於單行道或指定行駛於左側車道外，在未劃分向線或分向限制線之道路，應靠右行駛」、「汽車停車時應依車輛順行方向緊靠道路邊緣，其前後輪胎外側距離緣石或路面邊緣不得逾40公分」為道路交通安全規則第95條第1項、第112條第2項明文規定，依道路交通管理處罰條例第56條第1項第6款規定，不依順行方向，或不緊靠道路右側，或單行道不緊靠路邊停車情形者，處新臺幣600元以上1,200元以下罰鍰。\n上開違規行為中之「不依順行方向停車」即是逆向停車，於本市倘有該項停車行為，即屬違規停車，本府警察局及本處均可依法稽查舉發。","u":"臺北市停車管理工程處","h":193562,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9CFBA107A08EC3AD","d":"2016-05-05","sid":"9CFBA107"},{"q":"若停車費重複繳費【含超商、自動代扣繳、APP繳費等】應如何辦理退費?","a":"一、民眾若已透過非現金管道(如銀行電信自動代扣繳、手機APP等)繳費又重複繳費，本處系統設有檢核機制，將自動退費至原非現金扣款來源，民眾不需另外申請。\n二、民眾可於本處官網（https://pma.gov.taipei）之「停車查詢一站式服務網」(https://parkingfee.pma.gov.taipei/ )查詢，如有重複繳費情形，申請退費可依以下方式辦理：\n1.持繳費收據正本（2份）逕至本處轄管各公有立體地下停車場填寫退費申請表辦理退費事宜。\n2.於本處官網「申請案件/交通局/停車管理工程處/臺北市路邊停車費重複繳費申請退費」連結至臺北市政府-台北服務通網路申辦。\n3.若停車費民眾同時透過非現金管道(如銀行電信自動代扣繳、手機APP等)及現金管道(如超商、中油加油站等)重複繳費，本處退費原則以退至非現金扣款來源為主。\n4.洽本處客服專線（02-27269600）或至本處服務臺（臺北市信義區松德路300號1樓），將有專人為您服務。","u":"臺北市停車管理工程處","h":176950,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9C35947C2F20F778","d":"2009-06-17","sid":"9C35947C"},{"q":"騎樓及人行道可以停車嗎？執法標準是什麼?","a":"一、依據「道路交通管理處罰條例」第3條、第55條及第56條規定，騎樓、人行道係供行人通行使用，除依第90-3條道路主管機關所設置必要標線範圍內之人行道之外，均禁止停車。\n二、目前本市騎樓及人行道執法標準為：\n（一）已設置禁停牌面之騎樓及人行道：加強取締；如違規事實明確者，可依道路交通管理處罰條例據以執法。\n（二）未設置禁停牌面之「騎樓」：原則不主動舉發；如違規事實明確者，可依道路交通管理處罰條例據以執法。\n（三）未設置禁停牌面之「人行道」：原則不主動舉發；參照違反道路交通管理事件統一裁罰基準及處理細則第12條，深夜時段（0至6時）、未嚴重危害交通安全、秩序，且情節輕微，可施以勸導，免予舉發為原則。\n(四)依本市「臺北市人行道執法取締基準」第6項辦理，如附件。","u":"臺北市停車管理工程處","h":143842,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C04576BC09F668C6","d":"2011-02-14","sid":"C04576BC"},{"q":"身心障礙者停放公有停車格優惠措施為何？","a":"一、路外立體、地下及24小時收費之平面停車場臨時停車：停車當次前4小時免費，第5小時後以該停車場費率半價收費。\n二、公有路外停車場： 半價優惠定期票\n三、路邊停車銷單優惠：計次格位半價；計時格位停車前4小時免費、第5小時後依當時費率（累進費率以第5小時起算）全額收費","u":"臺北市停車管理工程處","h":139196,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4EDEE173EFF12B0C","d":"2008-07-01","sid":"4EDEE173"},{"q":"車輛違規停車遭取締為何在同一天內會連續告發？","a":"依道路交通管理處罰條例第85條之1第2項第2款之規定，駕駛人不在場或未能將車輛移置，每逾2小時，得連續舉發之。若查有車輛違規停放在同一地點超過2小時以上，是可以連續告發的。","u":"臺北市停車管理工程處","h":116323,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=63D23BD95A2A629B","d":"2008-07-01","sid":"63D23BD9"},{"q":"自行車、電動輔助自行車、微型電動二輪車及個人行動器具，可以停放在機車停車格內嗎？","a":"1.自行車( 腳踏自行車、電動輔助自行車) ：可停放本市 「 未收費機車格 」 、 「 自行車停放區 」 、 「 未收費機慢車停放區 」 。\n依「道路交通安全規則」第6條規定，腳踏自行車、電動輔助自行車及微型電動二輪車屬自行車類別，個人行動器具則屬其他慢車類別，並依「道路交通安全規則」第 131 條之規定：「慢車不得任意停放，應在規定地點或劃設之標線以內，順序排列。」、「在未設置自行車停車設施之處所，自行車得比照大型重型機車以外之機車停放。 」\n2.微型電動二輪車：可停放本市 「 收費機車格 」 、（含機車彎、人行道機慢車停放區；機車限時停車格位除外）及 「 未收費機車格 」\n臺北市因應綠運輸政策，鼓勵民眾騎乘無污染運具通勤及接駁大眾運輸工具，收費方式比照電動機車免收停車費。\n3.個人行動器具：可停放本市 「未收費 機慢車停放區 」 。","u":"臺北市停車管理工程處","h":104090,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=71CF413CB4B23B50","d":"2009-11-18","sid":"71CF413C"},{"q":"如何使用智慧支付購買定期票?","a":"一、請先上本處網站後，流程如下：\n(一)使用智慧支付方式購買定期票，需先將車牌綁定至支付業者平台(APP或網站)，可供選擇之支付平台及設定流程可參考本處停車定期票網站(https://monthtkt.pma.gov.tw/)。\n(二)選擇「路外定期票抽籤」或「路邊定期票購買」。\n(三)點選「定期票線上付款操作流程」分別有綁定及付款流程，綁定完成後隔日生效。\n二、路外定期票抽籤可於中籤後收到付款連結簡訊進行付款，路邊機車定期票於送出申請資料後進行付款。","u":"臺北市停車管理工程處","h":97453,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1509B906BC3175B4","d":"2020-02-20","sid":"1509B906"},{"q":"貨車裝卸專用區可停放的車種為何？（例：休旅車）","a":"本市「貨車裝卸專用區」，於專用區標誌標示之裝卸時段內，提供不特定對象之貨車或客貨兩用車（依車輛行照上登載為準）上下貨臨停使用。 非前述種類之車輛於裝卸貨時間請勿停放，時段外則依標誌牌面規定，開放一般小型車輛（含小貨車及小客貨兩用車）停放或實施禁停管制，停放前請詳閱標誌說明。","u":"臺北市停車管理工程處","h":94955,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BF840C2AA8423522","d":"2009-07-03","sid":"BF840C2A"},{"q":"若立牌上有註明星期一至星期五(09:00-17:00)貨車限時停放20分鐘得延長1次，其餘時間開放一般自小客車停放是如何計費？","a":"若立牌上有註明『星期一至星期五(09:00-17:00)貨車限時停放20分鐘得延長1次，其餘時間開放一般自小客車限時停放』，則於星期一至星期五(09:00-17:00)裝卸貨時段內僅供行照註記為「小貨車」或「小客貨車」作裝卸貨使用(每車次限停20分鐘得延長1次)，裝卸貨管制時段外則開放一般自小客車停放。如該地位於收費路段則依現地公告之收費時段及費率收費。","u":"臺北市停車管理工程處","h":89371,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EE43383263FE827A","d":"2009-06-17","sid":"EE433832"},{"q":"貨車裝卸專用區等格位遇到國定假日或連續假日時，裝卸貨時間是否有開放一般小客車停車？","a":"本市貨車裝卸專用區等特殊格位遇國定假日、連續假日時，若該管制項目未標示「假日」等字樣，則維持原管制方式，不隨著放假日而改變。\n常見樣態如下：\n貨車牌面\n1. 若「週一至週五」指定時段為裝卸貨時段時，週一至週五遇國定假日該指定時段僅供貨車使用，禁止一般小型車停放（因為未標示「假日」字樣）。\n2. 若「週一至週五」有禁止停車管制，但「無」標示「假日除外」字樣，則週一至週五遇國定假日仍實施禁止停車管制。\n3. 若「週一至週五」有禁止停車管制，且「有」標示「假日除外」字樣，則週一至週五遇國定假日，則該日「禁止停車時段」開放一般小型車停放，其餘時段則依標誌所示之管制方式辦理。\n汽機車共用牌面\n1. 若標示「週一至週五」指定時段為機車專用、「週六、週日」指定時段為汽機車共用時段，週一至週五遇國定假日時，機車專用時段仍僅供機車停放車輛（因未標示假日字樣）。\n2. 若標示「週一至週五」指定時段為機車專用、「假日」指定時間為汽機車共用時段 ，則週一至週五遇國定假日時，因適用「假日」管制方式，故該原機車專用時段開放汽機車同時停放。","u":"臺北市停車管理工程處","h":78896,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9C821AEB5985FC96","d":"2023-03-30","sid":"9C821AEB"},{"q":"到便利商店繳交停車費，可否打統一編號?","a":"依財政部89年1月10日台財稅第880450937號函：停車費收入核屬具有規費性質，與一般銷售貨物或勞務之行為尚有不同，非屬營業稅課稅範圍，故各縣市目前路邊代收之收據即可作為正式憑證，無須另打統一編號。","u":"臺北市停車管理工程處","h":76334,"t":"稅務","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9D7C7A5C1A9690BE","d":"2009-06-24","sid":"9D7C7A5C"},{"q":"何謂停車\"累進計費\"?","a":"1.累進費率即「累積停車時間愈久，每小時費率愈高」之停車計費方式，適用於停車需求殷切之地區，期藉以價制量方式，提高停車位轉換率，減少民眾繞行尋找車位之時間，促進交通順暢，如第1小時費率20元/時，第2小時費率增至30元/時等，依此類推。\n2.本市累進費率之計費方式計3種，說明如下：\n(1) 2小時以內每小時30元；2小時之後每小時40元。\n(2) 第1小時40元；第2~3小時每小時50元；第4小時以上每小時60元。\n(3) 第1小時30元；第2~3小時每小時40元；第4~5小時每小時50元；第6小時以上每小時60元。","u":"臺北市停車管理工程處","h":75692,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6E9AEA821C9D409D","d":"2020-03-26","sid":"6E9AEA82"},{"q":"路邊停車費如何繳納?","a":"本市路邊停車費可採下列管道繳交路邊停車費：\n(1) 手機APP即時繳費\n本處推出手機繳路邊停車費服務，手機下載App (「Pi拍錢包」、「歐付寶」、「街口支付」、「悠遊付」、「橘子支付」、「台北富邦銀行」、「元大銀行」、「永豐銀行」、「車麻吉」、「停車大聲公」、「嗶嗶繳」、「ipass Money」、「蝦皮購物」、 「icash Pay」、「Apple Pay」、 「 全支付pxpay plus」、「全盈+Pay」、台北通綁定銀行帳戶)，註冊會員後綁定信用卡、銀行帳戶或儲值帳戶，掃描停車單（包括催、追繳）第2段條碼，或輸入車號查詢，並依指示操作，就可繳納停車費(亦可至本處停車查詢一站式服務網或台北通app輸入信用卡資料繳費)。\n(2) 銀行及電信業者代扣繳停車費\n目前已有8家銀行及電信辦理代扣繳路邊停車費服務，可避免因忘記繳交停車費而受罰，另臺灣票據交換所合作之金融機構亦可辦理。詳： https://pma.gov.taipei/cp.aspx?n=D7814FFBA620BF3F 。\n(3) 定點代收停車費\n民眾只要持停車繳費單，至四大超商(統一、全家、OK Mart、萊爾富)、美廉社、雙北市之中油所屬加油站及本市所轄各公有立體、地下停車場（全年無休）或停管處服務臺（服務時間：週一至週五上午8:30-下午17:30，午間照常服務，國定例假日除外）即可繳費。","u":"臺北市停車管理工程處","h":61984,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A0C5E712AF6E8733","d":"2015-09-24","sid":"A0C5E712"},{"q":"有關「卸貨停車格」現場未設置告示牌，民眾是否可停放車輛?若停放了，則如何收費？","a":"為因應物流業者或一般貨車使用者於路側裝卸貨之停車需求，本市停車管理工程處乃設置裝卸貨停車位，格位旁設有公告收費牌面，提供駕駛人辨識遵循，於卸貨時段內係供「自用小貨車」、「營業小貨車」、「自用小客貨」及「營業小客貨」卸貨使用，另考量民眾於裝卸時段外之停車需求，故裝卸外時段可提供一般小型車輛停放。\n若於裝卸貨停車格旁未看見告示牌面，仍須依本市裝卸貨停車格規定停放車輛，每次以20分鐘為限(得延長1次)，並可向停車管理工程處反映，該處將儘速設置告示牌面。","u":"臺北市停車管理工程處","h":59841,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=615049135031DFB7","d":"2016-03-26","sid":"61504913"},{"q":"何謂汽車限時停車位?如何使用?應注意什麼?","a":"一、 本市考量市區商業活動車流量頻繁，於市中心重要幹道之行政機關、銀行、郵局及商業大樓聚集處規劃限時停車位，俾有急迫性或需臨時停車需求之民眾找尋停車位，除使其他有短時間停車需求之民眾能有機會公平使用外，並可縮短洽公民眾尋找停車位時間，以避免車輛併排而阻礙交通秩序，乃採限時停車1小時之停車收費管理，身心障礙人士亦可停放，惟需依「限時停車1小時」管理及繳費而無法提供優惠停車費率，以維持車位高週轉率，使車位更能公平合理效率使用。若車主停車時間逾越1小時，則由交通助理員開立停車逾時違規告發單(600~1,200元罰鍰)。\n二、另有關持有身心障礙專用停車證之使用者將車輛停於限時停車位，將依「臺北市停車管理工程處身心障礙者停車優惠規範(汽車)」第4點「路邊停車(不含限時停車位及裝卸貨專用停車位)優惠類別及規範」，由開單管理員開立一般停車繳費單。\n三、另為提醒駕駛人停車時能清楚辨識限時停車位，本處於該等車位地面上皆標繪「限時車位」及格位編號字樣，且於該格位旁設置公告收費牌面，俾供車主遵循。以公告收費牌面資訊：「限停1小時(假日除外)，週一至週五 7:00-20:00 40元/H，限時車位不適用身障停車優惠，週六(Sat.)50元/H」為例，則20:00以後至7:00以前牌面顯示之限停時段外，不再限停1小時，並依該路段公告一般小型車費率收費。","u":"臺北市停車管理工程處","h":58431,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=828A65131FCBC6FB","d":"2020-03-26","sid":"828A6513"},{"q":"民眾接到違規停車告發單後幾個工作天才會收到罰單?","a":"本處掣開違規停車告發單(標示聯)後，經審核照片等相關資料無誤才產製舉發違反道路交通管理事件通知單(即紅單)，並以掛號郵寄至民眾之車籍地，民眾約於1星期內可收到罰單。","u":"臺北市停車管理工程處","h":57384,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DA8C558644034B6A","d":"2009-06-24","sid":"DA8C5586"},{"q":"於公有停車場內未劃設停車位處停車，是否可以違規停車告發？","a":"一、本市於停車場入口處均設有停車須知告示牌告知，車輛駕駛人車輛請依指示方向行駛，並依標誌、標線、停車位佈設方式停妥車輛。\n二、於本市公有停車場內未劃設停車位處停車者：","u":"臺北市停車管理工程處","h":51071,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9BCCB87E07C25493","d":"2011-08-08","sid":"9BCCB87E"},{"q":"臺北市路邊停車費是否可於超商補查詢列印、繳費？","a":"一、本市於100年9月30日起提供路邊停車繳費通知單（包含催繳單、追繳單），於「繳費期限內」可至委託代收之超商多媒體機(包含統一超商ibon、全家便利商店FamiPort、萊爾富Life-ET及OK超商OK．go)查詢、補列印繳費，不加收額外費用，為重要之便民措施。\n二、本市目前亦提供以下停車繳費單補單服務，民眾可善加利用。\n（一） 可於本市轄管各公有立體停車場查詢、補單並繳費。\n（二） 若有停車單遺失或查詢，於「繳費期限內」可聯結本處本處停車查詢一站式服務網（網址：https://parkingfee.pma.gov.taipei/）列印繳費條碼後至各地超商繳納。","u":"臺北市停車管理工程處","h":47488,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=35E61766E628767E","d":"2008-10-28","sid":"35E61766"},{"q":"停黃線不到3分鐘，為何收到違規罰單?","a":"一、依據道路交通管理處罰條例第3條第10項規定，臨時停車：係指車輛因上、下人、客、裝卸物品，其停止時間未滿3分鐘，保持立即行駛之狀態。\n二、另依交通部109年11月23日交路字第1090014922號函釋，駕駛人係因上、下人、客及裝卸物品暫時離座，可隨時立即返回車輛行駛，且車輛停放道路未超過3分鐘，應可歸屬於臨時停車之範疇。\n三、故臨時停車應同時符合前述要件，始屬於臨時停車，如車輛停車駕駛人已離開現場，車輛未能保持立即行駛狀態，已不符臨時停車之規範。","u":"臺北市停車管理工程處","h":46132,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=708EE049FA261481","d":"2009-06-28","sid":"708EE049"},{"q":"週日及國定假日路邊停車場收費路段有哪些？","a":"為維持本市觀光景點及商圈周邊停車秩序本市路邊停車格位配合各商圈營運時間仍實施收費，收費路段詳附表。","u":"臺北市停車管理工程處","h":42411,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C85C93DF12C467C5","d":"2020-03-26","sid":"C85C93DF"},{"q":"道路交通管理處罰條例第56條規定係處罰汽車，而機車是否適用該規定處罰。","a":"依道路交通管理處罰條例第3條第1項第8款規定：「車輛：指非依軌道電力架設，而以原動機行駛之汽車（包括機車）、慢車及其他行駛於道路之動力車輛。」及道路交通安全規則第2條第1項第1款規定：「汽車：指在道路上不依軌道或電力架線而以原動機行駛之車輛（包括機車）。」，故機車係屬汽車範疇，機車倘有違規停車行為，仍須依道路交通管理處罰條例第56條規定告發。","u":"臺北市停車管理工程處","h":39568,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88888A8D8A707FE8","d":"2011-08-08","sid":"88888A8D"},{"q":"臨時停車卸貨的法令規定與罰責，何種情況屬違規 ?","a":"查依「道路交通管理處罰條例」第3條規定：「臨時停車：指車輛因上、下人、客，裝卸物品，其引擎未熄火，停止時間未滿三分鐘，保持立即行駛之狀態。」，臨時停車不依相關規定者，執法單位可依同條例55條規定舉發。\n本市設有「貨車裝卸專用區」提供貨車及客貨兩用車卸貨使用（依行照登載為準），該專用區每次限停20分鐘並得延長1次，其餘規定依現地相關標線、標誌牌面內容規定。","u":"臺北市停車管理工程處","h":39187,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7BB3844795F0CC34","d":"2008-10-08","sid":"7BB38447"},{"q":"機車停放在合法車位，因為被他人移動後遭取締違規停車應如何申訴？","a":"一、請先確認舉發單位向相關單位申訴：\n車輛違規事實進行採證及舉發，如確實有車輛遭移置之情形，建議可先檢視標示聯係由何單位（警察局或停管處）填單，可直接向該單位申訴，或在收到舉發違規通知單（紅單）後再向應到案處所之裁決機關申訴亦可。若為本處舉發案件，可透過本市陳情系統直接點擊後登錄辦理（案件分類：交通運輸 - 停車管理及收費問題或停車場占用專用格位）。\n二、提供遭移置資料：\n（一）請詳述舉發資料 ( 如舉發單位、車號、單號、違規日期、違規地點 …) 。\n（二）請詳述遭移置情形及佐證資料 ( 如停車當時照片、遭他人移置影片 …) 。\n依據民事訴訟法第 277 條規定，當事人主張有利於己之事實，就其事實有舉證之責任，如有調閱錄影監視影像需求，請自行向監視錄影器設置單位（如警察局、區公所等）申請調閱。\n三、 本市停車格位供不應求，建議使用路邊格位時，可自行拍照紀錄車輛合法停車狀態，以維護自身權益 。","u":"臺北市停車管理工程處","h":36100,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=9886696CCF8B5714","d":"2008-07-01","sid":"9886696C"}]},{"org":"勞動檢查處","total":205,"items":[{"q":"生理假如何計薪？可否扣全勤獎金？","a":"依性別工作平等法第14條第1項之規定，女性受僱者因生理日致工作有困難者，每月得請生理假一日，全年請假日數未逾三日，不併入病假計算，其餘日數併入病假計算。 依性別工作平等法第14條第2項之規定，前項併入及不併入病假之生理假薪資，減半發給。 依性別工作平等法第21條第2項之規定，受僱者為生理假請求時，雇主不得視為缺勤而影響其全勤獎金、考績或為其他不利之處分。","u":"臺北市勞動檢查處","h":255894,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=419152782D666630","d":"2016-01-21","sid":"41915278"},{"q":"時薪人員之特休假該如何計算？","a":"時薪人員的特休規定與月薪制員工相同，惟時薪人員如上班時數比一般全時勞工之上班時數有相當程度之縮短，雇主可以依據《僱用部分時間工作勞工應行注意事項》以實際上班時數(不含加班)來「按比例」計算可休特休時數。\n舉例來說：一時薪人員其年資滿1年，1年間排班1044小時(不含加班)，因全時勞工全年正常工作時間為52週*40小時+8小時=2088小時，故該勞工應享有之特休時數有28小時。(1044/2088*7(天)*8(小時)=28小時)","u":"臺北市勞動檢查處","h":161975,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2A88CCB74E48F560","d":"2017-06-09","sid":"2A88CCB7"},{"q":"何謂危險性工作場所審查暨檢查辦法中之丁類危險性工作場所","a":"依危險性工作場所審查暨檢查辦法第二條第四款規定，丁類危險性工作場所，係指下列之營造工程： （一）建築物高度在八十公尺以上之建築工程。 （二）單跨橋梁之橋墩跨距在七十五公尺以上或多跨橋梁之橋墩跨距在五十公尺以上之橋梁工程。 （三）採用壓氣施工作業之工程。 （四）長度一千公尺以上或需開挖十五公尺以上豎坑之隧道工程。 （五）開挖深度達十八公尺以上，且開挖面積達五百平方公尺之工程。 （六）工程中模板支撐高度七公尺以上、面積達三百三十平方公尺以上者。","u":"臺北市勞動檢查處","h":147757,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=66E80EDADA4DB193","d":"2010-04-14","sid":"66E80EDA"},{"q":"勞工教育訓練之規範為何","a":"一、教育訓練的實施 （一）新僱勞工或在職勞工於變更工作前，應使其接受適於各該工作必要之一般安全衛生教育訓練(在職勞工工作環境、工作性質與變更前相當者，不在此限)。新僱勞工或在職勞工於變更工作前須接受3小時的一般安全衛生教育訓練（含行政人員）。從事生產性機械或設備、車輛系營建機械、高空工作車、捲揚機等之操作及營造作業、缺氧作業、電銲作業等應各增列3小時；對製造、處置或使用危害險性化學品者應增列3小時。 （二）各級業務主管於新僱或變更工作前，除受一般3小時外，另增列6小時教育訓練。 （三）上述人員每3年至少應再受3小時在職教育訓練。 小規模的公司可由受過「丙種安全衛生業務主管」的人擔任講師。課程不一定要一次上完，可分批逐次。 二、教育訓練紀錄 教育訓練實施後，須將相關紀錄保存數年留供備查，紀錄須包含講師姓名、資格、課程表（幾點到幾點上什麼課）、簽到簿、相關照片等。 三、課程內容：參考「職業安全衛生教育訓練規則附表14」： （一）一般安全衛生教育訓練課程（以與該勞工作業有關者）： １、作業安全衛生有關法規概要 ２、職業安全衛生概念及安全衛生工作守則 ３、作業前、中、後之自動檢查 ４、標準作業程序 ５、緊急事故應變處理 ６、消防及急救常識暨演練 ７、其他與勞工作業有關之安全衛生知識 （二）各級業務主管人員於新僱或在職於變更工作前，應參照下列課程增列6小時： １、安全衛生管理與執行 ２、自動檢查 ３、改善工作方法 ４、安全作業標準","u":"臺北市勞動檢查處","h":140391,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B8AF282AD4EBB188","d":"2009-02-24","sid":"B8AF282A"},{"q":"安全衛生工作守則報備流程為何？","a":"安全衛生工作守則報備採網路線上申辦，報備流程如下：\n1.事業單位(雇主)會同勞工代表訂定適合需要之安全衛生工作守則，並請勞工代表簽名。\n2.將安全衛生工作守則及徵詢勞工代表同意書(會同訂定勞工代表簽名冊)經掃描製成電子檔，至臺北市政府-台北服務通網站/安全衛生工作守則報備項下( https://service.taipei/case-detail/DZ003 )上傳申辦，注意事項如下：\n(1) 線上填寫申請表須依規定敘明事業單位基本資料及聯絡電話等，另上傳之工作守則報備文件內容應敘明營業項目或從事工作(如營造業、園藝業…)，並加蓋事業單位及負責人印章。\n(2) 安全衛生工作守則應註明適用範圍：事業單位所有工作場所或指定之工作場所；以營造業為例，如僅適用單一工地時，請註明適用之工程名稱、建號及工程地址，如為特定之作業，請註明適用臺北市轄內所有○○工程(如建築、水電…)。\n(3) 安全衛生工作守則徵詢勞工代表同意書應有勞工代表簽名。\n3.同意備查之工作守則，其相關資料將登錄於網站( https://insp.osha.gov.tw/wrinfo/wrinfo.aspx )，不再以公文函復。未符合規定者，將發函通知事業單位修正後，再報本處備查。","u":"臺北市勞動檢查處","h":106835,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2DD93C3BF79DFFAD","d":"2014-10-23","sid":"2DD93C3B"},{"q":"勞工保險證字號不是 9 碼怎麼辦，行業標準分類號碼要去那裡查？","a":"在【勞工保險局保險費繳款單】上，「保險證號」即為 9 碼的勞工保險證字號，「業別」即為行業標準分類號碼。","u":"臺北市勞動檢查處","h":101131,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=743C241E420EC08B","d":"2012-06-11","sid":"743C241E"},{"q":"急救人員之規範為何？","a":"依場所大小、分布、危險狀況及勞工人數而定，每班次至少置有1名急救人員。勞工人數50人以上，每增加50人增一名(例如勞工人數125人，則須置2名急救人員)，並備置足夠急救藥品及器材。急救人員需由受過16小時的「急救人員安全衛生教育訓練」並取得證照者擔任，每3年至少應再接受3小時在職教育訓練.","u":"臺北市勞動檢查處","h":73963,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=781BE6F1D48B4B2B","d":"2009-02-24","sid":"781BE6F1"},{"q":"勞工於國定假日出勤2小時, 其加班費如何計算？","a":"若為月薪制人員，雇主經徵得勞工同意於國定出勤者，出勤時間在8小時以內(含8小時)，皆給付1日工資之加班費。若為時薪制人員，出勤時間在8小時以內(含8小時)，依出勤時數加倍給予薪資。如：時薪200元，出勤2小時則薪資為 2小時*時薪200元*2=800元。","u":"臺北市勞動檢查處","h":64933,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D84228CD065890FC","d":"2017-06-09","sid":"D84228CD"},{"q":"職業安全衛生法第22條規定「事業單位勞工人數在50人以上者，應僱用或特約醫護人員」規定，事業單位如何設置?","a":"職業安全衛生法第22條有關事業單位勞工人數在50人以上者，應僱用或特約醫護人員之規定，其適用日期係由中央主管機關依規模、性質分階段公告。 現行應配置醫護人員辦理勞工健康管理、職業病預防及健康促進等勞工健康保護事項者，係依勞工健康保護規則第3條及第5條規定，為事業單位同一工作場所勞工人數在300人以上者或從事特別危害健康作業之勞工人數在100人以上者，或事業分散各地區勞工總人數達3000人以上者，僱用或特約從事勞工健康服務醫師及僱用從事勞工健服務護理人員辦理臨場健康服務。另依該法第4條規定，事業單位總人數在200人至299人者，自107年7月1日特約醫護人員辦理臨場服務；事業單位總人數在100人至199人者，自109年1月1日特約醫護人員辦理臨場服務；事業單位總人數在50人至99人者，自111年1月1日特約醫護人員辦理臨場服務。","u":"臺北市勞動檢查處","h":57715,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=327E6FA1B5FA4E71","d":"2014-10-23","sid":"327E6FA1"},{"q":"健康檢查之規範為何？","a":"一、健康檢查可分為「一般健康檢查」、「特殊作業健康檢查」二類 （一）一般健康檢查 １、新進員工任職前需實施「一般體格檢查」，在職勞工任職中要做「一般健康檢查」。 ２、一般健康檢查的實施頻率： 65歲以上者，每年檢查一次 40歲以上未滿65歲，3年檢查一次 未滿40歲者，5年檢查一次 上述一般健康檢查紀錄至少保存7年 （二）特殊作業健康檢查 高溫、噪音、游離輻射、異常氣壓、鉛、四烷基鉛、粉塵、有機溶劑、特定化學物質等有特別危害健康之作業，雇主於僱用勞工時實施特殊體格檢查或對於在職勞工從事特別危害健康作業，應定期或於變更作業時每年為該等作業勞工實施「特殊作業健康檢查」，檢查紀錄至少保存10年，但游離輻射、粉塵、……石綿等檢查紀錄至少保存30年。 勞工受特殊健檢、健康追蹤檢查後，雇主應分級實施健康管理並將分級結果及採行措施依中央主管機關公告之方式通報（即於全國勞工健康檢查資料庫登錄平臺登錄通報）。 二、健康檢查費用 （一）新進員工任職前的體格檢查，法上並未規定其費用是由勞方或資方負擔，故由雙方議定之。另健康檢查費用係由雇主負擔，勞工健檢所需時間得請公假。 （二）特殊健康檢查費用由於勞保局有職業病預防經費支付，事業單位申請方式可至勞動部勞工保險局網站查詢(業務專區>勞工保險>常見問答>給付業務>預防職業病健康檢查)。 三、如何實施健康檢查 健康檢查須至勞動部與衛生署共同指定之「健檢醫療機構」實施，欲查詢各縣市具資格的健檢機構，請至勞動部網站首頁(www.mol.gov.tw)，在右邊項目進入「相關連結」、「勞工體格及健康檢查認可醫療機構名單」查詢最新訊息。","u":"臺北市勞動檢查處","h":51205,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5CD8DEFD3FB9FEDF","d":"2009-02-24","sid":"5CD8DEFD"},{"q":"颱風假雇主要求勞工出勤未給付加班費，合法嗎？","a":"目前勞動法令並無颱風假之規定，颱風屬勞動部改制前行政院勞工委員會98 年6 月 19 日修正「天然災害發生事業單位勞工出勤管理及工資給付要點」第2點規定之天然災害。 依「天然災害發生事業單位勞工出勤管理及工資給付要點」第6點之規定，颱風等天然災害發生時，勞工未依規定出勤，雇主不得視為曠工、遲到或強迫勞工以事假或其他假別處理，且不得強迫勞工補行工作、扣發全勤獎金、解僱或為其他不利之處分。 依「天然災害發生事業單位勞工出勤管理及工資給付要點」第7點之規定，勞工因前點所定之情形無法出勤工作，雇主宜不扣發工資。但應雇主之要求而出勤，雇主除當日工資照給外，宜加給勞工工資，並提供交通工具、交通津貼或其他必要之協助。 參照上述「天然災害發生事業單位勞工出勤管理及工資給付要點」之規定，雇主要求勞工於颱風期間出勤應否加發工資，宜由勞資雙方約定。","u":"臺北市勞動檢查處","h":50712,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2555A47E2CA8FD97","d":"2016-01-20","sid":"2555A47E"},{"q":"如何向勞檢處提出檢舉？","a":"可透過網路、書面、親洽本處或電話(02-23086101)洽詢均可。倘若以傳真檢舉，請先電話洽詢特定人員接收，以避免洩密之虞。","u":"臺北市勞動檢查處","h":46741,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0B2827ED5C2F259E","d":"2013-03-06","sid":"0B2827ED"},{"q":"「暫時全失能」之傷害損失日數要如何填寫?","a":"「暫時全失能」定義：暫時全失能係指罹災人未死亡，亦未永久失能。但不能繼續其正常工作，必須休班離開工作場所，損失時間在一日以上(包括星期日、休假日或事業單位停工日)，暫時不能恢復工作者。 「暫時全失能」之傷害損失日數：應按受傷後所經過之損失總日數登記，不包括受傷當日及恢復工作當日。 但應包括經過之星期日，休假日或事業單位停工日，及復工後，由該次傷害所引起之其他全日不能工作之日數。 因填報當時未結案可依醫師意見填寫預估數字，最高以其該傷害引起之失能傷害種類中最高日數計。 註1：事業單位可修正前八個月之資料，惟每年三月底，將截止前一年度資料之修正。 註2：損失時間在一日以上暫時不能恢復工作者才需填寫 註3：不包括受傷當日及恢復工作當日 註4：應包括經過之星期日，休假日或事業單位停工日，及復工後，由該次傷害所引起之其他全日不能工作之日數","u":"臺北市勞動檢查處","h":38927,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1BC0151C5ABE55CF","d":"2012-06-11","sid":"1BC0151C"},{"q":"安全衛生工作守則訂定內容為何？","a":"安全衛生工作守則得依事業單位之實際需要，訂定適用於全部或一部分事業，且得依工作性質、規模分別訂定。依據職業安全衛生法施行細則第41條規定：「本法第34條第1項所定安全衛生工作守則之內容，參酌下列事項定之： 一、事業之安全衛生管理及各級之權責。 二、機械、設備或器具之維護及檢查。 三、工作安全及衛生標準。 四、教育及訓練。 五、健康指導及管理措施。 六、急救及搶救。 七、防護設備之準備、維持及使用。 八、事故通報及報告。 九、其他有關安全衛生事項。」，即工作守則的基本內容應包含這9項。 事業單位之安全衛生工作守則，係事業單位依其作業性質及需要，考量其相關設施、作業，自行審慎訂定及負責；當設施、作業等如有新增、變更時應重新申報；涉及違反職業安全衛生工作原理、原則、法令規定及將雇主責任藉安全衛生工作守則之訂定轉嫁勞工者，應由函報之事業單位修正。","u":"臺北市勞動檢查處","h":38089,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F4ADE83B5E79DA23","d":"2014-10-23","sid":"F4ADE83B"},{"q":"公司是否可規定加班一律補休？","a":"雇主如使勞工加班應依規定發給加班費，勞動基準法第24條已有明訂；至於勞工加班後自願放棄領取加班費而選擇補休，該法並未禁止，惟公司如片面規定加班一律補休，則屬違法規定。 勞雇雙方不得事前約定（勞動契約、工作規則、內部規範）加班一律補休，建議加班申請單應設計為「請領加班費」或「擇期補休」二種勾選方式，以便勞工自行選擇。","u":"臺北市勞動檢查處","h":37232,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=714DC7FF0A21C4ED","d":"2016-01-21","sid":"714DC7FF"},{"q":"事業單位僱用勞工多少人以上才需要制定安全衛生工作守則？","a":"依據職業安全衛生法第34條規定，雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。並無僱用勞工人數的限制。故只要是適用職業安全衛生法的行業(如：製造業、營造業…) ，且僱用勞工，無論其規模大小或所僱用之勞工人數，皆須依上開規定辦理。","u":"臺北市勞動檢查處","h":35967,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DB1AF5DED45FC51F","d":"2014-10-23","sid":"DB1AF5DE"},{"q":"填報職災月報表申報規定為何？","a":"依據職業安全衛生法第38條規定，中央主管機關指定之事業，雇主應按月依規定填載職業災害統計，報請檢查機構備查。 各事業單位填報職災月報表承辦人每月10日前申報上月份職災月報（遇例假日延後）。由「勞動部職業安全衛生署工作者安全衛生履歷智能雲」申報。網址： https://isafe.osha.gov.tw/ 。 未依規定填報，經通知限期改善而不如期改善者，依第45條規定，可處新台幣3萬元以上75萬元以下罰鍰。 本系統僅作職業災害統計之用，事業單位若發生符合職業安全衛生法第37條第2項規定之職業災害時，雇主仍應於8小時內通報勞動檢查機構。","u":"臺北市勞動檢查處","h":35897,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CBCF053E6E42A82B","d":"2016-01-14","sid":"CBCF053E"},{"q":"颱風天出勤,工時超過8小時的部分應如何計算加班費？","a":"與平日工作日相同，雇主延長勞工工作時間在2小時以內者，按平日每小時工資額加給三分之一。再延長工作時間在2小時以內者，按平日每小時工資額加給三分之二以上。","u":"臺北市勞動檢查處","h":35866,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EF520BE294AA87E2","d":"2017-06-09","sid":"EF520BE2"},{"q":"育嬰留職停薪可否只申請3個月？","a":"自115年1月1日起，受僱者於每一子女滿3歲前，可申請最長2年的育嬰留職停薪。(性別平等工作法第16條第1項、育嬰留職停薪實施辦法第9條第2項之規定) 在2年的育嬰留職停薪期間內，新增「以日申請」的彈性措施，讓受僱者可依實際照顧需求，改以單日方式請假。個人最多可申請30日，雙親合計最多60日。每次申請以1日為單位，最多可申請30次。(育嬰留職停薪實施辦法第2條第3項之規定） 育嬰留職停薪期間30日以上者，申請期限原則上須於10日前提出；未滿30者，申請期限原則上須於5日前提出，若遇突發狀況，得於前1日提出申請，如當日發生突發情形，亦可委託他人代為辦理。(育嬰留職停薪實施辦法第2條第4項及育嬰留職停薪實施辦法第2條第5項之規定)","u":"臺北市勞動檢查處","h":32684,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2CE34A1C20B4CC7B","d":"2021-07-01","sid":"2CE34A1C"},{"q":"勞工病假天數較長，遇國定假日及例假日，應否計入病假假期內，工資應如何發給？","a":"依勞工請假規則第4條第3項之規定，普通傷病假一年內未超過三十日部分，工資折半發給。 另依內政部74年6月12日臺內勞字第323858號函釋規定，勞工普通傷病假期間，除延長假期在一個月以上者外，如遇例假、紀念日、勞動節日及其他經中央主管機關規定應放假之日，應不計入病假請假期內。 依上述主管機關函釋規定，病假延長假期未達一個月以上者，遇例假、紀念日、勞動節日及其他經中央主管機關規定應放假之日(俗稱「國定假日」)，均不計入病假請假期內，工資自應按勞動基準法第39條規定，由雇主照給。","u":"臺北市勞動檢查處","h":31022,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=21BCC7E078D4270A","d":"2016-01-20","sid":"21BCC7E0"},{"q":"安全衛生工作守則徵詢勞工代表同意書之格式？","a":"安全衛生工作守則應依據職業安全衛生法第34條及職業安全衛生法施行細則第41條、43條之規定會同勞工代表訂定，並經勞動檢查機構備查後公告實施，供所有員工切實遵守。徵詢勞工代表同意書之格式如附件。","u":"臺北市勞動檢查處","h":30036,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E3A6762D29DBBA97","d":"2014-10-23","sid":"E3A6762D"},{"q":"安全衛生工作守則報備之法令規定、罰則為何？","a":"依職業安全衛生法第34條第1項規定：「雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。」，若雇主未依上開規定訂定安全衛生工作守則，經通知限期改善，屆期未改善，將依同法第45條規定，處新臺幣3萬元以上75萬元以下罰鍰。","u":"臺北市勞動檢查處","h":26919,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2759CC683264B3AA","d":"2014-10-23","sid":"2759CC68"},{"q":"何謂合格的合梯？","a":"室內裝修施工人員經常使用合梯從事高架工作，依職業安全衛生設施規則第230 條對於合梯有以下規定： 一、具有堅固之構造。 二、其材質不得有顯著之損傷、腐蝕等。 三、梯腳與地面之角度應在75度以內，且兩梯腳間有金屬等硬質繫材扣牢，腳部有防滑絕緣腳座套。 四、有安全之防滑梯面。 雇主不得使勞工以合梯當作二工作面之上下設備使用，並應禁止勞工站立於頂板作業。 上述所提及之合梯高度須低於2 公尺；於高度2公尺以上從事高架工作，必須搭設施工架。","u":"臺北市勞動檢查處","h":24617,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DE717816C583BEE0","d":"2016-01-18","sid":"DE717816"},{"q":"我們公司勞工人數才17人，需要上網申報職業災害統計嗎?有相關法規可以查詢嗎?","a":"依據職業安全衛生法第三十八條及施行細則第五十一條之規定:勞工人數在三十人以上之事業:或雇用勞工人數未滿三十人之事業，經中央主管機關指定並由勞動檢查機構函知者，應依規定填載職業災害內容及統計，按月報請勞動檢查機構備查，並公布於工作場所。","u":"臺北市勞動檢查處","h":23185,"t":"勞工權益","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D123A82917C6983C","d":"2012-06-11","sid":"D123A829"},{"q":"新適用職業安全衛生法之行業，如何報備工作守則?","a":"依職業安全衛生法第34條規定，雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經公司登記所在地之勞動檢查機構備查後，公告實施；又該法施行細則第41條規定，本法第34條第1項所定安全衛生工作守則之內容，依下列事項定之：一、事業之安全衛生管理及各級之權責。二、機械、設備或器具之維護及檢查。三、工作安全及衛生標準。四、教育及訓練。五、健康指導及管理措施。六、急救及搶救。七、防護設備之準備、維持及使用。八、事故通報及報告。九、其他有關安全衛生事項。 重複違反者雇主將處3萬元至15萬元罰鍰。(職業安全衛生法第45條第1款)。 事業單位如欲報備，可向公司登記所在地之勞動檢查機構報備，如登記所在地在臺北市，安全衛生工作守則報備採網路線上申辦，請將安全衛生工作守則及徵詢勞工代表同意書(會同訂定勞工代表簽名冊)經掃描製成電子檔，至臺北市政府-台北服務通網站/安全衛生工作守則報備項下( https://service.taipei/case-detail/DZ003 )上傳申辦。 如該安全衛生工作守則前已依規定，報經勞動檢查機構備查，則無須再重新報備，惟雇主仍應配合職業安全衛生法及其相關附屬法規之修正，重新檢視該工作守則所定相關事項，並作必要之調整及修正。 事業單位如須查詢安全衛生工作守則報備情形，請自「安全衛生工作守則備查資料登錄訊息」( https://insp.osha.gov.tw/wrinfo/wrinfo.aspx )，點選檢查機構名稱，輸入事業單位全銜查詢。","u":"臺北市勞動檢查處","h":22889,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=61667D302BA252FA","d":"2014-10-23","sid":"61667D30"}]},{"org":"民政局","total":170,"items":[{"q":"如何辦理戶籍遷出入？","a":"直接向遷入地戶政事務所申請遷入登記。如無居住事實而故意為不實之申請者，將處新臺幣9000元以下罰鍰。 一、申請人 1.本人或戶長。 2.未成年人遷徙，父母或遷出、遷入地雙方戶長共同為之。 3.全戶之遷徙登記，以戶長為申請人。 4.受委託人。 二、應備文件 1.遷出地與遷入地戶口名簿正本、遷入者國民身分證正本及印章（或簽名）。 2.遷入者應換領國民身分證（請繳交最近2年內拍攝之符合國民身分證規格相片1張或數位相片，相片規格詳見內政部戶政司全球資訊網 https://www.ris.gov.tw/app/portal/187 ）。繳交數位相片者請至內政部戶政司全球資訊網→網路申辦服務→國民身分證→國民身分證影像上傳上傳數位相片。 3.委託他人申請者，應附委託書、受委託人國民身分證、印章（或簽章）。 4.父或母單獨為未成年子女申辦，須提具另一方同意書。 5.如係另立一戶，應另提憑如下之單獨立戶之證明文件： （1）遷入本人、配偶、直系血親、直系姻親所有房屋或無償借住他人房屋者，憑房屋所有權狀或最近 一期之房屋「完稅」稅單或最近6個月內之買賣契約書或其他足資證明所有權之證明文件辦理。 （2）遷入本人、配偶、直系血親、直系姻親所租賃之房屋者，除提憑經法院或民間公證人公證之租賃契約書外，如提憑未經法院或民間公證人公證之租賃契約書者，應同時檢附出租人之房屋所有權狀或最近一期房屋「完稅」稅單或最近6個月內買賣契約書或其他足資證明所有權之證明文件辦理。如個案情形特殊，租賃契約書仍應繳驗正本外，出租人所有權之證明文件得以經房屋所有權人註記與正本相符並簽章之影本代替。 （3）遷入工廠、商店、寺廟、機關、學校、其他公共處所者，憑戶長或主持人或管理人之同意書辦理。 （4）提憑用戶名為遷徙者本人、配偶、直系血親、直系姻親所繳納最近6個月內之水電費或瓦斯費收據辦理。 （5）有居住之事實而無法提出上列證明文件者，得經警勤區員警或戶政事務所人員查實後辦理。 6.換證規費每張50元，遷徙登記須同時初(換)領戶口名簿，規費每份30元。 備註:\n另若僅未具有遷出地戶口名簿者，其他文件皆具備，可先行至遷入地戶政事","u":"臺北市政府民政局戶籍行政科","h":1373821,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1F67300FE16160E5","d":"2016-05-02","sid":"1F67300F"},{"q":"同址分戶，有分幾戶的上限嗎？如何辦理呢？","a":"遷徙係事實行為，遷徙登記應依事實認定。故同址分戶雖未規定上限，但前提是要有在該址實際居住。\n民眾請準備下列證件至現戶籍地戶政事務所辦理：\n一、戶口名簿。\n二、國民身分證（所有需另立戶者）。\n三、申請人印章或簽名。\n四、證件:\n(一)原戶籍地如為本人、配偶、直系血親、直系姻親所有房屋或無償借住他人房屋者，憑房屋所有權狀或最近一期之房屋「完稅」稅單或最近6個月內之買賣契約書或其他足資證明所有權之證明文件辦理。\n(二)原戶籍地如為本人、配偶、直系血親、直系姻親所租賃之房屋者，除提憑經法院或民間公證人公證之租賃契約書外，如提憑未經法院或民間公證人公證之租賃契約書者，應同時檢附出租人之房屋所有權狀或最近一期房屋「完稅」稅單或最近6個月內買賣契約書或其他足資證明所有權之證明文件辦理。如個案情形特殊，租賃契約書仍應繳驗正本外，出租人所有權之證明文件得以經房屋所有權人註記與正本相符並簽章之影本代替。\n(三)原戶籍地如為工廠、商店、寺廟、機關、學校、其他公共處所者，憑戶長或主持人或管理人之同意書辦理。\n(四)提憑本人、配偶、直系血親、直系姻親所繳納最近6個月內之水電費或瓦斯費收據辦理。\n(五)有居住之事實而無法提出上列證明文件者，得經警勤區員警或戶政事務所人員查實後辦理住址變更單獨立戶。\n五、未成年人同址分戶，需父母共同辦理，如由父或母單方申請，應附繳他方之同意書。\n六、委託書( 請另附受託人身分證，戶長辦理須附戶長身分證)。\n七、同址分戶須同時初(換)領戶口名簿，規費每份30元。\n★ 另本府為落實戶籍登記，避免民眾虛偽遷徙，訂定1址8公民戶籍清查計畫。","u":"臺北市政府民政局戶籍行政科","h":442406,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6B7F801058528220","d":"2016-05-02","sid":"6B7F8010"},{"q":"死亡登記(除戶)應如何辦理？當事人國民身分證、戶口名簿均已遺失可否辦理死亡登記？","a":"申請人\n1. 死亡登記：配偶、親屬、戶長、同居人、經理殮葬之人、死亡者死亡時之房屋或土地管理人。\n2. 死亡宣告登記：聲請死亡宣告者或利害關係人。\n3. 受委託人。\n應備證件\n1. 檢察機關、軍事檢察機關、醫療機構出具之相驗屍體證明書、死亡證明書或法院為死亡宣告之裁定書及確定證明書正本。\n2. 申請人之國民身分證、印章（或簽名）。\n3. 死亡者之國民身分證、戶口名簿，死亡者有配偶者，另檢附配偶國民身分證及最近2年所攝正面符合規定之彩色照片1張或數位相片及規費50元辦理換證，得免繳交相片或數位相片之情形，請參照國民身分證及戶口名簿製發相片影像檔建置管理辦法第18條規定（相片規格詳見http://www.ris.gov.tw/ app/portal/ 187，繳交數位相片者請至內政部戶政司全球資訊網-網路申辦-國民身分證影像上傳https://www.ris.gov.tw/app/portal/765上傳數位相片）。配偶如委託他人換證，須附委託書。\n4. 委託他人代辦者，另附委託書及受委託人國民身分證、簽名（或印章）。若人在國外委託須附授權書，並經我國駐外使領館、代表處或其他外交部授權機構驗證；如果是在大陸地區作成授權書，則須由行政院設立或指定之機構或委託之民間團體（海基會）驗證。\n5. 國外死亡者，憑其死亡地之醫院出具死亡證明，文件係在國外作成者，應經駐外館處驗證；其在國內由外國駐我國使領館或授權機構製作者，應經外交部驗證。前項文件為外文者，應檢附經駐外館處驗證或國內公證人認證之中文譯本。\n6. 遭遇特別災難未尋獲屍體，尚不足確定其確已死亡，仍應先為失蹤人口之註記，俟利害關係人或檢察官向法院聲請為死亡宣告後，再辦理死亡宣告登記。\n7. 大陸地區死亡之證明文件須經海基會驗證。\n8. 死亡宣告登記免經催告程序，由戶政事務所逕行為之。\n注意事項\n申請期限：自死亡發生日起30日內。\n受理戶政事務所\n自104年7月1日起，得向全國任一戶政事務所辦理。\n如果當事人戶口名簿及身分證都遺失了，還是可以辦理死亡登記，請在辦理時告知受理人員即可。","u":"臺北市政府民政局戶籍行政科","h":367913,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=FF5B0DD6B40A2435","d":"2007-12-05","sid":"FF5B0DD6"},{"q":"【助您好孕】臺北市生育獎勵金及育兒津貼單一窗口Q&A","a":"Q1：請問助您好孕單一窗口的服務內容是什麼？\nA：為了讓市民新生兒申報出生登記時，可以直接在本市戶政事務所同一窗口申請生育獎勵金及育兒津貼，所以從101年4月起，戶政事務所可以在新生兒申報出生登記時，同時申請生育獎勵金及育兒津貼，再由戶政事務所將育兒津貼申請書轉給區公所進行審查並核發育兒津貼。因為育兒津貼是申請制，所以單一窗口受理後，就可以避免新生兒父母忘了申請育兒津貼造成遲延無法追溯的損失。\nQ2：為什麼生育獎勵金需要媽媽的帳戶，而育兒津貼也可以使用爸爸的？為什麼生育獎勵金不限銀行，而育兒津貼ㄧ定要郵局或台北富邦銀行呢？ A：市府生育獎勵金的設計是要感謝媽媽生產的辛勞，所以經費希望能匯入媽媽的帳戶，而育兒津貼規定育兒津貼需按月撥入郵局或台北富邦銀行，因此只能使用這二家金融機關的帳戶，尚請見諒。\nQ3：請問生育獎勵金跟育兒津貼的錢什麼時候會進帳戶？ A：生育獎勵金會在10日內(不包括連續假日)匯入帳戶，而育兒津貼因為還要去財政部等相關資料庫比對，所以審查時間約30日，可電洽兒童戶籍地區公所社會課育兒津貼承辦人查詢辦理進度。\nQ5：我不知道有單一窗口服務，我可以現場填育兒津貼申請書申請嗎? A：因為育兒津貼申請書需要父母雙方簽名，所以您可以先填申請書由戶政事務所轉交區公所，區公所會再跟您聯絡補另ㄧ方簽名的事情，或者您也可以拿申請書回家，填好之後直接寄給區公所申請，不過因為會從申請日開始核發育兒津貼，不能回溯，所以建議您要儘快提出申請。\nQ6：我朋友沒有新生兒，但有二個未滿5歲的小朋友，可以到戶政所申請育兒津貼嗎? A：戶政事務所的單一窗口是因為辦理出生登記時ㄧ併辦理生育獎勵金跟育兒津貼，所以您的朋友只申請育兒津貼，可以直接郵寄至區公所社會課申請，如果要到現場，可以直接到區公所社會課櫃檯申請比較快，不用再透過戶政事務所轉交。\nQ7：出生登記、生育獎勵金與育兒津貼攜帶證件小叮嚀 A：民國101年4月起，生育獎勵金及育兒津貼可在戶政事務所單一窗口辦理，提醒您出門前檢查一下證件是否有帶齊。 (一)申請出生登記\n(二)申請生育獎勵金\n(三)申請每月育兒津貼","u":"臺北市政府民政局人口政策科","h":237137,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=7CFAB551F7DA3852","d":"2012-04-02","sid":"7CFAB551"},{"q":"外國人如果結婚來臺灣或在臺灣長期工作，想要辦理中華民國身分證，要準備哪些文件才能辦理？","a":"外國人如果想要辦理中華民國身分證，一定要合法居留連續3年或5年，每年居住183日以上。\n其申辦流程為：\n一、先依國籍法規定向國內住所地戶政事務所申請歸化中華民國國籍，須備妥下列資料：\n(一)有效之外僑居留證或外僑永久居留證。\n(二)原屬國政府核發之警察紀錄證明或其他相關證明文件（申請歸化國籍者，係我國國民之配偶，外僑居留證居留事由為「依親」者，免附）；（申請人曾為我國人配偶，其婚姻關係消滅後無出境紀錄者，免附）。\n(三)相當之財產或專業技能，足以自立，或生活保障無虞之證明（為中華民國國民配偶身分或已取得外僑永久居留證者，免附）。\n(四)歸化取得我國國籍者基本語言能力及國民權利義務基本常識認定標準第3條所定之證明文件。\n(五)相片1張（符合新式國民身分證相片規格）。\n(六) 證書費規費新臺幣1200元（以郵政匯票繳交，受款人：內政部）；亦可使用電腦透過網際網路進入財金公司「e-Bill全國繳費網」或在具有「行動金融卡」之行動裝置下載「e-Bill全國繳費網APP」完成繳費。\n二、經許可歸化取得中華民國國籍證明後，再向內政部移民署申請「臺灣地區居留證」，且於內政部許可歸化之日起，1年內提出喪失原有國籍證明，屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n三、居留滿一定期間後(已提出喪失原有國籍證明)，續向內政部移民署申請「臺灣地區定居證」，俟取得定居證後即可向設籍地戶政事務所申請初設戶籍登記及初領國民身分證。\n◎如欲了解申辦歸化國籍應繳證件，可連結 內政部戶政司全球資訊網 參閱，首頁-法規與申辦須知-國籍申辦須知-國籍變更申請書暨提憑證件一覽表。","u":"臺北市政府民政局人口政策科","h":220430,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E82E94AA74D116C6","d":"2023-09-04","sid":"E82E94AA"},{"q":"如何申請身分證？","a":"申請人應備證件(證明文件須繳驗正本) ：\n一、初領：\n(一)申請人：\n1. 年滿14歲者，應由本人親自為之。\n2. 未滿14歲請領者，應由法定代理人親自或由法定代理人書面委託當事人直系血親尊親屬代為請領，當事人應親自到場核對人貌。\n(二)受理之戶政事務所及應備證件：\n1.得向任一戶政事務所申請(自民國103年7月1日實施)。初設戶籍登記同時申領國民身分證者，向戶籍地之戶政事務所申請。\n2.應備齊文件如下：戶口名簿或貼有相片之身分證明文件正本(例如：健保卡、護照、10年內畢業證書、學生證、技術執照等)、當事人或法定代理人印章(或簽名)、法定代理人身分證、最近2年內所攝正面彩色相片1張或數位相片。\n二、換領：\n(一)申請人：本人或委託人，因更換相片而換領國民身分證者，應由本人親自辦理。\n(二)受理之戶政事務所及應備證件：\n1.得向任一戶政事務所申請。\n2.申請戶籍登記致國民身分證記載事項變更者，應向各該申請登記之戶政事務所申請。\n3.應提憑證件：\n(1)本人之舊證。\n(2)最近2年所攝正面彩色相片1張或數位相片。但有下列情況得免繳交相片或數位相片:\n① 本人親自申請換領或戶長親自委託戶內人口辦理全戶或部分戶內人口遷徙登記時，須同時換領身分證者。\n② 因戶政人員作業錯誤致當事人須換領國民身分證。\n③ 因行政區域調整、門牌整編或縣（市）改制，申請換領國民身分證。\n④ 申請人之相片掃描建檔取像日期在2年內，並經戶政事務所核對人貌相符者。\n⑤ 配偶死亡委託他人換領國民身分證。\n⑥ 因配偶、父母或養父母改姓、名或姓名，致當事人須換領國民身分證。\n★ 註：如原有身分證嚴重毀損、相片無法辨識或照片模糊，則以比照補領方式辦理。\n(3)委託他人辦理者，並應檢具委託書、受託人之國民身分證。\n三、補領：\n(一)申請人：\n1. 年滿14歲者，應由本人親自為之。\n2. 未滿14歲請領者，應由法定代理人親自或由法定代理人書面委託當事人直系血親尊親屬代為請領，當事人應親自到場核對人貌。\n(二)受理戶政事務所及應備證件：\n1.得向任一戶政事務所申請(自民國103年7月1日實施)。\n2.應備證件為戶口名簿或","u":"臺北市政府民政局戶籍行政科","h":196482,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0E54809A9FAAB729","d":"2008-09-25","sid":"0E54809A"},{"q":"申請中文（含除戶謄本、日據謄本）戶籍謄本，應備何文件申請？","a":"一、申請人\n1.本人\n2.利害關係人\n3.受委託人\n二、應備證件\n1.當事人、利害關係人親自申請者，應繳驗身分證明文件正本；利害關係人應併繳驗利害關係證明文件正本。\n2.委託申請者，受委託人應繳驗身分證明文件正本及委託人出具之委託書；委託人為利害關係人者，應併繳驗利害關係證明文件正本。委託書在國外作成者應經我駐外館處驗證。在大陸地區作成者須經財團法人海峽交流基金會驗證。\n3.前項所稱身分證明文件，指國民身分證、外僑居留證、外僑永久居留證、臺灣地區居留證、臺灣地區定居證、中華民國護照或其他足資證明身分之文件。\n三、受理機關：全國任一戶政事務所。\n四、規費： 每張戶籍謄本15元。\n五、申請戶籍謄本時，戶政資訊系統會自動列出申請書，民眾無需填具申請書，爰無法提供該申請書電子檔。","u":"臺北市政府民政局戶籍行政科","h":175215,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B6747EC856B728C","d":"2016-05-02","sid":"5B6747EC"},{"q":"如何與外籍人士辦理結婚登記？","a":"• 申請人應備證件（證明文件須繳驗正本）\n1、申請人：在國內結婚須雙方當事人親自申請，國外結婚已生效者得一方申請。 2、應備雙方當事人身分證（外國人憑護照）、戶口名簿（規費每份30元）、結婚書約（須2名證人簽名或蓋章）、私章（或簽名）、換證（2年內符合身分證規格相片1張或數位相片、規費每張新台幣50元）。 3、在國內結婚，結婚當事人一方為外籍配偶（在台無戶籍者），應經駐外館處驗證之婚姻狀況證明文件及中文譯本，外籍配偶取用中文姓名聲明書。文件係在國外作成者，應經我國 駐外館處 驗證；其在國內由外國駐我國使領館或授權機構製作者，應經外交部驗證。 4、在國外結婚已生效者，應經駐外館處或行政院於香港、澳門設立或指定之機構或委託之民間團體驗證之結婚證明或已向當地政府辦妥結婚登記（或結婚註冊）之證明文件及中文譯本，加蓋「符合行為地法」之章戳，並得免附婚姻狀況證明文件。 5、與大陸地區人民結婚登記，應提憑結婚證明文件及內政部移民署發給加蓋「通過面談，請憑辦理結婚登記」章戳之臺灣地區入出國許可證。在大陸地區或香港、澳門作成之文書，應經行政院設立或指定之機構或委託之民間團體驗證。 *經外交部公告之特定國家，國人與特定國家人士結婚須先於外籍配偶之原屬國完成結婚登記後，備齊結婚證明文件向駐外館處申請面談，再持憑經駐外館處驗證之結婚證明文件，向國內戶政機關辦理結婚登記。","u":"臺北市政府民政局戶籍行政科","h":167597,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F17052D6B6EFE776","d":"2008-05-23","sid":"F17052D6"},{"q":"【新住民】新住民（外籍配偶）持有居留證後，至取得身分證之辦理程序？應備文件為何？","a":"一、依國籍法規定向國內住所地戶政事務所申請國籍歸化（自申請日起往前推算，須合法居留繼續3年以上，且每年有183日以上之居留事實），應備妥下列文件：\n（一）歸化國籍申請書。\n（二）合法有效之外僑居留證或外僑永久居留證。\n（三）辦妥結婚登記之戶籍謄本（申請人免附，由戶政機關代查）。\n（四）歸化取得我國國籍者基本語言能力及國民權利義務基本常識認定標準第3條所定之證明文件。\n（五）相片1張（符合新式國民身分證相片規格）。\n（六）證書規費新臺幣 1,200元。（請以郵政匯票繳交，受款人：內政部）\n二、經許可歸化取得中華民國國籍證明後，再向內政部移民署申請「臺灣地區居留證」，且於內政部許可歸化之日起，1年內提出喪失原有國籍證明，屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n三、\n已提出喪失原有國籍證明並在臺灣居留滿一定期間後，向內政部移民署申請「臺灣地區定居證」，再向欲設籍地戶政事務所申請初設戶籍登記及初領國民身分證。\n四、申請初設戶籍登記及請領國民身分證所需文件為：\n（一）戶口名簿（單獨立戶者免附，但須提憑遷入單獨立戶之房屋所有權證明等相關文件）。\n（二）彩色相片1張或數位照片（最近2年內所拍攝符合身分證相片規格，可至內政部戶政司全球資訊網 http://www.ris.gov.tw/ 查詢）。\n（三）初（換）領戶口名簿規費新臺幣30元；初領國民身分證，規費新臺幣50元。\n◎應繳證件係在國外作成者，應經我國駐外館處驗證及外交部複驗；其在國內由外國駐我國使領館或授權機構製作者，應經外交部驗證。文件為外文者，應檢附經駐外館處驗證及外交部複驗或國內公證人認證之中文譯本。\n◎申請臺灣地區居留證及臺灣地區定居證所需文件請向內政部移民署各地服務站洽辦\nhttps://www.immigration.gov.tw/np.asp?ctNode=29679 ) ◎如欲了解申辦歸化國籍應繳證件，可連結內政部戶政司全球資訊網( http://www.ris.gov.tw/ )參閱，首頁-法規與申辦須知-國籍申辦須知","u":"臺北市政府民政局人口政策科","h":164005,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B79BD52EC0629188","d":"2023-09-04","sid":"B79BD52E"},{"q":"小朋友剛出生，我要攜帶哪些證件幫他報戶口（新生兒戶籍申報相關規定）？","a":"新生兒出生60日內，需辦理出生登記，由下列為申請人： 1.父、母、祖父、祖母、戶長、同居人或撫養人 2.無依兒童，並得以兒童福利機構為申請人 3.受委託人（前列1.2.項之申請人委託） 4.利害關係人（無前列1.2.項之申請人時） 申請人應備下列證件至欲申報戶籍所在地之同一直轄市、縣(市)政府所轄任一戶政事務所辦理： 1.新生兒欲申登之戶口名簿（登記後應換發戶口名簿，規費每份30元） 2.申請人身分證 3.申請人印章（或簽名），若委託辦理須附委託書及受託人之國民身分證 4.出生證明書。出生證明書上新生兒姓名欄位應以正楷書寫新生兒姓名，再於出生證明書下方從姓約定欄位約定子女從姓，並由其法定代理人（婚生子女為父母、非婚生子女為生母）分別於新生兒姓名後方及從姓約定欄位簽名或蓋章確認。 5.子女從姓約定書（出生證明書上已作約定者免附） 6.本市各戶政事務所提供出生登記一站式受理服務，詳細內容可查詢本市松山戶政事務所網站 (https://sshr.gov.taipei/cp.aspx?n=EB8727B50CD7AC61 )說明，提供參考。","u":"臺北市政府民政局戶籍行政科","h":147553,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EE9803065502084B","d":"2007-10-05","sid":"EE980306"},{"q":"戶長遷出，小孩可以當戶長嗎？或是有那些條件資格？","a":"戶籍登記以戶為單位，以家長為戶長，如家長未在同一戶內居住應以戶內成年人1人為戶長 ，如戶內人口均係未成年人，應由戶內年長者1人為戶長。","u":"臺北市政府民政局戶籍行政科","h":130600,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DBC68452F1C5FBEA","d":"2016-05-02","sid":"DBC68452"},{"q":"家中的戶口名簿遺失或破損，該如何辦理新的戶口名簿？","a":"一、戶長攜帶國民身分證及印章(或簽名)辦理，或以書面委託他人辦理。 二、委託辦理時，應附繳委託書、受委託人國民身分證及印章(或簽名)。委託書在國外作成者應經我駐外館處驗證。在大陸地區作成者須經財團法人海峽交流基金會驗證。 三、規費30元。 四、至全國任一戶政事務所辦理即可。 五、附繳舊戶口名簿(若遺失則免繳)。","u":"臺北市政府民政局戶籍行政科","h":125452,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F73FD93ACD46E479","d":"2007-10-05","sid":"F73FD93A"},{"q":"健保IC卡遺失應如何補辦新卡?","a":"健保署規定自即日起申請遺失補發健保卡，除新生兒、或特殊情形(ex顏面傷殘)外，一律皆要附上相片喔！ 。\n健保卡補辦有四種方式 ：親洽、委託他人至健保署各分局、郵局櫃檯、各區公所現場或網路申辦。\n1. 投保在區公所者可至區公所申請代辦，自行至便利商店或金融機構繳費大概一周後，健保署會掛號郵寄到民眾填寫的地址。(依各金融機構及便利商店規定收取手續費)\n2. 至郵局辦理務必攜帶照片2吋一張及身分證明文件正反面影本1份，郵局並無提供拍照服務，大概約5個工作天即可掛號收到健保卡。\n3. 親自至健保署辦理，大概30分鐘可以現場取件。\n4.網路申辦連結： https://cloudicweb.nhi.gov.tw/edesk/system/mainpage.aspx\n攜帶的證件包含 :本人身分證、兩吋照片一張及工本費新臺幣200元，若委託代辦人，代辦人身分證也須提供。\n如遇國民身分證及健保卡同時遺失，於戶政事務所辦理補發國民身分證時，可同時申辦「補發健保卡」服務。\n貼心小語 : 上列說明為一般情形，如有特殊情況，請先電詢本市各區公所社會課。","u":"臺北市政府民政局區政監督科","h":114140,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=36E5D3158F6E2950","d":"2016-10-31","sid":"36E5D315"},{"q":"首次申請護照如何辦理人別確認或一處收件全程服務作業？應備證件？","a":"為維護民眾權益避免護照遭冒辦，自 100 年 7 月 1 日起，首次申請普通護照之民眾，本人應親自至外交部領事事務局或外交部中部、南部、東部、雲嘉南辦事處辦理。 若本人無法親自辦理者，本人得至任一戶政事務所先行辦理人別確認作業，填妥簡式護照資料表，在簡式護照資料表上蓋章後，再將簡式護照資料表併同申請護照應備文件委託旅行業者、親屬或同事續為代辦護照。 辦理護照須要準備什麼文件？ 已填好資料的簡式護照資料表 1 份 （ 戶所有空白表格或至 外交部領事事務局網站 下載列印 ） 。 繳交最近 6 個月內拍攝之彩色光面白色背景照片乙式 2 張（直 4.5 公分且橫 3.5 分，不含邊框），照片一張黏貼，另一張浮貼於簡式護照資料表。 年滿 14 歲者或未滿 14 歲但已領取國民身分證者，應繳驗國民身分證正本（驗畢退還）。 未滿 14 歲且未請領國民身分證者，請繳驗戶口名簿正本（驗畢退還）或繳交最近 3 個月內申請之戶籍謄本 ；一處收件全程服務案件，得直接由戶所人員於系統點選「產生電子戶籍謄本」， 並須由法定代理人或法定代理人委任三親等內親屬陪同辦理。陪同辦理者應繳驗國民身分證正本。若由法定代理人委任三親等內親屬陪同辦理，法定代理人須事先簽妥「同意書」及「委任陪同書」（請至 外交部領事事務局網站 下載列印），委由陪同者帶至戶所，並應繳驗陪同者及簽署委任陪同書之法定代理人兩人身分證正本。 臺北市各戶政事務所服務時間： 臺北市為提供便民服務，協助配合外交部推動「首次護照申請親辦」案，臺北市各區戶政事務所受理首次申辦護照「人別確認」作業服務時間為星期一至星期五 8 時 30 分至 17 時 30 分。 為便利首次申辦護照民眾，外交部與內政部共同合作提供「首次申請護照親辦一處收件全程服務」便民措施，自 109 年 8 月 11 日起於全國各戶政事務所全面開辦。首次申請護照的民眾可備妥符合護照規格照片 2 張、國民身分證正本、並以黑筆或藍筆填妥「簡式護照資料表」（可至 外交部領事事務局網站 下載），親自到任一戶政事務所送件，民眾只要持戶所開具的繳款暨證明單到超商、郵局或農漁會繳納護照規費（每筆","u":"臺北市政府民政局戶籍行政科","h":114048,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=633F420FC25CFB33","d":"2011-06-30","sid":"633F420F"},{"q":"如何申請單身證明？","a":"一、按戶政事務所並無核發單身證明。惟戶籍謄本登載之個人婚姻狀況可藉以判斷當事人目前是處於已婚、未婚、離婚或喪偶狀態。如需申請戶籍謄本，可由自己或直系血親直接申辦。如係委託申請，需另附委託書辦理，委託書在國外作成者，應經駐外館處驗證；委託書在大陸地區作成者應經海基會驗證，並註明申請份數。\n二、有關單身證明的申辦資訊，建議您可參考 臺灣臺北地方法院的網站 說明。經公證的單身證明須至外交部領事事務局辦理文件複驗，在經過國內外交部複驗後是否仍需該國的駐外單位「再複驗」，因各國需要認證的文件或有不同，建議先向當地政府查詢確認。如果需要駐外單位複驗，建議您向外交部領事事務局詢問，以方便您辦理相關認證事宜。","u":"臺北市政府民政局戶籍行政科","h":111828,"t":"地政地價","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=37FFBE6059D02F48","d":"2008-12-05","sid":"37FFBE60"},{"q":"門牌整編證明（門牌證明）要如何申請？應備何文件？","a":"一、臺北市政府為了便利民眾，鼓勵機關使用免書證免謄本方式，以減少門牌證明書的核發，如果您仍需要用到門牌證明書，也可以帶以下證件到房屋所在地的戶政事務所提出申請：\n（一）建物所有權證明文件（或最近3個月內之第1類建物謄本）或有效期限內租賃契約。\n（二）身分證。\n（三）印章（或簽名）。\n（四）門牌證明書1張規費是20元。\n二、如果您現在的戶籍就在那個房子裡，上面的證件中建物所有權證明文件或租賃契約不用帶，直接帶身分證、印章（或簽名）、規費就可以了；如果您是利害關係人，直接帶利害關係證明文件正本、身分證、印章（或簽名）、規費即可辦理。","u":"臺北市政府民政局戶籍行政科","h":100319,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=60A55D23D06E8148","d":"2015-05-04","sid":"60A55D23"},{"q":"身分證遺失時，辦理掛失的方式？身分證已辦理掛失，之後若是找到身分證，可否取消掛失手續?","a":"一、掛失身分證方式\n(一)電話\n1、上班時間請撥打任一戶政事務所（戶政機關通訊錄）辦理；非上班時間辦理國民身分證掛\n失，請撥打 1996 內政服務熱線，並請留下電話號碼，以利戶政事務所於次一上班日再次聯\n繫確認身分，如於掛失後尋獲，請同時告知俾及時撤銷掛失。\n2、為維護民眾權益，掛失服務於上班時間及非上班時間均可受理；撤銷掛失服務請於戶政事務所上班時間辦理。\n3、如民眾在國外請撥打：886(國碼)-2(區碼)-7750-5096(落地碼)。\n(二)網路\n1、持有自然人憑證或行動自然人憑證者，請至內政部戶政司全球資訊網「國民身分證掛失暨\n撤銷掛失申請作業（自然人憑證）」辦理(24小時服務)。\n2、未持有自然人憑證者，請至內政部戶政司全球資訊網 「國民身分證掛失暨撤銷掛失申請作\n業（免自然人憑證）」辦理(24小時服務)。\n(三)臨櫃\n由本人持憑身分證明文件，親向戶政事務所辦理掛失及撤銷掛失國民身分證。\n二、申請身國民身分證掛失後，只要還沒到戶政事務所辦理補領申請者，在找到身分證後，可以依上列方式撤銷掛失，但如果已經完成國民身分證補領申請手續，則無法再辦理撤銷掛失，若找到舊證，請送交戶政事務所註銷作廢。","u":"臺北市政府民政局戶籍行政科","h":97891,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=82B92D176B4FA06C","d":"2008-10-08","sid":"82B92D17"},{"q":"應如何辦理印鑑證明？","a":"【申請方式】\n1. 戶籍設於臺北市 ，如果您需要辦理印鑑證明，申請方式如下：\n(1)申請人：當事人本人、受委任人、法定代理人。\n(2)當事人戶籍 未遷出國外者， 至本市任一戶政事務所辦理。當事人短期出國戶籍尚未遷出國外者，應出具經驗證之授權書由受委任人至本市任一戶所辦理。\n(3)當事人戶籍遷出國外者，本人（法定代理人）至本市任一戶所辦理；受委任人應出具經驗證之授權書於當事人最後戶籍地戶所辦理。\n2. 戶籍設於其他外縣市 ，如果您需要辦理印鑑證明 ，請至當事人戶籍地戶政事務所辦理；戶籍遷出國外者為當事人最後戶籍地戶政事務所。直轄市、縣（市）政府已建置印鑑數位化系統者，得由所轄任一戶政事務所受理申請（不可跨縣市申請）。\n【應備證件】\n1、申請印鑑證明應繳驗國民身分證及原登記印鑑。但在國內曾設有戶籍國民旅居國外、大陸地區或香港、澳門未請領現行國民身分證者，繳驗有效之中華民國護照、入國證明文件或其他身分證明文件。\n2、委任他人辦理者，受委任人應繳驗身分證明文件，並附繳委任書、授權書或同意書（ 須符合下方【注意事項】第1點規定 ，並由委任人親自簽名或蓋章並註明辦理事項），及 委任人原登記之印鑑 、委任人國民身分證影本或有效之中華民國護照、入國證明文件或其他身分證明文件影本。\n3、法定代理人辦理者，法定代理人應繳驗身分證明文件，並附繳當事人國民身分證影本或有效之中華民國護照、入國證明文件或其他身分證明文件影本、原登記之印鑑、法定代理人之印章。法定代理人有數人，由其中一人代為申請者，並應附繳其他法定代理人之身分證明文件影本及委任書或同意書。\n【注意事項】\n1、 當事人在國外委任辦理者，其委任書、授權書或同意書，應經我駐外使館或代表處、辦事處驗證（在大陸地區或香港、澳門作成者，應經行政院設立或指定之機構或委託之民間團體驗證），並應載明辦理種類及請領份數、使用目的 ( 如未曾登記過印鑑或原登記印鑑已失效，請註明同時辦理印鑑登記；如原印鑑已遺失或需更換印鑑，請註明同時辦理印鑑變更。如有其他印鑑證明相關問題請洽詢 本市各區戶政事務所 ) 。\n2、在營軍人得由所屬連級以上部隊長核轉其印鑑登記機","u":"臺北市政府民政局戶籍行政科","h":92928,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C7EE3C8D7D98FCB2","d":"2016-03-04","sid":"C7EE3C8D"},{"q":"如果要製作家族族譜，如何查詢日據時期或光復後相關親屬戶籍登記資料？應備文件及申請方式為何？作業時間以及是否需要費用？","a":"一、因日據時期戶口調查簿、光復後戶籍資料等人工手寫資料已電腦化可全國連線申請，申請人可攜帶身分證明文件正本前往全國任一戶政事務所申請辦理，戶政人員會依據申請人戶籍所在地戶籍資料追查親屬資料，所以申請人如有提供父母親或是祖父母的戶口名簿給戶政人員可加快追查親屬資料時間。 二、申請人及應備文件 (一)申請人為1.本人、2.利害關係人、3.受委託人 (二)應備證件 1. 當事人、利害關係人親自申請者，應繳驗身分證明文件正本；利害關係人應併繳驗利害關係證明文件正本。 2. 委託申請者，受委託人應繳驗身分證明文件正本及委託人出具之委託書正本。 3. 委託人為利害關係人者，應併繳驗利害關係證明文件正本。 4. 委託書、利害關係證明文件在國外作成者，應經我國駐外使領館、代表處或辦事處驗證；其在大陸地區或香港、澳門作成者，應經行政院設立或指定之機構或委託之民間團體驗證。 5. 前項所稱身分證明文件，指國民身分證、外僑居留證、外僑永久居留證、臺灣地區居留證、臺灣地區定居證、中華民國護照或其他足資證明身分之文件。 (三)注意事項 1. 本人或利害關係人得向戶政事務所申請閱覽戶籍資料或交付戶籍謄本；申請人不能親自申請時，得以書面委託他人為之。 2. 利害關係人依前項規定申請時，戶政事務所僅得提供有利害關係部分之戶籍資料或戶籍謄本。 3. 戶籍謄本之格式及利害關係人之範圍，由中央主管機關定之。 4. 利害關係人，指與當事人具有下列情形之一者： (1)契約未履行或債務未清償。 (2)同為公司行號之股東或合夥人，且為執行職務所必要。 (3)訴訟繫屬之當事人，經法院通知提出其他當事人戶籍資料。 (4)當事人之配偶、直系血親。 (5)戶長與戶內人口。但寄居人口，不在此限。 (6)其他確有法律上權利義務得喪變更之關係。 三、為隨到隨辦案件，戶所作業時間需視民眾申請親屬資料的親等範圍及數量而定，申請日據時期戶口調查簿、光復後戶籍資料及戶籍謄本所需規費係以張計算，每張15元。","u":"臺北市政府民政局戶籍行政科","h":83833,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=BBCBB50B0FAFCFE5","d":"2018-03-27","sid":"BBCBB50B"},{"q":"如何辦理改名？","a":"(7)臺灣原住民族基於文化慣俗。\n注意事項：\n貼心小語: 上列應攜帶證件為一般情形，如有特殊情況，請先電詢本市各區戶政事務所。","u":"臺北市政府民政局戶籍行政科","h":81829,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1953FC31380E647B","d":"2007-10-05","sid":"1953FC31"},{"q":"什麼是自然人憑證？如何申請？是否一定要本人親自申請?","a":"◎什麼是自然人憑證： 就是給自己一個網路身分證，您可透過網路申辦多項政府提供的服務，目前自然人憑證可使用的網路應用服務包括網路報稅、勞保年資及個人退休金專戶查詢、個人限制入出境查詢、健保個人資料及欠費查詢、電子公路監理、電子戶籍謄本、身分證掛失及地政e網通等多項便民服務(請參照內政部憑證中心網站http://moica.nat.gov.tw/link_1.html)。 ◎如何申請自然人憑證： 1.年滿18歲就可辦理，必須本人親自辦理（不可委託辦理喔！即便當事人如果在國外的話，也不可授權辦理）。 2.應備證件： (1)身分證正本。 (2)E-mail信箱。 (3)規費250元。 3.您可至全國任一戶政事務所辦理。 4.於上班時間申請或補領自然人憑證可當場領取IC卡。","u":"臺北市政府民政局戶籍行政科","h":80167,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=41C4401AABF1E572","d":"2017-01-10","sid":"41C4401A"},{"q":"我從國外回來才知道戶口已經被遷出，我要怎麼辦理身分證？(入境遷入)","a":"請至現住地戶政事務所辦理恢復戶籍\n申請人：\n1.本人或戶長（遷入地戶長）\n2.可委託辦理（需附委託書）\n一、自己單獨一本戶口名簿 (一)持蓋有本次入境章戳的中華民國護照或入國證明文件 (二)房屋所有權狀或最近1期完稅房屋稅單正本 (三)身分證(本人) (四)印章(本人) (五)遷徙者2年內拍攝正面彩色照片1張，亦得繳交數位相片，規格依請領（初、補、換）國民身分證之相關規定辦理，若本人親自申請換證時，經戶政事務所核對檔存照片與人貌相符且年歲相當，得免繳交照片，如尚未請領新式國民身分證者，仍請依上述照片規格本人（不得委託）攜帶1張照片辦理換證事宜，換證規費50元 (六)戶口名簿規費30元 二、寄在別人戶口名簿內 (一)持蓋有入境章戳的中華民國護照或入國證明文件 (二)戶口名簿(新住址) (三)身分證(本人) (四)印章(本人) (五)遷徙者2年內拍攝正面彩色半身照片1張，規格依請領（初、補、換）國民身分證之相關規定辦理（相片規格詳見內政部戶政司全球資訊網 https://www.ris.gov.tw/app/portal/187 ），若本人親自申請換證時，經戶政事務所核對檔存照片與人貌相符且年歲相當，得免繳交照片，換證規費50元 (六)換領戶口名簿，規費30元。","u":"臺北市政府民政局戶籍行政科","h":76310,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=12DD04D2B3D88A01","d":"2016-05-02","sid":"12DD04D2"},{"q":"新住民（外國人或無國籍人）如何申請中華民國國籍？及申辦中華民國身分證之資格？","a":"一、有關歸化中華民國國籍之規定，依國籍法第3條或第4條規定，應具備下列各項要件，向國內住所地戶政事務所申請歸化中華民國國籍：\n（一）外國人或無國籍人，現於中華民國領域內有住所，每年合計有183日以上合法居留之事實繼續3年或5年以上。依中華民國法律及其本國法均有行為能力\n（二） 依中華民國法律及其本國法均有行為能力 。\n（三）無不良素行，且無警察刑事紀錄證明之刑事案件紀錄。\n（四）有相當之財產或專業技能，足以自立，或生活保障無虞。(若為中華民國國民配偶身分或已取得外僑永久居留證者，免附。)\n（五）具備我國基本語言能力及國民權利義務基本常識。\n二、歸化中華民國國籍許可後，再向內政部移民署申請「臺灣地區居留證」，且於內政部許可歸化之日起，1年內提出喪失原有國籍證明，屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n三、居留滿一定期間後(已提出喪失原有國籍證明)，向內政部移民署申請「臺灣地區定居證」，俟取得定居證後即可向設籍地戶政所申請初設戶籍登記及申領國民身分證。\n◎應繳證件係在國外作成者，應經我國駐外館處驗證及外交部複驗；其在國內由外國駐我國使領館或授權機構製作者，應經外交部驗證。文件為外文者，應檢附經駐外館處驗證及外交部複驗或國內公證人認證之中文譯本。","u":"臺北市政府民政局人口政策科","h":73283,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2516AF8BD7728BE4","d":"2023-09-04","sid":"2516AF8B"},{"q":"何謂獨立戶？","a":"戶籍登記，以戶為單位，在一家或同一處所共同生活者為一戶，單獨生活者，得為一戶並為戶長。 1人不得同時有2戶籍。經戶籍登記之戶，應請領戶口名簿。","u":"臺北市政府民政局戶籍行政科","h":72597,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=C69230FA75444469","d":"2016-05-02","sid":"C69230FA"},{"q":"我與先生（太太）感情不好，已經到了水火不容地步，我不想跟他再有瓜葛，該如何辦理離婚？","a":"一、雙方兩願離婚：\n1、申請人：雙方當事人\n2、離婚協議書（需有2位18歲以上證人簽名）。\n3、雙方戶口名簿（規費每份30元）、身分證、印章（或簽名）、換證（2年內符合身分證規格相片1張或數位相片、工本費新台幣50元）。\n4、辦理地點為任一戶政事務所。\n二、我國法院判決、調（和）解離婚：\n1、申請人：法院判決、調（和）解離婚得單方申請。\n2、歷次離婚判決書暨確定證明書正本或調(和)解筆錄正本。\n3、申請人戶口名簿（規費每份30元）、身分證、印章（或簽名）、換證（2年內符合身分證規格相片1張或數位相片、工本費新台幣50元）。\n4、經法院裁判離婚確定、調解或和解離婚成立者，得向任一戶政事務所辦理登記。\n三、國外離婚（依行為地法離婚已生效）：\n1、申請人：雙方當事人或任一方當事人皆可申請。\n2、應備經中華民國駐外單位驗證之離婚證明文件正本暨中譯本，中譯本可經駐外單位驗證或國內法院或民間公證人公證（國外判決被告有無到場或收受送達需翻譯出來）。\n3、申請人之戶口名簿（規費每份30元）、身分證、印章（或簽名）、換證（2年內符合身分證規格相片1張或數位相片、工本費新台幣50元）。\n4、除經駐外館處函轉者外，其餘皆可向任一戶政事務所辦理。\n四、大陸地區離婚：\n1、申請人：雙方當事人或任一方當事人皆可申請。\n2、在大陸地區協議離婚：應備經海基會驗證之離婚公證書暨大陸離婚證。\n3、在大陸地區調解離婚：應備經海基會驗證之離婚調解公證書暨送達回證公證書（或離婚調解公證書載有調解生效日期）。\n4、經大陸地區法院判決離婚：應備經海基會驗證之大陸法院民事判決書暨確定證明書，及經我國法院裁定認可之裁定書暨確定證明書。\n5、申請人戶口名簿（規費每份30元）、身分證、印章（或簽名）、換證（2年內符合身分證規格相片1張或數位相片、工本費新台幣50元）。\n6、可向任一戶政事務所辦理。","u":"臺北市政府民政局戶籍行政科","h":71314,"t":"戶政兵役","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E37689FAF3609439","d":"2007-10-05","sid":"E37689FA"}]},{"org":"大眾捷運股份有限公司","total":152,"items":[{"q":"捷運車站是否有置物櫃？","a":"捷運系統全線車站、中山及東區地下街均設有置物櫃，設置位置、收費標準及數量資訊，請至本公司官網(旅客服務>置物櫃服務)下查詢。","u":"臺北大眾捷運股份有限公司","h":303011,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69B77838D3916DFE","d":"2008-06-01","sid":"69B77838"},{"q":"何謂捷運與公車（不含里程收費公車）間雙向轉乘優惠？儲值卡各票種雙向轉乘優惠如何扣款？","a":"為配合臺北市政府鼓勵民眾使用大眾運輸工具之政策，故實施轉乘優惠措施。使用儲值卡之旅客於轉乘優惠容許時間(1小時)內搭乘捷運直接轉乘公車，或搭乘公車直接轉乘捷運（不可搭乘其他運具，例如 YouBike、淡海輕軌、安坑輕軌、臺鐵、貓空纜車、長途客運、高鐵、計程車等，形成中斷轉乘），依不同票種可享有不同額度之優惠。\n1.普通卡及單獨使用之愛心陪伴卡：每次新臺幣8元整。\n2.學生卡：每次優惠新臺幣6元整。\n3.社福卡(敬老卡、愛心卡、優待卡、陪同愛心卡使用之愛心陪伴卡等)：每次新臺幣4元整。\n4.公車捷運轉乘前加值不影響轉乘優惠。當搭完捷運(公車)票卡餘額為負值時，請於轉乘公車(捷運)前將儲值卡加值成正值，即可享有轉乘優惠。另若轉乘前未正常感應捷運系統出站閘門或公車讀票機，則會無法判斷是否有轉乘情形，而影響轉乘權益。\n5.109年2月1日起實施公車上下車刷卡，上下車未完成刷卡則無法享有後續一趟捷運轉乘優惠，另捷運於出站時亦須成功由閘門完成扣款，後續方可享有公車轉乘優惠。\n6.公車上下車刷卡詳細規定請洽臺北市公共運輸處網站查詢。\n若您的搭乘行為符合一切轉乘優惠規定卻未享有轉乘優惠時，可逕洽運具權責單位處理，或至捷運站詢問處申請後送處理，案件將由本公司後台人員調查後辦理退費，或轉由相關權責單位處理後續。","u":"臺北大眾捷運股份有限公司","h":300961,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=1CDFC00134A98701","d":"2008-09-03","sid":"1CDFC001"},{"q":"臺北捷運的營運時間為何?是否可延長？","a":"臺北捷運的營運時間從早上6點發首班車開始，至晚上12點發末班車結束。\n為兼顧旅運需求、噪音問題以及營運安全，每日營運前各路線列車係於清晨5:00左右，即自各機廠(駐車地點)發出，循序將車輛佈妥於各發車點，並於6:00準時自各發車點(含各端點車站)發出首班車，一直營運至深夜24:00自各端點站發出末班車止。另每日捷運末班車收車後，所有車輛皆需回送機廠安排列車清潔及維修保養，如淡水站末班車於24:00發車，抵達象山站約為翌日凌晨1時，後續進行營運列車收回機廠作業，實際上，至收車完成時間，已超過凌晨1:30。此外，各路線於首班車營運前，約於清晨5:00開始至5:30分左右，尚須進行軌道之巡視作業，故本公司須於僅剩之三個半小時內，進行電聯車清潔與保養、軌道設施維護等工作，時間上已無法再壓縮。\n考量列車在深夜運行之噪音、振動問題會影響沿線居民之作息，且為維持夜間維修保養之正常作業，以利系統保持最佳狀況，提供給旅客安全、快速、舒適的輸運服務，現階段仍以維持目前之營運時間為宜。","u":"臺北大眾捷運股份有限公司","h":249168,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=679D2B6A5D346EB2","d":"2016-04-01","sid":"679D2B6A"},{"q":"於捷運系統內遺失及找尋遺失物之相關處理方式？","a":"1.旅客在車站、車廂內拾獲之遺失物，得交由車站詢問處處理。 2.當旅客發現隨身物品遺失時，可手機下載「台北捷運GO」APP，登錄遺失物資訊，如有符合者，本公司會以電話主動聯繫確認。亦可致電02-25363001轉9，由客服人員協助找尋。 3.遺失物公告亦每小時更新，並刊載於本公司網站「首頁/旅客服務/遺失物服務」。遺失物中心服務時間：每週二至週六，中午12:00至下午20:00(星期日、星期一及國定假日除外），地址：近捷運臺北車站，中山地下街R1出口附近地下2樓。(從捷運臺北車站1號詢問處(淡水信義線大廳層)出站，搭電扶梯往上後，直走往中山地下街方向步行約20公尺通道中間的樓梯下樓，即可抵達) 4.注意事項：雨傘類遺失物皆於各車站進行招領。 5.為快速找回具電子票證功能之遺失物，請成為「台北捷運GO」APP會員並綁定票卡，未來如遺失票卡，經登錄比對符合，會立即發送簡訊通知。","u":"臺北大眾捷運股份有限公司","h":214081,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=609D08500F8C9D4C","d":"2014-12-09","sid":"609D0850"},{"q":"搭乘捷運免票資格為何？","a":"依臺北捷運系統旅客須知規定：「未滿6歲之兒童（身高滿115公分應出示身分證明）、身高未滿115公分之兒童，得由購票旅客陪同免費乘車。每1位購票旅客最多以陪同4名為原則，並妥善照護其安全。」","u":"臺北大眾捷運股份有限公司","h":202761,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=659D91B390310152","d":"2008-06-01","sid":"659D91B3"},{"q":"臺北市/新北市6 歲以上未滿 12 歲兒童搭乘臺北捷運如何享有票價優惠?","a":"本公司配合臺北市政府社會局及新北市政府交通局之公告政策，年滿6歲以上未滿12歲之兒童持「數位學生證」、「兒童優惠卡」或「新北兒童卡」搭乘臺北捷運每趟車資可享單程票價4折之優惠票價，說明如下：\n一、 臺北市：\n(一)學籍為臺北市者於就學期間由就讀學校發放具有悠遊卡功能之「數位學生證」。\n(二)設籍臺北市但無法申請「數位學生證」（例如學籍在外縣市、就讀臺北市無數位學生證之國小或尚未就學）可向區公所申請辦理「兒童優惠卡」。\n(三)持設籍在臺北市之「戶口名簿」、「戶籍謄本」或「身分證」等其中一種證明文件之正本、影本或照片，即可臨櫃購買4折之優惠單程票。\n二、 新北市：\n(一)學籍為新北市者，於就學期間由就讀國小發放「新北兒童卡」給新北市兒童使用。\n(二)若戶籍在新北市，但不在新北市就學，或尚未就學的兒童，則可向各新北市任一區公所申請辦理「新北兒童卡」。\n(三)目前並未開放新北市兒童持身分證明文件購買兒童優惠票。\n註：\n1.目前未針對其餘縣市6歲以上未滿12歲兒童提供優惠。\n2.其餘縣市6歲以上未滿12歲兒童搭乘臺北捷運購票票價與一般成人票價相同。","u":"臺北大眾捷運股份有限公司","h":185317,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=00695D3417F06354","d":"2025-10-16","sid":"00695D34"},{"q":"同站進出扣款方式及原因？ 同站進出須扣款，是否可減收或免收費用？","a":"同站進出扣款方式及原因？ 同站進出須扣款，是否可減收或免收費用？\n為避免人員滯留車站或車廂、產生流浪漢於系統內遊蕩或快遞業者利用捷運運送物資，影響捷運系統使用之公平性及其他旅客乘車動線及安全，因此訂定旅客在付費區內之停留時限等規定。\n本公司於各捷運車站自動售票機附近張貼「臺北捷運系統旅客須知」，該須知第13點規定「旅客持用車票，除因可歸責於本公司之事由外，經驗票閘門進入付費區至離開付費區之停留時限規定如下：(一)不同一車站進出，最大時限為2小時；(二)同一車站進出，最大時限為15分鐘；違反前項規定者，除應付之票價外，應於車站詢問處繳交或由驗票閘門自動扣除車站公告之單程票最低票價之金額。」\n第14點規定「同站進出者，應支付車站公告最低單程票票價。但符合下列情形之一者，可洽站務人員協助處理：(一) 特殊狀況（如民眾借用廁所等）。(二) 進站者於出站前，持有多張車票欲更換使用。」","u":"臺北大眾捷運股份有限公司","h":180497,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=240CCF4CB33CEAA7","d":"2008-06-01","sid":"240CCF4C"},{"q":"捷運系統內旅客禁止飲食規定與範圍為何?是否有相關取締或宣導措施?","a":"1.依現行大眾捷運法第50條第1項第9款規定，捷運系統禁止飲食區內不得飲食，違者處新臺幣1,500元以上7,500元以下罰鍰。\n2.禁止飲食區範圍係以各車站閘門前之黃色標線為界，黃色標線以內為禁止飲食區，旅客進入本區內一律禁止飲食（包含喝白開水、礦泉水），惟如因疾病、 身體不適等特殊狀況，需喝水、吃糖、吃藥時，可洽服務人員予以協助；黃色標線區以外，旅客則可自由飲食，惟不得任意拋棄垃圾。\n3.本公司為落實捷運系統內禁止飲食規定，除持續透過站車內廣播系統、月臺旅客資訊顯示器、標誌及電子圖卡等媒介加強宣導，車站人員亦會加強稽查取締旅客違規飲食行為，以提供旅客一個乾淨舒適之搭乘環境。","u":"臺北大眾捷運股份有限公司","h":144922,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=CBB430D2363C29FC","d":"2008-10-06","sid":"CBB430D2"},{"q":"儲值卡各票種搭乘臺北地區聯營公車、捷運之扣款方式為何？","a":"普通卡： 公車：每段票扣15元。 捷運：單程票價全額扣款。 學生卡： 公車：每段票扣12元。 捷運：單程票價全額扣款。 優待卡： 公車：每段票扣8元。 捷運：單程票價全額扣款。","u":"臺北大眾捷運股份有限公司","h":100336,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=E084154A0555B67D","d":"2020-02-01","sid":"E084154A"},{"q":"單程票使用方式為何？相關規定為何？是否可開立購票證明？","a":"使用方式：\n單程票大小如50元硬幣，顏色為深藍色，正面為捷運公司LOGO(metro Taipei)，背面為中英文單程票(Single-Journey Ticket)字樣，進站時與悠遊卡相同，將單程票置於新式驗票閘門的感應器上，閘門會自動感應並開啟門檔讓旅客進站，出站時則須將單程票投入新式驗票閘門上方投入口內，閘門會自動回收該單程票，並開啟門檔讓旅客出站。\n相關規定：\n1.單程票辦理退費限發售當日且未使用，可至捷運車站詢問處辦理(已使用之票卡，除可歸因於本公司之事由外，一律不得退費)。\n2.若所購單程票金額不足支付車資時，須至詢問處補足差額，由站務人員處理後，將原單程票刷出站即可。\n3.若票卡遺失致使無法出站，則須至詢問處重新購票(若遺失悠遊卡，重新購票後另發給購票證明，以做為日後尋獲時免費調整悠遊卡資料之憑證)。\n4.相關規定於「臺北捷運系統旅客須知」中公告說明。\n購票證明：\n本公司為方便旅客申報車資，可持單程票至捷運各車站詢問處開立「購票證明」之服務。","u":"臺北大眾捷運股份有限公司","h":72695,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=AC4450DF7B48E984","d":"2008-07-01","sid":"AC4450DF"},{"q":"臺北市及新北市之敬老卡、愛心卡、愛心陪伴卡搭乘臺北捷運、新北輕軌(淡海輕軌及安坑輕軌)及臺北地區聯營公車等運具之扣點/扣款方式為何？","a":"1.設籍臺北市：敬老卡及愛心卡：每月享有600點(每點折算1元)，點數可使用於臺北捷運、新北捷運(輕軌及環狀線)、貓空纜車、臺北地區聯營公車及於臺北市境內租借YouBike(並於雙北市還車)，依1點1元方式扣款。\n2.設籍新北市：敬老卡及愛心卡：每月享有600點(每點折算1元)，點數可於臺北捷運、新北捷運(輕軌及環狀線) 、臺北地區聯營公車及於新北市境內租借YouBike可於新北市、臺北市、桃園市境內還車(無法使用於貓空纜車) ，依1點1元方式扣款。\n3.以上所提供之點數不能累計至次月，每月均重新自動計算，不必至固定地點申請，如點數用完或點數無法於限定運具使用時，請將悠遊卡加值，搭乘臺北捷運及新北捷運(輕軌及環狀線)享有單程票車資4折優惠(不限次數)、搭乘公車享有半價優待(不限次數)。\n4.持臺北市敬老卡、愛心卡及新北市敬老卡、愛心卡，搭乘臺北捷運及新北捷運環狀線可優先以點數扣抵車資(不含逾時費用)，若持卡人於捷運系統內超過停留時間限制，將由電子錢包扣逾時費用20元，無法以點數扣抵。\n5.點數使用以1點1元方式扣款，若剩餘點數不足夠支付當趟車資，則該車資將先扣除剩餘點數，不足之差額同時由電子錢包扣除。\n6.愛心陪伴卡無提供點數，使用時須緊接愛心卡之後感應始可享有相同優惠，若單獨使用則以普通卡票價計。","u":"臺北大眾捷運股份有限公司","h":65930,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=41B78C4788395C41","d":"2019-05-30","sid":"41B78C47"},{"q":"颱風來襲時捷運系統之預防與應變措施？","a":"接獲中央氣象署發布颱風警報後，行控中心將監看中央氣象局署網站，以明瞭颱風動態並採取必要措施。運務人員將加強車站、列車及設施設備的檢視作業，並提高警覺注意任何狀況。視風力強度，將依下列方式採取相關應變措施：\n1.文湖線：\n(1)當瞬間風速達8級(每秒17.2公尺)時，列車將採減速行駛。\n(2)當瞬間風速達10級(每秒24.5公尺)，或平均風速達7級(每秒13.9公尺)時，列車暫停行駛，並俟風力減弱再行駛至終端站疏散車內旅客。\n2.淡水信義線、松山新店線、中和新蘆線及板南線：\n(1)當瞬間風速達8級(每秒17.2公尺)時，高架平面區段之列車將採減速行駛。\n(2)當瞬間風速達10級(每秒24.5公尺)，或平均風速達7級(每秒13.9公尺)時，高架及平面區段之列車暫停行駛，並俟風力減弱再行駛至終端站疏散車內旅客。\n(3)未受颱風風力影響之地下段列車仍維持載客行駛，本公司並將視狀況適時調整營運班距。\n颱風期間本公司將透過媒體發布營運訊息，讓民眾了解列車運行狀況，本公司亦將同時利用各站之旅客資訊顯示器、廣播系統及張貼告示等方式告知民眾相關訊息。","u":"臺北大眾捷運股份有限公司","h":54992,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5B788CE0DCBB4FF6","d":"2008-10-06","sid":"5B788CE0"},{"q":"團體票如何購買？","a":"請於搭車前至車站詢問處購買即可，由站務人員清點人數後開立團體紙票，憑票搭車，出站回收(團體須同進同出)。10人以上未滿40人可享單程票價8折優惠，40人以上可享7折。如需購票證明請於購票時向站務人員索取。","u":"臺北大眾捷運股份有限公司","h":44353,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DC0EEEDA8001E1C0","d":"2008-09-03","sid":"DC0EEEDA"},{"q":"旅客刷票進站後，若因特殊事由(東西忘了拿、上廁所)須暫時出站，旅客該如何處理呢？民眾是否可借用車站付費區內廁所？","a":"1.若旅客剛刷票進站（從刷進站閘門的時間起5分鐘以內），沒有搭乘事實，且要求退票者，單程票可退費；儲值卡可免費更改進出碼，請旅客從公務門出站。欲再進站再另行購票或刷卡。 2.借用廁所：民眾若有使用車站付費區內廁所之需求時，或旅客乘車途中，有使用車站非付費區廁所之需求時，均可洽站務人員協助經由公務門進出站或洽站務人員領取「臨時通行票」免費使用廁所。","u":"臺北大眾捷運股份有限公司","h":37035,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4972F0EDD91E6DA8","d":"2008-10-06","sid":"4972F0ED"},{"q":"捷運轉乘停車場對於身心障礙者有無優惠？","a":"一、為便利身心障礙旅客使用捷運轉乘停車場，捷運轉乘停車場比照臺北市停車管理工程處之規定，提供身心障礙者停車優惠。\n二、身心障礙者憑身心障礙者專用停車位識別證或懸掛身心障礙專用車牌、身心障礙手冊(或身心障礙證明)及行車執照等3證（以下稱3證）正本可享停車優惠，優惠如下：\n(一)臨時停車：\n1.身心障礙者於計時停車場，當次（含跨日停車）優惠前4小時免費，以後依停車場費率半價收費，每日以1次為限，超過1次以上者，則依停車場費率半價收費。另於計次停車場，依停車場費率半價收費。\n2.於出場前備妥3證（識別證號與車號相同或使用身障車牌者免附行車執照，登記姓名不得為公司）至停車場管理室，由現場人員以身障優惠費率進行扣款。\n3.愛心悠遊卡：持愛心悠遊卡進、出停車場，驗票機會自動依身心障礙者優惠停車費率扣款。\n(二)身心障礙優惠定期票：\n1.自行駕駛之身心障礙者及家屬載送之設籍臺北市或新北市高中職以下之身心障礙者，可優先申購身心障礙優惠定期票，檢附上述3證，並依各現場公告規定及申購時程辦理。\n2.由陪伴人載送身心障礙者（限設籍臺北市及新北市居民），同一般民眾採線上登記及電腦抽籤，如中籤取得資格者，該親屬陪同身心障礙者本人，檢附3證及戶口名簿或戶籍謄本(稱謂欄有身心障礙者之稱謂親屬)，依各現場公告規定與時程辦理查驗申購作業。\n(三)其他規定：\n1.本規定優惠停車，以一人一車為限，其餘應依規定繳費。不符規定者，請依該場停車費率繳費。\n2.身心障礙者不得將身心障礙手冊借與他人使用，如發現確有借與他人冒用之情事，除依規定補費外，並取消其優惠停車資格。\n3.其他規定，詳現場公告或電洽停車場經營廠商客服電話。","u":"臺北大眾捷運股份有限公司","h":36950,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3E92BFFE3BA7A7B","d":"2008-12-30","sid":"D3E92BFF"},{"q":"如何查詢捷運遠期路網路線規劃/通車時程?","a":"請上臺北市政府捷運工程局網站(http://www.dorts.gov.taipei/「捷運興建路網」)查 詢或逕洽臺北市民當家熱線1999、或撥總機02-25215550","u":"臺北大眾捷運股份有限公司","h":36340,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5FD8B8E3903C0418","d":"2008-12-30","sid":"5FD8B8E3"},{"q":"MRT/TRTC/Metro Taipei各為何意？有何不同？","a":"MRT:Mass Rapid Transit大眾捷運系統(運輸型式統稱)TRTC:Taipei Rapid Transit Corporation臺北捷運公司(臺北捷運經營單位)Metro Taipei:臺北捷運(本公司之服務品牌)","u":"臺北大眾捷運股份有限公司","h":36077,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EBEBAEF3B677D712","d":"2008-06-01","sid":"EBEBAEF3"},{"q":"持悠遊卡通過驗票閘門，產生之提示音及燈號代表意義為何？","a":"捷運及貓空纜車驗票閘門：\n普通卡、學生卡、優待卡：「噹」1聲的鋼琴聲，無燈號顯示。\n敬老卡：「噹」1聲的鋼琴聲，閘門上方燈號顯示橘燈、下方指示燈號閃橘燈。\n愛心卡、愛心陪伴卡(須跟隨於愛心卡後方接續刷票使用)：「噹」1聲的鋼琴聲，閘門下方指示燈號閃橘燈。\n臺北市國小數位學生證、臺北市兒童優惠卡、新北兒童卡：「噹」1聲的鋼琴聲，閘門上方燈號顯示橘燈、下方指示燈號閃橘燈。\n電子票卡異常：「叮叮」2聲高音的鋼琴聲，閘門上方燈號顯示紅燈。\n餘額低於100元：「噹啷～噹噹」滑音+2聲的鋼琴聲，提醒旅客加值，無燈號顯示。","u":"臺北大眾捷運股份有限公司","h":34266,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64026F3DEFE508F8","d":"2008-06-01","sid":"64026F3D"},{"q":"列車為何會突然有加、減速或停在站間的情況？","a":"列車在正常情況下是自動駕駛模式行駛，並由電腦自動控制列車加減速，除於緊急狀況下由系統或司機員執行緊急停車，使列車停止外，一般而言，基於系統安全保護，當兩列列車距離過近，號誌電腦會控制列車加減速以保持兩列車之適當安全距離。如前方月臺之列車尚未離開時，後方列車則會於站外臨時停車，等候進站。","u":"臺北大眾捷運股份有限公司","h":31934,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A79C333D2EC5D1E5","d":"2009-06-10","sid":"A79C333D"},{"q":"列車停靠各站月臺開關門時間？","a":"淡水信義線、松山新店線、中和新蘆線及板南線：目前列車於各車站月臺之停靠時間分別約20秒至35秒，於旅運量大的重點轉運車站，如臺北車站、忠孝復興站之停靠時間則約40至50秒左右。\n文湖線：旅運量大的重點轉運車站，如忠孝復興站停靠時間約40至50秒外，其餘各站約20至30秒不等。\n原則上各路線之列車停靠站時間係自列車停妥後開始計算，惟運務人員將視現場狀況予以彈性調整。","u":"臺北大眾捷運股份有限公司","h":31326,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5ADD5575D011FABE","d":"2008-06-01","sid":"5ADD5575"},{"q":"到站站名廣播為何須用四種語言播報？","a":"依據「大眾運輸工具播音語言平等保障法」第六條之規定，以及臺北市政府為考量臺北都會區之國際化發展趨勢，依此捷運系統廣播提供國語、閩南語、客家語及英語四種播音語言。","u":"臺北大眾捷運股份有限公司","h":30500,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=27F4C732973171ED","d":"2008-06-01","sid":"27F4C732"},{"q":"旅客可以在車站或月臺上照相或攝影嗎？","a":"旅客可以在車站或月臺上從事一般紀念性照相及攝影，不需事先申請，但須注意不得違反法令、妨礙他人或系統安全。但商業性質之拍攝，須先依本公司媒體拍攝須知申請許可後，始得為之。","u":"臺北大眾捷運股份有限公司","h":29371,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=212A88D2A51184A5","d":"2008-06-01","sid":"212A88D2"},{"q":"捷運公司有哪些文宣/地圖可供索取或下載？","a":"為響應政府推行e化、ESG政策，台北捷運車站已無提供紙本文宣品/地圖索取。歡迎於各捷運車站詢問處、官方網站等處掃描QRcode下載路網圖或營運摺頁，亦歡迎使用智慧型手機下載「台北捷運Go」App，可以查閱更多捷運車站、周邊旅遊、活動好康等資訊。","u":"臺北大眾捷運股份有限公司","h":28930,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=44F846507D961AE7","d":"2008-06-01","sid":"44F84650"},{"q":"旅客攜帶隨身物品及行李限制規定為何？","a":"旅客隨身攜帶行李及物品，除本公司另有公告外，應符合下列規定：\n（一）不得妨礙其他旅客，並應自行保管及照料。\n（二）任一件最長邊不得超過165公分，且長、寬、高之和不得超過220公分。但輪椅、代步器、嬰兒車、自行車、衝浪板、寵物車、低音提琴及其他經本公司公告物品，不在此限。\n（三）旅客隨身攜帶氣球者，其數量不得超過5個，且任一個最長邊不得超過50公分。\n（四）不得攜帶或乘坐車輛、代步器、電動車及其他類似動力機具。但領有身心障礙證明或其他經本公司許可之旅客，可使用坐乘式輪椅或代步器等行動輔具於車站內緩速通行。\n（五）旅客攜帶自行車者，僅可牽行不可騎乘或滑乘，並依「臺北捷運公司開放旅客攜帶自行車搭乘捷運應行注意事項」辦理。另經摺疊或拆卸完成，並妥善包裝可攜帶進站。\n（六）非捷運系統之人員於車站、車廂內不得攜帶、使用手推車或其他類似器具。但符合一般旅客隨身攜帶行李及物品尺寸規範，並經本公司許可者，不在此限。\n（七）旅客隨身攜帶衝浪板者，其最長邊不得超過180公分，尾舵、腳繩等附掛物，應自行拆卸、收好。衝浪板最長邊165公分以上180公分以下者，僅限假日時段攜帶進入車站，搭乘列車第一節或最後一節車廂，不得使用電扶梯。\n（八）旅客攜帶低音提琴者，需妥善包裝，並依「臺北捷運公司開放旅客攜帶低音提琴搭乘捷運應行注意事項」辦理。\n（九）旅客攜帶寵物車應依「臺北捷運公司開放旅客攜帶寵物車搭乘捷運應行注意事項」辦理。","u":"臺北大眾捷運股份有限公司","h":27954,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=4878D2C91C044C0A","d":"2022-01-23","sid":"4878D2C9"},{"q":"捷運系統遇地震發生時有何應變措施？","a":"發生震度2級以上地震時，列車若在月臺則暫停發車，若在站間則應減速停車，行控中心儘速依蒐集的資訊，評估地震對捷運系統之影響，應變措施如下：\n1.當地震震度為2級或3級時，高運量司機員以半自動模式限速40公里以下行駛檢視軌道、文湖線行控中心對全線軌道下達50%速限；若檢視確認正常，恢復正常運轉。\n2.當地震震度為4級時，列車慢速進站疏散旅客後，高運量司機員以半自動模式限速15公里以下行駛檢視軌道、文湖線行控中心派員隨車，並對全線軌道下達25%速限檢視軌道；若檢視確認正常，恢復正常運轉。\n3.當地震震度達5級且最大地動速度未達20 cm/sec時，列車慢速進站疏散旅客後，高運量司機員以半自動模式限速10公里以下行駛檢視軌道、文湖線行控中心派員隨車，並對全線軌道下達25%速限檢視軌道；若檢視確認正常，恢復正常運轉。\n4.當地震震度達5級且最大地動速度達20 cm/sec時，安排人員步行並沿途檢視軌道至站間列車停滯處，再調度列車慢速進站疏散旅客，系統暫停營運。旅客疏散完畢，斷電並安排人員步行檢視全線軌道後，高運量司機員以半自動模式限速25公里以下行駛檢視軌道、文湖線行控中心派員隨車，並對全線軌道下達50%速限檢視軌道；若檢視確認正常，恢復正常運轉。","u":"臺北大眾捷運股份有限公司","h":27433,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=847EA7D963E533A0","d":"2019-08-19","sid":"847EA7D9"}]},{"org":"動物保護處","total":152,"items":[{"q":"住家附近有流浪貓或幼貓出現，該怎麼辦？","a":"一、您可先來電本處（1959）詢問該區是否為本處推動執行「臺北市街貓友善照顧行動方案（簡稱TCCP）」區域，此方案為將流浪貓誘捕、絕育、剪耳（公左母右）、照護後原地野放，由民間動保團體志工繼續照護。經執行TCCP，該區域街貓絕育達70％以上即可有效控制街貓數量，此外，街貓因打架和求偶引起的呼號，以及標記地盤而噴灑尿液等問題行為，也會大為減少；另街貓對鼠害亦可加以控制，對都會地區的居民來說，街貓其實是很好的鄰居。\n二、如所居住區域非屬TCCP執行區域，因街貓通常為夜間出沒動物，且多攀爬於住家屋簷、花台或陽台上，較難以套繩或網捕，本處原則採用誘捕方式為之，對街貓的緊迫傷害亦較小；為服務市民，本處備有動物救援籠，免費借用本市民眾，如您有需求，可致電動物救援專線（電話：1959）申請借用，因數量有限，每人限借1個，借用期間原則為2週，如有久候，敬請見諒。\n三、如想要更瞭解TCCP或申請為TCCP執行區域，歡迎逕洽本處業務承辦人（電話：02-87897158）。","u":"臺北市動物保護處動物救援隊","h":87223,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=88342907A4A37AC3","d":"2011-12-15","sid":"88342907"},{"q":"我家養一隻狗狗(貓咪)，但因家庭因素無法再繼續飼養了，能帶去動物之家請你們收容嗎？","a":"一、可以，設籍臺北市飼主可向動保處提出不擬續養寵物需求，寵物須完成晶片登記及1年內有效狂犬病預防注射證明。不擬續養寵物應先公告讓渡 45 日，無人認養才可送至臺北市動物之家辦理收容。\n二、飼主需準備寵物照片並至動保處官網-我不能飼養寵物專區內，下載及填妥文件(含14日內動物病歷摘要及血液檢驗證明書)，寄至臺北市內湖區安美街191號，或私訊至臺北市動物之家臉書粉絲專頁，以利協助刊登寵物資訊供民眾瀏覽， 45 日 內若民眾有意認養，將由服務人員代為連繫及辦理寵物轉讓登記。\n三、若刊登 45 日 後仍無人認養，飼主始可將寵物帶至動物之家收容，及完成不擬續養動物之手續，由獸醫師評估動物健康狀況及年齡收取規費8,500元或14,000元。飼主將終身無法在全臺收容所認養或飼養犬貓，且飼主必須接受包括講授及動物保護實作合計達3小時以上之講習。","u":"臺北市動物保護處動物收容組","h":38350,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=381F18634AD7361A","d":"2010-10-20","sid":"381F1863"},{"q":"有看到鴿子死亡要如何處理？","a":"1、研究顯示鳩鴿類對禽流感病毒較不敏感，因此鳩鴿類檢出禽流感之案例極少，除不易罹患禽流感外，傳播禽流感之風險亦較低。野生鳥類生長於戶外，常因覓食不易、不耐氣候變化、與車輛及建築物撞擊或受到其他野生動物攻擊等種種因素影響造成傷病及零星死亡，未必與禽流感有關。若發現零星死亡鴿子請以一般廢棄物清理即可。\n2、本處自95年起，全市列管多處監測點，並委託廠商（現為國立臺灣大學獸醫專業學院）執行採樣監測作業，另定期派員至本市鳥店、養禽戶、公園綠地及家禽批發市場等處採集檢體、送驗，每年約檢測3,000件，截至目前皆未檢出病毒，請民眾安心。","u":"臺北市動物保護處防疫檢驗組","h":30798,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2FB0360C410E288B","d":"2012-03-09","sid":"2FB0360C"},{"q":"如果想開設寵物美容工作室，需要注意什麼事項？該去哪裡詢問？有什麼樣的限制？","a":"1.寵物美容非屬特許行業，免辦特定寵物業許可證，但仍需依動物保護法相關法令維護動物福利。 2.辦理商業登記請注意商業名稱、營業項目登記、土地使用分區是否符合規定。 寵物美容於本市土地使用分區管制規則中歸屬第27組一般服務業之第19項寵物美容百貨，可設立於商業區，並附條件可設立於第3-1、3-2、4、4-1種住宅區與第2、3種工業區。 3.如欲開設，請先至本市商業處辦理「商業名稱及所營業務登記預查」，並向本市都發局營業場所預先查詢系統( https://reurl.cc/yyGaRO )查明擬設場址地點是否符合本市現行土地使用分區管制規則規定並取得證明。後依規定辦理商業設立登記申請。 4.另可參考附件「臺北市土地使用分區管制自治條例(寵物相關行業分區)1080223公告實施」","u":"臺北市動物保護處產業保育組","h":27913,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=02DF81CAE2BF2274","d":"2015-07-19","sid":"02DF81CA"},{"q":"很多人遛狗沒有繫牽繩，讓狗隨地大小便，該怎麼辦？","a":"一、如遛狗時未有防護措施，可向本處反映，依臺北市動物保護自治條例處2,000元以上10,000元以下罰鍰。 二、如遛狗時未隨手清狗便污染公共環境，可向環境保護局反映，依廢棄物清理法處1,200元以上6,000元以下罰鍰。","u":"臺北市動物保護處動物救援隊","h":21460,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=35B8D26E2E1B04E1","d":"2010-10-20","sid":"35B8D26E"},{"q":"發現有人疑似不當對待或虐待犬貓或其他人為飼養之脊椎動物，如何處理？","a":"一、應於第一時間通報警察(110)或動保處動物救援專線1959。 二、發現案件之民眾可現場記錄相關具體事證，如錄影、照片或目擊證人等資料，並提供給警察或動保處人員，經查證虐待動物屬實，將依動物保護法規定予以裁處。","u":"臺北市動物保護處動物救援隊","h":20642,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=28E633BDFC7FA3F6","d":"2013-06-24","sid":"28E633BD"},{"q":"有人餵養流浪狗造成環境髒亂，或流浪狗亂咬人，該怎麼辦？","a":"一、餵養流浪狗造成環境髒亂，可向1999或環境保護局反映協助清除，若有具體事證則可依廢棄物清理法處1,200元以上6,000元以下罰鍰。\n二、 如果流浪狗影響到居民進出之公共安全或有攻擊之虞，可撥打1999或本處動物救援專線（1959）反映，並詳述犬隻造成的問題、出沒時間、地點、動物外型及特徵，本處會依精確捕捉作業流程，確認所指犬隻確實造成問題必須移除，即派員前往執行精確捕捉，直至捕獲問題犬隻前皆不會結案，以保障市民居住安全。","u":"臺北市動物保護處動物救援隊","h":19322,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=096978BBC3EB3418","d":"2010-10-20","sid":"096978BB"},{"q":"請問寵物施打疫苗或植入晶片後，多久可以洗澡？","a":"一般建議1個星期後才洗澡，避免寵物感冒減低疫苗抗體力價或有傷口感染情形。","u":"臺北市動物保護處動物收容組","h":17962,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F6BD1A97EFDC9304","d":"2010-10-20","sid":"F6BD1A97"},{"q":"我在動物之家認養的狗狗 (貓咪)，帶回家後發現不適合或家人沒辦法接受牠，請問我可以把牠送回去嗎？","a":"一、若為本市動物之家所認養之犬貓，飼主可依規定於認養日起30日內將動物送回動物之家辦理歸還作業。\n二、認養超過1個月後逕依飼主戶籍各縣市政府規定辦理不擬繼續飼養寵物申請手續。","u":"臺北市動物保護處動物收容組","h":15603,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=A76D6EDE3FE61795","d":"2010-10-20","sid":"A76D6EDE"},{"q":"寵物走失之四種協尋方法？","a":"一、飼主可至行政院農業部建置之（寵物登記管理資訊網），按「遺失與協尋」功能選項下之「遺失申報」子功能進行遺失協尋登錄，或至住家附近特約動物醫院寵物登記站(可上本處網站之主題區/寵物登記服務項目查詢名單)協助登記遺失申報協尋，刊登資訊將公佈全國協尋，本處網站之主題區/寵物失蹤協尋亦提供有連結登錄。\n二、本市走失犬貓可至全國動物收容系統（網址： https://www.pet.gov.tw/AnimalApp/AnnounceMent_Announce.aspx）查詢每日收容公告。\n三、飼主可私訊至臺北市動物之家臉書粉絲專頁，以利協助於粉絲專頁刊登寵物資訊供民眾瀏覽，如有製作協尋傳單，可寄送至本市動物之家（臺北市內湖區安美街191號）。\n四、如遺失犬貓疑似進動物之家收容時，飼主可於動物之家開放時間週二至週日 AM 10:00-12:30 PM1:30-4:00（※國定假日無提供服務）以電話(02-87913254)詢問相關特徵、收容資訊之犬貓。並提醒您，請攜帶國民身份證等飼主證明文件，以利即時辦理領回手續。","u":"臺北市動物保護處動物收容組","h":11667,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=78FA051A62FBB4B8","d":"2020-01-22","sid":"78FA051A"},{"q":"我在我住家附近有撿到幾隻小狗，請問可以送動物之家嗎？","a":"一、如在臺北市轄內拾獲動物，可送至本市動物之家(臺北市內湖區安美街191號)收容，另依動物保護法規定，如為無主動物或經通知原飼主，自通知之日起超過7日未領回者，可公告開放民眾認養，或予以絕育或其他收容管理之必要措施。 二、如動物拾獲地點非於本市，可送至當地之動物保護防疫機關或公立動物收容所，各地收容所資訊可查閱行政院農業部動物保護資訊網站 https://animal.moa.gov.tw/Frontend/PublicShelter )。","u":"臺北市動物保護處動物收容組","h":11342,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F8D6EB77016586FA","d":"2010-10-20","sid":"F8D6EB77"},{"q":"請問動物醫院施打狂犬病苗收費方式？是否有提供補助？","a":"依據臺北市動物保護處114年5月14日動保防字第11460101472號函核備後施行「臺北市獸醫師公會開業會員（獸醫診療機構）診療費用標準」，狂犬病疫苗(含佐劑)預防接種費(含疫苗費)，收費1劑上限為新臺幣4百元，並無提供補助，其餘不含佐劑或新上市疫苗依實際狀況收費。","u":"臺北市動物保護處防疫檢驗組","h":11104,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=2FA66D5243125AB0","d":"2013-07-30","sid":"2FA66D52"},{"q":"民眾如發現受傷的野生動物該如何處置？","a":"一、野生動物是大自然生態系的一員，如在野外發現野生動物請務必遵守與野生動物的三不原則：「不干擾、不接觸、不餵食」，如在市區發現野生動物，可在附近稍做觀察，一般年幼動物通常有成年動物在附近照料，如果有發現牠們時請不要馬上出手撿拾，但如果觀察到動物確實有受傷，或受困於建築物中，可撥打1999市民熱線、動物救援專線1959由動保處動物救援隊來提供救援服務。 二、另外提醒民眾我國野生動物保育法將野生動物分為一般類及保育類，為確保本市野生動物多樣性，私自以飼養目的捕捉回家，獵捕一般類野生動物將面臨6至30萬元罰鍰，捕捉保育類野生動物則將面臨6個月以上5年以下有期徒刑，併科新臺幣20萬以上100萬以下罰金。","u":"臺北市動物保護處動物救援隊","h":10242,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8794E22DADFF0D46","d":"2015-10-28","sid":"8794E22D"},{"q":"動物一直吠叫，造成噪音擾人，可向誰反映？","a":"一、如住家養狗叫聲等不具持續性或不易量測的噪音，可向警察局反映，依社會秩序維護法第72條第3款辦理，或向大樓管理委員反映，依公寓大廈管理條例第16條規定處理。\n二、如動物係因受虐而造成之悽慘急迫吠叫，可提供相關具體事證，如錄影、照片或目擊證人等資料，向本處通報（通報電話：1959），經調查屬實，將依動物保護法規定予以裁處。","u":"臺北市動物保護處動物救援隊","h":9948,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=EBA2303AABD6EB2F","d":"2013-06-24","sid":"EBA2303A"},{"q":"臺北市動物保護處收容野生動物後續如何處理？","a":"1.本市無主或流蕩之野生動物經獸醫師檢查後，評估如狀況良好，適合野放即進行野放作業；若為受傷之動物除本處治療外，如有重症動物後送至配合之急難救傷動物醫院或臺北市動物園進行救傷、診療照護、暫時收容，俟動物體能恢復良好者，依動物生活習性於棲息地野放。 2.鑒於物種繁多，處理方式如下: (1)原生種一般類:狀況良好，原地或另擇適當環境野放；若不適合野放，另尋收容。 (2)原生種保育類:狀況良好，原地或另擇適當環境野放；若不適合野放，另尋收容。 (3)外來種一般類:本處收容或尋求相關單位協助收容。 (4)外來種保育類:尋求相關單位協助收容。 (5)人為飼養寵物:依程序公告於網站，讓原飼主或有意願認養飼主，依據動物保護法第14條規定辦理收容動物之後續認領、認養。","u":"臺北市動物保護處動物管理組","h":9510,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=663EF5AA04FD3B36","d":"2015-04-14","sid":"663EF5AA"},{"q":"經營特定寵物業買賣、寄養業務之土地使用分區限制為何？又該如何查詢特定地點之土地使用分區？","a":"1.臺北市營業性寵物買賣行為歸屬於本市土地使用分區管制規則第24組：特種零售業甲組之特定寵物零售業，其允許於第一種、第二種、第三種、第四種商業區設置，而特定寵物寄養業務歸屬於第27組：一般服務業，允許於第一種、第二種、第三種、第四種商業區設置，另併附條件允許於第三種、第三之一種、第三之二種、第四種、第四之一種住宅及第二種、第三種工業區設置。\n2.查詢特定地點之土地使用分區可至「地籍套繪都市計畫使用分區圖」。\n3.另可參考附件「臺北市土地使用分區管制自治條例(寵物相關行業分區)1080223公告實施」。","u":"臺北市動物保護處產業保育組","h":8521,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=3D4B724DFC054946","d":"2015-07-19","sid":"3D4B724D"},{"q":"請問犬貓狂犬病臨床症狀？傳染途徑？","a":"(1)臨床症狀： 犬：出現行為改變、停止吃喝，喜歡獨處、頻尿、不安、畏光、神經質具攻擊性，無目的亂叫及咬東西、全身痙攣與走路不穩，以及流口水及害怕喝水的症狀。最後會全身麻痺，昏迷死亡。 貓：類似犬，但症狀比犬更狂躁。一般症狀出現後 2-4 日即全身麻痺而死亡。 (2)傳染途徑：本病的傳播方式主要通過咬傷。患有狂犬病之動物，唾液中含有病毒，病毒隨唾液進入傷口而感染。","u":"臺北市動物保護處防疫檢驗組","h":7547,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=68E468D1533C8140","d":"2013-07-30","sid":"68E468D1"},{"q":"如何去臺北市動物之家？","a":"臺北市動物之家於新建工程完成前將於中繼園區提供服務，新址位於內湖區安美街191號(https://reurl.cc/p16dQ4)，可開車、騎機車或搭乘捷運文湖線至東湖站步行抵達。 (1)捷運：建議搭乘文湖線至東湖站，由2號出口出站，步行20分鐘，也可以尋找youbike鄰近站點騎乘自行車抵達。 (2)公車：247區間車/681-東湖站下車、53/681/279/240/247-內湖焚化廠(葫蘆洲公園)下車。 (3)動物認養便民服務計程車： 2人同行搭捷運抵達[板南線-南港展覽館站或南港站]、[文湖線-東湖站]，可致電動物之家櫃檯線02-87913254申請免費搭乘。","u":"臺北市動物保護處動物收容組","h":6757,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=69918D227CD83520","d":"2013-07-24","sid":"69918D22"},{"q":"請問動物用處方藥品有哪些？","a":"動物用藥品皆屬獸醫師處方藥品，但下列劑型除外： 1.抗感染藥：含藥飼料添加物劑型及專供觀賞魚用非注射劑型。 2.抗寄生蟲藥：外用液劑、外用散劑、條帶劑、噴霧劑及含藥飼料添加物等劑型及專供觀賞魚用非注射劑型。 另外動物因感染細菌性或黴菌性皮膚病的洗劑、和一切內服、注射用的各種藥品，均屬獸醫師處方用藥範疇，如欲購買上列處方藥品，於就醫時跟獸醫師索取處方箋，方能憑處方箋至動物用藥品販賣業者處購買，於購藥時交由動物用藥品販賣業者存查。","u":"臺北市動物保護處防疫檢驗組","h":6366,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=64DCE5EE79AF53BC","d":"2015-08-06","sid":"64DCE5EE"},{"q":"關渡自然公園之開放時間及管理處連絡方式為何？每年最適合賞鳥季節為何？","a":"1.開園時間\n平日\n自然中心 09:00-17:00\n（16:30停止售票入園）\n戶外 09:00-17:30\n假日\n夏令時段（每年4-9月）\n停止售票及關園時間\n較平日延後1小時。\n冬令時段（每年10-3月）\n停止售票及關園時間\n較平日延後半小時。\n休園時間\n每週一休園，全天不開放。\n115年2月14日-115年2月19日休園，全天不開放。\n2.管理處連絡方式：02-28587417\n3.每年最適合賞鳥季節為何？\n園區賞鳥依不同季節、時間進行賞鳥活動：\n（1）冬候鳥：以每年9月至隔年4月，主要以渡冬水鳥為主，如雁鴨科、鷸鴴科。\n（2）夏候鳥：以每年5月至8月，主要以鷺科繁殖水鳥為主。\n（3）陸鳥、留鳥、…等則無季節區分。","u":"臺北市動物保護處產業保育組","h":5578,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=B0F7682B6203E743","d":"2010-10-20","sid":"B0F7682B"},{"q":"申辦特定寵物業許可證，負責人和專任人員可否為同一人？","a":"可以，但專任人員需具備下列任一項資格： (1)領有獸醫師證書或畜牧技師證書。 (2)職業學校或高級中等學校以上，畜牧、獸醫、水產、動物相關系、科畢業。 (3)曾接受各級主管機關辦理或委辦之畜牧、獸醫、水產、動物及動物福利相關專業訓練二百小時以上，領有結業證書。","u":"臺北市動物保護處產業保育組","h":5351,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8FBF5C7087980956","d":"2015-12-01","sid":"8FBF5C70"},{"q":"哪些寵物要辦理寵物登記？在哪辦？是否收費？如果不替家犬貓辦理寵物登記有罰則嗎？","a":"在臺北市飼養犬貓都必須為牠植入晶片並完成寵物登記哦！市民可至動保處委託代辦寵物登記的登記站（如動物醫院）辦理登記，本市自97年6月1日起實行寵物登記優惠措施，至各寵物登記站辦理寵物登記收費統一為「晶片植入手續費250元」，另補發登記證收費為50元、寵物轉讓或變更登記收費為100元，寵物辦理遺失或死亡登記 (除戶) 免收費用。如經查獲未依規定為家犬、貓完成寵物登記者，可依臺北市動物保護自治條例規定處新臺幣1萬元以上5萬元以下罰鍰，並命限期改善，屆期仍未改善者，得按次處罰至改善為止。","u":"臺北市動物保護處動物管理組","h":5159,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=63B2904C35BED866","d":"2019-01-09","sid":"63B2904C"},{"q":"請問持有象牙的雕刻品是否要辦理登記？","a":"1.要 2.具備以下條件者需辦理登記 (1)為現生兩種大象之整支象牙(包括加工與未加工)之所有人或占有人 a.亞洲象(學名: Elephas maximus) b.非洲象(學名: Loxodonta africana) (2)前項所指整支象牙係同時具備下列兩項特徵 a.具備象牙牙型者 b.牙頂至底端之垂直距離在30公分以上者","u":"臺北市動物保護處產業保育組","h":5071,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=5D0315A7F6DACBBA","d":"2010-10-20","sid":"5D0315A7"},{"q":"請問如何查詢認養人是否被列入不得飼養犬貓之名單，以保障待認養動物的安全?","a":"於農委會建置之寵物登記管理資訊網之寵物登記查詢功能頁(網址： https://www.pet.gov.tw/web/o201.aspx )，輸入認養人之身分證字號及出生日期（公開頁面不須帳號密碼），即可查詢是否有違反動物保護法之紀錄而不得飼養應辦理寵物登記之動物或認養收容動物。","u":"臺北市動物保護處","h":4720,"t":"動物保護","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=F3E9201A2D2B15EF","d":"2020-05-28","sid":"F3E9201A"},{"q":"請問動物用藥品要如何取得？","a":"動物用藥品僅可由經許可的動物用藥品販賣業者販售，或獸醫師診療時調劑提供。另外依據「獸醫師（佐）處方藥品販賣及使用管理辦法」規定，處方藥品未經獸醫師（佐）處方不得買賣。所以如果要到動物用藥品販賣店家購買動物用處方藥的時候，請記得向獸醫師索取處方箋才能購買。","u":"臺北市動物保護處防疫檢驗組","h":4596,"t":"醫療衛生","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=6C413C2819ECEBD7","d":"2015-08-06","sid":"6C413C28"}]},{"org":"公共運輸處","total":143,"items":[{"q":"計程車費率如何計算？","a":"依據臺北市政府交通局111年12月22日北市交運字第1113078948號公告，臺北市計程車費率自112年4月1日零時起調整如下：\n(1)計程運價：起程1.25公里85元，續程每200公尺5元（日間）。 (2)延滯計時運價：車速每小時5公里以下，累計每60秒5元（日間）。 (3)夜間加成運價：自夜間11時起至翌晨6時止（遇跨夜間加成時段之情形，統一以「上車時間」為準），每趟次依日間運價加收20元（即起程運價1.25公里105元，續程及延滯計時運價與日間相同）。 (4)春節運價：以國定春節假起始日往前加3天至春節連假最後1日止，每趟次再加收30元。","u":"臺北市公共運輸處一般運輸科","h":546848,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=63C0CCF302898D25","d":"2023-03-13","sid":"63C0CCF3"},{"q":"若在搭乘公車時，一般悠遊卡遭鎖卡時，該如何處理？並可請誰協助解卡？","a":"一、搭乘聯營公車不會有鎖卡問題。\n二、搭乘公路客運(路線編碼為4碼者)因係採里程計費，上下車均需刷卡，若上車或下車遺忘刷卡，下次再搭乘公路客運時即遭鎖卡，解卡需洽前次搭乘公路客運公司，或洽悠遊卡公司412-8880(手機及金馬地區請加02)。\n三、搭乘公路客運被鎖卡尚未解卡前，再搭乘聯營公車、捷運均不受影響。\n四、持基北北桃都會通乘車應遵守各運具乘車刷卡規定，若該運具上下車皆須刷卡，但下車刷卡未感應成功，致使票卡鎖卡，將影響其他運具正常使用，持卡人應回原交易運具業者進行解卡，解卡不會額外扣電子錢包餘額。鎖卡後其他運具受影響情形請參閱「基北北桃都會通使用須知」附件 4。若要詢問遭鎖卡之交易紀錄，請洽詢悠遊卡客服(02-412-8880)，或至悠遊卡公司官網及 App 查詢交易紀錄，後續可洽詢遭鎖卡之運具業者如何解卡。","u":"臺北市公共運輸處綜合規劃科","h":294474,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0EE27DC48F8523C0","d":"2009-09-29","sid":"0EE27DC4"},{"q":"針對民眾要求尋找遺失於公車上物品案件，回復內容。","a":"1.本處要求本市市區公車業者接獲民眾反映尋找遺失物案件，應立即依「乘客遺失物管理辦法」辦理協尋作業，由站管人員逐一登車查檢。乘客可利用市區公車業者服務專線反映，俾使調度站能於第一時間協尋，以提供乘客良好之服務.2.本市市區公車業者服務專線：大都會客運 0800-053434（服務時段：06:00-23:00，其餘時段語音答錄）欣欣客運 0800-032159（服務時段：06:00-24:00，其餘時段語音答錄）大南汽車 0800-089456（服務時段：週一至週五08:30~22:00，其餘時段語音答錄）大有巴士 0800-088626（服務時段：24小時）光華巴士/中興巴士/新北客運 0800-002277（服務時段：週一至週五08:30~21:30，其餘時段語音答錄）指南客運/淡水客運 0800-002279（服務時段：週一至週五08:30~21:30，其餘時段語音答錄）台北客運 0800-003307（服務時段：24小時）三重客運 0800-090607（服務時段：平日06:00~23:00，其餘時段語音答錄）首都客運 0800-000866（服務時段：24小時）新店客運 2666-0678（服務時段：平日08:30~17:00，其餘時段需留言請撥2217-1448）東南汽車客運 0800-616688（服務時段：24小時）皇家客運公司 0800-551-687（服務時段：每日05:30~21:00）","u":"臺北市公共運輸處業務稽查科","h":174703,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=05487C026849977B","d":"2013-01-14","sid":"05487C02"},{"q":"市民搭乘公車，若為車上投現，不使用悠遊卡，則各年齡層的票價為何？","a":"一、年滿65歲以上之老人投現，以半票8元付費。 二、持身心障礙手冊之身心障礙者及身心障礙者經需求評估需人陪伴者，其必要陪伴者以一人為限，以半票8元付費。 三、兒童滿115公分而未滿六歲者，經出示身分證件且由已購買全票之旅客攜帶者，得免費；前項免費兒童每一旅客最多以攜帶4人為限，逾限者，應購買半票。 四、兒童滿150公分而未滿十二歲者，經出示身分證件，以半票8元付費。 五、以上使用優待票投現付費者，須出示優待身分證明文件供查驗。 六、除上開人員外，包含學生投現皆以全票15元付費。","u":"臺北市公共運輸處大眾運輸科","h":166301,"t":"社福補助","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=0F49146BC682FAB4","d":"2009-06-17","sid":"0F49146B"},{"q":"針對本市市區公車服務缺失，乘客有何申訴管道反映？需要哪些資訊？","a":"1.各市區公車業者：大都會客運0800-053434，欣欣客運0800-032159，大南汽車0800-089456，大有巴士0800-088626，光華巴士/中興巴士/新北客運0800-002277，指南客運/淡水客運0800-002-279，台北客運0800-003307，三重客運0800-090607，首都客運0800-000866，新店客運2666-0678，東南客運0800-616688，皇家客運0800-551687，臺北市公車聯營管理委員會02-2708-5976、02-2754-2812；2.臺北市公共運輸處申訴服務專線：02-2729-1181；3.臺北市市民當家熱線：1999；4.臺北市陳情系統1999：https://1999.gov.taipei；5.申訴所需資訊詳如附件。","u":"臺北市公共運輸處業務稽查科","h":122419,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=DA33EFB8B7999C0E","d":"2009-05-12","sid":"DA33EFB8"},{"q":"針對民眾反映本市市區公車過站(到站)不停案件，回復內容。","a":"1.為維護民眾搭乘安全，本處要求本市市區公車業者督促所屬駕駛長進站應確實停靠於站位處，且須緊靠路緣停車上、下客。如公車已駛離站區、或於路口停等紅燈等情形，駕駛長依規定不得提供民眾上、下車服務。2.民眾搭乘公車請於候車站位處招手示意，且下車前按下車鈴，以告知駕駛長有上車或下車需求，避免駕駛長未停站提供服務之情形。3.如民眾已確實示意搭乘，而駕駛長仍過站（到站）不停，可利用本市市區公車各業者服務專線或本處申訴服務專線2729-1181提出反映。","u":"臺北市公共運輸處業務稽查科","h":64427,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=D3A5FBAF76E85227","d":"2013-01-14","sid":"D3A5FBAF"},{"q":"計程車夜間加成時段及費用為何？","a":"一、現行本市計程車運價自112年4月1日零時起調整為：\n(1)計程運價：起程1.25公里85元，續程每200公尺5元（日間）。\n(2)延滯計時運價：車速每小時5公里以下，累計每1分鐘5元（日間）。\n(3)夜間加成運價：自夜間11時起至翌晨6時止（遇跨夜間加成時段之情形，統一以「上車時間」為準），每趟次依日間運價加收20元（即起程運價1.25公里105元，續程及延滯計時運價與日間相同）。\n二、春節運價：以國定春節連假起始日往前加3天至春節連假最後1日止，每趟次再加收30元(112年春節起實施)。","u":"臺北市公共運輸處一般運輸科","h":64425,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=8E2C782694D6EFED","d":"2009-06-17","sid":"8E2C7826"},{"q":"學生悠遊卡適用對象","a":"本市公車學生票使用對象相關規定如下：「具有教育部認可學校之正式學籍（含空中大學），並持有學生證（或國際學生證）之學生。」","u":"臺北市公共運輸處綜合規劃科","h":58799,"t":"教育文化","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&sms=87415A8B9CE81B16&s=92B8E4A9C26F9124","d":"2015-01-13","sid":"92B8E4A9"},{"q":"公車之分段點應如何查詢?","a":"分段點查詢可至「大臺北公車」網站(https://ebus.gov.taipei)，選擇所搭乘之公車路線即可得知。或可至公車站牌之路線圖上查詢。","u":"臺北市公共運輸處大眾運輸科","h":57925,"t":"交通停車","l":"https://www.gov.taipei/News_Content.aspx?n=EEC70A4186D4C828&
