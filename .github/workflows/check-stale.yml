# 智能題庫過時檢查：爬蟲每天推 data/ 之後自動跑，比對 FAQ 改版。
# 使用者決定不修題：FAQ 下架、內容有變、L0 搜不到的題目一律自動從題庫下架（記在 tools/removed.json），之後補題再出新的。
# 結果寫進 stale.json；萬一還有剩下要人看的題目才開 GitHub Issue。
name: 智能題庫過時檢查

on:
  push:
    branches: [main]
    paths: ['data/**', 'cstest.json', 'tools/faq_snapshot.json', 'tools/check_stale.py']
  schedule:
    - cron: '0 0 * * 1'   # 每週一 08:00（台北）保險再跑一次
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check-stale
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 比對 FAQ 與題庫，過時題目自動下架
        id: chk
        run: python tools/check_stale.py --prune

      - name: 有變動就寫回（題庫、快照、下架紀錄、stale.json）
        run: |
          FILES="stale.json cstest.json tools/faq_snapshot.json tools/removed.json"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $FILES
            N=$(git diff --cached --numstat tools/removed.json | awk '{print $1}')
            git commit -m "過時檢查：FAQ 改版或下架的題目自動下架（removed.json +${N:-0} 行）"
            git pull --rebase
            git push
          fi

      - name: 開／更新／關閉 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RED: ${{ steps.chk.outputs.red }}
          YELLOW: ${{ steps.chk.outputs.yellow }}
        run: |
          TITLE='智能題庫有過時題目'
          NUM=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number')
          if [ "$RED" != "0" ] || [ "$YELLOW" != "0" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file tools/過時檢查報告.md
              gh issue comment "$NUM" --body "重新檢查：🔴 $RED 題、🟡 $YELLOW 題"
            else
              gh issue create --title "$TITLE" --body-file tools/過時檢查報告.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment '重新檢查已無過時題目，自動關閉。'
          fi
