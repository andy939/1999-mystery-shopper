<title>1999 秘密客隨身腳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#e9edf3; --surface:#ffffff; --surface-2:#f4f7fa; --surface-3:#e8eef6;
  --ink:#131c26; --ink-2:#485664; --ink-3:#7a8898;
  --line:#d6dee8; --line-2:#c3cede;
  --accent:#1f4b8f; --accent-2:#2f6ac0; --accent-soft:#e6ecf8;
  --good:#146b52; --good-soft:#e2f1eb; --good-line:#8fc3b1;
  --warn:#9c5a11;
  --btn-on:#fff;
  --fs:1;
  --serif:"Noto Serif TC",Georgia,serif;
  --sans:"Noto Sans TC","Segoe UI","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0c1218; --surface:#141d26; --surface-2:#1a2430; --surface-3:#22303d;
    --ink:#e8eef5; --ink-2:#aab7c4; --ink-3:#7c8a99;
    --line:#28353f; --line-2:#36485a;
    --accent:#86adee; --accent-2:#a7c5f7; --accent-soft:#182842;
    --good:#63bd9a; --good-soft:#123028; --good-line:#2c6553;
    --warn:#e0a75c;
    --btn-on:#0c1218;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1218; --surface:#141d26; --surface-2:#1a2430; --surface-3:#22303d;
  --ink:#e8eef5; --ink-2:#aab7c4; --ink-3:#7c8a99;
  --line:#28353f; --line-2:#36485a;
  --accent:#86adee; --accent-2:#a7c5f7; --accent-soft:#182842;
  --good:#63bd9a; --good-soft:#123028; --good-line:#2c6553;
  --warn:#e0a75c;
  --btn-on:#0c1218;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:calc(15px * var(--fs));line-height:1.6;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
h1,h2{font-family:var(--serif);margin:0;text-wrap:balance}
a{overflow-wrap:anywhere}
.say,.say em,.say .cite,.legend,.probe .ask,.probe .kv,.probe .kv span,.pick .nm,.ref .rq,.sec > h2,ul.prep li,ol.pts li,.bar h1{overflow-wrap:anywhere;word-break:break-word}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 鎖住寬度：欄寬 minmax(0,1fr) 才不會被長字串撐開 */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  height:100vh;height:100dvh;width:100%;max-width:100%;overflow:hidden}

/* ---------- 頂部 ---------- */
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding:7px 10px 8px;
  display:flex;flex-direction:column;gap:5px;min-width:0}
.bar-r1{display:flex;align-items:center;gap:6px;min-width:0}
.bar .org{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;
  height:34px;min-width:40px;font-size:12.5px;font-family:var(--mono);cursor:pointer;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;padding:0 9px;text-decoration:none}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--btn-on);font-weight:600}
.iconbtn.call{background:var(--good);border-color:var(--good);color:var(--btn-on);font-weight:700;
  font-family:var(--sans);font-size:13px}
.bar h1{font-size:calc(16px * var(--fs));line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:999px;
  padding:1px 8px;color:var(--ink-2);background:var(--surface-2);flex:none}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- 內容 ---------- */
.view{display:none;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding-bottom:16px}
.view.on{display:block}
.sec{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:10px}
.sec > h2{font-size:calc(13.5px * var(--fs));padding:9px 13px;border-bottom:1px solid var(--line);
  background:var(--surface-2);display:flex;gap:8px;align-items:center}
.sec > h2 .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;flex:none}
.sec > h2 .tail{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  font-weight:400;flex:none}
.secin{padding:11px 13px 13px}
ul.prep{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:6px;
  font-size:calc(14px * var(--fs))}
ol.pts{margin:0;padding-left:21px;display:flex;flex-direction:column;gap:6px;
  font-size:calc(14px * var(--fs))}

.line{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;padding:5px 0}
.who{font-family:var(--mono);font-size:10px;color:var(--btn-on);background:var(--accent);border-radius:4px;
  height:19px;display:grid;place-items:center;margin-top:4px}
.who.ag{background:var(--good)}
.say{font-size:calc(15px * var(--fs));line-height:1.75;border-left:2px solid var(--line-2);
  padding-left:10px;min-width:0}
.line.ag .say{border-left-color:var(--good);background:var(--good-soft);border-radius:0 7px 7px 0;
  padding:5px 9px 5px 10px}
.say em{font-style:normal;color:var(--warn);font-size:12.5px;font-family:var(--mono)}
.say .mk{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--good);
  border:1px solid var(--good);border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:2px}
.say .cite{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  margin-top:2px;overflow-wrap:anywhere}
.legend{font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.7;margin:0 0 8px}
.legend b{color:var(--ink-2)}

.probe{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;
  background:var(--surface-2)}
.probe.done{opacity:.5}
.probe .top{display:flex;align-items:center;gap:8px}
.probe .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
.probe .kind{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);border-radius:4px;
  padding:0 5px;color:var(--ink-3)}
.probe .tick{margin-left:auto;width:24px;height:24px;accent-color:var(--accent);flex:none}
.probe .ask{font-size:calc(16px * var(--fs));line-height:1.65;margin:7px 0 8px;font-weight:500}
.probe .kv{font-size:calc(13px * var(--fs));line-height:1.6;color:var(--ink-2);margin:0 0 5px}
.probe .kv b{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;
  display:block;text-transform:uppercase}
.probe .kv span{color:var(--ink)}

.pick{display:flex;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);padding:12px 13px;gap:9px;align-items:baseline;cursor:pointer}
.pick:last-child{border-bottom:none}
.pick[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pick .nm{flex:1 1 auto;min-width:0;font-size:calc(14.5px * var(--fs))}
.pick .sub{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.pick .qty{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
/* 選題頁：表頭固定，清單佔滿剩餘高度且是唯一的捲動區 */
#v-pick.on{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;padding-bottom:0}
.pickhead{background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.pickhead .rowbtn{padding:10px 12px 0}
.pickhead .fields{padding:10px 12px}
.crumb{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);
  border-top:1px solid var(--line)}
.crumb .back{flex:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  width:36px;height:31px;font-size:16px;cursor:pointer;color:var(--accent);line-height:1}
.crumb .ct{font-weight:600;font-size:calc(14px * var(--fs));white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.crumb .cn{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.findbox{padding:8px 12px;background:var(--surface);border-top:1px solid var(--line)}
.btn-goall{background:var(--accent);color:var(--btn-on);border:1px solid var(--accent);
  border-radius:9px;padding:10px 14px;font-size:calc(13.5px * var(--fs));font-weight:600;cursor:pointer}
.picklist{min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;
  -webkit-overflow-scrolling:touch;padding-bottom:calc(14px + var(--safe-b))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:11px 13px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3)}
select,input[type=text]{background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;
  padding:10px;font-size:calc(14px * var(--fs));width:100%}
.wide{grid-column:1 / -1}
.rowbtn{display:flex;gap:8px;padding:0 13px 12px}
.rowbtn button{flex:1 1 0;border-radius:10px;border:1px solid var(--accent);background:var(--accent);
  color:var(--btn-on);padding:12px 0;font-weight:600;font-size:calc(14px * var(--fs));cursor:pointer}
.rowbtn button.ghost{background:transparent;color:var(--accent);border-color:var(--line-2)}
.rowbtn.three button{padding:11px 3px;font-size:calc(13px * var(--fs));white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rowbtn.three #rand-lbl{font-size:calc(12.5px * var(--fs))}

.refs{display:flex;flex-direction:column;gap:8px}
.ref{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;
  padding:9px 11px;background:var(--surface-2);min-width:0}
.ref .rq{font-size:calc(14px * var(--fs));line-height:1.55;font-weight:500}
.ref .rm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.7;
  overflow-wrap:anywhere}
.ref .rm a{color:var(--accent)}
.badge{font-family:var(--mono);font-size:10px;background:var(--accent);color:var(--btn-on);
  border-radius:4px;padding:0 5px;margin-right:6px;font-weight:600;vertical-align:1px}
.badge.b2{background:transparent;color:var(--ink-3);border:1px solid var(--line-2)}
.note{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.7;padding:0 13px 14px}

/* ---------- 底部 ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs button{background:none;border:none;padding:9px 0 8px;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;
  min-width:0;overflow:hidden}
.tabs button .ic{font-size:16px;line-height:1.1}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
.tabs button.act{color:var(--good)}
.said{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:7px 14px;
  border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;
  max-width:86vw;text-align:center}
.said.show{opacity:.95}

@media (min-width:760px){
  .app{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>

<body>
<div class="app">
  <div class="bar">
    <div class="bar-r1">
      <span class="org" id="b-org">—</span>
      <button class="iconbtn" id="b-reroll" title="換一種說法">🔄</button>
      <button class="iconbtn" id="b-fs" title="字級">A±</button>

  <!-- 選題 -->

    <div class="pickhead">
      <div class="rowbtn three">
        <button id="b-rand-org">🎲 <span id="rand-lbl">本局處</span></button>
        <button class="ghost" id="b-random2">🎲 全題庫</button>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="v-script"><span class="ic">☰</span>腳本</button>
    <button role="tab" aria-selected="false" data-v="v-probe"><span class="ic">?</span>追問</button>

  </div>

<script>
(function(){
"use strict";
var DATA={generated:'',source:'',totalFaq:0};
var ORGS=[],UNITS=[],LINK='';
function buildIndex(meta){
  DATA={generated:meta.generated,source:meta.source,totalFaq:meta.n};
  UNITS=meta.units;LINK=meta.linkPrefix;
  ORGS=[];
  for(var i=0;i<meta.orgs.length;i++){
    var o=meta.orgs[i],its=[];
    for(var j=0;j<o.items.length;j++){
      var r=o.items[j];
      its.push({q:r[0],u:UNITS[r[1]],d:r[2],h:r[3],sid:r[4],t:r[5],l:r[4]?LINK+r[4]:'',a:null});
    }
    ORGS.push({org:o.o,file:o.f,total:its.length,items:its,loaded:false});
  }
}
/* 答覆按局處分檔，選到才抓，抓過就留在記憶體 */
function ensureOrg(org,cb){
  if(!org)return cb();
  if(org.loaded)return cb();
  if(org._loading){org._q=org._q||[];org._q.push(cb);return}
  org._loading=true;org._q=[cb];
  fetch('data/'+org.file+'.json').then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(arr){
    for(var i=0;i<org.items.length;i++)org.items[i].a=arr[i]||'';
    org.loaded=true;org._loading=false;
    var q=org._q;org._q=null;
    for(var k=0;k<q.length;k++)q[k]();
  },function(){
    org._loading=false;
    for(var i=0;i<org.items.length;i++)if(org.items[i].a===null)org.items[i].a='';
    var q=org._q||[];org._q=null;
    for(var k=0;k<q.length;k++)q[k]();
    if(typeof toast==='function')toast('答覆載入失敗，請檢查網路後重新整理');
    else if(typeof flash==='function')flash('said','答覆載入失敗');
  });
}
/* ---------- 話術變體池（規則式，離線，可用種子重現） ---------- */
function mulberry32(a){return function(){
  a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
var RND=mulberry32(1);
function pick(arr){return arr[Math.floor(RND()*arr.length)]}
function shuffled(arr){
  var a=arr.slice(),i,j,t;
  for(i=a.length-1;i>0;i--){j=Math.floor(RND()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
var DISTRICTS=['信義區','內湖區','萬華區','士林區','大同區','文山區','中山區','北投區'];
var WHENS=['昨天下午','上個禮拜','前幾天','今天早上','上個月'];
var VAR={
  vague:['我不太會講，跟「{t}」有關的事情','有件事我不確定是不是你們管的，是關於{t}',
         '我要問一個{t}的問題，可是我不太會形容','就是{t}那一類的事情，我講不太清楚'],
  pause:['（停頓 2 秒，不要補充細節）','（故意停住，等對方問）','（不講地點也不講時間，等他問）',
         '（講完就安靜，看他會不會釐清）'],
  confirm:['好的，我跟您確認一下，您是想問「{q}」這部分，對嗎？',
           '我跟您重複一次，您要問的是「{q}」，是嗎？',
           '了解，所以您的問題是「{q}」，我這樣理解對嗎？',
           '我先跟您核對一下，您想了解的是「{q}」，沒錯吧？'],
  ask2:['方便先跟您確認一下時間跟地點嗎？','可以先給我您的地址或車號嗎？',
        '請問是本市哪一區的狀況？','請問這件事是什麼時候發生的？'],
  lead:['關於您問的部分，','這部分是這樣的，','我跟您說明一下，','關於這件事，'],
  more:['另外，','還有一點要提醒您，','另外要注意的是，','再補充一點，','另外還有，'],
  recap:['沒問題，我再幫您整理一次重點：','好的，重點是這樣：','我幫您歸納一下：',
         '我再跟您講一次重點：'],
  detail:['另外還有一項細節：','還有一點您可能需要知道：','另外要補充的是：'],
  ask3:['請問還有其他需要為您服務的地方嗎？','還有其他問題需要為您服務嗎？',

/* ---------- 內容產生（與桌機版同一套） ---------- */
function sentences(a){
  /* 不用 lookbehind，iOS 16.4 之前的 Safari 才不會語法錯誤 */
  var src=String(a||'').replace(/。/g,'。\n')
    .replace(/([一二三四五六七八九十]、)/g,'\n$1')
    .replace(/(（[一二三四五六七八九十\d]+）)/g,'\n$1')
    .replace(/(\(\d+\))/g,'\n$1');
  var raw=src.split(/\n+/);
  var out=[],seen={};
  for(var i=0;i<raw.length;i++){
    var t=raw[i].replace(/\s+/g,' ').trim().replace(/^[、,，。]+/,'');
    if(t.length<8||seen[t])continue;seen[t]=1;out.push(t);
  }
  if(!out.length&&String(a||'').trim())out.push(String(a).trim());
  return out;
}
function keyPoints(a){
  var s=sentences(a),out=[];
  for(var i=0;i<s.length&&out.length<8;i++)out.push(s[i].length>120?s[i].slice(0,120)+'…':s[i]);
  return out;
}
function trim(t,n){t=String(t).replace(/^[一二三四五六七八九十]、/,'').replace(/^（[^）]{1,4}）/,'')
  .replace(/^\(\d+\)/,'').trim();return t.length>n?t.slice(0,n)+'…':t}
function snip(s,rx,n){
  rx.lastIndex=0;
  var m=rx.exec(s);
  if(!m)return trim(s,n);
  var st=Math.max(0,m.index-40),en=Math.min(s.length,st+n);
  return (st>0?'…':'')+s.slice(st,en).trim()+(en<s.length?'…':'');
}
function relatedFor(item){
  var out=[],i,it;
  if(!S.org)return out;
  for(i=0;i<S.org.items.length;i++){it=S.org.items[i];
    if(it.q===item.q)continue;
    if(it.t===item.t)out.push(it);
    if(out.length>=3)break;}
  for(i=0;i<S.org.items.length&&out.length<3;i++){it=S.org.items[i];
    if(it.q===item.q||out.indexOf(it)>=0)continue;out.push(it);}
  return out;
}
function cite(f){return f.u+'〈'+(f.q.length>18?f.q.slice(0,18)+'…':f.q)+'〉'+(f.d?' '+f.d:'')+
  (f.sid?' #'+f.sid.slice(0,8):'')}
function probesFor(item){
  var txt=item.q+' '+item.a,sn=sentences(item.a),hit=[],out=[],i,j;
  for(i=0;i<PROBES.length;i++){
    if(!PROBES[i][0].test(txt))continue;
    var ans='';
    for(j=0;j<sn.length;j++)if(PROBES[i][0].test(sn[j])){ans=snip(sn[j],PROBES[i][0],120);break}
    var q=PROBES[i][1].replace('信義區',pick(DISTRICTS));
    hit.push({q:q,why:PROBES[i][2],ans:ans,src:item,kind:'主題'});
  }
  /* 命中的題目洗牌後取 3–4 題，所以同一主題每次的追問組合不同 */
  hit=shuffled(hit);
  var take=hit.length>3?(3+Math.floor(RND()*2)):hit.length;
  for(i=0;i<take;i++)out.push(hit[i]);
  if(out.length<3)out.push({q:'這件事如果我不方便自己來辦，還有沒有其他管道？',
    why:'替代管道是否主動提供',ans:'',src:item,kind:'主題'});
  var rel=relatedFor(item);
  for(i=0;i<rel.length&&i<2;i++){
    var rs=sentences(rel[i].a);
    out.push({q:'另外順便問一下，'+rel[i].q,why:'延伸題：同業務相鄰知識，測知識廣度與轉接判斷',
      ans:rs.length?trim(rs[0],120):'',src:rel[i],kind:'延伸'});
  }
  var tails=shuffled(TAIL_PROBES);
  out.push({q:tails[0][0],why:tails[0][1],ans:'',src:null,kind:'服務行為'});
  if(RND()<0.6)out.push({q:tails[1][0],why:tails[1][1],ans:'',src:null,kind:'服務行為'});
  return out;
}
function crossOrgFor(item){

    if(ORGS[i].org===S.org.org)continue;
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].t===item.t){pool.push(ORGS[i].org);break}

    mark:i===0?'答詢正確性':'',cite:'本題 FAQ 要點 '+(i+1)});
  if(p.mid)L.push({who:'客',t:p.mid,mark:'插話：測不被激怒、能否把話題導回'});
  L.push({who:'客',t:pr[0].q,mark:'追問 1'});

      mark:pr[1].ans?'應答出這段':'轉介與回電承諾',cite:pr[1].ans?cite(pr[1].src):''});
  }
  L.push({who:'客',t:p.ack,mark:'測耐心'});
  L.push({who:'員',t:pick(VAR.recap)+trim(kp[0],60)+
    (kp[1]?'；還有'+trim(kp[1],60):'')+'。',mark:'摘要複述'});
  if(kp.length>used)L.push({who:'員',t:pick(VAR.detail)+trim(kp[used],110),mark:'完整度'});
  L.push({who:'客',t:pick(VAR.understood)+'<em>（不要主動道謝，看專員是否自己問「還有其他需要嗎」）</em>'});

      (o.cite?'<span class="cite">↳ '+esc(o.cite)+'</span>':'')+'</div></div>';
  }
  s+='<p class="legend" style="margin-top:10px"><b>要測出什麼：</b>'+esc(L.test)+'<br>'+
    '<b>情境設計：</b>'+esc(L.design)+'</p>';
  h+=sec('01','完整對話模擬',S.dl.length+' 句',s);

  h+=sec('02','撥號前準備','',
    '<ul class="prep"><li>現在時段 <b>'+esc(W.n)+'</b>（自動判斷）：'+esc(W.hint)+'</li>'+
    '<li>身分 <b>'+esc(p.n)+'</b>：'+esc(p.tone)+'</li>'+
    (p.limit?'<li style="color:var(--warn)"><b>界線</b>：'+esc(p.limit)+'</li>':'')+
    '<li>秒錶記三個時間點：撥通 → 語音選單結束 → 真人應答。</li>'+
    '<li>備一個假地址（行政區層級即可），不提供真實個資。</li></ul>');

  var kp=keyPoints(item.a);
  s='<ol class="pts">';
  for(i=0;i<kp.length;i++)s+='<li>'+esc(kp[i])+'</li>';
  h+=sec('03','標準答案全要點',kp.length+' 點',s+'</ol>');

  var rel=relatedFor(item),refs=[{f:item,use:'主問句、專員答覆、追問正解'}],r;
  for(i=0;i<rel.length&&i<2;i++)refs.push({f:rel[i],use:'延伸追問題源'});
  for(i=2;i<rel.length;i++)refs.push({f:rel[i],use:'備用題（可換題再撥）'});
  s='<div class="refs">';
  for(i=0;i<refs.length;i++){
    r=refs[i].f;
    s+='<div class="ref"><div class="rq">'+(i===0?'<span class="badge">主題</span>':
      '<span class="badge b2">參考</span>')+esc(r.q)+'</div>'+
      '<div class="rm">'+esc(r.u)+' · 發布 '+esc(r.d||'—')+' · 點閱 '+num(r.h)+
      (r.sid?' · ID '+esc(r.sid.slice(0,8)):'')+'</div><div class="rm">用途：'+esc(refs[i].use)+'</div>'+
      (r.l?'<div class="rm"><a href="'+esc(r.l)+'" target="_blank" rel="noopener">開啟原始問答頁 ↗</a></div>':'')+
      '</div>';
  }
  h+=sec('04','參考 FAQ 來源',refs.length+' 則',s+'</div>');
  h+='<p class="note">題庫：'+esc(DATA.source)+'（'+esc(DATA.generated)+' 匯出，共 '+
    num(DATA.totalFaq)+' 題）。專員台詞全部取自上列 FAQ 原文。</p>';
  el('v-script').innerHTML=h;
  el('v-script').scrollTop=0;
}

/* ---------- 追問頁 ---------- */
function renderProbes(){
  var pr=S.pr||probesFor(S.item),h='<div class="secin">',i;
  for(i=0;i<pr.length;i++){
    h+='<div class="probe" data-p="'+i+'">'+
      '<div class="top"><span class="n">追問 '+(i+1)+'</span><span class="kind">'+esc(pr[i].kind)+
      '</span><input type="checkbox" class="tick" data-ask="'+i+'"></div>'+
      '<p class="ask">「'+esc(pr[i].q)+'」</p>'+
      '<p class="kv"><b>測什麼</b><span>'+esc(pr[i].why)+'</span></p>'+
      '<p class="kv"><b>正解應含</b><span>'+esc(pr[i].ans||
        '標準答案未載明——聽專員是否誠實說「幫您確認後回電」，而不是自行推測。')+'</span></p>'+
      '<p class="kv"><b>依據 FAQ</b><span>'+(pr[i].src?esc(cite(pr[i].src)):'無（純服務行為觀察題）')+
      '</span></p></div>';
  }
  el('v-probe').innerHTML=h+'</div>';
  el('v-probe').scrollTop=0;
}

/* ---------- 選題清單（單一捲動區，局處 → 主題 逐層進入） ---------- */
function filterOrgs(kw){
  if(!kw)return ORGS.slice();
  var out=[];
  for(var i=0;i<ORGS.length;i++)if(ORGS[i].org.indexOf(kw)>=0)out.push(ORGS[i]);
  return out;
}
function renderOrgList(list){
  var html='',i;
  for(i=0;i<list.length;i++){
    var o=list[i];
    html+='<button class="pick" data-org="'+esc(o.org)+'" aria-current="'+(S.org&&S.org.org===o.org)+
      '"><span class="nm">'+esc(o.org)+'</span><span class="qty">'+o.total+'</span></button>';
  }
  el('org-list').innerHTML=html||'<div class="note" style="padding:18px 14px">'+
    '沒有這個局處。換個字，或直接打題目關鍵字（例如 拖吊、特休）找題目。</div>';
  el('org-list').hidden=false;el('topic-list').hidden=true;
  el('crumb-t').textContent='選局處';
  el('crumb-n').textContent=list.length+' 個局處';
  el('b-back').hidden=true;
  keepCurrentInView();
}
function renderTopicList(kw,scope){
  var items=[],html='',i,j;
  if(scope==='all'){
    outer:for(i=0;i<ORGS.length;i++)for(j=0;j<ORGS[i].items.length;j++){
      if(ORGS[i].items[j].q.indexOf(kw)>=0)items.push([ORGS[i],ORGS[i].items[j]]);
      if(items.length>=200)break outer;
    }
  }else if(S.org){
    for(i=0;i<S.org.items.length;i++){
      var it=S.org.items[i];
      if(kw&&it.q.indexOf(kw)<0&&!(it.a&&it.a.indexOf(kw)>=0))continue;
      items.push([S.org,it]);
    }
  }
  for(i=0;i<items.length;i++){
    var org=items[i][0],item=items[i][1];
    html+='<button class="pick" data-org="'+esc(org.org)+'" data-q="'+esc(item.q)+'" aria-current="'+
      (S.item&&S.item.q===item.q)+'"><span class="nm">'+esc(item.q)+
      '<span class="sub">'+esc(item.t)+' · 點閱 '+num(item.h)+
      (scope==='all'?' · '+esc(org.org):'')+'</span></span></button>';
  }
  el('topic-list').innerHTML=html||('<div class="note" style="padding:18px 14px">'+'這個局處裡沒有「'+esc(kw)+'」相關題目。'+'<br><br><button class="btn-goall" data-goall="1">改在全題庫找「'+esc(kw)+'」</button></div>');
  el('topic-list').hidden=false;el('org-list').hidden=true;
  if(scope==='all'){
    el('crumb-t').textContent='全題庫找題目：'+kw;
    el('crumb-n').textContent=items.length+' 題'+(items.length>=200?'（前 200）':'');
  }else{
    el('crumb-t').textContent=S.org?S.org.org:'選主題';
    el('crumb-n').textContent=items.length+' 題'+(kw?'／共 '+S.org.total:'（全部）');
  }
  el('b-back').hidden=false;
  keepCurrentInView();
}
/* 回到選題時把選中的那一筆捲到畫面中央 */
function keepCurrentInView(){
  var host=el('pick-list'),cur=host.querySelector('[aria-current="true"]');
  if(!cur){host.scrollTop=0;return}
  var top=cur.offsetTop-(host.clientHeight/2)+(cur.offsetHeight/2);
  host.scrollTop=top>0?top:0;
}
function renderPick(){
  var kw=el('f-find')?el('f-find').value.trim():'';
  if(S.pickMode==='topic'){renderTopicList(kw,'org');return}
  if(S.pickMode==='search'){renderTopicList(kw,'all');return}
  var orgs=filterOrgs(kw);
  if(kw&&!orgs.length){S.pickMode='search';renderTopicList(kw,'all');return}
  renderOrgList(orgs);
}
function backPick(){
  S.pickMode='org';
  var f=el('f-find');
  if(f){f.value='';f.placeholder='找局處或題目，例如 勞動、拖吊';}
  renderPick();
}

/* ---------- 複製 ---------- */
function unem(t){return String(t).replace(/<em>/g,'').replace(/<\/em>/g,'')}
function plainScript(){
  var item=S.item,p=PERSONAS[S.persona],L=LEVELS[S.level],W=WINDOWS[S.win],i;
  var out=['1999 秘密客測試腳本','局處：'+S.org.org+'（'+item.u+'）','題目：'+item.q,
    '情境：'+L.n+'｜身分：'+p.n+'｜時段：'+W.n+'｜腳本編號 #'+S.seed,
    (p.limit?'界線：'+p.limit:''),'','【完整對話模擬】'];
  for(i=0;i<S.dl.length;i++){
    out.push(S.dl[i].who+'：'+unem(S.dl[i].t)+(S.dl[i].mark?'　〔'+S.dl[i].mark+'〕':''));
    if(S.dl[i].cite)out.push('    ↳ 依據：'+S.dl[i].cite);
  }
  out.push('','【追問清單】');
  var pr=S.pr||probesFor(item);
  for(i=0;i<pr.length;i++){
    out.push((i+1)+'. 「'+pr[i].q+'」（'+pr[i].kind+'）');
    out.push('   測什麼：'+pr[i].why);
    out.push('   正解應含：'+(pr[i].ans||'標準答案未載明'));
    out.push('   依據 FAQ：'+(pr[i].src?cite(pr[i].src):'無'));
  }
  out.push('','【標準答案全要點】');
  var kp=keyPoints(item.a);
  for(i=0;i<kp.length;i++)out.push((i+1)+'. '+kp[i]);
  out.push('','【參考 FAQ 來源】','・主題：'+cite(item)+(item.l?'\n  '+item.l:''));
  var rel=relatedFor(item);
  for(i=0;i<rel.length;i++)out.push('・'+(i<2?'延伸':'備用')+'：'+cite(rel[i])+
    (rel[i].l?'\n  '+rel[i].l:''));
  return out.join('\n');
}
function copyText(t){
  function fb(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('腳本已複製')}catch(e){toast('複製失敗')}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){toast('腳本已複製')},fb);
  else fb();
}

/* ---------- 選題／重繪 ---------- */
function rebuild(){
  S.win=currentWindow();
  var item=S.item,L=LEVELS[S.level],p=PERSONAS[S.persona],W=WINDOWS[S.win];
  RND=mulberry32(S.seed);
  S.pr=probesFor(item);
  S.dl=dialogue(item,S.pr);S.asked={};
  el('b-org').textContent=S.org.org+' ／ '+item.u;
  el('b-q').textContent=item.q;
  var lbl=el('rand-lbl');
  if(lbl)lbl.textContent=S.org?(S.org.org.length>4?S.org.org.slice(0,4):S.org.org):'本局處';
  el('b-chips').innerHTML='<span class="chip on">'+esc(L.n)+'</span><span class="chip">'+esc(p.n)+
    '</span><span class="chip">現在：'+esc(W.n)+'</span><span class="chip" id="chip-seed" style="cursor:pointer;border-color:var(--accent);color:var(--accent)" title="點我輸入編號重現同一份腳本">腳本 #'+S.seed+
    '</span><span class="chip">'+esc(item.t)+
    '</span><span class="chip">點閱 '+num(item.h)+'</span>';
  renderScript();renderProbes();
  lsSet(LSL,{org:S.org.org,q:item.q,persona:S.persona,level:S.level,win:S.win,fs:S.fs});
}
function selectOrg(name){
  for(var i=0;i<ORGS.length;i++)if(ORGS[i].org===name){S.org=ORGS[i];break}
  S.pickMode='topic';
  var f=el('f-find');
  if(f){f.value='';f.placeholder='在「'+S.org.org+'」裡面找…';}
  el('crumb-t').textContent=S.org.org;
  el('crumb-n').textContent='載入中…';
  el('b-back').hidden=false;
  ensureOrg(S.org,function(){S.item=S.org.items[0];renderPick();rebuild()});
}
function selectItem(orgName,q){
  var found=null,i,j;
  for(i=0;i<ORGS.length;i++)if(ORGS[i].org===orgName){
    S.org=ORGS[i];
    for(j=0;j<ORGS[i].items.length;j++)if(ORGS[i].items[j].q===q){found=ORGS[i].items[j];break}
    break;}
  if(!S.org)S.org=ORGS[0];
  var want=found||S.org.items[0];
  if(S.pickMode==='org')S.pickMode='topic';
  ensureOrg(S.org,function(){S.item=want;renderPick();rebuild()});
}
function randomPick(orgOnly){
  var i,org;
  if(orgOnly&&S.org){
    org=S.org;
  }else{
    var wsum=0;
    for(i=0;i<ORGS.length;i++)wsum+=ORGS[i].total;
    var r=Math.random()*wsum,acc=0;org=ORGS[0];
    for(i=0;i<ORGS.length;i++){acc+=ORGS[i].total;if(r<=acc){org=ORGS[i];break}}
  }
  var it=org.items[Math.floor(Math.random()*org.items.length)];
  var lv=['L1','L1','L1','L2','L2','L2','L2','L3','L3','L4'],
      pk=Object.keys(PERSONAS),wk=Object.keys(WINDOWS);
  S.level=lv[Math.floor(Math.random()*lv.length)];
  S.persona=pk[Math.floor(Math.random()*pk.length)];
  el('f-level').value=S.level;el('f-persona').value=S.persona;
  S.pickMode='topic';
  var ff=el('f-find');
  if(ff){ff.value='';ff.placeholder='在「'+org.org+'」裡面找…';}
  selectItem(org.org,it.q);
  showView('v-script');
  toast((orgOnly?'本局處抽出：':'抽出：')+org.org+' · '+S.level);
}
function showView(id){
  var vs=document.querySelectorAll('.view'),tb=document.querySelectorAll('.tabs button[data-v]'),i;
  for(i=0;i<vs.length;i++)vs[i].classList.toggle('on',vs[i].id===id);
  for(i=0;i<tb.length;i++)tb[i].setAttribute('aria-selected',String(tb[i].getAttribute('data-v')===id));
}

/* ---------- 螢幕不休眠 ---------- */
var wl=null;
function toggleWake(){
  var b=el('b-wake');
  if(wl){try{wl.release()}catch(e){}wl=null;b.classList.remove('on');toast('螢幕休眠恢復正常');return}
  if(!('wakeLock' in navigator)){toast('此瀏覽器不支援螢幕保持喚醒');return}
  navigator.wakeLock.request('screen').then(function(s){
    wl=s;b.classList.add('on');toast('通話期間螢幕不會自動關閉');
    s.addEventListener('release',function(){wl=null;b.classList.remove('on')});
  },function(){toast('無法啟用（請確認畫面在前景）')});
}

/* ---------- init ---------- */
function fillSelect(id,obj,val){
  var s=el(id),h='',k;
  for(k in obj)h+='<option value="'+k+'">'+esc(obj[k].n)+'</option>';
  s.innerHTML=h;s.value=val;
}
function init(){
  fillSelect('f-persona',PERSONAS,S.persona);
  fillSelect('f-level',LEVELS,S.level);
  var last=lsGet(LSL,null);
  if(last){
    if(last.persona&&PERSONAS[last.persona]){S.persona=last.persona;el('f-persona').value=S.persona}
    if(last.level&&LEVELS[last.level]){S.level=last.level;el('f-level').value=S.level}
    if(last.fs){S.fs=last.fs;document.documentElement.style.setProperty('--fs',S.fs)}
  }
  renderPick();
  if(last&&last.org){
    for(var k2=0;k2<ORGS.length;k2++)if(ORGS[k2].org===last.org){S.org=ORGS[k2];break}
    if(!S.org)S.org=ORGS[0];
    S.pickMode='topic';
    var f2=el('f-find');
    if(f2)f2.placeholder='在「'+S.org.org+'」裡面找…';
    selectItem(S.org.org,last.q);
  }else{
    S.org=ORGS[0];
    ensureOrg(S.org,function(){S.item=S.org.items[0];rebuild()});
  }

  el('pick-list').addEventListener('click',function(e){
    var t=e.target.closest('[data-q]');
    if(t){selectItem(t.getAttribute('data-org'),t.getAttribute('data-q'));showView('v-script');return}
    var o=e.target.closest('[data-org]');
    if(o){selectOrg(o.getAttribute('data-org'));return}
    var g=e.target.closest('[data-goall]');
    if(g){S.pickMode='search';renderPick();}});
  el('b-back').addEventListener('click',backPick);
  el('v-probe').addEventListener('change',function(e){
    var t=e.target,k=t.getAttribute&&t.getAttribute('data-ask');
    if(k===null||k===undefined)return;
    S.asked[k]=t.checked;t.closest('.probe').classList.toggle('done',t.checked);});
  el('f-persona').addEventListener('change',function(){S.persona=this.value;rebuild()});
  el('f-level').addEventListener('change',function(){S.level=this.value;rebuild()});
  var ft=null;
  el('f-find').addEventListener('input',function(){
    clearTimeout(ft);ft=setTimeout(function(){
      if(S.pickMode==='search'&&!el('f-find').value.trim())S.pickMode='org';
      renderPick();},130);});
  el('b-random').addEventListener('click',function(){randomPick(false)});
  el('b-random2').addEventListener('click',function(){randomPick(false)});
  el('b-rand-org').addEventListener('click',function(){
    if(!S.org){toast('請先選一個局處');return}
    randomPick(true);});
  el('b-copy').addEventListener('click',function(){copyText(plainScript())});
  el('b-reroll').addEventListener('click',function(){
    S.seed=1000+Math.floor(Math.random()*9000);rebuild();toast('換了說法 · 腳本 #'+S.seed);});
  el('b-wake').addEventListener('click',toggleWake);
  el('b-fs').addEventListener('click',function(){
    var order=[1,1.12,1.26,.9],i=order.indexOf(S.fs);
    S.fs=order[(i+1)%order.length];
    document.documentElement.style.setProperty('--fs',S.fs);
    lsSet(LSL,{org:S.org.org,q:S.item.q,persona:S.persona,level:S.level,win:S.win,fs:S.fs});
    toast('字級 '+Math.round(S.fs*100)+'%');});

  el('b-chips').addEventListener('click',function(e){
    if(!e.target.closest('#chip-seed'))return;
    var v=window.prompt('輸入腳本編號可重現同一份腳本（1000–9999）：',S.seed);
    if(v===null)return;
    v=parseInt(v,10);
    if(!v||v<1)return;
    S.seed=v;rebuild();});
  var tb=document.querySelectorAll('.tabs button[data-v]'),i;
  for(i=0;i<tb.length;i++)tb[i].addEventListener('click',function(){
    showView(this.getAttribute('data-v'))});
}
function boot(){
  fetch('data/index.json').then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(meta){
    buildIndex(meta);
    init();
  },function(){
    var t=document.querySelector('.bar h1')||document.querySelector('.sh-top h2');
    if(t)t.textContent='題庫載入失敗，請確認網路後重新整理';
  });
}
boot();
})();
</script>
